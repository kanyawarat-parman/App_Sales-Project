<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตั้งค่าวิธีคิดเวร</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="shared/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css?v=16">
</head>
<body class="bg-slate-50 font-sans">
<div id="app">
  <div v-if="!authReady" class="min-h-screen flex items-center justify-center">
    <div class="spinner w-12 h-12"></div>
  </div>

  <template v-else>
    <app-nav :user="currentUser" page="rotation-settings" ref="nav"></app-nav>

    <div class="min-h-screen flex flex-col">
      <header class="bg-white border-b border-slate-100 px-5 py-3 flex items-center gap-3 shadow-sm min-h-[64px]">
        <h1 class="text-base font-bold text-slate-700 flex items-center gap-2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
          ตั้งค่าวิธีคิดเวร
        </h1>
      </header>

      <main class="flex-1 w-full max-w-[1600px] mx-auto px-4 py-5 md:px-6 md:py-6">
        <div class="flex flex-col gap-5 max-w-[900px] mx-auto">

        <p class="text-sm text-slate-500">ตั้งค่าวิธีมอบหมายงานให้ Sale ของแต่ละแหล่งงานประมูล — เลือกวิธีคิดเวร ปฏิทินอ้างอิง และลำดับคนเวร ก่อนไปสร้างตารางเวรจริงที่หน้าสร้างเวรรายปี</p>

        <!-- เลือกแหล่งงานที่จะตั้งค่าเวร — แต่ละแหล่งมีชุดตั้งค่าเป็นของตัวเอง (rotation_configs) ไม่ต้องมีเมนูแยกทีละแหล่ง
             ค่าเริ่มต้นมาจาก ?source=xxx ใน URL (เช่น กดมาจากปุ่ม "ตั้งค่าเวร" ในหน้า sources.html) แต่ยังเลือกแหล่งอื่นจากตรงนี้ได้เผื่อเข้าหน้านี้ตรงๆ จากเมนู -->
        <div class="flex items-center gap-2">
          <label class="text-sm font-semibold text-slate-600 shrink-0">แหล่งงาน:</label>
          <select v-model="sourceType" @change="onSourceChange"
            class="flex-1 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
            <option v-for="s in sourcesList" :key="s.source_type" :value="s.source_type">{{ s.label }}</option>
          </select>
        </div>

        <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100">
          <div class="flex items-center gap-2 px-5 py-4 border-b border-slate-100 font-bold text-slate-700">
            <span class="w-8 h-8 rounded-lg bg-teal-50 text-teal-700 flex items-center justify-center shrink-0">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path stroke-linecap="round" d="M3 11V9a4 4 0 014-4h14"/><polyline points="7 23 3 19 7 15"/><path stroke-linecap="round" d="M21 13v2a4 4 0 01-4 4H3"/></svg>
            </span>
            การมอบหมายงานให้ Sale — {{ sourceLabel }}
          </div>
          <div class="p-5 flex flex-col gap-5">

            <!-- Method -->
            <div class="flex flex-col gap-1.5">
              <label class="block text-sm font-semibold text-slate-600">วิธีการมอบหมายงาน</label>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-1">
                <label class="flex items-start gap-2.5 cursor-pointer px-3 py-2.5 rounded-lg border-2 transition-all"
                       :class="settings.method==='roundrobin' ? 'border-blue-500 bg-blue-50' : 'border-slate-200 bg-white'">
                  <input type="radio" v-model="settings.method" value="roundrobin" class="mt-0.5 shrink-0 accent-blue-600">
                  <div>
                    <div class="text-sm font-semibold text-blue-800">วนเวียนตามเวร (Round-Robin)</div>
                    <div class="text-xs text-slate-500 mt-0.5">แจกทีละคน วนซ้ำตามลำดับ · ไม่คำนึงถึงจำนวนงานที่มีอยู่</div>
                  </div>
                </label>
                <label class="flex items-start gap-2.5 cursor-pointer px-3 py-2.5 rounded-lg border-2 transition-all"
                       :class="settings.method==='workload' ? 'border-blue-500 bg-blue-50' : 'border-slate-200 bg-white'">
                  <input type="radio" v-model="settings.method" value="workload" class="mt-0.5 shrink-0 accent-blue-600">
                  <div>
                    <div class="text-sm font-semibold text-blue-800">วนเวียน + จำกัดภาระงาน</div>
                    <div class="text-xs text-slate-500 mt-0.5">ถ้างาน active ≥ จำนวนที่กำหนด → ข้ามไปคนถัดไปในเวร</div>
                  </div>
                </label>
              </div>
              <!-- Workload cap -->
              <div v-if="settings.method==='workload'" class="flex items-center gap-3 mt-2">
                <label class="text-sm font-semibold text-slate-600 shrink-0">จำนวนงาน active สูงสุดต่อคน</label>
                <input type="number" v-model.number="settings.workload_cap" min="1" max="99"
                       class="w-24 border border-slate-200 rounded-xl px-3.5 py-2 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
                <span class="text-xs text-slate-500">งาน (ถ้าทุกคนเต็ม → ใช้เวรปกติ)</span>
              </div>
            </div>

            <hr class="border-slate-100">

            <!-- ปฏิทินอ้างอิง (ใช้ตัวเดียวทั้งเช็ควันประกาศและคำนวณเวร) + วันหยุดพิเศษ วางคู่กันเพราะเกี่ยวข้องกันโดยตรง -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
              <div class="flex flex-col gap-1">
                <label class="block text-sm font-semibold text-slate-600">ปฏิทินอ้างอิง</label>
                <select v-model="calendarCode"
                  class="border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white mt-1">
                  <option v-for="cal in calendarsList" :key="cal.code" :value="cal.code">{{ cal.name }}</option>
                </select>
                <div v-if="selectedCalendar" class="flex gap-1 flex-wrap mt-1.5">
                  <span v-for="d in workDayLabels(selectedCalendar.work_days)" :key="d"
                    class="inline-block text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-teal-50 text-teal-700">{{ d }}</span>
                </div>
                <p class="text-xs text-slate-400 mt-1">ใช้เช็คว่าวันนี้แหล่งงาน "{{ sourceLabel }}" ประกาศงานหรือไม่ และใช้คำนวณเวรของแหล่งนี้ด้วยกัน — แก้วันทำงานได้ที่หน้า <a href="calendars.html" class="text-blue-600 hover:underline">ปฏิทินการทำงาน</a></p>
              </div>

              <!-- Holidays: ย้ายไปจัดการที่หน้าวันหยุดแทน -->
              <div class="flex flex-col gap-1">
                <label class="block text-sm font-semibold text-slate-600">วันหยุดพิเศษ</label>
                <a :href="`holidays.html?calendar=${calendarCode}`"
                   class="inline-flex items-center gap-1.5 text-sm text-blue-600 hover:underline w-fit mt-2.5">
                  📅 จัดการวันหยุด →
                </a>
              </div>
            </div>

            <hr class="border-slate-100">

            <!-- Start date -->
            <div class="flex flex-col gap-1">
              <label class="block text-sm font-semibold text-slate-600">วันเริ่มนับเวร</label>
              <input type="date" v-model="settings.start_date"
                class="max-w-[220px] border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white mt-1">
              <p class="text-xs text-slate-400">วันทำการแรกในตารางเวร — ระบบนับต่อเนื่องเฉพาะวันทำงานที่เลือกไว้</p>
            </div>

            <hr class="border-slate-100">

            <!-- Rotation order — ใช้เลขวงกลมแทนข้อความ "ลำดับที่ N" ซ้ำๆ ให้กวาดสายตาดูลำดับได้ไวขึ้น -->
            <div class="flex flex-col gap-1">
              <label class="block text-sm font-semibold text-slate-600">ลำดับเวร</label>
              <div class="flex flex-col gap-2 mt-1">
                <div v-for="(uid, i) in settings.user_ids" :key="i" class="flex items-center gap-2.5">
                  <span class="w-7 h-7 rounded-full bg-teal-50 text-teal-700 flex items-center justify-center text-sm font-bold shrink-0">{{ i+1 }}</span>
                  <select v-model="settings.user_ids[i]"
                    class="flex-1 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
                    <option v-for="u in salesUsers" :key="u.id" :value="u.id">{{ u.full_name }}</option>
                  </select>
                  <button type="button" v-if="settings.user_ids.length > 1"
                    @click="settings.user_ids.splice(i,1)"
                    class="px-2 py-1.5 border border-red-100 rounded-lg bg-white text-red-400 cursor-pointer text-sm shrink-0 hover:bg-red-50">✕</button>
                </div>
              </div>
              <button type="button" @click="addUser"
                class="mt-2 text-sm text-blue-600 bg-transparent border border-dashed border-blue-200 rounded-lg px-3 py-2 cursor-pointer w-full hover:bg-blue-50 transition-colors">
                + เพิ่มคนในเวร
              </button>
              <div class="mt-1.5 bg-green-50 rounded-lg px-3 py-2 text-sm text-green-700">
                วันทำการที่ 1 → ลำดับที่ 1 · วันที่ 2 → ลำดับที่ 2 · วนซ้ำอัตโนมัติ
              </div>
            </div>

            <!-- Save -->
            <div class="flex items-center justify-end gap-3 pt-1">
              <!-- 2 กรณี: ยังไม่เคยตั้งค่าเวร (ไม่มีวันเริ่มนับ/รายชื่อ) → บอกให้กรอกแล้วบันทึกก่อน ยังไปสร้างเวรรายปีไม่ได้
                   ตั้งค่าไว้แล้วจริง (เช็คจากข้อมูลที่โหลดมา ไม่ใช่แค่ session ที่เพิ่งกดบันทึก) → กดไปดู/สร้างเวรรายปีได้ตลอดเวลา -->
              <span v-if="!isConfigured" class="text-xs text-slate-400">กรอกข้อมูลด้านบนให้ครบแล้วกดบันทึกก่อน จึงจะไปสร้างเวรรายปีได้</span>
              <a v-else :href="`duty-calendar.html?source=${sourceType}`"
                class="inline-flex items-center justify-center gap-1.5 px-5 py-2.5 rounded-xl text-sm font-semibold bg-white ring-1 ring-teal-200 text-teal-700 hover:bg-teal-50 no-underline">
                ไปสร้างเวรรายปี →
              </a>
              <button @click="saveSettings" :disabled="saving"
                class="inline-flex items-center justify-center gap-1.5 px-6 py-2.5 rounded-xl text-sm font-semibold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed min-w-[110px]">
                <span v-if="saving">กำลังบันทึก…</span>
                <span v-else>บันทึก</span>
              </button>
            </div>

          </div>
        </div>

        </div>
      </main>
    </div>

    <app-modal ref="appModal"></app-modal>
  </template>
</div>

<script src="shared/vue.global.prod.js"></script>
<script src="shared/app.js?v=33"></script>
<script>
const { createApp } = Vue;
window.appVue = createApp({
  components: { AppNav, AppModal },
  data() {
    return {
      authReady: false,
      currentUser: null,
      modal: { type: null, data: null },
      sourceType: 'egp', // แหล่งงานที่กำลังตั้งค่าเวรอยู่ — เลือกได้จาก dropdown ในหน้า (ค่าเริ่มต้นมาจาก ?source=xxx ใน URL ถ้ามี) แต่ละแหล่งมีชุดตั้งค่าเป็นของตัวเอง (rotation_configs)
      sourcesList: [], // จาก api/sources.php — master list แหล่งงานทั้งหมด ไม่ hardcode ชื่อ/รายการที่นี่
      settings: {
        method: 'roundrobin', workload_cap: 5,
        start_date: '', user_ids: [],
      },
      salesUsers: [],
      calendarsList: [],
      calendarCode: '', // ปฏิทินอ้างอิงของแหล่งงานนี้ (announcement_sources.calendar_code) — ตัวเดียวใช้ทั้งเช็ควันประกาศและคำนวณเวร (ยุบมาจาก 2 ช่องแยกกันเดิม 2026-08-30)
      saving: false,
    };
  },
  computed: {
    selectedCalendar() {
      return this.calendarsList.find(c => c.code === this.calendarCode) || null;
    },
    sourceLabel() {
      return this.sourcesList.find(s => s.source_type === this.sourceType)?.label || this.sourceType;
    },
    // เคยตั้งค่าเวรของแหล่งงานนี้ไว้จริงหรือยัง (มีวันเริ่มนับ + รายชื่ออย่างน้อย 1 คน) — เช็คจากข้อมูลที่โหลดมาจริง
    // ไม่ใช่แค่ session นี้เพิ่งกดบันทึก เพราะ generateYear() ฝั่ง backend ต้องการ 2 ค่านี้เป็นอย่างต่ำ ถ้าไม่มีจะ error ทันที
    isConfigured() {
      return !!this.settings.start_date && this.settings.user_ids.length > 0;
    },
  },
  async mounted() {
    try {
      const res = await apiCall('GET', 'api/auth.php?action=me');
      if (!res.success) { window.location.href = 'login.html'; return; }
      this.currentUser = res.data;
      if (!['admin','salesadmin'].includes(this.currentUser.role)) {
        window.location.href = 'dashboard.html'; return;
      }
    } catch { window.location.href = 'login.html'; return; }
    await this.loadSources();
    this.sourceType = new URLSearchParams(window.location.search).get('source') || this.sourcesList[0]?.source_type || 'egp';
    this.syncCalendarCode();
    this.authReady = true;
    await Promise.all([this.loadSettings(), this.loadSales(), this.loadCalendars()]);
  },
  methods: {
    ...SharedMethods,

    // แปลง work_days ("1,2,3,4,5") ของปฏิทิน เป็นชื่อวันย่อภาษาไทย เหมือน calendars.html/holidays.html
    workDayLabels(workDays) {
      const dayNames = { 1:'จ', 2:'อ', 3:'พ', 4:'พฤ', 5:'ศ', 6:'ส', 7:'อา' };
      return (workDays || '').split(',').filter(Boolean).map(n => dayNames[n]);
    },

    async loadSources() {
      const r = await apiCall('GET', 'api/sources.php?action=list');
      this.sourcesList = r.success ? r.data : [];
    },

    // ปฏิทินอ้างอิงของแหล่งงานที่กำลังเลือกอยู่ (announcement_sources.calendar_code) — ดึงจาก sourcesList ที่โหลดมาแล้ว ไม่ต้องยิง API ซ้ำ
    syncCalendarCode() {
      this.calendarCode = this.sourcesList.find(s => s.source_type === this.sourceType)?.calendar_code || 'CAL-01';
    },

    // เปลี่ยนแหล่งงานในหน้าเดียวกัน — โหลดชุดตั้งค่าของแหล่งใหม่มาแทน ไม่ต้องเปลี่ยนหน้า/URL
    async onSourceChange() {
      const url = new URL(window.location.href);
      url.searchParams.set('source', this.sourceType);
      window.history.replaceState({}, '', url);
      this.syncCalendarCode();
      await this.loadSettings();
    },

    async loadCalendars() {
      const r = await apiCall('GET', 'api/calendars.php?action=list');
      this.calendarsList = r.success ? r.data : [];
    },

    async loadSettings() {
      const r = await apiCall('GET', `api/rotation.php?action=config&source_type=${this.sourceType}`);
      if (r.success) {
        this.settings = {
          method:       r.data.method || 'roundrobin',
          workload_cap: r.data.workload_cap || 5,
          start_date:   r.data.start_date || '',
          user_ids:     [...(r.data.user_ids || [])],
        };
      }
    },

    addUser() {
      const firstId = this.salesUsers[0]?.id;
      if (firstId) this.settings.user_ids.push(firstId);
    },

    async saveSettings() {
      if (!this.settings.start_date || !this.settings.user_ids.length) {
        await this.showAlert('กรุณากรอกข้อมูลให้ครบ', 'error'); return;
      }
      this.saving = true;
      const r = await apiCall('POST', 'api/rotation.php?action=save', { ...this.settings, source_type: this.sourceType });
      if (!r.success) {
        this.saving = false;
        await this.showAlert(r.message || 'เกิดข้อผิดพลาด', 'error');
        return;
      }
      // บันทึกปฏิทินอ้างอิงแยกต่างหาก (คนละตาราง — announcement_sources ไม่ใช่ rotation_configs)
      const rCal = await apiCall('POST', 'api/sources.php?action=update_publish_calendar', {
        source_type: this.sourceType, calendar_code: this.calendarCode,
      });
      this.saving = false;
      if (rCal.success) {
        const src = this.sourcesList.find(s => s.source_type === this.sourceType);
        if (src) src.calendar_code = this.calendarCode;
        await this.showAlert('บันทึกเรียบร้อย', 'success');
      } else {
        await this.showAlert(rCal.message || 'เกิดข้อผิดพลาด', 'error');
      }
    },
  },
}).mount('#app');
</script>
</body>
</html>
