<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบจัดการการประชุม</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="shared/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css?v=16">
</head>
<body class="bg-slate-50 font-sans">
<div id="app">
  <div v-if="!authReady" class="min-h-screen flex items-center justify-center">
    <div class="spinner w-12 h-12"></div>
  </div>

  <template v-else>
    <!-- หมวดระบบจัดการการประชุม 2 เมนู ใช้หน้านี้หน้าเดียว แยกด้วย ?view= — เมนูซ้ายไฮไลต์ตามมุมมอง (ยืนยันจากผู้ใช้ 2026-11-03) -->
    <app-nav :user="currentUser" :page="VIEW_INFO[view].page" ref="nav"></app-nav>

    <div class="md:ml-60 min-h-screen flex flex-col">
      <header class="bg-white border-b border-slate-100 px-5 py-2.5 flex items-center gap-3 shadow-sm min-h-[56px] flex-wrap">
        <h1 class="text-base font-bold text-slate-700">{{ VIEW_INFO[view].title }}</h1>
        <!-- งานที่ต้องติดตาม: ข้อมูลชุดเดียวกัน 2 มุมมอง = รายการงาน / ไทม์ไลน์ (แบบ List / Timeline ของ Jira, Asana — ยืนยันจากผู้ใช้ 2026-11-03) -->
        <div v-if="view === 'work' || view === 'timeline'" role="tablist" aria-label="มุมมองงานที่ต้องติดตาม" class="flex gap-1 bg-slate-100 rounded-xl p-1">
          <button v-for="tab in [['work', 'รายการงาน'], ['timeline', 'ไทม์ไลน์']]" :key="tab[0]" type="button" role="tab"
                  :aria-selected="view === tab[0]" @click="switchWorkTab(tab[0])"
                  class="border-0 rounded-lg px-4 py-1.5 text-sm font-semibold cursor-pointer"
                  :class="view === tab[0] ? 'bg-white text-teal-800 shadow-sm' : 'bg-transparent text-slate-500 hover:text-slate-700'">
            {{ tab[1] }}
          </button>
        </div>
        <span class="text-sm text-slate-500">{{ VIEW_INFO[view].subtitle }}</span>
      </header>

      <!-- งานที่ต้องติดตาม (Action items) — รายการแถวสั้น กดแถวขยายเพื่อดูมติและอัปเดต (แบบรายการงาน Jira / Planner — ยืนยันจากผู้ใช้ 2026-11-03)
           หลังประชุม ผู้รับผิดชอบเปิดมาเจองานจากการประชุมล่าสุดของตัวเอง → ทำ → อัปเดตที่นี่ → ประชุมครั้งถัดไปขึ้นในวาระเรื่องสืบเนื่อง -->
      <main v-if="view === 'work'" class="flex-1 w-full max-w-[1200px] mx-auto px-4 pb-24 pt-4 md:px-6 space-y-3">
        <!-- วันนัดประชุมครั้งถัดไป (เบื้องต้น) จากการประชุมล่าสุด — บอกว่าควรอัปเดตงานก่อนวันไหน (ยืนยันจากผู้ใช้ 2026-11-03) -->
        <div v-if="nextMeetingInfo" class="text-sm text-slate-600">
          นัดประชุมครั้งถัดไป (เบื้องต้น) <b class="text-slate-800">{{ nextMeetingText(latestMeeting) }}</b>
          <span class="text-slate-400"> · {{ nextMeetingInfo.daysText }}</span>
          <span v-if="nextMeetingInfo.pending" class="text-amber-700 font-semibold"> · ยังไม่อัปเดต {{ nextMeetingInfo.pending }} เรื่อง</span>
        </div>
        <div class="flex flex-wrap gap-3 items-end">
          <div>
            <label for="fMeeting" class="block text-xs font-semibold text-slate-500 mb-1">จากการประชุม</label>
            <select id="fMeeting" v-model="workFilter.meeting" @change="loadWorkMeetingTopics" class="border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white">
              <option value="">ทุกครั้ง</option>
              <option v-for="m in meetings" :key="m.id" :value="m.id">{{ dateLabel(m.meeting_date) }}</option>
            </select>
          </div>
          <div>
            <label for="fOwner" class="block text-xs font-semibold text-slate-500 mb-1">ผู้ดำเนินการ</label>
            <select id="fOwner" v-model="workFilter.owner" class="border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white">
              <option value="">ทุกคน</option>
              <option v-for="o in workOwners" :key="o" :value="o">{{ o }}</option>
            </select>
          </div>
          <div>
            <label for="fTeam" class="block text-xs font-semibold text-slate-500 mb-1">ทีม</label>
            <select id="fTeam" v-model="workFilter.team" class="border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white">
              <option value="">ทุกทีม</option>
              <option v-for="(label, key) in teams" :key="key" :value="key">{{ label }}</option>
            </select>
          </div>
          <div>
            <div class="flex items-center gap-1 mb-1">
              <label for="fStatus" class="text-xs font-semibold text-slate-500">สถานะ</label>
              <button type="button" @click="statusHelpOpen = true" aria-label="สถานะแต่ละแบบใช้เมื่อไร" title="สถานะแต่ละแบบใช้เมื่อไร" class="bg-transparent border-0 p-0 cursor-pointer text-sm text-slate-400 hover:text-teal-700 leading-none">ⓘ</button>
            </div>
            <select id="fStatus" v-model="workFilter.status" class="border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white">
              <option value="pending">ยังไม่จบ</option>
              <option value="">ทั้งหมด</option>
              <option v-for="(s, key) in statuses" :key="key" :value="key">{{ s.label }}</option>
            </select>
          </div>
          <div class="text-sm text-slate-500 ml-auto">{{ visibleWork.length }} งาน</div>
        </div>
        <!-- จำนวนงานตามสถานะ (การประชุม / ผู้ดำเนินการ / ทีมที่เลือก) กดเพื่อกรอง -->
        <div v-if="workStatusCounts.length" class="flex flex-wrap gap-2 items-center">
          <button type="button" @click="workFilter.status = 'pending'" class="text-sm font-bold rounded-full px-3 py-1.5 bg-white text-slate-700 border-0 cursor-pointer"
            :class="workFilter.status === 'pending' ? 'ring-2 ring-teal-600' : 'ring-1 ring-slate-300'">ยังไม่จบ {{ workPendingCount }}</button>
          <button v-for="s in workStatusCounts" :key="s.key" type="button" @click="workFilter.status = workFilter.status === s.key ? 'pending' : s.key" class="text-sm font-bold rounded-full px-3 py-1.5 border-0 cursor-pointer"
            :class="[s.cls, workFilter.status === s.key ? 'ring-2 ring-teal-600' : 'ring-1 ring-slate-300']">{{ s.label }} {{ s.count }}</button>
        </div>
        <div v-if="workLoading" class="flex justify-center py-16"><div class="spinner w-10 h-10"></div></div>
        <div v-else-if="!visibleWork.length" class="text-center text-slate-500 py-14">ไม่มีงานในมุมมองนี้</div>
        <div v-else class="bg-white rounded-2xl ring-1 ring-slate-100 shadow-sm overflow-hidden">
          <div class="hidden lg:grid grid-cols-[100px_minmax(0,1fr)_110px_160px_170px] gap-3 px-4 py-2 bg-slate-50 text-xs font-semibold text-slate-500">
            <span>รหัส</span><span>เรื่อง</span><span>จากการประชุม</span><span>อัปเดตล่าสุด</span><span>{{ workPastPeriod ? 'สถานะ (' + shortRange(workPeriod) + ')' : 'สถานะปัจจุบัน' }}</span>
          </div>
          <div v-for="t in visibleWork" :key="t.id" :id="'work' + t.id" class="border-t border-slate-100 first:border-t-0 scroll-mt-4">
            <!-- แถวสั้น — กดเพื่อขยาย / ไม่แสดงหมวด แสดงตามหัวข้อที่พิมพ์ (ยืนยันจากผู้ใช้ 2026-11-03) -->
            <button type="button" @click="toggleWorkRow(t)" :aria-expanded="workExpanded === t.id"
              class="w-full text-left grid grid-cols-1 lg:grid-cols-[100px_minmax(0,1fr)_110px_160px_170px] gap-x-3 gap-y-1 px-4 py-3 items-center border-0 cursor-pointer hover:bg-slate-50"
              :class="workExpanded === t.id ? 'bg-teal-50' : 'bg-transparent'">
              <span class="font-mono text-xs text-purple-700">{{ t.topic_code }}</span>
              <span class="font-semibold text-slate-800"><template v-if="t.topic_no">ข้อ {{ t.topic_no }}. </template>{{ t.title }} <span class="text-teal-700">{{ workExpanded === t.id ? '▴' : '▾' }}</span></span>
              <span class="text-sm text-slate-600"><span class="lg:hidden text-slate-400">จากการประชุม </span>{{ shortDate(t.first_meeting_date) }}</span>
              <!-- วันที่บันทึกล่าสุดแสดงเสมอ + คำเตือนบรรทัดล่าง เทียบกับการประชุมที่เลือก (ทุกครั้ง = ล่าสุด) (ยืนยันจากผู้ใช้ 2026-11-03) -->
              <span class="text-sm text-slate-600">
                <span class="lg:hidden text-slate-400">อัปเดตล่าสุด </span>{{ lastLogDate(t) ? shortDate(lastLogDate(t)) : 'ยังไม่มีบันทึก' }}
                <!-- ข้อความบันทึกล่าสุด 1 บรรทัด เห็นได้โดยไม่ต้องขยายแถว (ยืนยันจากผู้ใช้ 2026-11-03) -->
                <span v-if="lastLog(t)" class="text-xs text-slate-500 line-clamp-1 break-all" :title="logPreview(lastLog(t))">{{ logPreview(lastLog(t)) }}</span>
                <span v-if="needsUpdate(t)" class="block text-xs font-semibold text-amber-700">ยังไม่อัปเดตหลังประชุม {{ shortDayMonth(workCompareMeeting.meeting_date) }}</span>
              </span>
              <span class="flex flex-wrap items-center gap-1">
                <!-- การประชุมที่ผ่านไปแล้ว = สถานะช่วงนั้น / ล่าสุด หรือทุกครั้ง = สถานะปัจจุบัน (ยืนยันจากผู้ใช้ 2026-11-03) -->
                <span class="text-xs font-bold rounded-full px-2.5 py-1" :class="statusOf(viewStatus(t)).cls">{{ statusOf(viewStatus(t)).label }}</span>
                <span v-if="periodNoData(t)" class="text-xs text-slate-400">(ไม่มีข้อมูลช่วงนั้น ใช้สถานะปัจจุบัน)</span>
                <span v-if="hasWorkDraft(t)" class="text-xs font-bold text-amber-700">(ยังไม่บันทึก)</span>
              </span>
            </button>

            <!-- ขยาย: มติ + อัปเดต (สถานะ + บันทึกการดำเนินการ บันทึกครั้งเดียว) + ประวัติ -->
            <div v-if="workExpanded === t.id" class="px-4 pb-4 pt-1 space-y-3 bg-slate-50">
              <div v-if="t.decision" class="rounded-xl bg-emerald-50 ring-1 ring-emerald-200 px-4 py-3">
                <div class="text-sm font-bold text-emerald-800 mb-1">มติที่ประชุม (สิ่งที่ต้องทำ)</div>
                <div :data-decision="t.id" class="text-base leading-loose text-slate-900 whitespace-pre-wrap [text-wrap:pretty]" :class="decisionOpen[t.id] ? '' : 'line-clamp-3'">{{ t.decision }}</div>
                <!-- "ดูทั้งหมด" เฉพาะมติที่ถูกตัดจริง (ยาวเกิน 3 บรรทัด — 2026-11-03) -->
                <button v-if="decisionClamped[t.id] || decisionOpen[t.id]" type="button" @click="decisionOpen[t.id] = !decisionOpen[t.id]" class="mt-1 bg-transparent border-0 p-0 cursor-pointer text-sm font-semibold text-teal-700">{{ decisionOpen[t.id] ? 'ย่อ' : 'ดูทั้งหมด' }}</button>
              </div>
              <div v-if="t.detail" class="text-sm text-slate-700"><span class="font-semibold text-slate-500">รายละเอียด:</span> <span class="whitespace-pre-wrap">{{ t.detail }}</span></div>

              <!-- บันทึกการดำเนินการ (ใหม่สุดก่อน) กางไว้ตลอด อยู่ก่อนกล่องอัปเดต — เห็นว่าทำอะไรไปแล้วก่อนเขียนเพิ่ม (ยืนยันจากผู้ใช้ 2026-11-03) -->
              <!-- ไม่แสดงฟอร์มตอนเปิดแถว (ดูเหมือนยังไม่ได้อัปเดต) — กดปุ่มจึงเปิด / ยังไม่มีบันทึกเลยเปิดให้เลย (ยืนยันจากผู้ใช้ 2026-11-03) -->
              <div class="bg-white rounded-xl ring-1 ring-slate-200 p-3 space-y-2">
                <div class="flex items-center gap-2 flex-wrap">
                  <div class="text-sm font-bold text-slate-700 mr-auto">บันทึกการดำเนินการ<template v-if="workPeriod"> ช่วง {{ workPastPeriod ? shortRange(workPeriod) : shortDayMonth(workPeriod.start) + ' – วันนี้' }}</template> ({{ viewLogs(t).length }})</div>
                  <button v-if="!workFormVisible(t) && !workPastPeriod" type="button" @click="openWorkForm(t)" class="px-3 py-1.5 rounded-lg text-sm font-bold bg-white ring-1 ring-teal-500 text-teal-700 border-0 cursor-pointer">+ เพิ่มบันทึกความคืบหน้า</button>
                </div>
                <div v-if="workPastPeriod" class="text-xs text-slate-500">ช่วงนี้ปิดแล้ว (ประชุม {{ shortDate(workPeriod.end) }}) — แก้คำผิดได้ เพิ่มความคืบหน้าใหม่ที่การประชุมล่าสุด</div>
                <div class="space-y-2">
                  <div v-if="!viewLogs(t).length" class="text-sm text-slate-500">{{ workPeriod ? 'ยังไม่มีบันทึกในช่วงนี้' : 'ยังไม่มีบันทึก' }}</div>
                  <div v-for="l in [...viewLogs(t)].reverse()" :key="l.id">
                    <!-- แก้บันทึกที่ลงไปแล้ว (ยืนยันจากผู้ใช้ 2026-11-02) -->
                    <div v-if="logEdit && logEdit.id === l.id" class="rounded-xl ring-1 ring-teal-300 bg-white p-3 space-y-2">
                      <div class="grid grid-cols-1 sm:grid-cols-[160px_1fr] gap-2">
                        <div>
                          <label :for="'ed' + l.id" class="block text-xs font-semibold text-slate-500 mb-1">วันที่</label>
                          <input :id="'ed' + l.id" v-model="logEdit.log_date" type="date" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white">
                          <div class="text-xs text-slate-500 mt-1">{{ thaiDate(logEdit.log_date) }}</div>
                        </div>
                        <div>
                          <label :for="'ef' + l.id" class="block text-xs font-semibold text-slate-500 mb-1">ไฟล์หรือฟังก์ชันที่แก้</label>
                          <input :id="'ef' + l.id" v-model="logEdit.files" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white">
                        </div>
                      </div>
                      <div>
                        <label :for="'en' + l.id" class="block text-xs font-semibold text-slate-500 mb-1">แก้ไขอะไร</label>
                        <textarea :id="'en' + l.id" v-model="logEdit.note" rows="6" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white outline-none focus:border-teal-500"></textarea>
                      </div>
                      <div class="flex gap-2">
                        <button type="button" @click="saveLogEdit(l)" class="px-4 py-2 rounded-xl text-sm font-bold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer">บันทึก</button>
                        <button type="button" @click="logEdit = null" class="px-4 py-2 rounded-xl text-sm font-semibold bg-white ring-1 ring-slate-200 text-slate-600 border-0 cursor-pointer">ยกเลิก</button>
                      </div>
                    </div>
                    <div v-else class="grid grid-cols-[96px_1fr_auto_auto] gap-2 text-sm">
                      <span class="font-semibold text-slate-500">{{ shortDate(l.log_date) }}</span>
                      <span class="min-w-0 text-slate-700 whitespace-pre-wrap"><span v-if="l.status_after" class="inline-flex items-center gap-1 mb-0.5 text-xs font-semibold"><span class="rounded-full px-2 py-0.5" :class="statusOf(l.status_before).cls">{{ statusOf(l.status_before).label }}</span>→<span class="rounded-full px-2 py-0.5" :class="statusOf(l.status_after).cls">{{ statusOf(l.status_after).label }}</span></span><span v-if="l.status_after && l.note" class="block"></span>{{ l.note }}<span v-if="l.files" class="block text-xs text-slate-500">ไฟล์: {{ l.files }}</span><span v-if="l.created_by_name" class="block text-xs text-slate-500">บันทึกโดย {{ l.created_by_name }}</span></span>
                      <button type="button" @click="logEdit = { id: l.id, log_date: l.log_date, note: l.note, files: l.files || '' }" class="text-sm font-semibold text-teal-700 bg-transparent border-0 cursor-pointer self-start">แก้ไข</button>
                      <button v-if="!workPastPeriod" type="button" @click="deleteLog(l)" class="text-sm text-slate-500 hover:text-rose-700 bg-transparent border-0 cursor-pointer self-start">ลบ</button>
                    </div>
                  </div>
                </div>
              </div>

              <!-- สถานะ + ผู้ดำเนินการแบบข้อความ (ฟอร์มปิดอยู่) -->
              <div v-if="!workFormVisible(t)" class="flex items-center gap-3 flex-wrap text-sm text-slate-700 px-1">
                <template v-if="workPastPeriod">
                  <span>สถานะช่วงนี้: <span class="text-xs font-bold rounded-full px-2.5 py-1" :class="statusOf(viewStatus(t)).cls">{{ statusOf(viewStatus(t)).label }}</span></span>
                  <span>· สถานะปัจจุบัน: <span class="text-xs font-bold rounded-full px-2.5 py-1" :class="statusOf(t.saved_status).cls">{{ statusOf(t.saved_status).label }}</span></span>
                  <button type="button" @click="showLatestWork" class="bg-transparent border-0 p-0 cursor-pointer text-sm font-semibold text-teal-700 underline underline-offset-2">ดูการประชุมล่าสุด</button>
                </template>
                <template v-else>
                  <span>สถานะปัจจุบัน: <span class="text-xs font-bold rounded-full px-2.5 py-1" :class="statusOf(t.saved_status).cls">{{ statusOf(t.saved_status).label }}</span></span>
                  <span v-if="ownerText(t)">· ผู้ดำเนินการ: {{ ownerText(t) }}</span>
                  <button type="button" @click="openWorkForm(t)" class="px-3 py-1.5 rounded-lg text-sm font-semibold bg-white ring-1 ring-slate-300 text-slate-700 border-0 cursor-pointer">เปลี่ยนสถานะ</button>
                </template>
                <span v-if="savedText[t.id]" class="text-sm text-slate-500">{{ savedText[t.id] }}</span>
                <button type="button" @click="goToMeeting(workFilter.meeting || t.first_meeting_id)" class="ml-auto bg-transparent border-0 p-0 cursor-pointer text-sm font-semibold text-teal-700 underline underline-offset-2">เปิดในบันทึกวาระและมติ ↗</button>
              </div>

              <div v-else class="bg-white rounded-xl ring-1 ring-teal-300 p-3 space-y-3">
                <div class="text-sm font-bold text-slate-700">อัปเดตงานนี้</div>
                <div class="grid grid-cols-1 sm:grid-cols-[200px_160px_minmax(0,1fr)] gap-3">
                  <div>
                    <div class="flex items-center gap-1 mb-1">
                      <label :for="'wst' + t.id" class="text-xs font-semibold text-slate-500">สถานะ</label>
                      <button type="button" @click="statusHelpOpen = true" aria-label="สถานะแต่ละแบบใช้เมื่อไร" title="สถานะแต่ละแบบใช้เมื่อไร" class="bg-transparent border-0 p-0 cursor-pointer text-sm text-slate-400 hover:text-teal-700 leading-none">ⓘ</button>
                    </div>
                    <select :id="'wst' + t.id" v-model="t.status" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white">
                      <option v-for="(s, key) in statuses" :key="key" :value="key">{{ s.label }}</option>
                    </select>
                  </div>
                  <div>
                    <label :for="'ld' + t.id" class="block text-xs font-semibold text-slate-500 mb-1">วันที่ทำ</label>
                    <input :id="'ld' + t.id" v-model="logDraft(t).log_date" type="date" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white">
                    <!-- ช่องวันที่แสดงตามภาษาเบราว์เซอร์ (เช่น 11/03/2026 = เดือน/วัน ค.ศ.) — บอกวันที่แบบไทยใต้ช่อง (2026-11-03) -->
                    <div class="text-xs text-slate-500 mt-1">{{ thaiDate(logDraft(t).log_date) }}</div>
                  </div>
                  <div>
                    <label :for="'lf' + t.id" class="block text-xs font-semibold text-slate-500 mb-1">ไฟล์หรือฟังก์ชันที่แก้</label>
                    <input :id="'lf' + t.id" v-model="logDraft(t).files" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white" placeholder="ไม่บังคับ">
                  </div>
                  <div class="sm:col-span-3">
                    <label :for="'ln' + t.id" class="block text-xs font-semibold text-slate-500 mb-1">แก้ไขอะไร</label>
                    <textarea :id="'ln' + t.id" v-model="logDraft(t).note" rows="4" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white outline-none focus:border-teal-500" placeholder="พิมพ์สิ่งที่ทำ — เว้นว่างได้ถ้าเปลี่ยนแค่สถานะ"></textarea>
                  </div>
                  <div>
                    <label :for="'wtm' + t.id" class="block text-xs font-semibold text-slate-500 mb-1">ทีมผู้ดำเนินการ</label>
                    <select :id="'wtm' + t.id" v-model="t.owner_team" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white">
                      <option value="">-- เลือก --</option>
                      <option v-for="(label, key) in teams" :key="key" :value="key">{{ label }}</option>
                    </select>
                  </div>
                  <div class="sm:col-span-2">
                    <label :for="'wow' + t.id" class="block text-xs font-semibold text-slate-500 mb-1">ชื่อผู้ดำเนินการ</label>
                    <input :id="'wow' + t.id" v-model="t.owner_name" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white">
                  </div>
                </div>
                <div class="flex items-center gap-3 flex-wrap">
                  <button type="button" @click="saveWorkUpdate(t)" :disabled="savingId === t.id" class="px-5 py-2.5 rounded-xl text-sm font-bold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer disabled:opacity-50">{{ savingId === t.id ? 'กำลังบันทึก…' : 'บันทึก' }}</button>
                  <button v-if="t.logs.length" type="button" @click="cancelWorkForm(t)" class="px-4 py-2.5 rounded-xl text-sm font-semibold bg-white ring-1 ring-slate-200 text-slate-600 border-0 cursor-pointer">ยกเลิก</button>
                  <span v-if="hasWorkDraft(t)" class="text-sm font-semibold text-amber-700">มีการแก้ไขที่ยังไม่บันทึก</span>
                  <button type="button" @click="goToMeeting(workFilter.meeting || t.first_meeting_id)" class="ml-auto bg-transparent border-0 p-0 cursor-pointer text-sm font-semibold text-teal-700 underline underline-offset-2">เปิดในบันทึกวาระและมติ ↗</button>
                </div>
              </div>

            </div>
          </div>
        </div>
      </main>

      <!-- ไทม์ไลน์งาน — แต่ละงานเริ่มเมื่อไร สถานะแต่ละช่วง จบที่ไหน ตามที่บันทึกจริง (ยืนยันจากผู้ใช้ 2026-11-03)
           คอลัมน์ = วันประชุม (สถานะ ณ ประชุม) สลับกับช่วงระหว่างประชุม (บันทึกของ Dev) / กดชื่อเรื่องดูไทม์ไลน์ละเอียด -->
      <main v-else-if="view === 'timeline'" class="flex-1 w-full max-w-[1400px] mx-auto px-4 pb-24 pt-4 md:px-6 space-y-3">
        <div class="flex flex-wrap gap-3 items-end">
          <div>
            <label for="tlOwner" class="block text-xs font-semibold text-slate-500 mb-1">ผู้ดำเนินการ</label>
            <select id="tlOwner" v-model="workFilter.owner" class="border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white">
              <option value="">ทุกคน</option>
              <option v-for="o in workOwners" :key="o" :value="o">{{ o }}</option>
            </select>
          </div>
          <div>
            <label for="tlTeam" class="block text-xs font-semibold text-slate-500 mb-1">ทีม</label>
            <select id="tlTeam" v-model="workFilter.team" class="border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white">
              <option value="">ทุกทีม</option>
              <option v-for="(label, key) in teams" :key="key" :value="key">{{ label }}</option>
            </select>
          </div>
          <!-- ยังไม่จบ / จบแล้ว / ทั้งหมด — เปิดหน้ามาเห็นเฉพาะงานที่ยังไม่จบ (ยืนยันจากผู้ใช้ 2026-11-03) -->
          <div class="flex flex-wrap items-center gap-2">
            <button v-for="sc in timelineScopes" :key="sc.key" type="button" @click="timelineFilter.scope = sc.key; timelineOpen = null"
                    :aria-pressed="timelineFilter.scope === sc.key"
                    class="rounded-full border px-4 py-2 text-sm font-semibold cursor-pointer"
                    :class="timelineFilter.scope === sc.key ? 'bg-teal-600 border-teal-600 text-white' : 'bg-white border-slate-300 text-slate-700 hover:border-teal-500'">
              {{ sc.label }} {{ sc.count }}
            </button>
            <button type="button" @click="statusHelpOpen = true" aria-label="สถานะแต่ละแบบใช้เมื่อไร" title="สถานะแต่ละแบบใช้เมื่อไร" class="bg-transparent border-0 p-0 cursor-pointer text-sm text-slate-400 hover:text-teal-700 leading-none">ⓘ</button>
          </div>
        </div>

        <div v-if="workLoading" class="flex justify-center py-16"><div class="spinner w-10 h-10"></div></div>
        <div v-else-if="!timelineRows.length" class="text-center text-slate-500 py-14">ไม่มีงานในมุมมองนี้</div>
        <div v-else class="bg-white rounded-2xl ring-1 ring-slate-100 shadow-sm overflow-x-auto">
          <table class="w-full text-sm border-collapse min-w-[900px]">
            <thead>
              <tr class="bg-slate-50 text-xs font-semibold text-slate-500 text-left">
                <th class="sticky left-0 z-10 bg-slate-50 px-4 py-2 min-w-[240px] w-[260px]">เรื่อง</th>
                <template v-for="(m, i) in timelineMeetings" :key="m.id">
                  <th class="px-3 py-2 whitespace-nowrap text-teal-800">ประชุม {{ shortDayMonth(m.meeting_date) }}</th>
                  <th class="px-3 py-2 whitespace-nowrap">{{ timelineMeetings[i + 1] ? 'ระหว่าง ' + shortDayMonth(m.meeting_date) + ' – ' + shortDayMonth(timelineMeetings[i + 1].meeting_date) : 'หลัง ' + shortDayMonth(m.meeting_date) + ' – วันนี้' }}</th>
                </template>
                <!-- กดเรียงตามสถานะ: ▲ → ▼ → ตามวันที่เปิดเรื่อง (ยืนยันจากผู้ใช้ 2026-11-03) -->
                <th class="px-3 py-2 whitespace-nowrap" :aria-sort="timelineSort === 'asc' ? 'ascending' : timelineSort === 'desc' ? 'descending' : 'none'">
                  <button type="button" @click="cycleTimelineSort" title="กดเพื่อเรียงตามสถานะ"
                          class="bg-transparent border-0 p-0 cursor-pointer text-xs font-semibold hover:text-teal-700" :class="timelineSort ? 'text-teal-700' : 'text-slate-500'">
                    ตอนนี้ {{ timelineSort === 'asc' ? '▲' : timelineSort === 'desc' ? '▼' : '⇅' }}
                  </button>
                </th>
              </tr>
            </thead>
            <tbody>
              <!-- แบ่งกลุ่มเทียบกับการประชุมล่าสุด: เรื่องสืบเนื่อง / เรื่องใหม่ (ยืนยันจากผู้ใช้ 2026-11-03) -->
              <template v-for="g in timelineGroups" :key="g.key">
              <tr>
                <td :colspan="timelineMeetings.length * 2 + 2" class="px-4 pt-4 pb-1.5 bg-white">
                  <span class="sticky left-4 text-sm font-semibold text-slate-600">{{ g.label }}
                    <span class="font-normal text-slate-400"> {{ g.rows.length }} เรื่อง · {{ g.hint }}</span>
                  </span>
                </td>
              </tr>
              <template v-for="row in g.rows" :key="row.t.id">
                <!-- แถวละบรรทัดเดียว กดที่แถวเพื่อดูรายละเอียด (ยืนยันจากผู้ใช้ 2026-11-03) -->
                <tr class="border-t border-slate-100 cursor-pointer group" :class="timelineOpen === row.t.id ? 'bg-teal-50' : 'hover:bg-slate-50'" @click="toggleTimeline(row.t)">
                  <td class="sticky left-0 z-10 px-4 py-2 max-w-[340px]" :class="timelineOpen === row.t.id ? 'bg-teal-50' : 'bg-white group-hover:bg-slate-50'">
                    <button type="button" @click.stop="toggleTimeline(row.t)" :aria-expanded="timelineOpen === row.t.id" :title="row.t.title"
                            class="w-full flex items-center gap-1.5 text-left bg-transparent border-0 p-0 cursor-pointer">
                      <span class="text-teal-700 text-xs shrink-0">{{ timelineOpen === row.t.id ? '▴' : '▾' }}</span>
                      <span class="font-semibold text-slate-800 truncate"><template v-if="row.t.topic_no">ข้อ {{ row.t.topic_no }}. </template>{{ row.t.title }}</span>
                    </button>
                  </td>
                  <template v-for="c in row.cols" :key="c.m.id">
                    <!-- วันประชุม -->
                    <!-- แสดงเฉพาะสถานะหลังประชุม (ก่อน → หลัง ดูในรายละเอียด) -->
                    <td class="px-3 py-2 whitespace-nowrap bg-slate-50/70">
                      <span v-if="c.mcell.kind === 'notyet'" class="text-slate-300">·</span>
                      <span v-else-if="c.mcell.kind === 'none'" class="text-slate-300">—</span>
                      <span v-else-if="c.mcell.kind === 'nodata'" class="text-xs text-slate-400">ไม่มีข้อมูล</span>
                      <span v-else class="text-xs font-bold rounded-full px-2 py-0.5" :class="statusOf(c.mcell.after).cls">{{ statusOf(c.mcell.after).label }}</span>
                    </td>
                    <!-- ระหว่างประชุม -->
                    <!-- แสดงแค่จำนวนบันทึก (รายการบันทึกดูในรายละเอียด) -->
                    <td class="px-3 py-2 whitespace-nowrap">
                      <span v-if="c.seg.blank"></span>
                      <span v-else-if="c.seg.logs.length" class="text-xs text-slate-500" :title="'บันทึกความคืบหน้า ' + c.seg.logs.length + ' ครั้ง'">✎ {{ c.seg.logs.length }}</span>
                      <span v-else-if="c.seg.warn" class="text-xs font-semibold text-amber-700">ยังไม่บันทึก</span>
                      <span v-else class="text-slate-300">—</span>
                    </td>
                  </template>
                  <!-- ตอนนี้ -->
                  <td class="px-3 py-2 whitespace-nowrap">
                    <span class="text-xs font-bold rounded-full px-2 py-0.5" :class="statusOf(row.t.saved_status).cls">{{ statusOf(row.t.saved_status).label }}</span>
                    <span class="text-xs text-slate-500 ml-1">{{ row.duration }}</span>
                  </td>
                </tr>

                <!-- ไทม์ไลน์ละเอียด: จุดเขียว = การประชุม / จุดเทา = บันทึกของ Dev -->
                <tr v-if="timelineOpen === row.t.id" class="bg-slate-50">
                  <td :colspan="timelineMeetings.length * 2 + 2" class="px-4 py-4">
                    <div class="sticky left-4 max-w-[860px] space-y-3">
                      <div class="text-sm text-slate-500"><span class="font-mono text-xs text-purple-700">{{ row.t.topic_code }}</span> · เปิดเรื่อง {{ shortDate(row.t.first_meeting_date) }} · {{ row.duration }} · ผู้ดำเนินการ: {{ ownerText(row.t) || '-' }}</div>
                      <div class="border-l-2 border-slate-300 ml-2 pl-5 space-y-3">
                        <div v-for="(e, i) in timelineEvents(row)" :key="i" class="relative">
                          <span class="absolute -left-[27px] top-1 w-3 h-3 rounded-full ring-2" :class="e.type === 'meeting' ? 'bg-teal-100 ring-teal-600' : 'bg-white ring-slate-400'"></span>
                          <template v-if="e.type === 'meeting'">
                            <div class="text-sm">
                              <b class="text-slate-800">{{ shortDate(e.date) }} ประชุม</b>
                              <span class="text-slate-500"> · {{ e.cell.isNew ? 'เรื่องใหม่' : 'เรื่องสืบเนื่อง' }} · </span>
                              <template v-if="e.cell.kind === 'nodata'"><span class="text-slate-400">ไม่มีข้อมูลสถานะ</span></template>
                              <template v-else>
                                <template v-if="e.cell.before && e.cell.before !== e.cell.after"><span class="text-xs font-bold rounded-full px-2 py-0.5" :class="statusOf(e.cell.before).cls">{{ statusOf(e.cell.before).label }}</span> → </template>
                                <span class="text-xs font-bold rounded-full px-2 py-0.5" :class="statusOf(e.cell.after).cls">{{ statusOf(e.cell.after).label }}</span>
                              </template>
                            </div>
                            <div v-if="e.decision" class="text-sm text-slate-600 whitespace-pre-wrap line-clamp-3"><span class="font-semibold text-slate-500">มติ:</span> {{ e.decision }}</div>
                            <div v-if="e.cell.note" class="text-sm text-slate-600 whitespace-pre-wrap line-clamp-3"><span class="font-semibold text-slate-500">ความคืบหน้า:</span> {{ e.cell.note }}</div>
                          </template>
                          <template v-else>
                            <div class="text-sm">
                              <b class="text-slate-800">{{ shortDate(e.date) }} บันทึกการดำเนินการ</b>
                              <template v-if="e.log.status_after"> · <span class="text-xs font-bold rounded-full px-2 py-0.5" :class="statusOf(e.log.status_before).cls">{{ statusOf(e.log.status_before).label }}</span> → <span class="text-xs font-bold rounded-full px-2 py-0.5" :class="statusOf(e.log.status_after).cls">{{ statusOf(e.log.status_after).label }}</span></template>
                            </div>
                            <div v-if="e.log.note" class="text-sm text-slate-600 whitespace-pre-wrap line-clamp-3">{{ e.log.note }}</div>
                          </template>
                        </div>
                        <div class="relative">
                          <span class="absolute -left-[27px] top-1 w-3 h-3 rounded-full ring-2 bg-white ring-slate-400"></span>
                          <div class="text-sm"><b class="text-slate-800">วันนี้</b> · <span class="text-xs font-bold rounded-full px-2 py-0.5" :class="statusOf(row.t.saved_status).cls">{{ statusOf(row.t.saved_status).label }}</span>
                            <span v-if="row.cols.length && row.cols[row.cols.length - 1].seg.warn" class="text-amber-700 font-semibold"> · ยังไม่อัปเดตหลังประชุม {{ shortDayMonth(row.cols[row.cols.length - 1].m.meeting_date) }}</span>
                          </div>
                        </div>
                      </div>
                      <div class="flex gap-4">
                        <button type="button" @click="goToMeeting(row.t.first_meeting_id)" class="bg-transparent border-0 p-0 cursor-pointer text-sm font-semibold text-teal-700 underline underline-offset-2">เปิดในบันทึกวาระและมติ ↗</button>
                        <button type="button" @click="goToWorkCard(row.t)" class="bg-transparent border-0 p-0 cursor-pointer text-sm font-semibold text-teal-700 underline underline-offset-2">เปิดในงานที่ต้องติดตาม ↗</button>
                      </div>
                    </div>
                  </td>
                </tr>
              </template>
              </template>
            </tbody>
          </table>
        </div>
      </main>

      <!-- การประชุม: ซ้าย = ครั้งประชุม / ขวา = หัวข้อของครั้งนั้น + บันทึกรายครั้ง -->
      <main v-else-if="view === 'meeting'" class="flex-1 w-full max-w-[1200px] mx-auto px-4 pb-24 pt-5 md:px-6 md:py-6 grid grid-cols-1 md:grid-cols-[220px_minmax(0,1fr)] gap-4 items-start">
        <aside class="space-y-2">
          <div class="bg-white rounded-2xl ring-1 ring-slate-100 p-3 space-y-2">
            <label for="newMeetingDate" class="block text-sm font-semibold text-slate-700">สร้างการประชุม</label>
            <input id="newMeetingDate" v-model="newMeetingDate" type="date" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-teal-500 bg-white">
            <button type="button" @click="createMeeting" class="w-full px-3 py-2 rounded-xl text-sm font-bold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer">+ สร้างการประชุม</button>
          </div>
          <button v-for="m in meetings" :key="m.id" type="button" @click="openMeeting(m.id)"
            class="block w-full text-left rounded-xl px-3 py-2.5 cursor-pointer border"
            :class="m.id === meetingId ? 'bg-teal-50 border-teal-500 text-teal-800' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'">
            <span class="block text-sm font-bold">{{ dateLabel(m.meeting_date) }}</span>
            <span class="block text-xs text-slate-500">เรื่องใหม่ {{ m.new_count }} · บันทึก {{ m.note_count }}</span>
          </button>
        </aside>

        <section class="min-w-0 space-y-3">
          <div class="flex flex-wrap gap-2 items-center">
            <div class="text-lg font-bold text-slate-800 mr-auto">{{ meeting ? dateLabel(meeting.meeting_date) : '' }}</div>
            <!-- ปุ่มขึ้นเฉพาะการประชุมที่ว่าง — API ตรวจซ้ำ (2026-11-02) -->
            <button v-if="selectedMeetingEmpty" type="button" @click="deleteMeeting" class="px-3 py-2 rounded-xl text-sm font-semibold bg-white ring-1 ring-rose-300 text-rose-700 hover:bg-rose-50 border-0 cursor-pointer">ลบการประชุมที่ว่าง</button>
            <button v-if="!readOnly" type="button" @click="showAdd = !showAdd" class="px-3 py-2 rounded-xl text-sm font-bold bg-white ring-1 ring-teal-500 text-teal-700 border-0 cursor-pointer">+ เพิ่มหัวข้อ</button>
            <button v-if="topics.length" type="button" @click="summaryOpen = true" class="px-3 py-2 rounded-xl text-sm font-bold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer">สรุปการประชุม</button>
          </div>
          <!-- หัวรายงานการประชุม: ชื่อการประชุม / เวลา / สถานที่ — อยู่ก่อนผู้เข้าร่วมตามโครงรายงาน (ยืนยันจากผู้ใช้ 2026-11-04) -->
          <div v-if="meeting" class="-mt-1 text-sm text-slate-600 flex flex-wrap items-center gap-x-2 gap-y-1">
            <template v-if="meetingInfoText(meeting)">
              <span class="text-slate-800">{{ meetingInfoText(meeting) }}</span>
              <button type="button" @click="openInfoDialog" class="bg-transparent border-0 p-0 cursor-pointer text-sm font-semibold text-teal-700 underline underline-offset-2">✎ แก้</button>
            </template>
            <button v-else type="button" @click="openInfoDialog" class="bg-transparent border-0 p-0 cursor-pointer text-sm font-semibold text-teal-700 underline underline-offset-2">+ ระบุชื่อการประชุม เวลา สถานที่</button>
          </div>
          <!-- ผู้เข้าร่วมประชุม (มา / ลา / ไม่มา + ประธาน / ผู้จดบันทึก) เก็บที่การประชุมแต่ละครั้ง (ยืนยันจากผู้ใช้ 2026-11-04) — อยู่ก่อนนัดครั้งถัดไปตามโครงรายงานการประชุม -->
          <div v-if="meeting" class="-mt-1 text-sm text-slate-600">
            <!-- บรรทัดเดียว: จำนวน + ประธาน + ผู้จดบันทึก / รายชื่อเต็มกด "ดูรายชื่อ" (ยืนยันจากผู้ใช้ 2026-11-04 แบบ ก — ป้ายสีทุกคนลายตา) -->
            <div class="flex flex-wrap items-center gap-x-2 gap-y-1">
              <span>ผู้เข้าร่วม:</span>
              <template v-if="attendees.length">
                <span class="text-slate-800">{{ attendeeCountText }}<template v-for="r in attendeeKeyRoles" :key="r.role"> · {{ r.label }} {{ r.names }}</template></span>
                <button type="button" @click="attendeesOpen = !attendeesOpen" :aria-expanded="attendeesOpen" class="bg-transparent border-0 p-0 cursor-pointer text-sm font-semibold text-teal-700 underline underline-offset-2">{{ attendeesOpen ? 'ซ่อนรายชื่อ ▴' : 'ดูรายชื่อ ▾' }}</button>
              </template>
              <span v-else class="text-slate-400">ยังไม่ระบุ</span>
              <button type="button" @click="openAttendeeDialog" class="bg-transparent border-0 p-0 cursor-pointer text-sm font-semibold text-teal-700 underline underline-offset-2">{{ attendees.length ? 'จัดการ' : '+ เพิ่มผู้เข้าร่วม' }}</button>
            </div>
            <div v-if="attendees.length && attendeesOpen" class="mt-1 space-y-0.5 text-slate-600">
              <div v-for="g in attendeeGroups" :key="g.key"><span class="font-semibold text-slate-500">{{ g.label }} ({{ g.list.length }}):</span> <template v-for="(a, i) in g.list" :key="a.id"><span class="whitespace-nowrap">{{ a.attendee_name }}</span><template v-if="i < g.list.length - 1">, </template></template></div>
            </div>
          </div>
          <!-- นัดประชุมครั้งถัดไป (เบื้องต้น) เป็นข้อมูลของการประชุม — กรอกที่หัวการประชุม สรุปแสดงอย่างเดียว (ยืนยันจากผู้ใช้ 2026-11-03) -->
          <div v-if="meeting" class="-mt-1 text-sm text-slate-600 flex flex-wrap items-center gap-x-2 gap-y-1">
            <template v-if="meeting.next_meeting_date">
              <span>นัดครั้งถัดไป (เบื้องต้น): <b class="text-slate-800">{{ nextMeetingText(meeting) }}</b></span>
              <button type="button" @click="openNextDialog" class="bg-transparent border-0 p-0 cursor-pointer text-sm font-semibold text-teal-700 underline underline-offset-2">✎ แก้</button>
            </template>
            <button v-else type="button" @click="openNextDialog" class="bg-transparent border-0 p-0 cursor-pointer text-sm font-semibold text-teal-700 underline underline-offset-2">+ นัดประชุมครั้งถัดไป</button>
          </div>
          <!-- การประชุมที่ผ่านไปแล้ว = รายงานที่ปิดแล้ว อ่านอย่างเดียว (ยืนยันจากผู้ใช้ 2026-11-03) — งานระหว่างสัปดาห์อัปเดตที่แท็บงานทั้งหมด -->
          <div v-if="meeting && !meeting.is_latest" class="rounded-xl px-4 py-3 flex flex-wrap items-center gap-3 text-sm"
            :class="editingPast ? 'bg-amber-50 ring-1 ring-amber-300 text-amber-800' : 'bg-slate-100 ring-1 ring-slate-200 text-slate-700'">
            <span v-if="!editingPast" class="mr-auto">การประชุมที่ผ่านไปแล้ว แสดงสถานะและบันทึก ณ วันนั้น (อ่านอย่างเดียว) — อัปเดตงานระหว่างสัปดาห์ที่เมนู <b>งานที่ต้องติดตาม</b></span>
            <span v-else class="mr-auto font-semibold">กำลังแก้ไขบันทึกของการประชุมที่ผ่านไปแล้ว — กดบันทึกการ์ดจะเปลี่ยนสถานะหลังประชุมของวันนั้น</span>
            <button v-if="!editingPast" type="button" @click="startEditPast" class="px-3 py-1.5 rounded-lg text-sm font-semibold bg-white ring-1 ring-slate-300 text-slate-700 border-0 cursor-pointer">แก้ไขบันทึกการประชุมนี้</button>
            <button v-else type="button" @click="openMeeting(meetingId)" class="px-3 py-1.5 rounded-lg text-sm font-semibold bg-white ring-1 ring-amber-300 text-amber-800 border-0 cursor-pointer">เลิกแก้ไข</button>
          </div>

          <!-- แท็บวาระ = ระดับหลัก (เรื่องสืบเนื่อง → เรื่องใหม่ → ทำเสร็จ) / สถานะ = ระดับย่อยในแท็บ (ยืนยันจากผู้ใช้ 2026-11-03)
               หน้าตาแบบแฟ้มเอกสารเดียวกับ AppRecordTabs แต่แสดง (0) และจุดส้มเมื่อมีการ์ดแก้ค้างในแท็บนั้น -->
          <div v-if="topics.length" class="flex flex-wrap gap-1 border-b border-slate-300" role="tablist">
            <button v-for="g in meetingTabs" :key="g.section" type="button" role="tab" :aria-selected="meetingTab === g.section" @click="switchMeetingTab(g.section)"
              class="inline-flex items-center gap-1.5 px-4 py-2.5 text-[.95rem] whitespace-nowrap rounded-t-lg border border-b-0 cursor-pointer -mb-px"
              :class="meetingTab === g.section ? 'bg-white text-teal-700 font-bold border-slate-300 border-t-[3px] border-t-teal-600' : 'bg-slate-50 text-slate-600 border-slate-300 hover:bg-white hover:text-slate-800'">
              {{ g.label }} ({{ g.count }})
              <span v-if="g.dirty" class="w-2 h-2 rounded-full bg-amber-500" title="มีการแก้ไขที่ยังไม่บันทึกในแท็บนี้" aria-label="มีการแก้ไขที่ยังไม่บันทึก"></span>
            </button>
          </div>
          <!-- จำนวนเรื่องแยกตามสถานะในแท็บที่เปิด กดเพื่อกรองรายการ (ยืนยันจากผู้ใช้ 2026-11-02) -->
          <div v-if="tabTopics.length" class="flex flex-wrap gap-2 items-center">
            <button type="button" @click="topicFilter = ''" class="text-sm font-bold rounded-full px-3 py-1.5 bg-white text-slate-700 border-0 cursor-pointer ring-1"
              :class="topicFilter ? 'ring-slate-300' : 'ring-2 ring-teal-600'">ทั้งหมด {{ tabTopics.length }} เรื่อง</button>
            <button v-for="s in statusCounts" :key="s.key" type="button" @click="topicFilter = topicFilter === s.key ? '' : s.key" class="text-sm font-bold rounded-full px-3 py-1.5 border-0 cursor-pointer"
              :class="[s.cls, topicFilter === s.key ? 'ring-2 ring-teal-600' : 'ring-1 ring-slate-300']">{{ s.label }} {{ s.count }}</button>
          </div>

          <!-- ไม่มีช่องหมวดแล้ว — หมวดไม่แสดงที่ไหน หัวข้อแสดงตามที่พิมพ์ (ยืนยันจากผู้ใช้ 2026-11-03) -->
          <form v-if="showAdd && !readOnly" class="bg-white rounded-2xl ring-1 ring-slate-200 p-4 grid grid-cols-1 sm:grid-cols-2 gap-3" @submit.prevent="createTopic">
            <div>
              <label for="tNo" class="block text-sm font-semibold text-slate-700 mb-1">ข้อ</label>
              <input id="tNo" v-model="topicForm.topic_no" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-teal-500" placeholder="เช่น 1 หรือ 1.1">
            </div>
            <div>
              <label for="tTeam" class="block text-sm font-semibold text-slate-700 mb-1">ทีมผู้ดำเนินการ</label>
              <select id="tTeam" v-model="topicForm.owner_team" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white">
                <option value="">-- เลือก --</option>
                <option v-for="(label, key) in teams" :key="key" :value="key">{{ label }}</option>
              </select>
            </div>
            <div>
              <label for="tOwner" class="block text-sm font-semibold text-slate-700 mb-1">ชื่อผู้ดำเนินการ</label>
              <input id="tOwner" v-model="topicForm.owner_name" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-teal-500">
            </div>
            <div class="sm:col-span-2">
              <label for="tTitle" class="block text-sm font-semibold text-slate-700 mb-1">เรื่องที่คุย <span class="text-red-500">*</span></label>
              <input id="tTitle" v-model="topicForm.title" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-teal-500">
            </div>
            <div class="sm:col-span-2">
              <label for="tDetail" class="block text-sm font-semibold text-slate-700 mb-1">รายละเอียด</label>
              <textarea id="tDetail" v-model="topicForm.detail" rows="2" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-teal-500"></textarea>
            </div>
            <div class="sm:col-span-2">
              <label for="tDecision" class="block text-sm font-semibold text-slate-700 mb-1">สรุปในที่ประชุม</label>
              <textarea id="tDecision" v-model="topicForm.decision" rows="2" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-teal-500"></textarea>
            </div>
            <div class="sm:col-span-2 flex gap-2 justify-end">
              <button type="button" @click="showAdd = false" class="px-4 py-2 rounded-xl text-sm font-semibold bg-white ring-1 ring-slate-200 text-slate-600 border-0 cursor-pointer">ยกเลิก</button>
              <button type="submit" class="px-4 py-2 rounded-xl text-sm font-bold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer">บันทึกหัวข้อ</button>
            </div>
          </form>

          <div v-if="loading" class="flex justify-center py-16"><div class="spinner w-10 h-10"></div></div>
          <div v-else-if="!meetingId" class="text-center text-slate-500 py-14">สร้างการประชุมครั้งแรกจากช่องด้านซ้าย</div>
          <div v-else-if="!topics.length" class="text-center text-slate-500 py-14">ยังไม่มีหัวข้อ กด "+ เพิ่มหัวข้อ" เพื่อเริ่มบันทึก</div>
          <div v-else-if="!visibleTopics.length" class="text-center text-slate-500 py-14">ไม่มีเรื่องในแท็บนี้</div>

          <template v-else>
            <article v-for="t in visibleTopics" :key="t.id" :id="'card' + t.id" class="bg-white rounded-2xl ring-1 ring-slate-100 shadow-sm p-4 space-y-3 scroll-mt-4">
              <div class="flex gap-2 items-start flex-wrap">
                <div class="flex-1 min-w-[220px]">
                  <span class="font-mono text-xs text-purple-700 bg-purple-50 rounded px-1.5 py-0.5">{{ t.topic_code }}</span>
                  <div v-if="!editingTitle[t.id]" class="text-base font-bold text-slate-800 mt-1"><template v-if="t.topic_no">ข้อ {{ t.topic_no }}. </template>{{ t.title }}</div>
                  <div v-else class="mt-2">
                    <label :for="'ti' + t.id" class="block text-xs font-semibold text-slate-500 mb-1">เรื่องที่คุย <span class="text-red-500">*</span></label>
                    <input :id="'ti' + t.id" v-model="t.title" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-teal-500">
                  </div>
                </div>
                <span v-if="t.first_meeting_id !== meetingId" class="text-xs font-semibold text-amber-700 bg-amber-50 rounded-full px-2 py-1">ค้างจาก {{ dateLabel(t.first_meeting_date) }}</span>
                <span v-else class="text-xs font-semibold text-teal-800 bg-teal-50 ring-1 ring-teal-200 rounded-full px-2 py-1">เรื่องใหม่</span>
                <!-- สถานะ ณ การประชุมนี้ (เปลี่ยนในครั้งนี้แสดง เดิม → ใหม่) / สถานะปัจจุบันต่างจากวันประชุม แสดง "ตอนนี้" -->
                <span v-if="statusChanged(t)" class="text-xs font-semibold text-slate-500">{{ statusOf(t.status_before).label }} →</span>
                <span class="text-xs font-bold rounded-full px-2.5 py-1" :class="statusOf(meetingStatus(t)).cls">{{ statusOf(meetingStatus(t)).label }}</span>
                <span v-if="t.saved_status !== meetingStatus(t)" class="text-xs font-semibold text-slate-600 bg-slate-100 rounded-full px-2 py-1">ตอนนี้: {{ statusOf(t.saved_status).label }}</span>
                <span v-if="t.status !== baseStatus(t)" class="text-xs font-bold text-amber-700">→ {{ statusOf(t.status).label }} (ยังไม่บันทึก)</span>
              </div>
              <div v-if="editingTitle[t.id]">
                <label :for="'dt' + t.id" class="block text-xs font-semibold text-slate-500 mb-1">รายละเอียด</label>
                <textarea :id="'dt' + t.id" v-model="t.detail" rows="4" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-teal-500"></textarea>
              </div>
              <div v-else-if="t.detail">
                <div class="text-xs font-bold text-slate-500 mb-0.5">รายละเอียด</div>
                <div class="text-sm text-slate-700 whitespace-pre-wrap">{{ t.detail }}</div>
              </div>
              <!-- แก้ไขชื่อเรื่องและรายละเอียด บันทึกด้วยปุ่มบันทึกของการ์ด (ยืนยันจากผู้ใช้ 2026-11-02) -->
              <div v-if="!readOnly">
                <button type="button" @click="editingTitle[t.id] = !editingTitle[t.id]" class="px-3 py-1.5 rounded-lg text-sm font-semibold bg-white ring-1 ring-teal-400 text-teal-700 hover:bg-teal-50 border-0 cursor-pointer">{{ editingTitle[t.id] ? 'ปิดการแก้ไข' : 'แก้ไขชื่อเรื่องและรายละเอียด' }}</button>
              </div>
              <!-- ลิงก์ไปงานนี้ในเมนูงานที่ต้องติดตาม — ลงบันทึกการดำเนินการ / ดูบันทึกทั้งหมด (2026-11-03) -->
              <button type="button" @click="goToWorkCard(t)" class="bg-transparent border-0 p-0 cursor-pointer text-sm font-semibold text-teal-700 underline underline-offset-2">ดูในงานที่ต้องติดตาม ↗</button>
              <!-- หน้าที่เกี่ยวข้อง ซ่อนไว้ก่อน (ผู้ใช้สั่ง 2026-11-03) -->
              <!-- <topic-pages :topic="t" :readonly="readOnly"></topic-pages> -->
              <!-- สรุปในที่ประชุม — ใช้อ่านแจ้งในที่ประชุม จึงแสดงเป็นข้อความอ่านง่าย ไม่ใช่ช่องกรอก / กด "แก้ไข" จึงเปิดช่องกรอก (ยืนยันจากผู้ใช้ 2026-11-02) -->
              <div class="rounded-xl bg-emerald-50 ring-1 ring-emerald-200 px-4 py-3">
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-sm font-bold text-emerald-800">สรุปในที่ประชุม</span>
                  <button v-if="!readOnly" type="button" @click="toggleDecision(t)" class="ml-auto px-2.5 py-1 rounded-lg text-sm font-semibold bg-white ring-1 ring-emerald-300 text-emerald-800 border-0 cursor-pointer">{{ editingDecision[t.id] ? 'เสร็จ' : (t.decision ? 'แก้ไข' : 'เพิ่มสรุป') }}</button>
                </div>
                <template v-if="editingDecision[t.id]">
                  <!-- ชั้นหลังช่องพิมพ์ทาพื้นสีชื่อที่ @แท็ก ให้เห็นตั้งแต่ตอนพิมพ์ (ยืนยันจากผู้ใช้ 2026-11-04) — ตัวอักษร / ระยะ / แถบเลื่อน ต้องตรงกับช่องพิมพ์ -->
                  <div class="relative rounded-xl bg-white">
                    <div aria-hidden="true" class="absolute inset-0 overflow-y-scroll border border-transparent rounded-xl px-3 py-2 text-base whitespace-pre-wrap break-words text-transparent pointer-events-none" v-html="mentionBackdrop(t.decision)"></div>
                    <textarea :id="'de' + t.id" v-model="t.decision" rows="3" aria-label="สรุปในที่ประชุม" class="relative block w-full overflow-y-scroll border border-emerald-300 rounded-xl px-3 py-2 text-base bg-transparent outline-none focus:border-teal-500"
                              @input="onMentionInput($event, 'de' + t.id); syncBackdrop($event)" @click="onMentionInput($event, 'de' + t.id)" @scroll="syncBackdrop" @keydown="onMentionKeydown($event, t, 'decision', 'de' + t.id)" @blur="closeMention"></textarea>
                  </div>
                  <!-- @แท็กผู้เข้าร่วมประชุม — รายชื่อเฉพาะคนที่มาประชุมครั้งนี้ (ยืนยันจากผู้ใช้ 2026-11-04) -->
                  <div v-if="mention.key === 'de' + t.id" role="listbox" class="mt-1 max-w-sm rounded-xl border border-slate-300 bg-white shadow-lg overflow-hidden">
                    <div v-for="(n, i) in mention.items" :key="n" role="option" :aria-selected="i === mention.sel" @mousedown.prevent="pickMention(i, t, 'decision', 'de' + t.id)"
                         class="px-3 py-2 text-sm cursor-pointer" :class="i === mention.sel ? 'bg-teal-50 text-teal-800 font-semibold' : 'text-slate-700 hover:bg-slate-50'">@ {{ n }}</div>
                    <div v-if="!mention.items.length" class="px-3 py-2 text-sm text-slate-400">ไม่พบชื่อในผู้เข้าร่วมประชุม</div>
                  </div>
                  <div v-if="mentionNames.length" class="mt-1 text-xs text-slate-500">พิมพ์ @ เพื่อแท็กผู้เข้าร่วมประชุม</div>
                </template>
                <div v-else-if="t.decision" class="text-base sm:text-lg leading-loose text-slate-900 whitespace-pre-wrap [text-wrap:pretty]" v-html="mentionHtml(t.decision)"></div>
                <div v-else class="text-sm text-slate-500">ยังไม่มีสรุป</div>
              </div>
              <div v-if="mentionedIn(t).length" class="text-sm text-slate-600"><span class="font-semibold text-slate-500">เกี่ยวข้อง:</span> {{ mentionedIn(t).join(', ') }}</div>
              <!-- อ่านอย่างเดียว: สถานะ ณ การประชุมนี้ + ผู้ดำเนินการ (ป้ายด้านบนบอกสถานะตอนนี้ถ้าต่างกัน) -->
              <div v-if="readOnly" class="text-sm text-slate-700">
                สถานะ ณ การประชุมนี้: <b>{{ statusChangeText(t) }}</b><template v-if="ownerText(t)"> · ผู้ดำเนินการ: {{ ownerText(t) }}</template>
              </div>
              <div v-else class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <div class="flex items-center gap-1 mb-1">
                    <label :for="'st' + t.id" class="text-xs font-semibold text-slate-500">สถานะ</label>
                    <button type="button" @click="statusHelpOpen = true" aria-label="สถานะแต่ละแบบใช้เมื่อไร" title="สถานะแต่ละแบบใช้เมื่อไร" class="bg-transparent border-0 p-0 cursor-pointer text-sm text-slate-400 hover:text-teal-700 leading-none">ⓘ</button>
                  </div>
                  <select :id="'st' + t.id" v-model="t.status" @change="onStatusChange(t)" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white">
                    <option v-for="(s, key) in statuses" :key="key" :value="key">{{ s.label }}</option>
                  </select>
                </div>
                <div>
                  <label :for="'tm' + t.id" class="block text-xs font-semibold text-slate-500 mb-1">ทีมผู้ดำเนินการ</label>
                  <select :id="'tm' + t.id" v-model="t.owner_team" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white">
                    <option value="">-- เลือก --</option>
                    <option v-for="(label, key) in teams" :key="key" :value="key">{{ label }}</option>
                  </select>
                </div>
                <div>
                  <label :for="'ow' + t.id" class="block text-xs font-semibold text-slate-500 mb-1">ชื่อผู้ดำเนินการ</label>
                  <input :id="'ow' + t.id" v-model="t.owner_name" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm">
                </div>
              </div>
              <!-- งานที่ทำระหว่างสัปดาห์ — ไม่ต้องพิมพ์ซ้ำในที่ประชุม -->
              <div v-if="logsSincePrev(t).length" class="border-t border-slate-100 pt-3 space-y-1">
                <div class="text-xs font-bold text-slate-500">ทำไปตั้งแต่ประชุมครั้งก่อน</div>
                <div v-for="l in logsSincePrev(t)" :key="l.id" class="grid grid-cols-[96px_1fr] gap-2 text-sm">
                  <span class="font-semibold text-slate-500">{{ shortDate(l.log_date) }}</span>
                  <span class="min-w-0 text-slate-700 whitespace-pre-wrap"><span v-if="l.status_after" class="inline-flex items-center gap-1 mb-0.5 text-xs font-semibold"><span class="rounded-full px-2 py-0.5" :class="statusOf(l.status_before).cls">{{ statusOf(l.status_before).label }}</span>→<span class="rounded-full px-2 py-0.5" :class="statusOf(l.status_after).cls">{{ statusOf(l.status_after).label }}</span></span><span v-if="l.status_after && l.note" class="block"></span>{{ l.note }}<span v-if="l.files" class="block text-xs text-slate-500">ไฟล์: {{ l.files }}</span></span>
                </div>
              </div>
              <!-- อ่านอย่างเดียวและไม่มีอัปเดต (เช่น การประชุมครั้งแรก) ไม่แสดงหัวข้อเปล่า (2026-11-03) -->
              <div v-if="!readOnly || noteHistory(t).length" class="border-t border-slate-100 pt-3 space-y-2">
                <div class="text-xs font-bold text-slate-500">อัปเดตความคืบหน้า</div>
                <div v-for="n in noteHistory(t)" :key="n.meeting_id" class="grid grid-cols-[96px_1fr] gap-2 text-sm">
                  <span class="font-semibold text-slate-500">{{ shortDate(n.meeting_date) }}</span>
                  <span class="text-slate-700 whitespace-pre-wrap min-w-0" v-html="mentionHtml(n.note)"></span>
                </div>
                <div v-if="!readOnly && !noteHistory(t).length && t.first_meeting_id === meetingId" class="text-sm text-slate-500">เปิดเรื่องในการประชุมครั้งนี้ อัปเดตได้ในการประชุมครั้งถัดไป</div>
                <!-- ช่องอัปเดตเฉพาะเรื่องที่ตามมาจากครั้งก่อน — ครั้งแรกใช้สรุปผล (ยืนยันจากผู้ใช้ 2026-11-02) -->
                <template v-if="!readOnly && t.first_meeting_id !== meetingId">
                  <!-- บันทึกแล้ว = แสดงเป็นข้อความ (ชื่อที่แท็กตัวหนาสีเขียว) กด "แก้ไข" จึงเปิดช่องพิมพ์ — แบบเดียวกับสรุปในที่ประชุม (ยืนยันจากผู้ใช้ 2026-11-04) -->
                  <div class="flex items-center gap-2">
                    <label :for="'no' + t.id" class="text-sm font-semibold text-slate-700">ครั้งนี้ ({{ meeting ? shortDate(meeting.meeting_date) : '' }})</label>
                    <button v-if="(noteDrafts[t.id] || '').trim()" type="button" @click="toggleNote(t)" class="ml-auto px-2.5 py-1 rounded-lg text-sm font-semibold bg-white ring-1 ring-slate-300 text-slate-700 border-0 cursor-pointer">{{ noteEditing(t) ? 'เสร็จ' : 'แก้ไข' }}</button>
                  </div>
                  <div v-if="!noteEditing(t)" class="text-sm text-slate-700 whitespace-pre-wrap leading-relaxed [text-wrap:pretty]" v-html="mentionHtml(noteDrafts[t.id])"></div>
                  <template v-else>
                  <div class="relative rounded-xl bg-white">
                    <div aria-hidden="true" class="absolute inset-0 overflow-y-scroll border border-transparent rounded-xl px-3 py-2 text-sm whitespace-pre-wrap break-words text-transparent pointer-events-none" v-html="mentionBackdrop(noteDrafts[t.id])"></div>
                    <textarea :id="'no' + t.id" v-model="noteDrafts[t.id]" rows="12" class="relative block w-full overflow-y-scroll border border-slate-300 rounded-xl px-3 py-2 text-sm bg-transparent outline-none focus:border-teal-500" placeholder="พิมพ์ว่าดำเนินการถึงไหน — พิมพ์ @ เพื่อแท็กผู้เข้าร่วมประชุม"
                              @input="onMentionInput($event, 'no' + t.id); syncBackdrop($event)" @click="onMentionInput($event, 'no' + t.id)" @scroll="syncBackdrop" @keydown="onMentionKeydown($event, noteDrafts, t.id, 'no' + t.id)" @blur="closeMention"></textarea>
                  </div>
                  <!-- @แท็กผู้เข้าร่วมประชุม — รายชื่อเฉพาะคนที่มาประชุมครั้งนี้ (ยืนยันจากผู้ใช้ 2026-11-04) -->
                  <div v-if="mention.key === 'no' + t.id" role="listbox" class="mt-1 max-w-sm rounded-xl border border-slate-300 bg-white shadow-lg overflow-hidden">
                    <div v-for="(n, i) in mention.items" :key="n" role="option" :aria-selected="i === mention.sel" @mousedown.prevent="pickMention(i, noteDrafts, t.id, 'no' + t.id)"
                         class="px-3 py-2 text-sm cursor-pointer" :class="i === mention.sel ? 'bg-teal-50 text-teal-800 font-semibold' : 'text-slate-700 hover:bg-slate-50'">@ {{ n }}</div>
                    <div v-if="!mention.items.length" class="px-3 py-2 text-sm text-slate-400">ไม่พบชื่อในผู้เข้าร่วมประชุม</div>
                  </div>
                  </template>
                </template>
              </div>
              <!-- ปุ่มบันทึกเดียวต่อการ์ด บันทึกทุกช่องพร้อมกัน ไม่บันทึกเองแล้ว เพื่อไม่ให้งงว่าช่องไหนบันทึกหรือยัง (ยืนยันจากผู้ใช้ 2026-11-02) -->
              <div v-if="!readOnly" class="flex items-center gap-3 flex-wrap border-t border-slate-100 pt-3">
                <button type="button" @click="saveTopic(t)" :disabled="savingId === t.id" class="px-5 py-2.5 rounded-xl text-sm font-bold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer disabled:opacity-50">{{ savingId === t.id ? 'กำลังบันทึก…' : 'บันทึก' }}</button>
                <span v-if="isDirty(t)" class="text-sm font-semibold text-amber-700">มีการแก้ไขที่ยังไม่บันทึก</span>
                <span v-else class="text-sm text-slate-500">{{ savedText[t.id] || '' }}</span>
              </div>
            </article>
          </template>
        </section>
      </main>
    </div>

    <!-- คำอธิบายสถานะ (ไอคอน ⓘ ข้างช่องสถานะ — 2026-11-03) ซ้อนบนหน้าเดิม ค่าที่กำลังแก้ในการ์ดไม่หาย -->
    <div v-if="statusHelpOpen" class="fixed inset-0 bg-black/40 flex items-center justify-center z-[1100] p-4" @click.self="statusHelpOpen = false">
      <div class="bg-white rounded-2xl w-full max-w-[560px] shadow-2xl flex flex-col overflow-hidden" style="max-height:85vh">
        <div class="px-6 py-4 flex items-center justify-between border-b border-slate-100">
          <h3 class="font-bold text-lg text-slate-800 m-0">สถานะแต่ละแบบใช้เมื่อไร</h3>
          <button type="button" class="text-slate-400 hover:text-slate-600 bg-transparent border-0 text-2xl cursor-pointer leading-none" aria-label="ปิด" @click="statusHelpOpen = false">×</button>
        </div>
        <div class="overflow-y-auto px-6 py-4 text-[.95rem] text-slate-700 leading-relaxed">
          <div v-for="h in statusHelp" :key="h[0]" class="grid grid-cols-[200px_1fr] gap-3 items-center py-2.5 border-t border-slate-100 first:border-t-0">
            <div><span class="inline-block px-2.5 py-1 rounded-full text-sm font-semibold" :class="statusOf(h[0]).cls">{{ statusOf(h[0]).label }}</span></div>
            <div>{{ h[1] }}</div>
          </div>
          <p class="mt-3 mb-0 text-sm text-slate-500">ได้ข้อสรุปในที่ประชุมแล้ว อย่าลืมเปลี่ยนจาก "รอตัดสินใจ" เป็นสถานะถัดไป แล้วกดบันทึก</p>
        </div>
      </div>
    </div>

    <!-- สรุปการประชุม (Minutes + งานที่ต้องทำต่อ — ยืนยันจากผู้ใช้ 2026-11-03): ตรวจก่อนส่ง → คัดลอกไปวางกลุ่ม LINE / อีเมล หรือพิมพ์ -->
    <div v-if="summaryOpen" class="fixed inset-0 bg-black/40 flex items-center justify-center z-[1100] p-4" @click.self="summaryOpen = false">
      <div class="bg-white rounded-2xl w-full max-w-[880px] shadow-2xl flex flex-col overflow-hidden" style="max-height:90vh">
        <div class="px-6 py-4 flex items-center gap-3 border-b border-slate-100 flex-wrap">
          <h3 class="font-bold text-lg text-slate-800 m-0 mr-auto">สรุปการประชุม {{ meeting ? dateLabel(meeting.meeting_date) : '' }}</h3>
          <!-- แชร์ลิงก์อ่านอย่างเดียว (ยืนยันจากผู้ใช้ 2026-11-04) — ป้าย "แชร์อยู่" ให้รู้ว่ามีลิงก์เปิดได้อยู่ -->
          <button type="button" @click="openShareDialog" class="px-4 py-2 rounded-xl text-sm font-bold bg-white ring-1 ring-teal-500 text-teal-700 border-0 cursor-pointer">
            แชร์ลิงก์<span v-if="shareActive" class="ml-1.5 text-xs font-semibold rounded-full px-2 py-0.5 bg-teal-100 text-teal-800">แชร์อยู่</span>
          </button>
          <button type="button" @click="copySummary" class="px-4 py-2 rounded-xl text-sm font-bold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer">คัดลอกสรุป</button>
          <button type="button" @click="printSummary" class="px-4 py-2 rounded-xl text-sm font-bold bg-white ring-1 ring-teal-500 text-teal-700 border-0 cursor-pointer">พิมพ์</button>
          <button type="button" class="text-slate-400 hover:text-slate-600 bg-transparent border-0 text-2xl cursor-pointer leading-none" aria-label="ปิด" @click="summaryOpen = false">×</button>
        </div>
        <div class="overflow-y-auto px-6 py-4 space-y-4 text-[.95rem] text-slate-700 leading-relaxed">
          <!-- ตรวจก่อนส่ง — เตือนอย่างเดียว ไม่บล็อกการคัดลอก / พิมพ์ -->
          <div v-if="meetingSummary.checks.length" class="rounded-xl bg-amber-50 ring-1 ring-amber-200 px-4 py-3">
            <div class="font-bold text-amber-800 mb-1">ตรวจก่อนส่ง — {{ meetingSummary.checks.length }} เรื่องยังไม่ครบ</div>
            <div v-for="c in meetingSummary.checks" :key="c.t.id" class="text-sm py-0.5">
              <button type="button" @click="goToCard(c.t)" class="bg-transparent border-0 p-0 cursor-pointer font-semibold text-teal-700 underline underline-offset-2 text-left">{{ topicLabel(c.t) }} {{ c.t.title }}</button>
              <span class="text-amber-800"> — {{ c.problems.join(' · ') }}</span>
            </div>
          </div>
          <div v-else class="rounded-xl bg-emerald-50 ring-1 ring-emerald-200 px-4 py-3 text-sm font-semibold text-emerald-800">ข้อมูลครบ พร้อมส่งสรุป</div>

          <!-- รายงานการประชุมตามโครงระเบียบงานสารบรรณ จัดให้อ่านง่าย (ยืนยันจากผู้ใช้ 2026-11-04) -->
          <article v-if="meeting" class="rounded-xl ring-1 ring-slate-200 px-5 sm:px-7 py-5 space-y-5">
            <header class="text-center">
              <div class="text-lg font-bold text-slate-800">{{ reportTitle }}</div>
              <div class="text-sm text-slate-500">ครั้งที่ {{ meetingNoText }}</div>
            </header>
            <dl class="m-0 grid grid-cols-[110px_minmax(0,1fr)] gap-x-3 gap-y-0.5 text-sm">
              <dt class="text-slate-500">เมื่อ</dt><dd class="m-0">{{ longThaiDate(meeting.meeting_date) }}</dd>
              <template v-if="meetingTimeRange(meeting)"><dt class="text-slate-500">เวลา</dt><dd class="m-0">{{ meetingTimeRange(meeting) }}</dd></template>
              <template v-if="meeting.location"><dt class="text-slate-500">ณ</dt><dd class="m-0">{{ meeting.location }}</dd></template>
              <template v-if="roleNames('chair')"><dt class="text-slate-500">ประธาน</dt><dd class="m-0">{{ roleNames('chair') }}</dd></template>
              <template v-if="roleNames('secretary')"><dt class="text-slate-500">ผู้จดรายงาน</dt><dd class="m-0">{{ roleNames('secretary') }}</dd></template>
            </dl>

            <section v-for="g in minutesAttendeeGroups" :key="g.key" class="border-t border-slate-100 pt-3">
              <div class="font-bold text-slate-800 mb-1">{{ g.title }} ({{ g.list.length }} คน)</div>
              <ol class="m-0 pl-6 list-decimal sm:columns-2 gap-8 text-sm">
                <li v-for="a in g.list" :key="a.id" class="break-inside-avoid">{{ a.attendee_name }}<span v-if="a.note" class="text-slate-500"> — {{ a.note }}</span></li>
              </ol>
            </section>
            <div v-if="!attendees.length" class="border-t border-slate-100 pt-3 text-sm text-slate-500">ยังไม่ระบุผู้เข้าร่วมประชุม</div>

            <section class="border-t border-slate-100 pt-3">
              <div class="font-bold text-slate-800 mb-1">ภาพรวม</div>
              <div v-for="g in meetingSummary.groups" :key="g.section" class="text-sm">
                {{ agendaTitle(g.section) }} <b>{{ g.topics.length }}</b> เรื่อง<template v-if="g.counts.length">: {{ g.counts.map(c => c.label + ' ' + c.count).join(' · ') }}</template>
              </div>
            </section>

            <section v-for="g in meetingSummary.groups.filter(x => x.topics.length)" :key="'s' + g.section" class="border-t border-slate-100 pt-3">
              <div class="font-bold text-slate-800 mb-2">{{ agendaTitle(g.section) }}</div>
              <div v-for="t in g.topics" :key="t.id" class="rounded-lg ring-1 ring-slate-200 px-4 py-3 mb-2.5">
                <div class="font-semibold text-slate-800">{{ topicLabel(t) }} {{ t.title }}</div>
                <div class="text-sm text-slate-500 mt-0.5">
                  สถานะ: <span v-if="statusChanged(t)">{{ statusOf(t.status_before).label }} → </span><span class="text-xs font-bold rounded-full px-2 py-0.5" :class="statusOf(meetingStatus(t)).cls">{{ statusOf(meetingStatus(t)).label }}</span>
                  <template v-if="ownerText(t)"> · ผู้รับผิดชอบ: {{ ownerText(t) }}</template>
                </div>
                <template v-if="g.section === groupCarried && (noteDrafts[t.id] || '').trim()">
                  <div class="text-xs font-bold text-slate-500 mt-2.5 mb-0.5">ความคืบหน้า</div>
                  <div class="text-sm text-slate-700 whitespace-pre-wrap" v-html="mentionHtml(noteDrafts[t.id].trim())"></div>
                </template>
                <template v-if="t.decision.trim()">
                  <div class="text-xs font-bold text-slate-500 mt-2.5 mb-0.5">มติที่ประชุม</div>
                  <div class="rounded-lg bg-emerald-50 px-3 py-2 text-sm text-emerald-950 whitespace-pre-wrap" v-html="mentionHtml(t.decision.trim())"></div>
                </template>
              </div>
            </section>

            <section v-if="meetingSummary.owners.length" class="border-t border-slate-100 pt-3">
              <div class="font-bold text-slate-800 mb-1">งานที่ต้องดำเนินการต่อ</div>
              <table class="w-full text-sm border-collapse">
                <thead><tr class="text-left text-xs text-slate-500"><th class="py-1.5 pr-3 font-semibold w-2/5">ผู้รับผิดชอบ</th><th class="py-1.5 font-semibold">เรื่อง</th></tr></thead>
                <tbody>
                  <tr v-for="o in meetingSummary.owners" :key="o.name" class="border-t border-slate-100 align-top"><td class="py-1.5 pr-3">{{ o.name }}</td><td class="py-1.5">{{ o.topics.map(t => topicLabel(t)).join(', ') }}</td></tr>
                </tbody>
              </table>
            </section>

            <!-- กำหนดประชุมครั้งต่อไป (เบื้องต้น) — เก็บกับการประชุมครั้งนี้ ไม่สร้างการประชุมล่วงหน้า (ยืนยันจากผู้ใช้ 2026-11-03) -->
            <section class="border-t border-slate-100 pt-3 text-sm space-y-1">
              <div><span class="font-bold text-slate-800">กำหนดประชุมครั้งต่อไป (เบื้องต้น):</span>
                <template v-if="meeting.next_meeting_date"> {{ nextMeetingText(meeting) }}</template>
                <span v-else class="text-slate-500"> ยังไม่ได้นัด (ไม่แสดงในข้อความสรุป)</span>
                <button type="button" @click="openNextDialog" class="ml-2 bg-transparent border-0 p-0 cursor-pointer text-sm font-semibold text-teal-700 underline underline-offset-2">{{ meeting.next_meeting_date ? 'แก้' : '+ นัด' }}</button>
              </div>
              <div v-if="meeting.end_time"><span class="font-bold text-slate-800">เลิกประชุมเวลา</span> {{ timeLabel(meeting.end_time) }} น.</div>
            </section>

            <footer v-if="roleNames('secretary') || roleNames('chair')" class="grid grid-cols-2 gap-6 text-center text-sm pt-6">
              <div v-if="roleNames('secretary')"><div class="border-t border-slate-300 mx-6 mb-1 mt-6"></div>{{ roleNames('secretary') }}<div class="text-slate-500">ผู้จดรายงานการประชุม</div></div>
              <div v-if="roleNames('chair')" :class="roleNames('secretary') ? '' : 'col-start-2'"><div class="border-t border-slate-300 mx-6 mb-1 mt-6"></div>{{ roleNames('chair') }}<div class="text-slate-500">ประธาน / ผู้ตรวจรายงานการประชุม</div></div>
            </footer>
          </article>
        </div>
      </div>
    </div>

    <!-- หน้าต่างแชร์ลิงก์อ่านอย่างเดียว — ทุกคนที่มีลิงก์เปิดได้ ไม่ต้อง login / อายุค่าเริ่ม 30 วัน / ปิดการแชร์ได้ (ยืนยันจากผู้ใช้ 2026-11-04) -->
    <div v-if="shareDialog.open && meeting" class="fixed inset-0 bg-black/40 flex items-center justify-center z-[1200] p-4" @click.self="shareDialog.open = false">
      <div class="bg-white rounded-2xl w-full max-w-[560px] shadow-2xl p-6" role="dialog" aria-modal="true" aria-labelledby="shareDialogTitle">
        <h3 id="shareDialogTitle" class="font-bold text-lg text-slate-800 m-0">แชร์รายงานการประชุม {{ dateLabel(meeting.meeting_date) }}</h3>
        <p class="mt-1 mb-4 text-sm text-slate-500">ทุกคนที่มีลิงก์เปิดดูได้โดยไม่ต้อง login — <b class="text-slate-700">ดูได้อย่างเดียว แก้ไขไม่ได้</b> และเห็นข้อมูลล่าสุดที่บันทึกไว้เสมอ</p>
        <template v-if="meeting.share_token">
          <label for="shareUrl" class="block text-sm font-semibold text-slate-600 mb-1">ลิงก์</label>
          <div class="flex gap-2">
            <input id="shareUrl" :value="shareUrl" readonly @focus="$event.target.select()" class="flex-1 min-w-0 border border-slate-300 rounded-xl px-3 py-2 text-sm bg-slate-50 text-slate-700">
            <button type="button" @click="copyShareUrl" class="px-4 py-2 rounded-xl text-sm font-bold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer whitespace-nowrap">คัดลอกลิงก์</button>
          </div>
          <p class="mt-2 mb-0 text-sm" :class="shareActive ? 'text-slate-600' : 'text-rose-700 font-semibold'">
            {{ shareActive ? 'ใช้ได้ถึง' : 'หมดอายุแล้วเมื่อ' }} {{ shareExpiryText }}
          </p>
        </template>
        <p v-else class="text-sm text-slate-600 mb-0">ยังไม่ได้แชร์</p>
        <div class="flex flex-wrap items-end gap-2 mt-4">
          <div>
            <label for="shareDays" class="block text-sm font-semibold text-slate-600 mb-1">อายุลิงก์</label>
            <select id="shareDays" v-model.number="shareDialog.days" class="border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white">
              <option v-for="d in [7, 30, 90, 180, 365]" :key="d" :value="d">{{ d }} วัน</option>
            </select>
          </div>
          <button type="button" @click="shareMeeting" :disabled="shareDialog.saving" class="px-4 py-2 rounded-xl text-sm font-bold bg-white ring-1 ring-teal-500 text-teal-700 border-0 cursor-pointer disabled:opacity-50">{{ meeting.share_token ? 'ต่ออายุลิงก์' : 'สร้างลิงก์' }}</button>
          <button v-if="meeting.share_token" type="button" @click="unshareMeeting" :disabled="shareDialog.saving" class="ml-auto px-4 py-2 rounded-xl text-sm font-semibold bg-white ring-1 ring-rose-300 text-rose-700 hover:bg-rose-50 border-0 cursor-pointer disabled:opacity-50">ปิดการแชร์</button>
