      editingNote: {},     // ความคืบหน้าครั้งนี้ที่เปิดช่องพิมพ์อยู่ (บันทึกแล้ว = แสดงเป็นข้อความ)
      editingTitle: {},
      statuses: MEETING_STATUSES,
      VIEW_INFO,
      attendanceTypes: ATTENDANCE,
      meetingRoles: MEETING_ROLES,
      timelineFilter: { scope: 'pending' }, // ไทม์ไลน์: pending = ยังไม่จบ, finished = จบแล้ว, all = ทั้งหมด (ผู้ดำเนินการ/ทีม ใช้ workFilter ร่วมกับแท็บรายการงาน)
      timelineOpen: null,                                     // งานที่เปิดดูไทม์ไลน์ละเอียด
      timelineSort: '',                                       // เรียงตามสถานะปัจจุบัน: asc / desc / '' = ตามวันที่เปิดเรื่อง
      statusHelp: STATUS_HELP,
      statusHelpOpen: false,
      teams: { sale: 'ทีม Sale', pm: 'Project Manager', dev: 'ทีม Dev', meeting: 'ที่ประชุมลงมติ' },
      topicFilter: '',   // '' = ทุกเรื่อง, ค่าอื่น = สถานะที่กดเลือก
      showAdd: false,
      newMeetingDate: '',
      topicForm: { topic_no: '', title: '', detail: '', decision: '', owner_team: '', owner_name: '' },
    };
  },
  computed: {
    selectedMeetingEmpty() {
      const m = this.meetings.find(x => x.id === this.meetingId);
      return !!m && Number(m.new_count) === 0 && Number(m.note_count) === 0;
    },
    workOwners() { return [...new Set(this.workTopics.map(t => t.owner_name).filter(Boolean))].sort(); },
    // ตัวกรอง / ตัวเลข / กลุ่ม / ป้ายสถานะ ใช้สถานะที่บันทึกแล้ว (saved_status) — เลือกในช่องแล้วยังไม่กดบันทึก การ์ดอยู่ที่เดิม (ยืนยันจากผู้ใช้ 2026-11-03)
    // งานตามการประชุม / ทีม / ผู้ดำเนินการที่เลือก (ยังไม่กรองสถานะ) — ใช้นับตัวเลขสถานะ
    // "จากการประชุม X" = เรื่องที่อยู่ในการประชุม X (เรื่องใหม่ + เรื่องสืบเนื่อง) เหมือนหน้าบันทึกวาระและมติ
    workInScope() {
      const f = this.workFilter;
      return this.workTopics.filter(t => (!f.team || t.owner_team === f.team) && (!f.owner || t.owner_name === f.owner)
        && (!f.meeting || !this.workMeetingTopicIds || this.workMeetingTopicIds.includes(t.id)));
    },
    // การประชุมล่าสุดที่มีเรื่องแล้ว (การประชุมล่วงหน้าที่ยังว่างไม่นับ) — ใช้ตัดสิน "ยังไม่อัปเดตหลังประชุม"
    latestMeeting() { return this.meetings.find(m => Number(m.new_count) > 0 || Number(m.note_count) > 0) || this.meetings[0] || null; },
    // การประชุมที่ใช้เทียบ "ยังไม่อัปเดตหลังประชุม" = ที่เลือกในตัวกรอง / ทุกครั้ง = ล่าสุด
    workCompareMeeting() { return this.meetings.find(m => m.id === Number(this.workFilter.meeting)) || this.latestMeeting; },
    // ===== ไทม์ไลน์งาน (ยืนยันจากผู้ใช้ 2026-11-03) =====
    // คอลัมน์ = การประชุมที่มีเรื่องแล้ว เรียงจากเก่าไปใหม่ (การประชุมล่วงหน้าที่ยังว่างไม่นับ)
    timelineMeetings() { return [...this.meetings].filter(m => Number(m.new_count) > 0 || Number(m.note_count) > 0).reverse(); },
    // ชื่อที่แท็กได้ = ผู้มาประชุมครั้งนี้
    mentionNames() { return this.attendees.filter(a => a.attendance === 'present').map(a => a.attendee_name); },
    attendeeCountText() {
      return Object.keys(ATTENDANCE).map(k => [k, this.attendees.filter(a => a.attendance === k).length])
        .filter(([, n]) => n).map(([k, n]) => `${ATTENDANCE[k].label} ${n} คน`).join(' · ');
    },
    // ประธาน / ผู้จดบันทึก ในบรรทัดย่อที่หัวการประชุม
    attendeeKeyRoles() {
      return ['chair', 'secretary'].map(role => ({ role, label: MEETING_ROLES[role], names: this.attendees.filter(a => a.meeting_role === role).map(a => a.attendee_name).join(', ') }))
        .filter(r => r.names);
    },
    // รายชื่อเต็มแยก มา / ลา / ไม่มา
    attendeeGroups() {
      return Object.keys(ATTENDANCE).map(key => ({ key, label: ATTENDANCE[key].label, list: this.attendees.filter(a => a.attendance === key) })).filter(g => g.list.length);
    },
    // บรรทัดผู้เข้าร่วมในสรุปการประชุม: ผู้มาประชุม / ผู้ลา / ผู้ไม่มาประชุม (บทบาทต่อท้ายชื่อ)
    // รายชื่อในรายงาน: ผู้มาประชุม (ผู้ใช้ระบบ) / ผู้ไม่มาประชุม (ลา, ไม่มา) / ผู้เข้าร่วมประชุม (คนนอกระบบที่มา) — บทบาทต่อท้ายชื่อ
    minutesAttendeeGroups() {
      const role = a => a.meeting_role !== 'member' ? MEETING_ROLES[a.meeting_role] : '';
      return [
        { key: 'present', title: 'ผู้มาประชุม', list: this.attendees.filter(a => a.attendance === 'present' && a.user_id).map(a => ({ ...a, note: role(a) })) },
        { key: 'absent', title: 'ผู้ไม่มาประชุม', list: this.attendees.filter(a => a.attendance !== 'present').map(a => ({ ...a, note: [ATTENDANCE[a.attendance].label, role(a)].filter(Boolean).join(' · ') })) },
        { key: 'guest', title: 'ผู้เข้าร่วมประชุม', list: this.attendees.filter(a => a.attendance === 'present' && !a.user_id).map(a => ({ ...a, note: role(a) })) },
      ].filter(g => g.list.length);
    },
    // ลิงก์แชร์ยังเปิดได้ (มีรหัส + ยังไม่หมดอายุ)
    shareActive() {
      const m = this.meeting;
      return !!m?.share_token && (!m.share_expires_at || new Date(m.share_expires_at.replace(' ', 'T')) > new Date());
    },
    shareUrl() { return this.meeting?.share_token ? new URL('meeting-view.html?t=' + this.meeting.share_token, window.location.href).href : ''; },
    shareExpiryText() {
      const v = this.meeting?.share_expires_at;
      return v ? `${this.dateLabel(v.slice(0, 10))} เวลา ${this.timeLabel(v.slice(11, 16))} น.` : 'ไม่หมดอายุ';
    },
    reportTitle() { return 'รายงานการประชุม' + (this.meeting?.title ? ' ' + this.meeting.title : ''); },
    // ครั้งที่ = ลำดับวันประชุมในปีเดียวกัน (ไม่เก็บในฐานข้อมูล)
    meetingNoText() {
      if (!this.meeting) return '';
      const d = this.meeting.meeting_date, year = d.slice(0, 4);
      const n = this.meetings.filter(m => m.meeting_date.slice(0, 4) === year && m.meeting_date <= d).length;
      return `${n}/${Number(year) + 543}`;
    },
    // งานตามทีม/ผู้ดำเนินการ (ก่อนแยกยังไม่จบ/จบแล้ว) — ใช้นับจำนวนบนปุ่ม
    timelineBaseTopics() {
      const f = this.workFilter;
      return this.workTopics.filter(t => (!f.team || t.owner_team === f.team) && (!f.owner || t.owner_name === f.owner));
    },
    timelineScopes() {
      const finished = this.timelineBaseTopics.filter(t => FINISHED_STATUSES.includes(t.saved_status)).length;
      const all = this.timelineBaseTopics.length;
      return [
        { key: 'pending', label: 'ยังไม่จบ', count: all - finished },
        { key: 'finished', label: 'จบแล้ว', count: finished },
        { key: 'all', label: 'ทั้งหมด', count: all },
      ];
    },
    // วันนัดครั้งถัดไปจากการประชุมล่าสุด + จำนวนงานที่ยังไม่อัปเดตหลังประชุม (ตามตัวกรองผู้ดำเนินการ/ทีม)
    nextDraftChanged() {
      const m = this.meeting || {};
      return this.nextDraft.date !== (m.next_meeting_date || '') || this.nextDraft.time !== (m.next_meeting_time || '').slice(0, 5)
        || this.nextDraft.note.trim() !== (m.next_meeting_note || '');
    },
    nextMeetingInfo() {
      const date = this.latestMeeting?.next_meeting_date;
      if (!date) return null;
      const days = Math.round((new Date(date + 'T00:00:00') - new Date(this.todayDate() + 'T00:00:00')) / 86400000);
      const daysText = days > 0 ? `อีก ${days} วัน` : days === 0 ? 'วันนี้' : `เลยวันนัดมา ${-days} วัน`;
      const pending = this.timelineBaseTopics.filter(t => this.needsUpdate(t)).length;
      return { date, daysText, pending };
    },
    timelineGroups() { return this.timelineGroupsOf(this.timelineRows); },
    timelineRows() {
      const scope = this.timelineFilter.scope;
      return this.timelineBaseTopics
        .filter(t => scope === 'all' || (scope === 'finished') === FINISHED_STATUSES.includes(t.saved_status))
        .sort((a, b) => {
          // สถานะเดียวกัน = เรียงตามวันที่เปิดเรื่อง แล้วเลขข้อ
          const byDate = a.first_meeting_date.localeCompare(b.first_meeting_date) || (Number(a.topic_no) || 999) - (Number(b.topic_no) || 999);
          if (!this.timelineSort) return byDate;
          const byStatus = WORK_STATUS_ORDER.indexOf(a.saved_status) - WORK_STATUS_ORDER.indexOf(b.saved_status);
          return (this.timelineSort === 'desc' ? -byStatus : byStatus) || byDate;
        })
        .map(t => ({ t, ...this.buildTimeline(t) }));
    },
    // ช่วงเวลาที่ดู = จากการประชุมที่เลือก ถึงก่อนการประชุมครั้งถัดไป (ครั้งล่าสุด = ถึงวันนี้) / ทุกครั้ง = null (ยืนยันจากผู้ใช้ 2026-11-03)
    workPeriod() {
      const m = this.meetings.find(x => x.id === Number(this.workFilter.meeting));
      if (!m) return null;
      const next = [...this.meetings].reverse()
        .find(x => x.meeting_date > m.meeting_date && (Number(x.new_count) > 0 || Number(x.note_count) > 0));
      return { meeting: m, start: m.meeting_date, end: next ? next.meeting_date : null, next: next || null };
    },
    // ช่วงของการประชุมที่ผ่านไปแล้ว (มีการประชุมครั้งถัดไป) — สถานะแสดงเป็นของช่วงนั้น ไม่ใช่ปัจจุบัน
    workPastPeriod() { return !!this.workPeriod?.end; },
    // เรียงตามลำดับที่ต้องทำ: กำลังทำ → รอดำเนินการ → รอขึ้นระบบจริง → รอตัดสินใจ → จบแล้ว (2026-11-03) — ใช้สถานะของช่วงที่ดู
    visibleWork() {
      const f = this.workFilter;
      return this.workInScope
        .filter(t => f.status === 'pending' ? !FINISHED_STATUSES.includes(this.viewStatus(t)) : (!f.status || this.viewStatus(t) === f.status))
        .sort((a, b) => WORK_STATUS_ORDER.indexOf(this.viewStatus(a)) - WORK_STATUS_ORDER.indexOf(this.viewStatus(b)));
    },
    workPendingCount() { return this.workInScope.filter(t => !FINISHED_STATUSES.includes(this.viewStatus(t))).length; },
    workStatusCounts() {
      return WORK_STATUS_ORDER
        .map(key => ({ key, ...this.statuses[key], count: this.workInScope.filter(t => this.viewStatus(t) === key).length }))
        .filter(s => s.count > 0);
    },
    // การประชุมที่ไม่ใช่ครั้งล่าสุด = อ่านอย่างเดียว จนกว่าจะกดแก้ไข
    readOnly() { return !!this.meeting && !this.meeting.is_latest && !this.editingPast; },
    // แท็บวาระของการประชุมที่เปิด + จำนวนเรื่อง + มีการ์ดแก้ค้างไหม
    meetingTabs() {
      return [[GROUP_CARRIED, 'ระเบียบวาระที่ 1 เรื่องสืบเนื่อง'], [GROUP_NEW, 'ระเบียบวาระที่ 2 เรื่องใหม่']].map(([section, label]) => {
        const topics = this.topics.filter(t => this.topicGroup(t) === section);
        return { section, label, count: topics.length, dirty: topics.some(t => this.isDirty(t)) };
      });
    },
    // เรื่องในแท็บที่เปิด เรียงงานที่ยังไม่จบขึ้นก่อน ตามด้วยเรื่องที่เสร็จแล้ว
    tabTopics() {
      return this.topics.filter(t => this.topicGroup(t) === this.meetingTab)
        .sort((a, b) => WORK_STATUS_ORDER.indexOf(this.meetingStatus(a)) - WORK_STATUS_ORDER.indexOf(this.meetingStatus(b)));
    },
    statusCounts() {
      return Object.entries(this.statuses)
        .map(([key, s]) => ({ key, ...s, count: this.tabTopics.filter(t => this.meetingStatus(t) === key).length }))
        .filter(s => s.count > 0);
    },
    visibleTopics() { return this.topicFilter ? this.tabTopics.filter(t => this.meetingStatus(t) === this.topicFilter) : this.tabTopics; },
    // สรุปการประชุม: ภาพรวม + รายการแต่ละกลุ่ม + งานแยกตามผู้ดำเนินการ + รายการตรวจก่อนส่ง (2026-11-03)
    meetingSummary() {
      const groups = [GROUP_CARRIED, GROUP_NEW].map(section => {
        const topics = this.topics.filter(t => this.topicGroup(t) === section)
          .sort((a, b) => WORK_STATUS_ORDER.indexOf(this.meetingStatus(a)) - WORK_STATUS_ORDER.indexOf(this.meetingStatus(b)));
        const counts = WORK_STATUS_ORDER
          .map(key => ({ label: this.statusOf(key).label, count: topics.filter(t => this.meetingStatus(t) === key).length }))
          .filter(c => c.count);
        return { section, topics, counts };
      });
      // งานที่ยังไม่จบ แยกตามทีม + ชื่อผู้ดำเนินการ
      const owners = {};
      this.topics.filter(t => !FINISHED_STATUSES.includes(this.meetingStatus(t))).forEach(t => {
        const key = this.ownerText(t) || 'ยังไม่ระบุผู้ดำเนินการ';
        (owners[key] = owners[key] || []).push(t);
      });
      const checks = [];
      this.topics.forEach(t => {
        const finished = FINISHED_STATUSES.includes(this.meetingStatus(t));
        const problems = [];
        if (this.isDirty(t)) problems.push('มีการแก้ไขที่ยังไม่บันทึก');
        if (!finished && !t.decision.trim()) problems.push('ยังไม่มีสรุปในที่ประชุม');
        if (!finished && (!t.owner_team || (t.owner_team !== 'meeting' && !t.owner_name.trim()))) problems.push('ยังไม่ระบุทีมหรือชื่อผู้ดำเนินการ');
        if (!finished && this.topicGroup(t) === GROUP_CARRIED && !(this.noteDrafts[t.id] || '').trim()) problems.push('ยังไม่มีอัปเดตความคืบหน้าของครั้งนี้');
        if (problems.length) checks.push({ t, problems });
      });
      return { groups, owners: Object.entries(owners).map(([name, topics]) => ({ name, topics })), checks };
    },
    // ข้อความสรุปสำหรับคัดลอกไปวางในกลุ่ม LINE / อีเมล
    summaryText() {
      const s = this.meetingSummary;
      const m = this.meeting;
      if (!m) return '';
      // หัวรายงานตามโครงรายงานการประชุม (ยืนยันจากผู้ใช้ 2026-11-04)
      const lines = [this.reportTitle, `ครั้งที่ ${this.meetingNoText}`, `เมื่อ ${this.longThaiDate(m.meeting_date)}`];
      if (this.meetingTimeRange(m)) lines.push(`เวลา ${this.meetingTimeRange(m)}`);
      if (m.location) lines.push(`ณ ${m.location}`);
      this.minutesAttendeeGroups.forEach(g => {
        lines.push('', `${g.title} (${g.list.length} คน)`);
        g.list.forEach((a, i) => lines.push(`${i + 1}. ${a.attendee_name}${a.note ? ' — ' + a.note : ''}`));
      });
      lines.push('', 'ภาพรวม');
      s.groups.forEach(g => lines.push(`- ${this.agendaTitle(g.section)} ${g.topics.length} เรื่อง${g.counts.length ? ': ' + g.counts.map(c => `${c.label} ${c.count}`).join(' · ') : ''}`));
      s.groups.filter(g => g.topics.length).forEach(g => {
        lines.push('', `■ ${this.agendaTitle(g.section)}`);
        g.topics.forEach(t => {
          lines.push(`${this.topicLabel(t)} ${t.title}`);   // ไม่แสดงหมวด — แสดงตามหัวข้อที่พิมพ์ (ยืนยันจากผู้ใช้ 2026-11-03)
          lines.push(`   สถานะ: ${this.statusChangeText(t)}${this.ownerText(t) ? ' · ผู้รับผิดชอบ: ' + this.ownerText(t) : ''}`);
          if (g.section === GROUP_CARRIED && (this.noteDrafts[t.id] || '').trim()) lines.push('   ความคืบหน้า: ' + this.indentText(this.noteDrafts[t.id]));
          if (t.decision.trim()) lines.push('   มติที่ประชุม: ' + this.indentText(t.decision));
        });
      });
      if (s.owners.length) {
        lines.push('', '■ งานที่ต้องดำเนินการต่อ (ผู้รับผิดชอบ: เรื่อง)');
        s.owners.forEach(o => lines.push(`- ${o.name}: ${o.topics.map(t => this.topicLabel(t)).join(', ')}`));
      }
      if (m.next_meeting_date) lines.push('', `กำหนดประชุมครั้งต่อไป (เบื้องต้น): ${this.nextMeetingText(m)}`);
      if (m.end_time) lines.push(`เลิกประชุมเวลา ${this.timeLabel(m.end_time)} น.`);
      if (this.roleNames('secretary') || this.roleNames('chair')) lines.push('');
      if (this.roleNames('secretary')) lines.push(`ผู้จดรายงานการประชุม: ${this.roleNames('secretary')}`);
      if (this.roleNames('chair')) lines.push(`ผู้ตรวจรายงานการประชุม: ${this.roleNames('chair')} (ประธาน)`);
      return lines.join('\n');
    },
  },
  async mounted() {
    try {
      const res = await apiCall('GET', 'api/auth.php?action=me');
      if (!res.success) { window.location.href = 'login.html'; return; }
      this.currentUser = res.data;
      if (this.currentUser.role !== 'admin') { window.location.href = 'dashboard.html'; return; }
    } catch { window.location.href = 'login.html'; return; }
    this.authReady = true;
    this.newMeetingDate = this.todayDate();
    // ?view=work = งานที่ต้องติดตาม / อื่นๆ = บันทึกวาระและมติ (&meeting=id เปิดการประชุมนั้น)
    const params = new URLSearchParams(window.location.search);
    this.view = ['work', 'timeline'].includes(params.get('view')) ? params.get('view') : 'meeting';
    await this.loadMeetings();
    if (this.view === 'work' || this.view === 'timeline') { await this.loadWork(); await this.applyWorkDefaults(); }
    else if (this.meetings.length) {
      const wanted = Number(params.get('meeting'));
      await this.openMeeting(this.meetings.some(m => m.id === wanted) ? wanted : this.meetings[0].id);
    }
    // สลับเมนูซ้ายจะโหลดหน้าใหม่ — กันลืมบันทึก
    window.addEventListener('beforeunload', e => {
      if (this.topics.some(t => this.isDirty(t)) || this.workTopics.some(t => this.hasWorkDraft(t))) { e.preventDefault(); e.returnValue = ''; }
    });
  },
  methods: {
    ...SharedMethods,

    todayDate() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    },
    async setView(v) {
      this.view = v;
      history.replaceState(null, '', 'meeting-topics.html?view=' + v);
      if (v === 'work' || v === 'timeline') await this.loadWork();
      else if (this.meetings.length) await this.openMeeting(this.meetingId || this.meetings[0].id);
    },
    // สลับแท็บรายการงาน / ไทม์ไลน์ — ข้อมูลชุดเดียวกัน ไม่โหลดใหม่ (บันทึกที่พิมพ์ค้างในรายการงานไม่หาย) ตัวกรองผู้ดำเนินการ/ทีมคงไว้
    switchWorkTab(v) {
      if (this.view === v) return;
      this.view = v;
      history.replaceState(null, '', 'meeting-topics.html?view=' + v);
    },
    // ลิงก์ข้ามหน้า: การ์ดในบันทึกวาระและมติ → งานนั้นในงานที่ต้องติดตาม (ล้างตัวกรองให้เห็นแน่นอน)
    async goToWorkCard(t) {
      if (this.topics.some(x => this.isDirty(x))) {
        const ok = await this.showConfirm('มีการแก้ไขที่ยังไม่บันทึก', 'ไปหน้างานที่ต้องติดตามแล้วการแก้ไขที่ยังไม่กดบันทึกจะหาย', 'ไปต่อ');
        if (!ok) return;
      }
      await this.setView('work');
      this.workFilter = { meeting: '', team: '', status: '', owner: '' };
      this.workMeetingTopicIds = null;
      this.workExpanded = t.id;
      this.measureDecision(t.id);
      // รอหน้าวาดรายการเสร็จก่อนเลื่อน ไม่งั้นตำแหน่งคลาดเมื่อเนื้อหาด้านบนเปลี่ยนขนาด
      await this.$nextTick();
      setTimeout(() => document.getElementById('work' + t.id)?.scrollIntoView({ block: 'start' }), 50);
    },
    // การ์ดในงานที่ต้องติดตาม → การประชุมที่เปิดเรื่องนี้
    async goToMeeting(meetingId) {
      if (this.workTopics.some(x => this.hasWorkDraft(x))) {
        const ok = await this.showConfirm('มีการแก้ไขที่ยังไม่บันทึก', 'ไปหน้าบันทึกวาระและมติแล้วการแก้ไขที่ยังไม่กดบันทึกจะหาย', 'ไปต่อ');
        if (!ok) return;
        await this.loadWork();
      }
      this.view = 'meeting';
      history.replaceState(null, '', 'meeting-topics.html?view=meeting&meeting=' + meetingId);
      await this.openMeeting(Number(meetingId));
      window.scrollTo(0, 0);
    },
    async loadWork() {
      this.workLoading = true;
      const res = await apiCall('GET', 'api/meetings.php?action=all_topics');
      this.workLoading = false;
      if (!res.success) { await this.showAlert(res.message || 'โหลดข้อมูลไม่สำเร็จ', 'error'); return; }
      this.workTopics = res.data.map(t => ({ ...t, id: Number(t.id), saved_status: t.status, owner_team: t.owner_team || '', owner_name: t.owner_name || '', related_pages: t.related_pages ? t.related_pages.split(',') : [], logs: t.logs || [] }));
      this.workSaved = Object.fromEntries(this.workTopics.map(t => [t.id, this.workState(t)]));
    },
    workState(t) { return JSON.stringify([t.status, t.owner_team, t.owner_name, t.related_pages]); },
    isWorkDirty(t) { return this.workSaved[t.id] !== this.workState(t); },
    // แก้สถานะ / ผู้ดำเนินการ หรือพิมพ์บันทึกค้างไว้ = ยังไม่บันทึก
    hasWorkDraft(t) { return this.isWorkDirty(t) || !!(this.logDrafts[t.id]?.note || '').trim(); },
    // เปิดหน้างานที่ต้องติดตาม: การประชุมล่าสุด + งานของผู้ใช้ที่ login (ถ้าชื่อตรงผู้ดำเนินการ) / ทีม = ทุกทีม (ใช้ร่วมกับแท็บไทม์ไลน์ — ยืนยันจากผู้ใช้ 2026-11-03)
    async applyWorkDefaults() {
      const mine = this.workOwners.includes((this.currentUser?.full_name || '').trim()) ? this.currentUser.full_name.trim() : '';
      this.workFilter = { meeting: this.latestMeeting ? this.latestMeeting.id : '', team: '', status: 'pending', owner: mine };
      await this.loadWorkMeetingTopics();
    },
    async loadWorkMeetingTopics() {
      if (!this.workFilter.meeting) { this.workMeetingTopicIds = null; return; }
      const res = await apiCall('GET', `api/meetings.php?action=detail&id=${this.workFilter.meeting}`);
      this.workMeetingTopicIds = res.success ? res.data.topics.map(t => Number(t.id)) : null;
    },
    toggleWorkRow(t) {
      this.workExpanded = this.workExpanded === t.id ? null : t.id;
      if (this.workExpanded) this.measureDecision(t.id);
    },
    // วัดว่ามติยาวเกิน 3 บรรทัดไหม (ถูกตัดด้วย line-clamp) — แสดงปุ่ม "ดูทั้งหมด" เฉพาะที่ถูกตัดจริง
    measureDecision(id) {
      this.$nextTick(() => {
        const el = document.querySelector(`[data-decision="${id}"]`);
        this.decisionClamped[id] = !!el && el.scrollHeight > el.clientHeight + 2;
      });
    },
    // "2026-11-03" → "3 พ.ย. 2569"
    thaiDate(iso) {
      if (!iso) return '';
      const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
      const [y, m, d] = String(iso).split('-').map(Number);
      return `${d} ${months[m - 1]} ${y + 543}`;
    },
    // บันทึกในช่วงที่ดู (ทุกครั้ง = ทั้งหมด) — logs เรียงตามวันที่ + id จาก API
    viewLogs(t) {
      const p = this.workPeriod, logs = t.logs || [];
      return p ? logs.filter(l => l.log_date >= p.start && (!p.end || l.log_date < p.end)) : logs;
    },
    // สถานะช่วงนั้น (การประชุมที่ผ่านไปแล้ว) ไล่ตามลำดับ: บันทึกล่าสุดในช่วงที่เปลี่ยนสถานะ
    // → สถานะตอนเข้าประชุมครั้งถัดไป (= ตอนจบช่วง) → สถานะตอนจบประชุมนั้น → ไม่มีข้อมูล (null)
    periodStatus(t) {
      const p = this.workPeriod;
      if (!p?.end) return null;
      const changed = this.viewLogs(t).filter(l => l.status_after);
      if (changed.length) return changed[changed.length - 1].status_after;
      const snaps = t.meeting_statuses || [];
      return snaps.find(n => Number(n.meeting_id) === p.next.id)?.status_before
        || snaps.find(n => Number(n.meeting_id) === p.meeting.id)?.status_after || null;
    },
    // สถานะที่ใช้แสดง / กรอง / นับ: ช่วงที่ผ่านไปแล้ว = สถานะช่วงนั้น (ไม่มีข้อมูล = ปัจจุบัน) / อื่นๆ = ปัจจุบัน
    viewStatus(t) { return this.periodStatus(t) || t.saved_status; },
    periodNoData(t) { return this.workPastPeriod && !this.periodStatus(t); },
    shortRange(p) {
      const end = new Date(p.end + 'T00:00:00'); end.setDate(end.getDate() - 1);
      const iso = `${end.getFullYear()}-${String(end.getMonth() + 1).padStart(2, '0')}-${String(end.getDate()).padStart(2, '0')}`;
      return `${this.shortDayMonth(p.start)} – ${this.shortDayMonth(iso)}`;
    },
    // ไทม์ไลน์ของงาน 1 เรื่อง — เดินตามวันที่จริง: วันประชุม (สถานะ ณ ประชุม) สลับกับช่วงระหว่างประชุม (บันทึกของ Dev)
    // ไม่มีสถานะ ณ วันประชุมที่บันทึกไว้ = ใช้สถานะล่าสุดที่รู้ก่อนหน้า (ไม่เดา) / ยังไม่รู้เลย = "ไม่มีข้อมูล" (การประชุมล่าสุดใช้สถานะปัจจุบัน)
    // งานจบแล้ว (เสร็จแล้ว / ตกลงแล้ว) แสดงในการประชุมที่รายงานว่าจบ แล้วช่องถัดไปเป็น —
    buildTimeline(t) {
      const meetings = this.timelineMeetings, snaps = t.meeting_statuses || [], logs = t.logs || [];
      let cur = null, closed = false, finishDate = null, finishAtMeeting = false;
      const markFinish = (status, date, atMeeting) => { if (!finishDate && FINISHED_STATUSES.includes(status)) { finishDate = date; finishAtMeeting = atMeeting; } };
      const cols = meetings.map((m, i) => {
        const next = meetings[i + 1];
        const isNew = m.id === Number(t.first_meeting_id);
        let mcell;
        if (m.meeting_date < t.first_meeting_date) mcell = { kind: 'notyet' };
        else if (closed) mcell = { kind: 'none' };
        else {
          const s = snaps.find(n => Number(n.meeting_id) === m.id);
          if (s?.status_after) { cur = s.status_after; mcell = { kind: 'status', before: s.status_before, after: cur, isNew, note: s.note }; }
          else if (cur) mcell = { kind: 'status', after: cur, inferred: true, isNew, note: s?.note };
          else if (!next) { cur = t.saved_status; mcell = { kind: 'status', after: cur, inferred: true, isNew, note: s?.note }; }
          else mcell = { kind: 'nodata', isNew, note: s?.note };
          if (cur) markFinish(cur, m.meeting_date, true);
          if (cur && FINISHED_STATUSES.includes(cur)) closed = true;
        }
        const segLogs = mcell.kind === 'notyet' || (closed && mcell.kind === 'none') ? []
          : logs.filter(l => l.log_date >= m.meeting_date && (!next || l.log_date < next.meeting_date));
        segLogs.forEach(l => { if (l.status_after) { cur = l.status_after; markFinish(cur, l.log_date, false); } });
        // ช่องระหว่างประชุม: blank = ยังไม่เปิดเรื่อง / dash = จบไปแล้ว / warn = ช่วงปัจจุบัน ยังไม่จบ แต่ยังไม่มีบันทึก
        const seg = { logs: segLogs, blank: mcell.kind === 'notyet', dash: mcell.kind === 'none' || (!segLogs.length && closed),
                      warn: !segLogs.length && !next && !closed };
        return { m, mcell, seg };
      });
      const finished = FINISHED_STATUSES.includes(t.saved_status);
      const days = (from, to) => Math.round((new Date(to + 'T00:00:00') - new Date(from + 'T00:00:00')) / 86400000);
      // จบวันเดียวกับที่เปิดเรื่อง: ที่ประชุมสรุปจบ = "จบในที่ประชุม" / Dev ทำเสร็จหลังประชุมวันนั้น = "เสร็จวันที่เปิดเรื่อง"
      const used = finishDate ? days(t.first_meeting_date, finishDate) : null;
      const duration = finished
        ? (used === null ? '' : used > 0 ? `ใช้ ${used} วัน` : (finishAtMeeting ? 'จบในที่ประชุม' : 'จบวันเดียว'))
        : `${days(t.first_meeting_date, this.todayDate())} วัน`;
      return { cols, duration };
    },
    // เหตุการณ์ของงานเรียงตามวันที่ (ไทม์ไลน์ละเอียด) — วันเดียวกัน ประชุมก่อน แล้วค่อยงานที่ทำหลังประชุม
    timelineEvents(row) {
      const ev = [];
      row.cols.forEach(c => {
        if (c.mcell.kind === 'status' || c.mcell.kind === 'nodata') ev.push({ type: 'meeting', date: c.m.meeting_date, cell: c.mcell, decision: c.mcell.isNew ? row.t.decision : '' });
        c.seg.logs.forEach(l => ev.push({ type: 'log', date: l.log_date, log: l }));
      });
      return ev;
    },
    // หัวกลุ่ม: เปิดเรื่องในการประชุมล่าสุด = เรื่องใหม่ / เปิดก่อนหน้า = เรื่องสืบเนื่อง (กลุ่มที่ว่างไม่แสดง)
    timelineGroupsOf(rows) {
      const latest = this.timelineMeetings[this.timelineMeetings.length - 1];
      const isNew = row => !!latest && Number(row.t.first_meeting_id) === latest.id;
      const when = latest ? this.shortDayMonth(latest.meeting_date) : '';
      return [
        { key: 'carried', label: 'ระเบียบวาระที่ 1 เรื่องสืบเนื่อง', hint: `เปิดก่อนประชุม ${when}`, rows: rows.filter(r => !isNew(r)) },
        { key: 'new', label: 'ระเบียบวาระที่ 2 เรื่องใหม่', hint: `เปิดในประชุม ${when}`, rows: rows.filter(isNew) },
      ].filter(g => g.rows.length);
    },
    cycleTimelineSort() { this.timelineSort = this.timelineSort === '' ? 'asc' : this.timelineSort === 'asc' ? 'desc' : ''; },
    toggleTimeline(t) { this.timelineOpen = this.timelineOpen === t.id ? null : t.id; },
    // ไปดูการประชุมล่าสุด (สถานะปัจจุบัน) ในหน้างานที่ต้องติดตาม
    async showLatestWork() {
      this.workFilter.meeting = this.latestMeeting ? this.latestMeeting.id : '';
      await this.loadWorkMeetingTopics();
    },
    lastLogDate(t) { return this.viewLogs(t).reduce((max, l) => (l.log_date > max ? l.log_date : max), ''); },
    lastLog(t) { const logs = this.viewLogs(t); return logs.length ? logs[logs.length - 1] : null; },
    // ข้อความย่อของบันทึก: เปลี่ยนสถานะนำหน้า แล้วตามด้วยข้อความ
    logPreview(l) {
      const change = l.status_after ? `[${this.statusOf(l.status_before).label} → ${this.statusOf(l.status_after).label}] ` : '';
      return (change + (l.note || '')).trim();
    },
    // งานที่ยังไม่จบ และยังไม่มีบันทึกการดำเนินการตั้งแต่วันประชุมที่ใช้เทียบ — ก่อนประชุมครั้งถัดไปจะรู้ว่ายังไม่คืบหน้า
    needsUpdate(t) {
      const since = this.workCompareMeeting?.meeting_date, end = this.workPeriod?.end;
      return !!since && !FINISHED_STATUSES.includes(this.viewStatus(t))
        && !(t.logs || []).some(l => l.log_date >= since && (!end || l.log_date < end));
    },
    // ฟอร์มอัปเดต: เปิดเมื่อกดปุ่ม หรือยังไม่มีบันทึกเลย (ต้องลงบันทึกแรก) หรือมีค่าที่แก้ค้างอยู่ / ช่วงที่ผ่านไปแล้วเปิดเมื่อกดเท่านั้น
    // ช่วงที่ปิดแล้ว (การประชุมที่ผ่านไปแล้ว) ไม่มีฟอร์ม — แก้คำผิดในบันทึกเดิมได้อย่างเดียว (ยืนยันจากผู้ใช้ 2026-11-03)
    workFormVisible(t) {
      if (this.workPastPeriod) return false;
      return !!this.workFormOpen[t.id] || !t.logs.length || this.hasWorkDraft(t);
    },
    openWorkForm(t) { this.workFormOpen[t.id] = true; this.savedText[t.id] = ''; },
    // ยกเลิก: คืนสถานะ / ผู้ดำเนินการเป็นค่าที่บันทึกไว้ ล้างข้อความที่พิมพ์ แล้วปิดฟอร์ม
    cancelWorkForm(t) {
      const [status, team, owner] = JSON.parse(this.workSaved[t.id]);
      Object.assign(t, { status, owner_team: team, owner_name: owner });
      this.logDrafts[t.id] = null;
      this.workFormOpen[t.id] = false;
    },
    // ปุ่มบันทึกเดียวของแถว: สถานะ / ผู้ดำเนินการ (ถ้าเปลี่ยน) + บันทึกการดำเนินการ (ถ้าพิมพ์) — เดิมแยก 2 ปุ่ม (2026-11-03)
    async saveWorkUpdate(t) {
      const changed = this.isWorkDirty(t);
      const hasNote = !!(this.logDraft(t).note || '').trim();
      if (!changed && !hasNote) { await this.showAlert('ยังไม่มีอะไรเปลี่ยน — เลือกสถานะใหม่ หรือพิมพ์สิ่งที่ทำ', 'error'); return; }
      // เปลี่ยนสถานะ = เก็บลงบันทึกด้วย (ก่อน → หลัง) แม้ไม่ได้พิมพ์ข้อความ — เป็นประวัติว่าเปลี่ยนเมื่อไร (ยืนยันจากผู้ใช้ 2026-11-03)
      const statusBefore = t.saved_status;
      const statusChanged = t.status !== statusBefore;
      if (changed && !(await this.saveWorkTopic(t))) return;
      if ((hasNote || statusChanged) && !(await this.addLog(t, statusChanged ? { status_before: statusBefore, status_after: t.status } : {}))) return;
      this.workFormOpen[t.id] = false;   // บันทึกแล้วปิดฟอร์ม บันทึกใหม่ขึ้นบนสุดของรายการ
      this.savedText[t.id] = 'บันทึกแล้ว';
    },
    async saveWorkTopic(t) {
      this.savingId = t.id;
      const res = await apiCall('POST', 'api/meetings.php?action=update_topic', { id: t.id, title: t.title, detail: t.detail, status: t.status, owner_team: t.owner_team, owner_name: t.owner_name, related_pages: t.related_pages, decision: t.decision });
      this.savingId = null;
      if (!res.success) { await this.showAlert(res.message || 'บันทึกไม่สำเร็จ', 'error'); return false; }
      this.workSaved[t.id] = this.workState(t);
      t.saved_status = t.status;
      this.savedText[t.id] = 'บันทึกแล้ว';
      return true;
    },
    logDraft(t) {
      if (!this.logDrafts[t.id]) this.logDrafts[t.id] = { log_date: this.todayDate(), note: '', files: '' };
      return this.logDrafts[t.id];
    },
    async addLog(t, statusChange = {}) {
      const d = this.logDraft(t);
      this.savingId = t.id;
      const res = await apiCall('POST', 'api/meetings.php?action=add_log', { topic_id: t.id, ...d, ...statusChange });
      this.savingId = null;
      if (!res.success) { await this.showAlert(res.message || 'บันทึกไม่สำเร็จ', 'error'); return false; }
      this.logDrafts[t.id] = null;
      const list = await apiCall('GET', 'api/meetings.php?action=all_topics');
      if (list.success) t.logs = list.data.find(x => Number(x.id) === t.id)?.logs || [];
      return true;
    },
    async saveLogEdit(l) {
      const res = await apiCall('POST', 'api/meetings.php?action=update_log', this.logEdit);
      if (!res.success) { await this.showAlert(res.message || 'บันทึกไม่สำเร็จ', 'error'); return; }
      Object.assign(l, { log_date: this.logEdit.log_date, note: this.logEdit.note, files: this.logEdit.files });
      this.logEdit = null;
    },
    async deleteLog(l) {
      const ok = await this.showConfirm('ลบบันทึกการดำเนินการ', `ลบบันทึกวันที่ ${this.shortDate(l.log_date)}`, 'ลบ');
      if (!ok) return;
      const res = await apiCall('POST', 'api/meetings.php?action=delete_log', { id: l.id });
      if (!res.success) { await this.showAlert(res.message || 'ลบไม่สำเร็จ', 'error'); return; }
      const t = this.workTopics.find(x => x.logs.includes(l));
      if (t) t.logs = t.logs.filter(x => x !== l);
    },
    // บันทึกการดำเนินการตั้งแต่วันประชุมครั้งก่อน (รวมงานที่แก้หลังประชุมวันนั้น) จนถึงวันประชุมครั้งนี้
    // ตั้งแต่วันประชุมครั้งก่อน ถึงก่อนวันประชุมนี้ — บันทึกที่ลงวันประชุม = ทำหลังประชุม ไปขึ้นครั้งถัดไป / ครั้งแรกไม่มี (ยืนยันจากผู้ใช้ 2026-11-03)
    logsSincePrev(t) {
      const prev = this.meeting?.prev_meeting_date, cur = this.meeting?.meeting_date;
      if (!prev) return [];
      return (t.logs || []).filter(l => l.log_date >= prev && l.log_date < cur);
    },

    // ค่าเริ่มต้นวันที่ประชุม = วันนี้ เพราะประชุมวันศุกร์มีเลื่อนได้ ถ้าไม่ตรงผู้ใช้เลือกเอง (ยืนยันจากผู้ใช้ 2026-11-02)
    todayDate() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    },
    // "2026-11-02" → "02/11" (คำเตือนสั้นในรายการงาน)
    shortDayMonth(iso) {
      const [, m, d] = String(iso).split('-');
      return `${d}/${m}`;
    },
    shortDate(iso) {
      const [y, m, d] = String(iso).split('-');
      return `${d}/${m}/${Number(y) + 543}`;
    },
    addDays(iso, n) {
      const d = new Date(iso + 'T00:00:00');
      d.setDate(d.getDate() + n);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    },
    // ช่องแก้วันนัด: ค่าที่บันทึกไว้ / ยังไม่นัด = เสนออีก 7 วัน
    resetNextDraft() {
      const m = this.meeting;
      this.nextDraft = {
        date: m.next_meeting_date || this.addDays(m.meeting_date, 7),
        time: (m.next_meeting_time || '').slice(0, 5),
        note: m.next_meeting_note || '',
      };
    },
    // "วันศุกร์ 20/11/2569 เวลา 13.30 น. · ห้องประชุม รอตรวจสอบห้องว่าง" (เวลา/สถานที่ ไม่มีก็ไม่แสดง)
    nextMeetingText(m) {
      if (!m?.next_meeting_date) return '';
      let text = this.dateLabel(m.next_meeting_date);
      if (m.next_meeting_time) text += ` เวลา ${m.next_meeting_time.slice(0, 5).replace(':', '.')} น.`;
      if (m.next_meeting_note) text += ` · ${m.next_meeting_note}`;
      return text;
    },
    // ===== หัวรายงานการประชุม (ยืนยันจากผู้ใช้ 2026-11-04) =====
    timeLabel(t) { return t ? t.slice(0, 5).replace(':', '.') : ''; },
    meetingTimeRange(m) {
      if (!m?.start_time) return m?.end_time ? `ถึง ${this.timeLabel(m.end_time)} น.` : '';
      return m.end_time ? `${this.timeLabel(m.start_time)} – ${this.timeLabel(m.end_time)} น.` : `${this.timeLabel(m.start_time)} น.`;
    },
    meetingInfoText(m) {
      return [m.title, this.meetingTimeRange(m) && 'เวลา ' + this.meetingTimeRange(m), m.location && 'ณ ' + m.location].filter(Boolean).join(' · ');
    },
    longThaiDate(iso) {
      const days = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
      const months = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
      const d = new Date(iso + 'T00:00:00');
      return `วัน${days[d.getDay()]}ที่ ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear() + 543}`;
    },
    roleNames(role) { return this.attendees.filter(a => a.meeting_role === role && a.attendance === 'present').map(a => a.attendee_name).join(', '); },
    openInfoDialog() {
      const m = this.meeting;
      this.infoDialog = { open: true, title: m.title || '', start: (m.start_time || '').slice(0, 5), end: (m.end_time || '').slice(0, 5), location: m.location || '', saving: false };
    },
    async saveMeetingInfo() {
      const d = this.infoDialog;
      d.saving = true;
      let res;
      try { res = await apiCall('POST', 'api/meetings.php?action=save_meeting_info', { id: this.meeting.id, title: d.title, start_time: d.start, end_time: d.end, location: d.location }); }
      catch { res = { success: false }; }
      d.saving = false;
      if (!res.success) { await this.showAlert(res.message || 'บันทึกไม่สำเร็จ', 'error'); return; }
      const listed = this.meetings.find(x => x.id === Number(this.meeting.id));
      [this.meeting, listed].filter(Boolean).forEach(x => Object.assign(x, res.data));
      d.open = false;
    },
    // ===== ผู้เข้าร่วมประชุม + @แท็ก (ยืนยันจากผู้ใช้ 2026-11-04) =====
    attendanceInfo(key) { return ATTENDANCE[key] || ATTENDANCE.present; },
    roleLabel(key) { return MEETING_ROLES[key] || ''; },
    async openAttendeeDialog() {
      if (!this.attendeeOptions) {
        const res = await apiCall('GET', 'api/meetings.php?action=attendee_options');
        if (!res.success) { await this.showAlert(res.message || 'โหลดรายชื่อไม่สำเร็จ', 'error'); return; }
        this.attendeeOptions = res.data.map(u => ({ ...u, id: Number(u.id) }));
      }
      // รายชื่อที่บันทึกไว้ขึ้นก่อน (ตามลำดับเดิม) แล้วตามด้วยผู้ใช้ที่ยังไม่ได้เลือก
      const rows = this.attendees.map(a => ({ user_id: a.user_id ? Number(a.user_id) : null, name: a.attendee_name, checked: true, attendance: a.attendance, role: a.meeting_role }));
      this.attendeeOptions.filter(u => !rows.some(r => r.user_id === u.id))
        .forEach(u => rows.push({ user_id: u.id, name: u.full_name, checked: false, attendance: 'present', role: 'member' }));
      this.attendeeDialog = { open: true, search: '', rows, extName: '', saving: false };
    },
    addExternalAttendee() {
      const name = this.attendeeDialog.extName.trim();
      if (!name) return;
      if (this.attendeeDialog.rows.some(r => r.name === name)) { this.showAlert(`มีชื่อ "${name}" อยู่แล้ว`, 'error'); return; }
      this.attendeeDialog.rows.push({ user_id: null, name, checked: true, attendance: 'present', role: 'member' });
      this.attendeeDialog.extName = '';
    },
    async saveAttendees() {
      const list = this.attendeeDialog.rows.filter(r => r.checked)
        .map(r => ({ user_id: r.user_id, attendee_name: r.name, attendance: r.attendance, meeting_role: r.role }));
      this.attendeeDialog.saving = true;
      let res;
      try { res = await apiCall('POST', 'api/meetings.php?action=save_attendees', { meeting_id: this.meetingId, attendees: list }); }
      catch { res = { success: false }; }
      this.attendeeDialog.saving = false;
      if (!res.success) { await this.showAlert(res.message || 'บันทึกไม่สำเร็จ', 'error'); return; }
      this.attendees = res.data;
      this.attendeeDialog.open = false;
    },
    // พิมพ์ @ ในช่องสรุป / ความคืบหน้า → รายชื่อผู้มาประชุมที่ตรงกับคำที่พิมพ์ต่อจาก @
    onMentionInput(e, key) {
      const el = e.target;
      const m = el.value.slice(0, el.selectionStart).match(/@([^\s@]*)$/);
      if (!m || !this.mentionNames.length) { this.closeMention(); return; }
      const q = m[1].toLowerCase();
      this.mention = { key, items: this.mentionNames.filter(n => n.toLowerCase().includes(q)), sel: 0 };
    },
    onMentionKeydown(e, obj, prop, key) {
      if (this.mention.key !== key) return;
      const n = this.mention.items.length;
      if (e.key === 'Escape') { this.closeMention(); return; }
      if (!n) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        this.mention.sel = (this.mention.sel + (e.key === 'ArrowDown' ? 1 : n - 1)) % n;
      } else if (e.key === 'Enter' || e.key === 'Tab') {
        e.preventDefault();
        this.pickMention(this.mention.sel, obj, prop, key);
      }
    },
    // แทนคำที่พิมพ์ต่อจาก @ ด้วยชื่อเต็ม แล้ววางเคอร์เซอร์ต่อท้ายชื่อ
    pickMention(i, obj, prop, key) {
      const el = document.getElementById(key);
      const name = this.mention.items[i];
      if (!el || !name) return;
      const pos = el.selectionStart;
      const before = el.value.slice(0, pos).replace(/@([^\s@]*)$/, '@' + name + ' ');
      obj[prop] = before + el.value.slice(pos);
      this.closeMention();
      this.$nextTick(() => { el.focus(); el.selectionStart = el.selectionEnd = before.length; });
    },
    closeMention() { this.mention = { key: null, items: [], sel: 0 }; },
    // แสดงข้อความ: ทำ HTML ให้ปลอดภัยก่อน แล้วทำ @ชื่อ เป็นตัวหนาสีเขียวเข้ม ไม่มีพื้น (แบบ Facebook / Teams — ยืนยันจากผู้ใช้ 2026-11-04) ของผู้เข้าร่วมการประชุมนี้ (ชื่อยาวก่อน กันชื่อสั้นตัดชื่อยาว)
    mentionHtml(text) {
      let html = String(text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      [...this.attendees].map(a => a.attendee_name).sort((a, b) => b.length - a.length).forEach(name => {
        const safe = ('@' + name).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        html = html.split(safe).join(`<span class="font-semibold text-teal-700">${safe}</span>`);
      });
      return html;
    },
    // ชั้นหลังช่องพิมพ์: ข้อความเดียวกันแต่ตัวอักษรโปร่งใส ทาพื้นเฉพาะ @ชื่อ ของผู้เข้าร่วม / ขึ้นบรรทัดท้ายเผื่อช่องพิมพ์ที่ลงท้ายด้วยบรรทัดว่าง
    mentionBackdrop(text) {
      return this.mentionHtml(text).split('<span class="font-semibold text-teal-700">').join('<mark class="rounded bg-slate-200/70 text-transparent">')
        .split('</span>').join('</mark>') + '\n ';
    },
    // ให้ชั้นหลังเลื่อนตามช่องพิมพ์
    syncBackdrop(e) {
      const el = e.target;
      this.$nextTick(() => { if (el.previousElementSibling) el.previousElementSibling.scrollTop = el.scrollTop; });
    },
    // ผู้เข้าร่วมที่ถูกแท็กในสรุป / ความคืบหน้าครั้งนี้ของเรื่องนี้
    mentionedIn(t) {
      const text = `${t.decision || ''}\n${this.noteDrafts[t.id] || ''}`;
      return this.attendees.map(a => a.attendee_name).filter(name => text.includes('@' + name));
    },
    openNextDialog() { this.resetNextDraft(); this.nextDialogOpen = true; },
    closeNextDialog() { this.nextDialogOpen = false; this.resetNextDraft(); },
    // บันทึก / ล้างวันนัดประชุมครั้งถัดไป (เบื้องต้น) ของการประชุมที่เปิดอยู่
    async saveNextDate(clear) {
      const body = clear ? { id: this.meeting.id, next_meeting_date: '' }
        : { id: this.meeting.id, next_meeting_date: this.nextDraft.date, next_meeting_time: this.nextDraft.time, next_meeting_note: this.nextDraft.note.trim() };
      const res = await apiCall('POST', 'api/meetings.php?action=set_next_date', body);
      if (!res.success) { await this.showAlert(res.message || 'บันทึกไม่สำเร็จ', 'error'); return; }
      const m = this.meetings.find(x => x.id === Number(this.meeting.id));
      [this.meeting, m].filter(Boolean).forEach(x => Object.assign(x, res.data));
      this.resetNextDraft();
      this.nextDialogOpen = false;
      await this.showAlert(res.message, 'success');
    },
    dateLabel(iso) {
      const days = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
      return `วัน${days[new Date(iso + 'T00:00:00').getDay()]} ${this.shortDate(iso)}`;
    },
    statusOf(status) { return MEETING_STATUSES[status] || { label: status, cls: 'bg-slate-100 text-slate-600' }; },
    // กลุ่มของเรื่องในการประชุมที่เปิดอยู่ (ใช้สถานะที่บันทึกแล้ว)
    topicGroup(t) { return t.first_meeting_id === this.meetingId ? GROUP_NEW : GROUP_CARRIED; },
    // สถานะ ณ การประชุมที่เปิด (snapshot — 2026-11-03) / ยังไม่มีบันทึกของการประชุมนี้ (ข้อมูลเก่า) ใช้สถานะปัจจุบัน
    meetingStatus(t) { return t.status_after || t.saved_status; },
    statusChanged(t) { return !!t.status_before && !!t.status_after && t.status_before !== t.status_after; },
    statusChangeText(t) {
      const now = this.statusOf(this.meetingStatus(t)).label;
      return this.statusChanged(t) ? `${this.statusOf(t.status_before).label} → ${now}` : now;
    },
    topicLabel(t) { return t.topic_no ? `ข้อ ${t.topic_no}.` : t.topic_code; },
    // หัววาระแบบรายงานการประชุม — เรื่องในวาระยังเป็น "ข้อ" (ยืนยันจากผู้ใช้ 2026-11-03)
    agendaTitle(section) { return `ระเบียบวาระที่ ${section === GROUP_CARRIED ? 1 : 2} ${section}`; },
    ownerText(t) {
      const team = this.teams[t.owner_team] || '';
      const name = (t.owner_name || '').trim();
      return team && name ? `${team} (${name})` : (team || name);
    },
    // ข้อความหลายบรรทัดในสรุป — ย่อหน้าบรรทัดถัดไปให้อยู่ใต้หัวข้อ
    indentText(text) { return String(text).trim().split('\n').join('\n      '); },
    // คัดลอกด้วย Clipboard API ก่อน ไม่ได้ (เบราว์เซอร์บางตัว / หน้าไม่ได้โฟกัส) ใช้วิธีเลือกข้อความแล้วสั่งคัดลอกแทน
    // ===== แชร์ลิงก์อ่านอย่างเดียว (ยืนยันจากผู้ใช้ 2026-11-04) =====
    openShareDialog() { this.shareDialog = { open: true, days: 30, saving: false }; },
    async shareMeeting() {
      this.shareDialog.saving = true;
      let res;
      try { res = await apiCall('POST', 'api/meetings.php?action=share_meeting', { id: this.meeting.id, days: this.shareDialog.days }); }
      catch { res = { success: false }; }
      this.shareDialog.saving = false;
      if (!res.success) { await this.showAlert(res.message || 'สร้างลิงก์ไม่สำเร็จ', 'error'); return; }
      Object.assign(this.meeting, res.data);
    },
    async unshareMeeting() {
      const ok = await this.showConfirm('ปิดการแชร์', 'ลิงก์เดิมจะเปิดไม่ได้ทันที — แชร์ใหม่จะได้ลิงก์ใหม่', 'ปิดการแชร์');
      if (!ok) return;
      this.shareDialog.saving = true;
      let res;
      try { res = await apiCall('POST', 'api/meetings.php?action=unshare_meeting', { id: this.meeting.id }); }
      catch { res = { success: false }; }
      this.shareDialog.saving = false;
      if (!res.success) { await this.showAlert(res.message || 'ปิดการแชร์ไม่สำเร็จ', 'error'); return; }
      Object.assign(this.meeting, res.data);
    },
    async copyShareUrl() {
      if (await this.copyText(this.shareUrl)) await this.showAlert('คัดลอกลิงก์แล้ว ส่งให้ผู้เกี่ยวข้องได้เลย — ดูได้อย่างเดียว', 'success');
      else await this.showAlert('คัดลอกไม่สำเร็จ — เลือกข้อความในช่องลิงก์แล้วคัดลอกเอง', 'error');
    },
    // คัดลอกข้อความ: Clipboard API ก่อน ไม่ได้ใช้วิธีเลือกข้อความแล้วสั่งคัดลอก
    async copyText(text) {
      try { await navigator.clipboard.writeText(text); return true; }
      catch {
        const box = document.createElement('textarea');
        box.value = text;
        box.style.position = 'fixed'; box.style.opacity = '0';
        document.body.appendChild(box);
        box.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch { ok = false; }
        box.remove();
        return ok;
      }
    },
    async copySummary() {
      const ok = await this.copyText(this.summaryText);
      if (ok) await this.showAlert('คัดลอกสรุปแล้ว นำไปวางในกลุ่ม LINE หรืออีเมลได้เลย', 'success');
      else await this.showAlert('คัดลอกไม่สำเร็จ — กด "พิมพ์" แล้วคัดลอกข้อความจากหน้าที่เปิดแทน', 'error');
    },
    // พิมพ์ / บันทึกเป็น PDF — เปิดหน้าต่างใหม่ที่มีแค่ข้อความสรุป (ไม่มีเมนูและปุ่มของหน้า)
    printSummary() {
      const w = window.open('', '_blank');
      if (!w) { this.showAlert('เบราว์เซอร์บล็อกหน้าต่างใหม่ — อนุญาตป๊อปอัปแล้วลองอีกครั้ง', 'error'); return; }
      const escaped = this.summaryText.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      w.document.write(`<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><title>สรุปการประชุม</title>
        <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600&display=swap" rel="stylesheet">
        <style>body{font-family:Anuphan,sans-serif;margin:24px;color:#0f172a}pre{font-family:inherit;font-size:15px;line-height:1.7;white-space:pre-wrap;margin:0}</style>
        </head><body><pre>${escaped}</pre></body></html>`);
      w.document.close();
      w.onload = () => { w.focus(); w.print(); };
    },
    // กดรายการตรวจก่อนส่ง → ปิดหน้าสรุปแล้วเลื่อนไปการ์ดนั้น
    switchMeetingTab(section) {
      this.meetingTab = section;
      this.topicFilter = '';
    },
    goToCard(t) {
      this.summaryOpen = false;
      this.switchMeetingTab(this.topicGroup(t));
      this.$nextTick(() => document.getElementById('card' + t.id)?.scrollIntoView({ block: 'start' }));
    },
    // ประวัติอัปเดต — เรื่องที่ตามมาจากครั้งก่อนแยกของครั้งนี้ไว้ในช่องกรอก
    // แถวที่บันทึกแค่สถานะ (ข้อความว่าง) ไม่แสดงเป็นอัปเดต / แสดงถึงวันประชุมนี้เท่านั้น ไม่โชว์อัปเดตของครั้งหลัง
    // อ่านอย่างเดียวแสดงอัปเดตของครั้งนี้ด้วย (ไม่มีช่องกรอก)
    noteHistory(t) {
      const cur = this.meeting?.meeting_date;
      return (t.notes || []).filter(n => n.note && (!cur || n.meeting_date <= cur)
        && (this.readOnly || t.first_meeting_id === this.meetingId || Number(n.meeting_id) !== this.meetingId));
    },
    async startEditPast() {
      const ok = await this.showConfirm('แก้ไขบันทึกการประชุมที่ผ่านไปแล้ว', `การประชุม ${this.dateLabel(this.meeting.meeting_date)} ผ่านไปแล้ว — กดบันทึกการ์ดจะเปลี่ยนสถานะหลังประชุมของวันนั้น ถ้าจะอัปเดตงานระหว่างสัปดาห์ให้ใช้แท็บงานทั้งหมด`, 'แก้ไขการประชุมนี้');
      if (!ok) return;
      // ช่องสถานะเริ่มที่สถานะ ณ วันประชุมนั้น (ไม่ใช่สถานะปัจจุบัน) — ตั้งเป็นค่าที่บันทึกแล้วของโหมดนี้ จึงไม่ขึ้นว่าแก้ค้าง
      this.topics.forEach(t => { t.status = this.meetingStatus(t); });
      this.savedState = Object.fromEntries(this.topics.map(t => [t.id, this.cardState(t)]));
      this.editingPast = true;
    },
    // สถานะที่ใช้เทียบว่าแก้ค้างไหม — แก้การประชุมที่ผ่านไปแล้วเทียบกับสถานะ ณ วันนั้น
    baseStatus(t) { return this.editingPast ? this.meetingStatus(t) : t.saved_status; },

    async loadMeetings() {
      const res = await apiCall('GET', 'api/meetings.php?action=list');
      if (res.success) this.meetings = res.data.map(m => ({ ...m, id: Number(m.id) }));
      else await this.showAlert(res.message || 'โหลดข้อมูลไม่สำเร็จ', 'error');
    },
    async openMeeting(id) {
      if (this.topics.some(t => this.isDirty(t))) {
        const ok = await this.showConfirm('มีการแก้ไขที่ยังไม่บันทึก', 'เปลี่ยนการประชุมแล้วการแก้ไขที่ยังไม่กดบันทึกจะหาย', 'เปลี่ยนการประชุม');
        if (!ok) return;
      }
      this.loading = true;
      this.meetingId = id;
      const res = await apiCall('GET', `api/meetings.php?action=detail&id=${id}`);
      this.loading = false;
      if (!res.success) { await this.showAlert(res.message || 'โหลดข้อมูลไม่สำเร็จ', 'error'); return; }
      this.meeting = res.data.meeting;
      this.attendees = res.data.attendees || [];
      this.resetNextDraft();
      // สถานะก่อน / หลังของการประชุมนี้ จากแถวบันทึกของครั้งนี้
      const mine = t => (t.notes || []).find(n => Number(n.meeting_id) === id) || {};
      this.topics = res.data.topics.map(t => ({ ...t, id: Number(t.id), saved_status: t.status, status_before: mine(t).status_before || null, status_after: mine(t).status_after || null, first_meeting_id: Number(t.first_meeting_id), detail: t.detail || '', owner_team: t.owner_team || '', owner_name: t.owner_name || '', related_pages: t.related_pages ? t.related_pages.split(',') : [], decision: t.decision || '' }));
      this.savedText = {};
      this.topicFilter = '';
      this.editingPast = false;
      this.editingDecision = {};
      this.editingNote = {};
      this.editingTitle = {};
      // เปิดที่เรื่องสืบเนื่องตามลำดับวาระ — ไม่มีเรื่องสืบเนื่อง (เช่น ประชุมครั้งแรก) เปิดที่เรื่องใหม่
      this.meetingTab = this.topics.some(t => this.topicGroup(t) === GROUP_CARRIED) ? GROUP_CARRIED : GROUP_NEW;
      this.noteDrafts = Object.fromEntries(this.topics.map(t => [t.id, (t.notes || []).find(n => Number(n.meeting_id) === id)?.note || '']));
      this.savedState = Object.fromEntries(this.topics.map(t => [t.id, this.cardState(t)]));
    },
    async createMeeting() {
      if (!this.newMeetingDate) { await this.showAlert('กรุณาเลือกวันที่ประชุม', 'error'); return; }
      const res = await apiCall('POST', 'api/meetings.php?action=create_meeting', { meeting_date: this.newMeetingDate });
      if (!res.success) { await this.showAlert(res.message || 'สร้างการประชุมไม่สำเร็จ', 'error'); return; }
      await this.loadMeetings();
      await this.openMeeting(Number(res.data.id));
    },
    async deleteMeeting() {
      const ok = await this.showConfirm('ลบการประชุมที่ว่าง', `ลบการประชุม ${this.dateLabel(this.meeting.meeting_date)}`, 'ลบการประชุม');
      if (!ok) return;
      const res = await apiCall('POST', 'api/meetings.php?action=delete_meeting', { id: this.meetingId });
      if (!res.success) await this.showAlert(res.message || 'ลบการประชุมไม่สำเร็จ', 'error');
      await this.loadMeetings();
      this.meetingId = null; this.meeting = null; this.topics = [];
      if (this.meetings.length) await this.openMeeting(this.meetings[0].id);
    },
    async createTopic() {
      const res = await apiCall('POST', 'api/meetings.php?action=create_topic', { ...this.topicForm, meeting_id: this.meetingId });
      if (!res.success) { await this.showAlert(res.message || 'เพิ่มหัวข้อไม่สำเร็จ', 'error'); return; }
      this.topicForm = { topic_no: '', title: '', detail: '', decision: '', owner_team: '', owner_name: '' };
      this.showAdd = false;
      await this.loadMeetings();
      await this.openMeeting(this.meetingId);
      this.meetingTab = GROUP_NEW;   // เห็นเรื่องที่เพิ่งเพิ่มทันที
    },
    toggleDecision(t) { this.editingDecision[t.id] = !this.editingDecision[t.id]; },
    // ช่องพิมพ์เปิดเมื่อ: ยังไม่มีข้อความ / กดแก้ไข / มีการแก้ที่ยังไม่บันทึก (กันข้อความที่พิมพ์ค้างถูกซ่อน)
    noteEditing(t) {
      const saved = this.savedState[t.id] ? JSON.parse(this.savedState[t.id])[7] : (this.noteDrafts[t.id] || '');
      return !!this.editingNote[t.id] || !(this.noteDrafts[t.id] || '').trim() || saved !== (this.noteDrafts[t.id] || '');
    },
    toggleNote(t) { this.editingNote[t.id] = !this.noteEditing(t); },
    // ตกลงแล้วไม่ต้องดำเนินการ = มติที่ประชุม — เติมให้เมื่อยังไม่เลือกทีม ไม่ทับทีมเดิม (ยืนยันจากผู้ใช้ 2026-11-02)
    onStatusChange(t) {
      if (t.status === 'agreed' && !t.owner_team) t.owner_team = 'meeting';
    },
    cardState(t) { return JSON.stringify([t.title, t.detail, t.status, t.owner_team, t.owner_name, t.related_pages, t.decision, this.noteDrafts[t.id] || '']); },
    isDirty(t) { return this.savedState[t.id] !== undefined && this.savedState[t.id] !== this.cardState(t); },
    // ปุ่มบันทึกของการ์ด: ข้อมูลหัวข้อ + ความคืบหน้าของครั้งนี้
    async saveTopic(t) {
      this.savingId = t.id;
      const statusBeforeSave = t.saved_status;
      // ส่ง meeting_id ให้ API เก็บสถานะ ณ การประชุมนี้ด้วย
      const pastMeeting = this.editingPast;
      const res = await apiCall('POST', 'api/meetings.php?action=update_topic', { id: t.id, meeting_id: this.meetingId, keep_current_status: pastMeeting, title: t.title, detail: t.detail, status: t.status, owner_team: t.owner_team, owner_name: t.owner_name, related_pages: t.related_pages, decision: t.decision });
      if (res.success) {
        // ตรงกับที่ API บันทึก: สถานะก่อนเก็บครั้งแรกเท่านั้น เรื่องใหม่ของครั้งนี้ / การประชุมที่ผ่านไปแล้วไม่มีสถานะก่อน
        if (!t.status_after) t.status_before = (this.topicGroup(t) === GROUP_NEW || pastMeeting) ? null : statusBeforeSave;
        t.status_after = t.status;
      }
      let ok = res.success, message = res.message;
      if (ok && t.first_meeting_id !== this.meetingId) {
        const note = await apiCall('POST', 'api/meetings.php?action=save_note', { meeting_id: this.meetingId, topic_id: t.id, note: this.noteDrafts[t.id] || '' });
        ok = note.success; message = note.message;
        if (ok) this.loadMeetings();
      }
      this.savingId = null;
      if (!ok) { await this.showAlert(message || 'บันทึกไม่สำเร็จ', 'error'); return; }
      this.savedState[t.id] = this.cardState(t);
      if (!pastMeeting) t.saved_status = t.status;   // การประชุมที่ผ่านไปแล้วไม่เปลี่ยนสถานะปัจจุบัน
      this.savedText[t.id] = 'บันทึกแล้ว';
      this.editingTitle[t.id] = false;
      this.editingNote[t.id] = false;
    },
  },
}).mount('#app');
</script>
</body>
</html>
