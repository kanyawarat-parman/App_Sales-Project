<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>งานประมูล</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="shared/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css?v=16">
<!-- DataTables (ใช้เฉพาะมุมมองตารางของหน้านี้ — jQuery plugin ควบคุมตารางแยกจาก Vue โดยเจตนา เหมือน sources.html/calendars.html) -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<style>
  #bidPipelineTable_wrapper { padding: 0 1rem 1rem; }
  #bidPipelineTable_wrapper .dataTables_length,
  #bidPipelineTable_wrapper .dataTables_filter { float: none; margin-bottom: .75rem; }
  #bidPipelineTable_wrapper .dataTables_length label,
  #bidPipelineTable_wrapper .dataTables_filter label { display: flex; align-items: center; gap: .5rem; margin: 0; font-size: .8125rem; color: #64748b; white-space: nowrap; }
  #bidPipelineTable_wrapper .dataTables_filter input { flex: 0 0 320px; width: 320px; }
  @media (min-width: 640px) {
    #bidPipelineTable_wrapper { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem 1.5rem; }
    #bidPipelineTable_wrapper .dataTables_length,
    #bidPipelineTable_wrapper .dataTables_filter,
    #bidPipelineTable_wrapper .dataTables_info,
    #bidPipelineTable_wrapper .dataTables_paginate { margin-bottom: 0; }
    #bidPipelineTable_wrapper > table { width: 100%; }
  }
  #bidPipelineTable_wrapper .dataTables_filter input,
  #bidPipelineTable_wrapper .dataTables_length select { border-radius: 999px; border: 1px solid #e2e8f0; padding: .375rem .9rem; outline: none; }
  #bidPipelineTable_wrapper .dataTables_filter input:focus,
  #bidPipelineTable_wrapper .dataTables_length select:focus { border-color: #2dd4bf; box-shadow: 0 0 0 2px #ccfbf1; }
  #bidPipelineTable_wrapper .dataTables_info { font-size: .8125rem; color: #94a3b8; }
  #bidPipelineTable_wrapper .dataTables_paginate { display: flex; gap: .25rem; flex-wrap: wrap; }
  #bidPipelineTable_wrapper .dataTables_paginate .paginate_button.current { background: #0f766e !important; color: #fff !important; border-radius: 999px !important; border: none !important; }
  #bidPipelineTable_wrapper .dataTables_paginate .paginate_button { border-radius: 999px; padding: .25rem .7rem; }
  #bidPipelineTable_wrapper .dataTables_paginate .paginate_button:hover { background: #f0fdfa !important; color: #0f766e !important; }
  /* หัวตาราง: คงสีกลาง (ไม่ใส่สี) ตามมาตรฐาน Notion/Airtable/Linear — สีที่มีความหมายให้อยู่แค่ badge สถานะ (คอลัมน์ STAGE) เท่านั้น
     ใส่สีที่หัวตารางด้วยจะไปแย่งซีนกับ badge สถานะที่มีความหมายจริงในแถวข้อมูล ดูรกไม่เข้ากัน (ยืนยันจากผู้ใช้ 2026-09-21) */
  #bidPipelineTable thead th { background: #f8fafc; color: #64748b; }
  #bidPipelineTable tbody tr { cursor: pointer; }
  #bidPipelineTable tbody tr, #bidPipelineTable tbody tr:hover, #bidPipelineTable tbody tr.odd, #bidPipelineTable tbody tr.even { background: #fff !important; }
  /* ปิด zebra striping + ไฮไลต์คอลัมน์ที่กำลังเรียงอยู่ (DataTables ใส่ให้อัตโนมัติทั้งคู่) — แถบเทาคลุมทั้งแถว/คอลัมน์ดูสะดุดตาเกินไป
     ⚠️ DataTables ไม่ได้ใช้ background-color แต่ใช้ box-shadow: inset 0 0 0 9999px กับทุก <td> ของแถว .odd (ไม่ใช่แค่คอลัมน์ที่เรียงอยู่)
     ต้องปิด box-shadow ที่ตัว td ทุกตัวในตาราง ไม่ใช่แค่ td.sorting_1/2/3 ไม่งั้นแถวคี่ (.odd) ยังมีคราบเทาเหลืออยู่ทุกคอลัมน์
     (ยืนยันปัญหาจากผู้ใช้ 2026-09-21 — เจอว่า td.sorting_1 อย่างเดียวไม่พอ เพราะ .odd ใส่ box-shadow ให้ td ทุกตัวในแถว ไม่ใช่แค่ตัวที่เรียงอยู่) */
  #bidPipelineTable tbody td { box-shadow: none !important; }
</style>
</head>
<body class="bg-slate-50 font-sans">
<div id="app">
  <div v-if="!authReady" class="min-h-screen flex items-center justify-center">
    <div class="spinner w-12 h-12"></div>
  </div>

  <template v-else>
    <app-nav :user="currentUser" page="bid-pipeline" ref="nav"></app-nav>

    <!-- Overlay ปิด dropdown ตัวกรอง Sales/ช่วงเวลา เมื่อคลิกนอกกล่อง — pattern เดียวกับ AppNav's openGroup (shared/app.js) -->
    <div v-if="openFilterDropdown" class="fixed inset-0 z-[39]" @click="openFilterDropdown = null"></div>

    <div class="md:ml-60 min-h-screen flex flex-col">
      <header class="sticky z-40 bg-white border-b border-slate-100 px-5 py-2.5 flex items-center gap-3 shadow-sm min-h-[56px] flex-wrap"
        :style="{top: navHeight + 'px'}">
        <h1 class="text-base font-bold text-slate-700 flex items-center gap-2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3H6a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3 3 3 0 0 0-3 3 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 3 3 0 0 0-3-3z"/>
          </svg>
          งานประมูล
        </h1>
        <!-- Sales + ช่วงเวลา: ตัวกรองระดับหน้า ยิง API ใหม่ กระทบข้อมูลทั้งหน้า (สถิติด้านบน + รายการด้านล่าง) จึงอยู่แถวหัวข้อ ไม่ใช่ในการ์ดรายการ
             ทำเป็น custom dropdown (ไม่ใช่ <select> เดิม) เพื่อใส่ไอคอน+ไฮไลต์ตอนเลือกอยู่ได้ตามที่ยืนยันจาก mockup — คนละแบบกับ <select> ที่ใช้ทั้งระบบ เฉพาะจุดนี้จุดเดียว (ยืนยันจากผู้ใช้ 2026-09-20) -->
        <div class="ml-auto flex items-center gap-1.5 flex-wrap">
          <div class="flex items-center gap-1.5 bg-slate-50 rounded-full p-1">
            <div v-if="isManager" class="relative">
              <button type="button" @click.stop="openFilterDropdown = openFilterDropdown==='sales' ? null : 'sales'"
                class="flex items-center gap-1.5 rounded-full px-3 py-1 text-sm border-0 cursor-pointer bg-white ring-1 transition-colors"
                :class="filter.assigned_to ? 'ring-teal-600 text-teal-700 font-semibold' : 'ring-slate-200 text-slate-600 hover:bg-slate-50'">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg>
                {{ selectedSaleLabel }}
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div v-if="openFilterDropdown==='sales'" @click.stop
                class="absolute right-0 top-full mt-1 bg-white rounded-xl shadow-xl ring-1 ring-slate-100 overflow-hidden z-10 py-1" style="min-width:190px">
                <a href="#" @click.prevent="selectSale('')"
                  class="block px-3.5 py-2.5 text-sm no-underline cursor-pointer hover:bg-slate-50"
                  :class="!filter.assigned_to ? 'text-teal-700 font-semibold' : 'text-slate-600'">— Sales ทั้งหมด —</a>
                <a v-for="s in salesUsers" :key="s.id" href="#" @click.prevent="selectSale(s.id)"
                  class="block px-3.5 py-2.5 text-sm no-underline cursor-pointer hover:bg-slate-50"
                  :class="String(filter.assigned_to)===String(s.id) ? 'text-teal-700 font-semibold' : 'text-slate-600'">{{ s.full_name }}</a>
              </div>
            </div>
            <div class="relative">
              <button type="button" @click.stop="openFilterDropdown = openFilterDropdown==='period' ? null : 'period'"
                title="กรองเฉพาะการ์ดใน Kanban board ด้านล่าง ไม่กระทบการ์ดสถิติด้านบน"
                class="flex items-center gap-1.5 rounded-full px-3 py-1 text-sm border-0 cursor-pointer bg-white ring-1 transition-colors"
                :class="filter.period!=='all' ? 'ring-teal-600 text-teal-700 font-semibold' : 'ring-slate-200 text-slate-600 hover:bg-slate-50'">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                {{ selectedPeriodLabel }}
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div v-if="openFilterDropdown==='period'" @click.stop
                class="absolute right-0 top-full mt-1 bg-white rounded-xl shadow-xl ring-1 ring-slate-100 overflow-hidden z-10 py-1" style="min-width:150px">
                <a v-for="p in periodOptions" :key="p.value" href="#" @click.prevent="selectPeriod(p.value)"
                  class="block px-3.5 py-2.5 text-sm no-underline cursor-pointer hover:bg-slate-50"
                  :class="filter.period===p.value ? 'text-teal-700 font-semibold' : 'text-slate-600'">{{ p.label }}</a>
              </div>
            </div>
          </div>
          <button @click="loadData" title="รีเฟรชข้อมูล" aria-label="รีเฟรชข้อมูล"
            class="w-8 h-8 flex items-center justify-center rounded-full bg-white ring-1 ring-slate-200 text-slate-500 hover:bg-slate-50 border-0 cursor-pointer shrink-0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
          </button>
        </div>
      </header>

      <main class="flex-1 w-full max-w-[1600px] mx-auto px-4 pb-24 pt-5 md:px-6 md:py-6">

        <!-- มือถือ (ต่ำกว่า md): แท็บสลับ "สรุปภาพรวม" / "รายการงาน" แทนการเลื่อนผ่านการ์ดสถิติเพื่อไปหารายการ (ยืนยันจากผู้ใช้ 2026-09-21 แบบ B)
             จอ md+ (แท็บเล็ต/PC) ไม่กระทบ ไม่มีแท็บ แสดงทั้งสรุปและรายการพร้อมกันแบบเดิม -->
        <div class="md:hidden flex border-b-2 border-slate-100 mb-4 -mx-4 px-4">
          <button @click="mobileTab='summary'" type="button"
            class="flex-1 text-center py-2.5 text-sm font-bold border-0 border-b-2 -mb-0.5 bg-transparent cursor-pointer transition-colors"
            :class="mobileTab==='summary' ? 'text-teal-700 border-teal-700' : 'text-slate-400 border-transparent'">สรุปภาพรวม</button>
          <button @click="mobileTab='list'" type="button"
            class="flex-1 text-center py-2.5 text-sm font-bold border-0 border-b-2 -mb-0.5 bg-transparent cursor-pointer transition-colors"
            :class="mobileTab==='list' ? 'text-teal-700 border-teal-700' : 'text-slate-400 border-transparent'">รายการงาน ({{ stats.total_all ?? 0 }})</button>
        </div>

        <!-- Stats row: มือถือแสดงเมื่อ mobileTab==='summary' เท่านั้น (คุมด้วย 'hidden' ที่ผูกกับ mobileTab)
             จอ md ขึ้นไป: บังคับแสดงเสมอด้วย md:!block (important) ทับ 'hidden' โดยไม่สนใจค่า mobileTab (มือถือ/PC ใช้เงื่อนไขคนละชุดกัน) -->
        <div :class="{ hidden: mobileTab!=='summary' }" class="md:!block">
        <!-- แบ่งเป็น 2 กลุ่ม (label + การ์ดของกลุ่มนั้น) อยู่แถวเดียวกัน
             กลุ่ม 1 (งานที่ยังไม่จบ) กว้าง 3 คอลัมน์ ในนั้นมี sub-group 2 อัน: งานทั้งหมด (ทุกสถานะ) 1 คอลัมน์ + งานในมือ/รอประกาศผล/Weighted Pipeline 3 คอลัมน์
             กลุ่ม 2 (ผลลัพธ์ที่จบแล้ว) กว้าง 1 คอลัมน์ = ชนะประมูล (+ Win Rate)
             "งานทั้งหมด (ทุกสถานะ)" ตาม pattern เดียวกับหน้างานขายตรง (sales-pipeline.html) — ป้ายกำกับแยกจาก "งานที่ยังไม่จบ" เพราะคนละ concept -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-4 items-start">
          <div class="md:col-span-3 grid grid-cols-1 md:grid-cols-4 gap-3">
            <!-- ป้ายย่อย: งานทั้งหมด (ทุกสถานะ) — คลุมแค่การ์ดเดียว -->
            <div class="md:col-span-1 flex flex-col">
              <div class="flex items-center gap-1.5 mb-2">
                <span class="text-xs font-bold text-slate-500">📊 งานทั้งหมด (ทุกสถานะ)</span>
                <button @click="modal = {type:'total-all-info'}"
                  class="w-5 h-5 flex items-center justify-center rounded-full bg-slate-300 text-white hover:bg-slate-400 border-0 cursor-pointer shrink-0 transition-colors text-[12px] font-black leading-none" title="งานทั้งหมด คืออะไร">i</button>
              </div>
              <div class="bg-white rounded-xl px-5 py-4 ring-1 ring-slate-100 shadow-sm flex-1">
                <div>
                  <div class="flex items-center gap-1.5 mb-2.5 flex-wrap">
                    <svg class="w-4 h-4 text-slate-300 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7H4a2 2 0 00-2 2v9a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2zM16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
                    <span class="text-xs text-slate-400 font-medium">จำนวนงานทั้งหมด</span>
                  </div>
                  <div class="text-[1.75rem] font-black leading-none text-purple-700">{{ stats.total_all ?? 0 }} <span class="text-sm font-semibold text-slate-400">งาน</span></div>
                </div>
                <div class="mt-3 pt-3 border-t border-slate-100">
                  <div class="flex items-center gap-1.5 mb-2.5 flex-wrap">
                    <svg class="w-4 h-4 text-slate-300 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path stroke-linecap="round" d="M6 12h.01M18 12h.01"/></svg>
                    <span class="text-xs text-slate-400 font-medium">มูลค่ารวมทั้งหมด</span>
                  </div>
                  <div class="text-[1.3rem] font-black leading-none text-purple-700">฿{{ formatNumber(stats.total_all_value) }}</div>
                </div>
              </div>
            </div>

            <!-- ป้ายย่อย: งานที่ยังไม่จบ (คาดการณ์) -->
            <div class="md:col-span-3 flex flex-col">
              <div class="flex items-center gap-1.5 mb-2">
                <span class="text-xs font-bold text-slate-500">📈 งานที่ยังไม่จบ (คาดการณ์)</span>
                <button @click="modal = {type:'forecast-info'}"
                  class="w-5 h-5 flex items-center justify-center rounded-full bg-slate-300 text-white hover:bg-slate-400 border-0 cursor-pointer shrink-0 transition-colors text-[12px] font-black leading-none" title="งานที่ยังไม่จบ (คาดการณ์) คืออะไร">i</button>
              </div>
              <!-- รวม งานในมือ/รอประกาศผล/Weighted Pipeline เป็นการ์ดเดียวคั่นด้วยเส้นแบ่ง — งานในมือเต็มความกว้างด้านบน (มีบรรทัดย่อยเยอะสุด)
                   ส่วนรอประกาศผล/Weighted Pipeline เรียง 2 คอลัมน์ด้านล่าง (มีแค่ตัวเลขบรรทัดเดียว) ให้ความสูงใกล้เคียงการ์ดข้างๆ ที่มีแค่ 2 หัวข้อ (ยืนยันจากผู้ใช้ 2026-09-21) -->
              <div class="bg-white rounded-xl px-5 py-4 shadow-sm ring-1 ring-slate-100 flex-1">
                <div>
                  <div class="flex items-center gap-1.5 mb-2.5 flex-wrap">
                    <svg class="w-4 h-4 text-slate-300 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7H4a2 2 0 00-2 2v9a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2zM16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
                    <span class="text-xs text-slate-400 font-medium">งานในมือ</span>
                  </div>
                  <div class="flex items-baseline gap-2">
                    <span class="text-[1.75rem] font-black leading-none text-sky-700">{{ stats.active ?? 0 }}</span>
                    <span v-if="statsValues.active" class="text-slate-300 font-normal">/</span>
                    <span v-if="statsValues.active" class="text-[1.3rem] font-black leading-none text-sky-600">{{ formatValueShort(statsValues.active) }}</span>
                  </div>
                  <div class="text-[.7rem] text-slate-300 font-normal mt-1.5">ยังดำเนินการอยู่ · ข้อมูลล่าสุด ณ ตอนนี้</div>
                  <div v-if="stats.active_7d_ago != null" class="text-[.7rem] font-semibold mt-1"
                    :class="activeDeltaCount > 0 ? 'text-emerald-600' : activeDeltaCount < 0 ? 'text-rose-500' : 'text-slate-400'">
                    {{ activeDeltaCount > 0 ? '▲' : activeDeltaCount < 0 ? '▼' : '—' }}
                    {{ activeDeltaCount > 0 ? '+' : '' }}{{ activeDeltaCount }} งาน ({{ formatDelta(activeDeltaValue) }}) จาก 7 วันก่อน
                  </div>
                </div>
                <div class="mt-3 pt-3 border-t border-slate-100 grid grid-cols-2 gap-4">
                  <div>
                    <div class="flex items-center gap-1.5 mb-2.5 flex-wrap">
                      <svg class="w-4 h-4 text-slate-300 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 7v5l3 3"/></svg>
                      <span class="text-xs text-slate-400 font-medium">รอประกาศผล</span>
                    </div>
                    <div class="flex items-baseline gap-2 flex-wrap">
                      <span class="text-[1.75rem] font-black leading-none text-violet-700">{{ stats.submitted ?? 0 }}</span>
                      <span v-if="statsValues.submitted" class="text-slate-300 font-normal">/</span>
                      <span v-if="statsValues.submitted" class="text-[1.3rem] font-black leading-none text-violet-600">{{ formatValueShort(statsValues.submitted) }}</span>
                    </div>
                  </div>
                  <div>
                    <div class="flex items-center gap-1.5 mb-2.5 flex-wrap">
                      <svg class="w-4 h-4 text-slate-300 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3v18h18M7 15l4-6 3 3 4-7"/></svg>
                      <span class="text-xs text-slate-400 font-medium">Weighted Pipeline</span>
                    </div>
                    <div class="text-[1.3rem] font-black leading-none text-indigo-700">฿{{ formatNumber(weightedPipeline) }}</div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- กลุ่ม: ผลลัพธ์ที่จบแล้ว (สรุปย้อนหลัง) -->
          <div class="md:col-span-1 flex flex-col">
            <div class="flex items-center gap-1.5 mb-2">

              <div class="text-right">
                <div class="flex items-center justify-end gap-1.5 mb-2.5 flex-wrap">
                  <svg class="w-4 h-4 text-slate-300 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
                  <span class="text-xs text-slate-400 font-medium">Win Rate</span>
                </div>
                <div class="text-[1.75rem] font-black leading-none text-amber-600">{{ stats.win_rate != null ? stats.win_rate + '%' : '-' }}</div>
                <div class="text-[.7rem] text-slate-300 font-normal mt-1.5">จากงานที่มีผลแล้ว · ตลอดกาล</div>
                <div class="text-[.7rem] text-slate-300 font-normal mt-1">ชนะ {{ stats.won ?? 0 }} · แพ้ {{ stats.lost ?? 0 }} งาน</div>
              </div>
            </div>
            <div class="mt-2.5 pt-2.5 border-t border-slate-100 grid grid-cols-[1fr_auto_auto] gap-x-3 gap-y-1.5 items-baseline">
              <span class="text-xs text-slate-400">เดือนนี้</span>
              <span class="text-sm font-bold text-slate-700 text-right whitespace-nowrap">{{ stats.won_month?.count ?? 0 }} งาน</span>
              <span class="text-xs text-emerald-600 font-semibold text-right whitespace-nowrap">{{ formatValueShort(stats.won_month?.value) || '-' }}</span>

              <span class="text-xs text-slate-400">ไตรมาสนี้</span>
              <span class="text-sm font-bold text-slate-700 text-right whitespace-nowrap">{{ stats.won_quarter?.count ?? 0 }} งาน</span>
              <span class="text-xs text-emerald-600 font-semibold text-right whitespace-nowrap">{{ formatValueShort(stats.won_quarter?.value) || '-' }}</span>

              <span class="text-xs text-slate-400">ปีนี้</span>
              <span class="text-sm font-bold text-slate-700 text-right whitespace-nowrap">{{ stats.won_year?.count ?? 0 }} งาน</span>
              <span class="text-xs text-emerald-600 font-semibold text-right whitespace-nowrap">{{ formatValueShort(stats.won_year?.value) || '-' }}</span>
            </div>
            </div>
          </div>
        </div>

        <!-- Team summary (manager only) -->
        <div v-if="isManager && perSale.length && !filter.assigned_to"

          <div class="px-5 py-3 border-b border-slate-100 flex items-center justify-between">
            <span class="font-bold text-slate-700 text-sm">ภาพรวมทีม Sales</span>
            <span class="text-xs text-slate-400">คลิกแถวเพื่อกรอง · ข้อมูลตลอดกาล (all-time)</span>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full border-collapse text-sm">
              <thead>
                <tr class="bg-slate-50">
                  <th class="px-4 py-2.5 text-left text-[.72rem] font-bold text-slate-500 uppercase border-b border-slate-100">Sales</th>
                  <th class="px-3 py-2.5 text-center text-[.72rem] font-bold text-slate-500 uppercase border-b border-slate-100">งานในมือ</th>
                  <th class="px-3 py-2.5 text-center text-[.72rem] font-bold text-slate-500 uppercase border-b border-slate-100">รอผล</th>
                  <th class="px-3 py-2.5 text-center text-[.72rem] font-bold text-slate-500 uppercase border-b border-slate-100">ชนะ</th>
                  <th class="px-3 py-2.5 text-center text-[.72rem] font-bold text-slate-500 uppercase border-b border-slate-100">แพ้</th>

                  <th class="px-4 py-2.5 text-right text-[.72rem] font-bold text-slate-500 uppercase border-b border-slate-100">มูลค่าชนะ</th>

              </thead>
              <tbody>
                <tr v-for="s in perSale" :key="s.id"

                  <td class="px-4 py-3">
                    <div class="flex items-center gap-2">
                      <img v-if="s.photo_url" :src="s.photo_url" class="w-7 h-7 rounded-full object-cover shrink-0"/>
                      <div v-else class="w-7 h-7 rounded-full flex items-center justify-center text-white text-[.72rem] font-bold shrink-0"

                      <span class="font-semibold text-slate-800">{{ s.full_name }}</span>

                  <td class="px-3 py-3 text-center font-bold text-sky-600">{{ s.active }}</td>
                  <td class="px-3 py-3 text-center font-semibold text-violet-600">{{ s.submitted }}</td>
                  <td class="px-3 py-3 text-center font-bold text-emerald-600">{{ s.won }}</td>
                  <td class="px-3 py-3 text-center text-rose-500">{{ s.lost }}</td>
                  <td class="px-3 py-3 text-center">
                    <span v-if="s.win_rate != null" class="font-bold text-sm"
                      :style="{color: s.win_rate>=60?'#059669':s.win_rate>=40?'#d97706':'#dc2626'}">{{ s.win_rate }}%</span>

          </div>
        </div>
        </div>
        <!-- /มือถือ: ปิดกลุ่ม "สรุปภาพรวม" (การ์ดสถิติ + ภาพรวมทีม Sales) -->

        <!-- Content card: รายการงานประมูล (ค้นหา/ตัวกรอง/สลับมุมมอง/แท็บสถานะ/เนื้อหา ทั้งหมดอยู่ในการ์ดเดียวกัน เพราะเป็นส่วนเดียวกัน — ค้นหา/ตัวกรองมีไว้กรองเนื้อหาด้านล่างนี้เท่านั้น
             แยกการ์ดกันจะสื่อผิดว่าเป็นคนละส่วน ไม่เกี่ยวกัน (ยืนยันจากผู้ใช้ 2026-09-19)
             มือถือ: แสดงเมื่อ mobileTab==='list' เท่านั้น (คุมด้วย 'hidden'); จอ md ขึ้นไป: md:!block บังคับแสดงเสมอ ไม่สนใจ mobileTab -->
        <div :class="{ hidden: mobileTab!=='list' }" class="md:!block">
        <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100 overflow-hidden">
          <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100 gap-3 flex-wrap">
            <span class="font-bold text-slate-700 flex items-center gap-2">
              <span class="w-8 h-8 rounded-lg bg-teal-50 text-teal-700 flex items-center justify-center shrink-0">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3H6a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3 3 3 0 0 0-3 3 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 3 3 0 0 0-3-3z"/></svg>
              </span>
              รายการงานประมูล
            </span>
            <div class="flex items-center gap-2 w-full sm:w-auto">
              <!-- View tab: Kanban กระดานจริง / การ์ด (ลิสต์แนวตั้งรวมทุกสถานะ) / ตาราง — เดิมมี 2 แบบ (สถานะ/ตาราง) เพิ่ม "การ์ด" ให้อ่านง่ายขึ้นบนจอแคบ (ยืนยันจากผู้ใช้ 2026-09-19) -->
              <span class="text-xs text-slate-400 hidden sm:inline">ดูแบบ:</span>
              <div class="flex border-[1.5px] border-slate-300 rounded-xl overflow-hidden">
                <button @click="view='kanban'"
                  class="px-3 py-1.5 text-xs font-semibold border-0 cursor-pointer transition-colors flex items-center gap-1.5"
                  :class="view==='kanban' ? 'bg-teal-700 text-white' : 'bg-white text-slate-500 hover:bg-slate-50'">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="18" rx="1"/><rect x="10.5" y="3" width="6" height="10" rx="1"/><rect x="18" y="3" width="3" height="14" rx="1"/></svg>
                  Kanban</button>
                <button @click="view='list'"
                  class="px-3 py-1.5 text-xs font-semibold border-0 cursor-pointer transition-colors flex items-center gap-1.5"
                  :class="view==='list' ? 'bg-teal-700 text-white' : 'bg-white text-slate-500 hover:bg-slate-50'">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                  การ์ด</button>
                <button @click="view='table'"
                  class="px-3 py-1.5 text-xs font-semibold border-0 cursor-pointer transition-colors flex items-center gap-1.5"
                  :class="view==='table' ? 'bg-teal-700 text-white' : 'bg-white text-slate-500 hover:bg-slate-50'">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
                  ตาราง</button>
              </div>
              <!-- แสดงตลอดไม่ว่าจะอยู่ tab ไหน (ไม่ใช้ v-if) กันปุ่มโผล่/หายตอนสลับ tab ทำให้ปุ่มมุมมองข้างๆ ขยับตำแหน่ง —
                   ตาราง DataTables ยังอยู่ใน DOM เสมอ (แค่ v-show ซ่อน ไม่ได้ destroy) exportTable() เลยทำงานได้แม้อยู่มุมมองสถานะ -->
              <button @click="exportTable" title="Export Excel" aria-label="Export Excel"
                class="ml-auto inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                <span>Excel</span>
              </button>
            </div>
          </div>

          <!-- ค้นหา + ตัวกรองเพิ่มเติม + แสดงงานปิด + เรียงตาม: ทั้งหมดนี้คือ "กรองข้อมูลที่โหลด/เลือกสถานะไว้แล้วให้แคบลงอีก" คนละจุดประสงค์กับ Sales/ช่วงเวลา (ยิง API) ที่ย้ายขึ้นแถวหัวข้อไปแล้ว
               จึงจัดกลุ่มอยู่แถวเดียวกัน — ช่องค้นหากรอง client-side ทันที (matchesSearch()) ส่วน "ตัวกรอง" ยิง API แยกต่างหาก (ยืนยันจากผู้ใช้ 2026-09-20) -->
          <div class="px-5 pt-4 pb-3 flex items-center gap-2 flex-wrap border-b border-slate-100">
            <div class="flex-1 min-w-[180px] flex items-center gap-2">
              <svg class="w-4 h-4 shrink-0 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input v-model="filter.search" type="text" placeholder="ค้นหาชื่อโครงการ, หน่วยงาน, รหัสงาน..."
                class="flex-1 border-0 outline-none text-sm bg-transparent">
            </div>
            <button @click="modal = {type:'adv-filter'}"
              class="inline-flex items-center gap-1.5 border border-slate-200 rounded-full px-3 py-2 text-sm font-semibold bg-white text-slate-600 hover:bg-slate-50 cursor-pointer transition-colors shrink-0"
              :class="{'!border-teal-400 !text-teal-700 !bg-teal-50': advFilterCount>0}">
              <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 4h18l-7 8v6l-4 2v-8L3 4z"/></svg>
              ตัวกรอง
              <span v-if="advFilterCount" class="inline-flex items-center justify-center w-4 h-4 rounded-full bg-teal-600 text-white text-[10px] font-bold">{{ advFilterCount }}</span>
            </button>
            <!-- เรียงตาม: ใช้ dropdown เดียวกันควบคุมลำดับทั้ง 3 มุมมอง (Kanban/การ์ด/ตาราง) — มาตรฐานเดียวกับ Trello/Jira/Linear (ยืนยันจากผู้ใช้ 2026-09-20) -->
            <div class="relative shrink-0">
              <button type="button" @click.stop="openFilterDropdown = openFilterDropdown==='sort' ? null : 'sort'"
                class="flex items-center gap-1.5 rounded-full px-3 py-2 text-sm border border-slate-200 cursor-pointer bg-white text-slate-600 hover:bg-slate-50 transition-colors">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
                {{ selectedSortLabel }}
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div v-if="openFilterDropdown==='sort'" @click.stop
                class="absolute left-0 top-full mt-1 bg-white rounded-xl shadow-xl ring-1 ring-slate-100 overflow-hidden z-40 py-1" style="min-width:220px">
                <a v-for="opt in sortOptions" :key="opt.value" href="#" @click.prevent="selectSort(opt.value)"
                  class="block px-3.5 py-2.5 text-sm no-underline cursor-pointer hover:bg-slate-50"
                  :class="sortBy===opt.value ? 'text-teal-700 font-semibold' : 'text-slate-600'">{{ opt.label }}</a>
              </div>
            </div>
            <div v-if="loading" class="flex items-center gap-1.5 text-xs text-slate-500 shrink-0">
              <div class="spinner w-4 h-4" style="border-width:2px"></div> กำลังโหลด...
            </div>
          </div>

          <!-- แท็บสถานะ: ใช้ร่วมกันทั้ง 3 มุมมอง — Kanban (เลือกแท็บเดียวจะโฟกัสคอลัมน์นั้นเต็มความกว้าง), การ์ด และตาราง (ยืนยันจากผู้ใช้ 2026-09-19) -->
          <div class="flex items-center gap-1.5 px-5 py-3 border-b border-slate-100 overflow-x-auto">
            <span class="inline-flex items-center gap-1 shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold cursor-pointer transition-colors"
              :class="activeStatusTab==='all' ? 'bg-teal-700 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
              @click="selectStatusTab('all')">ทั้งหมด <span class="opacity-80">{{ tabStagesTotal }}</span></span>
            <span v-for="stage in tabStages" :key="stage.key"
              class="inline-flex items-center gap-1 shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold cursor-pointer border-[1.5px] transition-colors"
              :style="activeStatusTab===stage.key ? {background: stage.bgLight, color: stage.textLight, borderColor: stage.textLight} : {background: stage.bgLight, color: stage.textLight, borderColor: 'transparent'}"
              @click="selectStatusTab(stage.key)">{{ stage.label }} <span class="opacity-80">{{ stageCards(stage.key).length }}</span></span>
          </div>

          <p v-if="view==='kanban'" class="px-5 pt-3 text-xs text-slate-400">สถานะที่ยังไม่มีงานจะย่อให้อัตโนมัติ กดที่แถบเพื่อดูรายละเอียด</p>

        <!-- KANBAN -->
        <div v-show="view==='kanban'" class="p-4 flex gap-3 overflow-x-auto pb-4">
          <!-- สถานะที่ยังไม่มีงาน (0 งาน) ย่อเป็นแถบแคบอัตโนมัติ กันคอลัมน์ว่างกินพื้นที่จนต้อง scroll เยอะ — กดแถบเพื่อขยาย/ย่อกลับได้เอง
               (ยืนยันจากผู้ใช้ 2026-09-18 — ไม่ใช้ปุ่มควบคุมแยก เพราะกลุ่มผู้ใช้หลักไม่คุ้น UI ปุ่มซ่อน/แสดงแบบนั้น)
               ใช้ template ห่อ v-for แล้วค่อย v-if/v-else ข้างในเสมอ — ห้ามใส่ v-for กับ v-if บนแท็กเดียวกัน เพราะ Vue 3 ให้ v-if ตัดสินก่อน v-for
               ทำให้ตัวแปร stage จาก v-for ยังไม่ถูกสร้างตอน v-if ประเมินค่า (ต่างจาก Vue 2 ที่ v-for มาก่อน) -->
          <template v-for="stage in visibleStages" :key="stage.key">
            <div v-if="isStageCollapsed(stage)"
              class="flex-shrink-0 w-10 rounded-xl overflow-hidden cursor-pointer"
              :style="{background: stage.bgLight}"
              @click="toggleStageExpand(stage.key)">
              <div class="flex flex-col items-center justify-between h-44 py-2.5" :style="{color: stage.textLight}">
                <span class="rounded-full px-1.5 py-0.5 text-[10px] font-bold" :style="{background: stage.bgLightMid}">{{ stageCards(stage.key).length }}</span>
                <span class="text-xs font-semibold" style="writing-mode: vertical-rl;">{{ stage.label }}</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
              </div>
            </div>
            <div v-else class="flex-shrink-0 flex flex-col" :class="visibleStages.length===1 ? 'w-full max-w-md' : 'w-56'">
            <!-- Column header -->
            <div class="px-3 py-2.5 flex items-center justify-between rounded-t-xl font-semibold text-sm"
              :style="{background: stage.bgLight, color: stage.textLight}">
              <span class="truncate">{{ stage.label }}</span>
              <span class="ml-1 rounded-full px-2 py-0.5 text-xs shrink-0" :style="{background: stage.bgLightMid}">{{ stageCards(stage.key).length }}</span>

        </div>
      </div>

      <!-- Quotation Detail Modal (ใบเสนอราคาเก่าที่นำเข้ามาเป็นงานประมูลนี้ — เปิดจากลิงก์เลขที่ใบใน "บันทึก Sale" ของ Detail Modal) -->

            <h3 class="font-bold text-lg flex items-center flex-wrap gap-2">
              <span>รายละเอียดใบเสนอราคา {{ modal.data.quotation_id }}<span v-if="modal.data.reverend !== null && modal.data.reverend !== undefined" class="text-sm font-semibold opacity-80"> (Rev {{ modal.data.reverend }})</span></span>

                    <th class="text-right font-semibold px-2 py-2 border-b border-slate-200 whitespace-nowrap">ราคา/หน่วย</th>
                    <th class="text-right font-semibold px-2 py-2 border-b border-slate-200 whitespace-nowrap">รวม (บาท)</th>
                    <th class="text-right font-semibold px-2 py-2 border-b border-slate-200 whitespace-nowrap">เลขที่ Order</th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-for="(it, i) in modal.data.items" :key="i" :class="i>0 ? 'border-t border-slate-100' : ''">

                    <td class="text-slate-800 font-medium px-2 py-2 whitespace-pre-line align-top">{{ it.product_descp }}</td>

          <!-- ตารางสรุปยอด — ใช้ label 2 ภาษี (ไทย/อังกฤษ) ให้ตรงกับใบเสนอราคาตัวจริงเป๊ะๆ (รวมยอดรวมทั้งสิ้น/TOTAL, ส่วนลด/DISCOUNT %, สุทธิ/NET, ภาษีมูลค่าเพิ่ม/VAT, จำนวนเงินสุทธิ/GRAND TOTAL) -->

              <span class="text-slate-500">รวมยอดรวมทั้งสิ้น/TOTAL</span>
              <span></span>
              <span class="text-right text-slate-700 min-w-[90px]">{{ formatPrice(modal.data.gross_amount) }}</span>

            </div>
            <div class="grid grid-cols-[1fr,auto,auto] gap-3 items-center px-3 py-2 border-b border-slate-100">
              <span class="text-slate-500">ภาษีมูลค่าเพิ่ม/VAT</span>
              <span class="text-right text-slate-500 min-w-[46px]">{{ formatNum(modal.data.vat_percent) }} %</span>
              <span class="text-right text-slate-700 min-w-[90px]">{{ formatPrice(modal.data.vat_amount) }}</span>
            </div>
            <div class="grid grid-cols-[1fr,auto,auto] gap-3 items-center px-3 py-2.5 bg-emerald-50">
              <span class="font-bold text-emerald-700">จำนวนเงินสุทธิ/GRAND TOTAL</span>
              <span></span>
              <span class="text-right font-bold text-emerald-700 text-base min-w-[90px]">{{ formatPrice(modal.data.net_amount) }}</span>

            <div class="flex gap-2 py-1.5 text-xs">
              <span class="text-slate-400 w-24 shrink-0">ผู้สร้าง</span>

            </div>

              <span class="text-slate-400 w-24 shrink-0">ผู้แก้ไขล่าสุด</span>
              <span class="text-slate-600">{{ modal.data.updated_by || '-' }}<span v-if="modal.data.updated_at" class="text-slate-400"> · {{ formatDateTimeThai(modal.data.updated_at) }}</span></span>
            </div>
            <div class="flex gap-2 py-1.5 text-xs">
              <span class="text-slate-400 w-24 shrink-0">ผู้อนุมัติ</span>

          </div>

        <div class="px-6 py-5 flex items-center justify-between border-b"
          :style="winLossForm.newStatus==='ชนะการประมูล' ? 'background:#f0fdf4;border-color:#bbf7d0' : 'background:#fff1f2;border-color:#fecdd3'">
          <h3 class="font-bold text-lg" :style="winLossForm.newStatus==='ชนะการประมูล' ? 'color:#15803d' : 'color:#b91c1c'">
            {{ winLossForm.newStatus==='ชนะการประมูล' ? 'บันทึก — ชนะการประมูล' : 'บันทึก — แพ้การประมูล' }}
          </h3>
          <button class="bg-transparent border-0 text-2xl cursor-pointer leading-none text-slate-500 hover:text-slate-700" @click="closeModal">×</button>
        </div>
        <div class="p-5 overflow-y-auto max-h-[calc(100vh-200px)]">

            {{ modal.data?.project_name }}
          </div>
          <div class="mb-4">
            <label class="block text-sm font-semibold text-slate-600 mb-2">เหตุผลหลัก <span class="text-red-500">*</span></label>
            <div class="flex gap-2 flex-wrap">
              <div v-for="r in (winLossForm.newStatus==='ชนะการประมูล' ? wonReasons : lostReasons)" :key="r"

                class="px-3 py-1.5 rounded-xl border-[1.5px] text-sm font-semibold cursor-pointer transition-all"
                :style="winLossForm.reason===r
                  ? (winLossForm.newStatus==='ชนะการประมูล' ? 'background:#166534;color:#fff;border-color:#166534' : 'background:#b91c1c;color:#fff;border-color:#b91c1c')
                  : (winLossForm.newStatus==='ชนะการประมูล' ? 'background:#f0fdf4;color:#166534;border-color:#86efac' : 'background:#fff1f2;color:#b91c1c;border-color:#fca5a5')">
                {{ r }}
              </div>
            </div>
          </div>

              class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">

              :placeholder="winLossForm.newStatus==='ชนะการประมูล' ? 'เช่น ราคาต่างจากคู่แข่ง / จุดแข็งที่ทำให้ชนะ...' : 'เช่น ชื่อผู้ชนะ / ราคาที่ต่างกัน / สเปกที่ขาด...'"
              class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white resize-y"></textarea>
          </div>
        </div>
        <div class="px-5 py-4 border-t border-slate-100 flex items-center justify-end gap-2">
          <button class="px-4 py-2 rounded-xl text-sm font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer" @click="closeModal">ยกเลิก</button>
          <button class="px-5 py-2 rounded-xl text-sm font-bold text-white border-0 cursor-pointer"
            :class="winLossForm.newStatus==='ชนะการประมูล' ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-red-600 hover:bg-red-700'"
            @click="submitWinLoss">
            {{ winLossForm.newStatus==='ชนะการประมูล' ? 'ยืนยันชนะ ✓' : 'ยืนยันแพ้' }}
          </button>
        </div>

      <!-- งานทั้งหมด Info Modal -->
      <div v-if="modal.type==='total-all-info'" class="bg-white rounded-2xl w-full max-w-[480px] shadow-2xl overflow-hidden my-8">

          <button class="text-white/80 hover:text-white bg-transparent border-0 text-2xl cursor-pointer leading-none" @click="closeModal">×</button>
        </div>
        <div class="p-5">
          <p class="text-sm text-slate-600 leading-relaxed mb-3">
            ภาพรวมสะสม<b>ทุกงานประมูลที่เคยมอบหมายในระบบ</b> นับทุกสถานะรวมกัน (<code>รอดำเนินการ</code>, <code>รับงาน/ศึกษา TOR</code>, <code>จัดเตรียมยื่นข้อเสนอ</code>, <code>รอประกาศผล</code>, <code>ชนะการประมูล</code>, <code>ส่งมอบแล้ว</code>, <code>แพ้การประมูล</code>, <code>ยกเลิก</code>) — คนละแนวคิดกับ "งานในมือ" ที่ตัดงานที่จบแล้วออก การ์ดนี้ตอบคำถาม "ตลอดมามอบหมายงานไปทั้งหมดกี่งาน มูลค่ารวมเท่าไหร่" ไม่ใช่ประมาณการ
          </p>
          <div class="rounded-xl bg-purple-50 border border-purple-100 px-3 py-2.5">

            <div class="text-sm text-slate-600 leading-relaxed">ตลอดกาล (all-time) — นับรวมงานที่ชนะ/แพ้/ยกเลิกไปแล้วด้วย เพราะเป็นตัวเลขสะสมของงานที่เคยมอบหมาย ไม่ใช่ประมาณการโอกาสสำเร็จ</div>
          </div>

        <div class="px-5 py-4 border-t border-slate-100 flex justify-end">
          <button class="px-5 py-2 rounded-xl text-sm font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer" @click="closeModal">ปิด</button>
        </div>
      </div>

      <!-- งานที่ยังไม่จบ (คาดการณ์) Info Modal — รวม งานในมือ + รอประกาศผล + Weighted Pipeline ไว้ modal เดียว ตรงกับปุ่ม i เดียวที่ label กลุ่ม -->
      <div v-if="modal.type==='forecast-info'" class="bg-white rounded-2xl w-full max-w-[520px] shadow-2xl overflow-hidden my-8">

          <h3 class="font-bold text-lg">งานที่ยังไม่จบ (คาดการณ์) คืออะไร</h3>
          <button class="text-white/80 hover:text-white bg-transparent border-0 text-2xl cursor-pointer leading-none" @click="closeModal">×</button>
        </div>
        <div class="p-5">
          <div class="mb-4">

      sortBy: 'close_asc', // เรียงลำดับข้อมูลทั้ง 3 มุมมอง (Kanban/การ์ด/ตาราง) ด้วยตัวแปรเดียวกัน (ยืนยันจากผู้ใช้ 2026-09-20)
      navHeight: 0, // ความสูงจริงของแถบ AppNav (เปลี่ยนตามจอ/เนื้อหา) ใช้เป็นค่า top ของ header หน้านี้ตอน sticky กันซ้อนทับ — AppNav แก้ให้ sticky จริงแล้ว (shared/app.js, 2026-09-20)
      winLossForm: { id: null, newStatus: '', reason: '', note: '', bid_amount: null },

      expandedEmptyStages: {}, // key: stage.key -> true ถ้าผู้ใช้กดขยายสถานะที่ไม่มีงานเอง (ปกติสถานะว่างจะย่ออัตโนมัติ)

  watch: {
    // ปิดโหมดแก้ไขชื่อหน่วยงานทุกครั้งที่ modal เปิด/ปิด กันค้างโหมดแก้ไขข้ามไปคนละงาน
    'modal.type'() { this.editingUnitName = false; },
    // ช่องค้นหาด่วน — กรอง client-side ทันทีที่พิมพ์ ต้องสั่ง redraw DataTable เองเพราะ ext.search ไม่ reactive (มุมมอง Kanban/การ์ด reactive อยู่แล้วผ่าน computed)
    'filter.search'() {
      if ($.fn.dataTable.isDataTable('#bidPipelineTable')) $('#bidPipelineTable').DataTable().draw();
    },
    // เรียงตาม — มุมมอง Kanban/การ์ด reactive อยู่แล้วผ่าน computed แต่ตาราง DataTables ต้องสั่ง order() เองเพราะไม่ reactive (ยืนยันจากผู้ใช้ 2026-09-20)
    sortBy() {

  computed: {
    tabItems() {
      return [
        { label:'ภาพรวม', icon:'home', href:'dashboard.html' },
        { label:'งาน', icon:'doc', href:'my-assignments.html' },
        { label:'ประมูล', icon:'cols3', active:true },
        { label:'ออก', icon:'logout', action:'logout' },
      ];
    },
    // แก้ไข "ชื่อหน่วยงาน" ได้เฉพาะ sale เจ้าของงาน และเฉพาะงานประมูลย้อนหลัง (นำเข้าจากใบเสนอราคาเก่า) เท่านั้น (ยืนยันจากผู้ใช้ 2026-09-14)
    canEditUnitName() {
      return this.isSale
        && this.modal?.data?.source_type === 'legacy_quotation'
        && Number(this.modal?.data?.assigned_to) === Number(this.currentUser?.id);
    },
    isManager() { return ['admin','manager'].includes(this.currentUser?.role); },
    isSale()    { return this.currentUser?.role === 'sale'; },

    periodOptions() {
      return [
        { value: 'all',     label: 'ทั้งหมด' },
        { value: 'month',   label: 'เดือนนี้' },
        { value: 'quarter', label: 'ไตรมาสนี้' },
        { value: 'year',    label: 'ปีนี้' },
      ];
    },
    // ป้ายตอนปิด dropdown ใส่ชื่อหมวดสั้นๆ กำกับเสมอ ("Sales"/"ช่วงเวลา") ไม่ใช่แค่ "ทั้งหมด" เฉยๆ กันสับสนกับ dropdown ข้างๆ
    // แต่สั้นพอไม่ล้นจอมือถือ (ยืนยันจากผู้ใช้ 2026-09-21 ใช้หลักการเดียวกับ sales-pipeline.html)
    selectedSaleLabel() {
      if (!this.filter.assigned_to) return 'Sales';
      const s = this.salesUsers.find(u => String(u.id) === String(this.filter.assigned_to));
      return s ? s.full_name : 'Sales';
    },
    selectedPeriodLabel() {
      if (this.filter.period === 'all') return 'ช่วงเวลา';
      return this.periodOptions.find(p => p.value === this.filter.period)?.label || 'ช่วงเวลา';
    },

    sortOptions() {
      return [
        { value: 'close_asc',  label: 'วันปิดรับ (ใกล้หมดเขตก่อน)' },
        { value: 'close_desc', label: 'วันปิดรับ (ไกลสุดก่อน)' },
        { value: 'price_desc', label: 'ราคากลาง (สูงสุดก่อน)' },
        { value: 'price_asc',  label: 'ราคากลาง (ต่ำสุดก่อน)' },
      ];
    },
    selectedSortLabel() {
      return this.sortOptions.find(o => o.value === this.sortBy)?.label || 'เรียงตาม';
    },
    // คอลัมน์/ทิศทางของตาราง DataTables ที่ตรงกับ sortBy — ตำแหน่งคอลัมน์ขยับตาม isManager (มีคอลัมน์ Sales เพิ่ม)
    tableSortOrder() {
      const priceIdx = this.isManager ? 3 : 2;
      const closeIdx = this.isManager ? 4 : 3;
      const map = {
        close_asc:  [closeIdx, 'asc'],
        close_desc: [closeIdx, 'desc'],
        price_desc: [priceIdx, 'desc'],
        price_asc:  [priceIdx, 'asc'],
      };
      return map[this.sortBy] || [closeIdx, 'asc'];
    },

    // stage ที่ควรมองเห็นได้ — ใช้ร่วมกันทั้งแถบแท็บสถานะและ Kanban (ก่อนกรองด้วย activeStatusTab อีกชั้น)
    // เดิมมีตัวเลือก "แสดงงานปิด" ให้ซ่อน stage ที่จบแล้วได้ — เอาออกแล้ว แสดงทุก stage เสมอ (ยืนยันจากผู้ใช้ 2026-09-21)
    tabStages() {
      return STAGES;
    },

    tabStagesTotal() {
      return this.tabStages.reduce((n, s) => n + this.stageCards(s.key).length, 0);
    },

    // คอลัมน์ Kanban ที่แสดงจริง — ถ้าเลือกแท็บสถานะใดสถานะหนึ่ง (ไม่ใช่ "ทั้งหมด") เหลือคอลัมน์เดียวขยายเต็ม (ยืนยันจากผู้ใช้ 2026-09-19)
    visibleStages() {
      if (this.activeStatusTab === 'all') return this.tabStages;
      return this.tabStages.filter(s => s.key === this.activeStatusTab);
    },

    tableData() {
      return STAGES.flatMap(s => (this.kanban[s.key] || []));
    },

    // การ์ดที่แสดงในมุมมอง "การ์ด" (ลิสต์แนวตั้งรวมทุกสถานะ) กรองซ้ำด้วยแท็บสถานะที่เลือกอีกชั้น
    filteredFlatCards() {
      const base = this.activeStatusTab === 'all' ? this.tableData : this.tableData.filter(c => c.status === this.activeStatusTab);
      return this.sortCards(base.filter(c => this.matchesSearch(c)));
    },

    advFilterCount() {
      let n = 0;
      if (this.filter.priority)      n++;
      if (this.filter.sla_status)    n++;
      if (this.filter.unit_name)     n++;
      if (this.filter.announce_date) n++;
      if (this.filter.close_date)    n++;
      if (this.filter.price_min || this.filter.price_max) n++;
      return n;
    },

    wonReasons()  { return ['ราคากลาง','คุณสมบัติตรงสเปก','ความสัมพันธ์ลูกค้า','ส่งเร็วกว่าคู่แข่ง','อื่นๆ']; },
    lostReasons() { return ['ราคาสูงกว่าคู่แข่ง','ตกสเปก','เอกสารไม่ครบ','เวลาไม่พอ','ลูกค้าเลื่อน/ยกเลิก','อื่นๆ']; },

    parsedItems() {
      const raw = this.modal?.data?.items;
      if (!raw) return { summary: '', rows: [] };
      let t = raw.trim();
      let summary = '';
      const sm = t.match(/^(\d+\s*รายการ)\s*:\s*/);
      if (sm) { summary = sm[1]; t = t.slice(sm[0].length); }
      const lines = this.splitClauses(t);
      const rows = lines.map(line => {
        const m = line.match(/^\(?(\d+)\)?\s*(.+?)\s+(\d+(?:\.\d+)?)\s*(ชุด|ตัว|ชิ้น|อัน|เครื่อง|หน่วย|ห้อง|คัน|โต๊ะ|เตียง|ตู้|เก้าอี้)?\s*@\s*([\d,]+(?:\.\d+)?)\s*=\s*([\d,]+(?:\.\d+)?)\s*$/);
        if (m) return { parsed: true, no: m[1], name: m[2].trim(), qty: m[3], unit: m[4] || '', unitPrice: m[5], total: m[6] };
        return { parsed: false, text: line };
      });
      return { summary, rows };
    },

    // เลขที่ใบเสนอราคา แกะจาก project_no ตรงๆ (รูปแบบ 'HIST-' + Quotationid เดิม ดู importQuotation() ใน api/quotation_import.php)
    // ใช้แสดงแถว "เลขที่ใบเสนอราคา" คลิกได้ใน Detail Modal — เชื่อถือได้กว่า parse จาก sale_notes เพราะ field ตรงๆ ไม่ผ่านข้อความอิสระ
    historyQuotationId() {
      const projectNo = this.modal?.data?.project_no || '';
      return projectNo.startsWith('HIST-') ? projectNo.slice(5) : null;
    },

    statsValues() {
      // มาจาก stats.*_value ที่ backend คำนวณแบบไม่กรองตามช่วงเวลาของ Kanban board เสมอ (การ์ดสถิติเป็นอิสระจากตัวกรอง)
      return {
        active:    this.stats.active_value ?? 0,
        submitted: this.stats.submitted_value ?? 0,
        won:       this.stats.won_value ?? 0,
      };
    },

    weightedPipeline() {
      // งานในมือที่ยังไม่ได้ยื่นซองประมูล = โอกาสสำเร็จ 10%, ยื่นซองแล้วรอประกาศผล = โอกาสสำเร็จ 50%
      // อิง statsValues (การ์ดสถิติ ไม่ขึ้นกับตัวกรอง period ของ Kanban board) ไม่ใช่ this.kanban
      return Math.round(this.statsValues.active * 0.10 + this.statsValues.submitted * 0.50);
    },

    weightedBreakdown() {
      return [
        { label: 'ยังไม่ยื่นซองประมูล', stages: ['รอรับงาน', 'รับงาน/ศึกษา TOR', 'จัดเตรียมยื่นข้อเสนอ'],
          weightPct: 10, total: this.statsValues.active,    weighted: Math.round(this.statsValues.active * 0.10) },
        { label: 'ยื่นซองแล้ว รอประกาศผล', stages: ['รอประกาศผล'],
          weightPct: 50, total: this.statsValues.submitted, weighted: Math.round(this.statsValues.submitted * 0.50) },
      ];
    },

    activeDeltaCount() {
      return (this.stats.active ?? 0) - (this.stats.active_7d_ago ?? 0);
    },
    activeDeltaValue() {
      return Math.round((this.statsValues.active ?? 0) - (this.stats.active_7d_ago_value ?? 0));
    },
  },
  async mounted() {
    try {
      const res = await apiCall('GET', 'api/auth.php?action=me');
      if (!res.success) { window.location.href = 'login.html'; return; }
      this.currentUser = res.data;
      if (!['admin','manager','sale'].includes(this.currentUser.role)) {
        window.location.href = 'dashboard.html'; return;
      }
    } catch { window.location.href = 'login.html'; return; }
    this.authReady = true;
    await this.$nextTick(); // รอให้ Vue วาง <table id="bidPipelineTable"> ลง DOM ก่อน ค่อยให้ jQuery จับ
    this.bindTableEvents();
    // ตัวกรองสถานะแบบ custom ของ DataTables — กรองแถวตาราง (มุมมองตาราง) ตามแท็บสถานะเดียวกับ Kanban/การ์ด
    // ลงทะเบียนครั้งเดียวตอน mounted (ไม่ใช่ทุกครั้งที่ initDataTable) กัน push ซ้ำเข้า ext.search ทุกครั้งที่โหลดข้อมูลใหม่
    $.fn.dataTable.ext.search.push((settings, searchData, index, rowData) => {
      if (settings.nTable.id !== 'bidPipelineTable') return true;
      if (this.activeStatusTab !== 'all' && rowData.status !== this.activeStatusTab) return false;
      return this.matchesSearch(rowData);
    });
    if (this.isManager) this.loadSales();
    this.loadData();

    // วัดความสูงจริงของแถบ AppNav ไว้ใช้เป็น top ของ header หน้านี้ตอน sticky กันซ้อนทับ (ยืนยันจากผู้ใช้ 2026-09-20)
    // ใช้ ResizeObserver แทน setTimeout เดา timing — เดิมวัดตอน mounted() แล้วสุ่มเสี่ยงได้ค่าตอน Tailwind CDN
    // ยังฉีด style ให้ AppNav ไม่เสร็จ (สูงไม่ตรงจริง) header หน้านี้เลยเด้ง top ผิดตำแหน่งแวบหนึ่งก่อนค่อยเลื่อนถูกที่
    // (ยืนยันบั๊กจากผู้ใช้ 2026-09-21) ResizeObserver จะยิง callback ทันทีที่ขนาดจริงของ AppNav นิ่ง ไม่ต้องเดา delay
    // และ handle resize จอไปในตัว ไม่ต้องผูก window resize listener แยกอีกเส้น
    // สังเกตที่ document.querySelector('header') ตรงๆ (ไม่ใช้ this.$refs.nav.$el) เพราะ AppNav เป็น multi-root/fragment component
    // (ตั้งใจไม่ห่อ div ครอบ — ดูคอมเมนต์ที่ shared/app.js) $el ของ fragment component ชี้ไปที่ root node แรกซึ่งอาจไม่ใช่ <header>
    // เสมอไป (ขึ้นกับว่า v-if ตัวไหนก่อนหน้าเป็น true/false ตอนนั้น) — querySelector('header') ชัวร์กว่าเพราะเจาะจาก tag ตรงๆ
    // เรียก updateNavHeight() ทันทีก่อน 1 ครั้งด้วย (เผื่อ browser/สถานการณ์ที่ ResizeObserver ยิง callback แรกช้า) — ResizeObserver จะแก้ค่าให้ถูกต้องอีกทีถ้าค่านี้ยังผิดอยู่
    this.updateNavHeight();
    this.navHeightObserver = new ResizeObserver(() => this.updateNavHeight());
    this.navHeightObserver.observe(document.querySelector('header'));
  },
  unmounted() {
    this.navHeightObserver?.disconnect();
  },
  methods: {
    updateNavHeight() {
      this.navHeight = document.querySelector('header')?.offsetHeight || 0;
    },
    ...SharedMethods,

    // override SharedMethods.closeModal เฉพาะหน้านี้: ถ้ากำลังดู quotation-detail (เปิดทับ modal เดิมไว้) ให้ย้อนกลับไป modal ก่อนหน้าแทนที่จะปิดหมด
    closeModal() {
      if (this.modal.type === 'quotation-detail' && this.previousModal) {
        this.modal = this.previousModal;
        this.previousModal = null;
      } else {
        this.modal = { type: null, data: null };
        this.previousModal = null;
      }
    },

    esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); },

    /** เลยกำหนดยื่นซอง (close_date) จริง เฉพาะงานที่ "ยังไม่ตัดสินผล" เท่านั้น — งานที่ชนะ/แพ้/ส่งมอบ/ยกเลิกไปแล้ว
        ไม่ถือว่า "เกินกำหนด" อีกต่อไป แม้ close_date จะผ่านไปแล้วก็ตาม เพราะไม่ใช่ปัญหาที่ต้องรีบทำอะไรต่อ (ยืนยันจากผู้ใช้ 2026-09-19) */
    isCloseOverdue(card) {
      if (['ชนะการประมูล', 'ส่งมอบแล้ว', 'แพ้การประมูล', 'ยกเลิก'].includes(card.status)) return false;
      return this.daysToClose(card.close_date) < 0;
    },

    // รหัสสถานะใบเสนอราคาเก่า (StatusQuotation จากระบบ SalesManagement) — ยืนยันความหมายจากผู้ใช้ 2026-09-17
    // รหัสอื่นนอกเหนือจากนี้ยังไม่ทราบความหมาย แสดงโค้ดดิบแทนการเดา
    quotationStatusLabel(code) {
      const map = { '0': 'ฉบับร่าง/ร่างแก้ไข Rev.', '1': 'บันทึกจริง', '2': 'ยืนยันแล้ว', '3': 'ยกเลิก' };
      return map[String(code)] || `รหัส ${code}`;
    },
    quotationStatusBadge(code) {
      const map = { '0': 'bg-slate-100 text-slate-600', '1': 'bg-sky-100 text-sky-700', '2': 'bg-emerald-100 text-emerald-700', '3': 'bg-rose-100 text-rose-700' };
      return map[String(code)] || 'bg-yellow-100 text-yellow-700';
    },

    // custom dropdown ตัวกรอง Sales/ช่วงเวลาที่หัวข้อ — แทน <select> เดิม (ยืนยันจากผู้ใช้ 2026-09-20)
    selectSale(id) {
      this.filter.assigned_to = id;
      this.openFilterDropdown = null;
      this.loadData();
    },
    selectPeriod(value) {
      this.filter.period = value;
      this.openFilterDropdown = null;
      this.loadData();
    },
    selectSort(value) {
      this.sortBy = value;
      this.openFilterDropdown = null;
    },
    // เรียงลำดับ (ไม่แก้ array เดิม) — ใช้ร่วมกันทั้ง Kanban/การ์ด ส่วนตาราง (DataTables) ใช้ tableSortOrder แยกต่างหาก (ยืนยันจากผู้ใช้ 2026-09-20)
    sortCards(arr) {
      const key = this.sortBy;
      return [...arr].sort((a, b) => {
        if (key === 'close_asc' || key === 'close_desc') {
          const da = a.close_date ? new Date(a.close_date).getTime() : Infinity;
          const db = b.close_date ? new Date(b.close_date).getTime() : Infinity;
          return key === 'close_asc' ? da - db : db - da;
        }
        const pa = parseFloat(a.price_median || 0);
        const pb = parseFloat(b.price_median || 0);
        return key === 'price_desc' ? pb - pa : pa - pb;
      });
    },

    // เลือกแท็บสถานะ ('all' หรือ stage.key) — ใช้ร่วมกันทั้ง Kanban/การ์ด/ตาราง (ยืนยันจากผู้ใช้ 2026-09-19)
    selectStatusTab(key) {
      this.activeStatusTab = key;
      if ($.fn.dataTable.isDataTable('#bidPipelineTable')) $('#bidPipelineTable').DataTable().draw();
    },

    /** ผูก event คลิกแถว "ครั้งเดียว" ตอน mounted ด้วย delegated listener บน #bidPipelineTable (element แม่ที่ DataTables ไม่ทำลายทิ้งตอน destroy:true) */
    bindTableEvents() {
      const self = this;
      $('#bidPipelineTable').on('click', 'tbody tr', function () {
        const card = $('#bidPipelineTable').DataTable().row(this).data();
        if (card) self.openDetail(card.id);
      });
    },

    /** สร้าง/รีเซ็ต DataTable ใหม่ทุกครั้งที่ tableData เปลี่ยน (โหลดข้อมูล/เปลี่ยนตัวกรอง) — ใช้ destroy:true กันเวลา init ซ้ำ error
        คอลัมน์ render เป็น HTML string ล้วน เพราะ DataTables วาด DOM เอง ไม่ผ่าน Vue template */
    initDataTable() {
      const self = this;
      const columns = [
        {
          data: null, title: 'ชื่อโครงการ',
          render: (d, type, card) => {
            let html = '<div class="flex items-center gap-1.5 mb-0.5 flex-wrap">';
            if (card.project_code) html += `<span class="text-[.65rem] font-mono font-bold text-purple-700 bg-purple-50 rounded px-1.5 py-0.5">${self.esc(card.project_code)}</span>`;
            html += `<span class="text-[.68rem] text-slate-400 font-mono">${self.esc(card.project_no)}</span></div>`;
            html += `<div class="font-semibold text-sm leading-snug text-slate-800">${self.esc(card.project_name)}</div>`;
            return html;
          },
        },
        { data: 'unit_name', title: 'หน่วยงาน', render: d => `<span class="text-xs text-slate-500">${self.esc(d)}</span>` },
      ];
      if (self.isManager) {
        columns.push({
          data: null, title: 'พนักงานขาย', orderable: false,
          render: (d, type, card) => {
            const avatar = card.sale_photo_url
              ? `<img src="${self.esc(card.sale_photo_url)}" class="w-6 h-6 rounded-full object-cover"/>`
              : `<div class="w-6 h-6 rounded-full flex items-center justify-center text-white text-[.65rem] font-bold" style="background:${card.sale_color||'#64748b'}">${self.esc(self.avatarInitials(card.sale_name))}</div>`;
            return `<div class="flex items-center gap-1.5">${avatar}<span class="text-xs text-slate-600">${self.esc((card.sale_name||'').split(' ')[0])}</span></div>`;
          },
        });
      }
      columns.push(
        {
          data: 'price_median', title: 'ราคากลาง', className: 'text-right',
          // type !== 'display' (เช่นตอนเรียงลำดับ/ค้นหา) ต้องคืนค่าตัวเลขดิบ ไม่ใช่ HTML string — ไม่งั้นเรียงลำดับผิด (เทียบ string แทนตัวเลขจริง)
          render: (d, type) => {
            if (type !== 'display') return d || 0;
            return d ? `<span class="font-semibold text-emerald-600 text-sm">฿${self.formatNumber(d)}</span>` : '<span class="text-slate-300">-</span>';
          },
        },
        {
          data: null, title: 'วันปิดรับ', className: 'text-center',
          // type !== 'display' ต้องคืนค่า close_date ดิบ ไม่ใช่ข้อความไทยที่ format แล้ว — ไม่งั้นเรียงลำดับตามตัวอักษรผิดลำดับวันที่จริง
          render: (d, type, card) => {
            if (type !== 'display') return card.close_date || '';
            const days = self.daysToClose(card.close_date);
            return `<span class="text-xs" style="color:${self.countdownColor(days)};font-weight:${days<=3?'700':'400'}">${self.esc(self.formatDateThai(card.close_date))}</span>`;
          },
        },
        {
          data: 'priority', title: 'ความสำคัญ', className: 'text-center', orderable: false,
          render: d => `<span class="inline-flex items-center px-1.5 py-0.5 rounded-full text-[11px] font-bold ${self.priorityBadge(d)}">${self.esc(d)}</span>`,
        },
        {
          data: 'status', title: 'สถานะ', orderable: false,
          render: d => `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold ${self.statusBadge(d)}">${self.esc(d)}</span>`,
        },
        {
          data: null, title: 'หมายเหตุ', orderable: false,
          render: (d, type, card) => {
            if (card.win_loss_reason) {
              const cls = ['ชนะการประมูล','ส่งมอบแล้ว'].includes(card.status) ? 'text-emerald-600' : 'text-rose-500';
              return `<span class="text-xs ${cls}">${self.esc(card.win_loss_reason)}</span>`;
            }
            if (card.status === 'รอประกาศผล') return `<span class="text-xs text-violet-500">⏳ รอผล</span>`;
            return `<span class="text-xs text-slate-300">—</span>`;
          },
        },
      );

      $('#bidPipelineTable').DataTable({
        data: this.tableData,
        destroy: true,
        autoWidth: false,
        order: [this.tableSortOrder], // เรียงลำดับตาม "เรียงตาม" ที่เลือกไว้ — คลิกหัวคอลัมน์เองทีหลังยังทำงานได้ปกติ (ยืนยันจากผู้ใช้ 2026-09-20)
        language: {
          search: 'ค้นหา:',
          lengthMenu: 'แสดง _MENU_ รายการ',
          info: 'แสดง _START_ ถึง _END_ จาก _TOTAL_ รายการ',
          infoEmpty: 'ไม่มีข้อมูล',
          infoFiltered: '(กรองจาก _MAX_ รายการทั้งหมด)',
          zeroRecords: 'ไม่มีข้อมูล',
          paginate: { previous: 'ก่อนหน้า', next: 'ถัดไป' },
        },
        columns,
      });
    },

    async loadData() {
      this.loading = true;
      const q = new URLSearchParams({ action: 'kanban' });
      if (this.filter.assigned_to) q.set('assigned_to', this.filter.assigned_to);
      if (this.filter.period && this.filter.period !== 'all') q.set('period', this.filter.period);
      if (this.filter.priority)      q.set('priority', this.filter.priority);
      if (this.filter.sla_status)    q.set('sla_status', this.filter.sla_status);
      if (this.filter.unit_name)     q.set('unit_name', this.filter.unit_name.trim());
      if (this.filter.announce_date) q.set('announce_date', this.filter.announce_date);
      if (this.filter.close_date)    q.set('close_date', this.filter.close_date);
      if (this.filter.price_min)     q.set('price_min', this.filter.price_min);
      if (this.filter.price_max)     q.set('price_max', this.filter.price_max);
      try {
        const res = await apiCall('GET', `api/assignments.php?${q}`);
        if (res.success) {
          this.kanban  = res.data.kanban  || {};
          this.stats   = res.data.stats   || {};
          this.perSale = res.data.per_sale || [];
        }
      } catch {}
      this.loading = false;
      await this.$nextTick();
      this.initDataTable();
    },

    // export ตามลำดับ/ตัวกรองที่ DataTables แสดงอยู่ตอนนี้ (search:'applied') ไม่ใช่ข้อมูลดิบทั้งหมดเสมอไป — เหมือน sources.html/calendars.html
    exportTable() {
      const headers = ['รหัสงาน', 'เลขที่โครงการ', 'ชื่อโครงการ', 'หน่วยงาน'];
      if (this.isManager) headers.push('Sales');
      headers.push('ราคากลาง', 'วันปิดรับ', 'Priority', 'Stage', 'หมายเหตุ');

      const cards = $('#bidPipelineTable').DataTable().rows({ search: 'applied' }).data().toArray();
      const rows = cards.map(card => {
        let noteText = '—';
        if (card.win_loss_reason) noteText = card.win_loss_reason;
        else if (card.status === 'รอประกาศผล') noteText = 'รอผล';
        const row = [card.project_code || '', card.project_no, card.project_name, card.unit_name];
        if (this.isManager) row.push(card.sale_name || '');
        row.push(
          card.price_median ? Number(card.price_median) : '',
          card.close_date ? this.formatDateThai(card.close_date) : '',
          card.priority,
          card.status,
          noteText,
        );
        return row;
      });
      this.exportExcel('งานประมูล', headers, rows);
    },

    async saveUnitName() {
      const name = this.unitNameDraft.trim();
      if (!name) { await this.showAlert('กรุณาระบุชื่อหน่วยงาน', 'error'); return; }
      if (!this.unitTypeDraft) { await this.showAlert('กรุณาระบุประเภทหน่วยงาน', 'error'); return; }
      // เตือนก่อนถ้าเจอชื่อคล้ายกันอยู่แล้ว (ยกเว้นตรงเป๊ะ — กรณีนั้นจะถูกใช้ซ้ำอัตโนมัติอยู่แล้วโดย findOrCreateAccount ไม่ต้องเตือน)
      // (ยืนยันจากผู้ใช้ 2026-09-22)
      const dup = await apiCall('GET', 'api/accounts.php?action=check_duplicate&q=' + encodeURIComponent(name));
      if (dup.success && dup.data.length && !dup.data.some(a => a.name === name)) {
        const names = dup.data.map(a => a.name).join(', ');
        const ok = await this.showConfirm('พบชื่อคล้ายกัน', `พบหน่วยงาน/บริษัทที่ชื่อคล้ายกันอยู่แล้ว: ${names} — ต้องการบันทึกชื่อนี้จริงหรือไม่?`, 'บันทึก');
        if (!ok) return;
      }
      this.savingUnitName = true;
      const res = await apiCall('POST', 'api/announcements.php?action=update_unit_name', {
        announcement_id: this.modal.data.announcement_id,
        unit_name: name,
        account_type: this.unitTypeDraft,
      });
      this.savingUnitName = false;
      if (res.success) {
        this.modal.data.unit_name = name;
        this.modal.data.account_type = this.unitTypeDraft;
        this.editingUnitName = false;
        await this.showAlert('บันทึกชื่อหน่วยงานสำเร็จ', 'success');
      } else {
        await this.showAlert(res.message || 'เกิดข้อผิดพลาด', 'error');
      }
    },

    // ช่องค้นหาด่วน — กรอง client-side ทับข้อมูลที่กรองไว้แล้ว (Sales/ช่วงเวลา/ตัวกรองเพิ่มเติม/แสดงงานปิด/แท็บสถานะ) อีกชั้นเดียว
    // ค้นได้ 4 ฟิลด์: ชื่อโครงการ, ชื่อหน่วยงาน, รหัสงานกลาง, เลขที่โครงการ e-GP (ยืนยันจากผู้ใช้ 2026-09-20)
    matchesSearch(card) {
      const q = this.filter.search.trim().toLowerCase();
      if (!q) return true;
      return [card.project_name, card.unit_name, card.project_code, card.project_no]
        .some(v => (v || '').toLowerCase().includes(q));
    },

    // การ์ดของสถานะหนึ่งๆ หลังกรองด้วยช่องค้นหาแล้ว — ใช้แทน kanban[key] ตรงๆ ทุกจุดในมุมมอง Kanban (นับจำนวน/แสดงมูลค่า/แสดงการ์ด)
    stageCards(key) {
      return this.sortCards((this.kanban[key] || []).filter(c => this.matchesSearch(c)));
    },

    stageValue(key) {
      const total = this.stageCards(key).reduce((s, c) => s + parseFloat(c.price_median || 0), 0);
      return this.formatValueShort(total);
    },

    // สถานะที่ยังไม่มีงาน (0 งาน หลังกรองค้นหาแล้ว) ย่อเป็นแถบแคบอัตโนมัติเสมอ จนกว่าผู้ใช้จะกดขยายเอง (เก็บไว้ใน expandedEmptyStages)
    isStageCollapsed(stage) {
      // ถ้าเลือกแท็บสถานะนี้ตรงๆ (โฟกัสคอลัมน์เดียวเต็มความกว้าง) ต้องไม่ย่อ แม้จะยังไม่มีงานเลยก็ตาม
      if (this.activeStatusTab === stage.key) return false;
      return this.stageCards(stage.key).length === 0 && !this.expandedEmptyStages[stage.key];
    },
    toggleStageExpand(key) {
      this.expandedEmptyStages[key] = !this.expandedEmptyStages[key];
    },

    formatValueShort(total) {
      if (!total) return '';
      return '฿' + Math.round(total).toLocaleString('th-TH');
    },

    formatDelta(v) {
      if (!v) return '0';
      const abs = this.formatValueShort(Math.abs(v)) || ('฿' + Math.abs(v).toLocaleString('th-TH'));
      return (v > 0 ? '+' : '-') + abs;
    },

    canMove(status) {
      return ['รับงาน/ศึกษา TOR','จัดเตรียมยื่นข้อเสนอ','รอประกาศผล','ชนะการประมูล'].includes(status);
    },
    nextStage(status) { return NEXT_MAP[status] || null; },
    prevStage(status) { return PREV_MAP[status] || null; },

    async moveCard(card, newStatus) {
      const res = await apiCall('POST', 'api/assignments.php?action=update', { id: card.id, status: newStatus });
      if (res.success) {
        this.loadData();
        await this.showAlert('ย้ายสถานะสำเร็จ', 'success');
      } else {
        await this.showAlert(res.message || 'เกิดข้อผิดพลาด', 'error');
      }
    },

    // เปิด modal แสดงรายละเอียดใบเสนอราคาเก่า (header + รายการสินค้า) ให้ sale ดู — เรียกจากลิงก์เลขที่ใบใน "บันทึก Sale" ของ Detail Modal
    // ใช้ modal.type/modal.data ตัวเดียวกับ modal อื่นในหน้านี้ (เหมือน win-loss) กด "ปิด" แล้วจบเลย ไม่ย้อนกลับไป Detail Modal เดิม
    async openQuotationDetail(quotationId) {
      this.quotationDetailLoading = true;
      try {
        const res = await apiCall('GET', `api/quotation_import.php?action=detail&id=${encodeURIComponent(quotationId)}`);
        if (res.success) {
          this.previousModal = { type: this.modal.type, data: this.modal.data };
          this.modal = { type: 'quotation-detail', data: res.data };
        } else {
          this.showAlert(res.message || 'ไม่สามารถโหลดใบเสนอราคานี้ได้', 'error');
        }
      } catch {
        this.showAlert('เกิดข้อผิดพลาดในการโหลดใบเสนอราคา', 'error');
      } finally {
        this.quotationDetailLoading = false;
      }
    },

    openWinLoss(card, newStatus) {
      this.winLossForm = { id: card.id, newStatus, reason: '', note: '', bid_amount: card.bid_amount || null };
      this.modal = { type: 'win-loss', data: card };
    },

    async submitWinLoss() {
      if (!this.winLossForm.reason) { await this.showAlert('กรุณาเลือกเหตุผล', 'error'); return; }
      const payload = {
        id:              this.winLossForm.id,
        status:          this.winLossForm.newStatus,
        win_loss_reason: this.winLossForm.reason,
        win_loss_note:   this.winLossForm.note,
      };
      if (this.winLossForm.bid_amount) payload.bid_amount = this.winLossForm.bid_amount;
      const res = await apiCall('POST', 'api/assignments.php?action=update', payload);
      if (res.success) {
        this.closeModal();
        this.loadData();
        await this.showAlert('บันทึกผลสำเร็จ', 'success');
      } else {
        await this.showAlert(res.message || 'เกิดข้อผิดพลาด', 'error');
      }
    },

  },
}).mount('#app');
</script>
</body>
</html>
