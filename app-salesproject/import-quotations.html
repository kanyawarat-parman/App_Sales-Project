<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>นำเข้าใบเสนอราคาเก่า</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="shared/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css?v=16">
</head>
<body class="bg-slate-50 font-sans">
<div id="app">
  <div v-if="!authReady" class="min-h-screen flex items-center justify-center">
    <div class="spinner w-12 h-12"></div>
  </div>

  <template v-else>
    <app-nav :user="currentUser" page="import-quotations" ref="nav"></app-nav>

    <div class="min-h-screen flex flex-col">
      <header class="bg-white border-b border-slate-100 px-5 py-3 flex items-center gap-3 shadow-sm min-h-[64px]">
        <h1 class="text-base font-bold text-slate-700 flex items-center gap-2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/>
          </svg>
          นำเข้าใบเสนอราคาเก่า
        </h1>
        <button @click="loadQuotations"
          class="ml-auto p-2 rounded-lg hover:bg-slate-100 text-slate-400 hover:text-slate-600 border-0 bg-transparent cursor-pointer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>
          </svg>
        </button>
      </header>

      <main class="flex-1 w-full max-w-[900px] mx-auto px-4 py-5">
        <div class="mb-4 text-sm bg-blue-50 text-blue-800 rounded-xl px-4 py-3">
          ใบเสนอราคาเก่า (ม.ค.-ส.ค. 69) จากระบบบัญชีเดิม — ดูรายละเอียดแต่ละใบแล้วเลือกว่าเป็น
          <strong>"งานประมูล"</strong> หรือ <strong>"งานขายตรง"</strong> พร้อมเลือกสถานะ เพื่อบันทึกเข้าระบบเป็นประวัติงานขาย
        </div>

        <div v-if="loading" class="text-center py-16 text-slate-400">
          <div class="spinner w-10 h-10 mx-auto mb-2"></div>
          กำลังโหลด...
        </div>

        <div v-else-if="!quotations.length" class="text-center py-16 text-slate-400">
          <div class="text-5xl mb-3">✅</div>
          <p class="text-sm">ไม่มีใบเสนอราคาที่รอนำเข้าแล้ว</p>
        </div>

        <div v-else class="flex flex-col gap-3">
          <div class="text-xs text-slate-400 font-semibold px-1">เหลือ {{ quotations.length }} ใบที่ยังไม่ได้นำเข้า</div>
          <div v-for="q in quotations" :key="q.quotation_id"
            class="bg-white rounded-xl shadow-sm ring-1 ring-slate-100 p-4 hover:shadow-md transition-shadow cursor-pointer"
            @click="openDetail(q.quotation_id)">
            <div class="flex items-start justify-between gap-3">
              <div class="flex-1 min-w-0">
                <p class="text-[11px] text-slate-400 font-mono mb-0.5">{{ q.quotation_id }} · {{ formatDateThai(q.quotation_date) }}</p>
                <h4 class="font-bold text-slate-800 text-sm mb-0.5 line-clamp-2">{{ q.project_name || q.customer_name }}</h4>
                <p class="text-xs text-slate-400">{{ q.customer_name }}</p>
              </div>
              <div class="text-right shrink-0">
                <div class="text-sm font-bold text-green-700">{{ formatPrice(q.net_amount) }}</div>
                <button class="mt-1.5 inline-flex items-center px-3 py-1.5 rounded-lg text-xs font-semibold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer">
                  ตรวจสอบ
                </button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <app-modal ref="appModal"></app-modal>

    <!-- Detail + Import Modal -->
    <div class="fixed inset-0 bg-black/50 flex items-start justify-center z-[1000] p-4 overflow-y-auto"
      v-if="modal.type==='detail'" @click.self="closeModal">
      <div class="bg-white rounded-2xl w-full max-w-[560px] shadow-2xl overflow-hidden my-8">
        <div class="bg-teal-600 text-white px-6 py-5 flex items-center justify-between">
          <div>
            <h3 class="font-bold text-lg">รายละเอียดใบเสนอราคา</h3>
            <p class="text-sm font-mono font-bold text-amber-300 mt-1">{{ modal.data?.quotation_id }}</p>
          </div>
          <button class="text-white/80 hover:text-white bg-transparent border-0 text-2xl cursor-pointer leading-none" @click="closeModal">×</button>
        </div>

        <div v-if="detailLoading" class="p-8 text-center text-slate-400">
          <div class="spinner w-8 h-8 mx-auto mb-2"></div>
          กำลังโหลด...
        </div>

        <template v-else-if="modal.data">
          <div class="p-5 overflow-y-auto max-h-[calc(100vh-320px)]">
            <div class="flex gap-2 py-1.5 border-b border-slate-50"><span class="text-sm text-slate-400 min-w-[110px] shrink-0">วันที่</span><span class="text-sm text-slate-700">{{ formatDateThai(modal.data.quotation_date) }}</span></div>
            <div class="flex gap-2 py-1.5 border-b border-slate-50"><span class="text-sm text-slate-400 min-w-[110px] shrink-0">ลูกค้า</span><span class="text-sm font-semibold text-slate-700">{{ modal.data.customer_name }}</span></div>
            <div v-if="modal.data.project_name" class="flex gap-2 py-1.5 border-b border-slate-50"><span class="text-sm text-slate-400 min-w-[110px] shrink-0">ชื่อโครงการ</span><span class="text-sm text-slate-700">{{ modal.data.project_name }}</span></div>
            <div class="flex gap-2 py-1.5 border-b border-slate-50"><span class="text-sm text-slate-400 min-w-[110px] shrink-0">มูลค่า</span><span class="text-sm font-bold text-green-700">{{ formatPrice(modal.data.net_amount) }}</span></div>

            <div v-if="modal.data.items?.length" class="mt-3">
              <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2">รายการสินค้า</div>
              <div class="rounded-lg bg-slate-50 p-3 max-h-[160px] overflow-y-auto">
                <div v-for="(it, i) in modal.data.items" :key="i" class="py-1.5" :class="i>0 ? 'border-t border-slate-200' : ''">
                  <div class="text-sm text-slate-700">{{ it.product_descp }}</div>
                  <div class="text-xs text-slate-500">{{ it.quantity }} {{ it.unit_name }} × {{ formatNum(it.unit_price) }} บาท</div>
                </div>
              </div>
            </div>

            <div class="mt-4">
              <label class="block text-sm font-semibold text-slate-600 mb-1">เป็นงานประเภทไหน? <span class="text-red-500">*</span></label>
              <p class="text-xs text-amber-600 mb-2">ระบบแนะนำให้ล่วงหน้าจากชื่อลูกค้า — กรุณาตรวจสอบและแก้ไขได้ถ้าไม่ตรง</p>
              <div class="flex gap-3">
                <label class="flex items-center gap-2 cursor-pointer flex-1 border rounded-xl p-3 transition-colors"
                       :class="importForm.source_type==='ebidding' ? 'border-teal-500 bg-teal-50' : 'border-slate-200'">
                  <input type="radio" v-model="importForm.source_type" value="ebidding" class="accent-teal-500" @change="importForm.stage=''">
                  <span class="text-sm font-medium text-slate-700">งานประมูล</span>
                </label>
                <!-- งานขายตรง — ปิดใช้งานชั่วคราวตามที่ผู้ใช้แจ้ง 2026-09-09 (เอางานประมูลขึ้นก่อน) เอา disabled ออกทีหลังได้เลยตอนพร้อมเปิด -->
                <label class="flex items-center gap-2 flex-1 border rounded-xl p-3 opacity-50 cursor-not-allowed border-slate-200">
                  <input type="radio" value="self_sourced" class="accent-teal-500" disabled>
                  <span class="text-sm font-medium text-slate-500">งานขายตรง <span class="text-[11px]">(ยังไม่เปิดใช้งาน)</span></span>
                </label>
              </div>
            </div>

            <div class="mt-4" v-if="importForm.source_type">
              <label class="block text-sm font-semibold text-slate-600 mb-1">สถานะงาน <span class="text-red-500">*</span></label>
              <select v-model="importForm.stage" class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
                <option value="">— เลือกสถานะ —</option>
                <option v-for="opt in stageOptions" :key="opt.key" :value="opt.key">{{ opt.label }}</option>
              </select>
            </div>
          </div>

          <div class="px-5 py-4 border-t border-slate-100 flex items-center justify-end gap-2">
            <button class="px-4 py-2 rounded-xl text-sm font-semibold bg-white ring-1 ring-slate-200 text-slate-600 border-0 cursor-pointer" @click="closeModal">ยกเลิก</button>
            <button class="px-4 py-2 rounded-xl text-sm font-semibold border-0 text-white"
              :class="(!importForm.source_type || !importForm.stage) ? 'bg-slate-300 cursor-not-allowed' : 'bg-teal-700 hover:bg-teal-800 cursor-pointer'"
              :disabled="!importForm.source_type || !importForm.stage || importing"
              @click="submitImport">{{ importing ? 'กำลังบันทึก...' : 'นำเข้า' }}</button>
          </div>
        </template>
      </div>
    </div>
  </template>
</div>

<script src="shared/vue.global.prod.js"></script>
<script src="shared/app.js?v=33"></script>
<script>
const { createApp } = Vue;
createApp({
  components: { AppNav, AppModal },
  data() {
    return {
      authReady: false,
      currentUser: null,
      loading: false,
      detailLoading: false,
      importing: false,
      quotations: [],
      modal: { type: null, data: null },
      importForm: { quotation_id: null, source_type: '', stage: '' },
    };
  },
  async mounted() {
    try {
      const res = await apiCall('GET', 'api/auth.php?action=me');
      if (!res.success) { window.location.href = 'login.html'; return; }
      this.currentUser = res.data;
      if (!['admin', 'salesadmin', 'sale'].includes(this.currentUser.role)) { window.location.href = 'dashboard.html'; return; }
    } catch { window.location.href = 'login.html'; return; }
    this.authReady = true;
    await this.loadQuotations();
  },
  computed: {
    // งานประมูล = สถานะจริงของ project_assignments.status (ไม่ใช่ pipeline_items.stage อีกต่อไป — เพราะใบเก่าที่เลือก
    // "งานประมูล" จะไปสร้างที่ announcements/project_assignments จริง ให้โผล่ที่ bid-pipeline.html ถูกที่)
    // งานขายตรง = ป้ายสถานะเดียวกับที่ sales-pipeline.html ใช้จริง (spStages()) ยังเข้า pipeline_items เหมือนเดิม
    stageOptions() {
      if (this.importForm.source_type === 'ebidding') {
        return [
          { key: 'รับงาน/ศึกษา TOR',      label: 'รับงาน / ศึกษา TOR' },
          { key: 'จัดเตรียมยื่นข้อเสนอ',  label: 'จัดเตรียมยื่นข้อเสนอ' },
          { key: 'รอประกาศผล',            label: '⏳ รอประกาศผล' },
          { key: 'ชนะการประมูล',          label: 'ชนะการประมูล' },
          { key: 'ส่งมอบแล้ว',            label: 'ส่งมอบแล้ว' },
          { key: 'แพ้การประมูล',          label: 'แพ้การประมูล' },
          { key: 'ยกเลิก',                label: 'ยกเลิก' },
        ];
      }
      return [
        { key: 'Interest',    label: 'สนใจ / ติดต่อ' },
        { key: 'Send PI',     label: 'ส่ง PI / ใบเสนอราคา' },
        { key: 'Negotiating', label: 'ต่อรอง / เจรจา' },
        { key: 'Deal Signed', label: 'ปิดดีลแล้ว' },
        { key: 'Delivered',   label: 'ส่งมอบแล้ว' },
        { key: 'Lost',        label: 'ไม่สำเร็จ' },
      ];
    },
  },
  methods: {
    ...SharedMethods,

    async loadQuotations() {
      this.loading = true;
      const res = await apiCall('GET', 'api/quotation_import.php?action=list');
      if (res.success) this.quotations = res.data;
      this.loading = false;
    },

    async openDetail(id) {
      this.modal = { type: 'detail', data: null };
      this.detailLoading = true;
      this.importForm = { quotation_id: id, source_type: '', stage: '' };
      const res = await apiCall('GET', `api/quotation_import.php?action=detail&id=${encodeURIComponent(id)}`);
      this.detailLoading = false;
      if (res.success) {
        this.modal = { type: 'detail', data: res.data };
        // พรีเซ็ตให้ล่วงหน้าตามเงื่อนไขที่ sale แจ้งมา (ยืนยัน 2026-09-09): ลูกค้าเป็น
        // "บริษัท ไอคอน สตีล โปรดัคท์ จำกัด" = งานประมูล เสมอ และมีใบเสนอราคาออกมาแล้วแปลว่าชนะประมูลมาแล้วเสมอ
        // (ลูกค้ารายนี้จะมาขอใบเสนอราคาจากเราก็ต่อเมื่อชนะประมูลแล้วเท่านั้น) ลูกค้าอื่นนอกจากนี้ = งานขายตรง (ไม่พรีเซ็ตสถานะ)
        // sale ยังต้องกดยืนยัน/แก้ไขเองได้เสมอ ไม่ได้ตัดสินใจแทน แค่ช่วยเดาไว้ล่วงหน้าให้เร็วขึ้น
        // งานขายตรงปิดใช้งานชั่วคราว (ดูจุด disabled ในเทมเพลตด้านบน) เลยพรีเซ็ตเป็นงานประมูลไว้ก่อนเสมอตอนนี้
        // ลบเงื่อนไข isIcon ? ... : 'self_sourced' นี้ทิ้งตอนเปิดงานขายตรงกลับมาใช้งาน
        const isIcon = (res.data.customer_name || '').includes('ไอคอน สตีล โปรดัคท์');
        this.importForm.source_type = 'ebidding';
        this.importForm.stage = isIcon ? 'ชนะการประมูล' : '';
      } else {
        await this.showAlert(res.message || 'โหลดข้อมูลไม่สำเร็จ', 'error');
        this.closeModal();
      }
    },

    async submitImport() {
      this.importing = true;
      const res = await apiCall('POST', 'api/quotation_import.php?action=import', this.importForm);
      this.importing = false;
      if (res.success) {
        this.closeModal();
        await this.loadQuotations();
        await this.showAlert('นำเข้าสำเร็จ — รหัสงาน ' + res.data.project_code, 'success');
      } else {
        await this.showAlert(res.message || 'นำเข้าไม่สำเร็จ', 'error');
      }
    },
  },
}).mount('#app');
</script>
</body>
</html>
