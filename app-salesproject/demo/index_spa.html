    spSourceStyle(type) {
      const m = {
        'ebidding':       'background:#dbeafe;color:#1d4ed8',
        'purchased_data': 'background:#fed7aa;color:#c2410c',
        'self_prospect':  'background:#dcfce7;color:#15803d',
      };
      return m[type] || 'background:#f1f5f9;color:#475569';
    },

    spPriorityStyle(p) {
      if (p === 'High')   return 'background:#fee2e2;color:#b91c1c';
      if (p === 'Medium') return 'background:#fef3c7;color:#b45309';
      return 'background:#f0fdf4;color:#166534';
    },

    spStageStyle(stage) {
      const m = {
        'Interest':    'background:#f1f5f9;color:#475569',
        'Send PI':     'background:#cffafe;color:#0e7490',
        'Negotiating': 'background:#ede9fe;color:#6d28d9',
        'Deal Signed': 'background:#dcfce7;color:#15803d',
        'Delivered':   'background:#d1fae5;color:#065f46',
        'Lost':        'background:#fee2e2;color:#b91c1c',
      };
      return m[stage] || 'background:#f1f5f9;color:#475569';
    },

    /* ==================== HELPERS ==================== */
    async api(method, url, body = null) {
      const opts = { method, headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin' };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(url, opts);
      if (res.status === 401) { this.currentUser = null; return { success: false, message: 'Session หมดอายุ' }; }
      return res.json();
    },

    showToast(msg, type = 'info') {
      this.toast = { msg, type };
      setTimeout(() => { this.toast = null; }, 4000);
    },

    formatPrice(v) {
      if (!v) return '-';
      return Number(v).toLocaleString('th-TH') + ' บาท';
    },

    formatDateTime(v) {
      if (!v) return '-';
      const d = new Date(v.replace(' ', 'T'));
      return d.toLocaleString('th-TH', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
    },

    daysToClose(closeDate) {
      if (!closeDate) return null;
      const today = new Date(); today.setHours(0,0,0,0);
      const close = new Date(closeDate); close.setHours(0,0,0,0);
      return Math.ceil((close - today) / 86400000);
    },

    countdownColor(days) {
      if (days === null) return '#94a3b8';
      if (days < 0)  return '#dc2626';
      if (days === 0) return '#dc2626';
      if (days <= 2)  return '#ea580c';
      if (days <= 5)  return '#ca8a04';
      return '#16a34a';
    },

    countdownText(days) {
      if (days === null) return '';
      if (days < 0)  return `เกินกำหนด ${Math.abs(days)} วัน`;
      if (days === 0) return '⚠ ปิดรับวันนี้!';
      if (days === 1) return '⚠ พรุ่งนี้ปิดรับ';
      return `เหลือ ${days} วัน`;
    },

    countdownBarWidth(closeDate, assignedAt) {
      if (!closeDate || !assignedAt) return 50;
      const start = new Date(assignedAt.replace(' ','T'));
      const end   = new Date(closeDate); end.setHours(17,0,0,0);
      const now   = new Date();
      const total = end - start;
      if (total <= 0) return 100;
      const pct   = Math.round(((now - start) / total) * 100);
      return Math.min(Math.max(pct, 2), 100);
    },

    slaClass(s) {
      return s === 'เกิน' ? 'text-red-600 font-bold' : s === 'ใกล้ถึง' ? 'text-amber-600 font-semibold' : 'text-green-600';
    },

    statusBadge(s) {
      const m = {
        'รอดำเนินการ':'bg-gray-100 text-gray-700',
        'กำลังดำเนินการ':'bg-blue-100 text-blue-700',
        'ยื่นข้อเสนอแล้ว':'bg-purple-100 text-purple-700',
        'ชนะ':'bg-green-100 text-green-700',
        'แพ้':'bg-red-100 text-red-700',
        'ยกเลิก':'bg-gray-200 text-gray-500',
      };
      return m[s] || 'bg-gray-100 text-gray-600';
    },

    priorityBadge(p) {
      return p==='เร่งด่วน' ? 'bg-red-100 text-red-700' : p==='ปกติ' ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-600';
    },

    canBidBadge(v) {
      return v==='ได้' ? 'bg-green-100 text-green-700' : v==='ไม่ได้' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700';
    },

    avatarInitials(name) {
      if (!name) return '?';
      const parts = name.trim().split(' ');
      return parts.length >= 2 ? parts[0][0] + parts[1][0] : name.substring(0, 2);
    },
  },

  mounted() {
    // Expose to global for DataTables callbacks
    window.appVue = this;
    this.checkAuth();
  },
});

app.mount('#app');
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .catch(() => {});
  });
}
</script>
</body>
</html>
