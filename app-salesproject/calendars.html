<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ปฏิทินการทำงาน</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="shared/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css?v=16">
<!-- DataTables (ใช้เฉพาะหน้านี้ — jQuery plugin ควบคุมตารางแยกจาก Vue โดยเจตนา) -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<style>
  /* ปรับสไตล์ DataTables default ให้เข้ากับโทน Tailwind ของระบบ (rounded, teal accent) + จัด layout ให้ responsive บนมือถือ
     (DataTables ปกติใช้ float ซึ่งบิดเบี้ยวง่ายบนจอแคบ เปลี่ยนเป็น flex ที่ห่อบรรทัดได้เอง) */
  #calendarsTable_wrapper { padding: 0 1rem 1rem; }
  #calendarsTable_wrapper .dataTables_length,
  #calendarsTable_wrapper .dataTables_filter { float: none; margin-bottom: .75rem; }
  #calendarsTable_wrapper .dataTables_length label,
  #calendarsTable_wrapper .dataTables_filter label { display: flex; align-items: center; gap: .5rem; margin: 0; font-size: .8125rem; color: #64748b; white-space: nowrap; }
  #calendarsTable_wrapper .dataTables_filter input { flex: 1; min-width: 0; }
  @media (min-width: 640px) {
    #calendarsTable_wrapper { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem 1.5rem; }
    #calendarsTable_wrapper .dataTables_length,
    #calendarsTable_wrapper .dataTables_filter,
    #calendarsTable_wrapper .dataTables_info,
    #calendarsTable_wrapper .dataTables_paginate { margin-bottom: 0; }
    #calendarsTable_wrapper > table { width: 100%; }
  }
  #calendarsTable_wrapper .dataTables_filter input,
  #calendarsTable_wrapper .dataTables_length select { border-radius: .5rem; border: 1px solid #e2e8f0; padding: .375rem .75rem; outline: none; }
  #calendarsTable_wrapper .dataTables_filter input:focus,
  #calendarsTable_wrapper .dataTables_length select:focus { border-color: #2dd4bf; box-shadow: 0 0 0 2px #ccfbf1; }
  #calendarsTable_wrapper .dataTables_info { font-size: .8125rem; color: #94a3b8; }
  #calendarsTable_wrapper .dataTables_paginate { display: flex; gap: .25rem; flex-wrap: wrap; }
  #calendarsTable_wrapper .dataTables_paginate .paginate_button.current { background: #0f766e !important; color: #fff !important; border-radius: .375rem; border: none !important; }
  #calendarsTable_wrapper .dataTables_paginate .paginate_button { border-radius: .375rem; padding: .25rem .6rem; }
  #calendarsTable thead th { background: #f8fafc; }
</style>
</head>
<body class="bg-slate-50 font-sans">
<div id="app">
  <div v-if="!authReady" class="min-h-screen flex items-center justify-center">
    <div class="spinner w-12 h-12"></div>
  </div>

  <template v-else>
    <app-nav :user="currentUser" page="calendars" ref="nav"></app-nav>

    <div class="md:ml-60 min-h-screen flex flex-col">
      <header class="bg-white border-b border-slate-100 px-5 py-2.5 flex items-center gap-3 shadow-sm min-h-[56px] flex-wrap">
        <h1 class="text-base font-bold text-slate-700 flex items-center gap-2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          ปฏิทินการทำงาน
        </h1>
      </header>

      <main class="flex-1 w-full max-w-[1600px] mx-auto px-4 pb-24 pt-5 md:px-6 md:py-6">

        <p class="text-sm text-slate-500 mb-4 max-w-[720px]">ตั้งค่าวันทำงานประจำสัปดาห์ของแต่ละปฏิทิน — ใช้เป็นฐานคำนวณ SLA และวันทำงานทั่วทั้งระบบ</p>

        <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100">
          <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100 gap-3 flex-wrap">
            <span class="font-bold text-slate-700 flex items-center gap-2">
              <span class="w-8 h-8 rounded-lg bg-teal-50 text-teal-700 flex items-center justify-center shrink-0">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              </span>
              ปฏิทินการทำงานในระบบ
            </span>
            <div class="flex items-center gap-2">
              <button @click="exportCalendars"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Export Excel
              </button>
              <button @click="openCalendarModal(null)"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer">
                + สร้างปฏิทินการทำงาน
              </button>
            </div>
          </div>

          <div v-if="loading" class="flex flex-col items-center justify-center py-12 text-slate-400">
            <div class="spinner w-8 h-8 mx-auto"></div>
          </div>
          <div v-show="!loading" class="p-4 overflow-x-auto">
            <!-- ตารางนี้ DataTables (jQuery) เป็นผู้คุมทั้งหมด — Vue แค่วางโครง <table> เปล่าไว้ให้ ไม่มี v-for/v-if ควบคุมแถวเลย
                 กันชนกัน: ห้ามใส่ v-for ในนี้เด็ดขาด เพราะ DataTables จะ manipulate DOM ตรงนี้เองหลัง initDataTable() ทำงาน -->
            <table id="calendarsTable" class="display w-full min-w-[640px] text-sm"></table>
          </div>
        </div>
      </main>
    </div>

    <app-modal ref="appModal"></app-modal>

    <!-- MODAL: สร้าง/แก้ไขปฏิทิน -->
    <div class="fixed inset-0 bg-black/50 flex items-start justify-center z-[1000] p-4 overflow-y-auto"
      v-if="modal.type" @click.self="closeModal">
      <div v-if="modal.type==='calendar'" class="bg-white rounded-2xl w-full max-w-[480px] shadow-2xl overflow-hidden my-8">
        <div class="bg-teal-600 text-white px-6 py-5 flex items-center justify-between">
          <h3 class="font-bold text-lg">{{ calendarForm.id ? 'แก้ไขปฏิทินการทำงาน' : 'สร้างปฏิทินการทำงาน' }}</h3>
          <button class="text-white/80 hover:text-white bg-transparent border-0 text-2xl cursor-pointer leading-none"
            @click="closeModal">×</button>
        </div>
        <div class="p-5 flex flex-col gap-4">
          <div class="flex flex-col gap-1">
            <label class="block text-sm font-semibold text-slate-600">รหัสปฏิทิน (A-Z, 0-9, - เท่านั้น) <span class="text-red-500">*</span></label>
            <input v-model="calendarForm.code" :disabled="!!calendarForm.id" placeholder="เช่น CLD-01"
              class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white font-mono uppercase disabled:bg-slate-50 disabled:text-slate-400">
          </div>
          <div class="flex flex-col gap-1">
            <label class="block text-sm font-semibold text-slate-600">ชื่อแสดงผล <span class="text-red-500">*</span></label>
            <input v-model="calendarForm.name" placeholder="เช่น ปฏิทิน Vendor X"
              class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
          </div>
          <div class="flex flex-col gap-1">
            <label class="block text-sm font-semibold text-slate-600">วันทำงานประจำสัปดาห์ <span class="text-red-500">*</span></label>
            <div class="flex gap-1.5 flex-wrap mt-1">
              <label v-for="d in dayOptions" :key="d.v"
                class="flex items-center px-2.5 py-1 rounded-full border text-xs font-semibold select-none"
                :class="[
                  calendarForm.work_days.includes(d.v) ? 'border-teal-200 bg-teal-50 text-teal-700' : 'border-slate-200 bg-white text-slate-400',
                  calendarForm.id ? 'opacity-60 cursor-not-allowed' : 'cursor-pointer'
                ]">
                <input type="checkbox" :value="d.v" v-model="calendarForm.work_days" :disabled="!!calendarForm.id" class="hidden">
                {{ d.short }}
              </label>
            </div>
            <p v-if="calendarForm.id" class="text-xs text-slate-400">รหัสและวันทำงานแก้ไขไม่ได้หลังสร้างปฏิทินแล้ว — แก้ได้แค่ชื่อแสดงผล</p>
          </div>
        </div>
        <div class="px-5 py-4 border-t border-slate-100 flex items-center justify-end gap-2">
          <button @click="closeModal"
            class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer">
            ยกเลิก
          </button>
          <button @click="submitCalendar"
            class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer">
            บันทึก
          </button>
        </div>
      </div>
    </div>
  </template>
</div>

<script src="shared/vue.global.prod.js"></script>
<script src="shared/app.js?v=44"></script>
<script>
const { createApp } = Vue;
createApp({
  components: { AppNav, AppModal },
  data() {
    return {
      authReady: false,
      currentUser: null,
      loading: false,
      calendarsList: [],
      modal: { type: null, data: null },
      calendarForm: { id: null, code: '', name: '', work_days: [1,2,3,4,5] },
      dayOptions: [
        { v:1, short:'จ' }, { v:2, short:'อ' }, { v:3, short:'พ' }, { v:4, short:'พฤ' },
        { v:5, short:'ศ' }, { v:6, short:'ส' }, { v:7, short:'อา' },
      ],
    };
  },
  async mounted() {
    try {
      const res = await apiCall('GET', 'api/auth.php?action=me');
      if (!res.success) { window.location.href = 'login.html'; return; }
      this.currentUser = res.data;
      if (!['admin','salesadmin'].includes(this.currentUser.role)) {
        window.location.href = 'dashboard.html'; return;
      }
    } catch { window.location.href = 'login.html'; return; }
    this.authReady = true;
    await this.$nextTick(); // รอให้ Vue วาง <table id="calendarsTable"> ลง DOM ก่อน ค่อยให้ jQuery จับ
    this.bindTableEvents();
    await this.loadCalendars();
  },
  methods: {
    ...SharedMethods,

    // ปฏิทินที่ "กำลังถูกใช้งานอยู่" (usage ไม่ว่าง) ลบไม่ได้ — ดึงจาก DB จริงตรงกับที่ api/calendars.php เช็คตอนลบ
    // แทนการ hardcode รายชื่อปฏิทิน ('CAL-01'/'CAL-02') ที่ผ่านมา ซึ่งพลาดปฏิทินอื่นที่ถูกใช้งานจริงแต่ไม่อยู่ใน list (เช่น DATA-VENDOR)
    isProtected(cal) { return !!(cal.usage && cal.usage.length); },

    esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); },

    /** ผูก event ปุ่มแก้ไข/ลบ "ครั้งเดียว" ตอน mounted ด้วย delegated listener บน #calendarsTable (element แม่ที่ DataTables ไม่ได้ทำลายทิ้ง)
        ไม่ต้องผูกใหม่ทุกครั้งที่ initDataTable() รัน เพราะ delegation ทำงานกับปุ่มที่ถูกสร้างใหม่ข้างในได้อัตโนมัติอยู่แล้ว */
    bindTableEvents() {
      const self = this;
      $('#calendarsTable').on('click', '.edit-cal-btn', function () {
        const cal = self.calendarsList.find(c => c.id === Number($(this).data('id')));
        if (cal) self.openCalendarModal(cal);
      });
      $('#calendarsTable').on('click', '.delete-cal-btn', function () {
        const cal = self.calendarsList.find(c => c.id === Number($(this).data('id')));
        if (cal) self.deleteCalendar(cal);
      });
    },

    /** สร้าง/รีเซ็ต DataTable ใหม่ทุกครั้งที่ calendarsList เปลี่ยน (สร้าง/แก้ไข/ลบสำเร็จ) — ใช้ destroy:true กันเวลา init ซ้ำ error
        คอลัมน์ render เป็น HTML string ล้วน เพราะ DataTables วาด DOM เอง ไม่ผ่าน Vue template */
    initDataTable() {
      const self = this;
      const dayNames = { 1:'จ', 2:'อ', 3:'พ', 4:'พฤ', 5:'ศ', 6:'ส', 7:'อา' };

      $('#calendarsTable').DataTable({
        data: this.calendarsList,
        destroy: true,
        autoWidth: false, // ปิดการคำนวณความกว้างเป็น px แล้ว inline ใส่ตาราง (ปกติ DataTables จะทำแบบนั้น) ปล่อยให้ CSS/Tailwind (w-full, min-w) คุมความกว้างแทน กันปัญหาตารางไม่ยืดเต็มจอกว้าง
        language: {
          search: 'ค้นหา:',
          lengthMenu: 'แสดง _MENU_ รายการ',
          info: 'แสดง _START_ ถึง _END_ จาก _TOTAL_ รายการ',
          infoEmpty: 'ไม่มีข้อมูล',
          infoFiltered: '(กรองจาก _MAX_ รายการทั้งหมด)',
          zeroRecords: 'ไม่พบปฏิทินที่ตรงกับคำค้นหา',
          paginate: { previous: 'ก่อนหน้า', next: 'ถัดไป' },
        },
        columns: [
          { data: 'code', title: 'รหัส', render: d => `<span class="font-mono text-slate-500">${self.esc(d)}</span>` },
          { data: 'name', title: 'ชื่อปฏิทิน', render: d => `<span class="font-medium text-slate-800">${self.esc(d)}</span>` },
          {
            data: 'work_days', title: 'วันทำงาน', orderable: false,
            render: d => d.split(',').map(n => `<span class="inline-block text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-teal-50 text-teal-700 mr-1">${dayNames[n]}</span>`).join(''),
          },
          {
            // ใช้งานที่ไหนบ้าง — รวมทั้งจุดที่ hardcode ในโค้ด (เช่น SLA, วันประกาศแต่ละแหล่ง) และเวรที่ตั้งค่าไว้จริงใน rotation-settings.html
            data: 'usage', title: 'ใช้งานที่', orderable: false,
            render: usage => (usage && usage.length)
              ? usage.map(u => `<span class="inline-block text-[10px] font-semibold px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-600 mr-1 mb-1">${self.esc(u)}</span>`).join('')
              : `<span class="text-xs text-slate-300">ยังไม่ได้ใช้งาน</span>`,
          },
          {
            data: null, title: 'จัดการ', orderable: false, className: 'text-right',
            render: (data, type, row) => {
              let html = `<a href="holidays.html?calendar=${encodeURIComponent(row.code)}" class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 no-underline">วันหยุด</a> `;
              html += `<button class="edit-cal-btn inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer" data-id="${row.id}">แก้ไข</button> `;
              if (self.isProtected(row)) {
                // ปุ่มลบแบบ disabled + tooltip อธิบายเหตุผล แทนการซ่อนหายไปเฉยๆ กันผู้ใช้งง ว่าทำไมบางแถวไม่มีปุ่มลบ
                const reason = (row.usage && row.usage.length) ? `กำลังใช้งานอยู่ (${row.usage.join(', ')}) ลบไม่ได้` : 'ปฏิทินหลักของระบบ ลบไม่ได้';
                html += `<button class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-50 text-slate-300 border-0 cursor-not-allowed" disabled title="${self.esc(reason)}">ลบ</button>`;
              } else {
                html += `<button class="delete-cal-btn inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-semibold bg-white ring-1 ring-rose-100 text-rose-500 hover:bg-rose-50 border-0 cursor-pointer" data-id="${row.id}">ลบ</button>`;
              }
              return html;
            },
          },
        ],
      });
    },

    exportCalendars() {
      const headers = ['ชื่อปฏิทิน', 'รหัส', 'วันทำงาน'];
      const dayNames = { 1:'จ', 2:'อ', 3:'พ', 4:'พฤ', 5:'ศ', 6:'ส', 7:'อา' };
      // export ตามลำดับ/ตัวกรองที่ DataTables แสดงอยู่ตอนนี้ (search:'applied') ไม่ใช่ข้อมูลดิบทั้งหมดเสมอไป
      const rows = $('#calendarsTable').DataTable().rows({ search: 'applied' }).data().toArray().map(cal => [
        cal.name,
        cal.code,
        cal.work_days.split(',').map(d => dayNames[d]).join(' '),
      ]);
      this.exportExcel('ปฏิทินการทำงาน', headers, rows);
    },

    async loadCalendars() {
      this.loading = true;
      const r = await apiCall('GET', 'api/calendars.php?action=list');
      this.calendarsList = r.success ? r.data : [];
      this.loading = false;
      await this.$nextTick();
      this.initDataTable();
    },

    openCalendarModal(cal) {
      this.calendarForm = cal
        ? { id: cal.id, code: cal.code, name: cal.name, work_days: cal.work_days.split(',').map(Number) }
        : { id: null, code: '', name: '', work_days: [1,2,3,4,5] };
      this.modal = { type: 'calendar', data: cal };
    },

    async submitCalendar() {
      if (!this.calendarForm.code || !this.calendarForm.name || !this.calendarForm.work_days.length) {
        await this.showAlert('กรุณากรอกข้อมูลให้ครบ', 'error'); return;
      }
      const res = this.calendarForm.id
        ? await apiCall('POST', 'api/calendars.php?action=update', { code: this.calendarForm.code, name: this.calendarForm.name })
        : await apiCall('POST', 'api/calendars.php?action=create', this.calendarForm);
      if (res.success) {
        this.closeModal();
        await this.loadCalendars();
        await this.showAlert(this.calendarForm.id ? 'บันทึกชื่อปฏิทินเรียบร้อย' : 'สร้างปฏิทินเรียบร้อย', 'success');
      } else {
        await this.showAlert(res.message, 'error');
      }
    },

    async deleteCalendar(cal) {
      const ok = await this.showConfirm('ลบปฏิทิน?', `ลบปฏิทิน "${cal.name}" ใช่ไหม? วันหยุดของปฏิทินนี้จะถูกลบไปด้วย`, 'ลบ');
      if (!ok) return;
      const r = await apiCall('POST', 'api/calendars.php?action=delete', { id: cal.id });
      if (r.success) {
        await this.loadCalendars();
        await this.showAlert('ลบปฏิทินเรียบร้อย', 'success');
      } else {
        await this.showAlert(r.message, 'error');
      }
    },
  },
}).mount('#app');
</script>
</body>
</html>
