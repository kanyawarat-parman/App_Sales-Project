<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ผู้ใช้งาน</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="shared/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css?v=16">
</head>
<body class="bg-slate-50 font-sans">
<div id="app">
  <div v-if="!authReady" class="min-h-screen flex items-center justify-center">
    <div class="spinner w-12 h-12"></div>
  </div>

  <template v-else>
    <app-nav :user="currentUser" page="users" ref="nav"></app-nav>

    <div class="md:ml-60 min-h-screen flex flex-col">
      <header class="bg-white border-b border-slate-100 px-5 py-2.5 flex items-center gap-3 shadow-sm min-h-[56px]">
        <h1 class="text-base font-bold text-slate-700 flex items-center gap-2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>
          </svg>
          ผู้ใช้งาน
        </h1>
      </header>

      <main class="flex-1 w-full max-w-[1600px] mx-auto px-4 pb-24 pt-5 md:px-6 md:py-6">
        <!-- จัดหน้าใหม่ 2026-10-22 (ผู้ใช้เริ่มเยอะ): ค้นหา + กรองบทบาท/สถานะ + หัวกลุ่มตาม role + แถวบรรทัดเดียว + เมนู ⋯ (List View แบบ Salesforce Setup → Users)
             อีเมล / LINE ID ดูในหน้าแก้ไข — ตารางแสดงเฉพาะช่องทางแจ้งเตือน + ป้ายเตือนเมื่อรับไม่ได้ -->
        <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100">
          <div class="px-5 py-4 border-b border-slate-100 space-y-3">
            <div class="flex flex-wrap items-center gap-2">
              <input v-model.trim="userSearch" type="search" placeholder="ค้นหาชื่อ / username / อีเมล / รหัส Sale"
                class="flex-1 min-w-[240px] border border-slate-300 rounded-xl px-3.5 py-2 text-base sm:text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100">
              <button v-for="st in [{ key: 'active', label: 'ใช้งาน' }, { key: 'inactive', label: 'ปิดใช้งาน' }]" :key="st.key" type="button" @click="userStatus = st.key"
                class="inline-flex items-center gap-1.5 px-3 py-2 rounded-full text-sm font-semibold border-0 cursor-pointer"
                :class="userStatus === st.key ? 'bg-teal-700 text-white' : 'bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50'">
                {{ st.label }} <span class="px-1.5 rounded-full text-xs" :class="userStatus === st.key ? 'bg-teal-900/40' : 'bg-slate-100'">{{ statusCount(st.key) }}</span>
              </button>
              <button @click="openUserModal(null)"
                class="ml-auto inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer">
                + เพิ่มผู้ใช้
              </button>
            </div>
            <div class="flex flex-wrap items-center gap-1.5">
              <button v-for="r in userRoleTabs" :key="r.key" type="button" @click="userRole = r.key"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-semibold border-0 cursor-pointer"
                :class="userRole === r.key ? 'bg-teal-700 text-white' : 'bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50'">
                {{ r.label }} <span class="px-1.5 rounded-full text-xs" :class="userRole === r.key ? 'bg-teal-900/40' : 'bg-slate-100'">{{ roleCount(r.key) }}</span>
              </button>
              <!-- เฉพาะคนที่ตั้งค่าแจ้งเตือนไม่ครบ (ไม่มี LINE ID / อีเมล ตามช่องทางที่เลือก) -->
              <button v-if="problemCount || userProblemOnly" type="button" @click="userProblemOnly = !userProblemOnly"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-semibold border-0 cursor-pointer"
                :class="userProblemOnly ? 'bg-amber-500 text-white' : 'bg-white ring-1 ring-amber-400 text-amber-700 hover:bg-amber-50'">
                ⚠ แจ้งเตือนตั้งค่าไม่ครบ <span class="px-1.5 rounded-full text-xs" :class="userProblemOnly ? 'bg-amber-700/40' : 'bg-amber-50'">{{ problemCount }}</span>
              </button>
            </div>
          </div>
          <div>
            <div v-if="!allUsers.length" class="flex flex-col items-center justify-center py-12 text-slate-400">
              <div class="spinner w-8 h-8 mx-auto"></div>
            </div>
            <div v-else-if="!filteredUsers.length" class="py-12 text-center text-slate-400">ไม่พบผู้ใช้ตามที่ค้นหา / กรอง</div>
            <div v-else class="overflow-x-auto">
              <table class="w-full border-collapse text-sm">
                <thead>
                  <tr class="bg-slate-50">
                    <th class="px-4 py-2.5 text-left text-[.75rem] font-bold text-slate-500 border-b-2 border-slate-200 whitespace-nowrap">ผู้ใช้</th>
                    <th class="px-4 py-2.5 text-left text-[.75rem] font-bold text-slate-500 border-b-2 border-slate-200 whitespace-nowrap">บทบาท</th>
                    <th class="px-4 py-2.5 text-left text-[.75rem] font-bold text-slate-500 border-b-2 border-slate-200 whitespace-nowrap">แจ้งเตือน</th>
                    <th class="px-4 py-2.5 text-center text-[.75rem] font-bold text-slate-500 border-b-2 border-slate-200 whitespace-nowrap">งานที่ทำอยู่</th>
                    <th class="px-4 py-2.5 text-left text-[.75rem] font-bold text-slate-500 border-b-2 border-slate-200 whitespace-nowrap">ใช้งานล่าสุด</th>
                    <th class="px-4 py-2.5 border-b-2 border-slate-200"></th>
                  </tr>
                </thead>
                <tbody>
                  <template v-for="g in userGroups" :key="g.role">
                    <!-- หัวกลุ่มตามบทบาท -->
                    <tr class="bg-slate-100/70">
                      <td colspan="6" class="px-4 py-1.5 text-xs font-bold text-slate-600">{{ g.label }} · {{ g.users.length }}</td>
                    </tr>
                    <tr v-for="u in g.users" :key="u.id" class="border-b border-slate-100 hover:bg-slate-50/50">
                      <!-- ผู้ใช้: รูป + ชื่อ + username (+ รหัส Sale) บรรทัดเดียว — อีเมลชี้ดูได้ / ดูเต็มในหน้าแก้ไข -->
                      <td class="px-4 py-2">
                        <div class="flex items-center gap-2.5" :title="u.email || ''">
                          <img v-if="u.photo_url" :src="u.photo_url" class="w-8 h-8 rounded-full object-cover shrink-0"/>
                          <div v-else class="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold shrink-0"
                            :style="{background: u.avatar_color}">{{ avatarInitials(u.full_name) }}</div>
                          <span class="font-medium text-slate-800 whitespace-nowrap">{{ u.full_name }}</span>
                          <span class="text-xs text-slate-400 whitespace-nowrap">{{ u.username }}</span>
                          <!-- รหัส Sale (users.sale_id) — มีรหัส = ทีมโครงการ ใบเสนอราคาติดกฎล็อก / 000 = ยังไม่มีรหัสจริง ไม่นับ -->
                          <span v-if="u.sale_id" class="text-xs whitespace-nowrap"
                            :title="/^0+$/.test(u.sale_id) ? 'ยังไม่มีรหัส Sale จริง — ไม่นับเป็นทีมโครงการ' : 'ใบเสนอราคาของรหัสนี้ต้องออกจากคำขอในดีล'">
                            <span class="text-slate-400">· รหัส </span><span class="font-mono" :class="/^0+$/.test(u.sale_id) ? 'text-slate-400' : 'text-slate-700 font-semibold'">{{ u.sale_id }}</span>
                          </span>
                        </div>
                      </td>
                      <td class="px-4 py-2">
                        <span class="whitespace-nowrap inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold"
                          :class="u.role==='admin'?'bg-indigo-100 text-indigo-700':u.role==='salesadmin'?'bg-amber-100 text-amber-700':u.role==='manager'?'bg-teal-100 text-teal-700':'bg-sky-100 text-sky-700'">
                          {{ {admin:'Admin',salesadmin:'SalesAdmin',manager:'Manager',sale:'Sale'}[u.role] || u.role }}
                        </span>
                      </td>
                      <!-- แจ้งเตือน: ช่องทาง / ป้ายส้มเมื่อรับจริงไม่ได้ (กฎเดียวกับ notifyWarnings ในฟอร์ม) -->
                      <td class="px-4 py-2 text-xs">
                        <span v-if="!Number(u.notify_enabled)" class="whitespace-nowrap inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold bg-slate-100 text-slate-500"
                          title="ได้แค่กระดิ่งในระบบ ไม่ได้อีเมล / LINE">ปิดแจ้งเตือน</span>
                        <span v-else-if="userNotifyProblems(u).length" class="whitespace-nowrap inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold bg-amber-50 text-amber-700 ring-1 ring-amber-300"
                          :title="userNotifyProblems(u).join(' / ')">⚠ {{ userNotifyProblems(u)[0] }}</span>
                        <span v-else class="whitespace-nowrap inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold bg-teal-50 text-teal-700 ring-1 ring-teal-200">
                          {{ {line:'LINE', email:'Email', both:'LINE + Email'}[u.notify_channel] || u.notify_channel }}
                        </span>
                      </td>
                      <!-- งานที่ทำอยู่ — มีความหมายเฉพาะ Sale / role อื่นแสดง — -->
                      <td class="px-4 py-2 text-center" :class="u.role === 'sale' ? 'font-bold text-slate-800' : 'text-slate-300'">{{ u.role === 'sale' ? (u.active_tasks ?? 0) : '—' }}</td>
                      <td class="px-4 py-2 text-xs whitespace-nowrap">
                        <span v-if="onlineStatus(u)==='online'" class="inline-flex items-center gap-1.5 text-emerald-600 font-semibold" :title="u.current_page || ''">
                          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse shrink-0"></span>{{ u.current_page ? pageLabel(u.current_page) : 'ออนไลน์' }}
                        </span>
                        <span v-else-if="onlineStatus(u)==='away'" class="inline-flex items-center gap-1.5 text-amber-600" :title="u.current_page ? pageLabel(u.current_page) : ''">
                          <span class="w-2 h-2 rounded-full bg-amber-400 shrink-0"></span>เพิ่งออก · {{ onlineTimeAgo(u.last_active_at) }}
                        </span>
                        <span v-else class="text-slate-400">{{ u.last_active_at ? onlineTimeAgo(u.last_active_at) : 'ไม่เคยเข้าใช้' }}</span>
                      </td>
                      <td class="px-4 py-2">
                        <div class="flex items-center justify-end">
                          <button @click="openUserModal(u)"
                            class="whitespace-nowrap inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer">
                            แก้ไข
                          </button>
                        </div>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Mobile bottom nav -->
    <app-tab-bar :tabs="tabItems"></app-tab-bar>

    <app-modal ref="appModal"></app-modal>

    <!-- MODALS -->
    <div class="fixed inset-0 bg-black/50 flex items-start justify-center z-[1000] p-4 overflow-y-auto"
      v-if="modal.type" @click.self="closeModal">
      <!-- User Modal -->
      <div v-if="modal.type==='user'" class="bg-white rounded-2xl w-full max-w-[560px] shadow-2xl overflow-hidden my-8">
        <div class="bg-teal-600 text-white px-6 py-5 flex items-center justify-between">
          <h3 class="font-bold text-lg">{{ userForm.id ? 'แก้ไขผู้ใช้' : 'เพิ่มผู้ใช้' }}</h3>
          <button class="text-white/80 hover:text-white bg-transparent border-0 text-2xl cursor-pointer leading-none"
            @click="closeModal">×</button>
        </div>
        <div class="p-5 overflow-y-auto max-h-[calc(100vh-220px)]">
          <div class="grid grid-cols-2 gap-4">
            <div class="flex flex-col gap-1">
              <label class="block text-sm font-semibold text-slate-600">ชื่อ-นามสกุล <span class="text-red-500">*</span></label>
              <input v-model="userForm.full_name" required
                class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
            </div>
            <div class="flex flex-col gap-1">
              <label class="block text-sm font-semibold text-slate-600">Username <span class="text-red-500">*</span></label>
              <input v-model="userForm.username" :disabled="!!userForm.id" required
                class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white disabled:bg-slate-50 disabled:text-slate-400">
            </div>
            <div class="flex flex-col gap-1">
              <label class="block text-sm font-semibold text-slate-600">Password {{ userForm.id ? '(เว้นว่างถ้าไม่เปลี่ยน)' : '*' }}</label>
              <input v-model="userForm.password" type="password" :required="!userForm.id"
                class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
            </div>
            <div class="flex flex-col gap-1">
              <label class="block text-sm font-semibold text-slate-600">บทบาท <span class="text-red-500">*</span></label>
              <select v-model="userForm.role"
                class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
                <option value="admin">Admin (ผู้ดูแลระบบ)</option>
                <option value="salesadmin">SalesAdmin (ธุรการขาย)</option>
                <option value="manager">Manager (ผู้จัดการฝ่ายขาย)</option>
                <option value="sale">Sale (พนักงานขาย)</option>
              </select>
            </div>
            <!-- แสดงเมื่อเป็น Sale หรือผู้ใช้มีรหัสอยู่แล้ว (2026-10-16) — เดิมซ่อนเมื่อไม่ใช่ Sale ทำให้ล้างรหัสค้างของธุรการ/หัวหน้าไม่ได้ (เช่น 000) -->
            <div class="flex flex-col gap-1" v-if="userForm.role==='sale' || modal.data?.sale_id">
              <label class="block text-sm font-semibold text-slate-600">Sale ID <span v-if="userForm.role==='sale'" class="text-red-500">*</span></label>
              <input v-model="userForm.sale_id" placeholder="รหัสประจำตัวพนักงานขาย" :required="userForm.role==='sale'"
                class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
              <p class="text-xs text-slate-400">ใช้จับคู่ข้อมูลใบเสนอราคาเก่าและอ้างอิงงานขาย ต้องไม่ซ้ำกับคนอื่น · มีรหัส = ทีมโครงการ ใบเสนอราคาของรหัสนี้ต้องออกจากคำขอในดีล</p>
              <p v-if="userForm.role!=='sale'" class="text-xs text-amber-700">ผู้ใช้นี้ไม่ใช่ Sale — ถ้าไม่ได้ขายเอง ให้ลบรหัสออกให้ช่องว่าง (ไม่งั้นเห็นใบเสนอราคาที่ระบุรหัสนี้ในระบบใบเสนอราคา)</p>
            </div>
            <div class="flex flex-col gap-1">
              <label class="block text-sm font-semibold text-slate-600">เบอร์โทรศัพท์</label>
              <input v-model="userForm.phone" placeholder="08x-xxx-xxxx"
                class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
            </div>
            <div class="flex flex-col gap-1">
              <label class="block text-sm font-semibold text-slate-600">Email</label>
              <input v-model="userForm.email" type="email" placeholder="example@email.com"
                class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
            </div>
            <!-- LINE User ID ยาว 33 ตัว — ใช้เต็มแถวให้เห็นครบ และวางติดส่วนการแจ้งเตือน (ปรับตามผู้ใช้ 2026-10-08) -->
            <div class="flex flex-col gap-1 col-span-2">
              <label class="block text-sm font-semibold text-slate-600">LINE User ID</label>
              <!-- ปุ่มทดสอบส่ง LINE อยู่ข้างช่อง (ย้ายจากตาราง 2026-10-22) — ทดสอบด้วยรหัสที่บันทึกไว้แล้วเท่านั้น -->
              <div class="flex gap-2">
                <input v-model="userForm.line_user_id" placeholder="Uxxxxxxxx..."
                  class="flex-1 min-w-0 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white font-mono">
                <button v-if="userForm.id" type="button" @click="testLineFromForm" :disabled="lineTesting === userForm.id"
                  class="shrink-0 px-3.5 py-2 rounded-xl text-sm font-semibold bg-white ring-1 ring-teal-600 text-teal-700 hover:bg-teal-50 border-0 cursor-pointer disabled:opacity-50 whitespace-nowrap">
                  {{ lineTesting === userForm.id ? 'กำลังส่ง…' : 'ทดสอบส่ง LINE' }}
                </button>
              </div>
              <p class="text-xs text-slate-400">รหัสผู้ใช้จาก LINE OA ของบริษัท ขึ้นต้นด้วย U ยาว 33 ตัว (ไม่ใช่ LINE ID ที่ใช้ค้นหาเพื่อน) — บันทึกแล้วกด "ทดสอบส่ง LINE" เพื่อตรวจว่าได้รับจริง</p>
              <p v-if="userForm.line_user_id && !/^U[0-9a-f]{32}$/.test(userForm.line_user_id.trim())" class="text-xs text-amber-700">รูปแบบรหัสยังไม่ถูกต้อง</p>
            </div>
            <div class="flex flex-col gap-2 col-span-2">
              <label class="block text-sm font-semibold text-slate-600">การแจ้งเตือน</label>
              <div class="flex items-center gap-4 flex-wrap">
                <div class="flex gap-1.5">
                  <button type="button" v-for="ch in [{v:'line',l:'LINE'},{v:'email',l:'Email'},{v:'both',l:'ทั้งคู่'}]" :key="ch.v"
                    @click="userForm.notify_channel=ch.v"
                    class="px-3.5 py-1.5 rounded-full border-[1.5px] text-xs font-semibold cursor-pointer transition-all"
                    :class="userForm.notify_channel===ch.v ? 'bg-teal-700 text-white border-teal-500' : 'bg-white text-slate-500 border-slate-300'">
                    {{ ch.l }}
                  </button>
                </div>
                <label class="flex items-center gap-2 cursor-pointer select-none">
                  <div @click="userForm.notify_enabled=userForm.notify_enabled?0:1"
                    class="relative w-10 h-6 rounded-full cursor-pointer transition-colors"
                    :class="userForm.notify_enabled ? 'bg-teal-700' : 'bg-slate-300'">
                    <div class="absolute top-1 w-4 h-4 rounded-full bg-white shadow transition-all"
                      :class="userForm.notify_enabled ? 'left-5' : 'left-1'"></div>
                  </div>
                  <span class="text-sm text-slate-500">{{ userForm.notify_enabled ? 'เปิดแจ้งเตือน' : 'ปิดแจ้งเตือน' }}</span>
                </label>
              </div>
              <!-- ชั้นผู้ใช้ของการแจ้งเตือน — ใช้คู่กับหน้าตั้งค่าการแจ้งเตือนรายเรื่อง (ชั้นองค์กร) ส่งเมื่อผ่านทั้ง 2 ชั้น (ยืนยันจากผู้ใช้ 2026-10-08) -->
              <p class="text-xs text-slate-400 leading-relaxed">ช่องทางที่ผู้ใช้คนนี้รับ — จะได้อีเมล / LINE เฉพาะเรื่องที่เปิดไว้ใน
                <a href="notification-settings.html" target="_blank" class="text-teal-700 font-semibold underline underline-offset-2">ตั้งค่าการแจ้งเตือน</a>
                (กระดิ่งในระบบได้ทุกเรื่องเสมอ) · เลือก LINE ต้องใส่ LINE User ID ด้วย</p>
              <p v-for="w in notifyWarnings" :key="w" class="text-xs text-amber-700">{{ w }}</p>
            </div>
            <div class="flex flex-col gap-1">
              <label class="block text-sm font-semibold text-slate-600">สีอวตาร</label>
              <div class="flex gap-2 items-center mt-1">
                <input type="color" v-model="userForm.avatar_color"
                  class="w-10 h-9 border border-slate-200 rounded-lg cursor-pointer p-0.5">
                <div class="w-9 h-9 rounded-full flex items-center justify-center text-white text-sm font-bold"
                  :style="{background: userForm.avatar_color}">
                  {{ avatarInitials(userForm.full_name||'?') }}
                </div>
              </div>
            </div>
            <div class="flex flex-col gap-1" v-if="userForm.id">
              <label class="block text-sm font-semibold text-slate-600">รูปโปรไฟล์</label>
              <div class="flex items-center gap-3 mt-1">
                <img v-if="userForm.photo_url" :src="userForm.photo_url"
                  class="w-12 h-12 rounded-full object-cover"/>
                <div v-else class="w-12 h-12 rounded-full flex items-center justify-center text-white text-base font-bold"
                  :style="{background: userForm.avatar_color}">
                  {{ avatarInitials(userForm.full_name||'?') }}
                </div>
                <div>
                  <input type="file" accept="image/*" @change="uploadPhoto($event, userForm.id)"
                    class="hidden" :ref="'photoInput_'+userForm.id" :id="'photoInput_'+userForm.id">
                  <label :for="'photoInput_'+userForm.id"
                    class="inline-flex items-center px-3 py-2 rounded-lg text-sm font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 cursor-pointer">
                    เลือกรูป
                  </label>
                  <p class="text-xs text-slate-400 mt-1">JPG/PNG ไม่เกิน 2MB</p>
                </div>
              </div>
            </div>
            <div class="flex flex-col gap-1" v-if="userForm.id">
              <label class="block text-sm font-semibold text-slate-600">สถานะ</label>
              <select v-model="userForm.is_active"
                class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
                <option :value="1">ใช้งาน</option>
                <option :value="0">ปิดใช้งาน</option>
              </select>
            </div>
          </div>
        </div>
        <div class="px-5 py-4 border-t border-slate-100 flex items-center justify-end gap-2">
          <button @click="closeModal"
            class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer">
            ยกเลิก
          </button>
          <button @click="submitUser"
            class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer">
            บันทึก
          </button>
        </div>
      </div>
    </div>
  </template>
</div>

<script src="shared/vue.global.prod.js"></script>
<script src="shared/app.js?v=100"></script>
<script>
const { createApp } = Vue;

createApp({
  components: { AppNav, AppTabBar, AppModal },
  data() {
    return {
      authReady: false,
      currentUser: null,
      modal: { type: null, data: null },
      allUsers: [],
      lineTesting: null,   // id ผู้ใช้ที่กำลังทดสอบส่ง LINE
      // ค้นหา / ตัวกรอง (จัดหน้าใหม่ 2026-10-22)
      userSearch: '', userRole: 'all', userStatus: 'active', userProblemOnly: false,
      userRoleTabs: [{ key: 'all', label: 'ทั้งหมด' }, { key: 'admin', label: 'Admin' }, { key: 'salesadmin', label: 'ธุรการขาย' }, { key: 'manager', label: 'Manager' }, { key: 'sale', label: 'Sale' }],
      userForm: { id: null, username: '', password: '', full_name: '', role: 'sale', sale_id: '', line_user_id: '', phone: '', email: '', notify_channel: 'line', notify_enabled: 1, avatar_color: '#3B82F6', is_active: 1 },
    };
  },
  computed: {
    // เตือนสีส้มในฟอร์มเมื่อการตั้งค่าแจ้งเตือนรับไม่ได้จริง (ไม่บล็อกการบันทึก) — 2026-10-08
    notifyWarnings() {
      const f = this.userForm, w = [];
      if (!f.notify_enabled) return ['ปิดแจ้งเตือนอยู่ — ผู้ใช้คนนี้จะได้แค่กระดิ่งในระบบ ไม่ได้อีเมล / LINE'];
      const lineOk = /^U[0-9a-f]{32}$/.test((f.line_user_id || '').trim());
      if (['line', 'both'].includes(f.notify_channel) && !lineOk) w.push('ยังไม่ได้ใส่ LINE User ID ที่ถูกต้อง — จะไม่ได้รับ LINE');
      if (['email', 'both'].includes(f.notify_channel) && !(f.email || '').trim()) w.push('ยังไม่ได้ใส่อีเมล — จะไม่ได้รับอีเมล');
      return w;
    },
    // ผู้ใช้ตามสถานะ + คำค้น (ยังไม่กรองบทบาท — ใช้นับตัวเลขบนปุ่มบทบาท)
    usersBySearch() {
      const q = this.userSearch.toLowerCase();
      return this.allUsers.filter(u => (this.userStatus === 'active' ? Number(u.is_active) === 1 : Number(u.is_active) !== 1)
        && (!q || [u.full_name, u.username, u.email, u.sale_id].some(v => String(v || '').toLowerCase().includes(q))));
    },
    filteredUsers() {
      return this.usersBySearch.filter(u => (this.userRole === 'all' || u.role === this.userRole)
        && (!this.userProblemOnly || (Number(u.notify_enabled) && this.userNotifyProblems(u).length)));
    },
    // หัวกลุ่มตามบทบาท เรียง Admin → ธุรการขาย → Manager → Sale
    userGroups() {
      return this.userRoleTabs.filter(r => r.key !== 'all')
        .map(r => ({ role: r.key, label: r.label, users: this.filteredUsers.filter(u => u.role === r.key) }))
        .filter(g => g.users.length);
    },
    problemCount() { return this.usersBySearch.filter(u => Number(u.notify_enabled) && this.userNotifyProblems(u).length).length; },
    tabItems() {
      return [
        { label:'ภาพรวม', icon:'home', href:'dashboard.html' },
        { label:'ผู้ใช้', icon:'users', active:true },
        { label:'ออก', icon:'logout', action:'logout' },
      ];
    },
  },
  async mounted() {
    try {
      const res = await apiCall('GET', 'api/auth.php?action=me');
      if (!res.success) { window.location.href = 'login.html'; return; }
      this.currentUser = res.data;
      if (this.currentUser.role !== 'admin') { window.location.href = 'dashboard.html'; return; }
    } catch { window.location.href = 'login.html'; return; }
    this.authReady = true;
    this.loadUsers();
  },
  methods: {
    ...SharedMethods,

    roleCount(key) { return key === 'all' ? this.usersBySearch.length : this.usersBySearch.filter(u => u.role === key).length; },
    statusCount(key) { return this.allUsers.filter(u => key === 'active' ? Number(u.is_active) === 1 : Number(u.is_active) !== 1).length; },

    async loadUsers() {
      const res = await apiCall('GET', 'api/users.php?action=list');
      if (res.success) this.allUsers = res.data;
    },

    // 'online' = เรียก API ล่าสุดภายใน 5 นาที, 'away' = ภายใน 30 นาที, นอกนั้นถือว่าออฟไลน์
    // (last_active_at อัปเดตทุกครั้งที่หน้าไหนก็ตามเรียก api/auth.php?action=me ตอน mounted() — ดู api/auth.php's getMe())
    onlineStatus(u) {
      if (!u.last_active_at) return 'offline';
      const diffMin = (Date.now() - new Date(u.last_active_at.replace(' ', 'T'))) / 60000;
      if (diffMin <= 5) return 'online';
      if (diffMin <= 30) return 'away';
      return 'offline';
    },
    onlineTimeAgo(ts) {
      if (!ts) return '-';
      const diff = Math.floor((Date.now() - new Date(ts.replace(' ', 'T'))) / 1000);
      if (diff < 60) return 'เพิ่งใช้งาน';
      if (diff < 3600) return Math.floor(diff / 60) + ' นาทีที่แล้ว';
      if (diff < 86400) return Math.floor(diff / 3600) + ' ชั่วโมงที่แล้ว';
      return Math.floor(diff / 86400) + ' วันที่แล้ว';
    },

    // ปัญหาที่ทำให้รับแจ้งเตือนตามช่องทางที่ตั้งไม่ได้ — แสดงในตาราง (ข้อความสั้นกว่า notifyWarnings ของฟอร์ม)
    userNotifyProblems(u) {
      const w = [];
      const lineOk = /^U[0-9a-f]{32}$/.test((u.line_user_id || '').trim());
      if (['line', 'both'].includes(u.notify_channel) && !lineOk) w.push('ไม่มี LINE User ID — ไม่ได้รับ LINE');
      if (['email', 'both'].includes(u.notify_channel) && !(u.email || '').trim()) w.push('ไม่มีอีเมล — ไม่ได้รับอีเมล');
      return w;
    },

    openUserModal(user) {
      this.userForm = user
        ? { ...user, password: '' }
        : { id: null, username: '', password: '', full_name: '', role: 'sale', sale_id: '', line_user_id: '', phone: '', email: '', notify_channel: 'line', notify_enabled: 1, avatar_color: '#3B82F6', is_active: 1 };
      this.modal = { type: 'user', data: user };
    },

    async uploadPhoto(event, userId) {
      const file = event.target.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append('user_id', userId);
      fd.append('photo', file);
      try {
        const res = await fetch('api/upload_photo.php', { method: 'POST', body: fd, credentials: 'same-origin' });
        const json = await res.json();
        if (json.success) {
          this.userForm.photo_url = json.data.photo_url + '?t=' + Date.now();
          this.loadUsers();
          await this.showAlert('อัพโหลดรูปสำเร็จ', 'success');
        } else {
          await this.showAlert(json.message || 'อัพโหลดไม่สำเร็จ', 'error');
        }
      } catch {
        await this.showAlert('เกิดข้อผิดพลาดในการอัพโหลด', 'error');
      }
    },

    // ทดสอบส่ง LINE หาผู้ใช้ — ถามยืนยันก่อน เพราะส่งข้อความจริง (2026-10-08)
    async testLine(u) {
      const ok = await this.showConfirm('ทดสอบส่ง LINE?', `ระบบจะส่งข้อความทดสอบไปที่ LINE ของ ${u.full_name}`, 'ส่งข้อความทดสอบ');
      if (!ok) return;
      this.lineTesting = u.id;
      const res = await apiCall('POST', 'api/users.php?action=test_line', { user_id: u.id });
      this.lineTesting = null;
      await this.showAlert(res.message || (res.success ? 'ส่งแล้ว' : 'ส่งไม่สำเร็จ'), res.success ? 'success' : 'error');
    },

    // ทดสอบจากหน้าแก้ไข: ใช้รหัสที่บันทึกใน DB — แก้รหัสแล้วยังไม่บันทึก / รูปแบบผิด / ยังไม่มีรหัส = เตือนก่อน ไม่ส่ง
    async testLineFromForm() {
      const saved = this.allUsers.find(x => x.id === this.userForm.id);
      const typed = (this.userForm.line_user_id || '').trim();
      if (!typed) return this.showAlert('ยังไม่ได้ใส่ LINE User ID', 'error');
      if (!/^U[0-9a-f]{32}$/.test(typed)) return this.showAlert('รูปแบบ LINE User ID ยังไม่ถูกต้อง', 'error');
      if (!saved || (saved.line_user_id || '').trim() !== typed) return this.showAlert('แก้ LINE User ID แล้วยังไม่ได้บันทึก — กด "บันทึก" ก่อน แล้วเปิดแก้ไขเพื่อทดสอบอีกครั้ง', 'error');
      await this.testLine(saved);
    },

    async submitUser() {
      const isCreate = !this.userForm.id;
      const action = isCreate ? 'create' : 'update';
      const res = await apiCall('POST', `api/users.php?action=${action}`, this.userForm);
      if (res.success) {
        this.loadUsers();
        if (isCreate) {
          // สร้างสำเร็จแล้ว เปลี่ยนฟอร์มเป็นโหมดแก้ไขของ user ที่เพิ่งสร้าง (ไม่ปิด modal)
          // เพื่อให้เลือกรูปโปรไฟล์ได้ทันที เพราะ upload_photo.php ต้องใช้ user id ที่มีอยู่จริงแล้วเท่านั้น
          this.userForm.id = res.data.id;
          this.userForm.password = '';
          await this.showAlert('สร้างผู้ใช้สำเร็จ เลือกรูปโปรไฟล์ได้เลย', 'success');
        } else {
          this.closeModal();
          await this.showAlert(res.message, 'success');
        }
      } else {
        await this.showAlert(res.message, 'error');
      }
    },
  },
}).mount('#app');
</script>
</body>
</html>
