<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตั้งค่า KPI การขาย</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="shared/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css?v=16">
</head>
<body class="bg-slate-50 font-sans">
<div id="app">
  <div v-if="!authReady" class="min-h-screen flex items-center justify-center">
    <div class="spinner w-12 h-12"></div>
  </div>

  <template v-else>
    <app-nav :user="currentUser" page="kpi-settings" ref="nav"></app-nav>

    <div class="md:ml-60 min-h-screen flex flex-col">
      <header class="bg-white border-b border-slate-100 px-5 py-2.5 flex items-center gap-3 shadow-sm min-h-[56px]">
        <h1 class="text-base font-bold text-slate-700 flex items-center gap-2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
          </svg>
          ตั้งค่า KPI การขาย
        </h1>
      </header>

      <main class="flex-1 w-full max-w-[1600px] mx-auto px-4 py-5 md:px-6 md:py-6">
        <div class="flex flex-col gap-5 max-w-[720px] mx-auto">

        <p class="text-sm text-slate-500">ตั้งเป้าหมายยอดขายรายบุคคล เกณฑ์วัดผล KPI (Win Rate / Achievement Rate) และ SLA ต่อ stage ของงานขายตรง</p>

        <!-- ─── Section 1: Annual + Monthly Override ─── -->
        <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100">
          <div class="px-5 py-4 border-b border-slate-100">
            <div class="flex items-start justify-between gap-4 flex-wrap">
              <div>
                <div class="flex items-center gap-2 font-bold text-slate-700">
                  <span class="w-8 h-8 rounded-lg bg-teal-50 text-teal-700 flex items-center justify-center shrink-0">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
                  </span>
                  เป้าหมายยอดขายรายบุคคล
                </div>
                <div class="text-xs text-slate-400 mt-0.5">ตั้ง Annual Target ครั้งเดียว — ระบบคำนวณ Monthly ให้อัตโนมัติ · ปรับรายเดือนได้ถ้าต้องการ</div>
              </div>
              <!-- Year picker -->
              <div class="flex items-center gap-1 shrink-0">
                <button v-for="y in yearOptions" :key="y" @click="changeYear(y)"
                  class="px-3 py-1.5 rounded-lg text-sm font-semibold border-[1.5px] cursor-pointer transition-all"
                  :class="selectedYear===y ? 'bg-teal-700 text-white border-teal-700' : 'bg-white text-slate-400 border-slate-200 hover:border-slate-300'">
                  {{ y }}
                </button>
              </div>
            </div>
          </div>

          <div class="p-5">
            <div v-if="salesLoading" class="py-6 text-center text-slate-400 text-sm">กำลังโหลด...</div>
            <div v-else-if="!salesData.length" class="py-6 text-center text-slate-400 text-sm">ไม่มีข้อมูล Sale</div>
            <div v-else class="flex flex-col gap-4">

              <div v-for="u in salesData" :key="u.id" class="rounded-xl border border-slate-100 overflow-hidden">

                <!-- Row: avatar + annual target -->
                <div class="flex items-center gap-3 px-4 py-3 bg-slate-50">
                  <img v-if="u.photo_url" :src="u.photo_url" class="w-9 h-9 rounded-full object-cover shrink-0"/>
                  <div v-else class="w-9 h-9 rounded-full flex items-center justify-center text-white text-sm font-bold shrink-0"
                       :style="{background: u.avatar_color || '#64748b'}">{{ avatarInitials(u.full_name) }}</div>

                  <div class="flex-1 min-w-0">
                    <div class="font-semibold text-slate-700 text-sm">{{ u.full_name }}</div>
                    <div class="text-xs text-slate-400 mt-0.5">
                      <span v-if="annualEdits[u.id]">
                        ฿{{ Math.round(annualEdits[u.id] / 12).toLocaleString('th-TH') }} / เดือน (auto)
                      </span>
                      <span v-else class="text-slate-300">ยังไม่มีเป้ารายปี</span>
                    </div>
                  </div>

                  <!-- Annual input -->
                  <div class="flex items-center gap-1.5 shrink-0">
                    <span class="text-slate-400 text-sm">฿</span>
                    <input type="number" v-model.number="annualEdits[u.id]" min="0" step="100000"
                      placeholder="เป้ารายปี"
                      class="w-36 border border-slate-200 rounded-xl px-3 py-2 text-sm text-right outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white"/>
                    <span class="text-xs text-slate-400">/ ปี</span>
                  </div>

                  <!-- Toggle monthly override -->
                  <button @click="toggleExpand(u.id)"
                    class="shrink-0 flex items-center gap-1 px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white text-xs font-semibold text-slate-500 hover:bg-slate-50 cursor-pointer transition-all">
                    <svg class="w-3.5 h-3.5 transition-transform" :class="expandedUsers[u.id] ? 'rotate-180' : ''" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="6 9 12 15 18 9"/>
                    </svg>
                    รายเดือน
                  </button>
                </div>

                <!-- Monthly override grid (expanded) -->
                <div v-if="expandedUsers[u.id]" class="px-4 py-3 border-t border-slate-100 bg-white">
                  <div class="text-xs text-slate-400 mb-3">
                    ปรับรายเดือน — กรอกเฉพาะเดือนที่ต่างจาก Annual÷12 · ช่องว่าง = ใช้ค่าอัตโนมัติ
                    <span v-if="annualEdits[u.id]" class="text-teal-600 font-semibold ml-1">
                      (auto = ฿{{ Math.round(annualEdits[u.id] / 12).toLocaleString('th-TH') }})
                    </span>
                  </div>
                  <div class="grid grid-cols-4 gap-2">
                    <div v-for="(mName, idx) in thMonths" :key="idx+1" class="flex flex-col gap-1">
                      <label class="text-[11px] font-semibold"
                        :class="monthEdits[u.id]?.[idx+1] ? 'text-blue-600' : 'text-slate-400'">
                        {{ mName }}
                        <span v-if="monthEdits[u.id]?.[idx+1]" class="text-[10px] text-blue-400 ml-0.5">override</span>
                      </label>
                      <input type="number" v-model.number="monthEdits[u.id][idx+1]" min="0" step="10000"
                        :placeholder="annualEdits[u.id] ? Math.round(annualEdits[u.id]/12).toLocaleString() : '-'"
                        class="w-full border rounded-lg px-2 py-1.5 text-xs text-right outline-none transition-all bg-white"
                        :class="monthEdits[u.id]?.[idx+1] ? 'border-blue-300 focus:border-blue-400 focus:ring-1 focus:ring-blue-200' : 'border-slate-200 focus:border-teal-400 focus:ring-1 focus:ring-teal-100'"/>
                    </div>
                  </div>
                </div>

              </div><!-- end per-user card -->

              <div class="flex justify-end pt-1">
                <button @click="saveAllTargets" :disabled="savingTargets"
                  class="inline-flex items-center justify-center gap-1.5 px-6 py-2.5 rounded-xl text-sm font-semibold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed min-w-[160px]">
                  <span v-if="savingTargets">กำลังบันทึก…</span>
                  <span v-else>บันทึกเป้าหมายทั้งหมด</span>
                </button>
              </div>

            </div>
          </div>
        </div>

        <!-- ─── Section 2: Win Rate & Achievement thresholds ─── -->
        <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100">
          <div class="px-5 py-4 border-b border-slate-100">
            <div class="flex items-center gap-2 font-bold text-slate-700">
              <span class="w-8 h-8 rounded-lg bg-teal-50 text-teal-700 flex items-center justify-center shrink-0">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
              </span>
              เกณฑ์วัดผล KPI
            </div>
            <div class="text-xs text-slate-400 mt-0.5">ระดับสี เขียว / เหลือง / แดง ที่ใช้แสดงผลในรายงาน</div>
          </div>
          <div class="p-5 flex flex-col gap-6">

            <!-- Win Rate -->
            <div>
              <div class="text-sm font-semibold text-slate-600 mb-3">Win Rate (อัตราชนะ)</div>
              <div class="flex flex-wrap gap-4">
                <div class="flex flex-col gap-1.5">
                  <label class="text-xs text-slate-500 font-medium flex items-center gap-1.5">
                    <span class="inline-block w-3 h-3 rounded-full bg-green-500"></span> เขียว (ดี) ≥
                  </label>
                  <div class="flex items-center gap-1.5">
                    <input type="number" v-model.number="kpi.win_rate_green" min="1" max="100"
                      class="w-24 border border-slate-200 rounded-xl px-3 py-2 text-sm text-right outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white"/>
                    <span class="text-sm text-slate-500">%</span>
                  </div>
                </div>
                <div class="flex flex-col gap-1.5">
                  <label class="text-xs text-slate-500 font-medium flex items-center gap-1.5">
                    <span class="inline-block w-3 h-3 rounded-full bg-amber-400"></span> เหลือง (พอใช้) ≥
                  </label>
                  <div class="flex items-center gap-1.5">
                    <input type="number" v-model.number="kpi.win_rate_yellow" min="1" max="100"
                      class="w-24 border border-slate-200 rounded-xl px-3 py-2 text-sm text-right outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white"/>
                    <span class="text-sm text-slate-500">%</span>
                  </div>
                </div>
                <div class="flex flex-col gap-1.5">
                  <label class="text-xs text-slate-500 font-medium flex items-center gap-1.5">
                    <span class="inline-block w-3 h-3 rounded-full bg-red-400"></span> แดง (ต้องปรับปรุง)
                  </label>
                  <div class="flex items-center gap-1.5">
                    <div class="w-24 border border-slate-100 rounded-xl px-3 py-2 text-sm text-right bg-slate-50 text-slate-400">
                      &lt; {{ kpi.win_rate_yellow }}
                    </div>
                    <span class="text-sm text-slate-500">%</span>
                  </div>
                </div>
              </div>
            </div>

            <hr class="border-slate-100">

            <!-- Achievement Rate -->
            <div>
              <div class="text-sm font-semibold text-slate-600 mb-3">Achievement Rate (ยอดขายจริง vs เป้าหมาย)</div>
              <div class="flex flex-wrap gap-4">
                <div class="flex flex-col gap-1.5">
                  <label class="text-xs text-slate-500 font-medium flex items-center gap-1.5">
                    <span class="inline-block w-3 h-3 rounded-full bg-green-500"></span> เขียว (บรรลุเป้า) ≥
                  </label>
                  <div class="flex items-center gap-1.5">
                    <input type="number" v-model.number="kpi.achievement_green" min="1" max="200"
                      class="w-24 border border-slate-200 rounded-xl px-3 py-2 text-sm text-right outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white"/>
                    <span class="text-sm text-slate-500">%</span>
                  </div>
                </div>
                <div class="flex flex-col gap-1.5">
                  <label class="text-xs text-slate-500 font-medium flex items-center gap-1.5">
                    <span class="inline-block w-3 h-3 rounded-full bg-amber-400"></span> เหลือง (ใกล้เป้า) ≥
                  </label>
                  <div class="flex items-center gap-1.5">
                    <input type="number" v-model.number="kpi.achievement_yellow" min="1" max="200"
                      class="w-24 border border-slate-200 rounded-xl px-3 py-2 text-sm text-right outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white"/>
                    <span class="text-sm text-slate-500">%</span>
                  </div>
                </div>
                <div class="flex flex-col gap-1.5">
                  <label class="text-xs text-slate-500 font-medium flex items-center gap-1.5">
                    <span class="inline-block w-3 h-3 rounded-full bg-red-400"></span> แดง (ต่ำกว่าเป้า)
                  </label>
                  <div class="flex items-center gap-1.5">
                    <div class="w-24 border border-slate-100 rounded-xl px-3 py-2 text-sm text-right bg-slate-50 text-slate-400">
                      &lt; {{ kpi.achievement_yellow }}
                    </div>
                    <span class="text-sm text-slate-500">%</span>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>

        <!-- ─── Section 3: SLA per Stage ─── -->
        <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100">
          <div class="px-5 py-4 border-b border-slate-100">
            <div class="flex items-center gap-2 font-bold text-slate-700">
              <span class="w-8 h-8 rounded-lg bg-teal-50 text-teal-700 flex items-center justify-center shrink-0">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 7v5l3 3"/></svg>
              </span>
              SLA ระยะเวลาต่อ Stage
            </div>
            <div class="text-xs text-slate-400 mt-0.5">จำนวนวันที่ยอมให้ดีลค้างอยู่ในแต่ละขั้นตอนก่อนถือว่าเกิน SLA</div>
          </div>
          <div class="p-5">
            <div class="grid grid-cols-2 gap-4">
              <div v-for="s in slaStages" :key="s.key" class="flex flex-col gap-1.5">
                <label class="text-xs text-slate-500 font-medium">{{ s.label }}</label>
                <div class="flex items-center gap-2">
                  <input type="number" v-model.number="kpi[s.key]" min="1" max="365"
                    class="w-24 border border-slate-200 rounded-xl px-3 py-2 text-sm text-right outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white"/>
                  <span class="text-sm text-slate-500">วัน</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ─── Section 4: เกณฑ์ส่วนต่างราคา (หน้าวิเคราะห์ผลแพ้/ชนะ) — เพิ่ม 2026-09-25 ─── -->
        <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100">
          <div class="px-5 py-4 border-b border-slate-100">
            <div class="flex items-center gap-2 font-bold text-slate-700">
              <span class="w-8 h-8 rounded-lg bg-teal-50 text-teal-700 flex items-center justify-center shrink-0">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
              </span>
              เกณฑ์ส่วนต่างราคา (งานที่แพ้)
            </div>
            <div class="text-xs text-slate-400 mt-0.5">ราคาเราแพงกว่าผู้ชนะกี่ % — ใช้แบ่งกลุ่มในหน้า "วิเคราะห์ผลแพ้/ชนะ"</div>
          </div>
          <div class="p-5">
            <div class="flex flex-wrap gap-4">
              <div v-for="g in priceGapFields" :key="g.key" class="flex flex-col gap-1.5">
                <label class="text-xs text-slate-500 font-medium">{{ g.label }}</label>
                <div class="flex items-center gap-1.5">
                  <input type="number" v-model.number="kpi[g.key]" min="0.1" max="100" step="0.1"
                    class="w-24 border border-slate-200 rounded-xl px-3 py-2 text-sm text-right outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white"/>
                  <span class="text-sm text-slate-500">%</span>
                </div>
              </div>
              <div class="flex flex-col gap-1.5">
                <label class="text-xs text-slate-500 font-medium">ห่างมาก</label>
                <div class="flex items-center gap-1.5">
                  <div class="w-24 border border-slate-100 rounded-xl px-3 py-2 text-sm text-right bg-slate-50 text-slate-400">&gt; {{ kpi.price_gap_far }}</div>
                  <span class="text-sm text-slate-500">%</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Save KPI Settings -->
        <div class="flex justify-end">
          <button @click="saveKpiSettings" :disabled="savingKpi"
            class="inline-flex items-center justify-center gap-1.5 px-8 py-3 rounded-xl text-sm font-semibold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed min-w-[200px]">
            <span v-if="savingKpi">กำลังบันทึก…</span>
            <span v-else>บันทึกเกณฑ์ KPI และ SLA</span>
          </button>
        </div>

        </div>
      </main>
    </div>

    <app-modal ref="appModal"></app-modal>
  </template>
</div>

<script src="shared/vue.global.prod.js"></script>
<script src="shared/app.js?v=44"></script>
<script>
const { createApp } = Vue;

createApp({
  components: { AppNav, AppModal },
  data() {
    const cur = new Date().getFullYear();
    return {
      authReady: false,
      currentUser: null,
      modal: { type: null, data: null },

      /* ── Target section ── */
      selectedYear: cur,
      yearOptions: [cur - 1, cur, cur + 1],
      salesData: [],
      salesLoading: true,
      annualEdits: {},   // { userId: amount }
      monthEdits: {},    // { userId: { 1: amount, ... } }
      expandedUsers: {}, // { userId: true }
      savingTargets: false,
      thMonths: ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'],

      /* ── KPI thresholds ── */
      kpi: {
        win_rate_green: 60, win_rate_yellow: 40,
        achievement_green: 100, achievement_yellow: 70,
        sla_interest: 7, sla_send_pi: 7, sla_negotiating: 14, sla_deal_signed: 14,
        price_gap_near: 2, price_gap_mid: 5, price_gap_far: 10,
      },
      savingKpi: false,
      slaStages: [
        { key: 'sla_interest',    label: 'Interest (สนใจ)' },
        { key: 'sla_send_pi',     label: 'Send PI (เสนอราคา)' },
        { key: 'sla_negotiating', label: 'Negotiating (เจรจา)' },
        { key: 'sla_deal_signed', label: 'Deal Signed (ปิดดีล)' },
      ],
      priceGapFields: [
        { key: 'price_gap_near', label: 'เกือบชนะ ≤' },
        { key: 'price_gap_mid',  label: 'ห่างปานกลาง ≤' },
        { key: 'price_gap_far',  label: 'ห่างพอสมควร ≤' },
      ],
    };
  },

  async mounted() {
    try {
      const res = await apiCall('GET', 'api/auth.php?action=me');
      if (!res.success) { location.href = 'login.html'; return; }
      this.currentUser = res.data;
      if (!['admin','manager'].includes(this.currentUser.role)) {
        location.href = 'dashboard.html'; return;
      }
    } catch { location.href = 'login.html'; return; }
    this.authReady = true;
    await Promise.all([this.loadTargets(), this.loadKpiSettings()]);
  },

  methods: {
    ...SharedMethods,

    async loadTargets() {
      this.salesLoading = true;
      const r = await apiCall('GET', `api/targets.php?year=${this.selectedYear}`);
      if (r.success) {
        this.salesData = r.data.users;
        const ann = {}, mon = {};
        r.data.users.forEach(u => {
          ann[u.id] = u.annual_target ?? '';
          mon[u.id] = {};
          Object.entries(u.monthly_overrides || {}).forEach(([m, v]) => {
            mon[u.id][+m] = v || '';
          });
        });
        this.annualEdits = ann;
        this.monthEdits  = mon;
      }
      this.salesLoading = false;
    },

    async changeYear(y) {
      this.selectedYear = y;
      this.expandedUsers = {};
      await this.loadTargets();
    },

    toggleExpand(uid) {
      this.expandedUsers = { ...this.expandedUsers, [uid]: !this.expandedUsers[uid] };
    },

    async saveAllTargets() {
      this.savingTargets = true;
      const year    = this.selectedYear;
      const targets = [];

      this.salesData.forEach(u => {
        // Annual
        targets.push({ user_id: u.id, year, month: null, target_amount: this.annualEdits[u.id] || null });
        // Monthly overrides (1–12)
        for (let m = 1; m <= 12; m++) {
          const val = this.monthEdits[u.id]?.[m];
          targets.push({ user_id: u.id, year, month: m, target_amount: val || null });
        }
      });

      const r = await apiCall('POST', 'api/targets.php?action=save_batch', { targets });
      this.savingTargets = false;
      if (r.success) {
        await this.loadTargets(); // reload to reflect stored values
        await this.showAlert('บันทึกเป้าหมายทั้งหมดสำเร็จ', 'success');
      } else {
        await this.showAlert(r.message || 'เกิดข้อผิดพลาด', 'error');
      }
    },

    async loadKpiSettings() {
      const r = await apiCall('GET', 'api/kpi_settings.php');
      if (r.success) {
        Object.keys(this.kpi).forEach(k => {
          if (r.data[k] !== undefined) this.kpi[k] = +r.data[k];
        });
      }
    },

    async saveKpiSettings() {
      if (+this.kpi.win_rate_yellow >= +this.kpi.win_rate_green) {
        await this.showAlert('เกณฑ์เหลืองต้องน้อยกว่าเกณฑ์เขียว (Win Rate)', 'error'); return;
      }
      if (+this.kpi.achievement_yellow >= +this.kpi.achievement_green) {
        await this.showAlert('เกณฑ์เหลืองต้องน้อยกว่าเกณฑ์เขียว (Achievement)', 'error'); return;
      }
      if (!(+this.kpi.price_gap_near > 0 && +this.kpi.price_gap_near < +this.kpi.price_gap_mid && +this.kpi.price_gap_mid < +this.kpi.price_gap_far)) {
        await this.showAlert('เกณฑ์ส่วนต่างราคาต้องมากกว่า 0 และเรียงจากน้อยไปมาก (เกือบชนะ < ปานกลาง < พอสมควร)', 'error'); return;
      }
      this.savingKpi = true;
      const r = await apiCall('POST', 'api/kpi_settings.php', this.kpi);
      this.savingKpi = false;
      if (r.success) await this.showAlert('บันทึกเกณฑ์ KPI สำเร็จ', 'success');
      else await this.showAlert(r.message || 'เกิดข้อผิดพลาด', 'error');
    },
  },
}).mount('#app');
</script>
</body>
</html>
