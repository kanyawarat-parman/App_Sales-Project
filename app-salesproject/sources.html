<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แหล่งที่มางานประมูล</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="shared/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css?v=16">
<!-- DataTables (ใช้เฉพาะหน้านี้ — jQuery plugin ควบคุมตารางแยกจาก Vue โดยเจตนา เหมือน calendars.html) -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<style>
  #sourcesTable_wrapper { padding: 0 1rem 1rem; }
  #sourcesTable_wrapper .dataTables_length,
  #sourcesTable_wrapper .dataTables_filter { float: none; margin-bottom: .75rem; }
  #sourcesTable_wrapper .dataTables_length label,
  #sourcesTable_wrapper .dataTables_filter label { display: flex; align-items: center; gap: .5rem; margin: 0; font-size: .8125rem; color: #64748b; white-space: nowrap; }
  #sourcesTable_wrapper .dataTables_filter input { flex: 1; min-width: 0; }
  @media (min-width: 640px) {
    #sourcesTable_wrapper { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem 1.5rem; }
    #sourcesTable_wrapper .dataTables_length,
    #sourcesTable_wrapper .dataTables_filter,
    #sourcesTable_wrapper .dataTables_info,
    #sourcesTable_wrapper .dataTables_paginate { margin-bottom: 0; }
    #sourcesTable_wrapper > table { width: 100%; }
  }
  #sourcesTable_wrapper .dataTables_filter input,
  #sourcesTable_wrapper .dataTables_length select { border-radius: .5rem; border: 1px solid #e2e8f0; padding: .375rem .75rem; outline: none; }
  #sourcesTable_wrapper .dataTables_filter input:focus,
  #sourcesTable_wrapper .dataTables_length select:focus { border-color: #2dd4bf; box-shadow: 0 0 0 2px #ccfbf1; }
  #sourcesTable_wrapper .dataTables_info { font-size: .8125rem; color: #94a3b8; }
  #sourcesTable_wrapper .dataTables_paginate { display: flex; gap: .25rem; flex-wrap: wrap; }
  #sourcesTable_wrapper .dataTables_paginate .paginate_button.current { background: #0f766e !important; color: #fff !important; border-radius: .375rem; border: none !important; }
  #sourcesTable_wrapper .dataTables_paginate .paginate_button { border-radius: .375rem; padding: .25rem .6rem; }
  #sourcesTable thead th { background: #f8fafc; }
</style>
</head>
<body class="bg-slate-50 font-sans">
<div id="app">
  <div v-if="!authReady" class="min-h-screen flex items-center justify-center">
    <div class="spinner w-12 h-12"></div>
  </div>

  <template v-else>
    <app-nav :user="currentUser" page="sources" ref="nav"></app-nav>

    <div class="min-h-screen flex flex-col">
      <header class="bg-white border-b border-slate-100 px-5 py-3 flex items-center gap-3 shadow-sm min-h-[64px] flex-wrap">
        <h1 class="text-base font-bold text-slate-700 flex items-center gap-2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/>
          </svg>
          แหล่งที่มางานประมูล
        </h1>
      </header>

      <main class="flex-1 w-full max-w-[1600px] mx-auto px-4 pb-24 pt-5 md:px-6 md:py-6">

        <p class="text-sm text-slate-500 mb-4 max-w-[720px]">รายชื่อแหล่งที่มางานประมูลทั้งหมดในระบบ (เช่น e-GP, เว็บซื้อข้อมูล) — ใช้เป็นตารางแม่ให้หน้าตั้งค่าเวรและหน้าตัดสินใจดึงชื่อ/ปฏิทินไปใช้ ไม่ต้อง hardcode ในโค้ด เพิ่มแหล่งใหม่ได้จากหน้านี้โดยตรง</p>

        <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100">
          <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100 gap-3 flex-wrap">
            <span class="font-bold text-slate-700 flex items-center gap-2">
              <span class="w-8 h-8 rounded-lg bg-teal-50 text-teal-700 flex items-center justify-center shrink-0">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
              </span>
              แหล่งที่มางานประมูลในระบบ
            </span>
            <div class="flex items-center gap-2">
              <button @click="exportSources"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Export Excel
              </button>
              <button @click="openSourceModal(null)"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer">
                + เพิ่มแหล่งที่มางานประมูล
              </button>
            </div>
          </div>

          <div v-if="loading" class="flex flex-col items-center justify-center py-12 text-slate-400">
            <div class="spinner w-8 h-8 mx-auto"></div>
          </div>
          <div v-show="!loading" class="p-4 overflow-x-auto">
            <!-- ตารางนี้ DataTables (jQuery) เป็นผู้คุมทั้งหมด เหมือน calendars.html — ห้ามใส่ v-for ในนี้เด็ดขาด -->
            <table id="sourcesTable" class="display w-full min-w-[640px] text-sm"></table>
          </div>
        </div>
      </main>
    </div>

    <app-modal ref="appModal"></app-modal>

    <!-- MODAL: สร้าง/แก้ไขแหล่งที่มางานประมูล -->
    <div class="fixed inset-0 bg-black/50 flex items-start justify-center z-[1000] p-4 overflow-y-auto"
      v-if="modal.type" @click.self="closeModal">
      <div v-if="modal.type==='source'" class="bg-white rounded-2xl w-full max-w-[480px] shadow-2xl overflow-hidden my-8">
        <div class="bg-teal-600 text-white px-6 py-5 flex items-center justify-between">
          <h3 class="font-bold text-lg">{{ sourceForm.isNew ? 'เพิ่มแหล่งที่มางานประมูล' : 'แก้ไขแหล่งที่มางานประมูล' }}</h3>
          <button class="text-white/80 hover:text-white bg-transparent border-0 text-2xl cursor-pointer leading-none"
            @click="closeModal">×</button>
        </div>
        <div class="p-5 flex flex-col gap-4">
          <div class="flex flex-col gap-1">
            <label class="block text-sm font-semibold text-slate-600">รหัสแหล่งงาน (a-z, 0-9, _ เท่านั้น) <span class="text-red-500">*</span></label>
            <input v-model="sourceForm.source_type" :disabled="!sourceForm.isNew" placeholder="เช่น vendor_x"
              class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white font-mono disabled:bg-slate-50 disabled:text-slate-400">
            <p v-if="!sourceForm.isNew" class="text-xs text-slate-400">รหัสแก้ไขไม่ได้หลังสร้างแล้ว เพราะผูกกับข้อมูลประกาศที่มีอยู่แล้ว — แก้ได้แค่ชื่อแสดงผล/ปฏิทิน/สถานะเปิดใช้งาน</p>
          </div>
          <div class="flex flex-col gap-1">
            <label class="block text-sm font-semibold text-slate-600">ชื่อแสดงผล <span class="text-red-500">*</span></label>
            <input v-model="sourceForm.label" placeholder="เช่น เว็บ Vendor X"
              class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
          </div>
          <div class="flex flex-col gap-1">
            <label class="block text-sm font-semibold text-slate-600">ปฏิทินวันประกาศ</label>
            <select v-model="sourceForm.calendar_code"
              class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
              <option value="">— ไม่ระบุ —</option>
              <option v-for="cal in calendarsList" :key="cal.code" :value="cal.code">{{ cal.name }}</option>
            </select>
            <p class="text-xs text-slate-400">ใช้เช็คว่าวันนี้แหล่งนี้ประกาศงานหรือไม่ — ตั้งค่าเวรของแหล่งนี้ทำที่หน้า <a href="rotation-settings.html" class="text-blue-600 hover:underline">ตั้งค่าวิธีคิดเวร</a></p>
          </div>
          <label class="flex items-center gap-2.5 cursor-pointer px-3 py-2.5 rounded-lg border-2 transition-all"
                 :class="sourceForm.is_active ? 'border-teal-500 bg-teal-50' : 'border-slate-200 bg-white'">
            <input type="checkbox" v-model="sourceForm.is_active" class="shrink-0 accent-teal-600">
            <div>
              <div class="text-sm font-semibold text-slate-700">เปิดใช้งาน</div>
              <div class="text-xs text-slate-500">ปิดไว้ถ้าเลิกใช้แหล่งนี้แล้ว แต่ไม่อยากลบข้อมูลเก่า — ปิดแล้วจะไม่โผล่ใน dropdown เลือกแหล่งงาน</div>
            </div>
          </label>
        </div>
        <div class="px-5 py-4 border-t border-slate-100 flex items-center justify-end gap-2">
          <button @click="closeModal"
            class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer">
            ยกเลิก
          </button>
          <button @click="submitSource"
            class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer">
            บันทึก
          </button>
        </div>
      </div>
    </div>
  </template>
</div>

<script src="shared/vue.global.prod.js"></script>
<script src="shared/app.js?v=33"></script>
<script>
const { createApp } = Vue;
createApp({
  components: { AppNav, AppModal },
  data() {
    return {
      authReady: false,
      currentUser: null,
      loading: false,
      sourcesList: [],
      calendarsList: [],
      modal: { type: null, data: null },
      sourceForm: { isNew: true, source_type: '', label: '', calendar_code: '', is_active: true },
    };
  },
  async mounted() {
    try {
      const res = await apiCall('GET', 'api/auth.php?action=me');
      if (!res.success) { window.location.href = 'login.html'; return; }
      this.currentUser = res.data;
      if (!['admin','salesadmin'].includes(this.currentUser.role)) {
        window.location.href = 'dashboard.html'; return;
      }
    } catch { window.location.href = 'login.html'; return; }
    this.authReady = true;
    await this.$nextTick(); // รอให้ Vue วาง <table id="sourcesTable"> ลง DOM ก่อน ค่อยให้ jQuery จับ
    this.bindTableEvents();
    await this.loadCalendars(); // โหลดก่อน loadSources() เสมอ เพราะตาราง render ใช้ calendarName() แปลง code เป็นชื่อ ถ้าโหลดพร้อมกันอาจ render ก่อน calendarsList พร้อม
    await this.loadSources();
  },
  methods: {
    ...SharedMethods,

    esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); },

    calendarName(code) {
      return this.calendarsList.find(c => c.code === code)?.name || code;
    },

    /** ผูก event ปุ่มแก้ไข/ลบ "ครั้งเดียว" ตอน mounted ด้วย delegated listener บน #sourcesTable — เหมือน calendars.html */
    bindTableEvents() {
      const self = this;
      $('#sourcesTable').on('click', '.edit-src-btn', function () {
        const src = self.sourcesList.find(s => s.source_type === $(this).data('id'));
        if (src) self.openSourceModal(src);
      });
      $('#sourcesTable').on('click', '.delete-src-btn', function () {
        const src = self.sourcesList.find(s => s.source_type === $(this).data('id'));
        if (src) self.deleteSource(src);
      });
    },

    initDataTable() {
      const self = this;
      $('#sourcesTable').DataTable({
        data: this.sourcesList,
        destroy: true,
        autoWidth: false,
        language: {
          search: 'ค้นหา:',
          lengthMenu: 'แสดง _MENU_ รายการ',
          info: 'แสดง _START_ ถึง _END_ จาก _TOTAL_ รายการ',
          infoEmpty: 'ไม่มีข้อมูล',
          infoFiltered: '(กรองจาก _MAX_ รายการทั้งหมด)',
          zeroRecords: 'ไม่พบแหล่งงานที่ตรงกับคำค้นหา',
          paginate: { previous: 'ก่อนหน้า', next: 'ถัดไป' },
        },
        columns: [
          { data: 'source_type', title: 'รหัส', render: d => `<span class="font-mono text-slate-500">${self.esc(d)}</span>` },
          { data: 'label', title: 'ชื่อแสดงผล', render: d => `<span class="font-medium text-slate-800">${self.esc(d)}</span>` },
          {
            data: 'calendar_code', title: 'ปฏิทินวันประกาศ', orderable: false,
            render: d => d
              ? `<span class="inline-block text-[10px] font-semibold px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-600">${self.esc(self.calendarName(d))}</span>`
              : `<span class="text-xs text-slate-300">— ไม่ระบุ —</span>`,
          },
          {
            data: 'is_active', title: 'สถานะ', orderable: false,
            render: d => Number(d)
              ? `<span class="inline-block text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700">เปิดใช้งาน</span>`
              : `<span class="inline-block text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-400">ปิดใช้งาน</span>`,
          },
          {
            data: null, title: 'จัดการ', orderable: false, className: 'text-right',
            render: (data, type, row) => {
              let html = `<a href="rotation-settings.html?source=${encodeURIComponent(row.source_type)}" class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 no-underline">ตั้งค่าเวร</a> `;
              html += `<button class="edit-src-btn inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer" data-id="${self.esc(row.source_type)}">แก้ไข</button> `;
              html += `<button class="delete-src-btn inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-semibold bg-white ring-1 ring-rose-100 text-rose-500 hover:bg-rose-50 border-0 cursor-pointer" data-id="${self.esc(row.source_type)}">ลบ</button>`;
              return html;
            },
          },
        ],
      });
    },

    exportSources() {
      const headers = ['ชื่อแสดงผล', 'รหัส', 'ปฏิทินวันประกาศ', 'สถานะ'];
      // export ตามลำดับ/ตัวกรองที่ DataTables แสดงอยู่ตอนนี้ (search:'applied') ไม่ใช่ข้อมูลดิบทั้งหมดเสมอไป — เหมือน calendars.html
      const rows = $('#sourcesTable').DataTable().rows({ search: 'applied' }).data().toArray().map(src => [
        src.label,
        src.source_type,
        src.calendar_code ? this.calendarName(src.calendar_code) : '— ไม่ระบุ —',
        Number(src.is_active) ? 'เปิดใช้งาน' : 'ปิดใช้งาน',
      ]);
      this.exportExcel('แหล่งที่มางานประมูล', headers, rows);
    },

    async loadSources() {
      this.loading = true;
      const r = await apiCall('GET', 'api/sources.php?action=list_all');
      this.sourcesList = r.success ? r.data : [];
      this.loading = false;
      await this.$nextTick();
      this.initDataTable();
    },

    async loadCalendars() {
      const r = await apiCall('GET', 'api/calendars.php?action=list');
      this.calendarsList = r.success ? r.data : [];
    },

    openSourceModal(src) {
      this.sourceForm = src
        ? { isNew: false, source_type: src.source_type, label: src.label, calendar_code: src.calendar_code || '', is_active: !!Number(src.is_active) }
        : { isNew: true, source_type: '', label: '', calendar_code: '', is_active: true };
      this.modal = { type: 'source', data: src };
    },

    async submitSource() {
      if (!this.sourceForm.source_type || !this.sourceForm.label) {
        await this.showAlert('กรุณากรอกข้อมูลให้ครบ', 'error'); return;
      }
      const res = this.sourceForm.isNew
        ? await apiCall('POST', 'api/sources.php?action=create', this.sourceForm)
        : await apiCall('POST', 'api/sources.php?action=update', this.sourceForm);
      if (res.success) {
        this.closeModal();
        await this.loadSources();
        await this.showAlert(this.sourceForm.isNew ? 'สร้างแหล่งงานเรียบร้อย' : 'บันทึกแหล่งงานเรียบร้อย', 'success');
      } else {
        await this.showAlert(res.message, 'error');
      }
    },

    async deleteSource(src) {
      const ok = await this.showConfirm('ลบแหล่งที่มางานประมูล?', `ลบแหล่งงาน "${src.label}" ใช่ไหม?`, 'ลบ');
      if (!ok) return;
      const r = await apiCall('POST', 'api/sources.php?action=delete', { source_type: src.source_type });
      if (r.success) {
        await this.loadSources();
        await this.showAlert('ลบแหล่งงานเรียบร้อย', 'success');
      } else {
        await this.showAlert(r.message, 'error');
      }
    },
  },
}).mount('#app');
</script>
</body>
</html>
