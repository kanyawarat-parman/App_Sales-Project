<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หน่วยงาน/ลูกค้า</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="shared/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css?v=16">
</head>
<body class="bg-slate-50 font-sans">
<div id="app">
  <div v-if="!authReady" class="min-h-screen flex items-center justify-center">
    <div class="spinner w-12 h-12"></div>
  </div>

  <template v-else>
    <app-nav :user="currentUser" page="accounts" ref="nav"></app-nav>

    <div class="md:ml-60 min-h-screen flex flex-col">
      <header class="bg-white border-b border-slate-100 px-5 py-2.5 flex items-center gap-3 shadow-sm min-h-[56px]">
        <h1 class="text-base font-bold text-slate-700 flex items-center gap-2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/>
          </svg>
          หน่วยงาน/ลูกค้า
        </h1>
      </header>

      <main class="flex-1 w-full max-w-[1600px] mx-auto px-4 pb-24 pt-5 md:px-6 md:py-6">
        <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100">
          <!-- แท็บ: ลูกค้าทั้งหมด / รอเปิดหน้าบัญชี ERP (ยืนยันจากผู้ใช้ 2026-09-28) — เปิดตรงจากแจ้งเตือนด้วย ?tab=erp_pending -->
          <div class="flex gap-6 px-5 pt-3 border-b border-slate-100 text-[15px]">
            <button type="button" @click="setTab('all')"
              class="pb-2.5 bg-transparent border-0 border-b-2 cursor-pointer font-semibold"
              :class="activeTab==='all' ? 'border-teal-700 text-teal-700' : 'border-transparent text-slate-500 hover:text-slate-700'">
              ลูกค้าทั้งหมด
            </button>
            <button type="button" @click="setTab('erp_pending')"
              class="pb-2.5 bg-transparent border-0 border-b-2 cursor-pointer font-semibold inline-flex items-center gap-1.5"
              :class="activeTab==='erp_pending' ? 'border-amber-500 text-amber-700' : 'border-transparent text-slate-500 hover:text-slate-700'">
              รอเปิดหน้าบัญชี
              <span v-if="erpPending.length" class="px-2 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800">{{ erpPending.length }}</span>
            </button>
            <!-- รายงานลูกค้าชื่อคล้ายกัน (Duplicate Report — ยืนยันจากผู้ใช้ 2026-09-30) เฉพาะธุรการขาย / admin -->
            <button v-if="canChangeOwner" type="button" @click="setTab('similar')"
              class="pb-2.5 bg-transparent border-0 border-b-2 cursor-pointer font-semibold inline-flex items-center gap-1.5"
              :class="activeTab==='similar' ? 'border-rose-500 text-rose-700' : 'border-transparent text-slate-500 hover:text-slate-700'">
              ชื่อคล้ายกัน
              <span v-if="dupOpenCount" class="px-2 py-0.5 rounded-full text-xs font-bold bg-rose-100 text-rose-700">{{ dupOpenCount }}</span>
            </button>
          </div>

          <!-- แท็บชื่อคล้ายกัน: คู่ลูกค้าที่อาจเป็นรายเดียวกัน (กฎเดียวกับตอนสร้างลูกค้า) — ไม่ซ้ำ = ซ่อนถาวร / ซ้ำจริง = Export ส่งรวม -->
          <div v-if="activeTab==='similar'">
            <div class="px-5 py-3 border-b border-slate-100 flex items-start justify-between gap-3 flex-wrap">
              <div class="text-sm text-slate-500 leading-relaxed">
                <div>ระบบหาคู่ลูกค้าที่ชื่อคล้ายกันด้วยกฎเดียวกับตอนสร้างลูกค้า — ตรวจทีละคู่</div>
                <div>ทั้งสองฝั่งอาจเป็นลูกค้ารายเดียวกัน — ไม่ได้แปลว่าฝั่งขวาซ้ำฝั่งซ้าย · "ถ้าซ้ำ — เก็บรายนี้" = มีรหัส ERP › ดีล+ผู้ติดต่อมากกว่า › สร้างก่อน</div>
                <div>เป็นคนละราย กด <b class="text-slate-700">"ไม่ใช่ — คนละราย"</b> คู่นั้นจะหายไป · ซ้ำจริง กด <b class="text-slate-700">"ใช่ — ซ้ำ"</b> แล้วเลือกรายที่ต้องการเก็บ (ดีล ประกาศ ผู้ติดต่อ รหัส ERP ย้ายมาครบ)</div>
                <!-- วิธีหาคู่ ซ่อนไว้ กดอ่านเมื่อสงสัย (ยืนยันจากผู้ใช้ 2026-09-30) -->
                <button type="button" @click="dupHelpOpen = !dupHelpOpen"
                  class="mt-1 inline-flex items-center gap-1.5 text-sm font-semibold text-teal-700 hover:text-teal-800 bg-transparent border-0 cursor-pointer p-0">
                  <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="7.5" r="0.6" fill="currentColor"/></svg>
                  {{ dupHelpOpen ? 'ซ่อนวิธีหาคู่' : 'ระบบหาคู่ที่อาจซ้ำอย่างไร?' }}
                </button>
              </div>
              <div class="flex items-center gap-3 flex-wrap">
                <label class="inline-flex items-center gap-1.5 text-sm text-slate-600 cursor-pointer">
                  <input type="checkbox" v-model="dupShowIgnored" @change="loadDupPairs" class="accent-teal-600 w-4 h-4">
                  แสดงคู่ที่ยืนยันแล้วว่าไม่ซ้ำ
                </label>
                <button v-if="dupPairs.length" @click="exportDupPairs" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer whitespace-nowrap">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                  Export Excel
                </button>
              </div>
            </div>
            <!-- วิธีหาคู่ — ต้องตรงกับ accountNameMatchDetail() + เลขภาษี ใน includes/account_helper.php (ยืนยันจากผู้ใช้ 2026-09-30) -->
            <div v-if="dupHelpOpen" class="px-5 py-3 border-b border-slate-100 text-sm text-slate-500 leading-relaxed">
              <div><b class="text-slate-700">ระบบหาคู่ที่อาจซ้ำอย่างไร</b> — ก่อนเทียบ ตัดคำว่า บริษัท / จำกัด / มหาชน / หจก. / Co.,Ltd. ช่องว่าง จุด และวงเล็บออก แล้วจับคู่เมื่อเข้าข้อใดข้อหนึ่ง</div>
              <ol class="m-0 mt-1 pl-5 list-decimal">
                <li><b class="text-slate-700">ชื่อเหมือนกันหลังตัดคำ</b> เช่น "บริษัท เอ คลาส จำกัด" กับ "เอคลาส"</li>
                <li><b class="text-slate-700">เลขภาษีเดียวกัน</b> แม้ชื่อต่างกัน (เฉพาะเอกชน — หน่วยงานราชการใช้เลขของหน่วยงานแม่ร่วมกันได้)</li>
                <li><b class="text-slate-700">ชื่อหนึ่งอยู่ในอีกชื่อ</b> (ยาว 4 ตัวขึ้นไป) เช่น "มหาวิทยาลัยเกษตรศาสตร์" กับ "มหาวิทยาลัยเกษตรศาสตร์ (มก.) กรุงเทพฯ"</li>
                <li><b class="text-slate-700">สะกดต่าง 1–2 ตัว</b> เช่น "กอริลลาพาเลซ" กับ "กอริลลาพาเลส"</li>
                <li><b class="text-slate-700">ต้นชื่อเหมือนกัน ต่างแค่ท้ายไม่เกิน 3 ตัว</b> เช่น "โกลบอลไทซอน" กับ "โกลบอลไทยซอนพรีซิซั่น"</li>
              </ol>
              <div class="mt-1">ไม่สนประเภทราชการ/เอกชน เพราะส่วนใหญ่ที่ต่างกันคือเลือกประเภทผิด · กฎชุดเดียวกับที่ใช้เตือนตอนสร้างลูกค้า</div>
            </div>
            <div v-if="dupLoading" class="flex flex-col items-center justify-center py-12 text-slate-400">
              <div class="spinner w-8 h-8 mx-auto"></div>
            </div>
            <div v-else-if="!dupPairs.length" class="flex flex-col items-center justify-center py-14 text-slate-400">
              <p class="text-sm">ไม่มีคู่ลูกค้าที่ชื่อคล้ายกันที่ยังไม่ได้ตรวจ</p>
            </div>
            <div v-else class="p-4 flex flex-col gap-3">
              <div v-for="p in dupPairs" :key="dupKey(p)" class="rounded-xl ring-1 p-3"
                :class="p.ignored ? 'ring-slate-200 bg-slate-50' : 'ring-rose-200 bg-white'">
                <div class="flex items-center gap-2 flex-wrap mb-2">
                  <span class="px-2 py-0.5 rounded-full text-xs font-bold" :class="p.ignored ? 'bg-slate-200 text-slate-600' : 'bg-rose-100 text-rose-700'">{{ dupReasonLabel(p.reason) }}</span>
                  <span v-if="p.ignored" class="text-sm text-slate-500">ยืนยันแล้วว่าไม่ซ้ำ<span v-if="p.ignore_note"> — {{ p.ignore_note }}</span></span>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                  <div v-for="(acc, side) in [p.a, p.b]" :key="acc.id" class="flex items-start gap-3 p-3 rounded-lg bg-slate-50 ring-1 ring-slate-100">
                    <div class="flex-1 min-w-0">
                      <!-- สร้างก่อน/ทีหลัง + รายที่แนะนำให้เก็บถ้าซ้ำจริง (Master record — 2026-09-30) -->
                      <div class="flex items-center gap-2 flex-wrap mb-1 text-xs">
                        <span class="text-slate-500">{{ side === 0 ? 'สร้างก่อน' : 'สร้างทีหลัง' }} · {{ formatDateThai(acc.created_at) }}</span>
                        <span v-if="!p.ignored && Number(p.keep_id) === Number(acc.id)" class="px-1.5 py-0.5 rounded font-bold bg-emerald-100 text-emerald-700">ถ้าซ้ำ — เก็บรายนี้</span>
                      </div>
                      <div class="flex items-center gap-2 flex-wrap">
                        <span class="font-mono text-xs text-teal-700 bg-white rounded px-1.5 py-0.5">{{ acc.account_code }}</span>
                        <span class="text-[11px] font-bold px-2 py-0.5 rounded-full" :class="acc.account_type==='government' ? 'bg-amber-100 text-amber-700' : 'bg-sky-100 text-sky-700'">{{ acc.account_type==='government' ? 'ราชการ' : 'เอกชน' }}</span>
                      </div>
                      <div class="font-semibold text-slate-800 mt-1">{{ acc.name }}</div>
                      <div class="text-sm text-slate-500 mt-0.5">
                        ผู้ดูแล: {{ acc.owner_name || 'ลูกค้าส่วนกลาง' }} · ERP: {{ acc.erp_codes || '-' }} · ดีล {{ acc.deal_count }} · ผู้ติดต่อ {{ acc.contact_count }}
                      </div>
                    </div>
                    <button @click="openDupAccount(acc)" class="shrink-0 px-3 py-1.5 rounded-lg text-sm font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer">ดู</button>
                  </div>
                </div>
                <div class="flex items-center gap-2 mt-2 flex-wrap">
                  <template v-if="p.ignored">
                    <button @click="unignoreDupPair(p)" class="px-3 py-1.5 rounded-lg text-sm font-semibold bg-white ring-1 ring-slate-300 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer">ยกเลิก — กลับมาตรวจใหม่</button>
                  </template>
                  <template v-else-if="dupNoteKey === dupKey(p)">
                    <input v-model="dupNote" placeholder="เหตุผล (ไม่บังคับ) เช่น คนละคณะ / หน่วยงานย่อยออกบิลแยก" maxlength="255"
                      class="flex-1 min-w-[220px] border border-slate-200 rounded-lg px-3 py-1.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
                    <button @click="ignoreDupPair(p)" class="px-3 py-1.5 rounded-lg text-sm font-semibold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer">ยืนยันว่าไม่ซ้ำ</button>
                    <button @click="dupNoteKey = ''" class="px-3 py-1.5 rounded-lg text-sm font-semibold bg-white ring-1 ring-slate-200 text-slate-600 border-0 cursor-pointer">ยกเลิก</button>
                  </template>
                  <!-- ถามทีละเรื่อง: ซ้ำไหม → (ถ้าซ้ำ) เลือกรายที่เก็บในหน้าต่างถัดไป (ยืนยันจากผู้ใช้ 2026-09-30) — ปุ่มเท่ากัน ธุรการตัดสินเอง -->
                  <template v-else>
                    <span class="font-semibold text-slate-700 mr-1">คู่นี้เป็นลูกค้ารายเดียวกันหรือไม่?</span>
                    <button @click="dupNoteKey = dupKey(p); dupNote = ''"
                      class="px-3 py-1.5 rounded-lg text-sm font-semibold bg-white ring-1 ring-slate-300 text-slate-700 hover:bg-slate-50 border-0 cursor-pointer">ไม่ใช่ — คนละราย</button>
                    <button @click="openMergeDialog(p)"
                      class="px-3 py-1.5 rounded-lg text-sm font-semibold bg-white ring-1 ring-slate-300 text-slate-700 hover:bg-slate-50 border-0 cursor-pointer">ใช่ — ซ้ำ</button>
                  </template>
                </div>
              </div>
            </div>
          </div>

          <!-- แท็บรอเปิดหน้าบัญชี: ดีลที่ชนะ/ปิดดีลแล้ว แต่ลูกค้ายังไม่มีรหัส ERP — คำนวณจากข้อมูลจริง ผูกรหัสแล้วหายเอง (includes/erp_pending_helper.php) -->
          <div v-if="activeTab==='erp_pending'">
            <div class="px-5 py-3 text-sm text-slate-500 border-b border-slate-100 flex items-center justify-between gap-3 flex-wrap">
              <span>
                ก่อนออก SO ต้องมีหน้าบัญชีลูกค้าใน ERP — แจ้งบัญชีเปิดหน้าบัญชี แล้วผูกรหัส ERP ให้ลูกค้า รายการจะหายไปเอง
                <span v-if="isSale"> · แสดงเฉพาะดีลของคุณ</span>
              </span>
              <button v-if="erpPending.length" @click="exportErpPending" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer whitespace-nowrap">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Export Excel
              </button>
            </div>
            <div v-if="erpPendingLoading" class="flex flex-col items-center justify-center py-12 text-slate-400">
              <div class="spinner w-8 h-8 mx-auto"></div>
            </div>
            <div v-else-if="!erpPending.length" class="flex flex-col items-center justify-center py-14 text-slate-400">
              <p class="text-sm">ไม่มีลูกค้าที่รอเปิดหน้าบัญชี</p>
            </div>
            <div v-else class="overflow-x-auto">
              <table class="w-full border-collapse text-sm">
                <thead>
                  <tr class="bg-slate-50">
                    <th class="px-4 py-3 text-left text-[.75rem] font-bold text-slate-500 uppercase tracking-wide whitespace-nowrap border-b-2 border-slate-200">ลูกค้า</th>
                    <th class="px-4 py-3 text-left text-[.75rem] font-bold text-slate-500 uppercase tracking-wide whitespace-nowrap border-b-2 border-slate-200">ดีล/งานที่ชนะ</th>
                    <th class="px-4 py-3 text-left text-[.75rem] font-bold text-slate-500 uppercase tracking-wide whitespace-nowrap border-b-2 border-slate-200">Sale</th>
                    <th class="px-4 py-3 text-right text-[.75rem] font-bold text-slate-500 uppercase tracking-wide whitespace-nowrap border-b-2 border-slate-200">มูลค่า</th>
                    <th class="px-4 py-3 text-center text-[.75rem] font-bold text-slate-500 uppercase tracking-wide whitespace-nowrap border-b-2 border-slate-200">รอมาแล้ว</th>
                    <th class="px-4 py-3 border-b-2 border-slate-200"></th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-for="d in erpPending" :key="d.pipeline_item_id" class="border-b border-slate-100 hover:bg-slate-50/50">
                    <td class="px-4 py-3">
                      <template v-if="d.account_id">
                        <span class="font-mono text-xs text-teal-700 bg-teal-50 rounded px-1.5 py-0.5 whitespace-nowrap">{{ d.account_code }}</span>
                        <div class="font-medium text-slate-800 mt-1">{{ d.account_name }}</div>
                      </template>
                      <span v-else class="font-semibold text-amber-700">ยังไม่ผูกลูกค้า</span>
                    </td>
                    <td class="px-4 py-3">
                      <div class="text-slate-800">{{ d.title }}</div>
                      <div class="text-xs text-slate-500 mt-0.5">{{ d.project_code }} · {{ d.source_type==='ebidding' ? 'ชนะประมูล' : 'ปิดดีล' }} {{ formatDateThai(d.won_at) }}</div>
                    </td>
                    <td class="px-4 py-3 text-slate-600">{{ d.sale_name }}</td>
                    <td class="px-4 py-3 text-right text-slate-700 whitespace-nowrap">{{ d.value ? Number(d.value).toLocaleString('th-TH', { maximumFractionDigits: 0 }) : '-' }}</td>
                    <td class="px-4 py-3 text-center whitespace-nowrap font-bold" :class="d.days_waiting > 7 ? 'text-red-600' : 'text-slate-700'">{{ d.days_waiting }} วัน</td>
                    <td class="px-4 py-3 text-right whitespace-nowrap">
                      <button v-if="d.account_id" @click="openPendingAccount(d)"
                        class="inline-flex items-center px-3 py-1.5 rounded-lg text-xs font-semibold border-0 cursor-pointer"
                        :class="canEditErp ? 'bg-teal-700 hover:bg-teal-800 text-white' : 'bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50'">
                        {{ canEditErp ? 'ผูกรหัส ERP' : 'ดูลูกค้า' }}
                      </button>
                      <a v-else :href="d.source_type==='ebidding' ? 'bid-pipeline.html' : 'sales-pipeline.html'"
                        class="inline-flex items-center px-3 py-1.5 rounded-lg text-xs font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 no-underline">
                        ไปผูกลูกค้าในดีล
                      </a>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <template v-if="activeTab==='all'">
          <div class="flex items-center justify-between gap-3 px-5 py-4 border-b border-slate-100 flex-wrap">
            <span class="font-bold text-slate-700 flex items-center gap-1.5">
              <svg class="w-4 h-4 text-slate-300 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/></svg>
              รายชื่อหน่วยงาน/บริษัท
            </span>
            <div class="flex items-center gap-2 flex-wrap">
              <!-- ตัวกรองเบอร์เก่าที่ยังไม่ใช่รูปแบบใหม่ (ลูกค้าหรือผู้ติดต่อ) — ผู้ใช้แก้เองจากหน้าจอ (ยืนยันจากผู้ใช้ 2026-09-28) -->
              <button v-if="phoneFixCount || phoneFixOnly" type="button" @click="phoneFixOnly = !phoneFixOnly"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold border-0 cursor-pointer whitespace-nowrap"
                :class="phoneFixOnly ? 'bg-amber-500 text-white' : 'bg-amber-50 ring-1 ring-amber-200 text-amber-800 hover:bg-amber-100'">
                เบอร์ต้องแก้ไข {{ phoneFixCount }}
              </button>
              <!-- ตัวกรองผู้ดูแลลูกค้า (Account Owner — 2026-09-30) ไม่ซ่อนลูกค้า แค่กรองดู — sale เริ่มที่ "ลูกค้าของฉัน" / อื่นๆ เริ่มที่ "ทั้งหมด" -->
              <select v-model="ownerFilter"
                class="border border-slate-200 rounded-xl px-3 py-1.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white cursor-pointer">
                <option value="all">ผู้ดูแล: ทั้งหมด</option>
                <option v-if="isSale" value="mine">ลูกค้าของฉัน</option>
                <option value="central">ลูกค้าส่วนกลาง</option>
                <option v-for="u in salesUsers" :key="u.id" :value="String(u.id)">{{ u.full_name }}</option>
              </select>
              <!-- ช่องค้นหากว้างพอเห็นคำแนะนำครบ + ไอคอนแว่นขยายแบบเดียวกับหน้าอื่น (ผู้ใช้แจ้งว่าแคบ 2026-09-30) -->
              <div class="relative w-full sm:w-80">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input v-model="searchQuery" placeholder="ค้นหาชื่อ / รหัสลูกค้า / รหัส ERP / เบอร์"
                  class="w-full border border-slate-200 rounded-xl pl-9 pr-3.5 py-1.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
              </div>
              <button v-if="filteredAccounts.length" @click="exportAccounts" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer whitespace-nowrap">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Export Excel
              </button>
              <button @click="openAccountModal(null)"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer whitespace-nowrap">
                + เพิ่มหน่วยงาน
              </button>
            </div>
          </div>
          <!-- คำอธิบายผู้ดูแลลูกค้า (Account Owner) — สีเทาไม่มีกรอบ = คำอธิบาย (ยืนยันจากผู้ใช้ 2026-09-30) -->
          <div class="px-5 py-3 border-b border-slate-100 text-sm text-slate-500 leading-relaxed">
            <div><b class="text-slate-700">ผู้ดูแล</b> = Sale ที่ดูแลลูกค้ารายนี้ · <b class="text-slate-700">ลูกค้าส่วนกลาง</b> = ยังไม่มีผู้ดูแล เช่น ลูกค้าจากงานประมูลที่มอบหมายตามเวร</div>
            <div>ทุกคนเห็นและสร้างดีลกับลูกค้าทุกรายได้ · ลูกค้าที่ Sale สร้างเองมีผู้ดูแลเป็น Sale คนนั้น · เปลี่ยนผู้ดูแลได้ที่ธุรการขาย / admin</div>
          </div>
          <div>
            <div v-if="loading" class="flex flex-col items-center justify-center py-12 text-slate-400">
              <div class="spinner w-8 h-8 mx-auto"></div>
            </div>
            <div v-else-if="!filteredAccounts.length" class="flex flex-col items-center justify-center py-14 text-slate-400">
              <div class="text-4xl mb-3">🏢</div>
              <p class="text-sm">{{ phoneFixOnly ? 'ไม่มีเบอร์ที่ต้องแก้ไขแล้ว' : ownerFilter !== 'all' ? 'ไม่พบลูกค้าตามผู้ดูแลที่เลือก' : 'ยังไม่มีหน่วยงาน/บริษัทในระบบ' }}</p>
              <button v-if="ownerFilter !== 'all'" @click="ownerFilter = 'all'"
                class="mt-2 px-3 py-1.5 rounded-lg text-sm font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer">ดูลูกค้าทั้งหมด</button>
            </div>
            <div v-else class="overflow-x-auto">
              <table class="w-full border-collapse text-sm">
                <thead>
                  <tr class="bg-slate-50">
                    <th class="px-4 py-3 text-left text-[.75rem] font-bold text-slate-500 uppercase tracking-wide whitespace-nowrap border-b-2 border-slate-200">รหัสลูกค้า</th>
                    <th class="px-4 py-3 text-left text-[.75rem] font-bold text-slate-500 uppercase tracking-wide whitespace-nowrap border-b-2 border-slate-200">ชื่อ</th>
                    <th class="px-4 py-3 text-left text-[.75rem] font-bold text-slate-500 uppercase tracking-wide whitespace-nowrap border-b-2 border-slate-200">ประเภท</th>
                    <th class="px-4 py-3 text-left text-[.75rem] font-bold text-slate-500 uppercase tracking-wide whitespace-nowrap border-b-2 border-slate-200">ผู้ดูแล</th>
                    <th class="px-4 py-3 text-left text-[.75rem] font-bold text-slate-500 uppercase tracking-wide whitespace-nowrap border-b-2 border-slate-200">รหัส ERP</th>
                    <th class="px-4 py-3 text-left text-[.75rem] font-bold text-slate-500 uppercase tracking-wide whitespace-nowrap border-b-2 border-slate-200">เบอร์โทร</th>
                    <th class="px-4 py-3 text-center text-[.75rem] font-bold text-slate-500 uppercase tracking-wide whitespace-nowrap border-b-2 border-slate-200">จำนวนผู้ติดต่อ</th>
                    <th class="px-4 py-3 text-center text-[.75rem] font-bold text-slate-500 uppercase tracking-wide whitespace-nowrap border-b-2 border-slate-200">จำนวนดีล</th>
                    <th class="px-4 py-3 border-b-2 border-slate-200"></th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-for="a in filteredAccounts" :key="a.id" class="border-b border-slate-100 hover:bg-slate-50/50">
                    <td class="px-4 py-3"><span class="font-mono text-xs text-teal-700 bg-teal-50 rounded px-1.5 py-0.5 whitespace-nowrap">{{ a.account_code }}</span></td>
                    <td class="px-4 py-3 font-medium text-slate-800">
                      {{ a.name }}
                      <div v-if="a.merged_codes" class="text-xs font-normal text-slate-400 mt-0.5">รวมมาจาก {{ a.merged_codes }}</div>
                    </td>
                    <td class="px-4 py-3">
                      <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold"
                        :class="a.account_type==='government' ? 'bg-amber-100 text-amber-700' : 'bg-sky-100 text-sky-700'">
                        {{ a.account_type==='government' ? 'ราชการ' : 'เอกชน' }}
                      </span>
                    </td>
                    <td class="px-4 py-3 whitespace-nowrap">
                      <span v-if="a.owner_name" class="text-slate-700">{{ a.owner_name }}</span>
                      <span v-else class="text-slate-400">ลูกค้าส่วนกลาง</span>
                    </td>
                    <td class="px-4 py-3 text-slate-500 font-mono text-xs">{{ a.erp_codes || '-' }}</td>
                    <td class="px-4 py-3 text-slate-500 whitespace-nowrap">
                      <div v-if="a.phone">{{ formatPhone(a.phone, a.phone_ext) }}</div>
                      <div v-if="a.mobile">{{ formatPhone(a.mobile) }}</div>
                      <span v-if="!a.phone && !a.mobile">-</span>
                      <span v-if="Number(a.phone_needs_fix)===1" class="inline-block mt-0.5 px-1.5 py-0.5 rounded text-[11px] font-bold bg-amber-100 text-amber-800">เบอร์ต้องแก้ไข</span>
                    </td>
                    <td class="px-4 py-3 text-center font-bold">{{ a.contact_count }}</td>
                    <td class="px-4 py-3 text-center font-bold">{{ a.deal_count }}</td>
                    <td class="px-4 py-3">
                      <button @click="openAccountModal(a)"
                        class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer">
                        ดูรายละเอียด
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
          </template>
        </div>
      </main>
    </div>

    <!-- Mobile bottom nav -->
    <app-tab-bar :tabs="tabItems"></app-tab-bar>

    <app-modal ref="appModal"></app-modal>

    <!-- พบลูกค้าที่อาจซ้ำ (กันลูกค้าซ้ำ 2026-09-28) — ซ้อนบนหน้าต่างลูกค้า -->
    <app-duplicate-accounts :duplicates="dupDialog.list" pick-label="เปิดรายนี้" :confirm-label="dupDialog.confirmLabel"
      @pick="onDuplicatePick" @confirm="onDuplicateConfirm" @close="dupDialog.list = null"></app-duplicate-accounts>

    <!-- ยืนยันรวมลูกค้า (Merge — 2026-09-30): สรุปสิ่งที่จะย้าย + เตือนย้อนกลับไม่ได้ -->
    <div v-if="mergeDialog" class="fixed inset-0 bg-black/50 flex items-center justify-center z-[1100] p-4" @click.self="mergeDialog = null">
      <div class="bg-white rounded-2xl w-full max-w-[560px] shadow-2xl flex flex-col overflow-hidden" style="max-height:90vh">
        <div class="px-6 py-5 border-b border-slate-100">
          <h3 class="font-bold text-lg text-slate-800 m-0">ยืนยันรวมลูกค้า</h3>
        </div>
        <div class="p-5 overflow-y-auto flex-1 text-[.95rem]">
          <div class="font-semibold text-slate-700 mb-2">เลือกรายที่ต้องการเก็บไว้</div>
          <div class="grid grid-cols-1 gap-2">
            <label v-for="acc in [mergeDialog.pair.a, mergeDialog.pair.b]" :key="acc.id"
              class="flex items-start gap-3 p-3 rounded-xl ring-1 cursor-pointer"
              :class="Number(mergeDialog.keep.id) === Number(acc.id) ? 'ring-2 ring-teal-500 bg-teal-50' : 'ring-slate-200 bg-white hover:bg-slate-50'">
              <input type="radio" :checked="Number(mergeDialog.keep.id) === Number(acc.id)" @change="chooseMergeKeep(acc)" class="accent-teal-600 w-5 h-5 mt-0.5 shrink-0">
              <span class="min-w-0">
                <span class="flex items-center gap-2 flex-wrap">
                  <span class="font-mono text-xs text-teal-700 bg-white rounded px-1.5 py-0.5">{{ acc.account_code }}</span>
                  <span v-if="Number(mergeDialog.pair.keep_id) === Number(acc.id)" class="px-1.5 py-0.5 rounded text-xs font-bold bg-emerald-100 text-emerald-700">แนะนำ</span>
                </span>
                <span class="block font-semibold text-slate-800 mt-0.5">{{ acc.name }}</span>
                <span class="block text-sm text-slate-500">ERP: {{ acc.erp_codes || '-' }} · ดีล {{ acc.deal_count }} · ผู้ติดต่อ {{ acc.contact_count }}</span>
              </span>
            </label>
          </div>
          <div class="mt-3 p-3 rounded-xl bg-slate-50 text-sm text-slate-700">
            รวม <b>{{ mergeDialog.merge.account_code }} {{ mergeDialog.merge.name }}</b> (จะถูกลบ) → เข้า <b class="text-teal-700">{{ mergeDialog.keep.account_code }} {{ mergeDialog.keep.name }}</b>
          </div>
          <div class="mt-4 text-sm text-slate-600">
            <div class="font-semibold text-slate-700 mb-1">จะย้ายไปรายที่เก็บ</div>
            <ul class="m-0 pl-5 list-disc">
              <li>ดีล {{ mergeDialog.merge.deal_count }} · ประกาศงานประมูล {{ mergeDialog.merge.announcement_count }} · ผู้ติดต่อ {{ mergeDialog.merge.contact_count }}</li>
              <li>รหัส ERP: {{ mergeDialog.merge.erp_codes || 'ไม่มี' }}</li>
              <li>เลขภาษี / เบอร์ / ที่อยู่ / ผู้ดูแล — เติมเฉพาะช่องที่รายที่เก็บยังว่าง</li>
              <li>ชื่อลูกค้าในดีลขายตรงจะเปลี่ยนเป็นชื่อรายที่เก็บ (งานประมูลคงชื่อหน่วยงานตามประกาศ)</li>
            </ul>
          </div>
          <label class="block mt-4 text-sm font-semibold text-slate-600 mb-1">เหตุผล <span class="font-normal text-slate-400">(ไม่บังคับ)</span></label>
          <input v-model="mergeDialog.reason" maxlength="255" placeholder="เช่น ชื่อย่อของรายเดียวกัน / สร้างซ้ำ"
            class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
          <p class="mt-4 mb-0 p-3 rounded-xl bg-rose-50 ring-1 ring-rose-200 text-sm font-semibold text-rose-700">
            ย้อนกลับไม่ได้ — รหัส {{ mergeDialog.merge.account_code }} จะถูกลบ (ค้นหารหัสเดิมยังเจอรายที่เก็บ และมีบันทึกในประวัติการรวม)
          </p>
        </div>
        <div class="px-5 py-4 border-t border-slate-100 flex items-center justify-end gap-2">
          <button class="inline-flex items-center px-4 py-2.5 rounded-xl text-[.95rem] font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer min-h-[44px]" @click="mergeDialog = null" :disabled="merging">ยกเลิก</button>
          <button class="inline-flex items-center px-6 py-2.5 rounded-xl text-[.95rem] font-bold bg-rose-600 hover:bg-rose-700 text-white border-0 cursor-pointer min-h-[44px] disabled:opacity-50" @click="confirmMerge" :disabled="merging">
            {{ merging ? 'กำลังรวม...' : 'ยืนยันรวม' }}
          </button>
        </div>
      </div>
    </div>

    <!-- MODAL: รายละเอียด/แก้ไข/สร้างหน่วยงาน — header/footer แบบเดียวกับ sp-form modal ใน sales-pipeline.html (ยืนยันจากผู้ใช้ 2026-09-22 ว่าเป็น pattern มาตรฐานของระบบ ไม่ใช่ header สีทึบแบบ users.html/sources.html) -->
    <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-[1000] p-4"
      v-if="modal.type==='account'" @click.self="closeModal">
      <div class="bg-white rounded-2xl w-full max-w-[640px] shadow-2xl flex flex-col overflow-hidden" style="max-height:90vh">
        <div class="px-6 py-5 flex items-center justify-between border-b border-slate-100">
          <div>
            <h3 class="font-bold text-lg text-slate-800 m-0">{{ accountForm.id ? 'รายละเอียดหน่วยงาน/บริษัท' : 'เพิ่มหน่วยงาน/บริษัท' }}</h3>
            <span v-if="accountForm.account_code" class="inline-block mt-1 font-mono text-xs text-teal-700 bg-teal-50 rounded px-1.5 py-0.5">{{ accountForm.account_code }}</span>
            <span v-else class="block mt-1 text-xs text-slate-400">รหัสลูกค้าออกให้อัตโนมัติหลังบันทึก</span>
          </div>
          <button class="text-slate-400 hover:text-slate-600 bg-transparent border-0 text-2xl cursor-pointer leading-none"
            @click="closeModal">×</button>
        </div>
        <div class="p-5 overflow-y-auto flex-1">

          <!-- ลูกค้าที่อาจซ้ำ (Potential Duplicates — ยืนยันจากผู้ใช้ 2026-09-30) ทุก role เห็น / ธุรการตัดสินในแท็บ "ชื่อคล้ายกัน" -->
          <div v-if="accountForm.id && accountDetail.potential_duplicates.length" class="mb-4 p-3 rounded-xl bg-amber-50 ring-1 ring-amber-200 text-sm text-amber-900">
            <div class="font-semibold mb-1">ลูกค้ารายนี้อาจซ้ำกับ {{ accountDetail.potential_duplicates.length }} ราย — ธุรการกำลังตรวจ</div>
            <div v-for="d in accountDetail.potential_duplicates" :key="d.id" class="flex items-center gap-2 py-1 flex-wrap">
              <span class="font-mono text-xs bg-white rounded px-1.5 py-0.5 text-slate-600">{{ d.account_code }}</span>
              <span class="font-semibold text-slate-800">{{ d.name }}</span>
              <span class="text-xs text-amber-700">({{ dupReasonLabel(d.reason) }})</span>
              <button type="button" @click="openDupAccount(d)" class="ml-auto px-3 py-1 rounded-lg text-sm font-semibold bg-white ring-1 ring-amber-300 text-slate-700 hover:bg-amber-100 border-0 cursor-pointer">ดู</button>
            </div>
            <div v-if="!canChangeOwner" class="mt-1 text-amber-800">ถ้ารู้ว่าเป็นลูกค้าเดียวกันหรือคนละราย แจ้งธุรการขายได้เลย</div>
          </div>

          <!-- แยก 2 ส่วน: ข้อมูลลูกค้าใช้ในงานขาย (CRM) / ข้อมูลออกบิลยึดตาม ERP — คำอธิบายใต้ช่องให้คนสร้างเข้าใจว่าช่องไหนใช้ทำอะไร (ยืนยันจากผู้ใช้ 2026-09-28) -->
          <div class="flex items-baseline gap-2 mb-3">
            <span class="text-base font-bold text-slate-700">ข้อมูลลูกค้า</span>
            <span class="text-xs text-slate-500">— ใช้ในงานขาย</span>
          </div>
          <div class="grid grid-cols-2 gap-4 mb-2">
            <div class="flex flex-col gap-1 col-span-2">
              <label class="block text-sm font-semibold text-slate-600">ชื่อหน่วยงาน/บริษัท <span class="text-red-500">*</span></label>
              <input v-model="accountForm.name" class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
              <p class="text-sm text-slate-500 leading-relaxed m-0">ชื่อที่ใช้เรียกในระบบ — ถ้ามีรหัส ERP แล้ว ควรตรงกับชื่อในหน้าบัญชี</p>
            </div>
            <div class="flex flex-col gap-1">
              <label class="block text-sm font-semibold text-slate-600">ประเภท <span class="text-red-500">*</span></label>
              <div class="flex gap-2 mt-1">
                <button type="button" @click="accountForm.account_type='government'"
                  class="flex-1 border rounded-lg py-2 text-sm font-medium" :class="accountForm.account_type==='government' ? 'border-teal-500 bg-teal-50 text-teal-700' : 'border-slate-200 text-slate-500'">ราชการ</button>
                <button type="button" @click="accountForm.account_type='private'"
                  class="flex-1 border rounded-lg py-2 text-sm font-medium" :class="accountForm.account_type==='private' ? 'border-teal-500 bg-teal-50 text-teal-700' : 'border-slate-200 text-slate-500'">เอกชน</button>
              </div>
            </div>
            <!-- Sale ผู้ดูแลลูกค้า (Account Owner — 2026-09-30): เปลี่ยนได้เฉพาะธุรการ/admin (API บังคับซ้ำ) / ว่าง = ลูกค้าส่วนกลาง -->
            <div class="flex flex-col gap-1">
              <label class="block text-sm font-semibold text-slate-600">Sale ผู้ดูแลลูกค้า</label>
              <select v-if="canChangeOwner" v-model="accountForm.owner_user_id"
                class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white cursor-pointer">
                <option value="">ลูกค้าส่วนกลาง (ไม่มีผู้ดูแล)</option>
                <option v-for="u in salesUsers" :key="u.id" :value="String(u.id)">{{ u.full_name }}</option>
              </select>
              <div v-else class="py-2.5 text-sm" :class="ownerDisplayName ? 'text-slate-700' : 'text-slate-400'">{{ ownerDisplayName || 'ลูกค้าส่วนกลาง' }}</div>

<script>
const { createApp } = Vue;

createApp({
  components: { AppNav, AppTabBar, AppModal, AppDuplicateAccounts },
  data() {
    return {
      authReady: false,
      currentUser: null,
      loading: false,
      modal: { type: null, data: null },
      accounts: [],
      searchQuery: '',
      phoneFixOnly: false,   // ตัวกรอง "เบอร์ต้องแก้ไข" (2026-09-28)
      ownerFilter: 'all',    // ตัวกรองผู้ดูแล: all / mine / central / user id (2026-09-30)
      salesUsers: [],        // รายชื่อ sale สำหรับตัวกรองและช่องผู้ดูแล
      dupDialog: { list: null, confirmLabel: '' },   // หน้าต่างพบลูกค้าที่อาจซ้ำ (2026-09-28)
      accountForm: { id: null, account_code: '', account_type: '', owner_user_id: '', owner_name: '', name: '', tax_id: '', phone: '', phone_ext: '', mobile: '', address: '', note: '' },
      accountDetail: { contacts: [], deals: [], erp_codes: [], merge_logs: [], potential_duplicates: [] },
      erpForm: { show: false, account_erp_code_id: null, erp_customer_code: '', erp_role: '', is_primary: false, note: '' },
      // บทบาทรหัส ERP ตาม SAP Partner Functions — ต้องตรงกับ erpRoles() ใน api/accounts.php
      erpRoleOptions: [
        { val: 'sold_to', label: 'ผู้สั่งซื้อ' }, { val: 'bill_to', label: 'ผู้รับบิล' },
        { val: 'ship_to', label: 'สถานที่ส่งของ' }, { val: 'payer', label: 'ผู้ชำระเงิน' },
      ],
      showContactForm: false,
      contactForm: { id: null, full_name: '', phone: '', office_phone: '', office_phone_ext: '', position: '' },
      activeTab: 'all',
      erpPending: [],
      // รายงานลูกค้าชื่อคล้ายกัน (2026-09-30)
      dupPairs: [], dupLoading: false, dupShowIgnored: false, dupOpenCount: 0,
      dupNoteKey: '', dupNote: '',
      dupHelpOpen: false,
      mergeDialog: null,   // { keep, merge, reason } หน้าต่างยืนยันรวมลูกค้า
      merging: false,   // คำอธิบายวิธีหาคู่ — ซ่อนไว้ กดเปิดอ่าน
      erpPendingLoading: false,
    };
  },
  computed: {
    tabItems() {
      return [
        { label:'ภาพรวม', icon:'home', href:'dashboard.html' },
        { label:'ลูกค้า', icon:'users', active:true },
        { label:'ออก', icon:'logout', action:'logout' },
      ];
    },
    filteredAccounts() {
      const q = this.searchQuery.trim().toLowerCase();
      const qDigits = q.replace(/\D/g, '');   // ค้นหาเบอร์แบบพิมพ์ขีดหรือไม่มีขีดก็เจอ
      const qName = this.normalizeAccountName(q);   // ค้นชื่อแบบตัด บริษัท/จำกัด/ช่องว่าง (2026-09-29) เช่น "เอคลาส" เจอ "เอ คลาส แมนเนจเม้นท์"
      const f = this.ownerFilter;
      const byOwner = f === 'all' ? this.accounts
        : f === 'central' ? this.accounts.filter(a => !a.owner_user_id)
        : this.accounts.filter(a => Number(a.owner_user_id) === Number(f === 'mine' ? this.currentUser?.id : f));
      const list = this.phoneFixOnly ? byOwner.filter(a => Number(a.phone_needs_fix) === 1) : byOwner;
      if (!q) return list;
      return list.filter(a => [a.name, a.account_code, a.erp_codes, a.tax_id, a.merged_codes].some(v => (v || '').toLowerCase().includes(q))
        || (qName && this.normalizeAccountName(a.name).includes(qName))
        || (qDigits.length >= 4 && [a.phone, a.mobile].some(v => String(v || '').replace(/\D/g, '').includes(qDigits))));
    },
    phoneFixCount() { return this.accounts.filter(a => Number(a.phone_needs_fix) === 1).length; },
    // เพิ่ม/แก้/ลบรหัส ERP: admin / ธุรการขาย (API บังคับซ้ำ)
    canEditErp() { return ['admin', 'salesadmin'].includes(this.currentUser?.role); },
    isSale() { return this.currentUser?.role === 'sale'; },
    // เปลี่ยนผู้ดูแลลูกค้า: ธุรการขาย / admin (API บังคับซ้ำ)
    canChangeOwner() { return ['admin', 'salesadmin'].includes(this.currentUser?.role); },
    // ชื่อผู้ดูแลที่แสดงให้ role ที่เปลี่ยนไม่ได้ — ลูกค้าใหม่ที่ sale สร้างเอง ผู้ดูแล = ตัวเอง
    ownerDisplayName() {
      if (!this.accountForm.id && this.isSale) return this.currentUser?.full_name || '';
      return this.accountForm.owner_name || '';
    },
  },
  async mounted() {
    try {
      const res = await apiCall('GET', 'api/auth.php?action=me');
      if (!res.success) { window.location.href = 'login.html'; return; }
      this.currentUser = res.data;
    } catch { window.location.href = 'login.html'; return; }
    this.authReady = true;
    if (new URLSearchParams(window.location.search).get('tab') === 'erp_pending') this.activeTab = 'erp_pending';
    if (this.isSale) this.ownerFilter = 'mine';
    await Promise.all([this.loadAccounts(), this.loadErpPending(), this.loadSalesUsers(), this.canChangeOwner ? this.loadDupPairs() : null]);
  },
  methods: {
    ...SharedMethods,

    async loadAccounts() {
      this.loading = true;
      const res = await apiCall('GET', 'api/accounts.php?action=list');
      if (res.success) this.accounts = res.data;
      this.loading = false;
    },

    // ─── รายงานลูกค้าชื่อคล้ายกัน (2026-09-30) ───
    async loadDupPairs() {
      this.dupLoading = true;
      const res = await apiCall('GET', 'api/accounts.php?action=similar_pairs' + (this.dupShowIgnored ? '&include_ignored=1' : ''));
      if (res.success) {
        this.dupPairs = res.data;
        this.dupOpenCount = res.data.filter(p => !p.ignored).length;
      }
      this.dupLoading = false;
    },
    dupKey(p) { return p.a.id + '-' + p.b.id; },
    dupReasonLabel(r) {
      return { exact: 'ชื่อเหมือนกันหลังตัดคำ', tax: 'เลขภาษีเดียวกัน', contains: 'ชื่อหนึ่งอยู่ในอีกชื่อ', typo: 'สะกดต่าง 1–2 ตัว', prefix: 'ต้นชื่อเหมือนกัน' }[r] || r;
    },
    async openDupAccount(acc) {
      await this.openAccountModal(this.accounts.find(a => Number(a.id) === Number(acc.id)) || acc);
    },
    async ignoreDupPair(p) {
      const res = await apiCall('POST', 'api/accounts.php?action=ignore_pair', { account_id_a: p.a.id, account_id_b: p.b.id, reason: p.reason, note: this.dupNote.trim() });
      if (!res.success) { await this.showAlert(res.message || 'เกิดข้อผิดพลาด', 'error'); return; }
      this.dupNoteKey = '';
      await this.loadDupPairs();
    },
    // รวมลูกค้า: เปิดจากปุ่ม "ใช่ — ซ้ำ" — เริ่มที่รายที่ระบบแนะนำให้เก็บ แล้วธุรการเปลี่ยนได้
    openMergeDialog(pair) {
      const keep = Number(pair.keep_id) === Number(pair.b.id) ? pair.b : pair.a;
      this.mergeDialog = { pair, keep, merge: keep === pair.a ? pair.b : pair.a, reason: '' };
    },
    chooseMergeKeep(acc) {
      const pr = this.mergeDialog.pair;
      this.mergeDialog.keep = acc;
      this.mergeDialog.merge = Number(acc.id) === Number(pr.a.id) ? pr.b : pr.a;
    },
    async confirmMerge() {
      const m = this.mergeDialog;
      this.merging = true;
      const res = await apiCall('POST', 'api/accounts.php?action=merge_accounts',
        { keep_account_id: m.keep.id, merge_account_id: m.merge.id, reason: m.reason.trim() });
      this.merging = false;
      if (!res.success) { await this.showAlert(res.message || 'เกิดข้อผิดพลาด', 'error'); return; }
      this.mergeDialog = null;
      await Promise.all([this.loadDupPairs(), this.loadAccounts()]);
      await this.showAlert(res.message, 'success');
    },
    async unignoreDupPair(p) {
      const res = await apiCall('POST', 'api/accounts.php?action=unignore_pair', { account_id_a: p.a.id, account_id_b: p.b.id });
      if (!res.success) { await this.showAlert(res.message || 'เกิดข้อผิดพลาด', 'error'); return; }
      await this.loadDupPairs();
    },
    exportDupPairs() {
      const headers = ['เหตุที่จับคู่', 'สถานะ', 'รหัสลูกค้า 1', 'ชื่อ 1', 'ผู้ดูแล 1', 'ERP 1', 'ดีล 1', 'รหัสลูกค้า 2', 'ชื่อ 2', 'ผู้ดูแล 2', 'ERP 2', 'ดีล 2', 'รวมเข้ารายไหน (ใส่รหัส)'];
      const rows = this.dupPairs.map(p => [
        this.dupReasonLabel(p.reason), p.ignored ? 'ยืนยันแล้วว่าไม่ซ้ำ' : 'ยังไม่ตรวจ',
        p.a.account_code, p.a.name, p.a.owner_name || 'ลูกค้าส่วนกลาง', p.a.erp_codes || '', Number(p.a.deal_count),
        p.b.account_code, p.b.name, p.b.owner_name || 'ลูกค้าส่วนกลาง', p.b.erp_codes || '', Number(p.b.deal_count),
        p.ignored ? '' : (Number(p.keep_id) === Number(p.a.id) ? p.a.account_code : p.b.account_code),   // ค่าแนะนำ แก้ได้
      ]);
      this.exportExcel(`ลูกค้าชื่อคล้ายกัน_${this.todayIso()}`, headers, rows);
    },

    async loadSalesUsers() {
      const res = await apiCall('GET', 'api/users.php?action=sales');
      if (res.success) this.salesUsers = res.data;
    },

    setTab(tab) {
      this.activeTab = tab;
      if (tab === 'erp_pending') this.loadErpPending();
      if (tab === 'similar') this.loadDupPairs();
    },

    async loadErpPending() {
      this.erpPendingLoading = true;
      const res = await apiCall('GET', 'api/accounts.php?action=erp_pending');
      if (res.success) this.erpPending = res.data;
      this.erpPendingLoading = false;
    },

    // Export ตามที่แสดงบนหน้าจอ (ผลค้นหาปัจจุบัน) — ใช้ exportExcel() กลางใน shared/app.js (2026-09-28)
    exportAccounts() {
      const headers = ['รหัสลูกค้า', 'ชื่อ', 'ประเภท', 'ผู้ดูแล', 'เลขประจำตัวผู้เสียภาษี', 'รหัส ERP', 'เบอร์สำนักงาน', 'เบอร์มือถือ', 'ที่อยู่', 'จำนวนผู้ติดต่อ', 'จำนวนดีล'];
      const rows = this.filteredAccounts.map(a => [
        a.account_code,
        a.name,
        a.account_type === 'government' ? 'ราชการ' : 'เอกชน',
        a.owner_name || 'ลูกค้าส่วนกลาง',
        a.tax_id || '',
        a.erp_codes || '',
        this.formatPhone(a.phone, a.phone_ext),
        this.formatPhone(a.mobile),
        a.address || '',
        Number(a.contact_count),
        Number(a.deal_count),
      ]);
      this.exportExcel(`ลูกค้า_${this.todayIso()}`, headers, rows);
    },

    // sale ได้เฉพาะดีลของตัวเอง (API กรองให้แล้ว เหมือนที่แสดงบนหน้าจอ)
    exportErpPending() {
      const headers = ['รหัสลูกค้า', 'ชื่อลูกค้า', 'รหัสงาน', 'ชื่อดีล/งาน', 'ประเภท', 'วันที่ชนะ', 'รอมาแล้ว (วัน)', 'มูลค่า', 'Sale'];
      const rows = this.erpPending.map(d => [
        d.account_code || '',
        d.account_id ? d.account_name : 'ยังไม่ผูกลูกค้า',
        d.project_code,
        d.title,
        d.source_type === 'ebidding' ? 'ชนะประมูล' : 'ปิดดีล',
        this.formatDateThai(d.won_at),
        Number(d.days_waiting),
        d.value ? Number(d.value) : '',
        d.sale_name,
      ]);
      this.exportExcel(`ลูกค้ารอเปิดหน้าบัญชี_${this.todayIso()}`, headers, rows);
    },

    todayIso() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    },

    // จากแท็บรอเปิดหน้าบัญชี: เปิดรายละเอียดลูกค้า — ธุรการ/admin เปิดฟอร์มเพิ่มรหัส ERP ให้ทันที
    async openPendingAccount(d) {
      const account = this.accounts.find(a => Number(a.id) === Number(d.account_id));
      if (!account) { await this.showAlert('ไม่พบข้อมูลลูกค้า', 'error'); return; }
      await this.openAccountModal(account);
      if (this.canEditErp) this.openErpForm(null);
      // เลื่อนหน้าต่างไปที่ส่วนรหัส ERP ทันที ไม่ต้องเลื่อนหาเอง
      this.$nextTick(() => this.$refs.erpSection?.scrollIntoView({ behavior: 'smooth', block: 'start' }));
    },

    async openAccountModal(a) {
      this.showContactForm = false;
      if (a) {
        this.accountForm = { id: a.id, account_code: a.account_code, account_type: a.account_type,
                             owner_user_id: a.owner_user_id ? String(a.owner_user_id) : '', owner_name: a.owner_name || '', name: a.name, tax_id: a.tax_id || '',
                             phone: a.phone || '', phone_ext: a.phone_ext || '', mobile: a.mobile || '', address: a.address || '', note: a.note || '' };
        await this.loadAccountDetail(a.id);
      } else {
        this.accountForm = { id: null, account_code: '', account_type: '', owner_user_id: '', owner_name: '', name: '', tax_id: '', phone: '', phone_ext: '', mobile: '', address: '', note: '' };
        this.accountDetail = { contacts: [], deals: [], erp_codes: [], merge_logs: [], potential_duplicates: [] };
      }
      this.erpForm.show = false;
      this.modal = { type: 'account', data: a };
    },

    async submitAccount() {
      if (!this.accountForm.name.trim()) { await this.showAlert('กรุณาระบุชื่อหน่วยงาน/บริษัท', 'error'); return; }
      if (!this.accountForm.account_type) { await this.showAlert('กรุณาเลือกประเภท', 'error'); return; }
      await this.saveAccount(false);
    },

    // กันลูกค้าซ้ำ (2026-09-28): API ตรวจเองตอนบันทึก — ชื่อตรงกันห้ามบันทึก / ชื่อคล้ายหรือเลขภาษีซ้ำ ต้องกดยืนยันก่อน
    // ตอบ 409 พร้อม data.duplicates → เปิดหน้าต่างให้เลือกรายเดิม หรือยืนยันว่าเป็นคนละราย (ส่งซ้ำพร้อม confirm_not_duplicate)
    async saveAccount(confirmNotDuplicate) {
      const isCreate = !this.accountForm.id;
      // ส่งผู้ดูแลเฉพาะ role ที่เปลี่ยนได้ — role อื่น API คงค่าเดิม / sale สร้างใหม่ = ตัวเองอัตโนมัติ
      const { owner_user_id, owner_name, ...form } = this.accountForm;
      const body = { ...form, confirm_not_duplicate: confirmNotDuplicate };
      if (this.canChangeOwner) body.owner_user_id = owner_user_id ? Number(owner_user_id) : null;
      const res = await apiCall('POST', `api/accounts.php?action=${isCreate ? 'create' : 'update'}`, body);
      if (!res.success && res.data?.duplicates) {
        this.dupDialog = { list: res.data.duplicates, confirmLabel: isCreate ? 'ยืนยันว่าเป็นคนละราย — สร้างใหม่' : 'ยืนยันว่าเป็นคนละราย — บันทึก' };
        return;
      }
      if (res.success) {
        await this.loadAccounts();
        if (isCreate) {
          // สร้างสำเร็จแล้ว เปลี่ยนฟอร์มเป็นโหมดดูรายละเอียดของหน่วยงานที่เพิ่งสร้าง ไม่ปิด modal เพื่อให้เพิ่มผู้ติดต่อได้ต่อทันที
          this.accountForm.id = res.data.id;
          this.accountForm.account_code = res.data.account_code;
          this.accountForm.owner_name = this.accounts.find(a => Number(a.id) === Number(res.data.id))?.owner_name || '';
          this.accountDetail = { contacts: [], deals: [], erp_codes: [], merge_logs: [], potential_duplicates: [] };
        } else {
          this.closeModal();
        }
        await this.showAlert(isCreate ? 'เพิ่มหน่วยงานสำเร็จ' : 'บันทึกสำเร็จ', 'success');
      } else await this.showAlert(res.message || 'เกิดข้อผิดพลาด', 'error');
    },

    // ทำชื่อเป็นรูปแบบเดียวกันก่อนค้นหา — ต้องตรงกับ normalizeAccountName() ใน includes/account_helper.php
    normalizeAccountName(name) {
      let s = String(name || '').toLowerCase()
        .replace(/\b(public\s+company\s+limited|company\s+limited|co\s*\.?\s*,?\s*ltd\.?|limited|ltd\.?|inc\.?|corporation|corp\.?)(?=\W|$)/g, '');
      for (const w of ['บริษัทมหาชนจำกัด', 'ห้างหุ้นส่วนจำกัด', 'ห้างหุ้นส่วนสามัญ', '(มหาชน)', 'มหาชน', 'บริษัท', 'บจก.', 'บมจ.', 'หจก.', 'หสน.', 'บ.', 'จำกัด']) s = s.split(w).join('');
      return s.replace(/[^\p{L}\p{M}\p{N}]+/gu, '');
    },

    // เลือกรายเดิมจากหน้าต่างพบลูกค้าซ้ำ → เปิดรายละเอียดรายนั้นแทน (ข้อมูลที่พิมพ์ไว้ในฟอร์มไม่ถูกบันทึก)
    async onDuplicatePick(d) {
      this.dupDialog.list = null;
      const account = this.accounts.find(a => Number(a.id) === Number(d.id)) || d;
      await this.openAccountModal(account);
    },

    async onDuplicateConfirm() {
      this.dupDialog.list = null;
      await this.saveAccount(true);
    },

    async loadAccountDetail(id) {
      const res = await apiCall('GET', `api/accounts.php?action=detail&id=${id}`);
      this.accountDetail = res.success
        ? { contacts: res.data.contacts, deals: res.data.deals, erp_codes: res.data.erp_codes || [], merge_logs: res.data.merge_logs || [], potential_duplicates: res.data.potential_duplicates || [] }
        : { contacts: [], deals: [], erp_codes: [], merge_logs: [], potential_duplicates: [] };
    },

    erpRoleLabel(val) { return this.erpRoleOptions.find(r => r.val === val)?.label || val; },

    openErpForm(e) {
      this.erpForm = e
        ? { show: true, account_erp_code_id: e.account_erp_code_id, erp_customer_code: e.erp_customer_code, erp_role: e.erp_role || '', is_primary: Number(e.is_primary) === 1, note: e.note || '' }
        : { show: true, account_erp_code_id: null, erp_customer_code: '', erp_role: '', is_primary: !this.accountDetail.erp_codes.length, note: '' };
    },

    async submitErpCode() {
      if (!this.erpForm.erp_customer_code.trim()) { await this.showAlert('กรุณาระบุรหัสลูกค้าใน ERP', 'error'); return; }
      const res = await apiCall('POST', 'api/accounts.php?action=erp_code_save', { ...this.erpForm, account_id: this.accountForm.id });
      if (!res.success) { await this.showAlert(res.message || 'เกิดข้อผิดพลาด', 'error'); return; }
      this.erpForm.show = false;
      await this.loadAccountDetail(this.accountForm.id);
      await Promise.all([this.loadAccounts(), this.loadErpPending()]);
    },

    async removeErpCode(e) {
      const ok = await this.showConfirm('ลบรหัส ERP', `ลบการผูกรหัส ${e.erp_customer_code} ออกจากลูกค้ารายนี้? (ไม่กระทบข้อมูลในระบบ ERP)`, 'ลบ');
      if (!ok) return;
      const res = await apiCall('POST', 'api/accounts.php?action=erp_code_delete', { account_erp_code_id: e.account_erp_code_id });
      if (!res.success) { await this.showAlert(res.message || 'เกิดข้อผิดพลาด', 'error'); return; }
      await this.loadAccountDetail(this.accountForm.id);
      await Promise.all([this.loadAccounts(), this.loadErpPending()]);
    },

    // c = null เพิ่มใหม่ / มีค่า = แก้ไขคนเดิม (ใช้ฟอร์มเดียวกัน)
    openContactForm(c) {
      this.contactForm = c
        ? { id: c.id, full_name: c.full_name, phone: c.phone || '', office_phone: c.office_phone || '', office_phone_ext: c.office_phone_ext || '', position: c.position || '' }
        : { id: null, full_name: '', phone: '', office_phone: '', office_phone_ext: '', position: '' };
      this.showContactForm = true;
    },

    async submitContact() {
      if (!this.contactForm.full_name.trim()) { await this.showAlert('กรุณากรอกชื่อผู้ติดต่อ', 'error'); return; }
      if (!this.contactForm.phone.trim())     { await this.showAlert('กรุณากรอกเบอร์โทร', 'error'); return; }
      const isEdit = !!this.contactForm.id;
      const res = await apiCall('POST', `api/contacts.php?action=${isEdit ? 'update' : 'create'}`, { ...this.contactForm, account_id: this.accountForm.id });
      if (res.success) {
        await this.loadAccountDetail(this.accountForm.id);   // โหลดใหม่ทั้งชุด ให้ข้อมูล "อยู่ในดีล" ของคนอื่นยังอยู่
        this.showContactForm = false;
        await this.loadAccounts();                           // ตัวกรอง "เบอร์ต้องแก้ไข" อัปเดตตาม
      } else await this.showAlert(res.message || 'เกิดข้อผิดพลาด', 'error');
    },
  },
}).mount('#app');
</script>
</body>
</html>
