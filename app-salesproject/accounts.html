<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หน่วยงาน/ลูกค้า</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="shared/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css?v=16">
</head>
<body class="bg-slate-50 font-sans">
<div id="app">
  <div v-if="!authReady" class="min-h-screen flex items-center justify-center">
    <div class="spinner w-12 h-12"></div>
  </div>

  <template v-else>
    <app-nav :user="currentUser" page="accounts" ref="nav"></app-nav>

    <div class="md:ml-60 min-h-screen flex flex-col">
      <header class="bg-white border-b border-slate-100 px-5 py-2.5 flex items-center gap-3 shadow-sm min-h-[56px]">
        <h1 class="text-base font-bold text-slate-700 flex items-center gap-2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/>
          </svg>
          หน่วยงาน/ลูกค้า
        </h1>
      </header>

      <main class="flex-1 w-full max-w-[1600px] mx-auto px-4 pb-24 pt-5 md:px-6 md:py-6">
        <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100">
          <div class="flex items-center justify-between gap-3 px-5 py-4 border-b border-slate-100 flex-wrap">
            <span class="font-bold text-slate-700 flex items-center gap-1.5">
              <svg class="w-4 h-4 text-slate-300 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/></svg>
              รายชื่อหน่วยงาน/บริษัท
            </span>
            <div class="flex items-center gap-2">
              <input v-model="searchQuery" placeholder="ค้นหาชื่อ..."
                class="border border-slate-200 rounded-xl px-3.5 py-1.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
              <button @click="openAccountModal(null)"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer whitespace-nowrap">
                + เพิ่มหน่วยงาน
              </button>
            </div>
          </div>
          <div>
            <div v-if="loading" class="flex flex-col items-center justify-center py-12 text-slate-400">
              <div class="spinner w-8 h-8 mx-auto"></div>
            </div>
            <div v-else-if="!filteredAccounts.length" class="flex flex-col items-center justify-center py-14 text-slate-400">
              <div class="text-4xl mb-3">🏢</div>
              <p class="text-sm">ยังไม่มีหน่วยงาน/บริษัทในระบบ</p>
            </div>
            <div v-else class="overflow-x-auto">
              <table class="w-full border-collapse text-sm">
                <thead>
                  <tr class="bg-slate-50">
                    <th class="px-4 py-3 text-left text-[.75rem] font-bold text-slate-500 uppercase tracking-wide border-b-2 border-slate-200">ชื่อ</th>
                    <th class="px-4 py-3 text-left text-[.75rem] font-bold text-slate-500 uppercase tracking-wide border-b-2 border-slate-200">ประเภท</th>
                    <th class="px-4 py-3 text-left text-[.75rem] font-bold text-slate-500 uppercase tracking-wide border-b-2 border-slate-200">เบอร์โทร</th>
                    <th class="px-4 py-3 text-center text-[.75rem] font-bold text-slate-500 uppercase tracking-wide border-b-2 border-slate-200">จำนวนผู้ติดต่อ</th>
                    <th class="px-4 py-3 text-center text-[.75rem] font-bold text-slate-500 uppercase tracking-wide border-b-2 border-slate-200">จำนวนดีล</th>
                    <th class="px-4 py-3 border-b-2 border-slate-200"></th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-for="a in filteredAccounts" :key="a.id" class="border-b border-slate-100 hover:bg-slate-50/50">
                    <td class="px-4 py-3 font-medium text-slate-800">{{ a.name }}</td>
                    <td class="px-4 py-3">
                      <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold"
                        :class="a.account_type==='government' ? 'bg-amber-100 text-amber-700' : 'bg-sky-100 text-sky-700'">
                        {{ a.account_type==='government' ? 'ราชการ' : 'เอกชน' }}
                      </span>
                    </td>
                    <td class="px-4 py-3 text-slate-500">{{ a.phone || '-' }}</td>
                    <td class="px-4 py-3 text-center font-bold">{{ a.contact_count }}</td>
                    <td class="px-4 py-3 text-center font-bold">{{ a.deal_count }}</td>
                    <td class="px-4 py-3">
                      <button @click="openAccountModal(a)"
                        class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer">
                        ดูรายละเอียด
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Mobile bottom nav -->
    <app-tab-bar :tabs="tabItems"></app-tab-bar>

    <app-modal ref="appModal"></app-modal>

    <!-- MODAL: รายละเอียด/แก้ไข/สร้างหน่วยงาน — header/footer แบบเดียวกับ sp-form modal ใน sales-pipeline.html (ยืนยันจากผู้ใช้ 2026-09-22 ว่าเป็น pattern มาตรฐานของระบบ ไม่ใช่ header สีทึบแบบ users.html/sources.html) -->
    <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-[1000] p-4"
      v-if="modal.type==='account'" @click.self="closeModal">
      <div class="bg-white rounded-2xl w-full max-w-[640px] shadow-2xl flex flex-col overflow-hidden" style="max-height:90vh">
        <div class="px-6 py-5 flex items-center justify-between border-b border-slate-100">
          <h3 class="font-bold text-lg text-slate-800 m-0">{{ accountForm.id ? 'รายละเอียดหน่วยงาน/บริษัท' : 'เพิ่มหน่วยงาน/บริษัท' }}</h3>
          <button class="text-slate-400 hover:text-slate-600 bg-transparent border-0 text-2xl cursor-pointer leading-none"
            @click="closeModal">×</button>
        </div>
        <div class="p-5 overflow-y-auto flex-1">

          <div class="grid grid-cols-2 gap-4 mb-2">
            <div class="flex flex-col gap-1 col-span-2">
              <label class="block text-sm font-semibold text-slate-600">ชื่อหน่วยงาน/บริษัท <span class="text-red-500">*</span></label>
              <input v-model="accountForm.name" class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
            </div>
            <div class="flex flex-col gap-1">
              <label class="block text-sm font-semibold text-slate-600">ประเภท <span class="text-red-500">*</span></label>
              <div class="flex gap-2 mt-1">
                <button type="button" @click="accountForm.account_type='government'"
                  class="flex-1 border rounded-lg py-2 text-sm font-medium" :class="accountForm.account_type==='government' ? 'border-teal-500 bg-teal-50 text-teal-700' : 'border-slate-200 text-slate-500'">ราชการ</button>
                <button type="button" @click="accountForm.account_type='private'"
                  class="flex-1 border rounded-lg py-2 text-sm font-medium" :class="accountForm.account_type==='private' ? 'border-teal-500 bg-teal-50 text-teal-700' : 'border-slate-200 text-slate-500'">เอกชน</button>
              </div>
            </div>
            <div class="flex flex-col gap-1">
              <label class="block text-sm font-semibold text-slate-600">เบอร์โทร</label>
              <input v-model="accountForm.phone" class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
            </div>
            <div class="flex flex-col gap-1 col-span-2">
              <label class="block text-sm font-semibold text-slate-600">ที่อยู่</label>
              <textarea v-model="accountForm.address" rows="2" class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white"></textarea>
            </div>
            <div class="flex flex-col gap-1 col-span-2">
              <label class="block text-sm font-semibold text-slate-600">บันทึกเพิ่มเติม</label>
              <textarea v-model="accountForm.note" rows="2" class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white"></textarea>
            </div>
          </div>

          <!-- ผู้ติดต่อ + ดีลที่เกี่ยวข้อง — แสดงเฉพาะหน่วยงานที่มีอยู่แล้ว (บันทึกครั้งแรกก่อนถึงจะมี id) -->
          <template v-if="accountForm.id">
            <div class="border-t border-slate-100 pt-4 mb-4">
              <div class="flex items-center justify-between mb-2">
                <div class="text-xs font-bold uppercase tracking-wider text-slate-400">ผู้ติดต่อ</div>
                <button @click="showContactForm=!showContactForm" class="text-xs font-semibold text-teal-700 bg-transparent border-0 cursor-pointer">+ เพิ่มผู้ติดต่อ</button>
              </div>
              <div v-if="!accountDetail.contacts.length" class="text-sm text-slate-400 mb-2">ยังไม่มีผู้ติดต่อ</div>
              <div v-for="c in accountDetail.contacts" :key="c.id" class="flex items-center gap-2 py-2 border-b border-slate-50 text-sm">
                <span class="font-medium text-slate-700">{{ c.full_name }}</span>
                <span v-if="c.position" class="text-slate-400">({{ c.position }})</span>
                <span class="ml-auto text-slate-500">{{ c.phone }}</span>
              </div>
              <div v-if="showContactForm" class="mt-3 p-3 bg-slate-50 rounded-xl grid grid-cols-2 gap-2">
                <input v-model="contactForm.full_name" placeholder="ชื่อผู้ติดต่อ *" class="border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-teal-400 bg-white">
                <input v-model="contactForm.phone" placeholder="เบอร์โทร *" class="border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-teal-400 bg-white">
                <input v-model="contactForm.position" placeholder="ตำแหน่ง (ไม่บังคับ)" class="col-span-2 border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-teal-400 bg-white">
                <button @click="submitContact" class="col-span-2 bg-teal-600 hover:bg-teal-700 text-white rounded-lg py-1.5 text-sm font-semibold border-0 cursor-pointer">เพิ่ม</button>
              </div>
            </div>

            <div class="border-t border-slate-100 pt-4">
              <div class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">ดีลที่เกี่ยวข้อง</div>
              <div v-if="!accountDetail.deals.length" class="text-sm text-slate-400">ยังไม่มีดีลที่ผูกกับหน่วยงานนี้</div>
              <div v-for="d in accountDetail.deals" :key="d.id" class="flex items-center gap-2 py-2 border-b border-slate-50 text-sm">
                <span class="font-mono text-xs text-purple-700 bg-purple-50 rounded px-1.5 py-0.5">{{ d.project_code || '-' }}</span>
                <span class="text-slate-700">{{ d.title }}</span>
                <span class="ml-auto text-slate-400">{{ d.stage }}</span>
              </div>
            </div>
          </template>

        </div>
        <div class="px-5 py-4 border-t border-slate-100 flex items-center justify-end gap-2">
          <button class="inline-flex items-center px-4 py-2.5 rounded-xl text-[.95rem] font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer min-h-[44px]" @click="closeModal">ยกเลิก</button>
          <button class="inline-flex items-center px-6 py-2.5 rounded-xl text-[.95rem] font-bold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer min-h-[44px]" @click="submitAccount">
            บันทึก
          </button>
        </div>
      </div>
    </div>
  </template>
</div>

<script src="shared/vue.global.prod.js"></script>
<script src="shared/app.js?v=44"></script>
<script>
const { createApp } = Vue;

createApp({
  components: { AppNav, AppTabBar, AppModal },
  data() {
    return {
      authReady: false,
      currentUser: null,
      loading: false,
      modal: { type: null, data: null },
      accounts: [],
      searchQuery: '',
      accountForm: { id: null, account_type: '', name: '', phone: '', address: '', note: '' },
      accountDetail: { contacts: [], deals: [] },
      showContactForm: false,
      contactForm: { full_name: '', phone: '', position: '' },
    };
  },
  computed: {
    tabItems() {
      return [
        { label:'ภาพรวม', icon:'home', href:'dashboard.html' },
        { label:'ลูกค้า', icon:'users', active:true },
        { label:'ออก', icon:'logout', action:'logout' },
      ];
    },
    filteredAccounts() {
      const q = this.searchQuery.trim().toLowerCase();
      if (!q) return this.accounts;
      return this.accounts.filter(a => a.name.toLowerCase().includes(q));
    },
  },
  async mounted() {
    try {
      const res = await apiCall('GET', 'api/auth.php?action=me');
      if (!res.success) { window.location.href = 'login.html'; return; }
      this.currentUser = res.data;
    } catch { window.location.href = 'login.html'; return; }
    this.authReady = true;
    await this.loadAccounts();
  },
  methods: {
    ...SharedMethods,

    async loadAccounts() {
      this.loading = true;
      const res = await apiCall('GET', 'api/accounts.php?action=list');
      if (res.success) this.accounts = res.data;
      this.loading = false;
    },

    async openAccountModal(a) {
      this.showContactForm = false;
      this.contactForm = { full_name: '', phone: '', position: '' };
      if (a) {
        this.accountForm = { id: a.id, account_type: a.account_type, name: a.name, phone: a.phone || '', address: a.address || '', note: a.note || '' };
        const res = await apiCall('GET', `api/accounts.php?action=detail&id=${a.id}`);
        this.accountDetail = res.success ? { contacts: res.data.contacts, deals: res.data.deals } : { contacts: [], deals: [] };
      } else {
        this.accountForm = { id: null, account_type: '', name: '', phone: '', address: '', note: '' };
        this.accountDetail = { contacts: [], deals: [] };
      }
      this.modal = { type: 'account', data: a };
    },

    async submitAccount() {
      if (!this.accountForm.name.trim()) { await this.showAlert('กรุณาระบุชื่อหน่วยงาน/บริษัท', 'error'); return; }
      if (!this.accountForm.account_type) { await this.showAlert('กรุณาเลือกประเภท', 'error'); return; }
      const isCreate = !this.accountForm.id;
      // เตือนก่อนถ้าเจอชื่อคล้ายกันอยู่แล้ว (กันสร้าง account ซ้ำโดยไม่ตั้งใจ — ยืนยันจากผู้ใช้ 2026-09-22)
      if (isCreate) {
        const dup = await apiCall('GET', 'api/accounts.php?action=check_duplicate&q=' + encodeURIComponent(this.accountForm.name.trim()));
        if (dup.success && dup.data.length) {
          const names = dup.data.map(a => a.name).join(', ');
          const ok = await this.showConfirm('พบชื่อคล้ายกัน', `พบหน่วยงาน/บริษัทที่ชื่อคล้ายกันอยู่แล้ว: ${names} — ต้องการสร้างใหม่จริงหรือไม่?`, 'สร้างใหม่');
          if (!ok) return;
        }
      }
      const res = await apiCall('POST', `api/accounts.php?action=${isCreate ? 'create' : 'update'}`, this.accountForm);
      if (res.success) {
        await this.loadAccounts();
        if (isCreate) {
          // สร้างสำเร็จแล้ว เปลี่ยนฟอร์มเป็นโหมดดูรายละเอียดของหน่วยงานที่เพิ่งสร้าง ไม่ปิด modal เพื่อให้เพิ่มผู้ติดต่อได้ต่อทันที
          this.accountForm.id = res.data.id;
          this.accountDetail = { contacts: [], deals: [] };
        } else {
          this.closeModal();
        }
        await this.showAlert(isCreate ? 'เพิ่มหน่วยงานสำเร็จ' : 'บันทึกสำเร็จ', 'success');
      } else await this.showAlert(res.message || 'เกิดข้อผิดพลาด', 'error');
    },

    async submitContact() {
      if (!this.contactForm.full_name.trim()) { await this.showAlert('กรุณากรอกชื่อผู้ติดต่อ', 'error'); return; }
      if (!this.contactForm.phone.trim())     { await this.showAlert('กรุณากรอกเบอร์โทร', 'error'); return; }
      const res = await apiCall('POST', 'api/contacts.php?action=create', { ...this.contactForm, account_id: this.accountForm.id });
      if (res.success) {
        const list = await apiCall('GET', `api/contacts.php?action=list&account_id=${this.accountForm.id}`);
        if (list.success) this.accountDetail.contacts = list.data;
        this.showContactForm = false;
        this.contactForm = { full_name: '', phone: '', position: '' };
        await this.loadAccounts();
      } else await this.showAlert(res.message || 'เกิดข้อผิดพลาด', 'error');
    },
  },
}).mount('#app');
</script>
</body>
</html>
