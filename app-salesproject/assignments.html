<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จัดการงานประมูล</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="shared/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css?v=16">
</head>
<body class="bg-slate-50 font-sans">
<div id="app">
  <div v-if="!authReady" class="min-h-screen flex items-center justify-center">
    <div class="spinner w-12 h-12"></div>
  </div>

  <template v-else>
    <!-- app-nav อยู่ในคอนเทนเนอร์เดียวกับ header/main เสมอ (ไม่ใช่ sibling แยก) — เดิมกันปัญหาสูงเกิน 100vh ตอนมุมมองปฏิทินล็อก h-screen
         (มุมมองปฏิทินเอาออกแล้ว 2026-10-10 — ซ้ำกับเมนู "ปฏิทินคัดกรองประกาศ" company-calendar.html)
         ⚠️ ห้ามใส่ md:ml-60 ที่ div นี้ (คอนเทนเนอร์รวม) — <app-nav> เป็นลูกอยู่ข้างในอยู่แล้ว header ของ AppNav เองมี md:ml-60 built-in
         ถ้าใส่ซ้ำที่นี่อีกชั้นจะเลื่อนซ้อนกัน 2 เท่าเกิดช่องว่างขาว (ยืนยันบั๊กจากผู้ใช้ 2026-09-21) — ห่อ header+main ด้วย div ml-60 แยกแทน -->
    <div class="flex flex-col min-h-screen">
      <app-nav :user="currentUser" page="assignments" ref="nav"></app-nav>
      <div class="md:ml-60 flex-1 min-h-0 flex flex-col">
      <header class="bg-white border-b border-slate-100 px-5 py-2.5 flex items-center gap-3 shadow-sm min-h-[56px] shrink-0">
        <h1 class="text-base font-bold text-slate-700 flex items-center gap-2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="8" y="2" width="8" height="4" rx="1"/>
            <path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/>
            <line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/>
          </svg>
          จัดการงานประมูล
        </h1>
        <!-- สลับมุมมอง: รายการ (ค่าเริ่มต้น — List View มาตรฐาน CRM) / Gantt (รายคน×วัน)
             มุมมองปฏิทินเอาออก 2026-10-10 (ยืนยันจากผู้ใช้) — ซ้ำกับเมนู "ปฏิทินคัดกรองประกาศ" ที่แสดงมอบหมาย/กดรับต่อวันอยู่แล้ว -->
        <div class="ml-auto flex items-center gap-1 bg-slate-100 rounded-xl p-1">
          <button type="button" @click="view='list'; loadAssignments()"
            class="px-3 py-1.5 rounded-lg text-xs font-semibold border-0 cursor-pointer"
            :class="view==='list' ? 'bg-white text-teal-700 shadow-sm' : 'bg-transparent text-slate-500 hover:text-slate-700'">รายการ</button>
          <button type="button" @click="view='gantt'; loadGanttData()"
            class="px-3 py-1.5 rounded-lg text-xs font-semibold border-0 cursor-pointer"
            :class="view==='gantt' ? 'bg-white text-teal-700 shadow-sm' : 'bg-transparent text-slate-500 hover:text-slate-700'">Gantt</button>
        </div>
      </header>

      <main class="w-full max-w-[1280px] mx-auto px-4 md:px-6 flex-1 pb-24 pt-5 md:py-6">
        <!-- Gantt view -->
        <div v-if="view==='gantt'" class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100 p-4 mb-4">
          <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
            <div class="flex items-center gap-2">
              <button @click="prevGanttMonth" class="p-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 cursor-pointer text-slate-500">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
              <div class="text-sm font-bold text-slate-700 min-w-[130px] text-center">{{ ganttMonthLabel }}</div>
              <button @click="nextGanttMonth" class="p-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 cursor-pointer text-slate-500">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
              </button>
            </div>
            <div class="flex items-center gap-4 text-xs text-slate-500">
              <span class="flex items-center gap-1.5"><span class="inline-flex items-center justify-center min-w-[26px] h-[22px] rounded-md bg-slate-100 text-slate-600 text-[11px] font-semibold px-1">5/5</span>รับครบแล้ว</span>
              <span class="flex items-center gap-1.5"><span class="inline-flex items-center justify-center min-w-[26px] h-[22px] rounded-md bg-red-100 text-red-700 text-[11px] font-semibold px-1">3/5</span>รับแล้ว/ทั้งหมด (ยังไม่ครบ)</span>
            </div>
          </div>

          <div v-if="ganttLoading" class="flex justify-center py-10"><div class="spinner w-8 h-8"></div></div>
          <div v-else-if="!ganttData.length" class="text-center py-10 text-slate-400">ไม่มีงานมอบหมายเดือนนี้</div>
          <template v-else>
          <div class="overflow-x-auto">
            <div :style="{minWidth: (150 + ganttDaysInMonth*26) + 'px'}">
              <div class="grid" :style="{gridTemplateColumns: `150px repeat(${ganttDaysInMonth}, 26px)`}">
                <div class="text-xs text-slate-400 pb-1.5 border-b border-slate-100">Sale</div>
                <div v-for="d in ganttDaysInMonth" :key="d"
                  class="text-center text-[10px] pb-1.5 border-b border-slate-100"
                  :class="d===ganttToday ? 'text-red-600 font-bold' : 'text-slate-400'">{{ d }}</div>
              </div>
              <div v-for="s in ganttData" :key="s.sale_id" class="grid items-center border-b border-slate-50"
                :style="{gridTemplateColumns: `150px repeat(${ganttDaysInMonth}, 26px)`}">
                <div class="text-sm text-slate-700 py-2 truncate pr-2">{{ s.sale_name }}</div>
                <div v-for="d in ganttDaysInMonth" :key="d" class="flex items-center justify-center py-1.5">
                  <button v-if="s.days[d]" type="button"
                    class="inline-flex items-center justify-center min-w-[26px] h-[22px] rounded-md text-[11px] font-semibold px-1 border-0 cursor-pointer"
                    :class="s.days[d].accepted < s.days[d].total ? 'bg-red-100 text-red-700' : 'bg-slate-100 text-slate-600'"
                    @click="openGanttDetail(s, d)">{{ s.days[d].accepted }}/{{ s.days[d].total }}</button>
                </div>
              </div>
            </div>
          </div>

          <!-- Detail panel: งานของ sale คนนี้ที่มอบหมายวันนี้ -->
          <div v-if="ganttDetail" class="mt-4 bg-slate-50 rounded-xl p-4">
            <div class="flex items-center justify-between mb-3">
              <p class="text-sm text-slate-500">{{ ganttDetail.saleName }} · วันที่ {{ ganttDetail.day }} {{ thMonths[ganttMonth] }}</p>
              <button class="bg-transparent border-0 text-slate-400 hover:text-slate-600 text-xl leading-none cursor-pointer" @click="ganttDetail=null">×</button>
            </div>
            <div v-for="item in ganttDetail.items" :key="item.id"
              class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 sm:gap-3 py-2.5 border-t border-slate-200 first:border-t-0">
              <div class="min-w-0">
                <p class="text-sm text-slate-700 mb-1 break-words">{{ item.project_name }}</p>
                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold"
                  :class="item.accepted ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'">
                  {{ item.accepted ? 'รับงานแล้ว' : 'ยังไม่กดรับ' }}
                </span>
              </div>
              <div class="flex flex-wrap gap-2 sm:shrink-0">
                <template v-if="!item.accepted">
                  <button class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-100 border-0 cursor-pointer"
                    @click="openNudgeModal({ project_code: item.project_code, project_name: item.project_name, sale_name: ganttDetail.saleName })">ส่งข้อความเร่งงาน</button>
                  <button class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-100 border-0 cursor-pointer"
                    @click="openReassignModal({ project_code: item.project_code, project_name: item.project_name, sale_name: ganttDetail.saleName, assigned_to: ganttDetail.saleId })">มอบหมายใหม่</button>
                </template>
                <button class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer"
                  @click="openDetail(item.project_code, 'assign-detail')">ดูรายละเอียด</button>
              </div>
            </div>
          </div>
          </template>
        </div>

        <!-- Filter bar -->
        <div v-if="view==='list'" class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100 mb-4">
          <div class="px-4 py-3.5">
            <!-- มุมมองงานค้างสำเร็จรูปพร้อมตัวเลข (Saved List Views มาตรฐาน CRM — ยืนยันจากผู้ใช้ 2026-10-10) แทน dropdown สถานะ + ปุ่มกรองเดิม
                 4 อันแรก = งานที่ต้องติดตาม (ตัวเลขแดงเมื่อมีงาน) / ตัวเลขนับตาม Sale ที่เลือก / กดแล้วรายการเปลี่ยนทันที — นิยามอยู่ที่ listViews -->
            <div class="text-xs font-semibold text-slate-500 mb-1.5">งานที่ต้องติดตาม</div>
            <div class="flex flex-wrap items-center gap-2 mb-3.5">
              <template v-for="(v, i) in listViews" :key="v.key">
                <span v-if="i === 4" class="w-px h-6 bg-slate-200 mx-1"></span>
                <button type="button" @click="filter.view = v.key"
                  class="inline-flex items-center gap-1.5 pl-3.5 pr-1.5 py-1.5 rounded-full text-sm font-semibold cursor-pointer transition-colors"
                  :class="filter.view === v.key ? 'border-2 border-teal-600 bg-teal-50 text-teal-800' : 'border border-slate-200 bg-white text-slate-700 hover:border-slate-400'">
                  {{ v.label }}
                  <span class="min-w-[24px] px-1.5 py-0.5 rounded-full text-xs font-bold text-center"
                    :class="filter.view === v.key ? 'bg-teal-600 text-white' : (v.attention && viewCounts[v.key] ? 'bg-red-100 text-red-700' : 'bg-slate-100 text-slate-600')">{{ viewCounts[v.key] }}</span>
                </button>
              </template>
            </div>
            <div class="flex flex-wrap gap-3 items-end">
              <!-- ช่องค้นหา (List View search มาตรฐาน CRM — ยืนยันจากผู้ใช้ 2026-10-10) แบบเดียวกับหน้างานประมูล: กรองทันทีที่พิมพ์ ค้นชื่อโครงการ/หน่วยงาน/รหัสงาน/เลขที่โครงการ (matchesSearch) -->
              <div class="flex flex-col gap-1 flex-1 min-w-[260px]">
                <label class="block text-xs font-semibold text-slate-500">ค้นหา</label>
                <div class="relative">
                  <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                  <input v-model="filter.search" type="text" placeholder="ค้นหาชื่อโครงการ, หน่วยงาน, รหัสงาน..."
                    class="w-full border-2 border-slate-200 rounded-xl pl-11 pr-10 py-2 text-base outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100 bg-white placeholder:text-slate-400">
                  <button v-if="filter.search" type="button" @click="filter.search = ''" title="ล้างคำค้น" aria-label="ล้างคำค้น"
                    class="absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-700 hover:bg-slate-100 bg-transparent border-0 cursor-pointer text-lg leading-none">✕</button>
                </div>
              </div>
              <div v-if="isSecretary" class="flex flex-col gap-1">
                <label class="block text-xs font-semibold text-slate-500">Sales</label>
                <select v-model="filter.assigned_to" @change="loadAssignments"
                  class="border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
                  <option value="">ทุกคน</option>
                  <option v-for="u in salesUsers" :key="u.id" :value="u.id">{{ u.full_name }}</option>
                </select>
              </div>
            </div>
            <button type="button" @click="showStatusLegend=!showStatusLegend"
              class="flex items-center gap-1.5 text-xs text-slate-400 hover:text-slate-600 bg-transparent border-0 p-0 mt-3 cursor-pointer">
              <!-- ไอคอน i วงกลมเทา แบบเดียวกับปุ่มคำอธิบายในหน้างานประมูล (bid-pipeline.html) แทน emoji ℹ️ (2026-10-10) -->
              <span class="w-4 h-4 flex items-center justify-center rounded-full bg-slate-300 text-white text-[10px] font-black leading-none shrink-0">i</span>
              ลำดับสถานะงาน {{ showStatusLegend ? '▲' : '▼' }}
            </button>
            <div v-if="showStatusLegend" class="bg-slate-50 rounded-xl p-3 mt-2 text-xs text-slate-600 leading-relaxed">
              รอดำเนินการ → รับงาน/ศึกษา TOR → จัดเตรียมยื่นข้อเสนอ → รอประกาศผล → <strong class="text-emerald-700">ชนะการประมูล</strong> → ส่งมอบแล้ว
              <br>(หรือ <strong class="text-rose-700">แพ้การประมูล</strong> / ยกเลิก ได้ทุกขั้นตอน)
            </div>
          </div>
        </div>

        <template v-if="view==='list'">
        <div v-if="loading" class="flex flex-col items-center justify-center py-12 text-slate-400">
          <div class="spinner w-8 h-8 mx-auto"></div>
        </div>
        <div v-else-if="!filteredAssignments.length" class="flex flex-col items-center justify-center py-12 text-slate-400">
          <!-- ไอคอนเส้นสีเทา (รูปคลิปบอร์ดเดียวกับหัวหน้านี้) แทน emoji 📭 (2026-10-10) -->
          <svg class="w-10 h-10 mb-3 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>
          <p>{{ filter.search && assignments.length ? 'ไม่พบงานที่ค้นหา' : 'ไม่มีงานในมุมมองนี้' }}</p>
        </div>
        <div v-else class="grid gap-3" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">
          <!-- การ์ดแบบใหม่ (ยืนยันจากผู้ใช้ + mockup 2026-10-10): พื้นขาวทุกใบ / สีเฉพาะป้ายสถานะ + ข้อความเตือนจุดเดียว
               บรรทัดผลตามสถานะ (cardResult) — ยังไม่ยื่นซองนับวันปิดรับ / ยื่นแล้วรอผล / จบแล้วแสดงผล+เหตุผล
               ปุ่มท้ายการ์ด: งานยังไม่จบ = อัพเดตสถานะ/มอบหมายใหม่/เร่งงาน, งานจบแล้ว = อัพเดตสถานะ — กดส่วนอื่นของการ์ดเปิดรายละเอียด -->
          <div v-for="a in filteredAssignments" :key="a.id"
            class="bg-white rounded-xl p-4 shadow-sm ring-1 ring-slate-100 cursor-pointer hover:shadow-md transition-shadow flex flex-col"
            @click="openDetail(a.project_code, 'assign-detail')">

            <div class="flex items-center justify-between gap-2 mb-2">
              <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold" :class="statusBadge(a.status)">{{ a.status }}</span>
              <span v-if="a.priority==='เร่งด่วน'" class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold bg-red-100 text-red-700">เร่งด่วน</span>
            </div>

            <!-- รหัสงานกลาง (ป้ายม่วง) + เลขที่โครงการ e-GP -->
            <div class="flex items-center gap-1.5 mb-1 flex-wrap">
              <span v-if="a.project_code" class="text-[.7rem] font-mono font-bold text-purple-700 bg-purple-50 rounded px-1.5 py-0.5">{{ a.project_code }}</span>
              <span v-if="a.project_no" class="text-xs text-slate-400 font-mono">{{ a.project_no }}</span>
            </div>

            <div v-if="a.price_median" class="text-xl font-bold text-slate-800 mb-1">฿{{ Number(a.price_median).toLocaleString() }}</div>
            <h4 class="font-bold text-slate-800 text-sm mb-0.5 line-clamp-2">{{ a.project_name }}</h4>
            <p class="text-xs text-slate-400 mb-2">{{ a.unit_name }}</p>

            <!-- บรรทัดผลตามสถานะ -->
            <div class="border-t border-slate-100 pt-2 flex items-start justify-between gap-2 text-xs text-slate-500">
              <span class="min-w-0 line-clamp-2"><span v-if="cardResult(a).prefix" class="font-semibold" :class="cardResult(a).prefixClass">{{ cardResult(a).prefix }}:</span> {{ cardResult(a).text }}</span>
              <span v-if="cardResult(a).right" class="shrink-0 font-semibold" :class="cardResult(a).rightClass">{{ cardResult(a).right }}</span>
            </div>

            <div class="text-xs text-slate-500 mt-1.5">
              {{ a.sale_name }}<span v-if="a.status==='รอดำเนินการ' && a.sla_status==='เกิน'" class="text-red-600 font-semibold"> · ยังไม่กดรับ เกิน SLA</span>
            </div>
            <div v-if="a.secretary_notes" class="text-xs text-slate-500 mt-1 line-clamp-2">หมายเหตุ: {{ a.secretary_notes }}</div>

            <!-- ปุ่มท้ายการ์ด — @click.stop กันไม่ให้เปิดรายละเอียดซ้อน -->
            <div class="flex gap-1.5 mt-auto pt-3" @click.stop>
              <button type="button" @click.stop="openStatusFromCard(a)"
                class="flex-1 px-2 py-2 rounded-lg text-xs font-semibold border-0 cursor-pointer min-h-[36px]"
                :class="isClosedStatus(a.status) ? 'bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50' : 'bg-teal-700 hover:bg-teal-800 text-white'">อัพเดตสถานะ</button>
              <template v-if="!isClosedStatus(a.status)">
                <button type="button" @click.stop="openReassignModal({ ...a, assigned_to: a.sale_id })"
                  class="flex-1 px-2 py-2 rounded-lg text-xs font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer min-h-[36px]">มอบหมายใหม่</button>
                <button type="button" @click.stop="openNudgeModal(a)"
                  class="flex-1 px-2 py-2 rounded-lg text-xs font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer min-h-[36px]">เร่งงาน</button>
              </template>
            </div>
          </div>
        </div>
        </template>
      </main>
      </div>
    </div>

    <!-- Mobile bottom nav -->
    <app-tab-bar :tabs="tabItems"></app-tab-bar>

    <app-modal ref="appModal"></app-modal>

    <!-- MODALS -->
    <div class="fixed inset-0 bg-black/50 flex items-start justify-center z-[1000] p-4 overflow-y-auto"
      v-if="modal.type" @click.self="closeModal">

      <!-- Assignment Detail Modal -->
      <!-- หน้าต่างแบบมาตรฐานของระบบ (ยืนยันจากผู้ใช้ 2026-10-10 — ทั้ง 4 หน้าต่างของหน้านี้): หัวขาว + รหัสงาน / เนื้อหาเลื่อนได้ / ปุ่มติดล่าง -->

        </div>

          <div class="flex gap-2 flex-wrap mb-4">

            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold" :class="priorityBadge(modal.data.priority)">{{ modal.data.priority }}</span>
            <span class="text-sm" :class="slaClass(modal.data.sla_status)">
              {{ modal.data.sla_status==='เกิน' ? 'เกิน SLA' : modal.data.sla_status==='ใกล้ถึง' ? 'ใกล้ถึง SLA' : 'SLA ปกติ' }}

          </div>

          <div class="mb-4">
            <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2">ข้อมูลโครงการ</div>
            <div class="flex gap-2 py-1.5 border-b border-slate-50"><span class="text-sm text-slate-400 min-w-[120px] shrink-0">เลขที่โครงการ</span><span class="text-sm text-slate-700 font-mono">{{ modal.data.project_no }}</span></div>

            <div class="flex gap-2 py-1.5 border-b border-slate-50"><span class="text-sm text-slate-400 min-w-[120px] shrink-0">วันปิดรับ</span><span class="text-sm font-semibold text-red-600">{{ formatDateThai(modal.data.close_date) }}</span></div>
            <div class="flex gap-2 py-1.5 border-b border-slate-50"><span class="text-sm text-slate-400 min-w-[120px] shrink-0">ราคากลาง</span><span class="text-sm font-semibold text-green-600">{{ formatPrice(modal.data.price_median) }}</span></div>
            <div class="flex gap-2 py-1.5 border-b border-slate-50"><span class="text-sm text-slate-400 min-w-[120px] shrink-0">เข้าประมูล</span><span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold whitespace-nowrap" :class="canBidBadge(modal.data.can_bid)">{{ modal.data.can_bid }}</span></div>

              <span class="text-sm text-slate-400 min-w-[120px] shrink-0">ลิงก์</span>
              <a :href="modal.data.url" target="_blank" rel="noopener" class="text-blue-600 text-sm hover:underline">เปิดประกาศ ↗</a>
            </div>
          </div>

          <div v-if="modal.data.items" class="mb-4">
            <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2">รายการสินค้าและจำนวน</div>
            <div class="rounded-lg bg-slate-50 p-3 max-h-[260px] overflow-y-auto">
              <div v-if="parsedItems.summary" class="text-xs font-semibold text-slate-500 mb-2">{{ parsedItems.summary }}</div>
              <div v-for="(row, i) in parsedItems.rows" :key="i" class="py-2" :class="i>0 ? 'border-t border-slate-200' : ''">

                  <div class="text-sm font-semibold text-slate-800 mb-1">{{ row.no }}. {{ row.name }}</div>
                  <div class="flex flex-wrap gap-x-4 gap-y-0.5 text-xs text-slate-600">
                    <span>จำนวน: <strong class="text-teal-700">{{ row.qty }}{{ row.unit ? ' ' + row.unit : '' }}</strong></span>
                    <span>ราคา/หน่วย: <strong>{{ formatNum(row.unitPrice) }}</strong> บาท</span>
                    <span>รวม: <strong class="text-green-700">{{ formatNum(row.total) }}</strong> บาท</span>
                  </div>
                </template>
                <template v-else>
                  <div class="text-sm text-slate-700 flex gap-2 leading-relaxed"><span class="text-teal-600 shrink-0">•</span><span>{{ row.text }}</span></div>

          </div>
          <div v-if="modal.data.spec" class="mb-4">

          </div>
          <div v-if="modal.data.docs_required" class="mb-4">
            <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2">เอกสารที่ต้องเตรียม</div>
            <div class="text-sm p-3 rounded-lg bg-slate-50 text-slate-700 max-h-[220px] overflow-y-auto whitespace-pre-wrap break-words leading-relaxed">{{ modal.data.docs_required }}</div>
          </div>
          <div v-if="modal.data.need_sample || modal.data.sample_detail" class="mb-4">
            <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2">รายละเอียดตัวอย่าง</div>
            <div class="text-sm p-3 rounded-lg bg-slate-50 text-slate-700">

              <div v-if="modal.data.sample_detail" class="whitespace-pre-wrap break-words leading-relaxed">{{ modal.data.sample_detail }}</div>

          </div>

          <div class="mb-4">
            <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2">เอกสารโครงการ</div>
            <div v-if="docsLoading" class="text-sm text-slate-400 py-2">กำลังโหลดรายการเอกสาร...</div>
            <template v-else-if="docs?.available && docs.files.length">
              <a v-for="f in docs.files" :key="f.name"

                 target="_blank" rel="noopener"
                 class="flex items-center gap-2 py-2 px-2.5 -mx-2.5 rounded-lg hover:bg-slate-50 text-sm text-slate-700 no-underline transition-colors">

                  <span class="block truncate font-medium">{{ docLabel(f.name) || f.name }}</span>
                  <span v-if="docLabel(f.name)" class="block truncate text-[11px] text-slate-400">{{ f.name }}</span>
                </span>
                <span class="text-xs text-slate-400 shrink-0">{{ formatFileSize(f.size) }}</span>
              </a>
            </template>
            <div v-else class="text-sm text-slate-400 py-1">
              {{ docs?.available===false ? 'ยังไม่พบโฟลเดอร์เอกสารสำหรับโครงการนี้' : 'ไม่สามารถโหลดรายการเอกสารได้' }}
              <button v-if="modal.data.announce_date" type="button" @click="openFolder(modal.data.announce_date)"
                class="block mt-1 text-blue-600 text-xs hover:underline bg-transparent border-0 p-0 cursor-pointer text-left">
                📋 คัดลอก path โฟลเดอร์แทน
              </button>
            </div>
          </div>

          <div class="mb-4">
            <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2">การมอบหมาย</div>
            <div class="flex gap-2 py-1.5 border-b border-slate-50"><span class="text-sm text-slate-400 min-w-[120px] shrink-0">มอบหมายให้</span><span class="text-sm font-semibold text-slate-700">{{ modal.data.sale_name }}</span></div>

          </div>

          <div v-if="modal.data.secretary_notes" class="mb-4">
            <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2">หมายเหตุจากธุรการ</div>
            <div class="text-sm p-3 rounded-lg bg-blue-50 text-blue-800">{{ modal.data.secretary_notes }}</div>
          </div>
          <div v-if="modal.data.sale_notes" class="mb-4">
            <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2">บันทึก Sales</div>
            <div class="text-sm p-3 rounded-lg bg-green-50 text-green-800">{{ modal.data.sale_notes }}</div>
          </div>
          <div v-if="modal.data.bid_amount" class="mb-4">
            <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2">ราคาที่เสนอ</div>
            <div class="text-xl font-bold text-green-600">{{ formatPrice(modal.data.bid_amount) }}</div>
          </div>
          <div v-if="modal.data.history?.length" class="mb-4">
            <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2">ประวัติการเปลี่ยนสถานะ</div>
            <div v-for="h in modal.data.history" :key="h.id" class="flex gap-3 py-2">
              <div class="w-2.5 h-2.5 rounded-full bg-teal-400 shrink-0 mt-1"></div>
              <div class="flex-1">
                <div class="text-sm font-medium text-slate-700">{{ h.changed_by_name }}</div>
                <div class="text-xs text-slate-500">
                  <span v-if="h.old_status">{{ h.old_status }} → </span>
                  <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold" :class="statusBadge(h.new_status)">{{ h.new_status }}</span>
                  <span v-if="h.note"> · {{ h.note }}</span>
                </div>
                <!-- ผลแพ้/ชนะที่เก็บไว้ในประวัติ ณ ตอนบันทึกผล — ดูย้อนหลังได้แม้งานถูกย้ายกลับแล้ว (ยืนยันจากผู้ใช้ 2026-09-25) -->
                <div v-if="h.win_loss_reason_name" class="text-xs text-slate-600 mt-0.5">
                  เหตุผล: {{ h.win_loss_reason_name }}<span v-if="h.win_loss_note"> — {{ h.win_loss_note }}</span>
                  <span v-if="h.winner_name"> · แพ้ให้ {{ h.winner_name }}<span v-if="Number(h.winning_price)"> ({{ formatPrice(h.winning_price) }})</span></span>
                </div>
                <div class="text-[11px] text-slate-400">{{ formatDateTimeThai(h.changed_at) }}</div>
              </div>
            </div>
          </div>
        </div>
        <div class="px-5 py-4 flex items-center justify-end gap-2 flex-wrap border-t border-slate-100 shrink-0">
          <button class="inline-flex items-center px-4 py-2.5 rounded-xl text-[.95rem] font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer min-h-[44px]" @click="closeModal">ปิด</button>
          <template v-if="isSecretary && !isClosedStatus(modal.data.status)">
            <button class="inline-flex items-center px-4 py-2.5 rounded-xl text-[.95rem] font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer min-h-[44px]" @click="openNudgeModal(modal.data)">เร่งงาน</button>

        </div>

              <span class="text-xs text-slate-400 truncate">{{ modal.data?.project_name }}</span>
            </div>

            <div class="text-sm text-slate-500">สถานะงาน: {{ modal.data.status }}</div>
          </section>
          <section class="rounded-2xl border border-slate-200 bg-slate-50/60 p-4 space-y-3">
            <div class="flex items-center gap-2 pb-2 border-b border-slate-200">
              <span class="w-7 h-7 rounded-full bg-teal-600 text-white text-sm font-bold flex items-center justify-center shrink-0">2</span>
              <h3 class="text-base font-bold text-slate-800 m-0">ย้ายงานไปให้ <span class="text-red-500">*</span></h3>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <button v-for="u in salesUsers.filter(u => Number(u.id) !== Number(modal.data.assigned_to ?? modal.data.sale_id))" :key="u.id" type="button"
                @click="reassignForm.assigned_to = u.id"
                class="flex items-center gap-2 text-left px-3.5 py-2.5 rounded-xl border-2 text-base font-semibold cursor-pointer"
                :class="Number(reassignForm.assigned_to) === Number(u.id) ? 'border-teal-600 bg-teal-50 text-teal-800' : 'border-slate-200 bg-white text-slate-800 hover:border-slate-400'">
                <img v-if="u.photo_url" :src="u.photo_url" class="w-7 h-7 rounded-full object-cover shrink-0"/>
                <span v-else class="w-7 h-7 rounded-full flex items-center justify-center text-white text-xs font-bold shrink-0" :style="{background: u.avatar_color || '#64748b'}">{{ avatarInitials(u.full_name) }}</span>
                <span class="flex-1 min-w-0 truncate">{{ u.full_name }}</span>
                <span v-if="Number(reassignForm.assigned_to) === Number(u.id)" class="shrink-0">✓</span>
              </button>
            </div>
            <div v-if="!salesUsers.length" class="text-sm text-slate-500">กำลังโหลดรายชื่อ Sale…</div>
            <div class="text-sm text-slate-500">Sale คนใหม่จะได้รับแจ้งเตือนทันที</div>
          </section>
        </div>
        <div class="px-5 py-4 flex justify-end gap-2 border-t border-slate-100 shrink-0">

          <button class="inline-flex items-center px-6 py-2.5 rounded-xl text-[.95rem] font-bold border-0 text-white min-h-[44px] bg-teal-700 hover:bg-teal-800 cursor-pointer disabled:opacity-50" :disabled="!reassignForm.assigned_to" @click="submitReassign">ยืนยันมอบหมายใหม่</button>
        </div>
      </div>

            <div class="flex items-center gap-1.5 mt-1 min-w-0">
              <span v-if="modal.data?.project_code" class="text-[.7rem] font-mono font-bold text-purple-700 bg-purple-50 rounded px-1.5 py-0.5 shrink-0">{{ modal.data.project_code }}</span>
              <span class="text-xs text-slate-400 truncate">{{ modal.data?.project_name }}</span>
            </div>

<script>
const { createApp } = Vue;

createApp({
  components: { AppNav, AppTabBar, AppModal, AppErpWarning, AppNoBidReasons },
  data() {
    return {
      authReady: false,
      currentUser: null,
      modal: { type: null, data: null },
      docs: null,
      docsLoading: false,
      showStatusLegend: false,
      loading: false,
      assignments: [],
      salesUsers: [],
      filter: { view: 'all', assigned_to: '', search: '' },   // view = มุมมองงานค้าง (listViews) / search = ช่องค้นหา — กรองฝั่งหน้าเว็บทันที (2026-10-10)
      statusForm: { project_code: null, status: '', sale_notes: '', bid_amount: null, note: '', win_loss_reason_id: '', win_loss_note: '', winner_competitor_id: '', winning_price: '' },
      winLossReasons: [], // master เหตุผลแพ้/ชนะ (api/win_loss_reasons.php) — ใช้ตอนเลือก "แพ้การประมูล"
      competitors: [],    // master คู่แข่ง (api/competitors.php) — ตัวเลือกผู้ชนะ
      reassignForm: { project_code: null, assigned_to: '' },
      nudgeForm: { project_code: null, message: '' },
      view: 'list',   // เปิดหน้าเข้ารายการก่อน (เดิมปฏิทิน — เอาออก 2026-10-10)
      ganttYear: new Date().getFullYear(),
      ganttMonth: new Date().getMonth() + 1,
      ganttData: [],
      ganttLoading: false,
      ganttTodayStr: null,
      ganttDetail: null,
      thMonths: ['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'],
    };
  },
  watch: {
    // เปลี่ยนสถานะระหว่างชนะ/แพ้: เหตุผลเดิมเป็นของอีกฝั่ง (เช่น เคยชนะด้วย "คุณสมบัติตรงสเปก" แล้วแก้เป็นแพ้) ไม่อยู่ในรายการ
    // ของฝั่งใหม่ ช่องเหตุผลจะขึ้นว่างเปล่า → ล้างให้เลือกใหม่ (บั๊กที่ผู้ใช้เจอ 2026-09-25)
    // สลับกลับมาฝั่งเดิม (เช่น ชนะ → แพ้ → ชนะ) → คืนเหตุผลที่บันทึกไว้ของงาน แทนที่จะว่างเปล่า
    'statusForm.status'(status) {
      const type = status === 'ชนะการประมูล' ? 'won' : status === 'แพ้การประมูล' ? 'lost' : null;
      if (!type) return;
      // เทียบด้วยรหัส win_loss_reason_id (เปลี่ยนจากข้อความ 2026-09-25)
      const fits = id => this.winLossReasons.some(r => r.win_loss_type === type && r.applies_to !== 'sales' && String(r.win_loss_reason_id) === String(id));
      if (this.statusForm.win_loss_reason_id && fits(this.statusForm.win_loss_reason_id)) return;
      const saved = this.modal.data?.win_loss_reason_id ? String(this.modal.data.win_loss_reason_id) : '';
      this.statusForm.win_loss_reason_id = fits(saved) ? saved : '';
    },
  },
  computed: {
    // ตัวเลือกเหตุผลที่แพ้ (ใช้งานอยู่) และตัวเลือกผู้ชนะ (ไม่รวม "ไม่มีคู่แข่ง" เพราะแพ้ = มีผู้ชนะ) — เหมือน bid-pipeline.html
    // เฉพาะเหตุผลของงานประมูล (applies_to = ebidding / both)
    lostReasonOptions() { return this.winLossReasons.filter(r => r.win_loss_type === 'lost' && r.applies_to !== 'sales' && Number(r.is_active) === 1); },
    wonReasonOptions()  { return this.winLossReasons.filter(r => r.win_loss_type === 'won'  && r.applies_to !== 'sales' && Number(r.is_active) === 1); },
    winnerOptions() { return this.competitors.filter(c => Number(c.is_active) === 1 && c.competitor_code !== 'CP-NONE'); },
    // ยังไม่เลือกเหตุผล → ถือว่าบังคับไว้ก่อน (แสดง *) จะไม่บังคับก็ต่อเมื่อเลือกเหตุผลที่ไม่มีผู้ชนะจริง เช่น ลูกค้ายกเลิก
    statusRequiresWinner() {
      if (!this.statusForm.win_loss_reason_id) return true;
      return Number(this.statusSelectedReason?.requires_winner) === 1;
    },
    statusSelectedReason() {
      return this.winLossReasons.find(r => String(r.win_loss_reason_id) === String(this.statusForm.win_loss_reason_id)) || null;
    },
    // เหตุผลที่ admin ตั้ง "ต้องกรอกรายละเอียด" (requires_note เช่น อื่นๆ) — เดิมเช็คชื่อ "อื่นๆ" ตรงตัว
    // มุมมองงานค้างสำเร็จรูป (Saved List Views — ยืนยันจากผู้ใช้ 2026-10-10) — attention = งานที่ต้องติดตาม (ตัวเลขแดงเมื่อมีงาน)
    //   "ใกล้ / เลยวันปิดรับ" = ยังไม่ยื่นซอง และวันปิดรับเหลือ ≤ 3 วันหรือเลยแล้ว (3 วัน = กฎธุรกิจ ปรับได้ที่นี่)
    listViews() {
      const preSubmit = ['รอดำเนินการ', 'รับงาน/ศึกษา TOR', 'จัดเตรียมยื่นข้อเสนอ'];
      const nearClose = a => { const d = this.daysToClose(a.close_date); return d !== null && d <= 3; };
      return [
        { key: 'unaccepted', label: 'Sale ยังไม่กดรับ',      attention: true, match: a => a.status === 'รอดำเนินการ' },
        { key: 'closing',    label: 'ใกล้ / เลยวันปิดรับ',  attention: true, match: a => preSubmit.includes(a.status) && nearClose(a) },
        { key: 'awaiting',   label: 'รอประกาศผล',          attention: true, match: a => a.status === 'รอประกาศผล' },
        { key: 'won',        label: 'ชนะ รอส่งมอบ',        attention: true, match: a => a.status === 'ชนะการประมูล' },
        { key: 'preparing',  label: 'กำลังเตรียมยื่น',      match: a => ['รับงาน/ศึกษา TOR', 'จัดเตรียมยื่นข้อเสนอ'].includes(a.status) },
        { key: 'closed',     label: 'ปิดแล้ว',             match: a => ['ส่งมอบแล้ว', 'แพ้การประมูล', 'ยกเลิก'].includes(a.status) },
        { key: 'all',        label: 'ทั้งหมด',             match: () => true },
      ];
    },
    // ตัวเลขของแต่ละมุมมอง — นับจากงานที่โหลดมา (กรอง Sale แล้วที่ API) ไม่ขึ้นกับช่องค้นหา
    viewCounts() {
      const counts = {};
      this.listViews.forEach(v => { counts[v.key] = this.assignments.filter(v.match).length; });
      return counts;
    },
    // รายการที่แสดง = มุมมองที่เลือก แล้วกรองด้วยช่องค้นหา — 4 ช่องเดียวกับ matchesSearch() ใน bid-pipeline.html (2026-10-10)
    filteredAssignments() {
      const view = this.listViews.find(v => v.key === this.filter.view) || this.listViews[this.listViews.length - 1];
      const rows = this.assignments.filter(view.match);
      const q = (this.filter.search || '').trim().toLowerCase();
      if (!q) return rows;
      return rows.filter(a => [a.project_name, a.unit_name, a.project_code, a.project_no]
        .some(v => (v || '').toLowerCase().includes(q)));
    },
    // ยกเลิกจากสถานะก่อนยื่นซอง = ไม่เข้าประมูล (ต้องตรงกับ BID_PRE_SUBMIT_STATUSES ใน api/assignments.php — 2026-10-10)
    cancelIsNoBid() { return ['รอดำเนินการ', 'รับงาน/ศึกษา TOR', 'จัดเตรียมยื่นข้อเสนอ'].includes(this.statusForm.orig_status); },
    // หน้าต่างอัพเดตสถานะ: กล่อง ② "ผล" ขึ้นเมื่อสถานะที่เลือกมีช่องต้องกรอก (ราคา / ชนะ / ส่งมอบ / แพ้ / ยกเลิก) — 2026-10-10
    statusHasResultSection() {
      const st = this.statusForm.status;
      if (st === 'ยกเลิก') return this.statusForm.orig_status !== 'ยกเลิก';
      return ['จัดเตรียมยื่นข้อเสนอ', 'รอประกาศผล', 'ชนะการประมูล', 'ส่งมอบแล้ว', 'แพ้การประมูล'].includes(st);
    },
    statusResultTitle() {
      return { 'จัดเตรียมยื่นข้อเสนอ': 'ราคาที่เสนอ', 'รอประกาศผล': 'ราคาที่เสนอ', 'ชนะการประมูล': 'ผลชนะการประมูล',
               'ส่งมอบแล้ว': 'วันที่ส่งมอบ', 'แพ้การประมูล': 'ผลแพ้การประมูล', 'ยกเลิก': 'เหตุผลที่ยกเลิก' }[this.statusForm.status] || 'ผล';
    },
    statusNoteRequired() { return Number(this.statusSelectedReason?.requires_note) === 1; },
    ganttMonthLabel() { return `${this.thMonths[this.ganttMonth]} ${this.ganttYear + 543}`; },
    ganttDaysInMonth() { return new Date(this.ganttYear, this.ganttMonth, 0).getDate(); },
    ganttToday() {
      if (!this.ganttTodayStr) return null;
      const [y, m, d] = this.ganttTodayStr.split('-').map(Number);
      return (y === this.ganttYear && m === this.ganttMonth) ? d : null;
    },
    tabItems() {
      return [
        { label:'ภาพรวม', icon:'home', href:'dashboard.html' },
        { label:'ประกาศ', icon:'bell', href:'announcements.html' },
        { label:'งาน', icon:'clipboard', active:true },
        { label:'ออก', icon:'logout', action:'logout' },
      ];
    },
    isAdmin()      { return this.currentUser?.role === 'admin'; },
    isManager()    { return ['admin','manager'].includes(this.currentUser?.role); },
    isSalesAdmin() { return ['admin','salesadmin'].includes(this.currentUser?.role); },
    isSecretary()  { return ['admin','salesadmin','manager'].includes(this.currentUser?.role); },
    isSale()       { return this.currentUser?.role === 'sale'; },
    parsedItems() {
      const raw = this.modal?.data?.items;
      if (!raw) return { summary: '', rows: [] };
      let t = raw.trim();
      let summary = '';
      const sm = t.match(/^(\d+\s*รายการ)\s*:\s*/);
      if (sm) { summary = sm[1]; t = t.slice(sm[0].length); }
      const lines = this.splitClauses(t);
      const rows = lines.map(line => {
        const m = line.match(/^\(?(\d+)\)?\s*(.+?)\s+(\d+(?:\.\d+)?)\s*(ชุด|ตัว|ชิ้น|อัน|เครื่อง|หน่วย|ห้อง|คัน|โต๊ะ|เตียง|ตู้|เก้าอี้)?\s*@\s*([\d,]+(?:\.\d+)?)\s*=\s*([\d,]+(?:\.\d+)?)\s*$/);
        if (m) return { parsed: true, no: m[1], name: m[2].trim(), qty: m[3], unit: m[4] || '', unitPrice: m[5], total: m[6] };
        return { parsed: false, text: line };
      });
      return { summary, rows };
    },
  },
  async mounted() {
    try {
      const res = await apiCall('GET', 'api/auth.php?action=me');
      if (!res.success) { window.location.href = 'login.html'; return; }
      this.currentUser = res.data;
      if (!['admin','salesadmin'].includes(this.currentUser.role)) {
        window.location.href = 'dashboard.html'; return;
      }
    } catch { window.location.href = 'login.html'; return; }
    this.authReady = true;
    this.loadAssignments();
    if (this.isSecretary) this.loadSales();
    this.openDetailFromLink('assign-detail');   // ลิงก์ ?code= จาก LINE / กระดิ่ง → เปิดรายละเอียดงานนั้น (2026-10-10)
  },
  methods: {
    // เรียกโหลดข้อมูลของมุมมองที่กำลังเปิดอยู่ตอนนี้ใหม่ — ใช้หลังอัพเดตสถานะ/มอบหมายใหม่จาก modal
    // ซึ่งเปิดได้จากทุกมุมมอง (Gantt/รายการ) กันข้อมูลค้างของมุมมองที่ผู้ใช้กำลังดูอยู่
    refreshActiveView() {
      if (this.view === 'gantt') this.loadGanttData();
      else if (this.view === 'list') this.loadAssignments();
    },

    ...SharedMethods,

    async loadAssignments() {
      this.loading = true;
      const q = new URLSearchParams({ action: 'list' });
      // ไม่ส่ง status — โหลดทุกสถานะแล้วแบ่งมุมมอง/นับตัวเลขฝั่งหน้าเว็บ (listViews) (2026-10-10)
      if (this.filter.assigned_to) q.set('assigned_to', this.filter.assigned_to);
      const res = await apiCall('GET', `api/assignments.php?${q}`);
      if (res.success) this.assignments = res.data;
      this.loading = false;
    },

    openStatusModal(assignment) {
      this.statusForm = {
        project_code: assignment.project_code,
        status:     assignment.status,
        sale_notes: assignment.sale_notes || '',
        bid_amount: assignment.bid_amount || null,
        note:       '',
        win_loss_reason_id: assignment.win_loss_reason_id ? String(assignment.win_loss_reason_id) : '',
        win_loss_note:   assignment.win_loss_note || '',
        winner_competitor_id: assignment.winner_competitor_id || '',
        winning_price:   assignment.winning_price || '',
        expected_delivery_date: assignment.expected_delivery_date || '',   // วันคาดส่งมอบ (บังคับตอนชนะ — 2026-10-07)
        orig_status:     assignment.status,
        cancel_reason_id: null, cancel_note: '',   // เหตุผลยกเลิก (2026-10-10) แยกจากช่องเหตุผลแพ้/ชนะ กันค่าเดิมติดมา
        delivered_date:  assignment.delivered_date || (assignment.status === 'ส่งมอบแล้ว' ? '' : this.todayIso()),   // วันส่งมอบจริง (2026-10-07)
      };
      this.modal = { type: 'status', data: assignment };
      if (!this.winLossReasons.length) this.loadWinLossMasters();
    },

    // master เหตุผลแพ้/ชนะ + คู่แข่ง — โหลดตอนเปิดหน้าต่างอัพเดตสถานะครั้งแรก
    async loadWinLossMasters() {
      const [r, c] = await Promise.all([
        apiCall('GET', 'api/win_loss_reasons.php?action=list'),
        apiCall('GET', 'api/competitors.php?action=list'),
      ]);
      if (r.success) this.winLossReasons = r.data;
      if (c.success) this.competitors = c.data;
    },

    // วันนี้ (YYYY-MM-DD ตามเวลาเครื่อง) — ค่าตั้งต้นและเพดานของวันที่ส่งมอบจริง
    todayIso() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    },

    async submitStatusUpdate() {
      const payload = { ...this.statusForm };
      delete payload.orig_status;
      if (payload.status !== 'ชนะการประมูล') delete payload.expected_delivery_date;   // ไม่ได้ชนะ ไม่ส่ง (ไม่ล้างค่าเดิม)
      if (payload.status !== 'ส่งมอบแล้ว' || (this.statusForm.orig_status === 'ส่งมอบแล้ว' && !payload.delivered_date)) delete payload.delivered_date;   // งานส่งมอบเก่าไม่มีวันที่ — ไม่บังคับย้อนหลัง
      if (payload.status === 'ส่งมอบแล้ว' && this.statusForm.orig_status !== 'ส่งมอบแล้ว') {
        if (!payload.delivered_date) { await this.showAlert('กรุณาระบุวันที่ส่งมอบจริง', 'error'); return; }
        if (payload.delivered_date > this.todayIso()) { await this.showAlert('วันที่ส่งมอบจริงต้องไม่เกินวันนี้', 'error'); return; }
      }
      if (payload.status === 'ชนะการประมูล' && this.statusForm.orig_status !== 'ชนะการประมูล' && !payload.expected_delivery_date) {
        await this.showAlert('กรุณาระบุวันที่คาดว่าจะส่งมอบ (ดูจากสัญญา/TOR ใส่วันประมาณได้)', 'error'); return;
      }
      if (payload.win_loss_reason_id) payload.win_loss_reason_id = Number(payload.win_loss_reason_id);
      if (payload.status === 'ชนะการประมูล') {
        if (!payload.win_loss_reason_id) { await this.showAlert('กรุณาเลือกเหตุผลที่ชนะ', 'error'); return; }
        if (this.statusNoteRequired && !String(payload.win_loss_note || '').trim()) {
          await this.showAlert(`กรุณากรอกรายละเอียดเพิ่มเติม (เหตุผล "${this.statusSelectedReason.win_loss_reason_name}" ต้องระบุว่าเพราะอะไร)`, 'error'); return;
        }
        // งานชนะไม่มีผู้ชนะ/ราคาผู้ชนะ (เราชนะเอง) — ไม่ส่งไป
        delete payload.winner_competitor_id; delete payload.winning_price;
      } else if (payload.status === 'แพ้การประมูล') {
        if (!payload.win_loss_reason_id) { await this.showAlert('กรุณาเลือกเหตุผลที่แพ้', 'error'); return; }
        if (this.statusNoteRequired && !String(payload.win_loss_note || '').trim()) {
          await this.showAlert(`กรุณากรอกรายละเอียดเพิ่มเติม (เหตุผล "${this.statusSelectedReason.win_loss_reason_name}" ต้องระบุว่าเพราะอะไร)`, 'error'); return;
        }
        // แพ้ทุกกรณีต้องระบุผู้ชนะ (ยืนยันจากผู้ใช้ 2026-09-25) — statusRequiresWinner ตอนนี้คุมแค่ราคา
        if (!payload.winner_competitor_id) {
          await this.showAlert('กรุณาเลือกผู้ชนะ (ถ้าไม่รู้หรือไม่มีผู้ชนะ ให้เลือก "ยังไม่ทราบ")', 'error'); return;
        }
        if (this.statusRequiresWinner && !(Number(payload.winning_price) > 0)) {
          await this.showAlert('กรุณากรอกราคาที่ผู้ชนะเสนอ (ดูจากประกาศผล e-GP)', 'error'); return;
        }
        if (this.statusRequiresWinner && !(Number(payload.bid_amount) > 0)) {
          await this.showAlert('กรุณากรอกราคาที่เราเสนอ', 'error'); return;
        }
        payload.winner_competitor_id = payload.winner_competitor_id || null;
        payload.winning_price = payload.winning_price === '' ? null : payload.winning_price;
      } else if (payload.status === 'ยกเลิก' && this.statusForm.orig_status !== 'ยกเลิก') {
        const note = String(payload.cancel_note || '').trim();
        if (this.cancelIsNoBid) {
          if (!payload.cancel_reason_id) { await this.showAlert('กรุณาเลือกเหตุผลที่ไม่เข้าประมูล', 'error'); return; }
          if (this.$refs.cancelNoBid?.needsNote && !note) { await this.showAlert('กรุณาระบุหมายเหตุว่าเพราะอะไร', 'error'); return; }
        } else if (!note) { await this.showAlert('กรุณาระบุสาเหตุที่ยกเลิก', 'error'); return; }
        payload.win_loss_reason_id = this.cancelIsNoBid ? Number(payload.cancel_reason_id) : null;
        payload.win_loss_note = note;
        delete payload.winner_competitor_id; delete payload.winning_price;
      } else {
        // สถานะอื่นไม่ส่งช่องผลแพ้ไป กันเขียนทับเหตุผลชนะ/แพ้ที่บันทึกไว้จากหน้าอื่น
        delete payload.win_loss_reason_id; delete payload.win_loss_note;
        delete payload.winner_competitor_id; delete payload.winning_price;
      }
      delete payload.cancel_reason_id; delete payload.cancel_note;   // ช่องในฟอร์มเท่านั้น ส่งไปเป็น win_loss_reason_id / win_loss_note แล้ว
      const res = await apiCall('POST', 'api/assignments.php?action=update', payload);
      if (res.success) {
        this.closeModal();
        this.refreshActiveView();
        await this.showAlert('อัพเดตสำเร็จ', 'success');
      } else {
        await this.showAlert(res.message, 'error');
      }
    },

    async loadGanttData() {
      this.ganttLoading = true;
      this.ganttDetail = null;
      const res = await apiCall('GET', `api/assignments.php?action=gantt&year=${this.ganttYear}&month=${this.ganttMonth}`);
      if (res.success) {
        this.ganttData = res.data.sales;
        this.ganttTodayStr = res.data.today;
      } else {
        await this.showAlert(res.message, 'error');
      }
      this.ganttLoading = false;
    },

    prevGanttMonth() {
      this.ganttMonth--; if (this.ganttMonth < 1) { this.ganttMonth = 12; this.ganttYear--; }
      this.loadGanttData();
    },
    nextGanttMonth() {
      this.ganttMonth++; if (this.ganttMonth > 12) { this.ganttMonth = 1; this.ganttYear++; }
      this.loadGanttData();
    },

    openGanttDetail(sale, day) {
      this.ganttDetail = { saleId: sale.sale_id, saleName: sale.sale_name, day, items: sale.days[day].items };
    },

    // งานจบแล้ว (ส่งมอบ / แพ้ / ยกเลิก) — การ์ดเหลือปุ่มอัพเดตสถานะปุ่มเดียว (2026-10-10)
    isClosedStatus(status) { return ['ส่งมอบแล้ว', 'แพ้การประมูล', 'ยกเลิก'].includes(status); },

    // บรรทัดผลบนการ์ดตามสถานะ (2026-10-10) — คำนำหน้าชุดเดียวกับการ์ดหน้างานประมูล (resultPrefix ใน bid-pipeline.html)
    cardResult(a) {
      const preSubmit = ['รอดำเนินการ', 'รับงาน/ศึกษา TOR', 'จัดเตรียมยื่นข้อเสนอ'];
      if (preSubmit.includes(a.status)) {
        if (!a.close_date) return { text: 'ยังไม่มีวันปิดรับ' };
        const d = this.daysToClose(a.close_date);
        return {
          text: 'ปิดรับ ' + this.formatDateThai(a.close_date),
          right: d < 0 ? `เลยกำหนด ${-d} วัน` : d === 0 ? 'ปิดรับวันนี้' : `เหลือ ${d} วัน`,
          rightClass: d < 0 ? 'text-red-600' : d <= 3 ? 'text-amber-600' : 'text-slate-500',   // ≤ 3 วัน = ใกล้ปิดรับ (ตรงกับมุมมอง "ใกล้ / เลยวันปิดรับ")
        };
      }
      if (a.status === 'รอประกาศผล') return { text: 'ยื่นซองแล้ว รอผล' };
      if (a.status === 'ชนะการประมูล') return {
        prefix: a.win_loss_reason ? 'ชนะ' : '', prefixClass: 'text-emerald-700', text: a.win_loss_reason || 'ชนะการประมูล',
        right: a.expected_delivery_date ? 'คาดส่ง ' + this.formatDateThai(a.expected_delivery_date) : '',
      };
      if (a.status === 'ส่งมอบแล้ว') return { text: a.delivered_date ? 'ส่งมอบแล้ว ' + this.formatDateThai(a.delivered_date) : 'ส่งมอบแล้ว' };
      if (a.status === 'แพ้การประมูล') return {
        prefix: 'แพ้', prefixClass: 'text-rose-600',
        text: (a.win_loss_reason || 'ไม่ระบุเหตุผล') + (a.winner_name ? ` · แพ้ให้ ${a.winner_name}` : ''),
      };
      if (a.status === 'ยกเลิก') {
        if (a.win_loss_reason) return { prefix: 'ไม่เข้าประมูล', text: a.win_loss_reason };
        const note = String(a.win_loss_note || '').trim();
        return { prefix: 'ยกเลิก', text: note || (a.sale_notes || 'ไม่ระบุสาเหตุ') };
      }
      return { text: '' };
    },

    // ปุ่ม "อัพเดตสถานะ" บนการ์ด — โหลดรายละเอียดเต็มก่อน (ผู้ชนะ/ราคาผู้ชนะ ฯลฯ ไม่ได้มากับรายการ) แล้วเปิดหน้าต่างเดิม
    async openStatusFromCard(a) {
      const res = await apiCall('GET', `api/assignments.php?action=detail&project_code=${encodeURIComponent(a.project_code)}`);
      if (!res.success) { await this.showAlert(res.message || 'โหลดข้อมูลงานไม่สำเร็จ', 'error'); return; }
      this.openStatusModal(res.data);
    },

    openReassignModal(assignment) {
      this.reassignForm = { project_code: assignment.project_code, assigned_to: '' };
      this.modal = { type: 'reassign', data: assignment };
    },
    async submitReassign() {
      if (!this.reassignForm.assigned_to) { await this.showAlert('กรุณาเลือก sale', 'error'); return; }
      const res = await apiCall('POST', 'api/assignments.php?action=reassign', this.reassignForm);
      if (res.success) {
        this.closeModal();
        this.refreshActiveView();
        await this.showAlert('มอบหมายใหม่สำเร็จ', 'success');
      } else {
        await this.showAlert(res.message, 'error');
      }
    },

    openNudgeModal(assignment) {
      this.nudgeForm = { project_code: assignment.project_code, message: '' };
      this.modal = { type: 'message', data: assignment };
    },
    async submitNudge() {
      if (!this.nudgeForm.message.trim()) { await this.showAlert('กรุณาระบุข้อความ', 'error'); return; }
      const res = await apiCall('POST', 'api/assignments.php?action=nudge', this.nudgeForm);
      if (res.success) {
        this.closeModal();
        await this.showAlert('ส่งข้อความสำเร็จ', 'success');
      } else {
        await this.showAlert(res.message, 'error');
      }
    },

  },
}).mount('#app');
</script>
</body>
</html>
