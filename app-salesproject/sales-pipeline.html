<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>งานขายตรง (Sales Hunt)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="shared/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css?v=16">
<!-- DataTables (ใช้เฉพาะมุมมองตารางของหน้านี้ — jQuery plugin ควบคุมตารางแยกจาก Vue โดยเจตนา เหมือน bid-pipeline.html/sources.html -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<style>
  #spTable_wrapper { padding: 0 1rem 1rem; }
  #spTable_wrapper .dataTables_length,
  #spTable_wrapper .dataTables_filter { float: none; margin-bottom: .75rem; }
  #spTable_wrapper .dataTables_length label,
  #spTable_wrapper .dataTables_filter label { display: flex; align-items: center; gap: .5rem; margin: 0; font-size: .8125rem; color: #64748b; white-space: nowrap; }
  #spTable_wrapper .dataTables_filter input { flex: 0 0 320px; width: 320px; }
  @media (min-width: 640px) {
    #spTable_wrapper { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem 1.5rem; }
    #spTable_wrapper .dataTables_length,
    #spTable_wrapper .dataTables_filter,
    #spTable_wrapper .dataTables_info,
    #spTable_wrapper .dataTables_paginate { margin-bottom: 0; }
    #spTable_wrapper > table { width: 100%; }
  }
  #spTable_wrapper .dataTables_filter input,
  #spTable_wrapper .dataTables_length select { border-radius: 999px; border: 1px solid #e2e8f0; padding: .375rem .9rem; outline: none; }
  #spTable_wrapper .dataTables_filter input:focus,
  #spTable_wrapper .dataTables_length select:focus { border-color: #2dd4bf; box-shadow: 0 0 0 2px #ccfbf1; }
  #spTable_wrapper .dataTables_info { font-size: .8125rem; color: #94a3b8; }
  #spTable_wrapper .dataTables_paginate { display: flex; gap: .25rem; flex-wrap: wrap; }
  #spTable_wrapper .dataTables_paginate .paginate_button.current { background: #0f766e !important; color: #fff !important; border-radius: 999px !important; border: none !important; }
  #spTable_wrapper .dataTables_paginate .paginate_button { border-radius: 999px; padding: .25rem .7rem; }
  #spTable_wrapper .dataTables_paginate .paginate_button:hover { background: #f0fdfa !important; color: #0f766e !important; }
  #spTable thead th { background: #f8fafc; color: #64748b; }
  #spTable tbody tr { cursor: pointer; }
  #spTable tbody tr:hover { background: #f8fafc; }
  /* ปิด zebra striping + ไฮไลต์คอลัมน์ที่กำลังเรียงอยู่ (DataTables ใส่ให้อัตโนมัติทั้งคู่) — เพิ่งมีผลจริงหลังเพิ่มฟีเจอร์ "เรียงตาม" เหมือน bid-pipeline.html
     ⚠️ DataTables ไม่ได้ใช้ background-color แต่ใช้ box-shadow: inset 0 0 0 9999px กับทุก <td> ของแถว .odd (ไม่ใช่แค่คอลัมน์ที่เรียงอยู่)
     ต้องปิด box-shadow ที่ตัว td ทุกตัวในตาราง ไม่งั้นแถวคี่ (.odd) ยังมีคราบเทาเหลืออยู่ทุกคอลัมน์ (ยืนยันปัญหาจากผู้ใช้ 2026-09-21) */
  #spTable tbody td { box-shadow: none !important; }
  #spTable tbody tr, #spTable tbody tr.odd, #spTable tbody tr.even { background: #fff !important; }
</style>
</head>
<body class="bg-slate-50 font-sans">
<div id="app">
  <div v-if="!authReady" class="min-h-screen flex items-center justify-center">
    <div class="spinner w-12 h-12"></div>
  </div>

  <template v-else>
    <app-nav :user="currentUser" page="sales-pipeline" ref="nav"></app-nav>

    <!-- Overlay ปิด dropdown ตัวกรอง แหล่งที่มา/ช่วงเวลา เมื่อคลิกนอกกล่อง — pattern เดียวกับ bid-pipeline.html/AppNav's openGroup (shared/app.js) -->
    <div v-if="spOpenFilterDropdown" class="fixed inset-0 z-[39]" @click="spOpenFilterDropdown = null"></div>

    <div class="min-h-screen flex flex-col">
      <header class="sticky z-40 bg-white border-b border-slate-100 px-5 py-3 flex items-center gap-3 shadow-sm min-h-[64px] flex-wrap"
        :style="{top: spNavHeight + 'px'}">
        <h2 class="text-base font-bold text-slate-700 flex items-center gap-2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          งานขายตรง (Sales Hunt)
        </h2>
        <div class="ml-auto flex items-center gap-1.5 flex-wrap">
          <button v-if="['manager','sale'].includes(currentUser?.role)"
            class="shrink-0 inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-bold bg-green-600 hover:bg-green-700 text-white border-0 cursor-pointer min-h-[40px]"
            @click="openSpForm(null)">+ เพิ่มงานใหม่</button>
          <!-- แหล่งที่มา + ช่วงเวลา: ตัวกรองระดับหน้า ยิง API ใหม่ กระทบข้อมูลทั้งหน้า (สถิติด้านบน + รายการด้านล่าง) จึงอยู่แถวหัวข้อ ไม่ใช่ในการ์ดรายการ
               ทำเป็น custom dropdown แบบเดียวกับ Sales/ช่วงเวลาของ bid-pipeline.html (ยืนยันจากผู้ใช้ 2026-09-21)
               ⚠️ เคยลอง overflow-x-auto (เลื่อนซ้าย/ขวา) แล้วพัง — overflow-x-auto บน container ไปบัง (clip) กล่อง dropdown ที่เปิดออกมาด้านล่างปุ่ม
               เพราะ CSS ตัดของที่ล้นกรอบของ ancestor ที่มี overflow ไม่ใช่ visible เสมอไม่ว่าจะกำลังเลื่อนอยู่หรือไม่ (ยืนยันปัญหาจากผู้ใช้ 2026-09-21)
               แก้โดยซ่อนตัวอักษรเหลือแค่ไอคอน+ลูกศรเฉพาะจอมือถือ (hidden sm:inline) แทน ปุ่มเล็กพอจะอยู่แถวเดียวได้โดยไม่ต้อง scroll/wrap เลย -->
          <div class="flex items-center gap-1.5 bg-slate-50 rounded-full p-1 flex-wrap">
            <div v-if="isSecretary" class="relative shrink-0">
              <button type="button" @click.stop="spOpenFilterDropdown = spOpenFilterDropdown==='sale' ? null : 'sale'"
                title="กรองตาม Sale"
                class="flex items-center gap-1.5 rounded-full px-3 py-1.5 text-sm border-0 cursor-pointer bg-white ring-1 transition-colors whitespace-nowrap"
                :class="spFilter.assigned_to ? spHeaderDropdownActiveClass : 'ring-slate-200 text-slate-600 hover:bg-slate-50'">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg>
                <span>{{ spSelectedSaleLabel }}</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div v-if="spOpenFilterDropdown==='sale'" @click.stop
                class="absolute right-0 top-full mt-1 bg-white rounded-xl shadow-xl ring-1 ring-slate-100 overflow-hidden z-10 py-1" style="min-width:190px">
                <a href="#" @click.prevent="spSelectSale('')"
                  class="block px-3.5 py-2.5 text-sm no-underline cursor-pointer hover:bg-slate-50"
                  :class="!spFilter.assigned_to ? 'text-teal-700 font-semibold' : 'text-slate-600'">— Sales ทั้งหมด —</a>
                <a v-for="u in salesUsers" :key="u.id" href="#" @click.prevent="spSelectSale(u.id)"
                  class="block px-3.5 py-2.5 text-sm no-underline cursor-pointer hover:bg-slate-50"
                  :class="String(spFilter.assigned_to)===String(u.id) ? 'text-teal-700 font-semibold' : 'text-slate-600'">{{ u.full_name }}</a>
              </div>
            </div>
            <!-- แหล่งที่มา: เฉพาะ secretary/admin/manager — ยืนยันจากผู้ใช้ 2026-09-21 ข้อมูลจริงพบว่างานของ sale แต่ละคนแทบทั้งหมดเป็นแหล่งเดียวกัน (self_sourced) ฟิลเตอร์นี้จึงมีประโยชน์กับมุมมองทีมมากกว่ามุมมองส่วนตัว -->
            <div v-if="isSecretary" class="relative shrink-0">
              <button type="button" @click.stop="spOpenFilterDropdown = spOpenFilterDropdown==='source' ? null : 'source'"
                title="กรองตามแหล่งที่มา"
                class="flex items-center gap-1.5 rounded-full px-3 py-1.5 text-sm border-0 cursor-pointer bg-white ring-1 transition-colors whitespace-nowrap"
                :class="spFilter.source_type ? spHeaderDropdownActiveClass : 'ring-slate-200 text-slate-600 hover:bg-slate-50'">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3a15 15 0 010 18a15 15 0 010-18"/></svg>
                <span>{{ spSelectedSourceLabel }}</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div v-if="spOpenFilterDropdown==='source'" @click.stop
                class="absolute right-0 top-full mt-1 bg-white rounded-xl shadow-xl ring-1 ring-slate-100 overflow-hidden z-10 py-1" style="min-width:190px">
                <a href="#" @click.prevent="spSelectSourceType('')"
                  class="block px-3.5 py-2.5 text-sm no-underline cursor-pointer hover:bg-slate-50"
                  :class="!spFilter.source_type ? 'text-teal-700 font-semibold' : 'text-slate-600'">ทั้งหมด</a>
                <a v-for="s in spSourceTypes" :key="s.val" href="#" @click.prevent="spSelectSourceType(s.val)"
                  class="block px-3.5 py-2.5 text-sm no-underline cursor-pointer hover:bg-slate-50"
                  :class="spFilter.source_type===s.val ? 'text-teal-700 font-semibold' : 'text-slate-600'">{{ s.label }}</a>
              </div>
            </div>
            <div class="relative shrink-0">
              <button type="button" @click.stop="spOpenFilterDropdown = spOpenFilterDropdown==='period' ? null : 'period'"
                title="กรองเฉพาะการ์ดใน Kanban board ด้านล่าง ไม่กระทบการ์ดสถิติด้านบน"
                class="flex items-center gap-1.5 rounded-full px-3 py-1.5 text-sm border-0 cursor-pointer bg-white ring-1 transition-colors whitespace-nowrap"
                :class="spFilter.period!=='all' ? spHeaderDropdownActiveClass : 'ring-slate-200 text-slate-600 hover:bg-slate-50'">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <span>{{ spSelectedPeriodLabel }}</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div v-if="spOpenFilterDropdown==='period'" @click.stop
                class="absolute right-0 top-full mt-1 bg-white rounded-xl shadow-xl ring-1 ring-slate-100 overflow-hidden z-10 py-1" style="min-width:150px">
                <a v-for="p in spPeriodOptions" :key="p.value" href="#" @click.prevent="spSelectPeriod(p.value)"
                  class="block px-3.5 py-2.5 text-sm no-underline cursor-pointer hover:bg-slate-50"
                  :class="spFilter.period===p.value ? 'text-teal-700 font-semibold' : 'text-slate-600'">{{ p.label }}</a>
              </div>
            </div>
          </div>
          <button @click="loadSpKanban()" title="รีเฟรชข้อมูล" aria-label="รีเฟรชข้อมูล"
            class="w-9 h-9 flex items-center justify-center rounded-full bg-white ring-1 ring-slate-200 text-slate-500 hover:bg-slate-50 border-0 cursor-pointer shrink-0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
          </button>
        </div>
      </header>

      <main class="flex-1 w-full max-w-[1600px] mx-auto px-4 pb-24 pt-5 md:px-6 md:py-6">

        <!-- มือถือ (ต่ำกว่า md): แท็บสลับ "สรุปภาพรวม" / "รายการงาน" แทนการเลื่อนผ่านการ์ดสถิติเพื่อไปหารายการ — ใช้หลักการเดียวกับ bid-pipeline.html (ยืนยันจากผู้ใช้ 2026-09-21)
             จอ md+ (แท็บเล็ต/PC) ไม่กระทบ ไม่มีแท็บ แสดงทั้งสรุปและรายการพร้อมกันแบบเดิม -->
        <div class="md:hidden flex border-b-2 border-slate-100 mb-4 -mx-4 px-4">
          <button @click="spMobileTab='summary'" type="button"
            class="flex-1 text-center py-2.5 text-sm font-bold border-0 border-b-2 -mb-0.5 bg-transparent cursor-pointer transition-colors"
            :class="spMobileTab==='summary' ? 'text-teal-700 border-teal-700' : 'text-slate-400 border-transparent'">สรุปภาพรวม</button>
          <button @click="spMobileTab='list'" type="button"
            class="flex-1 text-center py-2.5 text-sm font-bold border-0 border-b-2 -mb-0.5 bg-transparent cursor-pointer transition-colors"
            :class="spMobileTab==='list' ? 'text-teal-700 border-teal-700' : 'text-slate-400 border-transparent'">รายการงาน ({{ spStats?.total ?? 0 }})</button>
        </div>

        <!-- Stats + สรุปผลงานรายบุคคล: มือถือแสดงเมื่อ spMobileTab==='summary' เท่านั้น (คุมด้วย 'hidden' ที่ผูกกับ spMobileTab)
             จอ md ขึ้นไป: บังคับแสดงเสมอด้วย md:!block (important) ทับ 'hidden' โดยไม่สนใจค่า spMobileTab -->
        <div :class="{ hidden: spMobileTab!=='summary' }" class="md:!block">
        <!-- Stats row: แบ่งเป็น 2 กลุ่ม (label + การ์ดของกลุ่มนั้น) อยู่แถวเดียวกันในทุกขนาดจอ
             กลุ่ม 1 (งานที่ยังไม่จบ) กว้าง 2 คอลัมน์ = งานทั้งหมด (ทุกสถานะ) + งานในมือ + Weighted Pipeline
             กลุ่ม 2 (ผลลัพธ์ที่จบแล้ว) กว้าง 1 คอลัมน์ = รายได้ที่ได้รับ (+ Win Rate)
             ทั้ง 2 กลุ่มสูงเท่ากันเสมอ (ไม่ใช้ items-start) เพราะกลุ่ม 2 เนื้อหายาวกว่าโดยธรรมชาติ (มี Win Rate + breakdown ตามช่วงเวลา)
             "งานทั้งหมด (ทุกสถานะ)" ย้ายมาเป็นการ์ดแรกในกลุ่มนี้ตามคำขอผู้ใช้ (เดิมแยกเป็นแถวของตัวเองด้านบนสุด) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-5">
          <!-- กลุ่ม: งานทั้งหมด (ทุกสถานะ) + งานที่ยังไม่จบ (คาดการณ์) — แยกป้ายกำกับ 2 อัน อยู่คนละความกว้างกัน เพราะ "งานทั้งหมด" ไม่ใช่ concept เดียวกับ "ยังไม่จบ" ป้ายจึงต้องเริ่มตรงตำแหน่งการ์ดงานในมือเท่านั้น ไม่คลุมการ์ดงานทั้งหมด -->
          <div class="md:col-span-2 grid grid-cols-1 md:grid-cols-3 gap-3">
            <!-- ป้ายย่อย: งานทั้งหมด (ทุกสถานะ) — คลุมแค่การ์ดเดียว -->
            <div class="md:col-span-1 flex flex-col">
              <div class="flex items-center gap-1.5 mb-2">
                <span class="text-xs font-bold text-slate-500">📊 งานทั้งหมด (ทุกสถานะ)</span>
                <button @click="modal = {type:'sp-total-info'}"
                  class="w-5 h-5 flex items-center justify-center rounded-full bg-slate-300 text-white hover:bg-slate-400 border-0 cursor-pointer shrink-0 transition-colors text-[12px] font-black leading-none" title="งานทั้งหมด คืออะไร">i</button>
              </div>
              <div class="bg-white rounded-xl px-5 py-4 ring-1 ring-slate-100 shadow-sm flex-1">
                <div>
                  <div class="flex items-center gap-1.5 mb-2.5 flex-wrap">
                    <svg class="w-4 h-4 text-slate-300 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7H4a2 2 0 00-2 2v9a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2zM16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
                    <span class="text-xs text-slate-400 font-medium">จำนวนงานทั้งหมด</span>
                  </div>
                  <div class="text-[1.75rem] font-black leading-none text-purple-700">{{ spStats?.total ?? 0 }} <span class="text-sm font-semibold text-slate-400">งาน</span></div>
                </div>
                <div class="mt-3 pt-3 border-t border-slate-100">
                  <div class="flex items-center gap-1.5 mb-2.5 flex-wrap">
                    <svg class="w-4 h-4 text-slate-300 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path stroke-linecap="round" d="M6 12h.01M18 12h.01"/></svg>
                    <span class="text-xs text-slate-400 font-medium">มูลค่ารวมทั้งหมด</span>
                  </div>
                  <div class="text-[1.3rem] font-black leading-none text-purple-700">฿{{ spStats ? formatNumber(spStats.total_value) : '0' }}</div>
                </div>
              </div>
            </div>

            <!-- ป้ายย่อย: งานที่ยังไม่จบ (คาดการณ์) — คลุมการ์ดเดียวที่รวม งานในมือ + Weighted Pipeline (เดิม 2 การ์ดแยก) เริ่มตรงตำแหน่งการ์ดนี้ -->
            <div class="md:col-span-2 flex flex-col">
              <div class="flex items-center gap-1.5 mb-2">
                <span class="text-xs font-bold text-slate-500">📈 งานที่ยังไม่จบ (คาดการณ์)</span>
                <button @click="modal = {type:'sp-forecast-info'}"
                  class="w-5 h-5 flex items-center justify-center rounded-full bg-slate-300 text-white hover:bg-slate-400 border-0 cursor-pointer shrink-0 transition-colors text-[12px] font-black leading-none" title="งานที่ยังไม่จบ (คาดการณ์) คืออะไร">i</button>
              </div>
              <div class="bg-white rounded-xl px-5 py-4 ring-1 ring-slate-100 shadow-sm flex-1">
                <!-- งานในมือ -->
                <div>
                  <div class="flex items-center gap-1.5 mb-2.5 flex-wrap">
                    <svg class="w-4 h-4 text-slate-300 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7H4a2 2 0 00-2 2v9a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2zM16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
                    <span class="text-xs text-slate-400 font-medium">งานในมือ</span>
                  </div>
                  <div class="flex items-baseline gap-2">
                    <span class="text-[1.75rem] font-black leading-none text-sky-700">{{ spStats?.active ?? 0 }}</span>
                    <span v-if="spStats?.pipeline_value" class="text-slate-300 font-normal">/</span>
                    <span v-if="spStats?.pipeline_value" class="text-[1.3rem] font-black leading-none text-sky-600">฿{{ formatNumber(spStats.pipeline_value) }}</span>
                  </div>
                  <div class="text-[.7rem] text-slate-300 font-normal mt-1.5">ไม่รวม Delivered / Lost · ข้อมูลล่าสุด ณ ตอนนี้</div>
                  <div v-if="spStats?.new_active_7d" class="text-[.7rem] font-semibold mt-1 text-emerald-600">
                    ▲ +{{ spStats.new_active_7d }} งาน (+฿{{ formatNumber(spStats.new_active_7d_value) }}) ใหม่ใน 7 วันที่ผ่านมา
                  </div>
                </div>
                <!-- Weighted Pipeline -->
                <div class="mt-3 pt-3 border-t border-slate-100">
                  <div class="flex items-center gap-1.5 mb-2.5 flex-wrap">
                    <svg class="w-4 h-4 text-slate-300 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3v18h18M7 15l4-6 3 3 4-7"/></svg>
                    <span class="text-xs text-slate-400 font-medium">โอกาสรายได้ในอนาคต Weighted Pipeline</span>
                  </div>
                  <div class="text-[1.3rem] font-black leading-none text-indigo-700">฿{{ spStats ? formatNumber(spStats.weighted_pipeline) : '0' }}</div>
                  <div class="text-[.7rem] text-slate-300 font-normal mt-1.5">ถ่วงน้ำหนักตามโอกาสที่ sale ประเมินเอง · ข้อมูลล่าสุด ณ ตอนนี้</div>
                </div>
              </div>
            </div>
          </div>

          <!-- กลุ่ม: ผลลัพธ์ที่จบแล้ว (สรุปย้อนหลัง) -->
          <div class="md:col-span-1 flex flex-col">
            <div class="flex items-center gap-1.5 mb-2">
              <span class="text-xs font-bold text-slate-500">✅ ผลลัพธ์ที่จบแล้ว (สรุปย้อนหลัง)</span>
              <button @click="modal = {type:'sp-results-info'}"
                class="w-5 h-5 flex items-center justify-center rounded-full bg-slate-300 text-white hover:bg-slate-400 border-0 cursor-pointer shrink-0 transition-colors text-[12px] font-black leading-none" title="ผลลัพธ์ที่จบแล้ว (สรุปย้อนหลัง) คืออะไร">i</button>
            </div>
            <div class="bg-white rounded-xl px-5 py-4 ring-1 ring-slate-100 shadow-sm flex-1">
            <!-- รายได้ที่ได้รับ + Win Rate เรียง 2 คอลัมน์ ฝั่งซ้ายรายได้ ฝั่งขวา Win Rate -->
            <div class="grid grid-cols-2 gap-4">
              <!-- รายได้ที่ได้รับ -->
              <div>
                <div class="flex items-center gap-1.5 mb-2.5 flex-wrap">
                  <svg class="w-4 h-4 text-slate-300 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path stroke-linecap="round" d="M6 12h.01M18 12h.01"/></svg>
                  <span class="text-xs text-slate-400 font-medium">รายได้ที่ได้รับ</span>
                </div>
                <div class="flex items-baseline gap-2 flex-wrap">
                  <span class="text-[1.75rem] font-black leading-none text-emerald-700">{{ spStats?.delivered_count ?? 0 }}</span>
                  <span v-if="spStats?.delivered_value" class="text-slate-300 font-normal">/</span>
                  <span v-if="spStats?.delivered_value" class="text-[1.3rem] font-black leading-none text-emerald-600">฿{{ formatNumber(spStats.delivered_value) }}</span>
                </div>
                <div class="text-[.7rem] text-slate-300 font-normal mt-1.5">ส่งมอบแล้วจริง · ตลอดกาล</div>
              </div>
              <!-- Win Rate -->
              <div class="text-right">
                <div class="flex items-center justify-end gap-1.5 mb-2.5 flex-wrap">
                  <svg class="w-4 h-4 text-slate-300 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M8 21h8M12 17v4M7 4H5a2 2 0 00-2 2v2a4 4 0 004 4h.5M17 4h2a2 2 0 012 2v2a4 4 0 01-4 4h-.5M7 4h10v4a5 5 0 01-10 0V4z"/></svg>
                  <span class="text-xs text-slate-400 font-medium">Win Rate</span>
                </div>
                <div class="text-[1.75rem] font-black leading-none text-amber-600">{{ spStats?.win_rate != null ? spStats.win_rate + '%' : '-' }}</div>
                <div class="text-[.7rem] text-slate-300 font-normal mt-1.5">ชนะ {{ spStats?.won ?? 0 }} · แพ้ {{ spStats?.lost ?? 0 }} งาน · ตลอดกาล</div>
              </div>
            </div>
            <!-- Breakdown ตามช่วงเวลา -->
            <div class="mt-2.5 pt-2.5 border-t border-slate-100 grid grid-cols-[1fr_auto_auto] gap-x-3 gap-y-1.5 items-baseline">
              <span class="text-xs text-slate-400">เดือนนี้</span>
              <span class="text-sm font-bold text-slate-700 text-right whitespace-nowrap">{{ spStats?.delivered_month?.count ?? 0 }} งาน</span>
              <span class="text-xs text-emerald-600 font-semibold text-right whitespace-nowrap">{{ spStats?.delivered_month?.value ? '฿'+formatNumber(spStats.delivered_month.value) : '-' }}</span>

              <span class="text-xs text-slate-400">ไตรมาสนี้</span>
              <span class="text-sm font-bold text-slate-700 text-right whitespace-nowrap">{{ spStats?.delivered_quarter?.count ?? 0 }} งาน</span>
              <span class="text-xs text-emerald-600 font-semibold text-right whitespace-nowrap">{{ spStats?.delivered_quarter?.value ? '฿'+formatNumber(spStats.delivered_quarter.value) : '-' }}</span>

              <span class="text-xs text-slate-400">ปีนี้</span>
              <span class="text-sm font-bold text-slate-700 text-right whitespace-nowrap">{{ spStats?.delivered_year?.count ?? 0 }} งาน</span>
              <span class="text-xs text-emerald-600 font-semibold text-right whitespace-nowrap">{{ spStats?.delivered_year?.value ? '฿'+formatNumber(spStats.delivered_year.value) : '-' }}</span>
            </div>
            </div>
          </div>
        </div>

        <!-- ========= Toolbar + Kanban/ตาราง (รวม isSale/isSecretary เป็นชุดเดียว — ยืนยันจากผู้ใช้ 2026-09-21
             ต่างกันแค่: สีธีม (เขียว=sale, น้ำเงิน=secretary/admin/manager) + ตัวกรอง "Sale:" ที่มีเฉพาะฝั่ง secretary
             + ชื่อ sale บนการ์ด Kanban/ปุ่มรีเฟรช ที่โผล่เฉพาะฝั่ง secretary ========= -->

        <!-- Per-sale summary: เฉพาะ secretary/admin/manager -->
        <div v-if="isSecretary && spSaleStats.length && !spFilter.assigned_to" class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100 mb-4">
          <div class="px-5 py-4 border-b border-slate-100 font-bold text-slate-700 text-base">
            สรุปผลงานรายบุคคล
          </div>
          <div class="overflow-x-auto">
            <table class="w-full border-collapse text-[.9rem]">
              <thead>
                <tr class="bg-slate-50">
                  <th class="px-4 py-3 text-left text-[.8rem] font-bold text-slate-500 border-b-2 border-slate-200">Sale</th>
                  <th class="px-4 py-3 text-center text-[.8rem] font-bold text-slate-500 border-b-2 border-slate-200">Active</th>
                  <th class="px-4 py-3 text-center text-[.8rem] font-bold text-slate-500 border-b-2 border-slate-200">ปิดแล้ว</th>
                  <th class="px-4 py-3 text-center text-[.8rem] font-bold text-slate-500 border-b-2 border-slate-200">แพ้</th>
                  <th class="px-4 py-3 text-right text-[.8rem] font-bold text-slate-500 border-b-2 border-slate-200">ยอดรวม (บาท)</th>
                  <th class="px-4 py-3 text-center text-[.8rem] font-bold text-slate-500 border-b-2 border-slate-200">Win Rate</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="s in spSaleStats" :key="s.id"
                  @click="spFilter.assigned_to=s.id; loadSpKanban()"
                  class="border-b border-slate-50 cursor-pointer transition-colors hover:bg-blue-50/60">
                  <td class="px-4 py-3 whitespace-nowrap">
                    <div class="flex items-center gap-2">
                      <img v-if="s.photo_url" :src="s.photo_url" class="w-7 h-7 rounded-full object-cover shrink-0"/>
                      <div v-else class="w-7 h-7 rounded-full flex items-center justify-center text-white text-[.8rem] font-bold shrink-0"
                        :style="{background:s.avatar_color||'#2563eb'}">{{ avatarInitials(s.full_name) }}</div>
                      <span class="font-semibold">{{ s.full_name }}</span>
                    </div>
                  </td>
                  <td class="px-4 py-3 text-center font-semibold text-blue-600">{{ s.active }}</td>
                  <td class="px-4 py-3 text-center font-semibold text-green-600">{{ s.won }}</td>
                  <td class="px-4 py-3 text-center font-semibold text-red-600">{{ s.lost }}</td>
                  <td class="px-4 py-3 text-right font-bold text-green-600 whitespace-nowrap">{{ formatNumber(s.won_value) }}</td>
                  <td class="px-4 py-3 text-center">
                    <span :style="{color: (+s.won + +s.lost)>0 && +s.won/(+s.won + +s.lost)>=0.5 ? '#16a34a' : '#dc2626', fontWeight:700}">
                      {{ (+s.won + +s.lost)>0 ? Math.round(+s.won/(+s.won + +s.lost)*100)+'%' : '-' }}
                    </span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        </div>
        <!-- /มือถือ: ปิดกลุ่ม "สรุปภาพรวม" (การ์ดสถิติ + สรุปผลงานรายบุคคล) -->

        <!-- Content card: รายการงานขายตรง (ค้นหา/ตัวกรอง/สลับมุมมอง/แท็บสถานะ/เนื้อหา อยู่ในการ์ดเดียวกัน — ใช้หลักการเดียวกับ bid-pipeline.html ยืนยันจากผู้ใช้ 2026-09-21)
             มือถือ: แสดงเมื่อ spMobileTab==='list' เท่านั้น (คุมด้วย 'hidden'); จอ md ขึ้นไป: md:!block บังคับแสดงเสมอ ไม่สนใจ spMobileTab -->
        <div :class="{ hidden: spMobileTab!=='list' }" class="md:!block">
        <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100 overflow-hidden">
          <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100 gap-3 flex-wrap">
            <span class="font-bold text-slate-700 flex items-center gap-2">
              <span class="w-8 h-8 rounded-lg bg-teal-50 text-teal-700 flex items-center justify-center shrink-0">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
              </span>
              {{ isSecretary ? 'รายการงานขายตรงทั้งหมด' : 'รายการงานขายตรงของฉัน' }}
            </span>
            <div class="flex items-center gap-2 w-full sm:w-auto">
              <span class="text-xs text-slate-400 hidden sm:inline">ดูแบบ:</span>
              <div class="flex border-[1.5px] border-slate-300 rounded-xl overflow-hidden">
                <button @click="spView='kanban'"
                  class="px-3 py-1.5 text-xs font-semibold border-0 cursor-pointer transition-colors flex items-center gap-1.5"
                  :class="spViewToggleClass(spView==='kanban')">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="18" rx="1"/><rect x="10.5" y="3" width="6" height="10" rx="1"/><rect x="18" y="3" width="3" height="14" rx="1"/></svg>
                  Kanban</button>
                <button @click="spView='list'"
                  class="px-3 py-1.5 text-xs font-semibold border-0 cursor-pointer transition-colors flex items-center gap-1.5"
                  :class="spViewToggleClass(spView==='list')">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                  การ์ด</button>
                <button @click="spView='table'"
                  class="px-3 py-1.5 text-xs font-semibold border-0 cursor-pointer transition-colors flex items-center gap-1.5"
                  :class="spViewToggleClass(spView==='table')">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
                  ตาราง</button>
              </div>
              <button @click="exportSpTable" title="Export Excel" aria-label="Export Excel"
                class="ml-auto inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                <span>Excel</span>
              </button>
            </div>
          </div>

          <!-- ค้นหา (client-side กรองทันที) + ตัวกรองเพิ่มเติม (server) + เรียงตาม: กรอง/เรียงข้อมูลที่โหลด/เลือกสถานะไว้แล้วให้แคบลงอีก ใช้หลักการเดียวกับ bid-pipeline.html -->
          <div class="px-5 pt-4 pb-3 flex items-center gap-2 flex-wrap border-b border-slate-100">
            <div class="flex-1 min-w-[180px] flex items-center gap-2">
              <svg class="w-4 h-4 shrink-0 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input v-model="spSearch" type="text" placeholder="ค้นหาชื่องาน, ลูกค้า, รหัสงาน..."
                class="flex-1 border-0 outline-none text-sm bg-transparent">
            </div>
            <button @click="modal = {type:'sp-adv-filter'}"
              class="inline-flex items-center gap-1.5 border-[1.5px] border-slate-200 rounded-full px-3 py-2 text-sm font-semibold bg-white text-slate-500 hover:bg-slate-50 cursor-pointer transition-all shrink-0"
              :class="{[spFilterBtnActiveClass]: spAdvFilterCount>0}">
              <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 4h18l-7 8v6l-4 2v-8L3 4z"/></svg>
              ตัวกรอง
              <span v-if="spAdvFilterCount" class="inline-flex items-center justify-center w-4 h-4 rounded-full text-white text-[10px] font-bold" :class="spFilterBadgeClass">{{ spAdvFilterCount }}</span>
            </button>
            <div class="relative shrink-0">
              <button type="button" @click.stop="spOpenFilterDropdown = spOpenFilterDropdown==='sort' ? null : 'sort'"
                class="flex items-center gap-1.5 rounded-full px-3 py-2 text-sm border-[1.5px] border-slate-200 cursor-pointer bg-white text-slate-600 hover:bg-slate-50 transition-colors">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
                {{ spSelectedSortLabel }}
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div v-if="spOpenFilterDropdown==='sort'" @click.stop
                class="absolute left-0 top-full mt-1 bg-white rounded-xl shadow-xl ring-1 ring-slate-100 overflow-hidden z-40 py-1" style="min-width:220px">
                <a v-for="opt in spSortOptions" :key="opt.value" href="#" @click.prevent="spSelectSort(opt.value)"
                  class="block px-3.5 py-2.5 text-sm no-underline cursor-pointer hover:bg-slate-50"
                  :class="spSortBy===opt.value ? 'text-teal-700 font-semibold' : 'text-slate-600'">{{ opt.label }}</a>
              </div>
            </div>
            <div v-if="spLoading" class="flex items-center gap-1.5 text-xs text-slate-500 shrink-0">
              <div class="spinner w-4 h-4" style="border-width:2px"></div> กำลังโหลด...
            </div>
          </div>

          <!-- แท็บสถานะ: ใช้ร่วมกันทั้ง 3 มุมมอง — Kanban (เลือกแท็บเดียวจะโฟกัสคอลัมน์นั้นเต็มความกว้าง), การ์ด และตาราง -->
          <div class="flex items-center gap-1.5 px-5 py-3 border-b border-slate-100 overflow-x-auto">
            <span class="inline-flex items-center gap-1 shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold cursor-pointer transition-colors"
              :class="spActiveStatusTab==='all' ? 'bg-teal-700 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
              @click="spSelectStatusTab('all')">ทั้งหมด <span class="opacity-80">{{ spTabStagesTotal }}</span></span>
            <span v-for="stage in spTabStages" :key="stage.key"
              class="inline-flex items-center gap-1 shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold cursor-pointer border-[1.5px] transition-colors"
              :style="spActiveStatusTab===stage.key ? {background: stage.bgLight, color: stage.textLight, borderColor: stage.textLight} : {background: stage.bgLight, color: stage.textLight, borderColor: 'transparent'}"
              @click="spSelectStatusTab(stage.key)">{{ stage.label }} <span class="opacity-80">{{ spStageCards(stage.key).length }}</span></span>
          </div>

          <p v-if="spView==='kanban'" class="px-5 pt-3 text-xs text-slate-400">สถานะที่ยังไม่มีงานจะย่อให้อัตโนมัติ กดที่แถบเพื่อดูรายละเอียด</p>

          <!-- KANBAN VIEW -->
          <div v-show="spView==='kanban'" class="p-4 flex gap-3 overflow-x-auto pb-4">
            <template v-for="stage in spVisibleStages" :key="stage.key">
              <div v-if="spIsStageCollapsed(stage)"
                class="flex-shrink-0 w-10 rounded-xl overflow-hidden cursor-pointer"
                :style="{background: stage.bgLight}"
                @click="spToggleStageExpand(stage.key)">
                <div class="flex flex-col items-center justify-between h-44 py-2.5" :style="{color: stage.textLight}">
                  <span class="rounded-full px-1.5 py-0.5 text-[10px] font-bold" :style="{background: stage.bgLightMid}">{{ spStageCards(stage.key).length }}</span>
                  <span class="text-xs font-semibold" style="writing-mode: vertical-rl;">{{ stage.label }}</span>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                </div>
              </div>
              <div v-else class="flex-shrink-0 flex flex-col" :class="spVisibleStages.length===1 ? 'w-full max-w-md' : 'w-56'">
                <div class="px-3 py-2.5 flex items-center justify-between rounded-t-xl font-semibold text-sm"
                  :style="{background: stage.bgLight, color: stage.textLight}">
                  <span class="truncate">{{ stage.label }}</span>
                  <span class="ml-1 rounded-full px-2 py-0.5 text-xs shrink-0" :style="{background: stage.bgLightMid}">{{ spStageCards(stage.key).length }}</span>
                </div>
                <div class="px-3 py-1.5 text-xs font-medium truncate" :style="{background: stage.bgLightMid, color: stage.textLight}">{{ spColValue(stage.key) }}&nbsp;</div>
                <div class="flex-1 flex flex-col gap-2 p-2 bg-slate-100 rounded-b-xl overflow-y-auto" style="min-height:200px;max-height:68vh">
                  <div v-if="!spStageCards(stage.key).length"
                    class="text-center text-slate-400 text-xs py-8 cursor-pointer hover:text-slate-500"
                    @click="spToggleStageExpand(stage.key)">
                    {{ spSearch ? 'ไม่พบงานที่ค้นหาในสถานะนี้' : 'ยังไม่มีงาน' }}
                  </div>
                  <div v-for="card in spStageCards(stage.key)" :key="card.id"
                    class="bg-white rounded-xl p-3 shadow-sm ring-1 ring-slate-100 hover:shadow-md transition-shadow">
                    <div class="flex flex-wrap gap-1 mb-2">

    <div v-if="modal.type==='sp-forecast-info'" class="fixed inset-0 bg-black/50 flex items-center justify-center z-[1000] p-4" @click.self="closeModal">

        <div class="bg-teal-600 text-white px-6 py-5 flex items-center justify-between">

              งานทั้งหมดที่<b>ยังไม่จบ</b> — นับทุก stage ยกเว้น <code>Delivered</code> (ส่งมอบแล้ว) และ <code>Lost</code> (ไม่สำเร็จ) มูลค่าที่แสดงคือผลรวมมูลค่าดีลของงานกลุ่มนี้ (ยังไม่ถ่วงน้ำหนักตามโอกาสปิดดีล)

            </div>
            <p class="text-sm text-slate-600 leading-relaxed">
              ตัวเลขเทียบ 7 วัน (▲) หมายถึง <b>จำนวนงานใหม่ที่เพิ่งเข้ามาในระบบใน 7 วันที่ผ่านมา แล้วยังคงเปิดอยู่</b> (นับจากวันที่สร้างงาน)

            <p class="text-sm text-slate-600 leading-relaxed mb-2">
              มูลค่าประมาณการของงานที่ยัง<b>ไม่ตัดสินผล</b> โดยเอามูลค่าดีลแต่ละงานคูณด้วย <b>"โอกาสปิดดีล (%)"</b> ที่ sale กรอกเองต่อดีลในฟอร์ม (ไม่ใช่คำนวณอัตโนมัติตาม stage แบบฝั่งงานประมูล เพราะแต่ละดีลของ Sales Hunt มีความไม่แน่นอนต่างกันมาก แม้อยู่ stage เดียวกัน)
            </p>
            <div class="rounded-xl bg-indigo-50 border border-indigo-100 px-3 py-2.5 mb-2">

            </div>
            <div class="rounded-xl bg-slate-50 p-3 text-sm text-slate-600 text-center font-semibold mb-2">

<script src="shared/vue.global.prod.js"></script>
<script src="shared/app.js?v=33"></script>
<script>
const { createApp } = Vue;

createApp({
  components: { AppNav, AppTabBar, AppModal },
  data() {
    return {
      authReady: false,
      currentUser: null,
      modal: { type: null, data: null },
      salesUsers: [],
      spView: 'kanban',
      spMobileTab: 'list', // 'summary' | 'list' — มือถือ (ต่ำกว่า md) เท่านั้น แยกแท็บสรุปภาพรวมออกจากรายการงาน ค่าเริ่มต้นเป็น list เพราะเข้าถึงบ่อยกว่าสรุป — ใช้หลักการเดียวกับ bid-pipeline.html (ยืนยันจากผู้ใช้ 2026-09-21) — จอ md+ ไม่ใช้ค่านี้ แสดงทั้งสองส่วนพร้อมกันเสมอ
      spKanban: {},
      spStats: null,
      spSaleStats: [],
      spFilter: { assigned_to: '', source_type: '', period: 'all', priority: '', product_category: '', brand: '', client_q: '', value_min: '', value_max: '', segment: '', specialization: '' },
      spLoading: false,
spForm: { id:null, project_code:'', source_type:'self_sourced', title:'', client_name:'', assigned_to:'', stage:'Interest', segment:'', priority:'Medium', product_category:'', brand:'', fee_structure:'', specialization:'', value:'', win_probability:20, expected_close:'', next_action:'', notes:'' },
      spFormHistory: [],
      spWinLossForm: { id:null, stage:'', title:'', reason:'', note:'', value:'' },
      // modal แยกต่างหากสำหรับดูรายละเอียดใบเสนอราคาเก่า — ไม่ใช้ modal.type/modal.data ร่วมกับ sp-form
      // เพราะ sp-form เป็นฟอร์มแก้ไขที่มีข้อมูลค้างอยู่ (title/notes ที่พิมพ์ไว้) ถ้าทับ modal เดิมจะเสียข้อมูลที่แก้ค้างไว้
      spQuotationModal: { show: false, data: null },
      spQuotationLoading: false,
      spOpenFilterDropdown: null, // null | 'source' | 'period' | 'sort' — controls header/toolbar custom dropdowns (ยืนยันจากผู้ใช้ 2026-09-21 ใช้หลักการเดียวกับ bid-pipeline.html)
      spSearch: '', // ค้นหา client-side ทันที (ไม่ยิง API) — คนละส่วนกับ spFilter.client_q ที่อยู่ในตัวกรองเพิ่มเติม (server-side)
      spSortBy: 'close_asc', // เรียงลำดับข้อมูลทั้ง 3 มุมมอง (Kanban/การ์ด/ตาราง) ด้วยตัวแปรเดียวกัน
      spActiveStatusTab: 'all',
      spExpandedEmptyStages: {}, // key: stage.key -> true ถ้าผู้ใช้กดขยายสถานะที่ไม่มีงานเอง (ปกติสถานะว่างจะย่ออัตโนมัติ)
      spNavHeight: 0, // ความสูงจริงของแถบ AppNav ใช้เป็นค่า top ของ header หน้านี้ตอน sticky กันซ้อนทับ (เหมือน bid-pipeline.html)
    };
  },
  computed: {
    tabItems() {
      return [
        { label:'ภาพรวม', icon:'home', href:'dashboard.html' },
        { label:'งานขาย', icon:'briefcase', active:true },
        { label:'ออก', icon:'logout', action:'logout' },
      ];
    },
    isAdmin()      { return this.currentUser?.role === 'admin'; },
    isManager()    { return ['admin','manager'].includes(this.currentUser?.role); },
    isSecretary()  { return ['admin','salesadmin','manager'].includes(this.currentUser?.role); },
    isSale()       { return this.currentUser?.role === 'sale'; },

    // สีธีมของหน้านี้: ใช้ teal เดียวกับ bid-pipeline.html ทั้งหมด ไม่แยกตาม role อีกต่อไป
    // (เดิมแยกเขียว/น้ำเงินตาม sale/secretary แต่ผู้ใช้ชี้ว่าทำให้สีไม่ consistent ข้ามหน้าเมื่อเทียบกับ bid-pipeline.html ที่ใช้ teal เดียวทุก role — ยืนยันแก้ 2026-09-21)
    spFilterBtnActiveClass() {
      return '!border-teal-400 !text-teal-700 !bg-teal-50';
    },
    spFilterBadgeClass() {
      return 'bg-teal-600';
    },
    // สถานะ active ของ dropdown แหล่งที่มา/ช่วงเวลา บน header (custom dropdown แบบเดียวกับ Sales/ช่วงเวลาของ bid-pipeline.html)
    spHeaderDropdownActiveClass() {
      return 'ring-teal-600 text-teal-700 font-semibold';
    },

    spPeriodOptions() {
      return [
        { value:'all',     label:'ทั้งหมด' },
        { value:'month',   label:'เดือนนี้' },
        { value:'quarter', label:'ไตรมาสนี้' },
        { value:'year',    label:'ปีนี้' },
      ];
    },
    spSelectedSaleLabel() {
      if (!this.spFilter.assigned_to) return 'Sales';
      return this.salesUsers.find(u => String(u.id) === String(this.spFilter.assigned_to))?.full_name || 'Sales';
    },
    // ป้ายตอนปิด dropdown ใส่ชื่อหมวดกำกับสั้นๆ เสมอ ("ที่มา"/"ช่วงเวลา") ไม่ใช่แค่ "ทั้งหมด" เฉยๆ กันสับสนกับ dropdown
    // อื่นที่อยู่ติดกัน แต่ต้องสั้น ไม่ยาวเกินไปจนตัวอักษรล้นจอมือถือ (ยืนยันจากผู้ใช้ 2026-09-21 — ย่อข้อความลงแทนการซ่อนตัวอักษรบนมือถือ)
    spSelectedSourceLabel() {
      if (!this.spFilter.source_type) return 'ที่มา';
      return this.spSourceTypes.find(s => s.val === this.spFilter.source_type)?.label || 'ที่มา';
    },
    spSelectedPeriodLabel() {
      if (this.spFilter.period === 'all') return 'ช่วงเวลา';
      return this.spPeriodOptions.find(p => p.value === this.spFilter.period)?.label || 'ช่วงเวลา';
    },

    // เรียงตาม: ใช้ dropdown เดียวกันควบคุมลำดับทั้ง 3 มุมมอง (Kanban/การ์ด/ตาราง) — มาตรฐานเดียวกับ bid-pipeline.html
    spSortOptions() {
      return [
        { value: 'close_asc',  label: 'วันคาดปิดดีล (ใกล้สุดก่อน)' },
        { value: 'close_desc', label: 'วันคาดปิดดีล (ไกลสุดก่อน)' },
        { value: 'value_desc', label: 'มูลค่าดีล (สูงสุดก่อน)' },
        { value: 'value_asc',  label: 'มูลค่าดีล (ต่ำสุดก่อน)' },
      ];
    },
    spSelectedSortLabel() {
      return this.spSortOptions.find(o => o.value === this.spSortBy)?.label || 'เรียงตาม';
    },
    // คอลัมน์/ทิศทางของตาราง DataTables ที่ตรงกับ spSortBy — ตำแหน่งคอลัมน์ขยับตาม isSecretary (มีคอลัมน์ Sale/หมวด เพิ่ม)
    spTableSortOrder() {
      const valueIdx = 3;
      const closeIdx = this.isSecretary ? 7 : 5;
      const map = {
        close_asc:  [closeIdx, 'asc'],
        close_desc: [closeIdx, 'desc'],
        value_desc: [valueIdx, 'desc'],
        value_asc:  [valueIdx, 'asc'],
      };
      return map[this.spSortBy] || [closeIdx, 'asc'];
    },

    // แท็บสถานะ: sales hunt แสดงทุก stage เสมอ (ไม่มีแนวคิด "แสดงงานปิด" เหมือนงานประมูล เพราะ terminal stage มีแค่ Delivered/Lost ไม่เยอะเท่า)
    spTabStages() { return this.spStages; },
    spTabStagesTotal() {
      return this.spTabStages.reduce((n, s) => n + this.spStageCards(s.key).length, 0);
    },
    // คอลัมน์ Kanban ที่แสดงจริง — ถ้าเลือกแท็บสถานะใดสถานะหนึ่ง (ไม่ใช่ "ทั้งหมด") เหลือคอลัมน์เดียวขยายเต็ม (ยืนยันจากผู้ใช้ 2026-09-21)
    spVisibleStages() {
      if (this.spActiveStatusTab === 'all') return this.spTabStages;
      return this.spTabStages.filter(s => s.key === this.spActiveStatusTab);
    },
    // การ์ดของมุมมอง "การ์ด" — กรองตามแท็บสถานะที่เลือก + ค้นหา + เรียงลำดับ
    spFilteredFlatCards() {
      const base = this.spActiveStatusTab === 'all' ? this.spTableData : this.spTableData.filter(c => c.stage === this.spActiveStatusTab);
      return this.spSortCards(base.filter(c => this.spMatchesSearch(c)));
    },

    // เลขที่ใบเสนอราคา แกะจากข้อความ spForm.notes ("นำเข้าจากใบเสนอราคาเก่า #QT260700028 ลงวันที่ ...")
    // งานขายตรง (self_sourced) ไม่มี field project_no แบบ HIST- เหมือนงานประมูล ต้อง parse จาก notes แทน
    // (รูปแบบข้อความคงที่ ดู importQuotation()'s self_sourced branch ใน api/quotation_import.php)
    spHistoryQuotationId() {
      const text = this.spForm?.notes || '';
      const m = text.match(/นำเข้าจากใบเสนอราคาเก่า #(\S+)/);
      return m ? m[1] : null;
    },

    spAdvFilterCount() {
      let n = 0;
      if (this.spFilter.priority)         n++;
      if (this.spFilter.product_category) n++;
      if (this.spFilter.brand)            n++;
      if (this.spFilter.client_q)         n++;
      if (this.spFilter.value_min || this.spFilter.value_max) n++;
      if (this.spFilter.segment)          n++;
      if (this.spFilter.specialization)   n++;
      return n;
    },

    // bgLight/bgLightMid/textLight: ชุดสีอ่อนสำหรับหัวคอลัมน์ Kanban/แท็บสถานะ จัดเป็น 3 กลุ่มตามความหมาย (ยืนยันจากผู้ใช้ 2026-09-21):
    // เทา = กำลังดำเนินการ (Interest/Send PI/Negotiating ยังไม่ตัดสินผล), เขียว = ปิดได้ (Deal Signed/Delivered), แดง = ไม่สำเร็จ (Lost)
    // ต่างจากงานประมูล e-Bidding ที่มี "รอประกาศผล" (รอคนนอกตัดสิน) แยกเป็นกลุ่มอำพันต่างหาก — Sales Hunt ไม่มี stage ลักษณะนั้น
    // (Negotiating คือกำลังเจรจาต่อรองเอง ไม่ใช่รอเฉยๆ) จึงใช้แค่ 3 กลุ่มพอ ใช้โทนสีเดียวกับ bid-pipeline.html ทุกประการเพื่อความ consistent ข้ามหน้า
    spStages() {
      if (this.spFilter.source_type === 'ebidding') {
        return [
          { key:'Interest',    thLabel:'รับงาน/ศึกษา TOR', label:'รับงาน / ศึกษา TOR',   icon:'', bgLight:'#f8fafc', bgLightMid:'#e2e8f0', textLight:'#334155' },
          { key:'Send PI',     thLabel:'เตรียม/ยื่นซอง',   label:'เตรียม & ยื่นข้อเสนอ', icon:'', bgLight:'#f8fafc', bgLightMid:'#e2e8f0', textLight:'#334155' },
          { key:'Negotiating', thLabel:'รอประกาศผล',        label:'รอประกาศผล',           icon:'', bgLight:'#f8fafc', bgLightMid:'#e2e8f0', textLight:'#334155' },
          { key:'Deal Signed', thLabel:'ชนะประมูล',         label:'ชนะประมูล',            icon:'', bgLight:'#ecfdf5', bgLightMid:'#d1fae5', textLight:'#047857' },
          { key:'Delivered',   thLabel:'ส่งมอบแล้ว',        label:'ส่งมอบแล้ว',           icon:'', bgLight:'#ecfdf5', bgLightMid:'#d1fae5', textLight:'#047857' },
          { key:'Lost',        thLabel:'แพ้/ยกเลิก',        label:'แพ้ / ยกเลิก',         icon:'', bgLight:'#fff1f2', bgLightMid:'#fecdd3', textLight:'#be123c' },
        ];
      }
      return [
        { key:'Interest',    thLabel:'สนใจ/ติดต่อ',   label:'สนใจ / ติดต่อ',       icon:'', bgLight:'#f8fafc', bgLightMid:'#e2e8f0', textLight:'#334155' },
        { key:'Send PI',     thLabel:'ส่ง PI/ใบเสนอ', label:'ส่ง PI / ใบเสนอราคา', icon:'', bgLight:'#f8fafc', bgLightMid:'#e2e8f0', textLight:'#334155' },
        { key:'Negotiating', thLabel:'ต่อรอง/เจรจา',  label:'ต่อรอง / เจรจา',       icon:'', bgLight:'#f8fafc', bgLightMid:'#e2e8f0', textLight:'#334155' },
        { key:'Deal Signed', thLabel:'ปิดดีลแล้ว',    label:'ปิดดีลแล้ว',           icon:'', bgLight:'#ecfdf5', bgLightMid:'#d1fae5', textLight:'#047857' },
        { key:'Delivered',   thLabel:'ส่งมอบแล้ว',    label:'ส่งมอบแล้ว',           icon:'', bgLight:'#ecfdf5', bgLightMid:'#d1fae5', textLight:'#047857' },
        { key:'Lost',        thLabel:'ไม่สำเร็จ',      label:'ไม่สำเร็จ',            icon:'', bgLight:'#fff1f2', bgLightMid:'#fecdd3', textLight:'#be123c' },
      ];
    },

    spSourceTypes() {
      return [
        { val:'purchased_data', label:'เว็บซื้อข้อมูล',    icon:'' },
        { val:'self_sourced',   label:'Sales Hunt งานเอง',  icon:'' },
      ];
    },

    spTableData() {
      const order = ['Interest','Send PI','Negotiating','Deal Signed','Delivered','Lost'];
      const all = [];
      for (const k of order) all.push(...(this.spKanban[k] || []));
      return all;
    },

    spWonReasons() {
      return ['ราคาเหมาะสม','คุณภาพสินค้าดี','ความสัมพันธ์ดี','ส่งเร็ว/ตรงเวลา','ครบสเปก','อื่นๆ'];
    },

    spLostReasons() {
      return ['ราคาสูงกว่าคู่แข่ง','สินค้าไม่ตรงสเปก','ลูกค้าเลื่อน/ยกเลิก','งบประมาณถูกตัด','ติดต่อช้าไป','อื่นๆ'];
    },
  },
  watch: {
    // ช่องค้นหาด่วน — กรอง client-side ทันทีที่พิมพ์ ต้องสั่ง redraw DataTable เองเพราะ ext.search ไม่ reactive (มุมมอง Kanban/การ์ด reactive อยู่แล้วผ่าน computed)
    spSearch() {
      if ($.fn.dataTable.isDataTable('#spTable')) $('#spTable').DataTable().draw();
    },
    // เรียงตาม — มุมมอง Kanban/การ์ด reactive อยู่แล้วผ่าน computed แต่ตาราง DataTables ต้องสั่ง order() เองเพราะไม่ reactive
    spSortBy() {
      if ($.fn.dataTable.isDataTable('#spTable')) $('#spTable').DataTable().order(this.spTableSortOrder).draw();
    },
  },
  async mounted() {
    try {
      const res = await apiCall('GET', 'api/auth.php?action=me');
      if (!res.success) { window.location.href = 'login.html'; return; }
      this.currentUser = res.data;
      if (this.currentUser.role === 'salesadmin') {
        window.location.href = 'dashboard.html'; return;
      }
    } catch { window.location.href = 'login.html'; return; }
    this.authReady = true;
    window.appVue = this;
    await this.$nextTick(); // รอให้ Vue วาง <table id="spTable"> ลง DOM ก่อน ค่อยให้ jQuery จับ
    this.bindTableEvents();
    // ตัวกรอง client-side (แท็บสถานะ + ค้นหา) ของมุมมองตาราง — DataTables ไม่ reactive ต้องผูก custom filter เอง (เหมือน bid-pipeline.html)
    $.fn.dataTable.ext.search.push((settings, searchData, index, rowData) => {
      if (settings.nTable.id !== 'spTable') return true;
      if (this.spActiveStatusTab !== 'all' && rowData.stage !== this.spActiveStatusTab) return false;
      return this.spMatchesSearch(rowData);
    });
    if (this.isSecretary) {
      this.loadSales();
    }
    this.loadSpKanban();

    // วัดความสูงจริงของแถบ AppNav ไว้ใช้เป็น top ของ header หน้านี้ตอน sticky (เหมือน bid-pipeline.html)
    // วัดซ้ำหลัง nextTick อีกครั้งด้วย setTimeout กัน race กับ Tailwind CDN (script ฉีด style ให้ element ที่ Vue เพิ่ง render ช้ากว่า $nextTick เล็กน้อย)
    this.updateSpNavHeight();
    setTimeout(this.updateSpNavHeight, 300);
    window.addEventListener('resize', this.updateSpNavHeight);
  },
  unmounted() {
    window.removeEventListener('resize', this.updateSpNavHeight);
  },
  methods: {
    ...SharedMethods,

    esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); },

    updateSpNavHeight() {
      this.spNavHeight = document.querySelector('header')?.offsetHeight || 0;
    },

    spSelectSale(val) {
      this.spFilter.assigned_to = val;
      this.spOpenFilterDropdown = null;
      this.loadSpKanban();
    },
    spSelectSourceType(val) {
      this.spFilter.source_type = val;
      this.spOpenFilterDropdown = null;
      this.loadSpKanban();
    },
    spSelectPeriod(val) {
      this.spFilter.period = val;
      this.spOpenFilterDropdown = null;
      this.loadSpKanban();
    },
    spSelectSort(value) {
      this.spSortBy = value;
      this.spOpenFilterDropdown = null;
    },
    spSelectStatusTab(key) {
      this.spActiveStatusTab = key;
      if ($.fn.dataTable.isDataTable('#spTable')) $('#spTable').DataTable().draw();
    },

    // เรียงลำดับ (ไม่แก้ array เดิม) — ใช้ร่วมกันทั้ง Kanban/การ์ด ส่วนตาราง (DataTables) ใช้ spTableSortOrder แยกต่างหาก
    spSortCards(arr) {
      const key = this.spSortBy;
      return [...arr].sort((a, b) => {
        if (key === 'close_asc' || key === 'close_desc') {
          const da = a.expected_close ? new Date(a.expected_close).getTime() : Infinity;
          const db = b.expected_close ? new Date(b.expected_close).getTime() : Infinity;
          return key === 'close_asc' ? da - db : db - da;
        }
        const va = parseFloat(a.value || 0);
        const vb = parseFloat(b.value || 0);
        return key === 'value_desc' ? vb - va : va - vb;
      });
    },
    spMatchesSearch(card) {
      const q = this.spSearch.trim().toLowerCase();
      if (!q) return true;
      return [card.title, card.client_name, card.project_code].some(v => (v || '').toLowerCase().includes(q));
    },
    // การ์ดของสถานะหนึ่งๆ หลังกรองด้วยช่องค้นหา + เรียงลำดับแล้ว — ใช้แทน spKanban[key] ตรงๆ ทุกจุดในมุมมอง Kanban (นับจำนวน/แสดงมูลค่า/แสดงการ์ด)
    spStageCards(key) {
      return this.spSortCards((this.spKanban[key] || []).filter(c => this.spMatchesSearch(c)));
    },
    // สถานะที่ยังไม่มีงาน (0 งาน หลังกรองค้นหาแล้ว) ย่อเป็นแถบแคบอัตโนมัติเสมอ จนกว่าผู้ใช้จะกดขยายเอง
    spIsStageCollapsed(stage) {
      if (this.spActiveStatusTab === stage.key) return false;
      return this.spStageCards(stage.key).length === 0 && !this.spExpandedEmptyStages[stage.key];
    },
    spToggleStageExpand(key) {
      this.spExpandedEmptyStages[key] = !this.spExpandedEmptyStages[key];
    },

    // รหัสสถานะใบเสนอราคาเก่า (StatusQuotation จากระบบ SalesManagement) — เหมือน bid-pipeline.html เป๊ะ ยืนยันความหมายจากผู้ใช้แล้ว
    quotationStatusLabel(code) {
      const map = { '0': 'ฉบับร่าง/ร่างแก้ไข Rev.', '1': 'บันทึกจริง', '2': 'ยืนยันแล้ว', '3': 'ยกเลิก' };
      return map[String(code)] || `รหัส ${code}`;
    },
    quotationStatusBadge(code) {
      const map = { '0': 'bg-slate-100 text-slate-600', '1': 'bg-sky-100 text-sky-700', '2': 'bg-emerald-100 text-emerald-700', '3': 'bg-rose-100 text-rose-700' };
      return map[String(code)] || 'bg-yellow-100 text-yellow-700';
    },

    // เปิด modal แสดงรายละเอียดใบเสนอราคาเก่าให้ sale ดู — ใช้ state แยก (spQuotationModal) ไม่แตะ modal/spForm หลัก
    // กันไม่ให้ข้อมูลที่แก้ไขค้างไว้ในฟอร์ม sp-form หายไปตอนเปิด/ปิด modal นี้ซ้อนขึ้นมา
    async openSpQuotationDetail(quotationId) {
      this.spQuotationLoading = true;
      try {
        const res = await apiCall('GET', `api/quotation_import.php?action=detail&id=${encodeURIComponent(quotationId)}`);
        if (res.success) {
          this.spQuotationModal = { show: true, data: res.data };
        } else {
          this.showAlert(res.message || 'ไม่สามารถโหลดใบเสนอราคานี้ได้', 'error');
        }
      } catch {
        this.showAlert('เกิดข้อผิดพลาดในการโหลดใบเสนอราคา', 'error');
      } finally {
        this.spQuotationLoading = false;
      }
    },
    closeSpQuotationModal() { this.spQuotationModal = { show: false, data: null }; },

    /** ผูก event คลิกปุ่ม action ในแถว "ครั้งเดียว" ตอน mounted ด้วย delegated listener บน #spTable (element แม่ที่ DataTables ไม่ทำลายทิ้งตอน destroy:true)
        หา card ต้นทางผ่าน DataTables row API (ไม่ใช้ data-id) เพราะ .row(tr).data() คืน object เดิมที่ผูกไว้ตอน initDataTable() ตรงๆ */
    bindTableEvents() {
      const self = this;
      const rowCard = btn => $('#spTable').DataTable().row($(btn).closest('tr')).data();
      $('#spTable').on('click', '.sp-next-btn', function () {
        const card = rowCard(this);
        if (card) self.confirmSpMove(card, self.spNextStage(card.stage));
      });
      $('#spTable').on('click', '.sp-winloss-signed-btn', function () {
        const card = rowCard(this);
        if (card) self.openSpWinLoss(card, 'Deal Signed');
      });
      $('#spTable').on('click', '.sp-winloss-lost-btn', function () {
        const card = rowCard(this);
        if (card) self.openSpWinLoss(card, 'Lost');
      });
      $('#spTable').on('click', '.sp-delivered-btn', function () {
        const card = rowCard(this);
        if (card) self.confirmSpMove(card, 'Delivered');
      });
      $('#spTable').on('click', '.sp-edit-btn', function () {
        const card = rowCard(this);
        if (card) self.openSpForm(card);
      });
      $('#spTable').on('click', '.sp-delete-btn', function () {
        const card = rowCard(this);
        if (card) self.deleteSpItem(card);
      });
    },

    /** สร้าง/รีเซ็ต DataTable ใหม่ทุกครั้งที่ spTableData เปลี่ยน (โหลดข้อมูล/เปลี่ยนตัวกรอง) — ใช้ destroy:true กันเวลา init ซ้ำ error
        คอลัมน์ render เป็น HTML string ล้วน เพราะ DataTables วาด DOM เอง ไม่ผ่าน Vue template
        คอลัมน์ Sale/หมวด และปุ่มลบ โผล่เฉพาะมุมมอง Secretary/Admin (isSale เห็นแค่ปุ่มที่เกี่ยวกับงานตัวเอง) */
    initDataTable() {
      const self = this;
      const columns = [
        {
          data: null, title: 'ชื่อโครงการ',
          render: (d, type, card) => {
            let html = '';
            if (card.project_code) html += `<div class="text-[.65rem] font-mono font-bold text-purple-700 bg-purple-50 rounded px-1.5 py-0.5 inline-block mb-0.5">${self.esc(card.project_code)}</div>`;
            html += `<div class="font-bold text-sm text-slate-800 leading-snug">${self.esc(card.title)}</div>`;
            if (card.client_name) html += `<div class="text-[.82rem] text-slate-500">${self.esc(card.client_name)}</div>`;
            return html;
          },
        },
        {
          data: 'stage', title: 'ขั้นตอน', orderable: false,
          render: d => `<span class="inline-block px-2 py-0.5 rounded text-[.75rem] font-semibold ${self.spStageClass(d)}">${self.esc(d)}</span>`,
        },
        {
          data: null, title: 'แหล่งที่มา', orderable: false,
          render: (d, type, card) => `<span class="inline-block px-2 py-0.5 rounded text-[.75rem] font-semibold ${self.spSourceClass(card.source_type)}">${self.esc(card.source_label)}</span>`,
        },
        {
          data: 'value', title: 'มูลค่า (฿)', className: 'text-right',
          // type !== 'display' (เช่นตอนเรียงลำดับ/ค้นหา) ต้องคืนค่าตัวเลขดิบ ไม่ใช่ HTML string — ไม่งั้นเรียงลำดับผิด (เทียบ string แทนตัวเลขจริง)
          render: (d, type) => {
            if (type !== 'display') return d || 0;
            return d ? `<span class="font-bold text-green-600">฿${self.formatNumber(d)}</span>` : '<span class="text-slate-300">-</span>';
          },
        },
      ];
      if (self.isSecretary) {
        columns.push({
          data: null, title: 'พนักงานขาย', orderable: false,
          render: (d, type, card) => {
            const avatar = card.sale_photo_url
              ? `<img src="${self.esc(card.sale_photo_url)}" class="w-5 h-5 rounded-full object-cover shrink-0"/>`
              : `<div class="w-5 h-5 rounded-full flex items-center justify-center text-white text-[.65rem] font-bold shrink-0" style="background:${card.sale_color||'#64748b'}">${self.esc(self.avatarInitials(card.sale_name))}</div>`;
            return `<div class="flex items-center gap-1.5">${avatar}<span class="text-sm">${self.esc(card.sale_name)}</span></div>`;
          },
        });
      }
      columns.push({
        data: 'priority', title: 'ความสำคัญ', orderable: false,
        render: d => `<span class="inline-block px-2 py-0.5 rounded text-[.75rem] font-semibold ${self.spPriorityClass(d)}">${self.esc(d)}</span>`,
      });
      if (self.isSecretary) {
        columns.push({ data: 'product_category', title: 'หมวด', render: d => d ? self.esc(d) : '<span class="text-slate-300">-</span>' });
      }
      columns.push({
        data: 'expected_close', title: 'วันคาดปิด',
        // type !== 'display' ต้องคืนค่าดิบเสมอ (แม้เป็นค่าว่าง) กัน null เรียงปนกับ HTML string "-" ผิดลำดับ
        render: (d, type) => {
          if (type !== 'display') return d || '';
          return d ? self.esc(d) : '<span class="text-slate-300">-</span>';
        },
      });
      columns.push({
        data: null, title: '', orderable: false, className: 'text-right',
        render: (d, type, card) => {
          let html = '<div class="flex gap-1 justify-end flex-wrap">';
          const nextStage = self.spNextStage(card.stage);
          if (!['Deal Signed','Delivered','Lost'].includes(card.stage) && nextStage) {
            html += `<button class="sp-next-btn text-xs font-semibold px-2 py-1 rounded bg-sky-100 text-sky-700 hover:bg-sky-200 border-0 cursor-pointer whitespace-nowrap">▶ ${self.esc(self.spNextLabel(card.stage))}</button>`;
          }
          if (card.stage === 'Negotiating') {
            html += `<button class="sp-winloss-signed-btn text-xs font-semibold px-2 py-1 rounded bg-emerald-100 text-emerald-700 hover:bg-emerald-200 border-0 cursor-pointer">ปิดดีล</button>`;
            html += `<button class="sp-winloss-lost-btn text-xs font-semibold px-2 py-1 rounded bg-red-100 text-red-700 hover:bg-red-200 border-0 cursor-pointer">ไม่สำเร็จ</button>`;
          }
          if (card.stage === 'Deal Signed') {
            html += `<button class="sp-delivered-btn text-xs font-semibold px-2 py-1 rounded bg-emerald-100 text-emerald-700 hover:bg-emerald-200 border-0 cursor-pointer whitespace-nowrap">ส่งสินค้าแล้ว</button>`;
          }
          html += `<button class="sp-edit-btn text-xs font-semibold px-2 py-1 rounded bg-slate-100 text-slate-600 hover:bg-slate-200 border-0 cursor-pointer">แก้ไข</button>`;
          // ลบได้ทั้ง sale เจ้าของงานและ secretary/admin — backend (api/pipeline_items.php's deleteItem()) เช็ค assigned_to ให้อยู่แล้วสำหรับ role sale
          html += `<button class="sp-delete-btn text-xs font-semibold px-2 py-1 rounded bg-red-100 text-red-700 hover:bg-red-200 border-0 cursor-pointer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
          </button>`;
          html += '</div>';
          return html;
        },
      });

      $('#spTable').DataTable({
        data: this.spTableData,
        destroy: true,
        autoWidth: false,
        order: [this.spTableSortOrder],
        language: {
          search: 'ค้นหา:',
          lengthMenu: 'แสดง _MENU_ รายการ',
          info: 'แสดง _START_ ถึง _END_ จาก _TOTAL_ รายการ',
          infoEmpty: 'ไม่มีข้อมูล',
          infoFiltered: '(กรองจาก _MAX_ รายการทั้งหมด)',
          zeroRecords: 'ไม่มีข้อมูล',
          paginate: { previous: 'ก่อนหน้า', next: 'ถัดไป' },
        },
        columns,
      });
    },

    // export ตามลำดับ/ตัวกรองที่ DataTables แสดงอยู่ตอนนี้ (search:'applied') ไม่ใช่ข้อมูลดิบทั้งหมดเสมอไป — เหมือน bid-pipeline.html/sources.html
    exportSpTable() {
      const headers = ['รหัสงาน', 'ชื่อโครงการ', 'ชื่อลูกค้า', 'ขั้นตอน', 'แหล่งที่มา', 'มูลค่า'];
      if (this.isSecretary) headers.push('Sale');
      headers.push('ความสำคัญ');
      if (this.isSecretary) headers.push('หมวดสินค้า');
      headers.push('วันคาดปิด');

      const cards = $('#spTable').DataTable().rows({ search: 'applied' }).data().toArray();
      const rows = cards.map(card => {
        const row = [card.project_code || '', card.title, card.client_name || '', card.stage, card.source_label, card.value ? Number(card.value) : ''];
        if (this.isSecretary) row.push(card.sale_name || '');
        row.push(card.priority);
        if (this.isSecretary) row.push(card.product_category || '');
        row.push(card.expected_close || '');
        return row;
      });
      this.exportExcel('งานขายตรง', headers, rows);
    },

    async loadSpKanban() {
      this.spLoading = true;
      try {
        let url = 'api/pipeline_items.php?action=kanban';
        if (this.spFilter.assigned_to) url += '&assigned_to=' + this.spFilter.assigned_to;
        if (this.spFilter.source_type)  url += '&source_type='  + this.spFilter.source_type;
        if (this.spFilter.period && this.spFilter.period !== 'all') url += '&period=' + this.spFilter.period;
        if (this.spFilter.priority)         url += '&adv_priority=' + encodeURIComponent(this.spFilter.priority);
        if (this.spFilter.product_category) url += '&product_category=' + encodeURIComponent(this.spFilter.product_category);
        if (this.spFilter.brand)            url += '&brand=' + encodeURIComponent(this.spFilter.brand);
        if (this.spFilter.client_q)         url += '&client_q=' + encodeURIComponent(this.spFilter.client_q.trim());
        if (this.spFilter.value_min)        url += '&value_min=' + encodeURIComponent(this.spFilter.value_min);
        if (this.spFilter.value_max)        url += '&value_max=' + encodeURIComponent(this.spFilter.value_max);
        if (this.spFilter.segment)          url += '&adv_segment=' + encodeURIComponent(this.spFilter.segment);
        if (this.spFilter.specialization)   url += '&specialization=' + encodeURIComponent(this.spFilter.specialization);
        const res = await apiCall('GET', url);
        if (res.success) {
          this.spKanban    = res.kanban    || {};
          this.spStats     = res.stats     || null;
          this.spSaleStats = res.per_sale  || [];
        }
      } catch { await this.showAlert('โหลดข้อมูลไม่ได้', 'error'); }
      this.spLoading = false;
      await this.$nextTick();
      this.initDataTable();
    },

    spColValue(stageKey) {
      const items = this.spStageCards(stageKey);
      const total = items.reduce((s, c) => s + (Number(c.value) || 0), 0);
      return total > 0 ? '฿' + this.formatNumber(total) : '';
    },

    spNextStage(stage) {
      const order = ['Interest','Send PI','Negotiating','Deal Signed','Delivered'];
      const i = order.indexOf(stage);
      return i >= 0 && i < order.length - 1 ? order[i + 1] : null;
    },

    spNextLabel(stage) {
      const map = {
        'Interest':    'ส่ง PI / ใบเสนอราคา',
        'Send PI':     'เข้าสู่การต่อรอง',
        'Deal Signed': 'ส่งมอบสินค้าแล้ว',
      };
      return map[stage] || 'ขั้นตอนต่อไป';
    },

    async confirmSpMove(card, toStage) {
      if (!toStage) return;
      const stageInfo = this.spStages.find(s => s.key === toStage);
      const ok = await this.showConfirm('เลื่อนขั้นตอน', `"${card.title}" จะถูกเลื่อนไปที่ → ${stageInfo?.thLabel || toStage}`, 'ยืนยัน เลื่อนขั้นตอน');
      if (!ok) return;
      const res = await apiCall('PUT', 'api/pipeline_items.php?id=' + card.id, { stage: toStage });
      if (res.success) { this.loadSpKanban(); await this.showAlert('เลื่อนขั้นตอนสำเร็จ', 'success'); }
      else await this.showAlert(res.message || 'เกิดข้อผิดพลาด', 'error');
    },

    openSpWinLoss(card, stage) {
      this.spWinLossForm = { id: card.id, stage, title: card.title, reason: '', note: '', value: card.value || '' };
      this.modal = { type: 'sp-win-loss', data: card };
    },

    async submitSpWinLoss() {
      if (!this.spWinLossForm.reason) { await this.showAlert('กรุณาเลือกเหตุผล', 'error'); return; }
      const payload = {
        stage:           this.spWinLossForm.stage,
        win_loss_reason: this.spWinLossForm.reason,
        win_loss_note:   this.spWinLossForm.note,
      };
      if (this.spWinLossForm.value) payload.value = this.spWinLossForm.value;
      const res = await apiCall('PUT', 'api/pipeline_items.php?id=' + this.spWinLossForm.id, payload);
      if (res.success) {
        this.closeModal();
        this.loadSpKanban();
        await this.showAlert('บันทึกสำเร็จ', 'success');
      } else await this.showAlert(res.message || 'เกิดข้อผิดพลาด', 'error');
    },

    async openSpForm(card) {
      this.spFormHistory = [];
      if (card) {
        this.spForm = {
          id: card.id, project_code: card.project_code || '', source_type: card.source_type || 'self_sourced',
          title: card.title, client_name: card.client_name || '',
          assigned_to: card.sale_id || '',
          stage: card.stage, segment: card.segment || '', priority: card.priority || 'Medium',
          product_category: card.product_category || '', brand: card.brand || '',
          fee_structure: card.fee_structure || '', specialization: card.specialization || '',
          value: card.value || '', win_probability: card.win_probability != null ? Math.round(card.win_probability * 100) : 20,
          expected_close: card.expected_close || '',
          next_action: card.next_action || '', notes: card.notes || '',
        };
      } else {
        this.spForm = { id:null, source_type:'self_sourced', title:'', client_name:'', assigned_to:'', stage:'Interest', segment:'', priority:'Medium', product_category:'', brand:'', fee_structure:'', specialization:'', value:'', win_probability:20, expected_close:'', next_action:'', notes:'' };
      }
      this.modal = { type: 'sp-form', data: card };

      if (card) {
        try {
          const res = await apiCall('GET', `api/pipeline_items.php?action=one&id=${card.id}`);
          if (res.success) this.spFormHistory = res.item.history || [];
        } catch {}
      }
    },

    async submitSpForm() {
      if (!this.spForm.title.trim()) { await this.showAlert('กรุณาระบุชื่อโครงการ/รายการ', 'error'); return; }
      const requiredDealFields = [
        { key: 'value',            label: 'มูลค่า (บาท)' },
        { key: 'win_probability',  label: 'โอกาสปิดดีล (%)' },
        { key: 'expected_close',   label: 'วันคาดปิดดีล' },
        { key: 'segment',          label: 'ประเภทลูกค้า' },
        { key: 'product_category', label: 'หมวดสินค้า' },
        { key: 'brand',            label: 'แบรนด์' },
        { key: 'fee_structure',    label: 'Fee Structure' },
        { key: 'specialization',   label: 'กลุ่มลูกค้า (Specialization)' },
      ];
      for (const f of requiredDealFields) {
        const v = this.spForm[f.key];
        if (v === '' || v === null || v === undefined) {
          await this.showAlert(`กรุณากรอก "${f.label}"`, 'error');
          return;
        }
      }
      const payload = { ...this.spForm };
      if (!payload.assigned_to) payload.assigned_to = this.currentUser.id;
      payload.win_probability = Math.min(100, Math.max(0, Number(payload.win_probability) || 0)) / 100;
      let res;
      if (this.spForm.id) {
        res = await apiCall('PUT', 'api/pipeline_items.php?id=' + this.spForm.id, payload);
      } else {
        res = await apiCall('POST', 'api/pipeline_items.php', payload);
      }
      if (res.success) {
        this.closeModal();
        this.loadSpKanban();
        await this.showAlert(this.spForm.id ? 'แก้ไขสำเร็จ' : 'เพิ่มงานสำเร็จ', 'success');
      } else await this.showAlert(res.message || 'เกิดข้อผิดพลาด', 'error');
    },

    async deleteSpItem(card) {
      const ok = await this.showConfirm('ลบรายการนี้?', `"${card.title}" จะถูกลบออกจากระบบ ไม่สามารถกู้คืนได้`, 'ลบรายการ');
      if (!ok) return;
      const res = await apiCall('DELETE', 'api/pipeline_items.php?id=' + card.id);
      if (res.success) { this.loadSpKanban(); await this.showAlert('ลบสำเร็จ', 'success'); }
      else await this.showAlert(res.message || 'เกิดข้อผิดพลาด', 'error');
    },

    // สลับมุมมอง Kanban/การ์ด/ตาราง — segmented control ต่อเนื่องแบบเดียวกับ bid-pipeline.html (ไม่มีเส้นขอบต่อปุ่ม ใช้ container ครอบแทน) สี teal เดียวกับ bid-pipeline.html ทุก role
    spViewToggleClass(active) {
      if (!active) return 'bg-white text-slate-500 hover:bg-slate-50';
      return 'bg-teal-700 text-white';
    },

    spSourceClass(sourceType) {
      const map = {
        'ebidding':       'bg-teal-100 text-teal-700',
        'purchased_data': 'bg-sky-100 text-sky-700',
        'self_sourced':   'bg-amber-100 text-amber-700',
      };
      return map[sourceType] || 'bg-slate-100 text-slate-500';
    },

    spPriorityClass(priority) {
      const map = {
        'High':   'bg-red-100 text-red-700',
        'Medium': 'bg-amber-100 text-amber-700',
        'Low':    'bg-emerald-100 text-emerald-700',
      };
      return map[priority] || 'bg-slate-100 text-slate-500';
    },

    spStageClass(stage) {
      const map = {
        'Interest':    'bg-slate-100 text-slate-600',
        'Send PI':     'bg-cyan-100 text-cyan-700',
        'Negotiating': 'bg-indigo-100 text-indigo-700',
        'Deal Signed': 'bg-emerald-100 text-emerald-700',
        'Delivered':   'bg-teal-100 text-teal-700',
        'Lost':        'bg-red-100 text-red-700',
      };
      return map[stage] || 'bg-slate-100 text-slate-500';
    },
  },
}).mount('#app');
</script>
</body>
</html>
