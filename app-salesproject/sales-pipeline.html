    // กล่อง "นัดติดตาม" บนหัวหน้าต่างดีล — ใช้กติกาเดียวกับป้ายบนการ์ด (spFollowupStatus) อ่านจากค่าที่บันทึกไว้ (2026-10-14)
    spHeadFollowup() {
      const card = this.modal.data;
      const status = card ? this.spFollowupStatus(card) : null;
      if (status === 'overdue') {
        const days = Math.round((new Date(this.spTodayStr() + 'T00:00:00') - new Date(card.next_followup_date + 'T00:00:00')) / 86400000);
        return { text: 'เลย ' + days + ' วัน', cls: 'bg-red-50 text-red-700' };
      }
      if (status === 'today')    return { text: 'วันนี้', cls: 'bg-orange-50 text-orange-700' };
      if (status === 'upcoming') return { text: this.shortDateThai(card.next_followup_date), cls: 'bg-slate-50 text-slate-700' };
      return { text: '-', cls: 'bg-slate-50 text-slate-500' };
    },
    // จำนวนดีลย้อนหลังที่ยังไม่ตรวจ (จากข้อมูลที่โหลดอยู่ — sale เห็นเฉพาะของตัวเอง)
    spImportPendingCount() {
      return Object.values(this.spKanban || {}).flat().filter(c => c && Number(c.import_pending) === 1).length;
    },
    // จำนวนดีลที่นำเข้าทั้งหมด ทุกสถานะ (ปุ่ม "ข้อมูลย้อนหลังทั้งหมด")
    // ดีลขายตรงที่ยังไม่ผูกลูกค้าในระบบ (ไม่นับดีลคู่ของงานประมูล — ลูกค้าผูกที่ประกาศ)
    spNoAccountCount() {
      return Object.values(this.spKanban || {}).flat().filter(c => c && this.spIsNoAccount(c)).length;
    },
    spImportAllCount() {
      return Object.values(this.spKanban || {}).flat().filter(c => c && Number(c.is_import) === 1).length;
    },
    // ลูกค้าที่เลือกมี Sale คนอื่นเป็นผู้ดูแล (ไม่ใช่ลูกค้าส่วนกลาง และไม่ใช่ sale ของดีลนี้)
    // ── ดีลนี้ขายแบบไหน (2026-11-20) ──
    // แสดงส่วนนี้เมื่อเลือกลูกค้าแล้ว — ดีลเดิมที่ยังไม่ระบุช่องทางไม่ถาม จนกว่าจะกด "ระบุช่องทางของดีลนี้" / งานประมูลไม่ใช้
    spShowChannel() {
      const f = this.spForm;
      return !!f.account_id && f.source_type !== 'ebidding' && (!f.id || !!f.sales_channel || f.apply_channel);
    },
    spChannelLegacy() {
      const f = this.spForm;
      return !!f.id && !f.sales_channel && !f.apply_channel;
    },
    // ตัวเลือกดูจากธง is_intermediary ของ customer_roles ห้ามเช็กจากชื่อ — ตัวที่ซ่อนแล้วยังแสดงถ้าดีลนี้ใช้อยู่
    spSelfRole() { return this.spCustomerOptions.roles.find(r => Number(r.is_intermediary) !== 1 && Number(r.is_active) === 1) || null; },
    spIntermediaryRoles() {
      return this.spCustomerOptions.roles.filter(r => Number(r.is_intermediary) === 1 && (Number(r.is_active) === 1 || r.customer_role_id === this.spForm.channel_role_id));
    },
    spChannelRole() { return this.spCustomerOptions.roles.find(r => r.customer_role_id === this.spForm.channel_role_id) || null; },
    spSegmentOptions() { return [{ value: 'Gov', label: 'หน่วยงานรัฐ' }, { value: 'Private', label: 'หน่วยงานเอกชน' }, { value: 'Individual', label: 'บุคคลทั่วไป' }]; },
    // ตลาด = ชื่อจาก customer_industries (ดีลเก็บเป็นชื่อในช่อง specialization) — ตัวที่ซ่อนแล้วยังแสดงถ้าเป็นค่าที่บันทึกไว้ของดีลนี้
    // ตลาดที่เลือกต้องพิมพ์ระบุ (customer_industries.requires_note เช่น อื่นๆ — 2026-11-23) ห้ามเช็คจากชื่อ
    spMarketNeedsNote() {
      const g = this.spCustomerOptions.industries.find(x => x.customer_industry_name === this.spForm.specialization);
      return !!g && Number(g.requires_note) === 1;
    },
    spMarketOptions() {
      const saved = this.modal.data?.specialization || '';
      return this.spCustomerOptions.industries.filter(g => Number(g.is_active) === 1 || g.customer_industry_name === saved).map(g => g.customer_industry_name);
    },
    // ข้อความสรุปก่อนบันทึก เช่น "ขายตรง · หน่วยงานรัฐ · Hospital & Wellness" / "ขายผ่านคนกลาง · ผู้รับเหมา · Office"
    spChannelSummary() {
      const f = this.spForm;
      if (!f.sales_channel) return '';
      const parts = f.sales_channel === 'direct'
        ? ['ขายตรง', this.spSegmentLabel(f.segment)]
        : ['ขายผ่านคนกลาง', (this.spChannelRole?.customer_role_name || '') + (f.channel_role_note ? ' (' + f.channel_role_note + ')' : '')];
      return [...parts, f.specialization ? f.specialization + (f.specialization_note ? ' (' + f.specialization_note + ')' : '') : ''].filter(Boolean).join(' · ');
    },
    // ตัวกรองกลุ่มลูกค้า: ค่าจาก master + Government ที่ดีลเดิมยังมีอยู่
    spIndustryFilterOptions() {
      return [...this.spCustomerOptions.industries.map(g => g.customer_industry_name), 'Government'];
    },
    spAccountOwnedByOther() {
      const owner = Number(this.spForm?.account_owner_id || 0);
      if (!owner) return false;
      const dealSale = Number(this.spForm.assigned_to || (this.currentUser?.role === 'sale' ? this.currentUser.id : 0));
      return owner !== dealSale;
    },
    spActiveContactRoles() { return this.contactRoles.filter(r => Number(r.is_active) === 1); },
    spSelectedContactCount() { return this.spContactRows.filter(c => c.selected).length; },
    // แถบสรุปคนที่เลือก — คนหลักขึ้นก่อน
    spSelectedContactsOrdered() { return this.spContactRows.filter(c => c.selected).sort((a, b) => Number(b.is_primary) - Number(a.is_primary)); },
    // ปุ่มประเภทดีลในฟอร์ม — แสดงเฉพาะที่ใช้งานอยู่ (is_active=1) + ประเภทเดิมของดีลที่กำลังแก้ (เผื่อถูกปิดใช้งานไปแล้ว)
    // คู่แข่งที่เลือกอยู่ในฟอร์ม (แปลง competitor_ids เป็นชื่อ) — หาใน master ไม่เจอ (เช่นเพิ่งเพิ่มจากเครื่องอื่น) ก็ยังแสดงจากค่าที่บันทึกไว้
    spSelectedCompetitors() {
      return this.spForm.competitor_ids.map(id =>
        this.competitors.find(c => Number(c.competitor_id) === id)
        || this.spSavedCompetitors.find(c => Number(c.competitor_id) === id)
        || { competitor_id: id, competitor_name: '#' + id });
    },
    // ตัวเลือกในรายการ: ใช้งานอยู่ + ยังไม่ได้เลือก + ชื่อตรงกับที่พิมพ์ (ไม่สนตัวพิมพ์เล็ก/ใหญ่และช่องว่าง)
    spCompetitorOptions() {
      const q = this.spCompetitorQuery.trim().toLowerCase().replace(/\s+/g, '');
      return this.competitors.filter(c =>
        Number(c.is_active) === 1
        && !this.spForm.competitor_ids.includes(Number(c.competitor_id))
        && c.competitor_name.toLowerCase().replace(/\s+/g, '').includes(q));
    },
    // ปุ่มติ๊กคู่แข่ง (2026-11-23): คู่แข่งจริงที่ใช้งานอยู่ + รายที่ดีลนี้เลือกไว้แล้ว (แม้ซ่อนไปแล้ว) เรียงตามจำนวนดีลที่ใช้ มากไปน้อย
    // โอกาสปิดดีลเดิมที่ไม่ตรงปุ่ม 10–90% (เช่น 25%, 100% ของดีลที่ปิดแล้ว) — แสดงป้าย "ค่าเดิม" (2026-11-23)
    spProbLegacy() {
      const v = this.spForm.win_probability;
      return v !== '' && v !== null && v !== undefined && ![10,20,30,40,50,60,70,80,90].includes(Number(v));
    },
    // ขั้น 8 ตรวจก่อนบันทึก — ข้อมูลแยกตามขั้น 1–7 (2026-11-23)
    spReviewGroups() {
      const f = this.spForm;
      const contacts = this.spSelectedContactsOrdered.map(c => (c.is_primary ? '★ ' : '') + c.full_name + (c.contact_role_id ? ' (' + this.spRoleName(c.contact_role_id) + ')' : '')).join(', ');
      const roleKind = { direct: 'ผู้ใช้เอง', indirect: 'คนกลาง' }[f.sales_channel] || '';
      const roleType = f.sales_channel === 'direct' ? (f.segment ? this.spSegmentLabel(f.segment) : '')
        : f.sales_channel === 'indirect' ? ((this.spChannelRole?.customer_role_name || '') + (f.channel_role_note ? ' (' + f.channel_role_note + ')' : '')) : '';
      // ลูกค้าปลายทาง: ผู้ใช้เอง = ลูกค้ารายนี้ (แบบเดียวกับขั้น 3) / คนกลาง = ชื่อที่พิมพ์
      const endUser = f.sales_channel === 'direct' ? f.account_name : f.end_user_name;
      const market = f.specialization ? f.specialization + (f.specialization_note ? ' (' + f.specialization_note + ')' : '') : '';
      const source = this.spSourceTypes.find(x => x.val === f.source_type)?.label || '';
      const dealType = this.dealTypes.find(x => x.deal_type_id === f.deal_type_id)?.deal_type_name || '';
      const prio = { High: 'สูง', Medium: 'กลาง', Low: 'ต่ำ' }[f.priority] || '';
      const valueText = f.value !== '' && f.value !== null && f.value !== undefined ? this.formatPrice(f.value) : '';
      // ไม่เลือกเจ้าของงาน = ระบบบันทึกเป็นผู้ที่ login (ดู submitSpForm) จึงแสดงชื่อตัวเอง
      const owner = (f.assigned_to && this.salesUsers.find(u => String(u.id) === String(f.assigned_to))?.full_name) || this.currentUser?.full_name || '';
      const groups = [
        { step: 1, title: 'ลูกค้าและผู้ติดต่อ', rows: [['ลูกค้า', f.account_name], ['ผู้ติดต่อ', contacts]] },
        { step: 2, title: 'บทบาทลูกค้า', rows: [['ลูกค้าเป็น', roleKind], ['ประเภท', roleType]] },
        { step: 3, title: 'ลูกค้าปลายทาง', rows: [['ชื่อลูกค้าปลายทาง', endUser], ['กลุ่มตลาด', market]] },
        { step: 4, title: 'สินค้า', rows: [['รายการสินค้า', f.title], ['หมวด / แบรนด์', [f.product_category, f.brand].filter(Boolean).join(' / ')]] },
        { step: 5, title: 'ที่มาและประเภทดีล', rows: [['ที่มา', source], ['ประเภทดีล', dealType], ['ค่าตอบแทนคนกลาง', f.fee_structure]] },
        { step: 6, title: 'มูลค่าและโอกาสปิดดีล', rows: [['มูลค่า', valueText], ['โอกาสปิดดีล', f.win_probability !== '' && f.win_probability != null ? f.win_probability + '%' : ''], ['คาดปิดดีล', f.expected_close ? this.spThaiDate(f.expected_close) : ''], ['ความสำคัญ', prio]] },
        { step: 7, title: 'คู่แข่ง', rows: [['มีคู่แข่งไหม', { has: 'มีคู่แข่ง', none: 'ไม่มีคู่แข่ง', unknown: 'ยังไม่ทราบ' }[f.competitor_mode] || ''], ['คู่แข่ง', f.competitor_mode === 'has' ? this.spCompetitorSummary : '']] },
        { step: 8, title: 'แผนติดตาม', rows: [['สิ่งที่ต้องทำต่อ', String(f.next_action || '').trim()], ['นัดติดตาม', f.next_followup_date ? this.spThaiDate(f.next_followup_date) : ''], ['หมายเหตุ', f.notes], ['เจ้าของงาน', owner]] },
      ];
      return groups;   // แสดงครบทุกกล่องเสมอ — ข้อมูลไหนยังไม่กำหนดเห็นเป็น "-"
    },
    // ข้อ 1 ตัวเลือก มีคู่แข่ง / ไม่มีคู่แข่ง / ยังไม่ทราบ (2026-11-23)
    spCompetitorModes() {
      return [{ key: 'has', label: 'มีคู่แข่ง' }, { key: 'none', label: 'ไม่มีคู่แข่ง' }, { key: 'unknown', label: 'ยังไม่ทราบ' }];
    },
    spCompetitorChoices() {
      return this.competitors
        .filter(c => Number(c.is_special) !== 1 && (Number(c.is_active) === 1 || this.spForm.competitor_ids.includes(Number(c.competitor_id))))
        .slice().sort((x, y) => Number(y.deal_count || 0) - Number(x.deal_count || 0) || String(x.competitor_name).localeCompare(String(y.competitor_name)));
    },
    // ช่องค้นหา (เกิน 12 ราย) กรองชื่อ — รายที่ติ๊กไว้แล้วแสดงเสมอ
    spCompetitorChoicesShown() {
      const q = this.spCompetitorQuery.trim().toLowerCase().replace(/\s+/g, '');
      if (!q) return this.spCompetitorChoices;
      return this.spCompetitorChoices.filter(c => this.spForm.competitor_ids.includes(Number(c.competitor_id)) || c.competitor_name.toLowerCase().replace(/\s+/g, '').includes(q));
    },
    // บรรทัดสรุป "เลือกแล้ว: ..."
    spCompetitorSummary() {
      const names = this.spSelectedCompetitors.map(c => c.competitor_name);
      if (this.spForm.competitor_other_on) names.push('อื่นๆ' + (String(this.spForm.competitor_other_note || '').trim() ? ' (' + this.spForm.competitor_other_note.trim() + ')' : ''));
      return names.join(', ');
    },
    // ตัวเลือกพิเศษ "ไม่มีคู่แข่ง" / "ยังไม่ทราบ" — ปุ่มลัดใต้ช่องคู่แข่ง (2026-10-30)
    spSpecialCompetitors() {
      return this.competitors.filter(c => Number(c.is_active) === 1 && Number(c.is_special) === 1);
    },
    // พิมพ์แล้วไม่เจอรายไหนเลย → แสดงข้อความให้แจ้ง admin (sale เพิ่มคู่แข่งเองไม่ได้ — admin คุมรายชื่อ)
    spCompetitorNotFound() {
      return this.spCompetitorQuery.trim() !== '' && this.spCompetitorOptions.length === 0;
    },
    spDealTypeOptions() {
      return this.dealTypes.filter(dt => Number(dt.is_active) === 1 || dt.deal_type_id === this.spForm.deal_type_id);
    },
    tabItems() {
      return [
        { label:'ภาพรวม', icon:'home', href:'dashboard.html' },
        { label:'งานขาย', icon:'briefcase', active:true },
        { label:'ออก', icon:'logout', action:'logout' },
      ];
    },
    isAdmin()      { return this.currentUser?.role === 'admin'; },
    // ล็อกลูกค้าของดีลขายตรงที่มีคำขอ / ออกใบเสนอราคาแล้ว (กฎ Taiyo — 2026-11-26) / ธุรการ + admin เปลี่ยนได้หลังยืนยัน
    spAccountLocked() { return !!(this.spForm.id && this.spForm.account_locked && this.spForm.source_type !== 'ebidding'); },
    spCanOverrideAccountLock() { return ['admin', 'salesadmin'].includes(this.currentUser?.role); },
    isManager()    { return ['admin','manager'].includes(this.currentUser?.role); },
    isSecretary()  { return ['admin','salesadmin','manager','viewer'].includes(this.currentUser?.role); },   // เห็นทั้งทีม (viewer = ผู้บริหาร 2026-10-22)
    // ผู้บริหาร ดูอย่างเดียว — ซ่อนปุ่มเลื่อนขั้น / ลบ / บันทึก (server กันซ้ำอีกชั้น)
    isViewer()     { return this.currentUser?.role === 'viewer'; },
    isSale()       { return this.currentUser?.role === 'sale'; },
    // ดีลนำเข้าย้อนหลังที่ยังรอตรวจ + ยังอยู่ขั้นส่งใบเสนอราคา → แสดงปุ่มยืนยัน "ยังเป็นใบเสนอราคาอยู่" (ยืนยันจากผู้ใช้ 2026-09-30)
    // เฉพาะ sale / ธุรการขาย (role ที่นับเป็นคนตรวจ — API ตรวจเจ้าของดีลซ้ำ)
    spImportReviewBox() {
      return this.canConfirmSpImport(this.modal?.type === 'sp-form' ? this.modal.data : null);
    },

    // สีธีมของหน้านี้: ใช้ teal เดียวกับ bid-pipeline.html ทั้งหมด ไม่แยกตาม role อีกต่อไป
    // (เดิมแยกเขียว/น้ำเงินตาม sale/secretary แต่ผู้ใช้ชี้ว่าทำให้สีไม่ consistent ข้ามหน้าเมื่อเทียบกับ bid-pipeline.html ที่ใช้ teal เดียวทุก role — ยืนยันแก้ 2026-09-21)
    spFilterBtnActiveClass() {
      return '!border-teal-400 !text-teal-700 !bg-teal-50';
    },
    spFilterBadgeClass() {
      return 'bg-teal-600';
    },
    // สถานะ active ของ dropdown แหล่งที่มา/ช่วงเวลา บน header (custom dropdown แบบเดียวกับ Sales/ช่วงเวลาของ bid-pipeline.html)
    spHeaderDropdownActiveClass() {
      return 'ring-teal-600 text-teal-700 font-semibold';
    },

    spPeriodOptions() {
      return [
        { value:'all',     label:'ทั้งหมด' },
        { value:'month',   label:'เดือนนี้' },
        { value:'quarter', label:'ไตรมาสนี้' },
        { value:'year',    label:'ปีนี้' },
      ];
    },
    spSelectedSaleLabel() {
      if (!this.spFilter.assigned_to) return 'Sales';
      return this.salesUsers.find(u => String(u.id) === String(this.spFilter.assigned_to))?.full_name || 'Sales';
    },
    // ป้ายตอนปิด dropdown ใส่ชื่อหมวดกำกับสั้นๆ เสมอ ("ที่มา"/"ช่วงเวลา") ไม่ใช่แค่ "ทั้งหมด" เฉยๆ กันสับสนกับ dropdown
    // อื่นที่อยู่ติดกัน แต่ต้องสั้น ไม่ยาวเกินไปจนตัวอักษรล้นจอมือถือ (ยืนยันจากผู้ใช้ 2026-09-21 — ย่อข้อความลงแทนการซ่อนตัวอักษรบนมือถือ)
    spSelectedSourceLabel() {
      if (!this.spFilter.source_type) return 'ที่มา';
      return this.spSourceTypes.find(s => s.val === this.spFilter.source_type)?.label || 'ที่มา';
    },
    spSelectedPeriodLabel() {
      if (this.spFilter.period === 'all') return 'ช่วงเวลา';
      return this.spPeriodOptions.find(p => p.value === this.spFilter.period)?.label || 'ช่วงเวลา';
    },

    // เรียงตาม: ใช้ dropdown เดียวกันควบคุมลำดับทั้ง 3 มุมมอง (Kanban/การ์ด/ตาราง) — มาตรฐานเดียวกับ bid-pipeline.html
    spSortOptions() {
      return [
        { value: 'close_asc',  label: 'วันคาดปิดดีล (ใกล้สุดก่อน)' },
        { value: 'close_desc', label: 'วันคาดปิดดีล (ไกลสุดก่อน)' },
        { value: 'value_desc', label: 'มูลค่าดีล (สูงสุดก่อน)' },
        { value: 'value_asc',  label: 'มูลค่าดีล (ต่ำสุดก่อน)' },
      ];
    },
    spSelectedSortLabel() {
      return this.spSortOptions.find(o => o.value === this.spSortBy)?.label || 'เรียงตาม';
    },
    // คอลัมน์/ทิศทางของตาราง DataTables ที่ตรงกับ spSortBy — ตำแหน่งคอลัมน์ขยับตาม isSecretary (มีคอลัมน์ Sale/หมวด เพิ่ม)
    spTableSortOrder() {
      const valueIdx = 3;
      const closeIdx = this.isSecretary ? 7 : 5;
      const map = {
        close_asc:  [closeIdx, 'asc'],
        close_desc: [closeIdx, 'desc'],
        value_desc: [valueIdx, 'desc'],
        value_asc:  [valueIdx, 'asc'],
      };
      return map[this.spSortBy] || [closeIdx, 'asc'];
    },

    // แท็บสถานะ: sales hunt แสดงทุก stage เสมอ (ไม่มีแนวคิด "แสดงงานปิด" เหมือนงานประมูล เพราะ terminal stage มีแค่ Delivered/Lost ไม่เยอะเท่า)
    spTabStages() { return this.spStages; },
    spTabStagesTotal() {
      return this.spTabStages.reduce((n, s) => n + this.spStageCards(s.key).length, 0);
    },
    // คอลัมน์ Kanban ที่แสดงจริง — ถ้าเลือกแท็บสถานะใดสถานะหนึ่ง (ไม่ใช่ "ทั้งหมด") เหลือคอลัมน์เดียวขยายเต็ม (ยืนยันจากผู้ใช้ 2026-09-21)
    spVisibleStages() {
      if (this.spActiveStatusTab === 'all') return this.spTabStages;
      return this.spTabStages.filter(s => s.key === this.spActiveStatusTab);
    },
    // การ์ดของมุมมอง "การ์ด" — กรองตามแท็บสถานะที่เลือก + ค้นหา + เรียงลำดับ
    spFilteredFlatCards() {
      const base = this.spActiveStatusTab === 'all' ? this.spTableData : this.spTableData.filter(c => c.stage === this.spActiveStatusTab);
      return this.spSortCards(base.filter(c => this.spMatchesSearch(c)));
    },

    // เลขที่ใบเสนอราคา แกะจากข้อความ spForm.notes ("นำเข้าจากใบเสนอราคาเก่า #QT260700028 ลงวันที่ ...")
    // งานขายตรง (self_sourced) ไม่มี field project_no แบบ HIST- เหมือนงานประมูล ต้อง parse จาก notes แทน
    // (รูปแบบข้อความคงที่ ดู importQuotation()'s self_sourced branch ใน api/quotation_import.php)
    spHistoryQuotationId() {
      const text = this.spForm?.notes || '';
      const m = text.match(/นำเข้าจากใบเสนอราคาเก่า #(\S+)/);
      return m ? m[1] : null;
    },

    spAdvFilterCount() {
      let n = 0;
      if (this.spFilter.priority)         n++;
      if (this.spFilter.product_category) n++;
      if (this.spFilter.brand)            n++;
      if (this.spFilter.client_q)         n++;
      if (this.spFilter.value_min || this.spFilter.value_max) n++;
      if (this.spFilter.segment)          n++;
      if (this.spFilter.specialization)   n++;
      return n;
    },

    // bgLight/bgLightMid/textLight: ชุดสีอ่อนสำหรับหัวคอลัมน์ Kanban/แท็บสถานะ จัดเป็น 3 กลุ่มตามความหมาย (ยืนยันจากผู้ใช้ 2026-09-21):
    // เทา = กำลังดำเนินการ (Interest/Send PI/Negotiating ยังไม่ตัดสินผล), เขียว = ปิดได้ (Deal Signed/Delivered), แดง = ไม่สำเร็จ (Lost)
    // ต่างจากงานประมูล e-Bidding ที่มี "รอประกาศผล" (รอคนนอกตัดสิน) แยกเป็นกลุ่มอำพันต่างหาก — Sales Hunt ไม่มี stage ลักษณะนั้น
    // (Negotiating คือกำลังเจรจาต่อรองเอง ไม่ใช่รอเฉยๆ) จึงใช้แค่ 3 กลุ่มพอ ใช้โทนสีเดียวกับ bid-pipeline.html ทุกประการเพื่อความ consistent ข้ามหน้า
    spStages() {
      return this.spStagesFor(this.spFilter.source_type);
    },

    spSourceTypes() {
      return [
        // Sales Hunt งานเองขึ้นก่อน + เป็นค่าเริ่มต้นตอนสร้างดีลใหม่ (งานส่วนใหญ่ — ยืนยันจากผู้ใช้ 2026-10-20)
        { val:'self_sourced',   label:'Sales Hunt งานเอง',  icon:'' },
        { val:'purchased_data', label:'เว็บซื้อข้อมูล',    icon:'' },
      ];
    },

    spTableData() {
      const order = ['Interest','Send PI','Negotiating','Deal Signed','Delivered','Lost'];
      const all = [];
      for (const k of order) all.push(...(this.spKanban[k] || []));
      return all;
    },

    // เหตุผลจาก master win_loss_reasons เฉพาะของงานขายตรง (applies_to = sales / both) — เดิม hardcode ไว้ในโค้ด (ย้ายเป็น master 2026-09-25)
    // ค่าที่เลือก (spWinLossForm.reason) เป็นรหัส win_loss_reason_id — เปลี่ยนจากข้อความ 2026-09-25
    spWonReasons() {
      return this.winLossReasons.filter(r => r.win_loss_type === 'won' && r.applies_to !== 'ebidding' && Number(r.is_active) === 1);
    },

    spLostReasons() {
      return this.winLossReasons.filter(r => r.win_loss_type === 'lost' && r.applies_to !== 'ebidding' && Number(r.is_active) === 1);
    },
    spSelectedReason() {
      return this.winLossReasons.find(r => String(r.win_loss_reason_id) === String(this.spWinLossForm.reason)) || null;
    },
    // เหตุผลที่ admin ตั้ง "ต้องกรอกรายละเอียด" (requires_note เช่น อื่นๆ) — เดิมเช็คชื่อ "อื่นๆ" ตรงตัว
    spNoteRequired() { return Number(this.spSelectedReason?.requires_note) === 1; },
    // Lost: ยังไม่เลือกเหตุผล = แสดงว่าบังคับไว้ก่อน / เลือกแล้วตาม requires_winner ("ต้องกรอกราคา") ของเหตุผลนั้น
    spLostRequiresPrice() {
      if (this.spWinLossForm.stage !== 'Lost') return false;
      if (!this.spWinLossForm.reason) return true;
      return Number(this.spSelectedReason?.requires_winner) === 1;
    },
    // ตัวเลือกผู้ชนะ: แบ่ง 2 กลุ่ม — คู่แข่งที่ระบุไว้ในดีลนี้ (ขึ้นก่อน) / คู่แข่งอื่น (รวม "ยังไม่ทราบ") — ไม่รวม "ไม่มีคู่แข่ง"
    spWinnerOptions() {
      const usable = this.competitors.filter(c => Number(c.is_active) === 1 && c.competitor_code !== 'CP-NONE');
      const inDealIds = this.spWinLossForm.deal_competitor_ids;
      return {
        inDeal: usable.filter(c => inDealIds.includes(Number(c.competitor_id)) && Number(c.is_special) !== 1),
        others: usable.filter(c => !inDealIds.includes(Number(c.competitor_id)) || Number(c.is_special) === 1),
      };
    },
  },
  watch: {
    // ฟอร์มเลือกขั้นส่งสินค้าแล้ว ยังไม่มีวันส่งจริง → ตั้งต้นเป็นวันนี้ (แก้ได้)
    'spForm.stage'(v) {
      // เฉพาะตอนเปลี่ยนเข้าขั้นนี้ — เปิดดีลที่ส่งไปแล้วแต่ไม่มีวันที่ ไม่เติมให้ (ไม่งั้นบันทึกแล้ววันส่งกลายเป็นวันนี้)
      if (v === 'Delivered' && this.modal?.data?.stage !== 'Delivered' && !this.spForm.delivered_date) this.spForm.delivered_date = this.todayIso();
    },
    // ช่องค้นหาด่วน — กรอง client-side ทันทีที่พิมพ์ ต้องสั่ง redraw DataTable เองเพราะ ext.search ไม่ reactive (มุมมอง Kanban/การ์ด reactive อยู่แล้วผ่าน computed)
    spSearch() {
      if ($.fn.dataTable.isDataTable('#spTable')) $('#spTable').DataTable().draw();
    },
    spImportFilter() {
      if ($.fn.dataTable.isDataTable('#spTable')) $('#spTable').DataTable().draw();
    },
    spNoAccountFilter() {
      if ($.fn.dataTable.isDataTable('#spTable')) $('#spTable').DataTable().draw();
    },
    // เรียงตาม — มุมมอง Kanban/การ์ด reactive อยู่แล้วผ่าน computed แต่ตาราง DataTables ต้องสั่ง order() เองเพราะไม่ reactive
    spSortBy() {
      if ($.fn.dataTable.isDataTable('#spTable')) $('#spTable').DataTable().order(this.spTableSortOrder).draw();
    },
  },
  async mounted() {
    try {
      const res = await apiCall('GET', 'api/auth.php?action=me');
      if (!res.success) { window.location.href = 'login.html'; return; }
      this.currentUser = res.data;
      if (this.currentUser.role === 'salesadmin') {
        window.location.href = 'dashboard.html'; return;
      }
    } catch { window.location.href = 'login.html'; return; }
    this.authReady = true;
    window.appVue = this;
    await this.$nextTick(); // รอให้ Vue วาง <table id="spTable"> ลง DOM ก่อน ค่อยให้ jQuery จับ
    this.bindTableEvents();
    // ตัวกรอง client-side (แท็บสถานะ + ค้นหา) ของมุมมองตาราง — DataTables ไม่ reactive ต้องผูก custom filter เอง (เหมือน bid-pipeline.html)
    $.fn.dataTable.ext.search.push((settings, searchData, index, rowData) => {
      if (settings.nTable.id !== 'spTable') return true;
      if (this.spActiveStatusTab !== 'all' && rowData.stage !== this.spActiveStatusTab) return false;
      return this.spMatchesSearch(rowData);
    });
    if (this.isSecretary) {
      this.loadSales();
    }
    this.loadDealTypes();
    this.loadContactRoles();
    this.loadCompetitors();
    this.loadWinLossReasons();
    this.loadSpKanban().then(() => this.openSpFormFromLink());   // ลิงก์ ?code= → เปิดดีลนั้น (2026-10-10)

    // วัดความสูงจริงของแถบ AppNav ไว้ใช้เป็น top ของ header หน้านี้ตอน sticky กันซ้อนทับ (เหมือน bid-pipeline.html)
    // ใช้ ResizeObserver แทน setTimeout เดา timing — เดิมวัดตอน mounted() แล้วสุ่มเสี่ยงได้ค่าตอน Tailwind CDN ยังฉีด style
    // ให้ AppNav ไม่เสร็จ (สูงไม่ตรงจริง) ทำให้ header หน้านี้เด้ง top ผิดตำแหน่งแวบหนึ่งก่อนค่อยเลื่อนถูกที่ (ยืนยันบั๊กจากผู้ใช้ 2026-09-21)
    // ResizeObserver ยิง callback ทันทีที่ขนาดจริงของ AppNav นิ่ง ไม่ต้องเดา delay และ handle resize จอไปในตัว
    // เรียก updateSpNavHeight() ทันทีก่อน 1 ครั้งด้วย (เผื่อ browser/สถานการณ์ที่ ResizeObserver ยิง callback แรกช้า) — ResizeObserver จะแก้ค่าให้ถูกต้องอีกทีถ้าค่านี้ยังผิดอยู่
    this.updateSpNavHeight();
    this.spNavHeightObserver = new ResizeObserver(() => this.updateSpNavHeight());
    this.spNavHeightObserver.observe(document.querySelector('header'));
  },
  unmounted() {
    this.spNavHeightObserver?.disconnect();
  },
  methods: {
    ...SharedMethods,

    esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); },

    updateSpNavHeight() {
      this.spNavHeight = document.querySelector('header')?.offsetHeight || 0;
    },

    spSelectSale(val) {
      this.spFilter.assigned_to = val;
      this.spOpenFilterDropdown = null;
      this.loadSpKanban();
    },
    spSelectSourceType(val) {
      this.spFilter.source_type = val;
      this.spOpenFilterDropdown = null;
      this.loadSpKanban();
    },
    spSelectPeriod(val) {
      this.spFilter.period = val;
      this.spOpenFilterDropdown = null;
      this.loadSpKanban();
    },
    spSelectSort(value) {
      this.spSortBy = value;
      this.spOpenFilterDropdown = null;
    },
    spSelectStatusTab(key) {
      this.spActiveStatusTab = key;
      if ($.fn.dataTable.isDataTable('#spTable')) $('#spTable').DataTable().draw();
    },

    // เรียงลำดับ (ไม่แก้ array เดิม) — ใช้ร่วมกันทั้ง Kanban/การ์ด ส่วนตาราง (DataTables) ใช้ spTableSortOrder แยกต่างหาก
    spSortCards(arr) {
      const key = this.spSortBy;
      return [...arr].sort((a, b) => {
        if (key === 'close_asc' || key === 'close_desc') {
          const da = a.expected_close ? new Date(a.expected_close).getTime() : Infinity;
          const db = b.expected_close ? new Date(b.expected_close).getTime() : Infinity;
          return key === 'close_asc' ? da - db : db - da;
        }
        const va = parseFloat(a.value || 0);
        const vb = parseFloat(b.value || 0);
        return key === 'value_desc' ? vb - va : va - vb;
      });
    },
    spIsNoAccount(card) { return !card.account_id && card.source_type !== 'ebidding'; },
    spMatchesSearch(card) {
      if (this.spNoAccountFilter && !this.spIsNoAccount(card)) return false;
      if (this.spImportFilter === 'pending' && Number(card.import_pending) !== 1) return false;
      if (this.spImportFilter === 'all' && Number(card.is_import) !== 1) return false;
      const q = this.spSearch.trim().toLowerCase();
      if (!q) return true;
      return [card.title, card.client_name, card.project_code].some(v => (v || '').toLowerCase().includes(q));
    },
    // การ์ดของสถานะหนึ่งๆ หลังกรองด้วยช่องค้นหา + เรียงลำดับแล้ว — ใช้แทน spKanban[key] ตรงๆ ทุกจุดในมุมมอง Kanban (นับจำนวน/แสดงมูลค่า/แสดงการ์ด)
    spStageCards(key) {
      return this.spSortCards((this.spKanban[key] || []).filter(c => this.spMatchesSearch(c)));
    },
    // สถานะที่ยังไม่มีงาน (0 งาน หลังกรองค้นหาแล้ว) ย่อเป็นแถบแคบอัตโนมัติเสมอ จนกว่าผู้ใช้จะกดขยายเอง
    spIsStageCollapsed(stage) {
      if (this.spActiveStatusTab === stage.key) return false;
      return this.spStageCards(stage.key).length === 0 && !this.spExpandedEmptyStages[stage.key];
    },
    spToggleStageExpand(key) {
      this.spExpandedEmptyStages[key] = !this.spExpandedEmptyStages[key];
    },

    // รหัสสถานะใบเสนอราคาเก่า (StatusQuotation จากระบบ SalesManagement) — เหมือน bid-pipeline.html เป๊ะ ยืนยันความหมายจากผู้ใช้แล้ว
    quotationStatusLabel(code) {
      const map = { '0': 'ฉบับร่าง/ร่างแก้ไข Rev.', '1': 'บันทึกจริง', '2': 'ยืนยันแล้ว', '3': 'ยกเลิก' };
      return map[String(code)] || `รหัส ${code}`;
    },
    quotationStatusBadge(code) {
      const map = { '0': 'bg-slate-100 text-slate-600', '1': 'bg-sky-100 text-sky-700', '2': 'bg-emerald-100 text-emerald-700', '3': 'bg-rose-100 text-rose-700' };
      return map[String(code)] || 'bg-yellow-100 text-yellow-700';
    },

    // เปิด modal แสดงรายละเอียดใบเสนอราคาเก่าให้ sale ดู — ใช้ state แยก (spQuotationModal) ไม่แตะ modal/spForm หลัก
    // กันไม่ให้ข้อมูลที่แก้ไขค้างไว้ในฟอร์ม sp-form หายไปตอนเปิด/ปิด modal นี้ซ้อนขึ้นมา
    async openSpQuotationDetail(quotationId) {
      this.spQuotationLoading = true;
      try {
        const res = await apiCall('GET', `api/quotation_import.php?action=detail&id=${encodeURIComponent(quotationId)}`);
        if (res.success) {
          this.spQuotationModal = { show: true, data: res.data };
        } else {
          this.showAlert(res.message || 'ไม่สามารถโหลดใบเสนอราคานี้ได้', 'error');
        }
      } catch {
        this.showAlert('เกิดข้อผิดพลาดในการโหลดใบเสนอราคา', 'error');
      } finally {
        this.spQuotationLoading = false;
      }
    },
    closeSpQuotationModal() { this.spQuotationModal = { show: false, data: null }; },

    /** ผูก event คลิกปุ่ม action ในแถว "ครั้งเดียว" ตอน mounted ด้วย delegated listener บน #spTable (element แม่ที่ DataTables ไม่ทำลายทิ้งตอน destroy:true)
        หา card ต้นทางผ่าน DataTables row API (ไม่ใช้ data-id) เพราะ .row(tr).data() คืน object เดิมที่ผูกไว้ตอน initDataTable() ตรงๆ */
    bindTableEvents() {
      const self = this;
      const rowCard = btn => $('#spTable').DataTable().row($(btn).closest('tr')).data();
      $('#spTable').on('click', '.sp-next-btn', function () {
        const card = rowCard(this);
        if (card) self.confirmSpMove(card, self.spNextStage(card.stage));
      });
      $('#spTable').on('click', '.sp-winloss-signed-btn', function () {
        const card = rowCard(this);
        if (card) self.openSpWinLoss(card, 'Deal Signed');
      });
      $('#spTable').on('click', '.sp-winloss-lost-btn', function () {
        const card = rowCard(this);
        if (card) self.openSpWinLoss(card, 'Lost');
      });
      $('#spTable').on('click', '.sp-delivered-btn', function () {
        const card = rowCard(this);
        if (card) self.confirmSpMove(card, 'Delivered');
      });
      $('#spTable').on('click', '.sp-edit-btn', function () {
        const card = rowCard(this);
        if (card) self.openSpForm(card);
      });
      $('#spTable').on('click', '.sp-delete-btn', function () {
        const card = rowCard(this);
        if (card) self.deleteSpItem(card);
      });
    },

    /** สร้าง/รีเซ็ต DataTable ใหม่ทุกครั้งที่ spTableData เปลี่ยน (โหลดข้อมูล/เปลี่ยนตัวกรอง) — ใช้ destroy:true กันเวลา init ซ้ำ error
        คอลัมน์ render เป็น HTML string ล้วน เพราะ DataTables วาด DOM เอง ไม่ผ่าน Vue template
        คอลัมน์ Sale/หมวด และปุ่มลบ โผล่เฉพาะมุมมอง Secretary/Admin (isSale เห็นแค่ปุ่มที่เกี่ยวกับงานตัวเอง) */
    initDataTable() {
      const self = this;
      const columns = [
        {
          data: null, title: 'ชื่อโครงการ',
          render: (d, type, card) => {
            let html = '';
            if (card.project_code) html += `<div class="text-[.65rem] font-mono font-bold text-purple-700 bg-purple-50 rounded px-1.5 py-0.5 inline-block mb-0.5">${self.esc(card.project_code)}</div>`;
            if (Number(card.import_pending) === 1) html += ` <span class="inline-block px-1.5 py-0.5 rounded text-[.7rem] font-bold bg-amber-100 text-amber-800">ข้อมูลย้อนหลัง — รอตรวจ</span>`;
            if (card.title) html += `<div class="font-bold text-sm text-slate-800 leading-snug">${self.esc(card.title)}</div>`;
            if (card.client_name) html += `<div class="text-[.82rem] text-slate-500">${self.esc(card.client_name)}</div>`;
            return html;
          },
        },
        {
          data: 'stage', title: 'ขั้นตอน', orderable: false,
          render: (d, type, card) => {
            const c = self.spStageColor(d);
            return `<span class="inline-block px-2 py-0.5 rounded-full text-[.75rem] font-semibold" style="background:${c.bgLight};color:${c.textLight}">${self.esc(self.spStageLabel(d, card.source_type))}</span>`;
          },
        },
        {
          data: null, title: 'แหล่งที่มา', orderable: false,
          render: (d, type, card) => `<span class="inline-block px-2 py-0.5 rounded text-[.75rem] font-semibold ${self.spSourceClass(card.source_type)}">${self.esc(card.source_label)}</span>`,
        },
        {
          data: 'value', title: 'มูลค่า (฿)', className: 'text-right',
          // type !== 'display' (เช่นตอนเรียงลำดับ/ค้นหา) ต้องคืนค่าตัวเลขดิบ ไม่ใช่ HTML string — ไม่งั้นเรียงลำดับผิด (เทียบ string แทนตัวเลขจริง)
          render: (d, type) => {
            if (type !== 'display') return d || 0;
            return d ? `<span class="font-bold text-green-600">฿${self.formatNumber(d)}</span>` : '<span class="text-slate-300">-</span>';
          },
        },
      ];
      if (self.isSecretary) {
        columns.push({
          data: null, title: 'พนักงานขาย', orderable: false,
          render: (d, type, card) => {
            const avatar = card.sale_photo_url
              ? `<img src="${self.esc(card.sale_photo_url)}" class="w-5 h-5 rounded-full object-cover shrink-0"/>`
              : `<div class="w-5 h-5 rounded-full flex items-center justify-center text-white text-[.65rem] font-bold shrink-0" style="background:${card.sale_color||'#64748b'}">${self.esc(self.avatarInitials(card.sale_name))}</div>`;
            return `<div class="flex items-center gap-1.5">${avatar}<span class="text-sm">${self.esc(card.sale_name)}</span></div>`;
          },
        });
      }
      columns.push({
        data: 'priority', title: 'ความสำคัญ', orderable: false,
        render: d => `<span class="inline-block px-2 py-0.5 rounded text-[.75rem] font-semibold ${self.spPriorityClass(d)}">${self.esc(d)}</span>`,
      });
      if (self.isSecretary) {
        columns.push({ data: 'product_category', title: 'หมวด', render: d => d ? self.esc(d) : '<span class="text-slate-300">-</span>' });
      }
      columns.push({
        data: 'expected_close', title: 'วันคาดปิด',
        // type !== 'display' ต้องคืนค่าดิบเสมอ (แม้เป็นค่าว่าง) กัน null เรียงปนกับ HTML string "-" ผิดลำดับ
        render: (d, type) => {
          if (type !== 'display') return d || '';
          return d ? self.esc(d) : '<span class="text-slate-300">-</span>';
        },
      });
      columns.push({
        data: null, title: '', orderable: false, className: 'text-right',
        render: (d, type, card) => {
          let html = '<div class="flex gap-1 justify-end flex-wrap">';
          // ผู้บริหาร ดูอย่างเดียว: มีแค่ปุ่มดูรายละเอียด
          if (self.isViewer) return html + '<button class="sp-edit-btn text-xs font-semibold px-2 py-1 rounded bg-slate-100 text-slate-600 hover:bg-slate-200 border-0 cursor-pointer whitespace-nowrap">ดูรายละเอียด</button></div>';
          const nextStage = self.spNextStage(card.stage);
          if (!['Deal Signed','Delivered','Lost'].includes(card.stage) && nextStage) {
            html += `<button class="sp-next-btn text-xs font-semibold px-2 py-1 rounded bg-sky-100 text-sky-700 hover:bg-sky-200 border-0 cursor-pointer whitespace-nowrap">▶ ${self.esc(self.spNextLabel(card.stage))}</button>`;
          }
          if (card.stage === 'Negotiating') {
            html += `<button class="sp-winloss-signed-btn text-xs font-semibold px-2 py-1 rounded bg-emerald-100 text-emerald-700 hover:bg-emerald-200 border-0 cursor-pointer">ปิดดีล</button>`;
            html += `<button class="sp-winloss-lost-btn text-xs font-semibold px-2 py-1 rounded bg-red-100 text-red-700 hover:bg-red-200 border-0 cursor-pointer">ไม่สำเร็จ</button>`;
          }
          if (card.stage === 'Deal Signed') {
            html += `<button class="sp-delivered-btn text-xs font-semibold px-2 py-1 rounded bg-emerald-100 text-emerald-700 hover:bg-emerald-200 border-0 cursor-pointer whitespace-nowrap">ส่งสินค้าแล้ว</button>`;
          }
          html += `<button class="sp-edit-btn text-xs font-semibold px-2 py-1 rounded bg-slate-100 text-slate-600 hover:bg-slate-200 border-0 cursor-pointer whitespace-nowrap">ดู / แก้ไข</button>`;
          // ลบได้ทั้ง sale เจ้าของงานและ secretary/admin — backend (api/pipeline_items.php's deleteItem()) เช็ค assigned_to ให้อยู่แล้วสำหรับ role sale
          html += `<button class="sp-delete-btn text-xs font-semibold px-2 py-1 rounded bg-red-100 text-red-700 hover:bg-red-200 border-0 cursor-pointer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
          </button>`;
          html += '</div>';
          return html;
        },
      });

      $('#spTable').DataTable({
        data: this.spTableData,
        destroy: true,
        autoWidth: false,
        order: [this.spTableSortOrder],
        language: {
          search: 'ค้นหา:',
          lengthMenu: 'แสดง _MENU_ รายการ',
          info: 'แสดง _START_ ถึง _END_ จาก _TOTAL_ รายการ',
          infoEmpty: 'ไม่มีข้อมูล',
          infoFiltered: '(กรองจาก _MAX_ รายการทั้งหมด)',
          zeroRecords: 'ไม่มีข้อมูล',
          paginate: { previous: 'ก่อนหน้า', next: 'ถัดไป' },
        },
        columns,
      });
    },

    // export ตามลำดับ/ตัวกรองที่ DataTables แสดงอยู่ตอนนี้ (search:'applied') ไม่ใช่ข้อมูลดิบทั้งหมดเสมอไป — เหมือน bid-pipeline.html/sources.html
    exportSpTable() {
      const headers = ['รหัสงาน', 'ชื่อโครงการ', 'ชื่อลูกค้า', 'ขั้นตอน', 'แหล่งที่มา', 'มูลค่า'];
      if (this.isSecretary) headers.push('Sale');
      headers.push('ความสำคัญ');
      if (this.isSecretary) headers.push('หมวดสินค้า');
      headers.push('วันคาดปิด');

      const cards = $('#spTable').DataTable().rows({ search: 'applied' }).data().toArray();
      const rows = cards.map(card => {
        const row = [card.project_code || '', card.title, card.client_name || '', card.stage, card.source_label, card.value ? Number(card.value) : ''];
        if (this.isSecretary) row.push(card.sale_name || '');
        row.push(card.priority);
        if (this.isSecretary) row.push(card.product_category || '');
        row.push(card.expected_close || '');
        return row;
      });
      this.exportExcel('งานขายตรง', headers, rows);
    },

    async loadSpKanban() {
      this.spLoading = true;
      try {
        let url = 'api/pipeline_items.php?action=kanban';
        if (this.spFilter.assigned_to) url += '&assigned_to=' + this.spFilter.assigned_to;
        if (this.spFilter.source_type)  url += '&source_type='  + this.spFilter.source_type;
        if (this.spFilter.period && this.spFilter.period !== 'all') url += '&period=' + this.spFilter.period;
        if (this.spFilter.priority)         url += '&adv_priority=' + encodeURIComponent(this.spFilter.priority);
        if (this.spFilter.product_category) url += '&product_category=' + encodeURIComponent(this.spFilter.product_category);
        if (this.spFilter.brand)            url += '&brand=' + encodeURIComponent(this.spFilter.brand);
        if (this.spFilter.client_q)         url += '&client_q=' + encodeURIComponent(this.spFilter.client_q.trim());
        if (this.spFilter.value_min)        url += '&value_min=' + encodeURIComponent(this.spFilter.value_min);
        if (this.spFilter.value_max)        url += '&value_max=' + encodeURIComponent(this.spFilter.value_max);
        if (this.spFilter.segment)          url += '&adv_segment=' + encodeURIComponent(this.spFilter.segment);
        if (this.spFilter.specialization)   url += '&specialization=' + encodeURIComponent(this.spFilter.specialization);
        const res = await apiCall('GET', url);
        if (res.success) {
          this.spKanban    = res.kanban    || {};
          this.spStats     = res.stats     || null;
          this.spSaleStats = res.per_sale  || [];
        }
      } catch { await this.showAlert('โหลดข้อมูลไม่ได้', 'error'); }
      this.spLoading = false;
      await this.$nextTick();
      this.initDataTable();
    },

    spColValue(stageKey) {
      const items = this.spStageCards(stageKey);
      const total = items.reduce((s, c) => s + (Number(c.value) || 0), 0);
      return total > 0 ? '฿' + this.formatNumber(total) : '';
    },

    spNextStage(stage) {
      const order = ['Interest','Send PI','Negotiating','Deal Signed','Delivered'];
      const i = order.indexOf(stage);
      return i >= 0 && i < order.length - 1 ? order[i + 1] : null;
    },

    spNextLabel(stage) {
      const map = {
        'Interest':    'ส่ง PI / ใบเสนอราคา',
        'Send PI':     'เข้าสู่การต่อรอง',
        'Deal Signed': 'ส่งมอบสินค้าแล้ว',
      };
      return map[stage] || 'ขั้นตอนต่อไป';
    },

    async confirmSpMove(card, toStage) {
      if (!toStage) return;
      // ส่งสินค้าแล้ว → หน้าต่างใส่วันที่ส่งจริง (ใช้แทนกล่องยืนยัน — ยืนยันจากผู้ใช้ 2026-10-07)
      if (toStage === 'Delivered') { this.spDeliveredForm = { date: this.todayIso(), saving: false }; this.modal = { type: 'sp-delivered', data: card }; return; }
      const stageInfo = this.spStages.find(s => s.key === toStage);
      const ok = await this.showConfirm('เลื่อนขั้นตอน', `"${this.spDealLabel(card)}" จะถูกเลื่อนไปที่ → ${stageInfo?.thLabel || toStage}`, 'ยืนยัน เลื่อนขั้นตอน');
      if (!ok) return;
      const res = await apiCall('PUT', 'api/pipeline_items.php?id=' + card.id, { stage: toStage });
      if (res.success) { this.loadSpKanban(); await this.showAlert('เลื่อนขั้นตอนสำเร็จ', 'success'); }
      else await this.showAlert(res.message || 'เกิดข้อผิดพลาด', 'error');
    },

    // วันนี้ (YYYY-MM-DD ตามเวลาเครื่อง) — ค่าตั้งต้นและเพดานของวันที่ส่งจริง
    todayIso() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    },

    async submitSpDelivered() {
      const f = this.spDeliveredForm, card = this.modal.data;
      if (!f.date) { await this.showAlert('กรุณาระบุวันที่ส่งสินค้าจริง', 'error'); return; }
      if (f.date > this.todayIso()) { await this.showAlert('วันที่ส่งสินค้าจริงต้องไม่เกินวันนี้', 'error'); return; }
      f.saving = true;
      const res = await apiCall('PUT', 'api/pipeline_items.php?id=' + card.id, { stage: 'Delivered', delivered_date: f.date });
      f.saving = false;
      if (res.success) { this.closeModal(); this.loadSpKanban(); await this.showAlert('บันทึกส่งสินค้าแล้ว', 'success'); }
      else await this.showAlert(res.message || 'เกิดข้อผิดพลาด', 'error');
    },

    async loadWinLossReasons() {
      const res = await apiCall('GET', 'api/win_loss_reasons.php?action=list');
      if (res.success) this.winLossReasons = res.data;
    },

    // ส่วนต่างมูลค่าเราเทียบผู้ชนะ เช่น "เราแพงกว่าผู้ชนะ ฿45,000 (3.2%)" — แบบเดียวกับ bid-pipeline.html's priceGapText()
    spPriceGapText(ourPrice, winnerPrice) {
      const ours = Number(ourPrice), win = Number(winnerPrice);
      if (!ours || !win) return '';
      const diff = ours - win;
      if (diff === 0) return 'ราคาเท่ากับผู้ชนะ';
      const pct = Math.abs(diff) / win * 100;
      return 'เรา' + (diff > 0 ? 'แพงกว่า' : 'ถูกกว่า') + 'ผู้ชนะ ' + this.formatPrice(Math.abs(diff)) + ' (' + pct.toFixed(1) + '%)';
    },

    async openSpWinLoss(card, stage) {
      this.spWinLossForm = {
        id: card.id, stage, title: this.spDealLabel(card), reason: '', note: '', value: card.value || '',
        winner_competitor_id: '', winning_price: '', deal_competitor_ids: [],
        expected_delivery_date: card.expected_delivery_date || '',   // วันคาดส่งมอบ (บังคับตอนปิดดีลได้ — 2026-10-07)
        delivered_date: this.todayIso(),                              // วันส่งจริง (กรณีตรวจดีลแล้วเลือก ส่งสินค้าแล้ว — 2026-10-07)
        then_delivered: false,   // ดีลย้อนหลังเลือก "ส่งสินค้าแล้ว" → ปิดดีลแล้วเลื่อนต่อ (2026-10-01)
      };
      this.modal = { type: 'sp-win-loss', data: card };
      // คู่แข่งที่ระบุไว้ในดีลนี้ → ขึ้นก่อนในตัวเลือกผู้ชนะ
      if (stage === 'Lost') {
        const res = await apiCall('GET', `api/pipeline_items.php?action=one&id=${card.id}`);
        if (res.success) this.spWinLossForm.deal_competitor_ids = (res.item.competitors || []).map(c => Number(c.competitor_id));
      }
    },

    async submitSpWinLoss() {
      const f = this.spWinLossForm;
      if (!f.reason) { await this.showAlert('กรุณาเลือกเหตุผล', 'error'); return; }
      if (this.spNoteRequired && !String(f.note || '').trim()) {
        await this.showAlert(`กรุณากรอกรายละเอียดเพิ่มเติม (เหตุผล "${this.spSelectedReason.win_loss_reason_name}" ต้องระบุว่าเพราะอะไร)`, 'error'); return;
      }
      if (f.stage === 'Deal Signed' && !f.then_delivered && !f.expected_delivery_date) { await this.showAlert('กรุณาระบุวันที่คาดว่าจะส่งมอบ (ใส่วันประมาณได้)', 'error'); return; }
      if (f.then_delivered && !f.delivered_date) { await this.showAlert('กรุณาระบุวันที่ส่งสินค้าจริง', 'error'); return; }
      if (f.then_delivered && f.delivered_date > this.todayIso()) { await this.showAlert('วันที่ส่งสินค้าจริงต้องไม่เกินวันนี้', 'error'); return; }
      if (f.stage === 'Lost') {
        if (!f.winner_competitor_id) { await this.showAlert('กรุณาเลือกผู้ชนะ (ถ้าไม่รู้หรือไม่มีผู้ชนะ ให้เลือก "ยังไม่ทราบ")', 'error'); return; }
        if (this.spLostRequiresPrice && !(Number(f.value) > 0)) { await this.showAlert('กรุณากรอกมูลค่าที่เราเสนอ', 'error'); return; }
      }
      const payload = {
        stage:              f.stage,
        win_loss_reason_id: Number(f.reason),
        win_loss_note:      f.note,
      };
      if (f.value) payload.value = f.value;
      // ส่งสินค้าแล้ว: วันคาดส่ง = วันส่งจริง (ส่งไปแล้ว ไม่ต้องคาดการณ์)
      if (f.stage === 'Deal Signed') payload.expected_delivery_date = f.then_delivered ? f.delivered_date : f.expected_delivery_date;
      if (f.stage === 'Lost') {
        payload.winner_competitor_id = f.winner_competitor_id || null;
        payload.winning_price = f.winning_price === '' ? null : f.winning_price;
      }
      const res = await apiCall('PUT', 'api/pipeline_items.php?id=' + this.spWinLossForm.id, payload);
      // ดีลย้อนหลังเลือก "ส่งสินค้าแล้ว": บันทึกปิดดีลก่อน (มีเหตุผล) แล้วเลื่อนต่อ — ประวัติครบ ส่ง PI → ปิดดีล → ส่งสินค้า
      if (res.success && f.then_delivered) await apiCall('PUT', 'api/pipeline_items.php?id=' + f.id, { stage: 'Delivered', delivered_date: f.delivered_date });
      if (res.success) {
        this.closeModal();
        this.loadSpKanban();
        await this.showAlert('บันทึกสำเร็จ', 'success');
      } else await this.showAlert(res.message || 'เกิดข้อผิดพลาด', 'error');
    },

    // ปุ่ม "ตรวจแล้ว — ยังเป็นใบเสนอราคาอยู่" ของดีลนำเข้าย้อนหลัง (ยืนยันจากผู้ใช้ 2026-09-30)
    // ดีลนำเข้ารอตรวจ + ยังอยู่ Send PI → กดยืนยันได้ — sale เจ้าของดีล / ธุรการขาย / admin (API ตรวจซ้ำ)
    canConfirmSpImport(card) {
      if (!card || Number(card.import_pending) !== 1 || card.stage !== 'Send PI') return false;
      if (['salesadmin', 'admin'].includes(this.currentUser?.role)) return true;
      return this.isSale && Number(card.sale_id) === Number(this.currentUser?.id);
    },

    // หน้าต่าง "ตรวจดีลย้อนหลัง" — ถามสถานะจริงตอนนี้ (ยืนยันจากผู้ใช้ 2026-10-01)
    async openSpImportReview(card) {
      if (!card) return;
      this.spReviewTransferOpen = false;
      this.spReviewTransferTo = '';
      this.modal = { type: 'sp-import-review', data: card };
      if (!this.reviewSales.length) {
        const res = await apiCall('GET', 'api/users.php?action=sales');
        if (res.success) this.reviewSales = res.data;
      }
    },

    // เลือกคำตอบ: สถานะเดิม = ยืนยัน / ต่อรอง = เลื่อนทันที / ปิดดีล-ส่งสินค้า-ไม่สำเร็จ = หน้าต่างเหตุผลเดิม / ลบ = ถามยืนยันก่อน
    async spReviewChoose(choice) {
      const card = this.modal.data;
      // ตัวเลือกที่บันทึกทันที ถามยืนยันก่อน — กดผิดแล้วย้อนกลับเองไม่ได้ (ยืนยันจากผู้ใช้ 2026-10-01)
      // ปิดดีล/ส่งสินค้า/ไม่สำเร็จ เปิดหน้าต่างใส่เหตุผลก่อน (ยกเลิกได้ในหน้าต่างนั้น) / ลบ ถามยืนยันใน deleteSpItem อยู่แล้ว
      if (choice === 'Send PI' && !(await this.showConfirm('ยืนยันสถานะเดิม?', `"${this.spDealLabel(card)}" ยังส่ง PI — รอลูกค้าตอบ (ไม่เปลี่ยนสถานะ)`, 'ยืนยัน ยังส่ง PI อยู่'))) return;
      if (choice === 'Negotiating' && !(await this.showConfirm('เปลี่ยนเป็น ต่อรอง / เจรจา?', `"${this.spDealLabel(card)}" จะเปลี่ยนสถานะเป็น ต่อรอง / เจรจา`, 'ยืนยัน ต่อรอง / เจรจา'))) return;
      if (choice === 'Send PI') { await this.confirmSpImportReview(card); return; }
      if (choice === 'delete') { this.closeModal(); await this.deleteSpItem(card); return; }
      if (choice === 'Negotiating') {
        this.spImportReviewSaving = true;
        const res = await apiCall('PUT', 'api/pipeline_items.php?id=' + card.id, { stage: 'Negotiating' });
        this.spImportReviewSaving = false;
        if (res.success) { this.closeModal(); this.loadSpKanban(); await this.showAlert('เลื่อนเป็น ต่อรอง/เจรจา แล้ว', 'success'); }
        else await this.showAlert(res.message || 'เกิดข้อผิดพลาด', 'error');
        return;
      }
      // Deal Signed / Delivered / Lost → หน้าต่างบันทึกผลเดิม (บังคับเหตุผล) — ส่งสินค้าแล้ว = ปิดดีลแล้วเลื่อนต่อ
      await this.openSpWinLoss(card, choice === 'Lost' ? 'Lost' : 'Deal Signed');
      this.spWinLossForm.then_delivered = choice === 'Delivered';
    },

    async spReviewTransfer() {
      const card = this.modal.data;
      const to = this.reviewSales.find(u => Number(u.id) === Number(this.spReviewTransferTo));
      const ok = await this.showConfirm('โอนดีลนี้?', `"${this.spDealLabel(card)}" จะย้ายไปเป็นของ ${to?.full_name || ''}`, 'ยืนยัน โอนดีล');
      if (!ok) return;
      this.spImportReviewSaving = true;
      const res = await apiCall('POST', `api/pipeline_items.php?action=transfer_import&id=${card.id}`, { assigned_to: Number(this.spReviewTransferTo) });
      this.spImportReviewSaving = false;
      if (res.success) { this.closeModal(); this.loadSpKanban(); await this.showAlert('โอนดีลแล้ว', 'success'); }
      else await this.showAlert(res.message || 'เกิดข้อผิดพลาด', 'error');
    },

    // กดได้ทั้งบนการ์ด (ส่ง card มา) และในฟอร์มแก้ไข (ใช้การ์ดที่เปิดฟอร์มอยู่)
    async confirmSpImportReview(card = this.modal.data) {
      const d = card;
      if (!d?.id) return;
      this.spImportReviewSaving = true;
      const res = await apiCall('POST', `api/pipeline_items.php?action=confirm_import_review&id=${d.id}`, {});
      this.spImportReviewSaving = false;
      if (res.success) {
        d.import_pending = 0;   // ป้ายรอตรวจหายทันที (การ์ดเดียวกับที่เปิดฟอร์ม)
        if (this.modal.type === 'sp-import-review') this.closeModal();
        this.loadSpKanban();
        await this.showAlert('บันทึกว่าตรวจแล้ว — ยังเป็นใบเสนอราคาอยู่', 'success');
      } else await this.showAlert(res.message || 'เกิดข้อผิดพลาด', 'error');
    },

    // เปิดดีลจากลิงก์ ?code= (ปุ่มใน LINE / อีเมล / กระดิ่ง — 2026-10-10) — หาการ์ดจากรหัสงานในข้อมูลที่โหลดแล้ว

            for (const k of SP_LOCK_FIELDS) {

    // ── กันบันทึกทับ (Optimistic Locking — ยืนยันจากผู้ใช้ 2026-10-30) ──

    spFormFieldFromItem(k, item) {

    spAccountRoleFieldsFromItem(item) {

        //   account_erp_codes: null = ยังไม่รู้ (ไม่แสดงส่วน ERP) / '' = ลูกค้ายังไม่มีรหัส ERP

    spConflictValue(field, v) {

    async reloadSpFormAfterConflict() {
      const res = await apiCall('GET', `api/pipeline_items.php?action=one&id=${this.spForm.id}`);
      if (!res.success) { await this.showAlert(res.message || 'โหลดข้อมูลไม่สำเร็จ', 'error'); return; }
      const item = res.item;
      for (const c of (this.spConflict?.conflicts || [])) this.spForm[c.field] = this.spFormFieldFromItem(c.field, item);
      if ((this.spConflict?.conflicts || []).some(c => ['sales_channel', 'channel_role_id', 'segment'].includes(c.field))) this.spForm.channel_defaulted = { channel: false, type: false };
      this.spFormBase = this.spBaseFromItem(item);

    // ลูกค้าประจำอยู่บนสุดเสมอ เลือกได้โดยไม่ต้องพิมพ์ ลดการกดสร้างใหม่ซ้ำ
    async openSpAccountDropdown() {

      this.spAccountResults = this.spRecentAccounts;

    searchSpAccountByClientName() {

    // ค้นหาหน่วยงาน/บริษัทแบบ debounce เล็กน้อย กันยิง API ถี่เกินไปทุกครั้งที่พิมพ์
    searchSpAccounts() {
      clearTimeout(this._spAccountTimer);

      if (!q) { this.openSpAccountDropdown(); return; }   // ลบคำค้นจนว่าง → กลับไปแสดงลูกค้าล่าสุด

    selectSpAccount(a) {

      this.spForm.account_code = a.account_code || '';

    // ตั้งต้นจากลูกค้า: ลูกค้าเป็นคนกลาง = ขายผ่านคนกลาง + ประเภทคนกลางของลูกค้า / ผู้ใช้เอง = ขายตรง + ประเภทของลูกค้า
    // ตลาด และชื่อลูกค้าปลายทาง ไม่ตั้งต้น (ลูกค้าไม่เก็บ) — ที่กรอกไว้แล้วคงไว้
    applySpChannelDefaults() {

    setSpChannel(kind) {

      } else {

    openSpAccountCreatePanel() {

    },
    // วันนัดจากปุ่มลัด — นับจากวันนี้ตามเวลาเครื่อง (ไม่ใช้ toISOString กันวันเลื่อนจาก UTC)
    spFollowupDate(q) {
      const d = new Date();
      if (q.months) d.setMonth(d.getMonth() + q.months); else d.setDate(d.getDate() + q.days);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    },
    // วันที่ภาษาไทย เช่น "จ. 30 พ.ย. 2569"
    spThaiDate(iso) {
      const [y, m, d] = String(iso || '').split('-').map(Number);
      if (!y || !m || !d) return '';
      return new Date(y, m - 1, d).toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    },
    // ปุ่มคำที่ใช้บ่อย: ช่องว่าง = ใส่คำ / มีข้อความแล้ว = ต่อท้ายด้วย " / " (ไม่ซ้ำคำเดิม) แล้วโฟกัสช่องให้พิมพ์ต่อ
    addSpNextAction(t) {
      const cur = String(this.spForm.next_action || '').trim();
      if (!cur) this.spForm.next_action = t + ' ';
      else if (!cur.includes(t)) this.spForm.next_action = cur + ' / ' + t + ' ';
      this.$nextTick(() => { const el = this.$refs.spNextActionInput; if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } });
    },
    // เลือกตลาด — เปลี่ยนตัวเลือกแล้วล้างข้อความระบุ "อื่นๆ" เดิม
    setSpMarket(name) {
      if (this.spForm.specialization !== name) this.spForm.specialization_note = '';
      this.spForm.specialization = name;
    },
    // คำอธิบายภาษาไทยใต้ปุ่มตลาด (customer_industries.customer_industry_description — ยืนยันจากผู้ใช้ 2026-11-23)
    spMarketDesc(name) {
      const g = this.spCustomerOptions.industries.find(x => x.customer_industry_name === name);
      return g ? (g.customer_industry_description || '') : '';
    },
    async loadSpCustomerOptions() {
      const res = await apiCall('GET', 'api/accounts.php?action=customer_options');
      if (res.success) this.spCustomerOptions = res.data;
    },
    // ── ขั้นตอนสร้างดีล (Stepper — ยืนยันจากผู้ใช้ 2026-11-02) ──
    spStepVisible(n) { return !!this.spForm.id || this.spWizardStep === n; },
    spWizardGo(n) {
      this.spWizardStep = n;
      this.$nextTick(() => { if (this.$refs.spFormBody) this.$refs.spFormBody.scrollTop = 0; });
    },
    async spWizardNext() {
      const message = this.spStepError(this.spWizardStep);
      if (message) { await this.showAlert(message, 'error'); return; }
      // มาแก้จากหน้าตรวจ: ตรวจขั้นที่เหลือก่อนกลับ — ขั้นไหนยังไม่ผ่าน (เช่น เปลี่ยนเป็นคนกลางแล้วต้องเลือกประเภทใหม่) ไปขั้นนั้นแทน
      if (this.spReturnToReview) {
        for (let step = this.spWizardStep + 1; step <= 8; step++) {
          if (this.spStepError(step)) { this.spWizardGo(step); return; }
        }
        this.spReturnToReview = false;
        this.spWizardGo(9);
        return;
      }
      this.spWizardGo(this.spWizardStep + 1);
    },
    spEditFromReview(step) {
      this.spReturnToReview = true;
      this.spWizardGo(step);
    },
    // ข้อความเตือนของแต่ละขั้น ว่าง = ผ่าน — เรียงตามช่องบนลงล่าง / ช่องบังคับเท่าเดิม ใช้ทั้งปุ่มถัดไปและตอนบันทึก
    spStepError(step) {
      const f = this.spForm;
      const isEmpty = v => v === '' || v === null || v === undefined;
      if (step === 1) {
        if (!f.id && !f.account_id) return 'กรุณาเลือกลูกค้า หรือสร้างลูกค้าใหม่';
        if (!f.id && !this.spContactRows.some(c => c.selected)) return 'กรุณาเลือกหรือเพิ่มผู้ติดต่อในดีลอย่างน้อย 1 คน';
      }
      if (step === 2) {
        // ดีลนี้ขายแบบไหน (2026-11-20): ขายตรง = ประเภท + ตลาด บังคับ / ผ่านคนกลาง = ประเภทคนกลาง บังคับ (ตลาด + ชื่อลูกค้าปลายทาง ไม่บังคับ)
        if (this.spShowChannel) {
          if (!f.sales_channel) return 'กรุณาเลือกว่าลูกค้ารายนี้เป็นผู้ใช้เอง หรือเป็นคนกลาง';
          if (f.sales_channel === 'direct') {
            if (!f.segment) return 'กรุณาเลือกประเภท (หน่วยงานรัฐ / หน่วยงานเอกชน / บุคคลทั่วไป)';
          } else {
            if (!f.channel_role_id) return 'กรุณาเลือกประเภทคนกลาง';
            if (this.spChannelRole && Number(this.spChannelRole.requires_note) === 1 && !String(f.channel_role_note || '').trim()) return `กรุณาพิมพ์ระบุ "${this.spChannelRole.customer_role_name}"`;
          }
        }
      }
      if (step === 3) {
        // ตลาด (2026-11-23 แยกจากขั้น 2): ผู้ใช้เองบังคับ / คนกลางไม่บังคับ
        if (this.spShowChannel && f.sales_channel === 'direct' && !this.spMarketOptions.includes(f.specialization)) return 'กรุณาเลือกกลุ่มตลาดลูกค้าปลายทาง';
        if (this.spShowChannel && this.spMarketNeedsNote && !String(f.specialization_note || '').trim()) return `กรุณาพิมพ์ระบุกลุ่มตลาด "${f.specialization}"`;
      }
      if (step === 4) {
        // ชื่อโครงการไม่บังคับ (ยืนยันจากผู้ใช้ 2026-10-23)
        if (isEmpty(f.product_category)) return 'กรุณาเลือก "หมวดสินค้า"';
        if (isEmpty(f.brand)) return 'กรุณาเลือก "แบรนด์"';
      }
      if (step === 5) {
        // ไม่มีค่าเริ่มต้นให้ ความสำคัญ / ประเภทดีล / Fee / โอกาสปิดดีล — กันเผลอกดผ่านแล้วได้ค่าที่ไม่ได้ตั้งใจ (ยืนยันจากผู้ใช้ 2026-09-23)
        if (!f.source_type)   return 'กรุณาเลือกแหล่งที่มาของงาน';
        if (!f.deal_type_id)  return 'กรุณาเลือกประเภทดีล';
        if (!f.fee_structure) return 'กรุณาเลือก "ค่าตอบแทนคนกลาง (Fee Structure)"';
      }
      if (step === 6) {
        if (isEmpty(f.value)) return 'กรุณากรอก "มูลค่า (บาท)"';
        if (isEmpty(f.win_probability)) return 'กรุณาเลือกโอกาสปิดดีล';
        if (!f.priority) return 'กรุณาเลือกระดับความสำคัญของดีล';
        // วันคาดปิดดีลไม่บังคับ (ยืนยันจากผู้ใช้ 2026-10-23) — ไม่ระบุ = นับเป็น "ภายใน 3 เดือน" ใน Weighted Pipeline
        // เปลี่ยนเป็นปิดดีลแล้วต้องมีวันคาดส่งมอบ (API ตรวจซ้ำ) — ดีลที่ปิดไปก่อนมีกฎ แก้ฟอร์มได้โดยไม่บังคับย้อนหลัง
        if (f.stage === 'Deal Signed' && this.modal?.data?.stage !== 'Deal Signed' && !f.expected_delivery_date) return 'กรุณาระบุวันที่คาดว่าจะส่งมอบ (ใส่วันประมาณได้)';
        if (f.stage === 'Delivered' && this.modal?.data?.stage !== 'Delivered' && !f.delivered_date) return 'กรุณาระบุวันที่ส่งสินค้าจริง';
        if (f.stage === 'Delivered' && f.delivered_date > this.todayIso()) return 'วันที่ส่งสินค้าจริงต้องไม่เกินวันนี้';
      }
      if (step === 7) {
        // คู่แข่งบังคับเฉพาะดีลใหม่ (ดีลเก่ายังไม่มีข้อมูลคู่แข่ง — ยืนยันจากผู้ใช้ 2026-09-24)
        if (f.competitor_other_on && !String(f.competitor_other_note || '').trim()) return 'กรุณาพิมพ์ชื่อคู่แข่ง "อื่นๆ"';
        if (!f.id && !f.competitor_mode) return 'กรุณาเลือกว่าดีลนี้มีคู่แข่งไหม';
        if (f.competitor_mode === 'has' && !f.competitor_ids.length && !f.competitor_other_on) return 'กรุณาติ๊กคู่แข่งอย่างน้อย 1 ราย';
        if (!f.id && !f.competitor_ids.length && !f.competitor_other_on) return 'กรุณาเลือกคู่แข่ง (ถ้าไม่มีหรือไม่ทราบ ให้เลือก "ไม่มีคู่แข่ง" หรือ "ยังไม่ทราบ")';
      }
      return '';
    },

    // แท็บไฟล์แจ้งจำนวนไฟล์ — จำนวนเปลี่ยนหลังโหลดครั้งแรก = แนบ/ลบไฟล์ → โหลดประวัติดีลใหม่ (มีแถว "แนบไฟล์ / ลบไฟล์") (2026-10-20)
    async onSpFileCount(n) {
      const changed = this.spFileCountFor === this.spForm.id && n !== this.spFileCount;
      this.spFileCount = n;
      this.spFileCountFor = this.spForm.id;
      if (!changed || !this.spForm.id) return;
      const res = await apiCall('GET', `api/pipeline_items.php?action=one&id=${this.spForm.id}`);
      if (res.success) this.spFormHistory = res.item.history || [];
    },

    async submitSpForm() {
      for (const step of [1, 2, 3, 4, 5, 6, 7]) {
        const message = this.spStepError(step);
        if (message) {
          if (!this.spForm.id) this.spWizardGo(step);
          await this.showAlert(message, 'error');
          return;
        }
      }

      const payload = { ...this.spForm };
      if (!['Deal Signed', 'Delivered'].includes(payload.stage)) delete payload.expected_delivery_date;   // ขั้นที่ยังไม่ปิด ไม่ส่ง (ไม่ล้างค่าเดิม)
      if (payload.stage !== 'Delivered' || !payload.delivered_date) delete payload.delivered_date;   // ดีลส่งเก่าที่ไม่มีวันที่ ไม่ส่งค่าว่างไปล้าง
      delete payload.contact_name; delete payload.contact_phone; delete payload.contact_position;
      if (!payload.competitor_other_on) payload.competitor_other_note = '';   // ไม่ติ๊ก อื่นๆ = ล้างข้อความ (2026-11-23)
      delete payload.competitor_other_on;
      delete payload.competitor_mode;
      if (typeof payload.next_action === 'string') payload.next_action = payload.next_action.trim();   // ปุ่มคำที่ใช้บ่อยเว้นวรรคท้ายไว้ให้พิมพ์ต่อ
      // ส่วน "ดีลนี้ขายแบบไหน" (2026-11-20): API ตัดสินช่องทางจากประเภทที่เลือก (channel_role_id) / ตลาดส่งเป็นรหัส deal_industry_id
      // ดีลเดิมที่ยังไม่ระบุช่องทาง ไม่ส่งช่องเหล่านี้ (ไม่แตะค่าเดิม) จนกว่าจะกด "ระบุช่องทางของดีลนี้"
      payload.apply_channel = this.spShowChannel;
      payload.deal_industry_id = this.spCustomerOptions.industries.find(g => g.customer_industry_name === this.spForm.specialization)?.customer_industry_id || '';
      if (!this.spMarketNeedsNote) payload.specialization_note = '';
      delete payload.specialization; delete payload.sales_channel; delete payload.channel_defaulted;
      if (!payload.apply_channel) { delete payload.segment; delete payload.channel_role_id; delete payload.channel_role_note; delete payload.end_user_name; delete payload.deal_industry_id; delete payload.specialization_note; }
      delete payload.account_role_id; delete payload.account_role_note; delete payload.account_role_name; delete payload.account_is_intermediary;
      if (payload.account_id) payload.deal_contacts = this.spDealContactsPayload();
      if (!payload.assigned_to) payload.assigned_to = this.currentUser.id;
      payload.win_probability = Math.min(100, Math.max(0, Number(payload.win_probability) || 0)) / 100;
      // ค่าตอนเปิดหน้าต่าง — API เทียบกับฐานข้อมูล ถ้ามีคนเปลี่ยนไปแล้วตอบ 409 ไม่บันทึกทับ (2026-10-30)
      if (this.spForm.id && this.spFormBase) payload._base = this.spFormBase;
      // กดซ้ำระหว่างกำลังบันทึก → ไม่ส่งซ้ำ (ฝั่ง API กันอีกชั้น: ดีลเดิมภายใน 60 วินาที)
      if (this.spFormSaving) return;
      this.spFormSaving = true;
      let res;
      try {
        if (this.spForm.id) {
          res = await apiCall('PUT', 'api/pipeline_items.php?id=' + this.spForm.id, payload);
        } else {
          res = await apiCall('POST', 'api/pipeline_items.php', payload);
        }
      } finally {
        this.spFormSaving = false;
      }
      if (!res.success && res.data?.conflicts) { this.spConflict = res.data; return; }
      if (res.success) {
        this.closeModal();
        this.loadSpKanban();
        await this.showAlert(this.spForm.id ? 'แก้ไขสำเร็จ' : 'สร้างงาน/ดีลสำเร็จ', 'success');
      } else await this.showAlert(res.message || 'เกิดข้อผิดพลาด', 'error');
    },

    // ชื่อดีลสำหรับข้อความยืนยัน — ชื่อโครงการไม่บังคับ (2026-10-23) ไม่มีชื่อใช้ รหัส PJ · ลูกค้า แทน
    spDealLabel(card) {
      if (card.title) return card.title;
      return [card.project_code, card.client_name || card.account_name].filter(Boolean).join(' · ');
    },

    async deleteSpItem(card) {
      const ok = await this.showConfirm('ลบรายการนี้?', `"${this.spDealLabel(card)}" จะถูกลบออกจากระบบ ไม่สามารถกู้คืนได้`, 'ลบรายการ');
      if (!ok) return;
      const res = await apiCall('DELETE', 'api/pipeline_items.php?id=' + card.id);
      if (res.success) { this.loadSpKanban(); await this.showAlert('ลบสำเร็จ', 'success'); }
      else await this.showAlert(res.message || 'เกิดข้อผิดพลาด', 'error');
    },

    // สลับมุมมอง Kanban/การ์ด/ตาราง — segmented control ต่อเนื่องแบบเดียวกับ bid-pipeline.html (ไม่มีเส้นขอบต่อปุ่ม ใช้ container ครอบแทน) สี teal เดียวกับ bid-pipeline.html ทุก role
    spViewToggleClass(active) {
      if (!active) return 'bg-white text-slate-500 hover:bg-slate-50';
      return 'bg-teal-700 text-white';
    },

    // master ประเภทดีล (ตาราง deal_types) ใช้สร้างปุ่มเลือกในฟอร์ม
    // ─── ผู้ติดต่อในดีล (2026-09-28) ───
    async loadContactRoles() {
      const res = await apiCall('GET', 'api/pipeline_items.php?action=contact_roles');
      if (res.success) this.contactRoles = res.items || [];
    },
    buildSpContactRows(accountContacts, dealContacts) {
      const inDeal = new Map(dealContacts.map(d => [Number(d.contact_id), d]));
      return accountContacts.map(c => {
        const d = inDeal.get(Number(c.id));
        return { key: 'c' + c.id, contact_id: Number(c.id), full_name: c.full_name, phone: c.phone || '', position: c.position || '',
                 selected: !!d, contact_role_id: d?.contact_role_id || '', is_primary: !!(d && Number(d.is_primary) === 1) };
      });
    },
    async loadSpAccountContacts(accountId) {
      this.spContactRows = [];
      if (accountId) {
        const res = await apiCall('GET', `api/contacts.php?action=list&account_id=${accountId}`);
        // ผู้ติดต่อที่เพิ่งบันทึกระหว่างรอโหลด ต้องไม่หาย (บั๊กที่ผู้ใช้เจอ 2026-09-29)
        const addedWhileLoading = this.spContactRows.filter(c => c.just_added);
        if (res.success) {
          const ids = new Set(addedWhileLoading.map(c => c.contact_id));
          this.spContactRows = [...this.buildSpContactRows(res.data.filter(c => !ids.has(Number(c.id))), []), ...addedWhileLoading];
        }
        // ลูกค้ายังไม่มีผู้ติดต่อ (เช่น ลูกค้าเพิ่งสร้าง) → เปิดหน้าต่างเพิ่มผู้ติดต่อให้เลย
        if (!this.spContactRows.length && Number(this.spForm.account_id) === Number(accountId)) this.openSpNewContact();
      }
    },

    // ─── เพิ่มผู้ติดต่อใหม่ (Quick Create) — บันทึกเข้าลูกค้าทันที (api/contacts.php create) แล้วติ๊กเข้าดีลให้ (2026-09-29) ───
    openSpNewContact() {
      this.spNewContact = { show: true, full_name: '', phone: '', position: '', saving: false, existing: null };
    },
    // confirmNew = ผู้ใช้ยืนยันแล้วว่าเป็นคนละคนกับผู้ติดต่อชื่อเดียวกันที่มีอยู่ (2026-10-23)
    async saveSpNewContact(confirmNew = false) {
      const f = this.spNewContact;
      if (!f.full_name.trim()) { await this.showAlert('กรุณากรอกชื่อผู้ติดต่อ', 'error'); return; }
      // เบอร์ไม่บังคับ — ใส่มาต้องถูกรูปแบบ (มือถือ / เบอร์สำนักงาน 02… ได้) (ยืนยันจากผู้ใช้ 2026-10-23)
      if (this.phoneInputProblem(f.phone)) { await this.showAlert('เบอร์โทร: ' + this.phoneInputProblem(f.phone), 'error'); return; }
      f.saving = true; f.existing = null;
      const res = await apiCall('POST', 'api/contacts.php?action=create',
        { account_id: this.spForm.account_id, full_name: f.full_name.trim(), phone: f.phone.trim(), position: f.position.trim(), confirm_new_contact: confirmNew ? 1 : 0 });
      f.saving = false;
      // ชื่อตรงผู้ติดต่อเดิมของลูกค้านี้ → ให้เลือกใช้คนเดิม หรือยืนยันว่าคนละคน
      if (!res.success && res.data?.existing_contact) { f.existing = res.data.existing_contact; return; }
      if (!res.success) { await this.showAlert(res.message || 'บันทึกผู้ติดต่อไม่สำเร็จ', 'error'); return; }
      // สำเร็จ (หรือเป็นคนเดิมชื่อเดียวกัน — existing) → ติ๊กคนนั้นเข้าดีล
      this.addOrSelectSpContact({ id: res.data.id, full_name: f.full_name.trim(), phone: f.phone.replace(/[^0-9+]/g, ''), position: f.position.trim() });
      f.show = false;
    },
    useSpExistingContact() {
      const e = this.spNewContact.existing;
      if (!e) return;
      this.addOrSelectSpContact({ id: e.id, full_name: e.full_name, phone: e.phone, position: '' });
      this.spNewContact.show = false;
    },
    // ติ๊กผู้ติดต่อเข้าดีล — ถ้ายังไม่อยู่ในรายการ (เพิ่งบันทึก) เพิ่มเข้าไปพร้อมป้าย "เพิ่งเพิ่ม"
    addOrSelectSpContact(c) {
      let row = this.spContactRows.find(x => Number(x.contact_id) === Number(c.id));
      if (!row) {
        row = { key: 'c' + c.id, contact_id: Number(c.id), full_name: c.full_name, phone: c.phone || '', position: c.position || '',
                selected: false, contact_role_id: '', is_primary: false, just_added: true };
        this.spContactRows.push(row);
      }
      row.selected = true;
      this.ensureSpPrimaryContact();
    },
    onSpContactToggle(c) {
      if (!c.selected) c.is_primary = false;
      this.ensureSpPrimaryContact();
    },
    // ติ๊ก/เอาติ๊กออก (ใช้ทั้งคลิกแถวในตาราง และช่องติ๊ก)
    toggleSpContact(c) {
      c.selected = !c.selected;
      this.onSpContactToggle(c);
    },
    spRoleName(id) {
      return this.contactRoles.find(r => r.contact_role_id === id)?.contact_role_name || 'ไม่ระบุบทบาท';
    },
    setSpPrimaryContact(c) {
      this.spContactRows.forEach(x => { x.is_primary = x === c; });
    },
    // คนหลักต้องมี 1 คนเสมอถ้ามีคนถูกเลือก — ไม่มี ให้คนแรกที่เลือกเป็นคนหลัก
    ensureSpPrimaryContact() {
      const selected = this.spContactRows.filter(x => x.selected);
      if (selected.length && !selected.some(x => x.is_primary)) selected[0].is_primary = true;
    },
    spDealContactsPayload() {
      return this.spContactRows.filter(c => c.selected).map(c => ({
        contact_id: c.contact_id,
        contact_role_id: c.contact_role_id || null,
        is_primary: c.is_primary,
      }));
    },

    async loadDealTypes() {
      this.loadSpCustomerOptions();
      const res = await apiCall('GET', 'api/pipeline_items.php?action=deal_types');
      if (res.success) this.dealTypes = res.items;
    },

    // master คู่แข่ง (ตาราง competitors) ใช้เป็นตัวเลือกในช่อง "คู่แข่งในดีลนี้"
    async loadCompetitors() {
      const res = await apiCall('GET', 'api/competitors.php?action=list');
      if (res.success) this.competitors = res.data;
    },
    // ตัวเลือกพิเศษ (ไม่มีคู่แข่ง/ยังไม่ทราบ) เลือกเดี่ยวๆ — เลือกแล้วล้างรายอื่นออก, เลือกคู่แข่งจริงแล้วเอาตัวเลือกพิเศษออก (API เช็คซ้ำอีกชั้น)
    addSpCompetitor(c) {
      const id = Number(c.competitor_id);
      const isSpecial = cid => Number(this.competitors.find(x => Number(x.competitor_id) === cid)?.is_special) === 1;
      if (Number(c.is_special) === 1) {
        this.spForm.competitor_ids = [id];
      } else if (!this.spForm.competitor_ids.includes(id)) {
        this.spForm.competitor_ids = this.spForm.competitor_ids.filter(x => !isSpecial(x)).concat(id);
      }
      this.spCompetitorQuery = '';
      this.spCompetitorDropdownOpen = false;
    },
    // ตัวเลือกพิเศษตามรหัส (ห้ามเช็คชื่อ — admin แก้ชื่อได้)
    spSpecialCompetitorId(code) {
      const c = this.competitors.find(x => x.competitor_code === code);
      return c ? Number(c.competitor_id) : null;
    },
    // ค่าข้อ 1 จากคู่แข่งที่บันทึกไว้ (ดีลเดิม)
    spCompetitorModeFromIds() {
      const ids = this.spForm.competitor_ids;
      if (ids.includes(this.spSpecialCompetitorId('CP-NONE'))) return 'none';
      if (ids.includes(this.spSpecialCompetitorId('CP-UNKNOWN'))) return 'unknown';
      return (ids.length || this.spForm.competitor_other_on) ? 'has' : '';
    },
    // เลือกข้อ 1: ไม่มี / ยังไม่ทราบ = ตัวเลือกพิเศษตัวเดียว ล้างรายชื่อ + อื่นๆ / มีคู่แข่ง = เอาตัวเลือกพิเศษออก
    setSpCompetitorMode(mode) {
      this.spForm.competitor_mode = mode;
      if (mode === 'has') {
        const specials = [this.spSpecialCompetitorId('CP-NONE'), this.spSpecialCompetitorId('CP-UNKNOWN')];
        this.spForm.competitor_ids = this.spForm.competitor_ids.filter(x => !specials.includes(x));
        return;
      }
      const id = this.spSpecialCompetitorId(mode === 'none' ? 'CP-NONE' : 'CP-UNKNOWN');
      this.spForm.competitor_ids = id ? [id] : [];
      this.spForm.competitor_other_on = false;
      this.spForm.competitor_other_note = '';
    },
    // ติ๊ก / เอาติ๊กออก (2026-11-23) — ตัวเลือกพิเศษเลือกเดี่ยว ๆ: เลือกแล้วล้างคู่แข่งอื่นและ "อื่นๆ"
    toggleSpCompetitor(c) {
      const id = Number(c.competitor_id);
      if (this.spForm.competitor_ids.includes(id)) { this.removeSpCompetitor(id); return; }
      this.addSpCompetitor(c);
      if (Number(c.is_special) === 1) { this.spForm.competitor_other_on = false; this.spForm.competitor_other_note = ''; }
    },
    // "อื่นๆ" ติ๊กแล้วเอาตัวเลือกพิเศษออก / เอาติ๊กออกแล้วล้างข้อความ
    toggleSpCompetitorOther() {
      this.spForm.competitor_other_on = !this.spForm.competitor_other_on;
      if (this.spForm.competitor_other_on) {
        const isSpecial = cid => Number(this.competitors.find(x => Number(x.competitor_id) === cid)?.is_special) === 1;
        this.spForm.competitor_ids = this.spForm.competitor_ids.filter(x => !isSpecial(x));
      } else {
        this.spForm.competitor_other_note = '';
      }
    },
    removeSpCompetitor(id) {
      this.spForm.competitor_ids = this.spForm.competitor_ids.filter(x => x !== Number(id));
    },
    // กด Enter ในช่องพิมพ์: เลือกรายแรกในรายการ
    pickFirstSpCompetitor() {
      if (this.spCompetitorOptions.length) this.addSpCompetitor(this.spCompetitorOptions[0]);
    },
    // สถานะวันนัดติดตาม: 'overdue' เลยนัดแล้ว / 'today' ถึงนัดวันนี้ / 'upcoming' ยังไม่ถึง / null ไม่มีนัด หรือดีลจบแล้ว
    spFollowupStatus(card) {
      if (!card.next_followup_date || ['Deal Signed','Delivered','Lost'].includes(card.stage)) return null;
      const today = this.spTodayStr();
      if (card.next_followup_date < today) return 'overdue';
      if (card.next_followup_date === today) return 'today';
      return 'upcoming';
    },
    spFollowupClass(card) {
      const map = {
        overdue:  'bg-red-100 text-red-700',
        today:    'bg-orange-100 text-orange-700',
        upcoming: 'bg-slate-100 text-slate-600',
      };
      return map[this.spFollowupStatus(card)] || '';
    },
    spFollowupText(card) {
      const status = this.spFollowupStatus(card);
      const dateText = this.formatDateThai(card.next_followup_date);
      if (status === 'overdue') return `🔴 เลยนัดติดตาม (${dateText})`;
      if (status === 'today')   return '🟠 นัดติดตามวันนี้';
      return `📅 นัดติดตาม ${dateText}`;
    },
    // วันนี้ตามเวลาเครื่อง รูปแบบ YYYY-MM-DD (ไม่ใช้ toISOString() เพราะเป็นเวลา UTC — ช่วงเช้ามืดไทยจะได้วันเมื่อวาน)
    spTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    },

    spSourceClass(sourceType) {
      const map = {
        'ebidding':       'bg-teal-100 text-teal-700',
        'purchased_data': 'bg-sky-100 text-sky-700',
        'self_sourced':   'bg-amber-100 text-amber-700',
      };
      return map[sourceType] || 'bg-slate-100 text-slate-500';
    },

    spPriorityClass(priority) {
      const map = {
        'High':   'bg-red-100 text-red-700',
        'Medium': 'bg-amber-100 text-amber-700',
        'Low':    'bg-emerald-100 text-emerald-700',
      };
      return map[priority] || 'bg-slate-100 text-slate-500';
    },

    // แหล่งสีเดียว (single source of truth) ของสถานะ stage — ใช้ร่วมกันทั้ง badge (spStageClass) และหัวคอลัมน์/แท็บ Kanban (spStagesFor)
    // จัดเป็น 3 กลุ่มตามความหมาย (ยืนยันจากผู้ใช้ 2026-09-21): เทา = กำลังดำเนินการ (Interest/Send PI/Negotiating ยังไม่ตัดสินผล),
    // เขียว = ปิดได้ (Deal Signed/Delivered), แดง = ไม่สำเร็จ (Lost) — ไม่ขึ้นกับ source_type เพราะกลุ่มสีเหมือนกันทั้งฝั่งงานประมูล/ขายตรง ต่างแค่ label
    // (เดิม badge กับ Kanban แยก mapping กันคนละชุด สีไม่ตรงกัน — ยืนยันจากผู้ใช้ 2026-09-21 ให้รวมเป็นชุดเดียว)
    spStageColor(stage) {
      const groups = {
        'Interest':    { bgLight:'#f8fafc', bgLightMid:'#e2e8f0', textLight:'#334155' },
        'Send PI':     { bgLight:'#f8fafc', bgLightMid:'#e2e8f0', textLight:'#334155' },
        'Negotiating': { bgLight:'#f8fafc', bgLightMid:'#e2e8f0', textLight:'#334155' },
        'Deal Signed': { bgLight:'#ecfdf5', bgLightMid:'#d1fae5', textLight:'#047857' },
        'Delivered':   { bgLight:'#ecfdf5', bgLightMid:'#d1fae5', textLight:'#047857' },
        'Lost':        { bgLight:'#fff1f2', bgLightMid:'#fecdd3', textLight:'#be123c' },
        // สถานะงานประมูลเดิม — แสดงในประวัติของดีลที่เปลี่ยนประเภทจากงานประมูล (2026-10-01)
        'ชนะการประมูล': { bgLight:'#ecfdf5', bgLightMid:'#d1fae5', textLight:'#047857' },
        'ส่งมอบแล้ว':   { bgLight:'#ecfdf5', bgLightMid:'#d1fae5', textLight:'#047857' },
        'แพ้การประมูล': { bgLight:'#fff1f2', bgLightMid:'#fecdd3', textLight:'#be123c' },
        'ยกเลิก':       { bgLight:'#f1f5f9', bgLightMid:'#e2e8f0', textLight:'#64748b' },
      };
      return groups[stage] || { bgLight:'#f8fafc', bgLightMid:'#e2e8f0', textLight:'#64748b' };
    },

    // สีสำหรับ badge (:style) — ดึงจาก spStageColor() แหล่งเดียวกับ Kanban แทนที่จะมี Tailwind class mapping แยกชุดเหมือนเดิม
    spStageClass(stage) {
      const c = this.spStageColor(stage);
      return { background: c.bgLight, color: c.textLight };
    },

    // ดึงรายการ stage+label ไทย แยกชุดตาม source_type (ebidding ใช้ถ้อยคำงานประมูล, self_sourced/purchased_data ใช้ถ้อยคำขายตรง)
    // แยกออกมาจาก spStages computed (เดิม inline ในนั้น) เพื่อให้ spStageLabel() เรียกใช้ตาม source_type ของแต่ละแถวได้ ไม่ต้องพึ่ง spFilter.source_type ที่เป็นตัวกรองส่วนกลาง (ยืนยันจากผู้ใช้ 2026-09-21)
    // สี (bgLight/bgLightMid/textLight) ดึงจาก spStageColor() แหล่งเดียวกับ badge เสมอ — เหลือแค่ label/thLabel ที่ต่างกันตาม sourceType
    spStagesFor(sourceType) {
      if (sourceType === 'ebidding') {
        return [
          { key:'Interest',    thLabel:'รับงาน/ศึกษา TOR', label:'รับงาน / ศึกษา TOR',   icon:'', ...this.spStageColor('Interest') },
          { key:'Send PI',     thLabel:'เตรียม/ยื่นซอง',   label:'เตรียม & ยื่นข้อเสนอ', icon:'', ...this.spStageColor('Send PI') },
          { key:'Negotiating', thLabel:'รอประกาศผล',        label:'รอประกาศผล',           icon:'', ...this.spStageColor('Negotiating') },
          { key:'Deal Signed', thLabel:'ชนะประมูล',         label:'ชนะประมูล',            icon:'', ...this.spStageColor('Deal Signed') },
          { key:'Delivered',   thLabel:'ส่งมอบแล้ว',        label:'ส่งมอบแล้ว',           icon:'', ...this.spStageColor('Delivered') },
          { key:'Lost',        thLabel:'แพ้/ยกเลิก',        label:'แพ้ / ยกเลิก',         icon:'', ...this.spStageColor('Lost') },
        ];
      }
      return [
        { key:'Interest',    thLabel:'สนใจ/ติดต่อ',   label:'สนใจ / ติดต่อ',       icon:'', ...this.spStageColor('Interest') },
        { key:'Send PI',     thLabel:'ส่ง PI/ใบเสนอ', label:'ส่ง PI / ใบเสนอราคา', icon:'', ...this.spStageColor('Send PI') },
        { key:'Negotiating', thLabel:'ต่อรอง/เจรจา',  label:'ต่อรอง / เจรจา',       icon:'', ...this.spStageColor('Negotiating') },
        { key:'Deal Signed', thLabel:'ปิดดีลแล้ว',    label:'ปิดดีลแล้ว',           icon:'', ...this.spStageColor('Deal Signed') },
        { key:'Delivered',   thLabel:'ส่งมอบแล้ว',    label:'ส่งมอบแล้ว',           icon:'', ...this.spStageColor('Delivered') },
        { key:'Lost',        thLabel:'ไม่สำเร็จ',      label:'ไม่สำเร็จ',            icon:'', ...this.spStageColor('Lost') },
      ];
    },

    // ป้ายไทยของ stage ใช้กับ badge ทุกจุด (การ์ด Kanban/การ์ด, หัวฟอร์มใบเสนอราคา, ประวัติ stage, คอลัมน์ตาราง) — เดิมโชว์ค่าดิบภาษาอังกฤษจาก DB ตรงๆ
    // ขัดกับแท็บ/หัวคอลัมน์ Kanban ที่แปลไทยไว้แล้ว (ยืนยันบั๊กจากผู้ใช้ 2026-09-21) ใช้ thLabel (สั้นกว่า label) เพราะเป็น badge พื้นที่จำกัด
    spStageLabel(stage, sourceType) {
      return this.spStagesFor(sourceType).find(s => s.key === stage)?.thLabel || stage;
    },
  },
}).mount('#app');
</script>
</body>
</html>
