    <!-- Mobile bottom nav -->
    <app-tab-bar :tabs="tabItems"></app-tab-bar>

    <app-modal ref="appModal"></app-modal>

    <!-- พบลูกค้าที่อาจซ้ำ ตอนกด "+ สร้างใหม่" ในฟอร์มดีล (กันลูกค้าซ้ำ 2026-09-28) -->
    <!-- หน้าต่างสร้างลูกค้าใหม่ แยกจากฟอร์มดีล — ข้อมูลดีลที่กรอกไว้ยังอยู่ (2026-11-02) -->
    <sp-new-customer v-if="spNewCustomer.show" :initial-name="spNewCustomer.name" :options="spCustomerOptions"
      @done="onSpNewCustomerDone" @close="spNewCustomer.show = false"></sp-new-customer>

    <!-- เพิ่มผู้ติดต่อใหม่ของลูกค้า (Quick Create) — บันทึกเข้าลูกค้าทันที แล้วติ๊กเข้าดีลให้ (2026-09-29) -->
    <div v-if="spNewContact.show" class="fixed inset-0 bg-black/50 flex items-center justify-center z-[1100] p-4" @mousedown="backdropDown = $event.target === $event.currentTarget" @click.self="backdropDown && (spNewContact.show = false)">
      <div class="bg-white rounded-2xl w-full max-w-[460px] shadow-2xl overflow-hidden">
        <div class="px-6 py-5 border-b border-slate-100">
          <h3 class="font-bold text-lg text-slate-800 m-0">เพิ่มผู้ติดต่อใหม่</h3>
          <div class="text-sm text-slate-500 mt-1">ของ {{ spForm.account_name }}</div>
        </div>
        <div class="p-5 space-y-3">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">ชื่อ <span class="text-red-500">*</span></label>
            <input v-model="spNewContact.full_name" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100 bg-white" placeholder="เช่น คุณสมชาย">
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">เบอร์โทร</label>
            <input v-model="spNewContact.phone" type="tel" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100 bg-white" placeholder="มือถือ หรือเบอร์สำนักงาน เช่น 02-963-2951">
            <p v-if="phoneInputProblem(spNewContact.phone)" class="text-sm text-amber-700 m-0 mt-1">{{ phoneInputProblem(spNewContact.phone) }}</p>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">ตำแหน่ง</label>
            <input v-model="spNewContact.position" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100 bg-white" placeholder="ไม่บังคับ">
          </div>
          <!-- ชื่อตรงผู้ติดต่อเดิมของลูกค้านี้ (API ตอบ 409 — กันซ้ำด้วยชื่อแทนเบอร์ 2026-10-23) → ใช้คนเดิม หรือยืนยันว่าคนละคน -->
          <div v-if="spNewContact.existing" class="p-3 rounded-xl bg-amber-50 ring-1 ring-amber-200 text-sm text-amber-900">
            มีผู้ติดต่อชื่อ "{{ spNewContact.existing.full_name }}"<span v-if="spNewContact.existing.phone"> ({{ formatPhone(spNewContact.existing.phone) }})</span> ในลูกค้านี้อยู่แล้ว — เป็นคนเดียวกันหรือไม่?
            <div class="flex flex-wrap gap-2 mt-2">
              <button type="button" @click="useSpExistingContact"
                class="px-3 py-1.5 rounded-lg text-sm font-semibold bg-amber-600 hover:bg-amber-700 text-white border-0 cursor-pointer">ใช่ — ใช้คนเดิม</button>
              <button type="button" @click="saveSpNewContact(true)" :disabled="spNewContact.saving"
                class="px-3 py-1.5 rounded-lg text-sm font-semibold bg-white ring-1 ring-amber-300 text-amber-800 hover:bg-amber-100 border-0 cursor-pointer">คนละคน — เพิ่มใหม่</button>
            </div>
          </div>
        </div>
        <div class="px-5 py-4 border-t border-slate-100 flex items-center justify-end gap-2">
          <button type="button" @click="spNewContact.show = false"
            class="inline-flex items-center px-4 py-2.5 rounded-xl text-[.95rem] font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer min-h-[44px]">ยกเลิก</button>
          <button type="button" @click="saveSpNewContact(false)" :disabled="spNewContact.saving"
            class="inline-flex items-center px-5 py-2.5 rounded-xl text-[.95rem] font-bold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer min-h-[44px] disabled:opacity-50">บันทึกผู้ติดต่อ</button>
        </div>
      </div>
    </div>

    <!-- MODALS -->
    <!-- คำอธิบายช่องในฟอร์มดีล (ไอคอน ⓘ ข้างชื่อช่อง — 2026-10-20) ซ้อนบนหน้าต่างฟอร์ม ปิดแล้วค่าที่กรอกยังอยู่
         ใส่เฉพาะช่องที่ความหมายยืนยันแล้ว — Fee Structure / ระดับความสำคัญ / Specialization / หมวด-แบรนด์ รอผู้ใช้ยืนยันความหมายก่อน -->
    <div v-if="spFieldHelp && spFieldHelpText[spFieldHelp]" class="fixed inset-0 bg-black/40 flex items-center justify-center z-[1100] p-4" @mousedown="backdropDown = $event.target === $event.currentTarget" @click.self="backdropDown && (spFieldHelp=null)">
      <div class="bg-white rounded-2xl w-full max-w-[520px] shadow-2xl flex flex-col overflow-hidden" style="max-height:85vh">
        <div class="px-6 py-4 flex items-center justify-between border-b border-slate-100">
          <h3 class="font-bold text-lg text-slate-800 m-0">{{ spFieldHelpText[spFieldHelp].title }}</h3>
          <button class="text-slate-400 hover:text-slate-600 bg-transparent border-0 text-2xl cursor-pointer leading-none" @click="spFieldHelp=null">×</button>
        </div>
        <div class="overflow-y-auto px-6 py-4 space-y-3 text-[.95rem] text-slate-700 leading-relaxed">
          <p v-if="spFieldHelpText[spFieldHelp].intro" class="m-0">{{ spFieldHelpText[spFieldHelp].intro }}</p>
          <!-- กติกาหลัก (กรอบเขียว) + หัว "รายละเอียด" — ใช้กับมูลค่าดีล (2026-10-30) -->
          <div v-if="spFieldHelpText[spFieldHelp].rule" class="rounded-lg bg-emerald-50 text-emerald-800 font-bold text-sm px-3 py-2">{{ spFieldHelpText[spFieldHelp].rule }}</div>
          <!-- ลำดับทั่วไปว่ามูลค่าเปลี่ยนเมื่อไร (ไม่ใช่ประวัติจริงของดีล — ดูที่แท็บประวัติ) ป้ายเทา = Sale แก้เอง / เขียว = ระบบทำให้ (2026-10-30) -->
          <div v-if="spFieldHelpText[spFieldHelp].flow">
            <div class="text-xs text-slate-500 mb-1.5">มูลค่าเปลี่ยนเมื่อไรบ้าง (ต้นจนจบ)</div>
            <div v-for="(f, fi) in spFieldHelpText[spFieldHelp].flow" :key="f[0]" class="grid grid-cols-[24px_1fr_auto] gap-2.5 items-start">
              <div class="flex flex-col items-center self-stretch">
                <div class="w-[22px] h-[22px] rounded-full text-xs font-bold flex items-center justify-center" :class="f[2] === 'ระบบ' ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600'">{{ fi + 1 }}</div>
                <div v-if="fi < spFieldHelpText[spFieldHelp].flow.length - 1" class="flex-1 w-px bg-slate-300 min-h-[10px]"></div>
              </div>
              <div class="pb-2 text-sm"><div class="font-semibold text-slate-800">{{ f[0] }}</div><div class="text-slate-500">{{ f[1] }}</div></div>
              <span class="text-xs px-2 py-0.5 rounded-full" :class="f[2] === 'ระบบ' ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600'">{{ f[2] }}</span>
            </div>
          </div>
          <div v-if="spFieldHelpText[spFieldHelp].rule && spFieldHelpText[spFieldHelp].rows.length" class="text-xs text-slate-500 -mb-2">รายละเอียด</div>
          <div v-for="r in spFieldHelpText[spFieldHelp].rows" :key="r[0]" class="grid gap-3 border-t border-slate-100" :class="spFieldHelpText[spFieldHelp].rule ? 'grid-cols-[140px_1fr] py-1.5 text-sm' : 'grid-cols-[120px_1fr] py-2'">
            <div class="font-semibold text-slate-800">{{ r[0] }}</div>
            <div>{{ r[1] }}</div>
          </div>
        </div>
        <div class="px-6 py-3 border-t border-slate-100 flex justify-end">
          <button class="px-5 py-2 rounded-xl text-sm font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer" @click="spFieldHelp=null">ปิด</button>
        </div>
      </div>
    </div>

    <!-- ดีลถูกเปลี่ยนหลังเปิดหน้าต่าง (Optimistic Locking แบบ Salesforce — ยืนยันจากผู้ใช้ 2026-10-30) — ไม่บันทึกทับ ให้โหลดข้อมูลล่าสุดก่อน
         ช่องที่ผู้ใช้แก้ไว้ (และไม่ชนกับที่เปลี่ยน) ยังอยู่หลังโหลด -->
    <div v-if="spConflict" class="fixed inset-0 bg-black/50 flex items-center justify-center z-[1100] p-4">
      <div class="bg-white rounded-2xl w-full max-w-[520px] shadow-2xl overflow-hidden">
        <div class="px-6 py-5 border-b border-slate-100">
          <h3 class="font-bold text-lg text-amber-800 m-0">⚠ ดีลนี้มีการเปลี่ยนแปลงหลังคุณเปิดหน้าต่างนี้</h3>
          <div v-if="spConflict.last_change" class="text-sm text-slate-600 mt-1">
            โดย {{ spConflict.last_change.changed_by_name || '-' }} · {{ formatDateTimeThai(spConflict.last_change.changed_at) }}
            <span v-if="spConflict.last_change.note"> — {{ spConflict.last_change.note }}</span>
          </div>
        </div>
        <div class="p-5 space-y-2 text-sm">
          <div v-for="c in spConflict.conflicts" :key="c.field" class="flex flex-wrap gap-x-2">
            <span class="font-semibold text-slate-700">{{ c.label }}:</span>
            <span class="text-slate-500">{{ spConflictValue(c.field, c.opened) }}</span> →
            <span class="font-bold text-slate-800">{{ spConflictValue(c.field, c.current) }}</span>
          </div>
          <p class="m-0 pt-2 text-slate-600">ยังไม่ได้บันทึก เพื่อไม่ให้ทับข้อมูลใหม่ — กด <b>โหลดข้อมูลล่าสุด</b> แล้วตรวจ / แก้อีกครั้ง (ช่องอื่นที่คุณแก้ไว้ยังอยู่)</p>
        </div>
        <div class="px-5 py-4 border-t border-slate-100 flex justify-end gap-2">
          <button type="button" @click="spConflict = null" class="inline-flex items-center px-4 py-2.5 rounded-xl text-[.95rem] font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer min-h-[44px]">ยกเลิก</button>
          <button type="button" @click="reloadSpFormAfterConflict" class="inline-flex items-center px-5 py-2.5 rounded-xl text-[.95rem] font-bold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer min-h-[44px]">โหลดข้อมูลล่าสุด</button>
        </div>
      </div>
    </div>

    <!-- SP: Add / Edit Deal Modal -->
    <div v-if="modal.type==='sp-form'" class="fixed inset-0 bg-black/50 flex items-stretch sm:items-center justify-center z-[1000] p-0 sm:p-4" @mousedown="backdropDown = $event.target === $event.currentTarget" @click.self="backdropDown && (!spFormSaving && closeModal())">
      <!-- กว้าง 896px (max-w-4xl) เท่ากับหน้าต่างรายละเอียดงานประมูล/งานที่ได้รับ (ยืนยันจากผู้ใช้ 2026-10-14 — เดิม 800px, ก่อนนั้น 560px) มือถือยังเต็มจอเหมือนเดิม -->
      <!-- ความกว้าง (2026-10-20 ลองแล้ว: 672px แคบไป / 896px กว้างไป) → สร้างดีลใหม่ 768px (max-w-3xl)
           ดีลเดิม (มีหัวสรุป + แท็บ) คง 896px ให้เท่าหน้าต่างรายละเอียดงานประมูล -->
      <div class="bg-white sm:rounded-2xl w-full h-full sm:h-auto sm:max-h-[92vh] shadow-2xl flex flex-col overflow-hidden" :class="spForm.id ? 'max-w-4xl' : 'max-w-3xl'">
        <!-- หัวสรุปอยู่กับที่ (Highlights Panel — จัดหน้าแบบ Record Page ยืนยันจากผู้ใช้ 2026-10-14): รหัส/สถานะ/ประเภทดีล/ชื่องาน/ลูกค้า/Sale + กล่องตัวเลข 4 กล่อง
             ค่าในหัวอ่านจากที่บันทึกไว้ (modal.data) ไม่ใช่ค่าที่กำลังแก้ในฟอร์ม / ดีลใหม่ (ยังไม่มีรหัส) แสดงแค่หัวข้อ ไม่มีกล่องตัวเลขและแท็บ -->
        <div class="px-6 pt-4 pb-3 border-b border-slate-100 shrink-0">
          <div class="flex items-start gap-2">
            <div class="min-w-0 flex-1">
              <h3 v-if="!spForm.id" class="font-bold text-lg text-slate-800 m-0">สร้างงาน/ดีลใหม่</h3>
              <div v-else class="flex flex-wrap items-center gap-1.5">
                <span v-if="spForm.project_code" class="text-xs font-mono font-bold text-purple-700 bg-purple-50 rounded-full px-2.5 py-1">{{ spForm.project_code }}</span>
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold" :style="spStageClass(modal.data?.stage || spForm.stage)">{{ spStageLabel(modal.data?.stage || spForm.stage, spForm.source_type) }}</span>
                <span v-if="modal.data?.deal_type_id && modal.data.deal_type_id !== 'normal'" class="px-2.5 py-1 rounded-full text-xs font-bold bg-fuchsia-100 text-fuchsia-700">{{ modal.data.deal_type_name }}</span>
              </div>
            </div>
            <button class="text-slate-400 hover:text-slate-600 bg-transparent border-0 text-2xl cursor-pointer leading-none shrink-0 disabled:cursor-default" :disabled="spFormSaving" @click="closeModal">×</button>
          </div>
          <template v-if="spForm.id && modal.data">
            <h3 v-if="modal.data.title" class="font-bold text-lg text-slate-800 mt-2 mb-0 leading-snug line-clamp-2">{{ modal.data.title }}</h3>
            <!-- ดีลเก่าที่มีแค่ชื่อพิมพ์ไว้ (client_name) ยังไม่ผูกลูกค้าในระบบ → ป้ายส้ม "ยังไม่ผูกลูกค้า" ไม่ให้เข้าใจว่าผูกแล้ว (ยืนยันจากผู้ใช้ 2026-10-14) -->
            <div class="text-sm text-slate-500 mt-0.5 flex flex-wrap items-center gap-x-1.5 gap-y-1">
              <template v-if="modal.data.account_id">{{ modal.data.account_name }}</template>
              <template v-else>
                <span v-if="modal.data.client_name">{{ modal.data.client_name }}</span>
                <span class="px-2 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800">ยังไม่ผูกลูกค้า</span>
              </template>
              <span>· Sale: <span class="text-slate-700">{{ modal.data.sale_name }}</span></span>
            </div>
            <!-- คู่แข่งที่บันทึกไว้ / แพ้ให้ใคร / ใบเสนอราคาเก่าที่นำเข้า -->
            <div v-if="modal.data.stage==='Lost' && modal.data.winner_name" class="text-sm text-rose-700 mt-1">
              แพ้ให้: <span class="font-semibold">{{ modal.data.winner_name }}</span><span v-if="modal.data.winning_price"> · {{ formatPrice(modal.data.winning_price) }}</span>
              <span v-if="spPriceGapText(modal.data.value, modal.data.winning_price)" class="text-xs"> ({{ spPriceGapText(modal.data.value, modal.data.winning_price) }})</span>
            </div>
            <div v-if="spSavedCompetitors.length" class="text-sm text-slate-500 mt-1">
              คู่แข่ง: <span class="font-semibold text-slate-700">{{ spSavedCompetitors.map(c => c.competitor_name).join(', ') }}</span>
            </div>
            <!-- เลขที่ใบเสนอราคา — แสดงเฉพาะงานที่นำเข้าจากใบเสนอราคาเก่า (แกะจากข้อความใน notes) -->
            <div v-if="spHistoryQuotationId" class="text-sm text-slate-500 mt-1">
              ใบเสนอราคาเดิม:
              <button type="button" @click="openSpQuotationDetail(spHistoryQuotationId)" :disabled="spQuotationLoading"
                class="font-mono font-bold text-sm underline underline-offset-2 bg-transparent border-0 p-0 cursor-pointer text-sky-700 hover:text-sky-600 disabled:opacity-50">{{ spHistoryQuotationId }}</button>
            </div>
            <!-- กล่องตัวเลข: มูลค่า / โอกาสปิด / นัดติดตาม (ถึงวัน = ส้ม, เลยวัน = แดง) / ใบเสนอราคา (กดแล้วไปแท็บใบเสนอราคา) -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-3">
              <div class="rounded-xl bg-slate-50 px-3 py-2"><div class="flex items-center gap-1 text-xs text-slate-500">มูลค่า <button type="button" @click.prevent="spFieldHelp='value'" class="inline-flex items-center justify-center w-5 h-5 -my-1 bg-transparent border-0 p-0 rounded-full cursor-pointer text-slate-400 hover:text-teal-700 hover:bg-teal-50" title="มูลค่านี้มาจากไหน" aria-label="คำอธิบายช่อง มูลค่าดีล"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="11"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button></div><div class="font-bold text-emerald-700">{{ modal.data.value ? formatNumber(modal.data.value) : '-' }}</div></div>
                <!-- หมายเหตุ "มูลค่าดีล: รวมยอดก่อน VAT…" เอาออก (2026-10-30) — คำอธิบายอยู่ในไอคอน ⓘ ข้างคำว่ามูลค่าแล้ว -->
              <div class="rounded-xl bg-slate-50 px-3 py-2"><div class="text-xs text-slate-500">โอกาสปิด</div><div class="font-bold text-slate-800">{{ modal.data.win_probability != null ? Math.round(modal.data.win_probability * 100) + '%' : '-' }}</div></div>
              <div class="rounded-xl px-3 py-2" :class="spHeadFollowup.cls">
                <div class="text-xs opacity-80">นัดติดตาม</div>
                <div class="font-bold">{{ spHeadFollowup.text }}</div>
              </div>
              <button type="button" @click="spFormTab = 'quote'" class="rounded-xl px-3 py-2 text-left border-0 cursor-pointer hover:brightness-95" :class="spQuoteSummary?.cls || 'bg-slate-50 text-slate-600'">
                <div class="text-xs opacity-80">ใบเสนอราคา</div>
                <div class="font-bold truncate">{{ spQuoteSummary?.short || '…' }}</div>
              </button>
            </div>
          </template>
        </div>
        <!-- แท็บ (เฉพาะดีลที่บันทึกแล้ว) — ใช้ v-show ค่าที่กำลังแก้ในฟอร์มไม่หายตอนสลับแท็บ / ปุ่มบันทึกด้านล่างบันทึกเฉพาะแท็บข้อมูลดีล -->
        <app-record-tabs v-if="spForm.id" v-model="spFormTab"
          :tabs="[{ key: 'deal', label: 'รายละเอียดดีล' }, { key: 'quote', label: 'ใบเสนอราคา', count: spQuoteSummary?.count }, { key: 'files', label: 'ไฟล์', count: spFileCount }, { key: 'history', label: 'ประวัติ' }]"></app-record-tabs>
        <!-- ระหว่างบันทึก: ล็อกทั้งฟอร์ม (แก้ไม่ได้) กันแก้ข้อมูลระหว่างส่ง — แบบ ค. ยืนยันจากผู้ใช้ 2026-10-23
             ไม่ทำสีจาง / ไม่ใช้เคอร์เซอร์รอ — ผู้ใช้บอกดูเหมือนโปรแกรมค้าง ให้หน้าตาปกติ แค่กดไม่ได้ -->
        <!-- ดีลใหม่กรอกทีละขั้น ไม่ให้ Sale รู้สึกว่าฟอร์มยาว ช่องบังคับเท่าเดิม (Stepper — ยืนยันจากผู้ใช้ 2026-11-02) / แก้ดีลเดิมยังเป็นหน้าเดียว -->
        <div v-if="!spForm.id" class="px-3 sm:px-5 pt-3">
          <div class="text-sm font-semibold text-slate-600">ขั้น {{ spWizardStep }} จาก 9 · {{ spWizardTitles[spWizardStep - 1] }}</div>
          <div class="grid grid-cols-9 gap-1 mt-1.5" aria-hidden="true">
            <span v-for="n in 9" :key="n" class="h-1.5 rounded-full" :class="n <= spWizardStep ? 'bg-teal-600' : 'bg-slate-200'"></span>
          </div>
        </div>
        <div ref="spFormBody" class="flex-1 overflow-y-auto p-3 sm:p-5" :class="spFormSaving ? 'pointer-events-none select-none' : ''" :aria-busy="spFormSaving">
          <!-- ═══ แท็บ รายละเอียดดีล ═══ (ไม่ใช้ชื่อ "ข้อมูลดีล" เพราะซ้ำกับกล่อง ② — 2026-10-14) (ดีลใหม่แสดงส่วนนี้อย่างเดียว) -->
          <div v-show="!spForm.id || spFormTab === 'deal'">

          <!-- ใบเสนอราคาเก่าที่นำเข้า ยังรอตรวจ (ยืนยันจากผู้ใช้ 2026-09-30) — ตรวจแล้ว = เลื่อนสถานะ / ลบ / กดยืนยันว่ายังเป็นใบเสนอราคา
               กดบันทึกฟอร์มเฉยๆ ไม่นับ เพื่อแยกดีลที่ยังเป็น PI จริง ออกจากดีลที่ยังไม่มีใครดู -->
          <!-- กล่องกระชับ: หัวข้อ + คำอธิบายบรรทัดเดียว ปุ่มชิดขวา (ปรับตามผู้ใช้ 2026-09-30 — เดิมใหญ่/กว้างเกิน) -->
          <div v-if="spImportReviewBox" class="mb-4 rounded-xl bg-amber-50 border border-amber-200 px-4 py-3 flex flex-wrap items-center gap-x-4 gap-y-2">
            <div class="flex-1 min-w-[240px]">
              <div class="text-sm font-bold text-amber-900">ใบเสนอราคาเก่าที่นำเข้า — รอตรวจ</div>
              <div class="text-sm text-slate-600">ตรวจว่าตอนนี้ดีลนี้อยู่สถานะไหน แล้วเลือกบอกระบบ</div>
            </div>
            <button type="button" @click="openSpImportReview(modal.data)"
              class="shrink-0 px-3 py-2 rounded-lg text-sm font-bold text-white bg-teal-700 hover:bg-teal-800 border-0 cursor-pointer"><svg class="inline-block w-4 h-4 -mt-0.5 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4"/><path d="M14 3v5h5"/><path d="M19 8v3"/><circle cx="16.5" cy="16.5" r="3"/><path d="m21 21-2.4-2.4"/></svg>ตรวจดีลนี้</button>
          </div>

          <!-- ฟอร์มแบ่งเป็นกล่องมีเลขลำดับ 1–5 ตามคำถามที่ Sale ตอบทีละข้อ: ใคร (ลูกค้า) → ขายอะไร → ที่มาและสถานะ → มูลค่าและคู่แข่ง → แผนติดตาม
               (จัดใหม่ 2026-10-30 — เดิม 2026-09-23: ลูกค้า → ดีล → ประเภท/มูลค่า → สินค้า → แผนติดตาม)
               ประเภท/กลุ่มลูกค้าอยู่ใต้ลูกค้าในกล่อง 1 (ดึงจากลูกค้า) / ประเภทดีลอยู่ก่อนมูลค่า-โอกาส-วันคาดปิด เพราะเป็นตัวกำหนดตัวเลขเหล่านั้น
               ป้ายชื่อทุกช่องขนาดเดียวกัน, ปุ่มเลือกทุกชุดหน้าตาเดียวกัน (สี teal ตอนเลือก), ช่องสั้นวางคู่กันบนจอกว้าง / คอลัมน์เดียวบนมือถือ -->

          <!-- 1 ลูกค้า -->
          <section v-show="spStepVisible(1)" class="mb-4 rounded-2xl border border-slate-200 bg-slate-50/60 p-3 sm:p-4 space-y-3">
            <div class="flex items-center gap-2 pb-2 border-b border-slate-200">
              <span class="w-7 h-7 rounded-full bg-teal-600 text-white text-sm font-bold flex items-center justify-center shrink-0">1</span>
              <h3 class="text-base font-bold text-slate-800">ข้อมูลลูกค้าในดีลการขายครั้งนี้</h3>
            </div>
            <!-- การ์ด ลูกค้า (ผู้ซื้อ / ผู้จ่ายเงิน) — ขั้น 1 แยก 3 การ์ด: ลูกค้า / ดีลนี้ขายแบบไหน / ผู้ติดต่อในดีลนี้ (ยืนยัน mockup จากผู้ใช้ 2026-11-20) -->
            <div class="rounded-xl bg-white border border-slate-200 px-3 sm:px-4 py-3">
              <div class="flex items-center gap-1.5 text-sm font-bold text-slate-700 pb-2 mb-3 border-b border-slate-100">ชื่อลูกค้า (ผู้ซื้อ / ผู้จ่ายเงิน) <span v-if="!spForm.id" class="text-red-500">*</span> <button type="button" @click.prevent="spFieldHelp='customer'" class="inline-flex items-center justify-center w-5 h-5 -my-1 bg-transparent border-0 p-0 rounded-full cursor-pointer text-slate-400 hover:text-teal-700 hover:bg-teal-50" title="ส่วนนี้คืออะไร" aria-label="คำอธิบาย ลูกค้า"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="11"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button></div>
              <!-- ดีลนำเข้าย้อนหลังที่ยังไม่ผูกลูกค้า (มีแค่ชื่อพิมพ์ไว้) — บอกให้ Sale ผูก + ปุ่มค้นหาชื่อเดิมให้ทันที (ยืนยันจากผู้ใช้ 2026-10-14) / ดีลใหม่บังคับเลือกลูกค้าอยู่แล้ว -->
              <div v-if="spForm.id && !spForm.account_id && !modal.data?.account_id" class="mb-3 rounded-xl bg-amber-50 border border-amber-200 px-4 py-3 flex flex-wrap items-center gap-x-4 gap-y-2">
                <div class="flex-1 min-w-[220px]">
                  <div class="text-sm font-bold text-amber-900">ยังไม่ผูกลูกค้าในระบบ</div>
                  <div class="text-sm text-slate-600"><template v-if="modal.data?.client_name">ชื่อที่พิมพ์ไว้เดิม: <b class="text-slate-800">{{ modal.data.client_name }}</b> — </template>ค้นหาแล้วเลือกลูกค้า จากนั้นกดบันทึก</div>
                </div>
                <button v-if="modal.data?.client_name" type="button" @click="searchSpAccountByClientName"
                  class="shrink-0 px-3 py-2 rounded-lg text-sm font-bold text-white bg-teal-700 hover:bg-teal-800 border-0 cursor-pointer">ค้นหาชื่อนี้</button>
              </div>
              <!-- ลูกค้า = ผู้ซื้อ / ผู้จ่ายเงิน (คนที่ Taiyo เปิดบิล) — ลูกค้าเดิมกดเลือกที่นี่ / ลูกค้าใหม่สร้างในหน้าต่างแยก
                   เลือกแล้ว ส่วน "ดีลนี้ขายแบบไหน" ด้านล่างตั้งต้นค่าจากบทบาทของลูกค้า แล้วปรับได้ต่อดีล (ยืนยันจากผู้ใช้ 2026-11-20) -->

              <!-- เลือกลูกค้าแล้ว — จัดเป็นแถว (แบบ ก — ผู้ใช้เลือก 2026-11-26 เหมาะทั้งมือถือและ PC: เพิ่มความสูงน้อย ชื่อเด่น ปุ่มมีข้อความ)
                   บรรทัด 1 ชื่อลูกค้า + ป้ายประเภท / บทบาท · บรรทัด 2 รหัสลูกค้า AC-… (กดเปิดรายละเอียดลูกค้าในแท็บใหม่) + รหัส ERP ที่ผูกไว้ (ทุก role เห็น)
                   แถวล่าง ปุ่ม "เปลี่ยนลูกค้า" (เดิมเป็น ✕) / ดีลที่ล็อกลูกค้า = กุญแจ + เหตุผล -->
              <div v-if="spForm.account_id" class="border border-slate-200 rounded-xl px-3.5 py-3 bg-slate-50">
                <div class="flex flex-wrap items-center gap-x-2 gap-y-1">
                  <span class="text-base font-bold text-slate-800 break-words min-w-0">{{ spForm.account_name }}</span>
                  <span v-if="!spForm.account_is_intermediary" class="text-xs font-bold px-2 py-0.5 rounded-full shrink-0" :class="spAccountTypeBadgeClass(spForm.account_type)">{{ spAccountTypeLabel(spForm.account_type) }}</span>
                  <span v-if="spForm.account_role_name" class="text-xs font-bold px-2 py-0.5 rounded-full shrink-0" :class="spForm.account_is_intermediary ? 'bg-orange-100 text-orange-800' : 'bg-slate-100 text-slate-600'">{{ spForm.account_is_intermediary ? 'คนกลาง — ' : '' }}{{ spForm.account_role_name }}</span>
                </div>
                <!-- ป้าย AC มีกรอบ = กดได้ / รหัส ERP ตัวอักษรธรรมดา = ข้อมูลให้อ่าน / ยังไม่รู้รหัส ERP (เลือกจากลูกค้าล่าสุด ยังไม่บันทึก) = ไม่แสดงส่วน ERP -->
                <!-- ดีลที่ไม่ล็อก: ปุ่ม "เปลี่ยนลูกค้า" อยู่ท้ายบรรทัดรหัส ไม่แยกแถว (เดิมแยกแถว มีเส้นคั่น เว้นที่ว่างมากเกิน — ผู้ใช้ทัก 2026-11-26) / มือถือ: ปุ่มลงบรรทัดใหม่เต็มความกว้าง -->
                <div class="flex flex-wrap items-center gap-x-4 gap-y-1.5 mt-2 text-sm text-slate-600">
                  <span v-if="spForm.account_code" class="inline-flex flex-wrap items-center gap-1.5"><span class="whitespace-nowrap">รหัสลูกค้า</span>
                    <a :href="'accounts.html?account_id=' + spForm.account_id" target="_blank" rel="noopener" title="เปิดรายละเอียดลูกค้าในแท็บใหม่"
                      class="inline-flex items-center gap-1 px-2 py-0.5 rounded-lg ring-1 ring-teal-300 bg-teal-50 text-teal-800 font-mono text-sm font-semibold no-underline hover:bg-teal-100 whitespace-nowrap">
                      {{ spForm.account_code }}
                      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                    </a>
                  </span>
                  <template v-if="spForm.account_code && spForm.account_erp_codes !== null">
                    <span v-if="spForm.account_erp_codes">รหัส ERP <span class="font-mono text-slate-800 font-semibold">{{ spForm.account_erp_codes }}</span></span>
                    <span v-else class="text-slate-400">ยังไม่มีรหัส ERP</span>
                  </template>
                  <button v-if="!isViewer && !spAccountLocked" type="button" @click="onRemoveSpAccountClick"
                    class="w-full sm:w-auto sm:ml-auto px-3 py-1.5 rounded-lg text-sm font-semibold bg-white ring-1 ring-teal-400 text-teal-700 hover:bg-teal-50 border-0 cursor-pointer">เปลี่ยนลูกค้า</button>
                </div>
                <!-- แถวล่าง: เปลี่ยนลูกค้า / ล็อกลูกค้า (ดีลมีคำขอ / ออกใบเสนอราคาแล้ว — กฎ Taiyo ยืนยันจากผู้ใช้ 2026-11-26)
                     Sale + หัวหน้า: กุญแจ + เหตุผล ไม่มีปุ่ม · ธุรการ + admin: มีปุ่ม กดแล้วต้องยืนยัน · ผู้บริหาร (ดูอย่างเดียว) ไม่มีแถวนี้ -->
                <div v-if="!isViewer && spAccountLocked" class="flex flex-wrap items-center gap-x-3 gap-y-1.5 mt-2 pt-2 border-t border-slate-200">
                  <svg class="w-4 h-4 text-slate-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="ล็อกลูกค้า"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                  <span class="flex-1 min-w-[180px] text-sm text-slate-500">{{ spCanOverrideAccountLock
                    ? 'ดีลนี้มีคำขอหรือใบเสนอราคาแล้ว — Sale เปลี่ยนลูกค้าไม่ได้'
                    : 'เปลี่ยนลูกค้าไม่ได้ เพราะดีลนี้มีคำขอหรือใบเสนอราคาแล้ว ถ้าต้องเปลี่ยน แจ้งธุรการขาย' }}</span>
                  <button v-if="spCanOverrideAccountLock" type="button" @click="onRemoveSpAccountClick"
                    class="w-full sm:w-auto px-3 py-1.5 rounded-lg text-sm font-semibold bg-white ring-1 ring-teal-400 text-teal-700 hover:bg-teal-50 border-0 cursor-pointer">เปลี่ยนลูกค้า</button>
                </div>
              </div>
              <!-- ลูกค้ามี Sale คนอื่นดูแล — แจ้งให้รู้ ไม่บล็อก (Account Owner — ยืนยันจากผู้ใช้ 2026-09-30) -->
              <p v-if="spAccountOwnedByOther" class="mt-1.5 mb-0 text-sm text-amber-700">
                ลูกค้ารายนี้มี <b>{{ spForm.account_owner_name }}</b> ดูแลอยู่ — สร้างดีลได้ แต่ควรแจ้งหรือคุยกันก่อน
              </p>

              <!-- ยังไม่ได้เลือก: ช่องค้นหา + รายการวางในหน้า (Inline results — ยืนยันจากผู้ใช้ 2026-10-30)
                   เดิมเป็นกล่องลอยทับฟอร์ม มีแถบเลื่อนของตัวเอง ปิดไม่ได้ถ้าไม่เลือก เลื่อนเมาส์แล้วงงว่าเลื่อนอะไร และ Sale พิมพ์ชื่อแล้วคิดว่าเสร็จ
                   ตอนนี้: รายการดันเนื้อหาด้านล่างลง ไม่เกิน 3 ราย (ลดจาก 5 — 2026-11-23 ให้เห็นปุ่มสร้างลูกค้าใหม่โดยไม่ต้องเลื่อน) ไม่มีแถบเลื่อน ปุ่ม "เลือก" ทุกแถว / พิมพ์แล้วไม่เลือก = เตือนใต้ช่องทันที
                   ยังไม่พิมพ์ = ลูกค้าล่าสุด (Recent Items 2026-09-29) / พิมพ์ = ค้นหาแบบยืดหยุ่น (2026-09-29) -->
              <div v-if="!spForm.account_id">
                <input v-model="spAccountQuery" @input="searchSpAccounts" @focus="openSpAccountDropdown" @click="openSpAccountDropdown"
                  class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white"
                  placeholder="ค้นหาชื่อ / รหัสลูกค้า / ERP">
                <div v-if="spAccountDropdownOpen" class="mt-1.5">
                  <div class="text-xs font-bold text-slate-500 mb-1">
                    <template v-if="!spAccountQuery.trim()">{{ currentUser?.role === 'sale' ? 'ลูกค้าที่คุณเพิ่งทำดีลด้วย' : 'ลูกค้าที่มีดีลล่าสุด' }}</template>
                    <template v-else-if="spAccountResults.length">พบ {{ spAccountResults.length }}{{ spAccountResults.length >= 10 ? '+' : '' }} ราย — กดชื่อลูกค้าเพื่อเลือก</template>
                  </div>
                  <div v-if="spAccountQuery.trim() && !spAccountResults.length" class="text-sm text-slate-400 py-1">ไม่พบลูกค้าที่ชื่อใกล้เคียง</div>
                  <div class="space-y-1.5">
                    <!-- กดทั้งแถวเพื่อเลือก (ปุ่มใหญ่ เหมาะกับนิ้วบนมือถือ) / ชื่อใช้ความกว้างเต็มแถว / ป้ายประเภทอยู่บรรทัดที่ 2 / ผู้ดูแลแสดงเฉพาะเมื่อมี Sale ดูแล -->
                    <button v-for="a in spAccountResults.slice(0, 3)" :key="a.id" type="button" @click="selectSpAccount(a)"
                      class="w-full flex items-center gap-2 border border-slate-200 rounded-xl px-3 py-2.5 bg-white hover:border-teal-400 hover:bg-teal-50/40 cursor-pointer text-left">
                      <span class="flex-1 min-w-0">
                        <span class="block text-sm font-semibold text-slate-800 leading-snug">{{ a.name }}</span>
                        <span class="flex flex-wrap items-center gap-x-1.5 gap-y-0.5 mt-0.5 text-xs text-slate-500">
                          <span v-if="a.account_code" class="font-mono text-teal-700">{{ a.account_code }}</span>
                          <span v-if="Number(a.is_intermediary) !== 1" class="text-[11px] font-bold px-2 py-0.5 rounded-full" :class="spAccountTypeBadgeClass(a.account_type)">{{ spAccountTypeLabel(a.account_type) }}</span>
                          <span v-else class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-orange-100 text-orange-800">{{ a.customer_role_name }}</span>
                          <span v-if="a.owner_name">· ดูแล: {{ a.owner_name }}</span>
                        </span>
                      </span>
                      <svg class="w-5 h-5 text-slate-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
                    </button>
                  </div>
                  <div v-if="spAccountResults.length > 3" class="text-xs text-slate-500 mt-1">แสดง 3 รายแรก — พิมพ์ชื่อเพิ่มเพื่อหาให้แคบลง</div>
                  <button type="button" @click="openSpAccountCreatePanel"
                    class="mt-1.5 block w-full text-left px-3 py-2 rounded-xl text-sm font-semibold text-teal-700 bg-transparent border border-dashed border-teal-300 hover:bg-teal-50 cursor-pointer">
                    + ไม่มีในรายการ — สร้างลูกค้าใหม่{{ spAccountQuery.trim() ? ' "' + spAccountQuery.trim() + '"' : '' }}
                  </button>
                </div>
                <!-- พิมพ์ชื่อแล้วยังไม่เลือก — เตือนทันที ไม่รอตอนกดบันทึก (Lookup มาตรฐาน CRM) -->
                <p v-if="spAccountQuery.trim()" class="mt-1.5 mb-0 text-sm font-semibold text-amber-700">ยังไม่ได้เลือกลูกค้า — กดชื่อลูกค้าในรายการ หรือสร้างลูกค้าใหม่</p>
              </div>

            </div>

            <!-- ขั้น 1 = "ใคร": ลูกค้า → ผู้ติดต่อในดีลนี้ / ดีลนี้ขายแบบไหน แยกไปขั้น 2 (ยืนยันจากผู้ใช้ 2026-11-23)
                 "ใคร" ก่อน "ขายแบบไหน" — ผู้ติดต่อเป็นของลูกค้า / ขายแบบไหนระบบตั้งต้นจากลูกค้าแล้ว Sale แค่ตรวจ + เลือกตลาด / การ์ดไม่ใส่เลข กันซ้ำกับชิปข้อ 1–3 -->
            <!-- ผู้ติดต่อในดีลนี้ (Opportunity Contact Roles — ยืนยันจากผู้ใช้ 2026-09-28)
                 ผู้ติดต่อยังอยู่ที่ลูกค้า / ดีลติ๊กเลือกว่าใครเกี่ยวข้อง + บทบาท + คนหลัก 1 คน — ดีลใหม่ต้องมีอย่างน้อย 1 คน, ดีลเก่าไม่บังคับ
                 ใช้ติ๊กและปุ่มกด ไม่มีลากวาง (ผู้ใช้วัย 50-60) -->
            <div v-if="spForm.account_id" class="rounded-xl bg-white border border-slate-200 px-3 sm:px-4 py-3">
              <div class="flex items-center gap-1.5 text-sm font-bold text-slate-700 pb-2 mb-3 border-b border-slate-100">ผู้ติดต่อในดีลนี้ <span v-if="!spForm.id" class="text-red-500">*</span> <button type="button" @click.prevent="spFieldHelp='dealcontacts'" class="inline-flex items-center justify-center w-5 h-5 -my-1 bg-transparent border-0 p-0 rounded-full cursor-pointer text-slate-400 hover:text-teal-700 hover:bg-teal-50" title="ส่วนนี้คืออะไร" aria-label="คำอธิบาย ผู้ติดต่อในดีลนี้"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="11"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button>
                <button v-if="!isViewer" type="button" @click="openSpNewContact" class="ml-auto text-sm font-semibold text-teal-700 bg-transparent border-0 cursor-pointer">+ เพิ่มผู้ติดต่อใหม่</button>
              </div>
              <!-- วิธีเลือก 3 ขั้น (ติ๊กคน → บทบาท → คนหลักในดีล) เดิมเป็นกล่องเหนือตาราง ย้ายเข้าไอคอน ⓘ ที่หัวการ์ด (ยืนยันจากผู้ใช้ 2026-11-20) -->
              <!-- ผู้ติดต่อของลูกค้า (บันทึกแล้วทุกคน) — ติ๊กคนที่อยู่ในดีล → บทบาท + คนหลัก
                   ผู้ติดต่อใหม่เพิ่มผ่านหน้าต่าง "เพิ่มผู้ติดต่อใหม่" ซึ่งบันทึกเข้าลูกค้าทันที แล้วขึ้นในรายการนี้แบบติ๊กไว้ให้ (Quick Create — 2026-09-29)
                   จอกว้าง = ตารางแถวละคน + แถบสรุปคนที่เลือก / มือถือ = การ์ดทีละคน (ยืนยันจากผู้ใช้ 2026-09-29 — ผู้ติดต่อหลายคนต้องเห็นชัด) -->
              <div v-if="spSelectedContactCount" class="mb-2 px-3 py-2 rounded-lg bg-white ring-1 ring-teal-300 text-sm">
                <span class="font-bold text-teal-800">เลือกแล้ว {{ spSelectedContactCount }} คน:</span>
                <span v-for="(c, i) in spSelectedContactsOrdered" :key="'sum' + c.key" class="text-slate-700 ml-1">
                  <span v-if="i" class="text-slate-300"> · </span>
                  <span :class="c.is_primary ? 'font-bold text-teal-800' : ''">{{ c.is_primary ? '★ ' : '' }}{{ c.full_name }}</span>
                  <span class="text-slate-500"> ({{ spRoleName(c.contact_role_id) }})</span>
                </span>
              </div>

              <!-- จอกว้าง: ตาราง — คลิกที่ไหนในแถวก็ติ๊กได้ -->
              <div v-if="spContactRows.length" class="hidden sm:block mb-2 rounded-xl ring-1 ring-slate-200 overflow-hidden bg-white">
                <table class="w-full border-collapse text-sm">
                  <thead>
                    <tr class="bg-slate-50 text-slate-500 text-xs font-bold">
                      <th class="w-10 px-3 py-2 text-center">เลือก</th>
                      <th class="px-2 py-2 text-left">ชื่อ</th>
                      <th class="px-2 py-2 text-left">เบอร์</th>
                      <th class="px-2 py-2 text-left">ตำแหน่ง</th>
                      <th class="px-2 py-2 text-left w-[190px]">บทบาทในดีล</th>
                      <th class="px-3 py-2 text-center w-[110px]">คนหลักในดีล</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr v-for="c in spContactRows" :key="'t' + c.key" @click="toggleSpContact(c)"
                      class="border-t border-slate-100 cursor-pointer" :class="c.selected ? 'bg-teal-50' : 'hover:bg-slate-50'">
                      <td class="px-3 py-2.5 text-center">
                        <input type="checkbox" :checked="c.selected" @click.stop="toggleSpContact(c)" class="accent-teal-600 w-5 h-5 align-middle cursor-pointer">
                      </td>
                      <td class="px-2 py-2.5">
                        <span class="font-semibold text-slate-800">{{ c.full_name }}</span>
                        <span v-if="c.just_added" class="ml-1.5 text-xs px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700 font-semibold">เพิ่งเพิ่ม</span>
                      </td>
                      <td class="px-2 py-2.5 text-slate-600 whitespace-nowrap">{{ formatPhone(c.phone) || '-' }}</td>
                      <td class="px-2 py-2.5 text-slate-600">{{ c.position || '-' }}</td>
                      <td class="px-2 py-2">
                        <select v-if="c.selected" v-model="c.contact_role_id" @click.stop class="w-full border border-slate-300 rounded-lg px-2.5 py-2 text-sm bg-white">
                        <option value="">ไม่ระบุ</option>
                        <option v-for="r in spActiveContactRoles" :key="r.contact_role_id" :value="r.contact_role_id">{{ r.contact_role_name }}</option>
                      </select>
                        <span v-if="!c.selected" class="text-slate-300">—</span>
                      </td>
                      <td class="px-3 py-2 text-center" @click.stop>
                        <template v-if="c.selected">
                          <span v-if="spSelectedContactCount === 1" class="text-xs font-semibold text-teal-700 whitespace-nowrap">★ อัตโนมัติ</span>
                          <input v-else type="radio" name="sp-primary-contact-t" :checked="c.is_primary" @change="setSpPrimaryContact(c)" class="accent-teal-600 w-5 h-5 cursor-pointer">
                        </template>
                        <span v-else class="text-slate-300">—</span>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <!-- มือถือ: การ์ดทีละคน -->
              <div v-for="c in spContactRows" :key="'m' + c.key"
                class="sm:hidden mb-2 rounded-xl border p-3" :class="c.selected ? 'border-teal-400 bg-teal-50/60' : 'border-slate-200 bg-white'">
                <label class="flex items-center gap-2.5 cursor-pointer">
                  <input type="checkbox" :checked="c.selected" @change="toggleSpContact(c)" class="accent-teal-600 w-5 h-5 shrink-0">
                  <span class="min-w-0">
                    <span class="font-semibold text-slate-800">{{ c.full_name }}</span>
                    <span v-if="c.just_added" class="ml-1.5 text-xs px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700 font-semibold">เพิ่งเพิ่ม</span>
                    <span class="block text-sm text-slate-500">{{ formatPhone(c.phone) }}<span v-if="c.position"> · ตำแหน่ง {{ c.position }}</span></span>
                  </span>
                </label>
                <div v-if="c.selected" class="flex items-center gap-2 flex-wrap mt-2.5 pt-2.5 border-t border-teal-100">
                  <span class="text-xs font-semibold text-slate-600">บทบาทในดีล</span>
                  <select v-model="c.contact_role_id" class="flex-1 min-w-[150px] border border-slate-300 rounded-lg px-2.5 py-2 text-sm bg-white">
                        <option value="">ไม่ระบุ</option>
                        <option v-for="r in spActiveContactRoles" :key="r.contact_role_id" :value="r.contact_role_id">{{ r.contact_role_name }}</option>
                      </select>
                  <span v-if="spSelectedContactCount === 1" class="shrink-0 text-sm font-semibold text-teal-700">★ คนหลักในดีล (อัตโนมัติ)</span>
                  <label v-else class="shrink-0 inline-flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-semibold cursor-pointer ring-1"
                    :class="c.is_primary ? 'ring-teal-400 bg-white text-teal-700' : 'ring-slate-200 bg-white text-slate-500'">
                    <input type="radio" name="sp-primary-contact-m" :checked="c.is_primary" @change="setSpPrimaryContact(c)" class="accent-teal-600 w-4 h-4">
                    คนหลักในดีล
                  </label>
                </div>
              </div>
              <p v-if="!spContactRows.length" class="text-sm text-slate-400 m-0 mb-2">ลูกค้ารายนี้ยังไม่มีผู้ติดต่อ — กด "+ เพิ่มผู้ติดต่อใหม่"</p>
            </div>

          </section>

          <!-- 2 ดีลนี้ขายแบบไหน — แยกจากขั้น 1 เป็นขั้นของตัวเอง (ยืนยันจากผู้ใช้ 2026-11-23: 1 ขั้น = 1 เรื่อง, ขั้น 1 ยาวเกิน)
               ค่าตั้งต้นมาจากลูกค้าที่เลือกในขั้น 1 / งานประมูล (mirror) ไม่มีส่วนนี้ → ซ่อนทั้งขั้นตอนแก้ไขดีลเดิม -->
          <section v-show="spStepVisible(2) && (spShowChannel || spChannelLegacy)" class="mb-4 rounded-2xl border border-slate-200 bg-slate-50/60 p-3 sm:p-4 space-y-3">
            <div class="flex items-center gap-2 pb-2 border-b border-slate-200">
              <span class="w-7 h-7 rounded-full bg-teal-600 text-white text-sm font-bold flex items-center justify-center shrink-0">2</span>
              <h3 class="text-base font-bold text-slate-800">บทบาทลูกค้า (ผู้ซื้อ / ผู้จ่ายเงิน) ในดีลการขายครั้งนี้</h3>
              <button type="button" @click.prevent="spFieldHelp='segment'" class="inline-flex items-center justify-center w-5 h-5 -my-1 bg-transparent border-0 p-0 rounded-full cursor-pointer text-slate-400 hover:text-teal-700 hover:bg-teal-50" title="ช่องนี้คืออะไร" aria-label="คำอธิบายส่วน ดีลนี้ขายแบบไหน"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="11"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button>
            </div>
            <!-- ป้าย "ตั้งต้นจากลูกค้า" รวมไว้ใต้หัวขั้นที่เดียว (เดิมอยู่ท้ายหัวข้อย่อยแต่ละข้อ ดูรก — ยืนยันจากผู้ใช้ 2026-11-23) / หายเมื่อ Sale เปลี่ยนเองครบทุกข้อ -->
            <div v-if="spForm.channel_defaulted.channel || spForm.channel_defaulted.type" class="flex flex-wrap items-center gap-x-2 gap-y-1"><span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">เป็นข้อมูลตั้งต้นจากทะเบียนลูกค้า</span><span class="text-xs text-slate-500">*เปลี่ยนได้ตามบทบาทการขายแต่ละดีลจริง</span></div>
            <!-- ดีลนี้ขายแบบไหน — 3 ชั้น (ยืนยันจากผู้ใช้ 2026-11-20 แทนแบบ "ลูกค้าปลายทาง = ลูกค้าในทะเบียน" ของ 2026-11-02)
                 ชั้น 1 ช่องทาง → ชั้น 2 ประเภท → ชั้น 3 ตลาด (+ ชื่อลูกค้าปลายทาง พิมพ์เอง เมื่อขายผ่านคนกลาง)
                 ค่าตั้งต้นมาจากบทบาทของลูกค้า (ป้ายส้ม "ตั้งต้นจากลูกค้า") Sale ปรับได้ต่อดีล เปลี่ยนแล้วป้ายหาย — แก้ลูกค้าทีหลัง ดีลเดิมไม่เปลี่ยน
                 เขียว = ขายตรง, ส้ม = ผ่านคนกลาง, ม่วง = ตลาด (สีเดียวกับฟอร์มลูกค้า) / ปุ่มกด ไม่มีลากวาง (ผู้ใช้วัย 50-60) -->
            <div v-if="spShowChannel" class="rounded-xl bg-white border border-slate-200 px-3 sm:px-4 py-3">

              <div class="flex items-center gap-2 flex-wrap text-[.95rem] font-bold text-slate-800 mb-2"><span class="text-xs font-bold px-2 py-0.5 rounded-md border border-teal-600 text-teal-700 bg-white shrink-0">ข้อ 1</span>ลูกค้ารายนี้เป็นแบบไหน <span class="text-red-500">*</span> <span class="text-sm font-normal text-slate-500">— กดเลือก 1 ปุ่ม</span></div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <button type="button" @click="setSpChannel('direct')" class="border-2 rounded-xl py-2.5 px-3 text-sm font-semibold cursor-pointer transition-colors flex items-start gap-2 text-left"
                  :class="spForm.sales_channel === 'direct' ? 'border-teal-600 bg-teal-50 text-teal-800' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-400'"><span data-radio-dot class="flex w-5 h-5 mt-px rounded-full border-2 items-center justify-center shrink-0" :class="spForm.sales_channel === 'direct' ? 'border-current' : 'border-slate-300'"><span v-if="spForm.sales_channel === 'direct'" class="w-2.5 h-2.5 rounded-full bg-current"></span></span><span data-radio-body class="flex-1 min-w-0">
                  เป็นผู้ใช้เอง<span class="block text-xs font-normal">ซื้อสินค้าไปใช้เอง (ขายตรง)</span></span></button>
                <button type="button" @click="setSpChannel('indirect')" class="border-2 rounded-xl py-2.5 px-3 text-sm font-semibold cursor-pointer transition-colors flex items-start gap-2 text-left"
                  :class="spForm.sales_channel === 'indirect' ? 'border-orange-600 bg-orange-50 text-orange-800' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-400'"><span data-radio-dot class="flex w-5 h-5 mt-px rounded-full border-2 items-center justify-center shrink-0" :class="spForm.sales_channel === 'indirect' ? 'border-current' : 'border-slate-300'"><span v-if="spForm.sales_channel === 'indirect'" class="w-2.5 h-2.5 rounded-full bg-current"></span></span><span data-radio-body class="flex-1 min-w-0">
                  เป็นคนกลาง<span class="block text-xs font-normal">ไม่ได้ใช้สินค้าเอง (คนกลาง)</span></span></button>
              </div>

              <!-- ขายตรง: ประเภทของผู้ซื้อ (บังคับ) — ตลาดย้ายไปขั้น 3 -->
              <template v-if="spForm.sales_channel === 'direct'">
                <div class="flex items-center gap-2 flex-wrap text-[.95rem] font-bold text-slate-800 mb-2 mt-3 pt-3 border-t border-dashed border-slate-300"><span class="text-xs font-bold px-2 py-0.5 rounded-md border border-teal-600 text-teal-700 bg-white shrink-0">ข้อ 2</span>ประเภทของผู้ซื้อ <span class="text-red-500">*</span> <span class="text-sm font-normal text-slate-500">— กดเลือก 1 ปุ่ม</span></div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                  <button v-for="t in spSegmentOptions" :key="t.value" type="button" @click="spForm.segment = t.value; spForm.channel_defaulted.type = false" class="border-2 rounded-xl py-2.5 px-3 text-sm font-semibold cursor-pointer transition-colors flex items-start gap-2 text-left"
                    :class="spForm.segment === t.value ? 'border-teal-600 bg-teal-50 text-teal-800' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-400'"><span data-radio-dot class="flex w-5 h-5 mt-px rounded-full border-2 items-center justify-center shrink-0" :class="spForm.segment === t.value ? 'border-current' : 'border-slate-300'"><span v-if="spForm.segment === t.value" class="w-2.5 h-2.5 rounded-full bg-current"></span></span><span data-radio-body class="flex-1 min-w-0">{{ t.label }}</span></button>
                </div>
              </template>

              <!-- ขายผ่านคนกลาง: ประเภทคนกลาง (บังคับ) — ตลาด + ชื่อลูกค้าปลายทาง ย้ายไปขั้น 3 -->
              <template v-if="spForm.sales_channel === 'indirect'">
                <div class="flex items-center gap-2 flex-wrap text-[.95rem] font-bold text-slate-800 mb-2 mt-3 pt-3 border-t border-dashed border-slate-300"><span class="text-xs font-bold px-2 py-0.5 rounded-md border border-teal-600 text-teal-700 bg-white shrink-0">ข้อ 2</span>ประเภทคนกลาง <span class="text-red-500">*</span> <span class="text-sm font-normal text-slate-500">— กดเลือก 1 ปุ่ม</span></div>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  <button v-for="r in spIntermediaryRoles" :key="r.customer_role_id" type="button" @click="setSpChannelRole(r.customer_role_id)" :title="r.customer_role_description" class="border-2 rounded-xl py-2.5 px-3 text-sm font-semibold cursor-pointer transition-colors flex items-start gap-2 text-left"
                    :class="spForm.channel_role_id === r.customer_role_id ? 'border-orange-600 bg-orange-50 text-orange-800' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-400'"><span data-radio-dot class="flex w-5 h-5 mt-px rounded-full border-2 items-center justify-center shrink-0" :class="spForm.channel_role_id === r.customer_role_id ? 'border-current' : 'border-slate-300'"><span v-if="spForm.channel_role_id === r.customer_role_id" class="w-2.5 h-2.5 rounded-full bg-current"></span></span><span data-radio-body class="flex-1 min-w-0">{{ r.customer_role_name }}</span></button>
                </div>
                <input v-if="spChannelRole && Number(spChannelRole.requires_note) === 1" v-model="spForm.channel_role_note" @input="spForm.channel_defaulted.type = false" maxlength="255" placeholder="พิมพ์ระบุ เช่น บริษัทให้เช่าเฟอร์นิเจอร์"
                  class="mt-2 w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100 bg-white">
              </template>
            </div>
            <!-- ดีลเดิมก่อนมีส่วนนี้ (ยังไม่ระบุช่องทาง) — แสดงค่าเดิม ไม่บังคับ จนกว่าจะกดระบุ -->
            <div v-else-if="spChannelLegacy" class="rounded-xl bg-white border border-slate-200 px-3 sm:px-4 py-3">
              <div class="text-sm font-bold text-slate-700 mb-2">บทบาทลูกค้า (ผู้ซื้อ / ผู้จ่ายเงิน) ในดีลการขายครั้งนี้</div>
              <div class="grid grid-cols-[110px_1fr] gap-y-1.5 text-sm">
                <span class="text-slate-500">ประเภท</span><span class="text-slate-800">{{ spForm.segment ? spSegmentLabel(spForm.segment) : '-' }}</span>
                <span class="text-slate-500">ตลาด</span><span class="text-slate-800">{{ spForm.specialization || '-' }}{{ spForm.specialization_note ? ' (' + spForm.specialization_note + ')' : '' }}</span>
              </div>
              <div class="text-xs text-slate-500 mt-2">ค่าเดิมของดีลนี้ ยังไม่ระบุช่องทาง
                <button v-if="spForm.account_id && spForm.source_type !== 'ebidding'" type="button" @click="startSpChannel" class="ml-1 px-2.5 py-1 rounded-lg text-xs font-semibold bg-white ring-1 ring-teal-400 text-teal-700 hover:bg-teal-50 border-0 cursor-pointer">ระบุช่องทางของดีลนี้</button>
              </div>
            </div>
          </section>

          <!-- 3 ข้อมูลลูกค้าปลายทาง — แยกจากข้อ 3 ของขั้น 2 / ข้อ 1 ลูกค้าปลายทางคือใคร → ข้อ 2 ตลาด (ยืนยันจากผู้ใช้ 2026-11-23)
               ผู้ใช้เอง = ลูกค้ารายนี้เอง (แสดงอย่างเดียว ไม่บันทึกชื่อ) + ตลาดบังคับ / คนกลาง = ชื่อ + ตลาด ไม่บังคับ (ทราบก็ใส่) / ดีลเดิมที่ยังไม่ระบุช่องทาง ตลาดเดิมแสดงในขั้น 2 -->
          <section v-show="spStepVisible(3) && spShowChannel && spForm.sales_channel" class="mb-4 rounded-2xl border border-slate-200 bg-slate-50/60 p-3 sm:p-4 space-y-3">
            <div class="flex items-center gap-2 pb-2 border-b border-slate-200">
              <span class="w-7 h-7 rounded-full bg-teal-600 text-white text-sm font-bold flex items-center justify-center shrink-0">3</span>
              <h3 class="text-base font-bold text-slate-800">ข้อมูลลูกค้าปลายทาง (ขายไปตลาดไหน?)</h3>
              <button type="button" @click.prevent="spFieldHelp='enduser'" class="inline-flex items-center justify-center w-5 h-5 -my-1 bg-transparent border-0 p-0 rounded-full cursor-pointer text-slate-400 hover:text-teal-700 hover:bg-teal-50" title="ส่วนนี้คืออะไร" aria-label="คำอธิบาย ข้อมูลลูกค้าปลายทาง (ขายไปตลาดไหน?)"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="11"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button>
            </div>
            <div class="rounded-xl bg-white border border-slate-200 px-3 sm:px-4 py-3">
              <!-- ผู้ใช้เอง: ข้อ 1 = ลูกค้ารายนี้เอง (แสดงอย่างเดียว) / ข้อ 2 ตลาดของผู้ซื้อ (บังคับ) -->
              <template v-if="spForm.sales_channel === 'direct'">
                <div class="flex items-center gap-2 flex-wrap text-[.95rem] font-bold text-slate-800 mb-2"><span class="text-xs font-bold px-2 py-0.5 rounded-md border border-teal-600 text-teal-700 bg-white shrink-0">ข้อ 1</span>ชื่อลูกค้าปลายทาง</div>

                <input v-if="spMarketNeedsNote" v-model="spForm.specialization_note" maxlength="255" placeholder="พิมพ์ระบุกลุ่มตลาด เช่น โรงแรม / ร้านอาหาร"
                  class="mt-2 w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100 bg-white">
              </template>
              <!-- คนกลาง: ข้อ 1 ชื่อลูกค้าปลายทาง / ข้อ 2 ตลาด (ไม่บังคับทั้งคู่ — กดซ้ำปุ่มเดิมเพื่อเอาออก) -->
              <template v-if="spForm.sales_channel === 'indirect'">
                <div class="flex items-center gap-2 flex-wrap text-[.95rem] font-bold text-slate-800 mb-2"><span class="text-xs font-bold px-2 py-0.5 rounded-md border border-teal-600 text-teal-700 bg-white shrink-0">ข้อ 1</span>ชื่อลูกค้าปลายทาง (ถ้ามี) <span class="text-sm font-normal text-slate-500">— ไม่บังคับ</span></div>
                <input v-model="spForm.end_user_name" maxlength="255" placeholder="เช่น โรงพยาบาล / หน่วยงาน ที่ใช้ของจริง"

                <div class="grid grid-cols-2 sm:grid-cols-5 gap-2">

                </div>
                <input v-if="spMarketNeedsNote" v-model="spForm.specialization_note" maxlength="255" placeholder="พิมพ์ระบุกลุ่มตลาด เช่น โรงแรม / ร้านอาหาร"
                  class="mt-2 w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100 bg-white">
              </template>
            </div>
          </section>

          <!-- 4 ขายอะไร — ลำดับฟอร์ม ใคร → ขายอะไร → ที่มา/สถานะ → มูลค่า/คู่แข่ง → แผนติดตาม (ยืนยันจากผู้ใช้ 2026-10-30) -->
          <section v-show="spStepVisible(4)" class="mb-4 rounded-2xl border border-slate-200 bg-slate-50/60 p-3 sm:p-4 space-y-3">
            <div class="flex items-center gap-2 pb-2 border-b border-slate-200">
              <span class="w-7 h-7 rounded-full bg-teal-600 text-white text-sm font-bold flex items-center justify-center shrink-0">4</span>
              <h3 class="text-base font-bold text-slate-800">ขายสินค้าอะไรให้ลูกค้า</h3>
            </div>
            <div>
              <label class="flex flex-wrap items-center gap-x-1 gap-y-0.5 text-sm font-semibold text-slate-700 mb-1.5">ชื่อโครงการ / รายการสินค้า <button type="button" @click.prevent="spFieldHelp='title'" class="inline-flex items-center justify-center w-5 h-5 -my-1 bg-transparent border-0 p-0 rounded-full cursor-pointer text-slate-400 hover:text-teal-700 hover:bg-teal-50" title="ช่องนี้คืออะไร" aria-label="คำอธิบายช่อง ชื่อโครงการ / รายการสินค้า"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="11"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button></label>
              <input v-model="spForm.title" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100 bg-white" placeholder="เช่น โต๊ะทำงาน 50 ชุด, เก้าอี้ประชุม">
              <div class="text-xs text-slate-500 mt-1">ระบุให้ชัดเจน เช่น ชนิดสินค้า จำนวน</div>
            </div>
            <!-- หมวดสินค้า / แบรนด์ ย้ายจากกล่อง 4 เดิม — ขายอะไรต้องรู้ก่อนประเมินมูลค่า (ยืนยันจากผู้ใช้ 2026-10-30) -->
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1.5">หมวดสินค้า <span class="text-red-500">*</span> <span class="text-sm font-normal text-slate-500">— กดเลือก 1 ปุ่ม</span></label>
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                <button v-for="v in ['Steel','Chair','Wooden','Other']" :key="v" type="button" @click="spForm.product_category = v"
                  class="border-2 rounded-xl py-2.5 px-3 text-sm font-semibold cursor-pointer transition-colors flex items-start gap-2 text-left" :class="spForm.product_category === v ? 'border-teal-600 bg-teal-50 text-teal-800' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-400'"><span data-radio-dot class="flex w-5 h-5 mt-px rounded-full border-2 items-center justify-center shrink-0" :class="spForm.product_category === v ? 'border-current' : 'border-slate-300'"><span v-if="spForm.product_category === v" class="w-2.5 h-2.5 rounded-full bg-current"></span></span><span data-radio-body class="flex-1 min-w-0">{{ v }}</span></button>

            <div>

              <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                <button v-for="v in ['Taiyo','Hybrida','Motech','Smartform','Sunon','Other']" :key="v" type="button" @click="spForm.brand = v"
                  class="border-2 rounded-xl py-2.5 px-3 text-sm font-semibold cursor-pointer transition-colors flex items-start gap-2 text-left" :class="spForm.brand === v ? 'border-teal-600 bg-teal-50 text-teal-800' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-400'"><span data-radio-dot class="flex w-5 h-5 mt-px rounded-full border-2 items-center justify-center shrink-0" :class="spForm.brand === v ? 'border-current' : 'border-slate-300'"><span v-if="spForm.brand === v" class="w-2.5 h-2.5 rounded-full bg-current"></span></span><span data-radio-body class="flex-1 min-w-0">{{ v }}</span></button>
              </div>
            </div>
          </section>

          <!-- 3 ที่มาและสถานะ (เดิมอยู่กล่อง 2 ข้อมูลดีล) — ปุ่มแยกกล่อง + คำไทยใต้ตัวเลือก (ยืนยันจากผู้ใช้ 2026-11-23 แทนปุ่มแถบเดียว 2026-10-20) -->
          <section v-show="spStepVisible(5)" class="mb-4 rounded-2xl border border-slate-200 bg-slate-50/60 p-3 sm:p-4 space-y-5">
            <div class="flex items-center gap-2 pb-2 border-b border-slate-200">
              <span class="w-7 h-7 rounded-full bg-teal-600 text-white text-sm font-bold flex items-center justify-center shrink-0">5</span>
              <h3 class="text-base font-bold text-slate-800">ที่มาและประเภทดีล</h3>
            </div>
            <!-- แหล่งที่มาของงาน (Lead Source) + Fee — ข้อมูลของตัวดีล รู้ตั้งแต่สร้าง (มาตรฐาน CRM: Opportunity Information) ย้ายจากกล่อง 4 (2026-10-20) -->
            <div>
              <label class="flex flex-wrap items-center gap-x-1 gap-y-0.5 text-sm font-semibold text-slate-700 mb-1.5">แหล่งที่มาของงาน <span class="text-red-500">*</span> <button type="button" @click.prevent="spFieldHelp='source_type'" class="inline-flex items-center justify-center w-5 h-5 -my-1 bg-transparent border-0 p-0 rounded-full cursor-pointer text-slate-400 hover:text-teal-700 hover:bg-teal-50" title="ช่องนี้คืออะไร" aria-label="คำอธิบายช่อง แหล่งที่มาของงาน"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="11"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button> <span class="text-sm font-normal text-slate-500">— กดเลือก 1 ปุ่ม</span></label>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <button v-for="s in spSourceTypes.filter(s=>s.val!=='ebidding')" :key="s.val" type="button"
                  class="border-2 rounded-xl py-2.5 px-3 text-sm font-semibold cursor-pointer transition-colors flex items-start gap-2 text-left" :class="spForm.source_type===s.val ? 'border-teal-600 bg-teal-50 text-teal-800' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-400'"
                  @click="spForm.source_type=s.val"><span data-radio-dot class="flex w-5 h-5 mt-px rounded-full border-2 items-center justify-center shrink-0" :class="spForm.source_type===s.val ? 'border-current' : 'border-slate-300'"><span v-if="spForm.source_type===s.val" class="w-2.5 h-2.5 rounded-full bg-current"></span></span><span data-radio-body class="flex-1 min-w-0">{{ s.icon }} {{ s.label }}<span v-if="spSourceDesc[s.val]" class="block text-xs font-normal">{{ spSourceDesc[s.val] }}</span></span></button>
              </div>
            </div>
            <!-- ประเภทดีล — โหลดจาก master table deal_types (เพิ่มประเภทใหม่ใน DB แล้วปุ่มขึ้นเองอัตโนมัติ ไม่ต้องแก้โค้ด)
                 ดีลใหม่ไม่เลือกไว้ให้ก่อน (deal_type_id='') บังคับ sale เลือกเอง กันเผลอกดสร้างแล้วงานวาง Spec ถูกบันทึกเป็นซื้อทันที (ยืนยันจากผู้ใช้ 2026-09-23)
                 คำอธิบายอยู่ในการ์ดแต่ละตัว ให้อ่านเทียบกันได้ก่อนเลือก — ดึงจาก deal_types.deal_type_description -->
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1">ประเภทดีล <span class="text-red-500">*</span> <span class="text-sm font-normal text-slate-500">— กดเลือก 1 ปุ่ม</span></label>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <button v-for="dt in spDealTypeOptions" :key="dt.deal_type_id" type="button" @click="spForm.deal_type_id=dt.deal_type_id"
                  class="text-left border-2 rounded-xl p-3 cursor-pointer transition-all flex flex-col justify-start"
                  :class="spForm.deal_type_id===dt.deal_type_id ? 'border-teal-600 bg-teal-50' : 'border-slate-200 bg-white hover:border-slate-400'">
                  <div class="flex items-center gap-2">
                    <span class="w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0"
                      :class="spForm.deal_type_id===dt.deal_type_id ? 'border-teal-600' : 'border-slate-300'">
                      <span v-if="spForm.deal_type_id===dt.deal_type_id" class="w-2.5 h-2.5 rounded-full bg-teal-600"></span>
                    </span>
                    <span class="text-base font-bold" :class="spForm.deal_type_id===dt.deal_type_id ? 'text-teal-800' : 'text-slate-700'">{{ dt.deal_type_name }}</span>
                  </div>
                  <div v-if="dt.deal_type_description" class="text-sm text-slate-500 mt-1.5 pl-7 leading-snug">{{ dt.deal_type_description }}</div>
                </button>
              </div>
            </div>
            <!-- Fee Structure — ปุ่มแทน dropdown ให้เหมือนช่องอื่นในกล่องนี้ (ตัวเลือกน้อย กดครั้งเดียว) -->
            <div>
              <label class="flex flex-wrap items-center gap-x-1 gap-y-0.5 text-sm font-semibold text-slate-700 mb-1.5">ค่าตอบแทนคนกลาง<span class="hidden sm:inline">&nbsp;(Fee Structure)</span> <span class="text-red-500">*</span> <button type="button" @click.prevent="spFieldHelp='fee_structure'" class="inline-flex items-center justify-center w-5 h-5 -my-1 bg-transparent border-0 p-0 rounded-full cursor-pointer text-slate-400 hover:text-teal-700 hover:bg-teal-50" title="ช่องนี้คืออะไร" aria-label="คำอธิบายช่อง ค่าตอบแทนคนกลาง (Fee Structure)"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="11"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button> <span class="text-sm font-normal text-slate-500">— กดเลือก 1 ปุ่ม</span></label>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                <button v-for="f in ['No fee','Referral %','Client to resell']" :key="f" type="button"
                  class="border-2 rounded-xl py-2.5 px-3 text-sm font-semibold cursor-pointer transition-colors flex items-start gap-2 text-left" :class="spForm.fee_structure===f ? 'border-teal-600 bg-teal-50 text-teal-800' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-400'"
                  @click="spForm.fee_structure=f"><span data-radio-dot class="flex w-5 h-5 mt-px rounded-full border-2 items-center justify-center shrink-0" :class="spForm.fee_structure===f ? 'border-current' : 'border-slate-300'"><span v-if="spForm.fee_structure===f" class="w-2.5 h-2.5 rounded-full bg-current"></span></span><span data-radio-body class="flex-1 min-w-0">{{ f }}<span class="block text-xs font-normal">{{ spFeeDesc[f] }}</span></span></button>
              </div>
            </div>
            <!-- ดีลใหม่เริ่มที่สนใจ/ติดต่อเสมอ ไม่ต้องเลือก (ยืนยันจากผู้ใช้ 2026-11-02) -->
            <div v-if="spForm.id">
              <label class="flex flex-wrap items-center gap-x-1 gap-y-0.5 text-sm font-semibold text-slate-700 mb-1.5">ขั้นตอนปัจจุบัน <button type="button" @click.prevent="spFieldHelp='stage'" class="inline-flex items-center justify-center w-5 h-5 -my-1 bg-transparent border-0 p-0 rounded-full cursor-pointer text-slate-400 hover:text-teal-700 hover:bg-teal-50" title="ช่องนี้คืออะไร" aria-label="คำอธิบายช่อง ขั้นตอนปัจจุบัน"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="11"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button> <span class="text-sm font-normal text-slate-500">— กดเลือก 1 ปุ่ม</span></label>
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                <button v-for="st in spStages.filter(s=>!['Delivered','Lost'].includes(s.key))" :key="st.key" type="button"
                  class="border-2 rounded-xl py-2.5 px-3 text-sm font-semibold cursor-pointer transition-colors flex items-start gap-2 text-left" :class="spForm.stage===st.key ? 'border-teal-600 bg-teal-50 text-teal-800' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-400'"
                  @click="spForm.stage=st.key"><span data-radio-dot class="flex w-5 h-5 mt-px rounded-full border-2 items-center justify-center shrink-0" :class="spForm.stage===st.key ? 'border-current' : 'border-slate-300'"><span v-if="spForm.stage===st.key" class="w-2.5 h-2.5 rounded-full bg-current"></span></span><span data-radio-body class="flex-1 min-w-0">{{ st.thLabel }}</span></button>
              </div>
            </div>
          </section>

          <!-- 4 มูลค่าและคู่แข่ง (เดิมกล่อง 3 ประเภทดีล คู่แข่ง และมูลค่า) -->
          <section v-show="spStepVisible(6)" class="mb-4 rounded-2xl border border-slate-200 bg-slate-50/60 p-3 sm:p-4 space-y-3">
            <div class="flex items-center gap-2 pb-2 border-b border-slate-200">
              <span class="w-7 h-7 rounded-full bg-teal-600 text-white text-sm font-bold flex items-center justify-center shrink-0">6</span>
              <h3 class="text-base font-bold text-slate-800">มูลค่าและโอกาสปิดดีล</h3>
            </div>
            <!-- มูลค่า/โอกาส/วันคาดปิด — 2 คอลัมน์ (เดิม 3 คอลัมน์แคบจนคำอธิบายตกบรรทัดและช่องไม่ตรงแนว — ปรับตามผู้ใช้ 2026-09-23)
                 มีหน่วย "บาท"/"%" ต่อท้ายในช่อง ให้รู้ว่ากรอกอะไรโดยไม่ต้องอ่านป้าย -->
            <!-- จัดใหม่ 2026-10-20: มูลค่า / โอกาสปิดดีล / วันคาดปิดดีล อยู่แถวเดียวกัน (3 ค่าที่ใช้คำนวณ Weighted Pipeline) — วันส่งมอบอยู่ grid ถัดไป -->
            <!-- มูลค่า + วันคาดปิดดีล แถวเดียวกัน / โอกาสปิดดีลเป็นปุ่ม 10–90% เต็มแถว (ยืนยันจากผู้ใช้ 2026-11-23 — พิมพ์เองช้าบนมือถือ)
                 ไม่มี 0% / 100% — 100% = ปิดดีลได้ / 0% = แพ้ เป็นขั้นของดีล ไม่ใช่ค่าที่เลือกตอนดีลยังเปิด / ข้อมูลจริง: ค่าที่ไม่ใช่หลักสิบมีแค่ 25% ดีลเดียว -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="flex items-center gap-1 text-sm font-semibold text-slate-700 mb-1">มูลค่า <span class="text-red-500">*</span> <button type="button" @click.prevent="spFieldHelp='value'" class="inline-flex items-center justify-center w-5 h-5 -my-1 bg-transparent border-0 p-0 rounded-full cursor-pointer text-slate-400 hover:text-teal-700 hover:bg-teal-50" title="มูลค่านี้มาจากไหน" aria-label="คำอธิบายช่อง มูลค่าดีล"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="11"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button></label>
                <div class="relative">
                  <input v-model="spForm.value" type="number" min="0" class="w-full border border-slate-300 rounded-xl pl-3.5 pr-12 py-2.5 text-base sm:text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100 bg-white" placeholder="0">

                </div>
              </div>
              <div>
                <label class="flex items-center gap-1 text-sm font-semibold text-slate-700 mb-1">วันคาดปิดดีล <button type="button" @click.prevent="spFieldHelp='expected_close'" class="inline-flex items-center justify-center w-5 h-5 -my-1 bg-transparent border-0 p-0 rounded-full cursor-pointer text-slate-400 hover:text-teal-700 hover:bg-teal-50" title="ช่องนี้คืออะไร" aria-label="คำอธิบายช่อง วันคาดปิดดีล"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="11"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button></label>
                <input v-model="spForm.expected_close" type="date" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100 bg-white">
                <!-- ปุ่มลัดวันคาดปิดดีล (ยืนยันจากผู้ใช้ 2026-11-23) — ไม่เลือกให้เอง กันกดผ่านโดยไม่คิด / 6 เดือน = งานวาง Spec ตามคำอธิบายประเภทดีล / ไม่กรอก = นับเป็นภายใน 3 เดือน -->
                <div class="flex flex-wrap gap-1.5 mt-1.5">
                  <button v-for="q in spClosePresets" :key="q.label" type="button" @click="spForm.expected_close = spFollowupDate(q)"

                </div>
                <div v-if="spForm.expected_close" class="flex flex-wrap items-center gap-2 mt-1.5">
                  <span class="text-sm font-semibold text-teal-800">{{ spThaiDate(spForm.expected_close) }}</span>
                  <button type="button" @click="spForm.expected_close = ''" class="text-xs text-slate-500 underline bg-transparent border-0 p-0 cursor-pointer">ล้างวัน</button>
                </div>
              </div>
            </div>
            <div>
              <label class="flex flex-wrap items-center gap-x-1 gap-y-0.5 text-sm font-semibold text-slate-700 mb-1.5">โอกาสปิดดีล <span class="text-red-500">*</span> <button type="button" @click.prevent="spFieldHelp='win_probability'" class="inline-flex items-center justify-center w-5 h-5 -my-1 bg-transparent border-0 p-0 rounded-full cursor-pointer text-slate-400 hover:text-teal-700 hover:bg-teal-50" title="ช่องนี้คืออะไร" aria-label="คำอธิบายช่อง โอกาสปิดดีล"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="11"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button> <span class="text-sm font-normal text-slate-500">— กดเลือก 1 ปุ่ม</span><span v-if="spProbLegacy" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">ค่าเดิม {{ spForm.win_probability }}%</span></label>
              <div class="grid grid-cols-3 sm:grid-cols-9 gap-2">
                <button v-for="p in [10,20,30,40,50,60,70,80,90]" :key="p" type="button" @click="spForm.win_probability = p"
                  class="border-2 rounded-xl py-2.5 px-2 text-sm font-semibold cursor-pointer transition-colors flex items-center justify-center gap-1.5" :class="Number(spForm.win_probability) === p && spForm.win_probability !== '' ? 'border-teal-600 bg-teal-50 text-teal-800' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-400'"><span data-radio-dot class="flex w-4 h-4 rounded-full border-2 items-center justify-center shrink-0" :class="Number(spForm.win_probability) === p && spForm.win_probability !== '' ? 'border-current' : 'border-slate-300'"><span v-if="Number(spForm.win_probability) === p && spForm.win_probability !== ''" class="w-2 h-2 rounded-full bg-current"></span></span>{{ p }}%</button>
              </div>
              <div class="text-xs text-slate-500 mt-1.5">โอกาสปิดดีลและวันคาดปิด ใช้คำนวณยอดคาดการณ์ (Weighted Pipeline) — งานวาง Spec ควรใส่วันคาดปิดตามจริง</div>
            </div>
            <div v-if="['Deal Signed','Delivered'].includes(spForm.stage)" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <!-- วันคาดส่งมอบ: แสดงเมื่อปิดดีลแล้ว / ส่งสินค้าแล้ว — แก้ได้ถ้าลูกค้าเลื่อน ระบบบันทึกประวัติการเลื่อน (2026-10-07) -->
              <div v-if="['Deal Signed','Delivered'].includes(spForm.stage)">
                <label class="block text-sm font-semibold text-slate-700 mb-1">วันที่คาดว่าจะส่งมอบ <span v-if="spForm.stage === 'Deal Signed' && modal.data?.stage !== 'Deal Signed'" class="text-red-500">*</span></label>
                <input v-model="spForm.expected_delivery_date" type="date" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100 bg-white">
              </div>
              <!-- วันที่ส่งสินค้าจริง: ขั้นส่งสินค้าแล้ว — แก้ได้ ระบบบันทึกประวัติ (2026-10-07) -->
              <div v-if="spForm.stage === 'Delivered'">
                <label class="block text-sm font-semibold text-slate-700 mb-1">วันที่ส่งสินค้าจริง <span v-if="modal.data?.stage !== 'Delivered'" class="text-red-500">*</span></label>
                <input v-model="spForm.delivered_date" type="date" :max="todayIso()" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100 bg-white">
              </div>
              <div v-if="spForm.stage === 'Delivered'" class="text-xs text-slate-500 sm:self-end sm:pb-3">ตั้งต้นเป็นวันนี้ แก้เป็นวันที่ส่งของจริงได้ (ห้ามเกินวันนี้) — ยอดรายได้รายเดือนนับตามวันนี้</div>
              <div v-if="['Deal Signed','Delivered'].includes(spForm.stage)" class="text-xs text-slate-500 sm:self-end sm:pb-3">ใส่วันโดยประมาณได้ ถ้ายังไม่แน่นอน — ฝ่ายจัดส่งใช้วางแผนล่วงหน้าก่อนออก SO · ลูกค้าเลื่อน แก้ได้ที่นี่ ระบบบันทึกประวัติให้</div>
            </div>
            <!-- ความสำคัญ — ย้ายจากขั้น 5 คู่กับมูลค่า/โอกาสปิด (ยืนยัน mockup จากผู้ใช้ 2026-11-23) -->
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1.5">ระดับความสำคัญของดีล <span class="text-red-500">*</span> <span class="text-sm font-normal text-slate-500">— กดเลือก 1 ปุ่ม</span></label>
              <div class="grid grid-cols-3 gap-2">
                <button v-for="p in [{val:'High',label:'สูง'},{val:'Medium',label:'กลาง'},{val:'Low',label:'ต่ำ'}]" :key="p.val" type="button"
                  class="border-2 rounded-xl py-2.5 px-3 text-sm font-semibold cursor-pointer transition-colors flex items-start gap-2 text-left" :class="spForm.priority===p.val ? 'border-teal-600 bg-teal-50 text-teal-800' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-400'"
                  @click="spForm.priority=p.val"><span data-radio-dot class="flex w-5 h-5 mt-px rounded-full border-2 items-center justify-center shrink-0" :class="spForm.priority===p.val ? 'border-current' : 'border-slate-300'"><span v-if="spForm.priority===p.val" class="w-2.5 h-2.5 rounded-full bg-current"></span></span><span data-radio-body class="flex-1 min-w-0">{{ p.label }}</span></button>
              </div>
            </div>

          </section>

          <!-- 7 คู่แข่งในดีลนี้ — แยกจากขั้น 6 (ยืนยันจากผู้ใช้ 2026-11-23: ขั้น 6 ยาวเกินบนมือถือ / 1 ขั้น = 1 เรื่อง / Salesforce แยกคู่แข่งเป็นรายการของตัวเอง) -->

            <div class="flex items-center gap-2 pb-2 border-b border-slate-200">

              <h3 class="text-base font-bold text-slate-800">คู่แข่งในดีลนี้</h3>

                 ไม่มี / ยังไม่ทราบ = บันทึกตัวเลือกพิเศษ CP-NONE / CP-UNKNOWN เหมือนเดิม / รายชื่อจาก master competitors เรียงตามที่ใช้บ่อย / "อื่นๆ" เก็บที่ competitor_other_note
                 บังคับเฉพาะดีลใหม่ (ดีลเก่ายังไม่มีข้อมูลคู่แข่ง) -->
            <div>
              <div class="flex items-center gap-2 flex-wrap text-sm font-semibold text-slate-700 mb-1.5"><span class="text-xs font-bold px-2 py-0.5 rounded-md border border-teal-600 text-teal-700 bg-white shrink-0">ข้อ 1</span>ดีลนี้มีคู่แข่งไหม <span v-if="!spForm.id" class="text-red-500">*</span> <span class="text-sm font-normal text-slate-500">— กดเลือก 1 ปุ่ม</span></div>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                <button v-for="m in spCompetitorModes" :key="m.key" type="button" @click="setSpCompetitorMode(m.key)" class="border-2 rounded-xl py-2.5 px-3 text-sm font-semibold cursor-pointer transition-colors flex items-center gap-2 text-left" :class="spForm.competitor_mode === m.key ? 'border-teal-600 bg-teal-50 text-teal-800' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-400'">
                  <span data-radio-dot class="flex w-5 h-5 rounded-full border-2 items-center justify-center shrink-0" :class="spForm.competitor_mode === m.key ? 'border-current' : 'border-slate-300'"><span v-if="spForm.competitor_mode === m.key" class="w-2.5 h-2.5 rounded-full bg-current"></span></span>
                  <span class="flex-1 min-w-0">{{ m.label }}</span>
                </button>
              </div>
              <div v-if="spForm.competitor_mode === 'has'" class="mt-3 pt-3 border-t border-dashed border-slate-300">
                <div class="flex items-center gap-2 flex-wrap text-sm font-semibold text-slate-700 mb-1.5"><span class="text-xs font-bold px-2 py-0.5 rounded-md border border-teal-600 text-teal-700 bg-white shrink-0">ข้อ 2</span>คู่แข่งคือใคร <span class="text-red-500">*</span> <span class="text-sm font-normal text-slate-500">— ติ๊กได้หลายราย</span></div>
                <input v-if="spCompetitorChoices.length > 12" v-model="spCompetitorQuery" placeholder="ค้นหาชื่อคู่แข่ง" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100 bg-white mb-2">
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  <button v-for="c in spCompetitorChoicesShown" :key="c.competitor_id" type="button" @click="toggleSpCompetitor(c)"
