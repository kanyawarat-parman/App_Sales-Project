                    <span class="flex w-5 h-5 mt-px rounded-md border-2 items-center justify-center shrink-0" :class="spForm.competitor_ids.includes(Number(c.competitor_id)) ? 'border-current bg-current' : 'border-slate-300'"><template v-if="spForm.competitor_ids.includes(Number(c.competitor_id))"><svg class="w-3.5 h-3.5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></template></span>
                    <span class="flex-1 min-w-0 break-words leading-snug">{{ c.competitor_name }}</span>
                  </button>
                  <button type="button" @click="toggleSpCompetitorOther" class="border-2 rounded-xl py-2.5 px-2 sm:px-3 text-[13px] sm:text-sm font-semibold cursor-pointer transition-colors flex items-start gap-1.5 sm:gap-2 text-left" :class="spForm.competitor_other_on ? 'border-teal-600 bg-teal-50 text-teal-800' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-400'">
                    <span class="flex w-5 h-5 mt-px rounded-md border-2 items-center justify-center shrink-0" :class="spForm.competitor_other_on ? 'border-current bg-current' : 'border-slate-300'"><template v-if="spForm.competitor_other_on"><svg class="w-3.5 h-3.5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></template></span>
                    <span class="flex-1 min-w-0">อื่นๆ<span class="block text-xs font-normal">ไม่มีในรายชื่อ</span></span>

                <input v-if="spForm.competitor_other_on" v-model="spForm.competitor_other_note" maxlength="255" placeholder="พิมพ์ชื่อคู่แข่ง (ถ้ามีหลายราย คั่นด้วย ,)" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100 bg-white mt-2">
                <div v-if="spCompetitorSummary" class="text-sm text-slate-600 mt-2">เลือกแล้ว: <span class="font-semibold text-slate-800">{{ spCompetitorSummary }}</span></div>
              </div>
            </div>
          </section>

          <!-- 5 แผนติดตาม -->
          <section v-show="spStepVisible(8)" class="mb-4 rounded-2xl border border-slate-200 bg-slate-50/60 p-3 sm:p-4 space-y-3">
            <div class="flex items-center gap-2 pb-2 border-b border-slate-200">
              <span class="w-7 h-7 rounded-full bg-teal-600 text-white text-sm font-bold flex items-center justify-center shrink-0">8</span>
              <h3 class="text-base font-bold text-slate-800">แผนติดตาม</h3>
            </div>
            <div>
              <label class="flex flex-wrap items-center gap-x-1 gap-y-0.5 text-sm font-semibold text-slate-700 mb-1">สิ่งที่ต้องทำต่อ (Next Action) <button type="button" @click.prevent="spFieldHelp='next_action'" class="inline-flex items-center justify-center w-5 h-5 -my-1 bg-transparent border-0 p-0 rounded-full cursor-pointer text-slate-400 hover:text-teal-700 hover:bg-teal-50" title="ช่องนี้คืออะไร" aria-label="คำอธิบายช่อง สิ่งที่ต้องทำต่อ"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="11"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button></label>
              <input ref="spNextActionInput" v-model="spForm.next_action" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100 bg-white" placeholder="เช่น โทรติดตาม, ส่งตัวอย่างสินค้า, นัดพรีเซนต์">

              <div class="flex flex-wrap gap-1.5 mt-1.5">
                <button v-for="t in spNextActionPresets" :key="t" type="button" @click="addSpNextAction(t)" class="px-3 py-1.5 rounded-lg text-sm font-semibold border cursor-pointer transition-colors border-slate-300 bg-white text-slate-600 hover:border-teal-400 hover:text-teal-700">+ {{ t }}</button>
              </div>
            </div>
            <div>
              <label class="flex flex-wrap items-center gap-x-1 gap-y-0.5 text-sm font-semibold text-slate-700 mb-1">วันนัดติดตามครั้งถัดไป <button type="button" @click.prevent="spFieldHelp='next_followup_date'" class="inline-flex items-center justify-center w-5 h-5 -my-1 bg-transparent border-0 p-0 rounded-full cursor-pointer text-slate-400 hover:text-teal-700 hover:bg-teal-50" title="ช่องนี้คืออะไร" aria-label="คำอธิบายช่อง วันนัดติดตามครั้งถัดไป"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="11"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button></label>
              <!-- ปุ่มลัดวันนัด (แบบตั้งงานติดตามของ HubSpot) — เลือกวันเองจากปฏิทินได้ / แสดงวันที่เป็นภาษาไทย -->
              <div class="flex flex-wrap gap-1.5 mb-2">
                <button v-for="q in spFollowupPresets" :key="q.label" type="button" @click="spForm.next_followup_date = spFollowupDate(q)"
                  class="px-3 py-1.5 rounded-lg text-sm font-semibold border cursor-pointer transition-colors" :class="spForm.next_followup_date && spForm.next_followup_date === spFollowupDate(q) ? 'border-teal-600 bg-teal-50 text-teal-800' : 'border-slate-300 bg-white text-slate-600 hover:border-teal-400 hover:text-teal-700'">{{ q.label }}</button>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <input v-model="spForm.next_followup_date" type="date" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100 bg-white sm:max-w-xs">
                <span v-if="spForm.next_followup_date" class="text-sm font-semibold text-teal-800">{{ spThaiDate(spForm.next_followup_date) }}</span>
                <button v-if="spForm.next_followup_date" type="button" @click="spForm.next_followup_date = ''" class="text-xs text-slate-500 underline bg-transparent border-0 p-0 cursor-pointer">ล้างวันนัด</button>
              </div>
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1">หมายเหตุ</label>
              <textarea v-model="spForm.notes" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100 bg-white resize-y" rows="2" placeholder="รายละเอียดเพิ่มเติม ข้อตกลงพิเศษ ฯลฯ" style="min-height:70px"></textarea>
            </div>
            <!-- เจ้าของงาน — ธุรการ/ผู้จัดการ/admin เลือกคนได้ / sale แสดงชื่อตัวเองเป็นข้อความเล็ก (แก้ไม่ได้อยู่แล้ว ไม่ต้องเป็นช่องใหญ่) -->
            <div v-if="isSecretary">
              <label class="block text-sm font-semibold text-slate-700 mb-1">เจ้าของงานที่รับผิดชอบ</label>
              <select v-model="spForm.assigned_to" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100 bg-white">
                <option value="">-- เลือก Sale --</option>
                <option v-for="u in salesUsers" :key="u.id" :value="u.id">{{ u.full_name }}</option>
              </select>
            </div>
            <div v-else class="text-sm text-slate-500">เจ้าของงาน: <span class="font-semibold text-slate-700">{{ currentUser?.full_name }}</span></div>
          </section>

          <!-- 8 ตรวจก่อนบันทึก — แยกจากขั้นแผนติดตามเป็นขั้นของตัวเอง เฉพาะดีลใหม่ (ยืนยันจากผู้ใช้ 2026-11-23) -->
          <section v-if="!spForm.id" v-show="spStepVisible(9)" class="mb-4 rounded-2xl border border-slate-200 bg-slate-50/60 p-3 sm:p-4 space-y-3">
            <div class="flex items-center gap-2 pb-2 border-b border-slate-200">
              <span class="w-7 h-7 rounded-full bg-teal-600 text-white text-sm font-bold flex items-center justify-center shrink-0">9</span>
              <h3 class="text-base font-bold text-slate-800">ตรวจก่อนบันทึก</h3>
            </div>
            <div class="rounded-xl bg-amber-50 text-amber-900 text-sm px-3 py-2">ตรวจข้อมูลอีกครั้ง ถ้าผิด กด "แก้ไข" เพื่อกลับไปขั้นนั้น</div>
            <!-- 1 กล่อง = 1 ขั้น / แสดงทุก label เสมอ ค่าที่ไม่ได้กรอกแสดง "-" (ยืนยันจากผู้ใช้ 2026-11-23) / "แก้ไข" → ไปขั้นนั้น แล้วกด "ถัดไป" กลับมาที่หน้านี้ (spReturnToReview) -->
            <div v-for="g in spReviewGroups" :key="g.step" class="rounded-xl bg-white border border-slate-200 px-3 sm:px-4 py-2.5">
              <div class="flex items-center gap-2 mb-1.5">
                <span class="w-6 h-6 rounded-full bg-teal-600 text-white text-xs font-bold flex items-center justify-center shrink-0">{{ g.step }}</span>
                <span class="text-sm font-bold text-slate-800 flex-1 min-w-0">{{ g.title }}</span>
                <button type="button" @click="spEditFromReview(g.step)" class="shrink-0 px-3 py-1 rounded-lg text-sm font-semibold bg-white ring-1 ring-teal-400 text-teal-700 hover:bg-teal-50 border-0 cursor-pointer">แก้ไข</button>
              </div>
              <div class="grid grid-cols-[96px_minmax(0,1fr)] sm:grid-cols-[130px_minmax(0,1fr)] gap-x-2 gap-y-1 text-sm">
                <template v-for="r in g.rows" :key="r[0]">
                  <span class="text-slate-500">{{ r[0] }}</span>
                  <span class="break-words" :class="r[1] ? 'text-slate-800' : 'text-slate-400'">{{ r[1] || '-' }}</span>
                </template>
              </div>
            </div>
          </section>

          </div>

          <!-- ═══ แท็บ ใบเสนอราคา ═══ ขอใบเสนอราคาจากดีลนี้ + รายการคำขอ (Quote Request — ยืนยันจากผู้ใช้ 2026-10-14) — ใบเสนอราคาเป็นข้อมูลลูกของดีล (Related List)
               ใบเสนอราคางานโครงการต้องออกจากคำขอในดีลเท่านั้น — ส่งคำขอ/ยกเลิกแล้วโหลดการ์ดใหม่ (ป้าย "รอออกใบ") / mount ไว้ตลอด (v-show) ให้หัวสรุปได้ตัวเลขทันที -->
          <div v-show="spForm.id && spFormTab === 'quote'">
            <app-quote-requests v-if="spForm.id && spForm.project_code" :project-code="spForm.project_code"
              @changed="loadSpKanban()" @summary="spQuoteSummary = $event" @files-changed="$refs.spDealFiles?.load()"></app-quote-requests>
          </div>

          <!-- ═══ แท็บ ไฟล์ ═══ ไฟล์แนบของดีล + ประเภท + หมายเหตุ (2026-10-20) — ผูกด้วย id ดีล เห็นทุกสถานะ / แนบหรือลบแล้วโหลดประวัติใหม่ -->
          <div v-show="spForm.id && spFormTab === 'files'">
            <app-deal-files v-if="spForm.id" ref="spDealFiles" :pipeline-item-id="spForm.id" @count="onSpFileCount"></app-deal-files>
          </div>

          <!-- ═══ แท็บ ประวัติ ═══ -->
          <div v-show="spForm.id && spFormTab === 'history'">
            <div v-if="!spFormHistory.length" class="text-sm text-slate-400 py-6 text-center">ยังไม่มีประวัติ</div>
            <div v-for="h in spFormHistory" :key="h.id" class="flex gap-3 py-2 border-b border-slate-50">
              <div class="w-2 h-2 rounded-full bg-teal-400 shrink-0 mt-1.5"></div>
              <div class="flex-1">
                <div class="text-xs text-slate-700 font-semibold">{{ h.changed_by_name }}</div>
                <div class="text-xs text-slate-500 flex items-center gap-1 flex-wrap mt-0.5">
                  <span v-if="h.old_stage && h.old_stage !== h.new_stage" class="inline-flex items-center px-1.5 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-500">{{ spStageLabel(h.old_stage, spForm.source_type) }}</span>
                  <span v-if="h.old_stage && h.old_stage !== h.new_stage">→</span>
                  <span class="inline-flex items-center px-1.5 py-0.5 rounded-full text-[10px] font-bold" :style="spStageClass(h.new_stage)">{{ spStageLabel(h.new_stage, spForm.source_type) }}</span>
                  <span v-if="h.note" class="text-slate-400">· {{ h.note }}</span>
                </div>
                <!-- ผลแพ้/ชนะที่เก็บไว้ในประวัติ ณ ตอนบันทึกผล — ดูย้อนหลังได้แม้งานถูกย้ายกลับแล้ว (ยืนยันจากผู้ใช้ 2026-09-25) -->
                <div v-if="h.win_loss_reason_name" class="text-xs text-slate-600 mt-0.5">
                  เหตุผล: {{ h.win_loss_reason_name }}<span v-if="h.win_loss_note"> — {{ h.win_loss_note }}</span>
                  <span v-if="h.winner_name"> · แพ้ให้ {{ h.winner_name }}<span v-if="Number(h.winning_price)"> ({{ formatPrice(h.winning_price) }})</span></span>
                </div>
                <div class="text-[11px] text-slate-400 mt-0.5">{{ formatDateTimeThai(h.changed_at) }}</div>
              </div>
            </div>
          </div>
        </div>
        <!-- แท็บใบเสนอราคา / ไฟล์ / ประวัติ บันทึกทันทีในแท็บ — ไม่มีปุ่มบันทึกรวม มีแค่ [ปิด] (แบบ Salesforce Record Page — ยืนยันจากผู้ใช้ 2026-10-30)
             เดิมปุ่ม "บันทึกการแก้ไข" ขึ้นทุกแท็บ Sale ขอใบเสนอราคาแล้วกดบันทึกปิดท้าย → ค่าเก่าในฟอร์มทับมูลค่าที่ระบบเพิ่งอัปเดต (PJ-261027-002) -->
        <div v-if="spForm.id && spFormTab !== 'deal'" class="px-5 py-4 border-t border-slate-100 flex items-center justify-end gap-2 flex-wrap">
          <template v-if="spFormDirty && !isViewer">
            <span class="mr-auto text-sm text-amber-700 font-semibold">⚠ มีการแก้ไขในแท็บรายละเอียดดีลที่ยังไม่บันทึก</span>
            <button class="inline-flex items-center px-4 py-2.5 rounded-xl text-[.95rem] font-semibold bg-white ring-1 ring-amber-300 text-amber-800 hover:bg-amber-50 border-0 cursor-pointer min-h-[44px]" @click="spFormTab = 'deal'">กลับไปบันทึก</button>
          </template>
          <button class="inline-flex items-center px-6 py-2.5 rounded-xl text-[.95rem] font-bold border-0 cursor-pointer min-h-[44px]"
            :class="spFormDirty && !isViewer ? 'bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50' : 'bg-teal-700 hover:bg-teal-800 text-white'" @click="closeModal">ปิด</button>
        </div>
        <div v-else class="px-3 sm:px-5 py-3 sm:py-4 border-t border-slate-100 flex items-center justify-end gap-2">
          <button class="inline-flex items-center px-4 py-2.5 rounded-xl text-[.95rem] font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer min-h-[44px] disabled:cursor-default disabled:hover:bg-white" :disabled="spFormSaving" @click="closeModal">ยกเลิก</button>
          <span v-if="isViewer" class="mr-auto text-sm text-violet-700 font-semibold">👁 ดูอย่างเดียว — แก้ไขไม่ได้</span>
          <button v-if="!spForm.id && spWizardStep > 1" type="button" class="inline-flex items-center px-4 py-2.5 rounded-xl text-[.95rem] font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer min-h-[44px]" @click="spWizardGo(spWizardStep - 1)">ย้อนกลับ</button>
          <button v-if="!spForm.id && spWizardStep < 9 && !isViewer" type="button" class="inline-flex items-center px-6 py-2.5 rounded-xl text-[.95rem] font-bold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer min-h-[44px]" @click="spWizardNext">ถัดไป</button>
          <!-- ล็อกปุ่มระหว่างบันทึก กันกดซ้ำแล้วได้ดีล 2 รายการ + วงกลมหมุน (2026-10-23) -->
          <button v-if="!isViewer && (spForm.id || spWizardStep === 9)" class="inline-flex items-center px-6 py-2.5 rounded-xl text-[.95rem] font-bold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer min-h-[44px] disabled:cursor-default disabled:hover:bg-teal-700 gap-2" :disabled="spFormSaving" @click="submitSpForm">
            <span v-if="spFormSaving" class="w-4 h-4 rounded-full border-2 border-white/40 border-t-white animate-spin" aria-hidden="true"></span>
            {{ spFormSaving ? 'กำลังบันทึก…' : (spForm.id ? 'บันทึกการแก้ไข' : 'สร้างงาน/ดีลใหม่') }}
          </button>
        </div>
      </div>
    </div>

    <!-- SP: Quotation Detail Modal (ใบเสนอราคาเก่าที่นำเข้ามาเป็นงานขายตรงนี้) — overlay แยกต่างหาก ไม่แตะ modal/spForm หลัก
         กันไม่ให้ข้อมูลที่แก้ไขค้างไว้ในฟอร์ม sp-form หายไปตอนเปิด/ปิด modal นี้ซ้อนขึ้นมา (z-index สูงกว่า sp-form ให้ลอยทับอยู่บนสุด) -->
    <div v-if="spQuotationModal.show" class="fixed inset-0 bg-black/50 flex items-start justify-center z-[1100] p-4 overflow-y-auto" @mousedown="backdropDown = $event.target === $event.currentTarget" @click.self="backdropDown && (closeSpQuotationModal())">
      <div class="bg-white rounded-2xl w-full max-w-[640px] shadow-2xl overflow-hidden my-8">
        <div class="bg-sky-700 text-white px-6 py-5">
          <div class="flex items-center justify-between">
            <h3 class="font-bold text-lg flex items-center flex-wrap gap-2">
              <span>รายละเอียดใบเสนอราคา {{ spQuotationModal.data.quotation_id }}<span v-if="spQuotationModal.data.reverend !== null && spQuotationModal.data.reverend !== undefined" class="text-sm font-semibold opacity-80"> (Rev {{ spQuotationModal.data.reverend }})</span></span>
              <span v-if="spQuotationModal.data.status_quotation != null" class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold" :class="quotationStatusBadge(spQuotationModal.data.status_quotation)">{{ quotationStatusLabel(spQuotationModal.data.status_quotation) }}</span>
              <span v-else class="text-xs text-white/70">-</span>
            </h3>
            <button class="text-white/80 hover:text-white bg-transparent border-0 text-2xl cursor-pointer leading-none" @click="closeSpQuotationModal">×</button>
          </div>
        </div>
        <div class="p-5 overflow-y-auto max-h-[calc(100vh-200px)]">
          <div class="mb-4 space-y-0">
            <div class="flex gap-2 py-2 border-b border-slate-50 items-center"><span class="text-sm text-slate-400 w-28 shrink-0">สถานะเปิด Order</span><span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold" :class="spQuotationModal.data.take_order_status === 'Y' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'">{{ spQuotationModal.data.take_order_status === 'Y' ? 'เปิด Order แล้ว' : 'ยังไม่เปิด Order' }}</span></div>
            <div class="flex gap-2 py-2 border-b border-slate-50"><span class="text-sm text-slate-400 w-28 shrink-0">วันที่</span><span class="text-sm text-slate-700">{{ formatDateThai(spQuotationModal.data.quotation_date) }}</span></div>
            <div class="flex gap-2 py-2 border-b border-slate-50"><span class="text-sm text-slate-400 w-28 shrink-0">ลูกค้า</span><span class="text-sm font-semibold text-slate-700">{{ spQuotationModal.data.customer_name }}</span></div>
            <div v-if="spQuotationModal.data.project_name" class="flex gap-2 py-2 border-b border-slate-50"><span class="text-sm text-slate-400 w-28 shrink-0">โครงการ</span><span class="text-sm text-slate-700">{{ spQuotationModal.data.project_name }}</span></div>
            <div class="flex gap-2 py-2 border-b border-slate-50"><span class="text-sm text-slate-400 w-28 shrink-0">พนักงานขาย</span><span class="text-sm text-slate-700">{{ spQuotationModal.data.saleman_name }}<span v-if="spQuotationModal.data.salemanid" class="text-slate-400"> ({{ spQuotationModal.data.salemanid }})</span></span></div>
            <div class="flex gap-2 py-2 border-b border-slate-50"><span class="text-sm text-slate-400 w-28 shrink-0">หมายเหตุ</span><span class="text-sm whitespace-pre-wrap break-words" :class="spQuotationModal.data.comment_header ? 'text-amber-800' : 'text-slate-300'">{{ spQuotationModal.data.comment_header || 'ไม่มี' }}</span></div>
          </div>

          <div v-if="spQuotationModal.data.items?.length" class="mb-4">
            <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2">รายการสินค้า</div>
            <div class="rounded-lg border border-slate-200 overflow-hidden">
              <table class="w-full text-sm border-collapse">
                <thead>
                  <tr class="bg-emerald-50 text-[11px] text-emerald-700">
                    <th class="text-center font-semibold px-2 py-2 w-10 border-b border-slate-200">#</th>
                    <th class="text-left font-semibold px-2 py-2 border-b border-slate-200">รายการ</th>
                    <th class="text-right font-semibold px-2 py-2 border-b border-slate-200 whitespace-nowrap">จำนวน</th>
                    <th class="text-right font-semibold px-2 py-2 border-b border-slate-200 whitespace-nowrap">ราคา/หน่วย</th>
                    <th class="text-right font-semibold px-2 py-2 border-b border-slate-200 whitespace-nowrap">รวม (บาท)</th>
                    <th class="text-right font-semibold px-2 py-2 border-b border-slate-200 whitespace-nowrap">เลขที่ Order</th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-for="(it, i) in spQuotationModal.data.items" :key="i" :class="i>0 ? 'border-t border-slate-100' : ''">
                    <td class="text-center text-slate-400 px-2 py-2 align-top">{{ i+1 }}</td>
                    <td class="text-slate-800 font-medium px-2 py-2 whitespace-pre-line align-top">{{ it.product_descp }}</td>
                    <td class="text-right text-slate-600 px-2 py-2 whitespace-nowrap align-top">{{ formatNum(it.quantity) }}{{ it.unit_name ? ' ' + it.unit_name : '' }}</td>
                    <td class="text-right text-slate-600 px-2 py-2 whitespace-nowrap align-top">{{ formatNum(it.unit_price) }}</td>
                    <td class="text-right text-slate-600 font-semibold px-2 py-2 whitespace-nowrap align-top">{{ formatNum(it.quantity * it.unit_price) }}</td>
                    <td class="text-right px-2 py-2 whitespace-nowrap align-top" :class="it.order_no ? 'text-emerald-700 font-semibold' : 'text-slate-300'">{{ it.order_no || '-' }}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
          <div v-else class="mb-4 text-sm text-slate-400">ไม่มีรายการสินค้าแนบ</div>

          <!-- ตารางสรุปยอด — ใช้ label 2 ภาษี (ไทย/อังกฤษ) ให้ตรงกับใบเสนอราคาตัวจริงเป๊ะๆ -->
          <div class="rounded-lg border border-slate-200 overflow-hidden text-sm mt-3">
            <div class="grid grid-cols-[1fr,auto,auto] gap-3 items-center px-3 py-2 border-b border-slate-100">
              <span class="text-slate-500">รวมยอดรวมทั้งสิ้น/TOTAL</span>
              <span></span>
              <span class="text-right text-slate-700 min-w-[90px]">{{ formatPrice(spQuotationModal.data.gross_amount) }}</span>
            </div>
            <div class="grid grid-cols-[1fr,auto,auto] gap-3 items-center px-3 py-2 border-b border-slate-100">
              <span class="text-slate-500">ส่วนลด/DISCOUNT</span>
              <span class="text-right text-slate-500 min-w-[46px]">{{ Number(spQuotationModal.data.discount_percent) ? formatNum(spQuotationModal.data.discount_percent) : '' }} %</span>
              <span class="text-right min-w-[90px]" :class="Number(spQuotationModal.data.discount_amount) ? 'text-rose-600' : 'text-slate-400'">{{ Number(spQuotationModal.data.discount_amount) ? '-' + formatPrice(spQuotationModal.data.discount_amount) : '- บาท' }}</span>
            </div>
            <div class="grid grid-cols-[1fr,auto,auto] gap-3 items-center px-3 py-2 border-b border-slate-100">
              <span class="text-slate-500">สุทธิ/NET</span>
              <span></span>
              <span class="text-right text-slate-700 min-w-[90px]">{{ formatPrice(spQuotationModal.data.gross_amount_net ?? spQuotationModal.data.gross_amount) }}</span>
            </div>
            <div class="grid grid-cols-[1fr,auto,auto] gap-3 items-center px-3 py-2 border-b border-slate-100">
              <span class="text-slate-500">ภาษีมูลค่าเพิ่ม/VAT</span>
              <span class="text-right text-slate-500 min-w-[46px]">{{ formatNum(spQuotationModal.data.vat_percent) }} %</span>
              <span class="text-right text-slate-700 min-w-[90px]">{{ formatPrice(spQuotationModal.data.vat_amount) }}</span>
            </div>
            <div class="grid grid-cols-[1fr,auto,auto] gap-3 items-center px-3 py-2.5 bg-emerald-50">
              <span class="font-bold text-emerald-700">จำนวนเงินสุทธิ/GRAND TOTAL</span>
              <span></span>
              <span class="text-right font-bold text-emerald-700 text-base min-w-[90px]">{{ formatPrice(spQuotationModal.data.net_amount) }}</span>
            </div>
          </div>

          <!-- ข้อมูลการดำเนินการ -->
          <div class="mt-4 pt-3 border-t border-slate-100">
            <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2">ข้อมูลการดำเนินการ</div>
            <div class="flex gap-2 py-1.5 text-xs">
              <span class="text-slate-400 w-24 shrink-0">ผู้สร้าง</span>
              <span class="text-slate-600">{{ spQuotationModal.data.created_by || '-' }}<span v-if="spQuotationModal.data.created_at" class="text-slate-400"> · {{ formatDateTimeThai(spQuotationModal.data.created_at) }}</span></span>
            </div>
            <div class="flex gap-2 py-1.5 text-xs">
              <span class="text-slate-400 w-24 shrink-0">ผู้แก้ไขล่าสุด</span>
              <span class="text-slate-600">{{ spQuotationModal.data.updated_by || '-' }}<span v-if="spQuotationModal.data.updated_at" class="text-slate-400"> · {{ formatDateTimeThai(spQuotationModal.data.updated_at) }}</span></span>
            </div>
            <div class="flex gap-2 py-1.5 text-xs">
              <span class="text-slate-400 w-24 shrink-0">ผู้อนุมัติ</span>
              <span class="text-slate-600">{{ spQuotationModal.data.approved_by || '-' }}<span v-if="spQuotationModal.data.approved_at" class="text-slate-400"> · {{ formatDateTimeThai(spQuotationModal.data.approved_at) }}</span></span>
            </div>
          </div>
        </div>
        <div class="px-5 py-4 border-t border-slate-100 flex justify-end">
          <button class="px-5 py-2 rounded-xl text-sm font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer" @click="closeSpQuotationModal">ปิด</button>
        </div>
      </div>
    </div>

    <!-- SP: ตรวจดีลย้อนหลัง (Guided review — ยืนยันจากผู้ใช้ 2026-10-01) — sale เลือกสถานะจริงตอนนี้ / ไม่ใช่งานจริง = ลบ / ไม่ใช่งานของฉัน = โอนให้ sale คนอื่นเอง -->
    <div v-if="modal.type==='sp-import-review'" class="fixed inset-0 bg-black/50 flex items-center justify-center z-[1000] p-4" @mousedown="backdropDown = $event.target === $event.currentTarget" @click.self="backdropDown && (closeModal())">
      <div class="bg-white rounded-2xl w-full max-w-[640px] shadow-2xl overflow-hidden flex flex-col" style="max-height:92vh">
        <div class="px-6 py-4 flex items-start justify-between gap-3 border-b border-slate-100">
          <div class="min-w-0">
            <h3 class="font-bold text-lg text-slate-800 m-0">ตรวจดีลย้อนหลัง</h3>
            <div class="text-sm text-slate-500 mt-1 truncate"><span class="font-mono font-bold text-purple-700">{{ modal.data.project_code }}</span><template v-if="modal.data.title"> · {{ modal.data.title }}</template></div>
          </div>
          <button class="text-slate-400 hover:text-slate-600 bg-transparent border-0 text-2xl cursor-pointer leading-none shrink-0" @click="closeModal">×</button>
        </div>
        <!-- 2 ขั้น: เลือกสถานะ → (ไม่ใช่งานของฉัน) เลือก sale ที่รับ — ปุ่มชื่อ sale แทน dropdown ที่ซ่อนอยู่ล่างจอ (ปรับตามผู้ใช้ 2026-10-01) -->
        <div class="p-5 overflow-y-auto">
          <template v-if="!spReviewTransferOpen">
            <!-- หัวข้อส่วน (ตัวหนา) + คำถาม (เทา) — ปรับตามผู้ใช้ 2026-10-01 ให้อ่านง่าย -->
            <div class="mb-2">
              <div class="text-base font-bold text-slate-800">สถานะของดีล</div>
              <div class="text-sm text-slate-500">ตอนนี้ดีลนี้อยู่สถานะไหน?</div>
            </div>
            <!-- สถานะเรียงคอลัมน์เดียวตามลำดับ stage จริง บนลงล่าง (ปรับตามผู้ใช้ 2026-10-01 — 2 คอลัมน์อ่านลำดับไม่ออก) -->
            <div class="grid grid-cols-1 gap-2">
            <button type="button" class="w-full h-full text-left px-3.5 py-2.5 rounded-xl border-2 border-slate-200 bg-white hover:border-teal-600 hover:bg-teal-50 text-base font-semibold text-slate-800 cursor-pointer disabled:opacity-50" :disabled="spImportReviewSaving" @click="spReviewChoose('Send PI')">ยังส่ง PI — รอลูกค้าตอบ<span class="block text-sm font-normal text-slate-500">สถานะเดิม ไม่เปลี่ยน</span></button>
            <button type="button" class="w-full h-full text-left px-3.5 py-2.5 rounded-xl border-2 border-slate-200 bg-white hover:border-teal-600 hover:bg-teal-50 text-base font-semibold text-slate-800 cursor-pointer disabled:opacity-50" :disabled="spImportReviewSaving" @click="spReviewChoose('Negotiating')">กำลังต่อรอง / เจรจา</button>
            <button type="button" class="w-full h-full text-left px-3.5 py-2.5 rounded-xl border-2 border-slate-200 bg-white hover:border-teal-600 hover:bg-teal-50 text-base font-semibold text-slate-800 cursor-pointer disabled:opacity-50" :disabled="spImportReviewSaving" @click="spReviewChoose('Deal Signed')">ปิดดีลได้แล้ว<span class="block text-sm font-normal text-slate-500">ต้องใส่เหตุผล</span></button>
            <button type="button" class="w-full h-full text-left px-3.5 py-2.5 rounded-xl border-2 border-slate-200 bg-white hover:border-teal-600 hover:bg-teal-50 text-base font-semibold text-slate-800 cursor-pointer disabled:opacity-50" :disabled="spImportReviewSaving" @click="spReviewChoose('Delivered')">ส่งสินค้าแล้ว<span class="block text-sm font-normal text-slate-500">ต้องใส่เหตุผล</span></button>
            <button type="button" class="w-full h-full text-left px-3.5 py-2.5 rounded-xl border-2 border-slate-200 bg-white hover:border-teal-600 hover:bg-teal-50 text-base font-semibold text-slate-800 cursor-pointer disabled:opacity-50" :disabled="spImportReviewSaving" @click="spReviewChoose('Lost')">ไม่สำเร็จ<span class="block text-sm font-normal text-slate-500">ต้องใส่เหตุผลและผู้ชนะ</span></button>
            </div>
            <!-- แยก 2 ส่วนชัดเจน: บน = สถานะของดีล / ล่าง = ดีลไม่ถูกต้อง (ปรับตามผู้ใช้ 2026-10-01 — คำว่า "หรือ" อย่างเดียวแยกไม่ออก) -->
            <div class="mt-4 pt-4 border-t-2 border-slate-200 mb-2">
              <div class="text-base font-bold text-slate-800">ดีลที่ไม่ถูกต้อง</div>
              <div class="text-sm text-slate-500">ไม่ใช่ดีลที่ต้องติดตาม — เลือกข้อนี้แทนการเลือกสถานะด้านบน</div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <button type="button" class="w-full h-full text-left px-3.5 py-2.5 rounded-xl border-2 border-slate-200 bg-white hover:border-teal-600 hover:bg-teal-50 text-base font-semibold text-slate-800 cursor-pointer disabled:opacity-50" :disabled="spImportReviewSaving" @click="spReviewChoose('delete')">ไม่ใช่งานจริง<span class="block text-sm font-normal text-slate-500">ลบดีลนี้</span></button>
            <button type="button" class="w-full h-full text-left px-3.5 py-2.5 rounded-xl border-2 border-slate-200 bg-white hover:border-teal-600 hover:bg-teal-50 text-base font-semibold text-slate-800 cursor-pointer disabled:opacity-50" :disabled="spImportReviewSaving" @click="spReviewTransferOpen = true">ไม่ใช่งานของฉัน<span class="block text-sm font-normal text-slate-500">โอนให้ Sale คนอื่น</span></button>
            </div>
          </template>
          <template v-else>
            <button type="button" @click="spReviewTransferOpen = false; spReviewTransferTo = ''" class="text-sm font-semibold text-teal-700 hover:text-teal-800 bg-transparent border-0 p-0 cursor-pointer mb-3">← กลับไปเลือกสถานะ</button>
            <div class="text-base font-bold text-slate-800 mb-2">โอนดีลนี้ให้ Sale คนไหน?</div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <button v-for="u in reviewSales.filter(u => Number(u.id) !== Number(modal.data.sale_id))" :key="u.id" type="button" @click="spReviewTransferTo = u.id"
                class="flex items-center gap-2 text-left px-3.5 py-2.5 rounded-xl border-2 text-base font-semibold cursor-pointer"
                :class="Number(spReviewTransferTo) === Number(u.id) ? 'border-teal-600 bg-teal-50 text-teal-800' : 'border-slate-200 bg-white text-slate-800 hover:border-slate-400'">
                <img v-if="u.photo_url" :src="u.photo_url" class="w-7 h-7 rounded-full object-cover shrink-0"/>
                <span v-else class="w-7 h-7 rounded-full flex items-center justify-center text-white text-xs font-bold shrink-0" :style="{background: u.avatar_color || '#64748b'}">{{ avatarInitials(u.full_name) }}</span>
                <span class="flex-1 min-w-0 truncate">{{ u.full_name }}</span>
                <span v-if="Number(spReviewTransferTo) === Number(u.id)" class="shrink-0">✓</span>
              </button>
            </div>
            <div v-if="!reviewSales.length" class="text-sm text-slate-500">กำลังโหลดรายชื่อ Sale…</div>
            <button type="button" @click="spReviewTransfer" :disabled="!spReviewTransferTo || spImportReviewSaving"
              class="w-full mt-4 px-4 py-3 rounded-xl text-base font-bold text-white bg-teal-700 hover:bg-teal-800 border-0 cursor-pointer disabled:opacity-50">โอนดีลนี้</button>
          </template>
        </div>
        <div class="px-6 py-3 border-t border-slate-100 flex justify-end">
          <button class="px-5 py-2 rounded-xl text-sm font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer" @click="closeModal">ปิด</button>
        </div>
      </div>
    </div>

    <!-- SP: บันทึกส่งสินค้าแล้ว — ใส่วันที่ส่งจริง (ยืนยันจากผู้ใช้ 2026-10-07) ใช้แทนกล่องยืนยันเลื่อนขั้นเดิม -->
    <div v-if="modal.type==='sp-delivered'" class="fixed inset-0 bg-black/50 flex items-center justify-center z-[1000] p-4" @mousedown="backdropDown = $event.target === $event.currentTarget" @click.self="backdropDown && (closeModal())">
      <div class="bg-white rounded-2xl w-full max-w-[460px] shadow-2xl overflow-hidden">
        <div class="px-6 py-4 flex items-start justify-between gap-3 border-b border-slate-100">
          <div class="min-w-0">
            <h3 class="font-bold text-lg text-slate-800 m-0">ส่งสินค้าแล้ว</h3>
            <div class="text-sm text-slate-500 mt-1 truncate"><span class="font-mono font-bold text-purple-700">{{ modal.data.project_code }}</span><template v-if="modal.data.title"> · {{ modal.data.title }}</template></div>
          </div>
          <button class="text-slate-400 hover:text-slate-600 bg-transparent border-0 text-2xl cursor-pointer leading-none shrink-0" @click="closeModal">×</button>
        </div>
        <div class="p-5">
          <label class="block text-sm font-semibold text-slate-700 mb-1">วันที่ส่งสินค้าจริง <span class="text-red-500">*</span></label>
          <input v-model="spDeliveredForm.date" type="date" :max="todayIso()" class="w-full sm:max-w-xs border border-slate-200 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
          <div class="text-xs text-slate-500 mt-1">ตั้งต้นเป็นวันนี้ แก้เป็นวันที่ส่งของจริงได้ (ห้ามเกินวันนี้) — ยอดรายได้รายเดือนนับตามวันนี้</div>
        </div>
        <div class="px-6 py-3 border-t border-slate-100 flex justify-end gap-2">
          <button class="px-5 py-2 rounded-xl text-sm font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer" @click="closeModal">ยกเลิก</button>
          <button class="px-5 py-2 rounded-xl text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-700 border-0 cursor-pointer disabled:opacity-50" :disabled="spDeliveredForm.saving" @click="submitSpDelivered">✓ ยืนยันส่งสินค้าแล้ว</button>
        </div>
      </div>
    </div>

    <!-- SP: Win/Loss Modal -->
    <div v-if="modal.type==='sp-win-loss'" class="fixed inset-0 bg-black/50 flex items-center justify-center z-[1000] p-4" @mousedown="backdropDown = $event.target === $event.currentTarget" @click.self="backdropDown && (closeModal())">
      <div class="bg-white rounded-2xl w-full max-w-[600px] shadow-2xl flex flex-col overflow-hidden" style="max-height:92vh">
        <!-- หัวขาว + ป้ายบอกผล แบบเดียวกับ bid-pipeline.html (ปรับตามผู้ใช้ 2026-09-25) -->
        <div class="px-6 py-5 border-b border-slate-100 bg-white flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-bold"
              :class="spWinLossForm.stage==='Deal Signed' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'">
              {{ spWinLossForm.stage==='Deal Signed' ? (spWinLossForm.then_delivered ? '✓ ปิดดีลได้ — ส่งสินค้าแล้ว' : '✓ ปิดดีลได้') : '✕ ไม่สำเร็จ' }}
            </span>
            <h3 class="font-bold text-[1.1rem] m-0 text-slate-800">บันทึกผลดีล</h3>
          </div>
          <button class="text-slate-400 hover:text-slate-600 bg-transparent border-0 text-2xl cursor-pointer leading-none" @click="closeModal">×</button>
        </div>
        <div class="flex-1 overflow-y-auto p-5">
          <div class="text-base font-semibold text-slate-800 mb-4 px-3 py-3 bg-slate-50 rounded-lg">{{ spWinLossForm.title }}</div>
          <!-- ลูกค้ายังไม่มีหน้าบัญชี ERP → เตือน ไม่บล็อก (ยืนยันจากผู้ใช้ 2026-09-28) — component อยู่ใน shared/app.js -->
          <app-erp-warning v-if="spWinLossForm.stage==='Deal Signed'" :project-code="modal.data?.project_code"></app-erp-warning>
          <!-- โครงเดียวกับหน้าต่างแพ้/ชนะของงานประมูล (bid-pipeline.html): เหตุผลเป็น dropdown จาก master win_loss_reasons (applies_to = sales/both)
               + รายละเอียดต่อจากเหตุผล (บังคับเมื่อ "อื่นๆ") / Lost ต้องระบุผู้ชนะทุกครั้ง + ราคาตามเหตุผล (ยืนยันจากผู้ใช้ 2026-09-25) — API เช็คซ้ำ -->
          <div class="mb-4 p-3 rounded-xl bg-slate-50 ring-1 ring-slate-200">
            <div class="text-xs font-bold text-slate-500 mb-2">เหตุผล</div>
            <div class="mb-4">
              <label class="block text-sm font-semibold text-slate-600 mb-1">{{ spWinLossForm.stage==='Deal Signed' ? 'เหตุผลที่ปิดดีลได้' : 'เหตุผลที่ไม่สำเร็จ' }} <span class="text-red-500">*</span></label>
              <select v-model="spWinLossForm.reason" class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
                <option value="">-- เลือกเหตุผล --</option>
                <option v-for="r in (spWinLossForm.stage==='Deal Signed' ? spWonReasons : spLostReasons)" :key="r.win_loss_reason_id" :value="String(r.win_loss_reason_id)">{{ r.win_loss_reason_name }}</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-600 mb-1">รายละเอียดเพิ่มเติม <span v-if="spNoteRequired" class="text-red-500">*</span></label>
              <textarea v-model="spWinLossForm.note" rows="3" class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white resize-y"
                :placeholder="spWinLossForm.stage==='Deal Signed' ? 'เช่น จุดแข็งที่ทำให้ปิดดีลได้...' : 'เช่น สิ่งที่ควรปรับครั้งหน้า...'"></textarea>
            </div>
          </div>
          <div class="mb-3 p-3 rounded-xl bg-slate-50 ring-1 ring-slate-200" v-if="spWinLossForm.stage==='Deal Signed'">
            <div class="text-xs font-bold text-slate-500 mb-2">มูลค่า</div>
            <label class="block text-sm font-semibold text-slate-600 mb-1">มูลค่าที่ปิดได้ (บาท)</label>
            <input v-model="spWinLossForm.value" type="number" min="0" class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white" placeholder="0">
            <!-- วันที่คาดว่าจะส่งมอบ — บังคับตอนปิดดีลได้ ให้ฝ่ายจัดส่ง forecast ก่อนออก SO (Expected Delivery Date — ยืนยันจากผู้ใช้ 2026-10-07)
                 ยกเว้นเลือก "ส่งสินค้าแล้ว" (ส่งไปแล้ว) → ถามวันที่ส่งจริงแทน -->
            <template v-if="!spWinLossForm.then_delivered">
              <label class="block text-sm font-semibold text-slate-600 mb-1 mt-3">วันที่คาดว่าจะส่งมอบ <span class="text-red-500">*</span></label>
              <input v-model="spWinLossForm.expected_delivery_date" type="date" class="w-full sm:max-w-xs border border-slate-200 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
              <div class="text-xs text-slate-500 mt-1">ใส่วันโดยประมาณได้ ถ้ายังไม่แน่นอน — ฝ่ายจัดส่งใช้วางแผนล่วงหน้าก่อนออก SO</div>
            </template>
            <template v-else>
              <label class="block text-sm font-semibold text-slate-600 mb-1 mt-3">วันที่ส่งสินค้าจริง <span class="text-red-500">*</span></label>
              <input v-model="spWinLossForm.delivered_date" type="date" :max="todayIso()" class="w-full sm:max-w-xs border border-slate-200 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
              <div class="text-xs text-slate-500 mt-1">ตั้งต้นเป็นวันนี้ แก้เป็นวันที่ส่งของจริงได้ (ห้ามเกินวันนี้) — ยอดรายได้รายเดือนนับตามวันนี้</div>
            </template>
          </div>
          <!-- Lost: แพ้ให้ใคร — คู่แข่งที่ระบุไว้ในดีลนี้ขึ้นก่อน (มีโอกาสเป็นผู้ชนะมากที่สุด) ไม่มี "ไม่มีคู่แข่ง" เพราะไม่สำเร็จ = มีผู้ชนะ/ไม่ทราบ -->
          <div v-if="spWinLossForm.stage==='Lost'" class="mb-3 p-3 rounded-xl bg-slate-50 ring-1 ring-slate-200">
            <div class="text-xs font-bold text-slate-500 mb-2">ผู้ชนะและราคา</div>
            <div class="mb-3">
              <label class="block text-sm font-semibold text-slate-600 mb-1">แพ้ให้ใคร (ผู้ชนะ) <span class="text-red-500">*</span></label>
              <select v-model="spWinLossForm.winner_competitor_id" class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
                <option value="">-- เลือกผู้ชนะ --</option>
                <optgroup v-if="spWinnerOptions.inDeal.length" label="คู่แข่งที่ระบุไว้ในดีลนี้">
                  <option v-for="c in spWinnerOptions.inDeal" :key="'d'+c.competitor_id" :value="c.competitor_id">{{ c.competitor_name }}</option>
                </optgroup>
                <optgroup :label="spWinnerOptions.inDeal.length ? 'คู่แข่งอื่น' : 'รายชื่อคู่แข่ง'">
                  <option v-for="c in spWinnerOptions.others" :key="'o'+c.competitor_id" :value="c.competitor_id">{{ c.competitor_name }}</option>
                </optgroup>
              </select>
              <div class="text-xs text-slate-500 mt-1">ไม่รู้ผู้ชนะ / ไม่มีผู้ชนะ (เช่น ลูกค้ายกเลิก) / ไม่มีในรายการ ให้เลือก "ยังไม่ทราบ" — ไม่มีในรายการให้แจ้ง admin เพิ่มชื่อคู่แข่ง</div>
            </div>

   ลูกค้า = ผู้ซื้อ / ผู้จ่ายเงิน: ชื่อ → บทบาท 2 ชั้นแบบเดียวกับหน้าลูกค้า (ผู้ใช้เอง → ประเภท / คนกลาง → ประเภทคนกลาง) → ผู้ติดต่อ 1 คน
   ไม่ถามตลาด (ถามที่ดีล) / ลูกค้าปลายทางไม่ใช่ลูกค้าในทะเบียนแล้ว (ชื่อพิมพ์ที่ดีล) จึงไม่มีโหมดสร้างลูกค้าปลายทาง
   เจอชื่อซ้ำ/คล้าย: ใช้รายเดิม หรือยืนยันว่าคนละราย (API ตรวจอีกชั้น 409) / ตัวเลือกมาจาก master customer_roles — ดูธง is_intermediary ห้ามเช็กชื่อ
   @done({ account, contact }) = บันทึกหรือเลือกรายเดิมแล้ว — หน้าหลักเลือกลูกค้าให้ดีล ข้อมูลดีลที่กรอกไว้ยังอยู่ */
const SpNewCustomer = {
  props: { initialName: { type: String, default: '' }, options: { type: Object, required: true } },
  emits: ['done', 'close'],
  data() {
    return { backdropDown: false, name: this.initialName, roleKind: '', accountType: '', roleId: '', roleNote: '',
             contactName: '', contactPhone: '', dupList: null, saving: false, error: '' };
  },
  computed: {
    intermediaryRoles() { return this.options.roles.filter(r => Number(r.is_active) === 1 && Number(r.is_intermediary) === 1); },
    selfRole() { return this.options.roles.find(r => Number(r.is_active) === 1 && Number(r.is_intermediary) !== 1) || null; },
    role() { return this.options.roles.find(r => r.customer_role_id === this.roleId) || null; },
    typeOptions() { return [{ v: 'government', l: 'หน่วยงานรัฐ' }, { v: 'private', l: 'หน่วยงานเอกชน' }, { v: 'individual', l: 'บุคคลทั่วไป' }]; },
    hasExactDup() { return (this.dupList || []).some(d => d.match_type === 'exact'); },
  },
  methods: {
    setRoleKind(kind) {
      if (this.roleKind === kind) return;
      this.roleKind = kind;
      this.roleNote = '';
      this.roleId = kind === 'self' ? (this.selfRole?.customer_role_id || '') : '';
      if (kind === 'mid') this.accountType = '';
    },
    validate() {
      if (!this.name.trim()) return 'กรุณาใส่ชื่อลูกค้า';
      if (!this.roleKind) return 'กรุณาเลือกว่าลูกค้ารายนี้เป็นผู้ใช้เอง หรือเป็นคนกลาง';
      if (this.roleKind === 'self' && !this.accountType) return 'กรุณาเลือกประเภท (หน่วยงานรัฐ / หน่วยงานเอกชน / บุคคลทั่วไป)';
      if (this.roleKind === 'mid' && !this.role) return 'กรุณาเลือกประเภทคนกลาง';
      if (this.role && Number(this.role.requires_note) === 1 && !this.roleNote.trim()) return `กรุณาพิมพ์ระบุ "${this.role.customer_role_name}"`;
      if (!this.contactName.trim()) return 'กรุณากรอกชื่อผู้ติดต่อ';
      const phoneProblem = SharedMethods.phoneInputProblem(this.contactPhone);
      return phoneProblem ? 'เบอร์โทร: ' + phoneProblem : '';
    },
    async save(confirmNotDuplicate) {
      this.error = this.validate();
      if (this.error) return;
      const name = this.name.trim();
      this.saving = true;
      if (!confirmNotDuplicate) {
        const dup = await apiCall('GET', 'api/accounts.php?action=check_duplicate&q=' + encodeURIComponent(name));
        if (dup.success && dup.data.length) { this.dupList = dup.data; this.saving = false; return; }
      }
      // คนกลางไม่ถามประเภท — API บันทึก private ให้เอง
      const res = await apiCall('POST', 'api/accounts.php?action=create', {
        name, account_type: this.roleKind === 'self' ? this.accountType : 'private', customer_role_id: this.roleId, customer_role_note: this.roleNote.trim(),
        confirm_not_duplicate: !!confirmNotDuplicate });
      if (!res.success && res.data?.duplicates) { this.dupList = res.data.duplicates; this.saving = false; return; }
      if (!res.success) { this.error = res.message || 'สร้างลูกค้าไม่สำเร็จ'; this.saving = false; return; }
      let contact = null;
      const fullName = this.contactName.trim(), phone = this.contactPhone.trim();
      const c = await apiCall('POST', 'api/contacts.php?action=create', { account_id: res.data.id, full_name: fullName, phone });
      if (c.success) contact = { id: c.data.id, full_name: fullName, phone: phone.replace(/[^0-9+]/g, ''), position: '' };
      this.saving = false;
      this.$emit('done', { account: res.data, contact });
    },
  },
  template: `
<div class="fixed inset-0 bg-black/50 flex items-stretch sm:items-center justify-center z-[1100] p-0 sm:p-4" @mousedown="backdropDown = $event.target === $event.currentTarget" @click.self="backdropDown && ($emit('close'))">
  <div class="bg-white sm:rounded-2xl w-full h-full sm:h-auto max-w-lg shadow-2xl flex flex-col sm:max-h-[92vh]">
    <div class="px-4 sm:px-5 py-3 sm:py-4 border-b border-slate-100">
      <h3 class="text-lg font-bold text-slate-800 m-0">สร้างลูกค้าใหม่</h3>
    </div>
    <div class="p-3 sm:p-5 overflow-y-auto flex-1 space-y-3">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">ชื่อลูกค้า (ผู้ซื้อ / ผู้จ่ายเงิน) <span class="text-red-500">*</span></label>
        <input v-model="name" @input="dupList = null" placeholder="ชื่อหน่วยงาน / บริษัท / บุคคล" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100 bg-white">
      </div>
      <div class="rounded-xl border border-slate-200 px-4 py-3">
        <div class="text-sm font-bold text-slate-700 mb-2">บทบาทลูกค้า</div>
        <!-- หัวข้อย่อย ข้อ 1 / ข้อ 2 แบบเดียวกับฟอร์มลูกค้า accounts.html (ยืนยันจากผู้ใช้ 2026-11-20) -->
        <div class="flex items-center gap-2 flex-wrap text-[.95rem] font-bold text-slate-800 mb-2"><span class="text-xs font-bold px-2 py-0.5 rounded-md border border-teal-600 text-teal-700 bg-white shrink-0">ข้อ 1</span>ลูกค้ารายนี้เป็นแบบไหน <span class="text-red-500">*</span> <span class="text-sm font-normal text-slate-500">— กดเลือก 1 ปุ่ม</span></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <button type="button" @click="setRoleKind('self')" class="border-2 rounded-xl py-2.5 px-3 text-sm font-semibold cursor-pointer transition-colors flex items-start gap-2 text-left"
            :class="roleKind === 'self' ? 'border-teal-600 bg-teal-50 text-teal-800' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-400'"><span data-radio-dot class="flex w-5 h-5 mt-px rounded-full border-2 items-center justify-center shrink-0" :class="roleKind === 'self' ? 'border-current' : 'border-slate-300'"><span v-if="roleKind === 'self'" class="w-2.5 h-2.5 rounded-full bg-current"></span></span><span data-radio-body class="flex-1 min-w-0">
            เป็นผู้ใช้เอง<span class="block text-xs font-normal">ซื้อสินค้าไปใช้เอง (ขายตรง)</span></span></button>
          <button type="button" @click="setRoleKind('mid')" class="border-2 rounded-xl py-2.5 px-3 text-sm font-semibold cursor-pointer transition-colors flex items-start gap-2 text-left"
            :class="roleKind === 'mid' ? 'border-orange-600 bg-orange-50 text-orange-800' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-400'"><span data-radio-dot class="flex w-5 h-5 mt-px rounded-full border-2 items-center justify-center shrink-0" :class="roleKind === 'mid' ? 'border-current' : 'border-slate-300'"><span v-if="roleKind === 'mid'" class="w-2.5 h-2.5 rounded-full bg-current"></span></span><span data-radio-body class="flex-1 min-w-0">
            เป็นคนกลาง<span class="block text-xs font-normal">ไม่ได้ใช้สินค้าเอง (คนกลาง)</span></span></button>
        </div>
        <div v-if="!roleKind" class="mt-3 pt-3 border-t border-dashed border-slate-300">
          <div class="flex items-center gap-2 flex-wrap text-[.95rem] font-bold text-slate-400"><span class="text-xs font-bold px-2 py-0.5 rounded-md border border-slate-300 text-slate-400 bg-white shrink-0">ข้อ 2</span>ประเภท <span class="text-sm font-normal">— เลือกข้อ 1 ก่อน</span></div>
        </div>
        <div v-if="roleKind === 'self'" class="mt-3 pt-3 border-t border-dashed border-slate-300">
          <div class="flex items-center gap-2 flex-wrap text-[.95rem] font-bold text-slate-800 mb-2"><span class="text-xs font-bold px-2 py-0.5 rounded-md border border-teal-600 text-teal-700 bg-white shrink-0">ข้อ 2</span>ประเภทของลูกค้า <span class="text-red-500">*</span> <span class="text-sm font-normal text-slate-500">— กดเลือก 1 ปุ่ม</span></div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
            <button v-for="t in typeOptions" :key="t.v" type="button" @click="accountType = t.v"
              class="border-2 rounded-xl py-2.5 px-3 text-sm font-semibold cursor-pointer transition-colors flex items-start gap-2 text-left" :class="accountType === t.v ? 'border-teal-600 bg-teal-50 text-teal-800' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-400'"><span data-radio-dot class="flex w-5 h-5 mt-px rounded-full border-2 items-center justify-center shrink-0" :class="accountType === t.v ? 'border-current' : 'border-slate-300'"><span v-if="accountType === t.v" class="w-2.5 h-2.5 rounded-full bg-current"></span></span><span data-radio-body class="flex-1 min-w-0">{{ t.l }}</span></button>
          </div>
        </div>
        <div v-if="roleKind === 'mid'" class="mt-3 pt-3 border-t border-dashed border-slate-300">
          <div class="flex items-center gap-2 flex-wrap text-[.95rem] font-bold text-slate-800 mb-2"><span class="text-xs font-bold px-2 py-0.5 rounded-md border border-teal-600 text-teal-700 bg-white shrink-0">ข้อ 2</span>ประเภทคนกลาง <span class="text-red-500">*</span> <span class="text-sm font-normal text-slate-500">— กดเลือก 1 ปุ่ม</span></div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">

              class="border-2 rounded-xl py-2.5 px-3 text-sm font-semibold cursor-pointer transition-colors flex items-start gap-2 text-left" :class="roleId === r.customer_role_id ? 'border-orange-600 bg-orange-50 text-orange-800' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-400'"><span data-radio-dot class="flex w-5 h-5 mt-px rounded-full border-2 items-center justify-center shrink-0" :class="roleId === r.customer_role_id ? 'border-current' : 'border-slate-300'"><span v-if="roleId === r.customer_role_id" class="w-2.5 h-2.5 rounded-full bg-current"></span></span><span data-radio-body class="flex-1 min-w-0">{{ r.customer_role_name }}</span></button>
          </div>
          <input v-if="role && Number(role.requires_note) === 1" v-model="roleNote" maxlength="255" class="mt-2 w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100 bg-white" placeholder="พิมพ์ระบุ เช่น บริษัทให้เช่าเฟอร์นิเจอร์">
        </div>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">ชื่อผู้ติดต่อ <span class="text-red-500">*</span></label>
          <input v-model="contactName" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100 bg-white" placeholder="เช่น คุณสมชาย">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">เบอร์โทร</label>
          <input v-model="contactPhone" type="tel" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-base sm:text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100 bg-white" placeholder="ไม่บังคับ">
        </div>
      </div>
      <p class="text-xs text-slate-500 m-0">เลขภาษี ที่อยู่ และรหัส ERP เติมภายหลังที่หน้าลูกค้า</p>
      <div v-if="dupList" class="p-3 rounded-xl ring-1 text-sm" :class="hasExactDup ? 'bg-rose-50 ring-rose-200 text-rose-800' : 'bg-amber-50 ring-amber-200 text-amber-900'">
        {{ hasExactDup ? 'มีลูกค้าชื่อนี้อยู่แล้ว สร้างซ้ำไม่ได้ — ใช้รายเดิม' : 'พบลูกค้าชื่อคล้ายกัน — เป็นรายเดียวกันหรือไม่?' }}
        <div v-for="d in dupList" :key="d.id" class="flex items-center gap-2 mt-2">
          <span class="font-mono text-xs text-teal-700 bg-white rounded px-1.5 py-0.5">{{ d.account_code }}</span>
          <span class="font-semibold text-slate-800 truncate flex-1">{{ d.name }}</span>
          <button type="button" @click="$emit('done', { account: d, contact: null })" class="shrink-0 px-3 py-1.5 rounded-lg text-sm font-bold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer">ใช้รายนี้</button>
        </div>
        <button v-if="!hasExactDup" type="button" @click="save(true)" class="mt-2 w-full py-2 rounded-lg text-sm font-semibold bg-amber-500 hover:bg-amber-600 text-white border-0 cursor-pointer">คนละราย — สร้างใหม่</button>
      </div>
      <p v-if="error" class="text-sm font-semibold text-red-600 m-0">{{ error }}</p>
    </div>
    <div class="px-5 py-4 border-t border-slate-100 flex justify-end gap-2">
      <button type="button" @click="$emit('close')" class="px-4 py-2.5 rounded-xl text-[.95rem] font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer min-h-[44px]">ยกเลิก</button>
      <button type="button" @click="save(false)" :disabled="saving" class="px-6 py-2.5 rounded-xl text-[.95rem] font-bold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer min-h-[44px] disabled:opacity-50">{{ saving ? 'กำลังบันทึก…' : 'บันทึกลูกค้า' }}</button>
    </div>
  </div>
</div>
  `,
};
