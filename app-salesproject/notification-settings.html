<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตั้งค่าการแจ้งเตือน</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="shared/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css?v=16">
</head>
<body class="bg-slate-50 font-sans">
<!-- ตั้งค่าการแจ้งเตือนรายเรื่อง (Notification Delivery Settings แบบ Salesforce — ยืนยันจากผู้ใช้ 2026-10-08) — admin เท่านั้น
     ชั้นองค์กร: เรื่องไหนส่งอีเมล / LINE (ตาราง notification_types) / ชั้นผู้ใช้: ช่องทางที่แต่ละคนรับ (หน้า users.html)
     ส่งจริงเมื่อผ่านทั้ง 2 ชั้น / กระดิ่งขึ้นเสมอ / รายชื่อเรื่องมาจากโค้ด (includes/notify_helper.php) -->
<div id="app">
  <div v-if="!authReady" class="min-h-screen flex items-center justify-center">
    <div class="spinner w-12 h-12"></div>
  </div>

  <template v-else>
    <app-nav :user="currentUser" page="notification-settings" ref="nav"></app-nav>

    <div class="md:ml-60 min-h-screen flex flex-col">
      <header class="bg-white border-b border-slate-100 px-5 py-2.5 flex items-center gap-3 shadow-sm min-h-[56px] flex-wrap">
        <h1 class="text-base font-bold text-slate-700 flex items-center gap-2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          ตั้งค่าการแจ้งเตือน
        </h1>
      </header>

      <main class="flex-1 w-full max-w-[1600px] mx-auto px-4 pb-24 pt-5 md:px-6 md:py-6">

        <!-- แท็บ: ตั้งค่าเรื่องที่แจ้งเตือน / ประวัติการส่ง (Delivery log — 2026-10-08) -->
        <div class="flex items-center gap-1.5 mb-4 flex-wrap">
          <button v-for="t in tabs" :key="t.val" type="button" @click="switchTab(t.val)"
            class="px-3.5 py-1.5 rounded-full text-sm font-semibold border-0 cursor-pointer transition-all"
            :class="tab === t.val ? 'bg-teal-700 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'">{{ t.label }}</button>
          <!-- คำอธิบายหน้านี้เปิดเป็น modal (ยืนยันจากผู้ใช้ 2026-10-10 "จะดูค่อยกดดู" — แบบเดียวกับ delivery-forecast.html / usage-report.html) -->
          <button v-if="tab === 'settings'" type="button" @click="helpOpen = true"
            class="ml-auto bg-transparent border-0 cursor-pointer text-sm text-slate-500 hover:text-teal-700 whitespace-nowrap">ⓘ ตั้งค่าหน้านี้ทำงานอย่างไร?</button>
        </div>

        <template v-if="tab === 'settings'">
        <!-- คำอธิบายหน้านี้อยู่ใน modal "ตั้งค่าหน้านี้ทำงานอย่างไร?" ท้ายหน้า (2026-10-10) -->

        <div v-if="loadError" class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100 p-6 text-sm text-red-600">{{ loadError }}</div>

        <template v-else>
          <div v-if="loading" class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100 p-10 flex justify-center"><div class="spinner w-10 h-10"></div></div>
          <template v-else>
          <!-- 1 กลุ่มผู้รับ = 1 กล่อง เว้นระยะห่างให้แยกกลุ่มชัด (ผู้ใช้ยืนยัน 2026-10-10 — แถวหัวกลุ่มในตารางเดียวอ่านแยกไม่ออก)
               ทุกเรื่องตอบ 4 คำถามเรียงเหมือนกัน: ① เหตุการณ์ที่แจ้ง → ② แจ้งใคร → ③ ส่งทางไหน → ④ การเข้าถึงลิงก์ (กดลิงก์ในข้อความแล้วต้อง login ไหม)
               (แบบ Salesforce Notification Builder / Jira Notification scheme — ยืนยันจากผู้ใช้ 2026-10-22)
               "งานเปลี่ยนสถานะใน Pipeline" เป็นเหตุการณ์หนึ่งที่มีเงื่อนไข (สถานะที่ติ๊ก) — เลือกผ่านปุ่ม [เลือกสถานะ] ไม่ใช่ตารางแยก -->
          <div class="space-y-6">
            <section v-for="g in settingGroups" :key="g.role" class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 overflow-hidden">
              <div class="px-5 py-4 border-b-2 border-slate-200 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center shrink-0">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <!-- หัวกล่อง = role จริงในระบบที่ใช้ส่ง (สีป้ายเดียวกับ role ในเมนูผู้ใช้ — shared/app.js roleBadgeCls) / ช่อง "แจ้งใคร" ในตาราง = คำอธิบาย (2026-10-22) -->
                <div>
                  <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2 flex-wrap">
                    <span class="text-sm font-semibold text-slate-500">Role ในระบบ:</span>
                    <span class="px-3 py-0.5 rounded-full text-base font-bold" :class="roleBadgeClass(g.role)">{{ g.label }}</span>
                  </h2>
                  <div v-if="g.rec" class="text-sm text-slate-500 mt-0.5">
                    ผู้ใช้ role นี้ {{ g.rec.users }} คน ·
                    <span :class="receiverLow(g.rec, g.rec.email) ? 'text-red-600 font-semibold' : ''">รับอีเมล {{ g.rec.email }}</span> ·
                    <span :class="receiverLow(g.rec, g.rec.line) ? 'text-red-600 font-semibold' : ''">รับ LINE {{ g.rec.line }}</span>
                    <button type="button" @click="memberList = { role: g.role, label: g.label, members: g.rec.members || [] }"
                      class="ml-2 bg-transparent border-0 p-0 cursor-pointer text-teal-700 font-semibold underline underline-offset-2 hover:text-teal-800">ดูรายชื่อ</button>
                  </div>
                </div>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full min-w-[880px] text-sm table-fixed">
                  <thead>
                    <tr class="bg-slate-50 text-slate-500">
                      <th rowspan="2" class="text-left font-semibold px-5 py-2.5 align-middle"><span class="inline-flex w-5 h-5 rounded-full bg-teal-50 text-teal-700 text-xs items-center justify-center mr-1">1</span>เหตุการณ์ที่แจ้ง</th>
                      <th rowspan="2" class="text-left font-semibold px-3 py-2.5 w-[160px] align-middle"><span class="inline-flex w-5 h-5 rounded-full bg-teal-50 text-teal-700 text-xs items-center justify-center mr-1">2</span>แจ้งใคร</th>
                      <th colspan="2" class="font-semibold px-2 pt-2.5 pb-1 border-b border-slate-200"><span class="inline-flex w-5 h-5 rounded-full bg-teal-50 text-teal-700 text-xs items-center justify-center mr-1">3</span>ส่งทางไหน</th>
                      <th v-if="publicViewReady" rowspan="2" class="text-left font-semibold px-3 py-2.5 w-[220px] align-middle"><span class="inline-flex w-5 h-5 rounded-full bg-teal-50 text-teal-700 text-xs items-center justify-center mr-1">4</span>การเข้าถึงลิงก์</th>
                    </tr>
                    <tr class="bg-slate-50 text-slate-500">
                      <th class="font-semibold px-2 pt-1 pb-2 w-[84px]">อีเมล</th>
                      <th class="font-semibold px-2 pt-1 pb-2 w-[84px]">LINE</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr v-for="t in g.items" :key="t.notification_type_id" class="border-t border-slate-100"
                      :class="rowChanged(t) ? 'bg-amber-50/60' : ''">
                      <!-- ① เหตุการณ์ที่แจ้ง -->
                      <td class="px-5 py-3 align-top">
                        <template v-if="stageRoleOf(t)">
                          <div class="font-semibold text-slate-700">งานเปลี่ยนสถานะใน Pipeline</div>
                          <div class="text-xs text-slate-500 mt-1 leading-relaxed">
                            <div><span class="text-slate-600 font-semibold">ขายตรง:</span> {{ stageSummary(stageRoleOf(t), 'direct') }}</div>
                            <div><span class="text-slate-600 font-semibold">ประมูล:</span> {{ stageSummary(stageRoleOf(t), 'bid') }}</div>
                          </div>
                          <button type="button" @click="openStagePicker(stageRoleOf(t))"
                            class="mt-2 px-3 py-1 rounded-lg bg-white ring-1 ring-teal-300 text-teal-700 font-semibold hover:bg-teal-50 border-0 cursor-pointer">เลือกสถานะ</button>
                        </template>
                        <template v-else>
                          <div class="font-semibold text-slate-700">{{ t.notification_type_name }}</div>
                          <div class="text-xs text-slate-500 mt-0.5 leading-relaxed">{{ t.notification_type_description }}</div>
                        </template>
                      </td>
                      <!-- ② แจ้งใคร -->
                      <!-- คำอธิบายว่าใน role ของกล่องนี้ใครได้รับ — ไม่พูดชื่อ role ซ้ำ (role จริงอยู่ที่หัวกล่อง) -->
                      <td class="px-3 py-3 align-top text-slate-600">{{ t.recipient_label || 'ทุกคนใน role นี้' }}</td>
                      <!-- ③ ส่งทางไหน (กระดิ่งในระบบขึ้นเสมอ) -->
                      <td class="px-2 py-3 text-center align-top">
                        <label v-if="!t.pseudo && Number(t.email_supported) === 1" class="inline-flex flex-col items-center gap-1 cursor-pointer select-none">
                          <input type="checkbox" v-model="t.send_email" class="w-5 h-5 accent-teal-600 cursor-pointer">
                          <span class="text-xs font-semibold" :class="t.send_email ? 'text-teal-700' : 'text-slate-400'">{{ t.send_email ? 'ส่ง' : 'ไม่ส่ง' }}</span>
                        </label>
                        <div v-else class="text-slate-400">—</div>
                      </td>
                      <td class="px-2 py-3 text-center align-top">
                        <div v-if="t.pseudo" class="text-xs text-slate-400" title="ยังไม่ได้รัน sql/add_stage_notify.sql — ใช้ค่าตั้งต้น ส่ง LINE">ส่ง<br>(ค่าตั้งต้น)</div>
                        <label v-else-if="Number(t.line_supported) === 1" class="inline-flex flex-col items-center gap-1 cursor-pointer select-none">
                          <input type="checkbox" v-model="t.send_line" class="w-5 h-5 accent-teal-600 cursor-pointer">
                          <span class="text-xs font-semibold" :class="t.send_line ? 'text-teal-700' : 'text-slate-400'">{{ t.send_line ? 'ส่ง' : 'ไม่ส่ง' }}</span>
                        </label>
                        <div v-else class="text-slate-400">—</div>
                      </td>
                      <!-- ④ กดปุ่ม "ดูรายละเอียด" ใน LINE / อีเมล แล้วต้อง login ไหม (2026-10-10) — เรื่องที่เป็นรายการหลายงานต้อง login เสมอ -->
                      <td v-if="publicViewReady" class="px-3 py-3 align-top">
                        <div v-if="!t.pseudo && !hasOutgoing(t)" class="text-xs text-slate-400 leading-snug">ไม่มีข้อความออกไป<br>(กระดิ่งอย่างเดียว)</div>
                        <select v-else-if="!t.pseudo && Number(t.public_view_supported) === 1" v-model="t.public_view"
                          class="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-sm bg-white cursor-pointer">
                          <option :value="false">ต้อง login</option>
                          <option :value="true">ไม่ต้อง login (ดูอย่างเดียว {{ publicViewDays }} วัน)</option>
                        </select>
                        <div v-else class="text-xs text-slate-500">ต้อง login</div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>
          </div>
          <p class="text-xs text-slate-500 mt-2">กระดิ่งในระบบขึ้นทุกเรื่องเสมอ · "—" = เรื่องนี้ไม่มีช่องทางนั้น</p>

          <!-- แถบบันทึกอันเดียว ท้ายทุกกลุ่ม -->
          <div class="mt-6 bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 flex items-center justify-between gap-3 flex-wrap px-5 py-4">
            <div class="text-sm text-slate-500">
              <span v-if="changedCount" class="text-amber-700 font-semibold">มีการเปลี่ยนแปลง {{ changedCount }} เรื่อง ยังไม่ได้บันทึก</span>
              <span v-else-if="lastUpdated">แก้ไขล่าสุด {{ formatDateTime(lastUpdated.updated_at) }}{{ lastUpdated.updated_by_name ? ' โดย ' + lastUpdated.updated_by_name : '' }}</span>
            </div>
            <div class="flex items-center gap-2">
              <button type="button" @click="resetChanges" :disabled="!changedCount || saving"
                class="px-4 py-2 rounded-xl text-sm font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">ยกเลิก</button>
              <button type="button" @click="saveSettings" :disabled="!changedCount || saving"
                class="px-5 py-2 rounded-xl text-sm font-semibold bg-teal-700 text-white hover:bg-teal-800 border-0 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">{{ saving ? 'กำลังบันทึก…' : 'บันทึก' }}</button>
            </div>
          </div>
          </template>
        </template>

        <p class="text-xs text-slate-400 mt-3 max-w-[860px]">ต้องการแจ้งเตือนเรื่องใหม่ (เช่น ปฏิทิน / สรุปงานทุกเช้า) ต้องเพิ่มในโปรแกรมก่อน จึงจะขึ้นในรายการนี้ · LINE OA มีโควตาข้อความต่อเดือน ควรเปิด LINE เฉพาะเรื่องที่ต้องทำทันที</p>
        </template>

        <!-- ═══ แท็บประวัติการส่ง ═══ -->
        <template v-else>
          <div v-if="histError" class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100 p-6 text-sm text-red-600">{{ histError }}</div>
          <template v-else>
            <!-- สรุป -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
              <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100 px-4 py-3">
                <div class="text-xs text-slate-500">LINE ที่ส่งแล้วเดือนนี้</div>
                <div class="text-xl font-bold text-slate-700">{{ hist.summary.line_month ?? 0 }} <span class="text-xs font-normal text-slate-400">ข้อความ</span></div>
              </div>
              <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100 px-4 py-3">
                <div class="text-xs text-slate-500">ส่งไม่สำเร็จ</div>
                <div class="text-xl font-bold" :class="hist.summary.failed ? 'text-red-600' : 'text-slate-700'">{{ hist.summary.failed ?? 0 }}</div>
              </div>
              <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100 px-4 py-3">
                <div class="text-xs text-slate-500">ไม่ได้ส่ง (ตามการตั้งค่า)</div>
                <div class="text-xl font-bold text-amber-600">{{ hist.summary.skipped ?? 0 }}</div>
              </div>
              <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100 px-4 py-3">
                <div class="text-xs text-slate-500">กดดูจาก LINE / อีเมล</div>
                <div class="text-xl font-bold text-slate-700">{{ hist.summary.clicked ?? 0 }} <span class="text-xs font-normal text-slate-400">/ {{ hist.summary.sent ?? 0 }} ที่ส่งแล้ว</span></div>
              </div>
            </div>

            <!-- ตัวกรอง -->
            <div class="flex items-center gap-2 flex-wrap mb-3">
              <select v-model="histFilter.role" @change="changeHistRole" class="border border-slate-200 rounded-xl px-3 py-2 text-sm bg-white">
                <option value="">กลุ่มผู้รับ: ทุกกลุ่ม</option>
                <option v-for="(label, role) in roleLabels" :key="role" :value="role">แจ้ง {{ label }}</option>
              </select>
              <select v-model="histFilter.user_id" @change="loadHistory" class="border border-slate-200 rounded-xl px-3 py-2 text-sm bg-white">
                <option value="">ผู้รับ: ทุกคน</option>
                <option v-for="u in histUsers" :key="u.id" :value="u.id">{{ u.full_name }}</option>
              </select>
              <select v-model="histFilter.type" @change="loadHistory" class="border border-slate-200 rounded-xl px-3 py-2 text-sm bg-white">
                <option value="">เรื่อง: ทุกเรื่อง</option>
                <optgroup v-for="g in histTypeGroups" :key="g.role" :label="'แจ้ง ' + g.label">
                  <option v-for="t in g.items" :key="t.notification_type_id" :value="t.notification_type_id">{{ t.notification_type_name }}</option>
                </optgroup>
              </select>
              <select v-model="histFilter.status" @change="loadHistory" class="border border-slate-200 rounded-xl px-3 py-2 text-sm bg-white">
                <option value="">สถานะ: ทั้งหมด</option>
                <option value="sent">ส่งแล้ว</option>
                <option value="failed">ส่งไม่สำเร็จ</option>
                <option value="skipped">ไม่ได้ส่ง</option>
                <option value="clicked">กดดูแล้ว</option>
              </select>
              <select v-model="histFilter.days" @change="loadHistory" class="border border-slate-200 rounded-xl px-3 py-2 text-sm bg-white">
                <option :value="7">7 วันล่าสุด</option>
                <option :value="30">30 วันล่าสุด</option>
                <option :value="90">90 วันล่าสุด</option>
              </select>
            </div>

            <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100 overflow-hidden">
              <div v-if="histLoading" class="p-10 flex justify-center"><div class="spinner w-10 h-10"></div></div>
              <div v-else-if="!hist.groups.length" class="p-8 text-center text-sm text-slate-400">ไม่มีประวัติการส่งในช่วงที่เลือก</div>
              <div v-else class="overflow-x-auto">
                <table class="w-full min-w-[640px] text-sm">
                  <thead>
                    <tr class="bg-slate-50 text-slate-500 text-left">
                      <th class="font-semibold px-4 py-3 w-[110px]">เวลา</th>
                      <th class="font-semibold px-3 py-3">ผู้รับ / เรื่อง</th>
                      <th class="font-semibold px-3 py-3 w-[34%]">ช่องทาง</th>
                      <th class="font-semibold px-3 py-3 w-[24%]">อ่าน / กดดู</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr v-for="g in hist.groups" :key="g.key" class="border-t border-slate-100 align-top">
                      <td class="px-4 py-3 text-xs text-slate-500 whitespace-nowrap">{{ formatDateTime(g.created_at) }}</td>
                      <td class="px-3 py-3">
                        <div class="font-semibold text-slate-700 flex items-center gap-1.5 flex-wrap">{{ g.user_name }}
                          <span v-if="roleLabels[g.user_role]" class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-slate-100 text-slate-500">{{ roleLabels[g.user_role] }}</span>
                        </div>
                        <div class="text-xs text-slate-500">{{ g.type_name }}</div>
                        <div v-if="g.body" class="text-xs text-slate-400 mt-0.5 line-clamp-2">{{ g.body }}</div>
                      </td>
                      <td class="px-3 py-3">
                        <div class="flex flex-col gap-1.5">
                          <div v-if="g.bell" class="text-xs text-slate-600">กระดิ่ง <span class="text-emerald-700 font-semibold">บันทึกแล้ว</span></div>
                          <div v-for="ch in ['line', 'email']" :key="ch">
                            <template v-if="g.channels[ch]">
                              <div class="text-xs text-slate-600 flex items-center gap-1.5">
                                {{ ch === 'line' ? 'LINE' : 'อีเมล' }}
                                <span class="px-2 py-0.5 rounded-full text-[11px] font-semibold" :class="statusClass(g.channels[ch].status)">{{ statusLabel(g.channels[ch].status) }}</span>
                              </div>
                              <div v-if="g.channels[ch].reason" class="text-xs mt-0.5"
                                :class="g.channels[ch].status === 'failed' ? 'text-red-600' : 'text-amber-700'">{{ g.channels[ch].reason }}</div>
                            </template>
                          </div>
                        </div>
                      </td>

<script src="shared/vue.global.prod.js"></script>
<script src="shared/app.js?v=101"></script>
<script>
const { createApp } = Vue;
createApp({
  components: { AppNav, AppModal },
  data() {
    return {
      authReady: false,
      currentUser: null,
      loading: false,
      saving: false,
      loadError: '',
      types: [],        // แถวที่แสดง (แก้ได้)
      original: {},     // ค่าที่บันทึกไว้ ใช้เทียบว่าเปลี่ยนอะไรบ้าง — key = notification_type_id
      receivers: null,
      publicViewReady: false,
      dealCreated: { mode: 'all', min_value: 500000 },
      stageNotify: null,          // { stages, roles } จาก API (ตารางแจ้งเมื่องานเข้าขั้น — 2026-10-22)
      memberList: null,           // หน้าต่างรายชื่อผู้ใช้ใน role { role, label, members }
      stagePicker: null,        // หน้าต่าง "เลือกขั้น" { role, label, rules: {direct, bid}, dc: {mode, min_value} }
      stageRules: {}, stageRulesOriginal: {},        // ดีลขายตรงใหม่ แบบ ก / ข (app_config — 2026-10-21)
      dealCreatedOriginal: { mode: 'all', min_value: 500000 },   // รัน sql/add_notification_public_view.sql แล้ว → แสดงคอลัมน์ "ดูโดยไม่ต้อง login" (2026-10-10)
      publicViewDays: 7,
      helpOpen: false,  // modal วิธีใช้หน้านี้ (2026-10-10)  // จำนวนผู้รับต่อกลุ่ม { sale: {label, users, email, line}, ... } (แยกตาม role 2026-10-10)
      // แท็บประวัติการส่ง (2026-10-08)
      tab: 'settings',
      tabs: [{ val: 'settings', label: 'ตั้งค่าเรื่องที่แจ้งเตือน' }, { val: 'history', label: 'ประวัติการส่ง' }],
      hist: { summary: {}, groups: [], users: [], total: 0 },
      histFilter: { role: '', user_id: '', type: '', status: '', days: 7 },
      histLoading: false,
      histError: '',
    };
  },
  computed: {
    changedCount() { return this.types.filter(t => this.isChanged(t)).length + (this.dealCreatedChanged ? 1 : 0) + (this.stageRulesChanged ? 1 : 0); },
    dealCreatedChanged() {
      const a = this.dealCreated, o = this.dealCreatedOriginal;
      return a.mode !== o.mode || (a.mode === 'value' && Number(a.min_value) !== Number(o.min_value));
    },
    // ชื่อกลุ่มผู้รับ เรียงตามลำดับจาก API (sale → ธุรการขาย → หัวหน้า)
    roleLabels() {
      return Object.fromEntries(Object.entries(this.receivers || {}).map(([role, r]) => [role, r.label]));
    },
    stageRulesChanged() { return JSON.stringify(this.stageRules) !== JSON.stringify(this.stageRulesOriginal); },
    // หน้าตั้งค่า: เรื่อง "งานเข้าขั้นที่เลือก" อยู่ในกลุ่มผู้รับของตัวเองเหมือนเรื่องอื่น (2026-10-22)
    //   ยังไม่ได้รัน sql/add_stage_notify.sql (ไม่มีแถวในตาราง) → แสดงแถวค่าตั้งต้น เลือกขั้นได้ แต่ตั้งช่องทางไม่ได้
    settingGroups() {
      const groups = this.typeGroupsAll.map(g => ({ ...g, items: [...g.items] }));
      Object.entries(this.stageNotify?.roles || {}).forEach(([role, typeId]) => {
        if (this.types.some(t => t.notification_type_id === typeId) || !this.roleLabels[role]) return;
        const pseudo = { notification_type_id: typeId, recipient: role, recipient_label: 'ทุกคนใน role นี้', pseudo: true };
        const g = groups.find(x => x.role === role);
        if (g) g.items.push(pseudo); else groups.push({ role, label: this.roleLabels[role], rec: this.receivers[role], items: [pseudo] });
      });
      return groups;
    },
    // เรื่องแจ้งเตือนแบ่งกลุ่มตามผู้รับ — เรื่องที่ไม่ระบุผู้รับไปอยู่กลุ่ม "อื่นๆ" ท้ายสุด (กันหายจากหน้าจอ)
    typeGroupsAll() {
      const groups = Object.entries(this.roleLabels).map(([role, label]) => ({
        role, label, rec: this.receivers[role], items: this.types.filter(t => t.recipient === role),
      }));
      const others = this.types.filter(t => !this.roleLabels[t.recipient]);
      if (others.length) groups.push({ role: 'other', label: 'อื่นๆ', rec: null, items: others });
      return groups.filter(g => g.items.length);
    },
    // แท็บประวัติ: รายชื่อผู้รับ / เรื่อง ตามกลุ่มผู้รับที่เลือก
    histUsers() {
      const users = this.hist.users || [];
      return this.histFilter.role ? users.filter(u => u.role === this.histFilter.role) : users;
    },
    histTypeGroups() {
      return this.histFilter.role ? this.typeGroupsAll.filter(g => g.role === this.histFilter.role) : this.typeGroupsAll;
    },
    // แถวที่แก้ไขล่าสุด (แสดงผู้แก้/เวลา)
    lastUpdated() {
      return [...this.types].sort((a, b) => String(b.updated_at).localeCompare(String(a.updated_at)))[0] || null;
    },
  },
  async mounted() {
    try {
      const res = await apiCall('GET', 'api/auth.php?action=me');
      if (!res.success) { window.location.href = 'login.html'; return; }
      this.currentUser = res.data;
      if (this.currentUser.role !== 'admin') { window.location.href = 'dashboard.html'; return; }
    } catch { window.location.href = 'login.html'; return; }
    this.authReady = true;
    await this.loadTypes();
    if (new URLSearchParams(window.location.search).get('tab') === 'history') await this.switchTab('history');
    // กันปิดหน้าโดยลืมบันทึก
    window.addEventListener('beforeunload', e => { if (this.changedCount) { e.preventDefault(); e.returnValue = ''; } });
  },
  methods: {
    ...SharedMethods,

    async switchTab(val) {
      this.tab = val;
      if (val === 'history') await this.loadHistory();
    },

    async loadHistory() {
      this.histLoading = true;
      const q = new URLSearchParams({ action: 'deliveries', ...this.histFilter });
      const res = await apiCall('GET', 'api/notification_types.php?' + q.toString());
      this.histLoading = false;
      if (!res.success) { this.histError = res.message || 'โหลดประวัติไม่สำเร็จ'; return; }
      this.histError = '';
      this.hist = res.data;
    },

    // เปลี่ยนกลุ่มผู้รับ: ล้างผู้รับ / เรื่องที่ไม่อยู่ในกลุ่มใหม่ แล้วโหลดใหม่
    async changeHistRole() {
      const role = this.histFilter.role;
      if (role && this.histFilter.user_id && !this.histUsers.some(u => String(u.id) === String(this.histFilter.user_id))) this.histFilter.user_id = '';
      if (role && this.histFilter.type && !this.types.some(t => t.notification_type_id === this.histFilter.type && t.recipient === role)) this.histFilter.type = '';
      await this.loadHistory();
    },

    // รับได้ไม่ถึงครึ่งของกลุ่ม → แสดงสีแดง
    receiverLow(rec, count) { return rec.users > 0 && count * 2 < rec.users; },

    statusLabel(st) { return { sent: 'ส่งแล้ว', failed: 'ไม่สำเร็จ', skipped: 'ไม่ได้ส่ง', pending: 'กำลังส่ง' }[st] || st; },
    statusClass(st) {
      return { sent: 'bg-emerald-50 text-emerald-700', failed: 'bg-red-50 text-red-700', skipped: 'bg-amber-50 text-amber-700', pending: 'bg-slate-100 text-slate-500' }[st] || 'bg-slate-100 text-slate-500';
    },

    async loadTypes() {
      this.loading = true;
      const res = await apiCall('GET', 'api/notification_types.php?action=list');
      this.loading = false;
      if (!res.success) { this.loadError = res.message || 'โหลดข้อมูลไม่สำเร็จ'; return; }
      this.receivers = res.data.receivers;
      this.publicViewReady = !!res.data.public_view_ready;
      this.publicViewDays = res.data.public_view_days || 7;
      if (res.data.stage_notify) {
        this.stageNotify = { stages: res.data.stage_notify.stages, roles: res.data.stage_notify.roles };
        this.stageRules = JSON.parse(JSON.stringify(res.data.stage_notify.rules));
        this.stageRulesOriginal = JSON.parse(JSON.stringify(res.data.stage_notify.rules));
      }
      if (res.data.deal_created) {
        this.dealCreated = { mode: res.data.deal_created.mode, min_value: Number(res.data.deal_created.min_value) };
        this.dealCreatedOriginal = { ...this.dealCreated };
      }
      this.types = res.data.types.map(t => ({ ...t, send_email: Number(t.send_email) === 1, send_line: Number(t.send_line) === 1, public_view: Number(t.public_view) === 1 }));
      this.original = Object.fromEntries(this.types.map(t => [t.notification_type_id, { send_email: t.send_email, send_line: t.send_line, public_view: t.public_view }]));
    },

    // ── เรื่อง "งานเข้าขั้นที่เลือก" (2026-10-22) ──
    // เรื่องนี้เป็นของกลุ่มไหน (stage_notify_manager → manager) — ไม่ใช่เรื่องเลื่อนขั้น = null
    stageRoleOf(t) {
      return Object.entries(this.stageNotify?.roles || {}).find(([, typeId]) => typeId === t.notification_type_id)?.[0] || null;
    },
    // สรุปขั้นที่ติ๊กใต้ชื่อเรื่อง เช่น "ทุกขั้น ยกเว้น รอดำเนินการ" / "ปิดดีลได้, ไม่สำเร็จ"
    stageSummary(role, kind) {
      const stages = this.stageNotify.stages[kind];
      const all = Object.keys(stages), on = this.stageRules[role]?.[kind] || [];
      const name = k => stages[k] + (kind === 'direct' && k === 'new' && this.dealCreated.mode === 'value'
        ? ` (มูลค่าตั้งแต่ ${Number(this.dealCreated.min_value).toLocaleString('th-TH')} บาท)` : '');
      if (!on.length) return 'ไม่แจ้ง';
      if (on.length === all.length) return 'ทุกสถานะ';
      const off = all.filter(k => !on.includes(k));
      if (off.length <= 2 && off.length < on.length) return 'ทุกสถานะ ยกเว้น ' + off.map(k => stages[k]).join(', ');
      return all.filter(k => on.includes(k)).map(name).join(', ');
    },
    // เปิดหน้าต่างเลือกขั้น — แก้สำเนา กดตกลงค่อยนำไปใช้ (ยังไม่บันทึกจนกดบันทึกท้ายหน้า)
    openStagePicker(role) {
      this.stagePicker = {
        role, label: this.roleLabels[role] || role,
        rules: JSON.parse(JSON.stringify(this.stageRules[role] || { direct: [], bid: [] })),
        dc: { ...this.dealCreated },
      };
    },
    togglePickerStage(kind, key) {
      const list = this.stagePicker.rules[kind];
      const next = list.includes(key) ? list.filter(k => k !== key) : [...list, key];
      // เรียงตามลำดับขั้น ให้เทียบการเปลี่ยนแปลงได้ตรง
      this.stagePicker.rules[kind] = Object.keys(this.stageNotify.stages[kind]).filter(k => next.includes(k));
    },
    // ปุ่มลัด: ทั้งหมด (ยกเว้นมอบหมายงานที่เกิดบ่อย) / เฉพาะชนะ-แพ้ (+ ยกเลิก / ไม่สำเร็จ) / ล้าง
    presetStagePicker(preset) {
      const presets = {
        all:    { direct: Object.keys(this.stageNotify.stages.direct), bid: Object.keys(this.stageNotify.stages.bid).filter(k => k !== 'รอดำเนินการ') },
        result: { direct: ['Deal Signed', 'Lost'], bid: ['ชนะการประมูล', 'แพ้การประมูล', 'ยกเลิก'] },
        none:   { direct: [], bid: [] },
      };
      this.stagePicker.rules = JSON.parse(JSON.stringify(presets[preset]));
    },
    async applyStagePicker() {
      const p = this.stagePicker;
      if (p.rules.direct.includes('new') && p.dc.mode === 'value' && !(Number(p.dc.min_value) > 0)) {
        await this.showAlert('กรุณาระบุมูลค่าขั้นต่ำของดีลใหม่', 'error'); return;
      }
      this.stageRules[p.role] = p.rules;
      if (p.rules.direct.includes('new')) this.dealCreated = { mode: p.dc.mode, min_value: Number(p.dc.min_value) };
      this.stagePicker = null;
    },
    // สีป้าย role — ชุดเดียวกับ roleBadgeCls ใน shared/app.js (AppNav)
    roleBadgeClass(role) {
      const m = { admin: 'bg-indigo-100 text-indigo-700', salesadmin: 'bg-amber-100 text-amber-700', manager: 'bg-teal-100 text-teal-700',
                  sale: 'bg-sky-100 text-sky-700', viewer: 'bg-violet-100 text-violet-700' };
      return m[role] || 'bg-slate-100 text-slate-600';
    },
    // ── หน้าต่างรายชื่อผู้ใช้ใน role ──
    channelLabel(ch) { return { line: 'LINE', email: 'อีเมล', both: 'LINE + อีเมล' }[ch] || '—'; },
    // คนนี้จะได้รับช่องทางนี้ไหม + สาเหตุ (กติกาเดียวกับตัวเลข "รับอีเมล / รับ LINE" บนหัวกล่อง)
    memberGets(m, ch) {
      const has = ch === 'line' ? m.has_line : m.has_email;
      const picked = m.notify_channel === ch || m.notify_channel === 'both';
      if (!m.notify_enabled) return { ok: false, text: has ? 'ไม่ได้ (ปิดรับ)' : (ch === 'line' ? 'ยังไม่ผูก' : 'ไม่มีอีเมล') };
      if (!has) return { ok: false, text: ch === 'line' ? 'ยังไม่ผูก LINE' : 'ไม่มีอีเมล' };
      if (!picked) return { ok: false, text: 'ไม่ได้เลือกช่องทางนี้' };
      return { ok: true, text: '✓ ได้รับ' };
    },
    // มีข้อความออกไปทางอีเมล / LINE ไหม (ไม่มี = ปุ่ม "ดูรายละเอียด" ไม่มีให้กด)
    hasOutgoing(t) {
      return (Number(t.email_supported) === 1 && t.send_email) || (Number(t.line_supported) === 1 && t.send_line);
    },
    // แถวที่มีการเปลี่ยนแปลง (ระบายสีเหลือง) — รวมขั้นที่เลือกของเรื่องเลื่อนขั้น
    rowChanged(t) {
      const role = this.stageRoleOf(t);
      if (!role) return this.isChanged(t);
      const rulesChanged = JSON.stringify(this.stageRules[role]) !== JSON.stringify(this.stageRulesOriginal[role]);
      const dcChanged = this.dealCreatedChanged && (this.stageRules[role]?.direct || []).includes('new');
      return (!t.pseudo && this.isChanged(t)) || rulesChanged || dcChanged;
    },
    isChanged(t) {
      const o = this.original[t.notification_type_id];
      return !!o && (o.send_email !== t.send_email || o.send_line !== t.send_line || o.public_view !== t.public_view);
    },

    resetChanges() {
      this.types.forEach(t => { Object.assign(t, this.original[t.notification_type_id]); });
      this.dealCreated = { ...this.dealCreatedOriginal };
      this.stageRules = JSON.parse(JSON.stringify(this.stageRulesOriginal));
    },

    // สรุปสิ่งที่เปลี่ยนให้ดูก่อนยืนยัน เช่น "ข้อความเร่งงานจากธุรการ: LINE ไม่ส่ง → ส่ง"
    async saveSettings() {
      const changed = this.types.filter(t => this.isChanged(t));
      const lines = changed.map(t => {
        const o = this.original[t.notification_type_id];
        const parts = [];
        if (o.send_email !== t.send_email) parts.push(`อีเมล ${o.send_email ? 'ส่ง' : 'ไม่ส่ง'} → ${t.send_email ? 'ส่ง' : 'ไม่ส่ง'}`);
        if (o.send_line !== t.send_line)   parts.push(`LINE ${o.send_line ? 'ส่ง' : 'ไม่ส่ง'} → ${t.send_line ? 'ส่ง' : 'ไม่ส่ง'}`);
        if (o.public_view !== t.public_view) parts.push(`การเข้าถึงลิงก์ ${o.public_view ? 'ไม่ต้อง login' : 'ต้อง login'} → ${t.public_view ? 'ไม่ต้อง login' : 'ต้อง login'}`);
        return `• ${t.notification_type_name}: ${parts.join(', ')}`;
      });
      const dcText = d => d.mode === 'value' ? `เฉพาะมูลค่าตั้งแต่ ${Number(d.min_value).toLocaleString('th-TH')} บาท` : 'ทุกดีลใหม่';
      if (this.stageRulesChanged) {
        Object.keys(this.stageRules).forEach(role => {
          const label = this.roleLabels[role] || role;
          ['direct', 'bid'].forEach(kind => {
            const before = this.stageRulesOriginal[role]?.[kind] || [], after = this.stageRules[role]?.[kind] || [];
            const added = after.filter(k => !before.includes(k)).map(k => this.stageNotify.stages[kind][k]);
            const removed = before.filter(k => !after.includes(k)).map(k => this.stageNotify.stages[kind][k]);
            if (added.length) lines.push(`• แจ้ง${label} เพิ่มสถานะ: ${added.join(', ')}`);
            if (removed.length) lines.push(`• แจ้ง${label} เลิกแจ้ง: ${removed.join(', ')}`);
          });
        });
      }
      if (this.dealCreatedChanged) {
        if (this.dealCreated.mode === 'value' && !(Number(this.dealCreated.min_value) > 0)) { await this.showAlert('กรุณาระบุมูลค่าขั้นต่ำของดีลใหม่ที่ต้องแจ้งหัวหน้า', 'error'); return; }
        lines.push(`• ดีลขายตรงใหม่ แจ้งเมื่อ: ${dcText(this.dealCreatedOriginal)} → ${dcText(this.dealCreated)}`);
      }
      const ok = await this.showConfirm('บันทึกการตั้งค่าการแจ้งเตือน?', lines.join('\n') + '\n\nมีผลกับการแจ้งเตือนครั้งถัดไปทันที', 'บันทึก');
      if (!ok) return;
      this.saving = true;
      const res = await apiCall('POST', 'api/notification_types.php?action=save', {
        items: changed.map(t => ({ notification_type_id: t.notification_type_id, send_email: t.send_email ? 1 : 0, send_line: t.send_line ? 1 : 0, public_view: t.public_view ? 1 : 0 })),
        ...(this.stageRulesChanged ? { stage_rules: this.stageRules } : {}),
        ...(this.dealCreatedChanged ? { deal_created: { mode: this.dealCreated.mode, min_value: Number(this.dealCreated.min_value) || 0 } } : {}),
      });
      this.saving = false;
      if (!res.success) { await this.showAlert(res.message || 'บันทึกไม่สำเร็จ', 'error'); return; }
      await this.loadTypes();
      await this.showAlert(res.message || 'บันทึกแล้ว', 'success');
    },
  },
}).mount('#app');
</script>
</body>
</html>
