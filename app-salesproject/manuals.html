<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คู่มือการใช้งาน</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="shared/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css?v=16">
</head>
<body class="bg-slate-50 font-sans">
<div id="app">
  <div v-if="!authReady" class="min-h-screen flex items-center justify-center">
    <div class="spinner w-12 h-12"></div>
  </div>

  <template v-else>
    <app-nav :user="currentUser" page="manuals" ref="nav"></app-nav>

    <div class="md:ml-60 min-h-screen flex flex-col">
      <header class="bg-white border-b border-slate-100 px-5 py-2.5 flex items-center gap-3 shadow-sm min-h-[56px]">
        <h1 class="text-base font-bold text-slate-700 flex items-center gap-2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 014 4v13a3 3 0 00-3-3H2z"/><path d="M22 4h-6a4 4 0 00-4 4v13a3 3 0 013-3h7z"/></svg>
          คู่มือการใช้งาน
        </h1>
      </header>

      <!-- คู่มือการใช้งานในระบบ (Help Center แบบ Salesforce Help — ยืนยันจากผู้ใช้ 2026-10-16)
           คู่มือแต่ละเรื่องเป็นหน้า manual-*.html (เนื้อหาคงที่ แก้ที่ไฟล์แล้วอัปโหลด) + PDF ใน manuals/ ไว้ส่ง LINE
           เพิ่มเรื่องใหม่ = เพิ่มรายการใน manuals ด้านล่าง + สร้างหน้า manual-*.html -->
      <main class="flex-1 w-full max-w-[960px] mx-auto px-4 pb-24 pt-5 md:px-6 md:py-6 flex flex-col gap-6">

        <!-- เริ่มต้นสำหรับ Sale ใหม่: อ่านตามลำดับ -->
        <section v-if="starterManuals.length" class="bg-teal-50 border border-teal-200 rounded-2xl p-5 flex flex-col gap-3">
          <div>
            <h2 class="text-lg font-bold text-teal-900 m-0">เริ่มต้นสำหรับ Sale ใหม่</h2>
            <p class="text-sm text-teal-800 m-0 mt-1">อ่านตามลำดับนี้ก่อนเริ่มทำงานในระบบ</p>
          </div>
          <ol class="m-0 p-0 list-none flex flex-col gap-2">
            <li v-for="(m, i) in starterManuals" :key="m.id">
              <a :href="m.href" class="flex items-center gap-3 bg-white rounded-xl ring-1 ring-teal-200 hover:ring-teal-500 px-4 py-3 no-underline">
                <span class="w-8 h-8 rounded-full bg-teal-700 text-white font-bold flex items-center justify-center shrink-0">{{ i + 1 }}</span>
                <span class="text-base font-semibold text-slate-800">{{ m.title }}</span>
                <span class="ml-auto text-teal-700 text-sm font-semibold whitespace-nowrap">อ่าน →</span>
              </a>
            </li>
          </ol>
        </section>

        <!-- ตัวกรองตามบทบาท — เริ่มที่บทบาทของผู้ใช้ -->
        <section class="flex flex-col gap-3">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-sm font-semibold text-slate-600 mr-1">คู่มือสำหรับ</span>
            <button v-for="r in roleTabs" :key="r.key" type="button" @click="roleFilter = r.key"
              class="px-4 py-2 rounded-full text-sm font-semibold border-0 cursor-pointer"
              :class="roleFilter === r.key ? 'bg-teal-700 text-white' : 'bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50'">
              {{ r.label }}
            </button>
          </div>

          <div v-if="!filteredManuals.length" class="bg-white rounded-2xl ring-1 ring-slate-200 p-8 text-center text-slate-400">
            ยังไม่มีคู่มือสำหรับบทบาทนี้
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <a v-for="m in filteredManuals" :key="m.id" :href="m.href"
              class="bg-white rounded-2xl ring-1 ring-slate-200 hover:ring-teal-500 hover:shadow-md p-5 flex flex-col gap-2 no-underline transition-shadow">
              <div class="flex items-center gap-2 flex-wrap">
                <span v-for="r in m.roles" :key="r" class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-slate-100 text-slate-600">{{ roleLabel(r) }}</span>
                <span v-if="m.isNew" class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800">ใหม่</span>
              </div>
              <h3 class="text-lg font-bold text-slate-800 m-0">{{ m.title }}</h3>
              <p class="text-sm text-slate-600 m-0 leading-relaxed">{{ m.desc }}</p>
              <div class="mt-auto pt-2 flex items-center justify-between text-xs text-slate-400">
                <span>ปรับปรุง {{ m.updated }}</span>
                <span class="text-teal-700 text-sm font-semibold">อ่านคู่มือ →</span>
              </div>
            </a>
          </div>
        </section>

        <p class="text-sm text-slate-500 m-0">ไม่เจอเรื่องที่ต้องการ หรืออ่านแล้วไม่เข้าใจ แจ้งผู้ดูแลระบบได้เลย</p>
      </main>
    </div>

    <app-modal ref="appModal"></app-modal>
  </template>
</div>

<script src="shared/vue.global.prod.js"></script>
<script src="shared/app.js?v=100"></script>
<script>
const { createApp } = Vue;
createApp({
  components: { AppNav, AppModal },
  data() {
    return {
      authReady: false,
      currentUser: null,
      roleFilter: 'all',
      roleTabs: [
        { key: 'all', label: 'ทั้งหมด' },
        { key: 'sale', label: 'Sale' },
        { key: 'salesadmin', label: 'ธุรการขาย' },
        { key: 'manager', label: 'หัวหน้า' },
      ],
      // รายการคู่มือ — starter = ลำดับในกล่อง "เริ่มต้นสำหรับ Sale ใหม่" (ไม่ใส่ = ไม่อยู่ในกล่อง)
      manuals: [
        {
          id: 'quote-request',
          title: 'ขั้นตอนออกใบเสนอราคางานโครงการ',
          desc: 'ขอใบเสนอราคาจากดีล ให้ธุรการออกหรือออกเอง แก้ไขใบ (Revision) และผลที่กลับมาที่ดีล — เริ่มใช้ 16 ต.ค. 2569',
          roles: ['sale', 'salesadmin', 'manager'],
          href: 'manual-quote-request.html',
          updated: '16 ต.ค. 2569',
          starter: 1,
          isNew: true,
        },
      ],
    };
  },
  computed: {
    filteredManuals() {
      if (this.roleFilter === 'all') return this.manuals;
      return this.manuals.filter(m => m.roles.includes(this.roleFilter));
    },
    starterManuals() {
      return this.manuals.filter(m => m.starter).sort((a, b) => a.starter - b.starter);
    },
  },
  async mounted() {
    try {
      const res = await apiCall('GET', 'api/auth.php?action=me');
      if (!res.success) { window.location.href = 'login.html'; return; }
      this.currentUser = res.data;
    } catch { window.location.href = 'login.html'; return; }
    // เปิดมาที่คู่มือของบทบาทตัวเอง (admin เห็นทั้งหมด)
    if (this.roleTabs.some(r => r.key === this.currentUser.role)) this.roleFilter = this.currentUser.role;
    this.authReady = true;
  },
  methods: {
    ...SharedMethods,

    roleLabel(role) {
      return { sale: 'Sale', salesadmin: 'ธุรการขาย', manager: 'หัวหน้า' }[role] || role;
    },
  },
}).mount('#app');
</script>
</body>
</html>
