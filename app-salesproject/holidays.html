<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>วันหยุด</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="shared/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css?v=16">
<!-- DataTables (ใช้เฉพาะหน้านี้ — jQuery plugin ควบคุมตารางแยกจาก Vue โดยเจตนา เหมือน calendars.html) -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<style>
  /* ปรับสไตล์ DataTables default ให้เข้ากับโทน Tailwind ของระบบ (rounded, teal accent) + จัด layout ให้ responsive บนมือถือ
     (DataTables ปกติใช้ float ซึ่งบิดเบี้ยวง่ายบนจอแคบ เปลี่ยนเป็น flex ที่ห่อบรรทัดได้เอง) — เหมือน calendars.html */
  #holidaysTable_wrapper { padding: 0 1rem 1rem; }
  #holidaysTable_wrapper .dataTables_length,
  #holidaysTable_wrapper .dataTables_filter { float: none; margin-bottom: .75rem; }
  #holidaysTable_wrapper .dataTables_length label,
  #holidaysTable_wrapper .dataTables_filter label { display: flex; align-items: center; gap: .5rem; margin: 0; font-size: .8125rem; color: #64748b; white-space: nowrap; }
  #holidaysTable_wrapper .dataTables_filter input { flex: 1; min-width: 0; }
  @media (min-width: 640px) {
    #holidaysTable_wrapper { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem 1.5rem; }
    #holidaysTable_wrapper .dataTables_length,
    #holidaysTable_wrapper .dataTables_filter,
    #holidaysTable_wrapper .dataTables_info,
    #holidaysTable_wrapper .dataTables_paginate { margin-bottom: 0; }
    #holidaysTable_wrapper > table { width: 100%; }
  }
  #holidaysTable_wrapper .dataTables_filter input,
  #holidaysTable_wrapper .dataTables_length select { border-radius: .5rem; border: 1px solid #e2e8f0; padding: .375rem .75rem; outline: none; }
  #holidaysTable_wrapper .dataTables_filter input:focus,
  #holidaysTable_wrapper .dataTables_length select:focus { border-color: #2dd4bf; box-shadow: 0 0 0 2px #ccfbf1; }
  #holidaysTable_wrapper .dataTables_info { font-size: .8125rem; color: #94a3b8; }
  #holidaysTable_wrapper .dataTables_paginate { display: flex; gap: .25rem; flex-wrap: wrap; }
  #holidaysTable_wrapper .dataTables_paginate .paginate_button.current { background: #0f766e !important; color: #fff !important; border-radius: .375rem; border: none !important; }
  #holidaysTable_wrapper .dataTables_paginate .paginate_button { border-radius: .375rem; padding: .25rem .6rem; }
  #holidaysTable thead th { background: #f8fafc; }
</style>
</head>
<body class="bg-slate-50 font-sans">
<div id="app">
  <div v-if="!authReady" class="min-h-screen flex items-center justify-center">
    <div class="spinner w-12 h-12"></div>
  </div>

  <template v-else>
    <app-nav :user="currentUser" page="holidays" ref="nav"></app-nav>

    <div class="min-h-screen flex flex-col">
      <header class="bg-white border-b border-slate-100 px-5 py-3 flex items-center gap-3 shadow-sm flex-wrap min-h-[64px]">
        <h1 class="text-base font-bold text-slate-700 flex items-center gap-2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          วันหยุด
        </h1>
      </header>

      <main class="flex-1 w-full max-w-[1600px] mx-auto px-4 pb-24 pt-5 md:px-6 md:py-6">

        <p class="max-w-[720px] text-xs text-slate-400 mb-4">วันหยุดของแต่ละปฏิทินแยกกัน — ถ้ายังไม่ได้ตั้งปฏิทิน (วันทำงาน) ให้ไปที่หน้า <a href="calendars.html" class="text-teal-700 hover:underline font-semibold">ปฏิทินการทำงาน</a> ก่อน</p>

        <!-- Card บอกว่ากำลังกรองดูวันหยุดของปฏิทินไหนอยู่ — โผล่เฉพาะตอนมาจากปุ่ม "วันหยุด" ในหน้า calendars.html (?calendar=CODE) -->
        <div v-if="filterCalendar" class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100 p-4 mb-4 flex items-center gap-3 flex-wrap">
          <div class="w-10 h-10 rounded-xl bg-teal-50 text-teal-700 flex items-center justify-center shrink-0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </div>
          <div class="min-w-0">
            <div class="text-xs text-slate-400">กำลังดูวันหยุดของปฏิทิน</div>
            <div class="font-bold text-slate-700 truncate">{{ filterCalendar.name }} <span class="font-mono text-xs text-slate-400 font-normal">({{ filterCalendar.code }})</span></div>
            <div class="flex gap-1 flex-wrap mt-1">
              <span v-for="d in workDayLabels(filterCalendar.work_days)" :key="d"
                class="inline-block text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-teal-50 text-teal-700">{{ d }}</span>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100">
          <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100 gap-3 flex-wrap">
            <span class="font-bold text-slate-700 flex items-center gap-2">
              <span class="w-8 h-8 rounded-lg bg-teal-50 text-teal-700 flex items-center justify-center shrink-0">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="9" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
              </span>
              {{ filterCalendar ? `วันหยุดพิเศษของ${filterCalendar.name}` : 'วันหยุดพิเศษทุกปฏิทิน' }}
              <span class="text-xs font-semibold text-teal-700 bg-teal-50 rounded-full px-2 py-0.5">{{ holidaysList.length }} วัน</span>
            </span>
            <div class="flex items-center gap-2">
              <button @click="exportHolidays"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Export Excel
              </button>
              <button @click="openAddModal"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer">
                + เพิ่มวันหยุด
              </button>
            </div>
          </div>

          <div v-if="loading" class="flex flex-col items-center justify-center py-12 text-slate-400">
            <div class="spinner w-8 h-8 mx-auto"></div>
          </div>
          <div v-show="!loading" class="p-4 overflow-x-auto">
            <!-- ตารางนี้ DataTables (jQuery) เป็นผู้คุมทั้งหมด — Vue แค่วางโครง <table> เปล่าไว้ให้ ไม่มี v-for/v-if ควบคุมแถวเลย
                 กันชนกัน: ห้ามใส่ v-for ในนี้เด็ดขาด เพราะ DataTables จะ manipulate DOM ตรงนี้เองหลัง initDataTable() ทำงาน -->
            <table id="holidaysTable" class="display w-full min-w-[480px] text-sm"></table>
          </div>
        </div>
      </main>
    </div>

    <app-modal ref="appModal"></app-modal>

    <!-- MODAL: เพิ่ม/แก้ไขวันหยุด -->
    <div class="fixed inset-0 bg-black/50 flex items-start justify-center z-[1000] p-4 overflow-y-auto"
      v-if="modal.type" @click.self="closeModal">
      <div v-if="modal.type==='holiday'" class="bg-white rounded-2xl w-full max-w-[520px] shadow-2xl overflow-hidden my-8">
        <div class="bg-teal-600 text-white px-6 py-5 flex items-center justify-between">
          <h3 class="font-bold text-lg">{{ holidayForm.editing ? 'แก้ไขวันหยุด' : 'เพิ่มวันหยุด' }}</h3>
          <button class="text-white/80 hover:text-white bg-transparent border-0 text-2xl cursor-pointer leading-none"
            @click="closeModal">×</button>
        </div>
        <div class="p-5 flex flex-col gap-4">
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-slate-500">ปฏิทิน</label>
            <select v-if="!holidayForm.editing" v-model.number="holidayForm.calendarId"
              class="border border-slate-200 rounded-xl px-3.5 py-2 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
              <option v-for="cal in calendarsList" :key="cal.id" :value="cal.id">{{ cal.name }}</option>
            </select>
            <div v-else class="border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm bg-slate-50 text-slate-500">{{ holidayForm.calendarName }}</div>
            <p v-if="!holidayForm.editing" class="text-xs text-slate-400">ทำทีละปฏิทิน — ถ้าวันหยุดนี้ใช้กับปฏิทินอื่นด้วย ให้เพิ่มซ้ำอีกครั้งโดยเลือกปฏิทินอื่น (ชื่อตั้งแยกกันได้)</p>
          </div>

          <div class="flex flex-col gap-2">
            <div v-for="(row, i) in holidayForm.rows" :key="i" class="flex items-center gap-2">
              <input type="date" v-model="row.date"
                class="border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
              <input type="text" v-model="row.name" placeholder="ชื่อวันหยุด เช่น วันแม่แห่งชาติ"
                class="flex-1 border border-slate-200 rounded-xl px-3.5 py-2 text-sm outline-none focus:border-teal-400 focus:ring-2 focus:ring-teal-100 bg-white">
              <button v-if="!holidayForm.editing && holidayForm.rows.length > 1" @click="holidayForm.rows.splice(i, 1)" type="button"
                class="px-2 py-1.5 border border-red-100 rounded-lg bg-white text-red-400 cursor-pointer text-sm shrink-0 hover:bg-red-50">✕</button>
            </div>
          </div>
          <button v-if="!holidayForm.editing" type="button" @click="holidayForm.rows.push({ id: null, date: '', name: '' })"
            class="text-sm text-blue-600 bg-transparent border border-dashed border-blue-200 rounded-lg px-3 py-2 cursor-pointer w-full hover:bg-blue-50 transition-colors">
            + เพิ่มแถว
          </button>
        </div>
        <div class="px-5 py-4 border-t border-slate-100 flex items-center justify-end gap-2">
          <button @click="closeModal"
            class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer">
            ยกเลิก
          </button>
          <button @click="submitHoliday" :disabled="saving"
            class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold bg-teal-700 hover:bg-teal-800 text-white border-0 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed">
            {{ saving ? 'กำลังบันทึก...' : 'บันทึก' }}
          </button>
        </div>
      </div>
    </div>
  </template>
</div>

<script src="shared/vue.global.prod.js"></script>
<script src="shared/app.js?v=33"></script>
<script>
const { createApp } = Vue;
createApp({
  components: { AppNav, AppModal },
  data() {
    return {
      authReady: false,
      currentUser: null,
      loading: false,
      saving: false,
      holidaysList: [],
      calendarsList: [],
      urlCalendarCode: null,
      modal: { type: null, data: null },
      holidayForm: { editing: false, calendarId: null, calendarName: '', rows: [{ id: null, date: '', name: '' }], originalDate: null },
    };
  },
  computed: {
    filterCalendar() {
      return this.calendarsList.find(c => c.code === this.urlCalendarCode) || null;
    },
  },
  async mounted() {
    try {
      const res = await apiCall('GET', 'api/auth.php?action=me');
      if (!res.success) { window.location.href = 'login.html'; return; }
      this.currentUser = res.data;
      if (!['admin','salesadmin'].includes(this.currentUser.role)) {
        window.location.href = 'dashboard.html'; return;
      }
    } catch { window.location.href = 'login.html'; return; }
    this.authReady = true;
    this.urlCalendarCode = new URLSearchParams(window.location.search).get('calendar') || null; // มาจากปุ่ม "วันหยุด" ใน calendars.html
    await this.$nextTick(); // รอให้ Vue วาง <table id="holidaysTable"> ลง DOM ก่อน ค่อยให้ jQuery จับ
    this.bindTableEvents();
    await this.loadCalendars();
  },
  methods: {
    ...SharedMethods,

    esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); },

    beYear(y) { return y + 543; },

    dayOf(dateStr) { return dateStr.split('-')[2]; },
    monthShort(dateStr) {
      const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
      return months[parseInt(dateStr.split('-')[1], 10) - 1] || '';
    },
    formatThaiDate(dateStr) {
      return `${this.dayOf(dateStr)} ${this.monthShort(dateStr)} ${this.beYear(parseInt(dateStr.split('-')[0], 10))}`;
    },
    // สำหรับคอลัมน์ "วันที่" ใน datatable เท่านั้น — แสดงปีตามที่เก็บจริงใน database (ค.ศ.) ไม่แปลงเป็น พ.ศ.
    formatDateCE(dateStr) {
      return `${this.dayOf(dateStr)} ${this.monthShort(dateStr)} ${parseInt(dateStr.split('-')[0], 10)}`;
    },

    /** แปลง work_days ("1,2,3,4,5") ของปฏิทิน เป็นชื่อวันย่อภาษาไทย เหมือน calendars.html */
    workDayLabels(workDays) {
      const dayNames = { 1:'จ', 2:'อ', 3:'พ', 4:'พฤ', 5:'ศ', 6:'ส', 7:'อา' };
      return (workDays || '').split(',').filter(Boolean).map(n => dayNames[n]);
    },

    /** ผูก event ปุ่มแก้ไข/ลบ "ครั้งเดียว" ตอน mounted ด้วย delegated listener บน #holidaysTable (element แม่ที่ DataTables ไม่ได้ทำลายทิ้ง)
        ไม่ต้องผูกใหม่ทุกครั้งที่ initDataTable() รัน เพราะ delegation ทำงานกับปุ่มที่ถูกสร้างใหม่ข้างในได้อัตโนมัติอยู่แล้ว */
    bindTableEvents() {
      const self = this;
      $('#holidaysTable').on('click', '.edit-hol-btn', function () {
        const h = self.holidaysList.find(x => x.id === Number($(this).data('id')));
        if (h) self.openEditModal(h);
      });
      $('#holidaysTable').on('click', '.delete-hol-btn', function () {
        const h = self.holidaysList.find(x => x.id === Number($(this).data('id')));
        if (h) self.deleteHoliday(h);
      });
    },

    /** สร้าง/รีเซ็ต DataTable ใหม่ทุกครั้งที่ holidaysList เปลี่ยน (โหลดใหม่/สลับปฏิทิน/สลับปี/เพิ่ม/แก้ไข/ลบสำเร็จ) — ใช้ destroy:true กันเวลา init ซ้ำ error
        คอลัมน์ render เป็น HTML string ล้วน เพราะ DataTables วาด DOM เอง ไม่ผ่าน Vue template */
    initDataTable() {
      const self = this;

      $('#holidaysTable').DataTable({
        data: this.holidaysList,
        destroy: true,
        autoWidth: false, // ปิดการคำนวณความกว้างเป็น px แล้ว inline ใส่ตาราง ปล่อยให้ CSS/Tailwind คุมความกว้างแทน (เหมือน calendars.html)
        order: [[0, 'asc']],
        language: {
          search: 'ค้นหา:',
          lengthMenu: 'แสดง _MENU_ รายการ',
          info: 'แสดง _START_ ถึง _END_ จาก _TOTAL_ รายการ',
          infoEmpty: 'ไม่มีข้อมูล',
          infoFiltered: '(กรองจาก _MAX_ รายการทั้งหมด)',
          zeroRecords: 'ไม่พบวันหยุดที่ตรงกับคำค้นหา',
          emptyTable: 'ยังไม่มีวันหยุดในปีนี้ — กด "+ เพิ่มวันหยุด" เพื่อเริ่มตั้งค่า',
          paginate: { previous: 'ก่อนหน้า', next: 'ถัดไป' },
        },
        columns: [
          {
            data: 'holiday_date', title: 'วันที่',
            render: (d, type) => type === 'display' ? self.esc(self.formatDateCE(d)) : d,
          },
          { data: 'name', title: 'ชื่อวันหยุด', render: d => `<span class="font-medium text-slate-800">${self.esc(d)}</span>` },
          {
            data: null, title: 'จัดการ', orderable: false, className: 'text-right',
            render: (data, type, row) => `
              <button class="edit-hol-btn inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-semibold bg-white ring-1 ring-slate-200 text-slate-600 hover:bg-slate-50 border-0 cursor-pointer" data-id="${row.id}">แก้ไข</button>
              <button class="delete-hol-btn inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-semibold bg-white ring-1 ring-rose-100 text-rose-500 hover:bg-rose-50 border-0 cursor-pointer" data-id="${row.id}">ลบ</button>
            `,
          },
        ],
      });
    },

    exportHolidays() {
      const headers = ['ปฏิทิน', 'วันที่', 'ชื่อวันหยุด'];
      // export ตามลำดับ/ตัวกรองที่ DataTables แสดงอยู่ตอนนี้ (search:'applied') ไม่ใช่ข้อมูลดิบทั้งหมดเสมอไป
      const rows = $('#holidaysTable').DataTable().rows({ search: 'applied' }).data().toArray().map(h => [
        h.calendar_name,
        this.formatThaiDate(h.holiday_date),
        h.name,
      ]);
      const suffix = this.filterCalendar ? `_${this.filterCalendar.code}` : '';
      this.exportExcel(`วันหยุดพิเศษ${suffix}`, headers, rows);
    },

    async loadCalendars() {
      const r = await apiCall('GET', 'api/calendars.php?action=list');
      this.calendarsList = r.success ? r.data : [];
      // ถ้า code จาก URL ไม่ตรงกับปฏิทินไหนเลย ให้ถือว่าไม่มีตัวกรอง แสดงทุกปฏิทินแทน
      if (this.urlCalendarCode && !this.calendarsList.some(c => c.code === this.urlCalendarCode)) {
        this.urlCalendarCode = null;
      }
      await this.loadHolidays();
    },

    async loadHolidays() {
      if (!this.calendarsList.length) return;
      this.loading = true;
      // มาจากปุ่ม "วันหยุด" ในหน้า calendars.html แล้ว (?calendar=CODE) ให้ดึงมาแค่ปฏิทินนั้นปฏิทินเดียว ไม่ใช่ดึงทุกปฏิทินมาแล้วค่อยกรองทีหลัง
      const calendars = this.urlCalendarCode
        ? this.calendarsList.filter(c => c.code === this.urlCalendarCode)
        : this.calendarsList;
      // วันหยุดผูกกับปฏิทินตรงๆ ไม่มี endpoint คืนของทุกปฏิทินพร้อมกัน — ยิงทีละปฏิทินแล้วรวมผลในฝั่ง frontend แทน
      const results = await Promise.all(calendars.map(cal =>
        apiCall('GET', `api/holidays.php?action=calendar_holidays&code=${cal.code}`)
          .then(r => (r.success ? r.data : []).map(h => ({ ...h, calendar_id: cal.id, calendar_name: cal.name })))
      ));
      this.holidaysList = results.flat().sort((a, b) => a.holiday_date.localeCompare(b.holiday_date));
      this.loading = false;
      await this.$nextTick();
      this.initDataTable();
    },

    openAddModal() {
      const defaultCal = this.filterCalendar || this.calendarsList[0];
      this.holidayForm = {
        editing: false, calendarId: defaultCal?.id ?? null, calendarName: '',
        rows: [{ id: null, date: '', name: '' }], originalDate: null,
      };
      this.modal = { type: 'holiday', data: null };
    },

    openEditModal(h) {
      this.holidayForm = {
        editing: true, calendarId: h.calendar_id, calendarName: h.calendar_name,
        rows: [{ id: h.id, date: h.holiday_date, name: h.name }], originalDate: h.holiday_date,
      };
      this.modal = { type: 'holiday', data: h };
    },

    async submitHoliday() {
      if (!this.holidayForm.calendarId) { await this.showAlert('กรุณาเลือกปฏิทิน', 'error'); return; }

      if (this.holidayForm.editing) {
        const row = this.holidayForm.rows[0];
        if (!row.date || !row.name.trim()) { await this.showAlert('กรุณาใส่วันที่และชื่อวันหยุด', 'error'); return; }

        this.saving = true;
        // ถ้าเปลี่ยนวันที่ ต้องลบแถวเดิมก่อน เพราะวันที่เป็นส่วนหนึ่งของ unique key (calendar_id + holiday_date) ไม่ใช่แค่ update ชื่อ
        if (row.date !== this.holidayForm.originalDate) {
          await apiCall('POST', 'api/holidays.php?action=delete', { id: row.id });
        }
        const res = await apiCall('POST', 'api/holidays.php?action=add', {
          calendar_id: this.holidayForm.calendarId, holiday_date: row.date, name: row.name.trim(),
        });
        this.saving = false;
        if (res.success) {
          this.closeModal();
          await this.loadHolidays();
          await this.showAlert('บันทึกวันหยุดเรียบร้อย', 'success');
        } else {
          await this.showAlert(res.message, 'error');
        }
        return;
      }

      const items = this.holidayForm.rows
        .filter(r => r.date && r.name.trim())
        .map(r => ({ holiday_date: r.date, name: r.name.trim() }));
      if (!items.length) { await this.showAlert('กรุณาใส่วันที่และชื่อวันหยุดอย่างน้อย 1 แถว', 'error'); return; }

      this.saving = true;
      const res = await apiCall('POST', 'api/holidays.php?action=bulk_add', { calendar_id: this.holidayForm.calendarId, items });
      this.saving = false;
      if (res.success) {
        this.closeModal();
        await this.loadHolidays();
        await this.showAlert(res.message, res.data?.skipped?.length ? 'error' : 'success');
      } else {
        await this.showAlert(res.message, 'error');
      }
    },

    async deleteHoliday(h) {
      const ok = await this.showConfirm('ลบวันหยุด?', `ลบ "${h.name}" ของ${h.calendar_name} (${this.formatThaiDate(h.holiday_date)}) ใช่ไหม?`, 'ลบ');
      if (!ok) return;
      const res = await apiCall('POST', 'api/holidays.php?action=delete', { id: h.id });
      if (res.success) {
        await this.loadHolidays();
        await this.showAlert('ลบวันหยุดเรียบร้อย', 'success');
      } else {
        await this.showAlert(res.message, 'error');
      }
    },
  },
}).mount('#app');
</script>
</body>
</html>
